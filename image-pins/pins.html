  <style>

    .answer-card:nth-child(4n+2){background:#ed7e39}.answer-card:nth-child(4n+3){background:#8e58be}.answer-card:nth-child(4n){background:#29a56b}.answer-card.is-drag-source{opacity:.18}.answer-card.solved{cursor:default;background:#2d9660}.answer-card.wrong{animation:wrongShake .55s ease}.answer-card.correct-pop{animation:correctPop .58s cubic-bezier(.2,1.15,.2,1)}

<body>
  <main class="page" id="page">
    <div class="theme-background" aria-hidden="true"></div>
    <img class="game-logo" src="../logo.PNG" alt="" onerror="this.style.display='none'">
    <h1 class="game-title" id="gameTitle">وضع الدبابيس بالصورة</h1>
    <div class="progress" id="progress">0/0</div>
    <section class="game-area" id="gameArea" aria-label="منطقة اللعبة">
      <div class="image-shell" id="imageShell"><img class="main-image" id="mainImage" alt="صورة النشاط"><div class="pin-layer" id="pinLayer"></div></div>
      <svg class="connector-layer" id="connectorLayer" aria-hidden="true"></svg>
      <div class="answer-layer" id="answerLayer"></div>
    </section>
    <button class="back-btn" id="backBtn" type="button">رجوع</button>
    <section class="overlay" id="startOverlay">
      <div class="overlay-card"><div class="overlay-icon" aria-hidden="true">📌</div><h2 class="overlay-title">وضع الدبابيس بالصورة</h2><p class="overlay-text">اسحب كل إجابة إلى الدبوس الصحيح على الصورة</p><div class="overlay-actions"><button class="overlay-btn" id="startBtn" type="button">تشغيل</button></div></div>
    </section>
    <section class="overlay" id="finishOverlay" hidden>
      <div class="confetti" id="confetti" aria-hidden="true"></div><div class="overlay-card"><div class="overlay-icon" aria-hidden="true">🏆</div><h2 class="overlay-title">أحسنت!</h2><p class="overlay-text">تم توصيل جميع الإجابات بالمواقع الصحيحة</p><div class="overlay-actions"><button class="overlay-btn" id="restartBtn" type="button">إعادة</button><button class="overlay-btn secondary" id="homeBtn" type="button">الصفحة الرئيسية</button></div></div>
    </section>
  </main>
  <script>
  (async()=>{
    "use strict";
    const KEY="sandooq_image_pins_payload_v1",DB_PREFIX="image-pins",MAX=24;
    const params=new URLSearchParams(location.search),payloadId=String(params.get("payloadId")||""),launch=String(params.get("launch")||"home").toLowerCase();
    const page=document.getElementById("page"),gameArea=document.getElementById("gameArea"),imageShell=document.getElementById("imageShell"),mainImage=document.getElementById("mainImage"),pinLayer=document.getElementById("pinLayer"),answerLayer=document.getElementById("answerLayer"),connectorLayer=document.getElementById("connectorLayer"),progress=document.getElementById("progress"),gameTitle=document.getElementById("gameTitle"),startOverlay=document.getElementById("startOverlay"),finishOverlay=document.getElementById("finishOverlay");
    let payload,answers=[],slots=[],slotMap=[],solved=[],cards=[],pins=[],started=false,layoutFrame=0,lineAnimation=0,activeDrag=null;
    const parse=value=>{try{return JSON.parse(value||"null")}catch(_){return null}};
    function readDb(key){if(!("indexedDB" in window))return Promise.resolve(null);return new Promise(resolve=>{const request=indexedDB.open("sandooq_edu_games_v1",1);request.onerror=()=>resolve(null);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains("payloads"))db.createObjectStore("payloads",{keyPath:"key"})};request.onsuccess=()=>{const db=request.result;try{const tx=db.transaction("payloads","readonly"),get=tx.objectStore("payloads").get(key);get.onsuccess=()=>resolve(get.result?.payload||null);get.onerror=()=>resolve(null);tx.oncomplete=tx.onerror=tx.onabort=()=>db.close()}catch(_){db.close();resolve(null)}}})}
    async function readPayload(){const stores=[sessionStorage,localStorage];if(payloadId){const exact=`${KEY}_${payloadId}`;for(const store of stores){try{const value=parse(store.getItem(exact));if(value)return value}catch(_){}}const fromDb=await readDb(`${DB_PREFIX}:${payloadId}`);if(fromDb)return fromDb;for(const store of stores){try{const value=parse(store.getItem(KEY));if(value?.payloadId===payloadId)return value}catch(_){}}const latest=await readDb(`${DB_PREFIX}:latest`);return latest?.payloadId===payloadId?latest:null}for(const store of stores){try{const value=parse(store.getItem(KEY));if(value)return value}catch(_){}}return readDb(`${DB_PREFIX}:latest`)}
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    function normalize(raw={}){const image=raw.mainImage||{},list=(Array.isArray(raw.answers)?raw.answers:Array.isArray(raw.entries)?raw.entries:[]).slice(0,MAX).map((item,index)=>({id:String(item?.id||index),contentType:item?.contentType==="image"?"image":"text",text:String(item?.text||item?.answer||""),imageData:String(item?.imageData||item?.image||""),pin:{x:clamp(Number(item?.pin?.x??item?.position?.x)||50,2,98),y:clamp(Number(item?.pin?.y??item?.position?.y)||50,2,98)}})).filter(item=>item.contentType==="image"?item.imageData:item.text.trim());return{name:String(raw.name||raw.gameName||"وضع الدبابيس بالصورة"),theme:String(raw.theme||raw.selectedTheme||params.get("theme")||"classic"),fontFamily:String(raw.fontFamily||"noto-naskh"),language:raw.contentLanguage==="en"||raw.language==="en"?"en":"ar",imageData:String(image.data||raw.imageData||""),imageWidth:Number(image.width||raw.imageWidth)||4,imageHeight:Number(image.height||raw.imageHeight)||3,answers:list}}
    function shuffle(values){const copy=values.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
    function gridRects(rect,count,preferredCols){if(count<=0)return[];let cols=Math.max(1,Math.min(count,preferredCols)),rows=Math.ceil(count/cols);const gap=clamp(Math.min(rect.w,rect.h)*.018,5,10),cellW=(rect.w-gap*(cols-1))/cols,cellH=(rect.h-gap*(rows-1))/rows;return Array.from({length:count},(_,index)=>({x:rect.x+(index%cols)*(cellW+gap),y:rect.y+Math.floor(index/cols)*(cellH+gap),w:cellW,h:cellH}))}
    function computeLayout(){const W=gameArea.clientWidth,H=gameArea.clientHeight,ratio=payload.imageWidth/payload.imageHeight,count=answers.length,pad=8,gap=clamp(W*.012,8,16);let imageRect,slotRects=[];if(ratio<.86){const bankW=clamp(W*(count>16?.25:.215),132,300),availableW=W-bankW*2-gap*2,availableH=H-pad*2,scale=Math.min(availableW/payload.imageWidth,availableH/payload.imageHeight),iw=payload.imageWidth*scale,ih=payload.imageHeight*scale;imageRect={x:(W-iw)/2,y:(H-ih)/2,w:iw,h:ih};const leftCount=Math.ceil(count/2),rightCount=count-leftCount,left={x:pad,y:pad,w:bankW-pad,h:H-pad*2},right={x:W-bankW,y:pad,w:bankW-pad,h:H-pad*2};slotRects=gridRects(left,leftCount,leftCount>7?2:1).concat(gridRects(right,rightCount,rightCount>7?2:1))}else if(ratio>1.75){const bankW=clamp(W*(count>16?.31:.25),190,430),imageAreaW=W-bankW-gap-pad*2,scale=Math.min(imageAreaW/payload.imageWidth,(H-pad*2)/payload.imageHeight),iw=payload.imageWidth*scale,ih=payload.imageHeight*scale;imageRect={x:pad+(imageAreaW-iw)/2,y:(H-ih)/2,w:iw,h:ih};const bank={x:W-bankW,y:pad,w:bankW-pad,h:H-pad*2},cols=count>16?3:count>8?2:1;slotRects=gridRects(bank,count,cols)}else{const bankH=clamp(H*(count>16?.25:.19),82,170),imageAreaH=H-bankH*2-gap*2,scale=Math.min((W-pad*2)/payload.imageWidth,imageAreaH/payload.imageHeight),iw=payload.imageWidth*scale,ih=payload.imageHeight*scale;imageRect={x:(W-iw)/2,y:(H-ih)/2,w:iw,h:ih};const topCount=Math.ceil(count/2),bottomCount=count-topCount,top={x:pad,y:pad,w:W-pad*2,h:bankH},bottom={x:pad,y:H-bankH-pad,w:W-pad*2,h:bankH};slotRects=gridRects(top,topCount,Math.ceil(topCount/2)).concat(gridRects(bottom,bottomCount,Math.ceil(bottomCount/2)))}return{imageRect,slotRects}}
    function applyLayout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{if(!answers.length)return;const result=computeLayout();slots=result.slotRects;Object.assign(imageShell.style,{left:`${result.imageRect.x}px`,top:`${result.imageRect.y}px`,width:`${result.imageRect.w}px`,height:`${result.imageRect.h}px`});cards.forEach((card,index)=>positionCard(index,false));drawLines()})}
    function positionCard(answerIndex,animate=true){const card=cards[answerIndex],slot=slots[slotMap[answerIndex]];if(!card||!slot)return;card.style.transitionDuration=animate?"":"0s";card.style.left=`${slot.x}px`;card.style.top=`${slot.y}px`;card.style.width=`${slot.w}px`;card.style.height=`${slot.h}px`;if(!animate)requestAnimationFrame(()=>card.style.transitionDuration="")}
    function createPin(answer,index){const pin=document.createElement("div");pin.className="pin";pin.textContent=String(index+1);pin.style.left=`${answer.pin.x}%`;pin.style.top=`${answer.pin.y}%`;pin.dataset.index=String(index);pinLayer.appendChild(pin);return pin}
    function createCard(answer,index){const card=document.createElement("div");card.className="answer-card";card.dataset.index=String(index);if(answer.contentType==="image"){card.classList.add("has-image");const image=document.createElement("img");image.className="answer-image";image.src=answer.imageData;image.alt=`الإجابة ${index+1}`;image.draggable=false;card.appendChild(image)}else card.textContent=answer.text;card.addEventListener("pointerdown",event=>beginDrag(event,index));answerLayer.appendChild(card);return card}
    function render(){pinLayer.textContent="";answerLayer.textContent="";connectorLayer.textContent="";cards=[];pins=[];answers.forEach((answer,index)=>{pins.push(createPin(answer,index));cards.push(createCard(answer,index))});progress.textContent=`0/${answers.length}`;applyLayout()}
    function cardCenter(answerIndex){const slot=slots[slotMap[answerIndex]];return slot?{x:slot.x+slot.w/2,y:slot.y+slot.h/2}:{x:0,y:0}}
    function pinCenter(answerIndex){const area=gameArea.getBoundingClientRect(),rect=pins[answerIndex].getBoundingClientRect();return{x:rect.left-area.left+rect.width/2,y:rect.top-area.top+rect.height/2}}
    function drawLines(){connectorLayer.setAttribute("viewBox",`0 0 ${gameArea.clientWidth} ${gameArea.clientHeight}`);connectorLayer.textContent="";answers.forEach((_,index)=>{if(!solved[index])return;const a=cardCenter(index),b=pinCenter(index),path=document.createElementNS("http://www.w3.org/2000/svg","path"),dot=document.createElementNS("http://www.w3.org/2000/svg","circle");path.setAttribute("class","connector");path.setAttribute("d",`M ${a.x} ${a.y} L ${b.x} ${b.y}`);dot.setAttribute("class","connector-dot");dot.setAttribute("cx",String(b.x));dot.setAttribute("cy",String(b.y));dot.setAttribute("r","4");connectorLayer.append(path,dot)})}
    function animateLines(duration=500){cancelAnimationFrame(lineAnimation);const start=performance.now();const tick=now=>{drawLines();if(now-start<duration)lineAnimation=requestAnimationFrame(tick)};lineAnimation=requestAnimationFrame(tick)}
    function nearestTarget(clientX,clientY){let best=-1,distance=Infinity;pins.forEach((pin,index)=>{const rect=pin.getBoundingClientRect(),dx=clientX-(rect.left+rect.width/2),dy=clientY-(rect.top+rect.height/2),d=Math.hypot(dx,dy);if(d<distance){distance=d;best=index}});return distance<=Math.max(48,innerWidth*.035)?best:-1}
    function beginDrag(event,index){if(!started||solved[index]||activeDrag)return;event.preventDefault();const source=cards[index],rect=source.getBoundingClientRect(),ghost=source.cloneNode(true);ghost.classList.add("drag-ghost");ghost.classList.remove("wrong","correct-pop","solved");ghost.style.width=`${rect.width}px`;ghost.style.height=`${rect.height}px`;ghost.style.left=`${event.clientX}px`;ghost.style.top=`${event.clientY}px`;document.body.appendChild(ghost);source.classList.add("is-drag-source");activeDrag={index,source,ghost,pointerId:event.pointerId};source.setPointerCapture?.(event.pointerId);const move=moveEvent=>{if(!activeDrag)return;moveEvent.preventDefault();ghost.style.left=`${moveEvent.clientX}px`;ghost.style.top=`${moveEvent.clientY}px`;const target=nearestTarget(moveEvent.clientX,moveEvent.clientY);pins.forEach((pin,pinIndex)=>pin.classList.toggle("target",pinIndex===target&&!solved[pinIndex]))};const end=endEvent=>{source.removeEventListener("pointermove",move);source.removeEventListener("pointerup",end);source.removeEventListener("pointercancel",end);const target=nearestTarget(endEvent.clientX,endEvent.clientY);finishDrag(index,target);ghost.remove();source.classList.remove("is-drag-source");pins.forEach(pin=>pin.classList.remove("target"));activeDrag=null};source.addEventListener("pointermove",move);source.addEventListener("pointerup",end);source.addEventListener("pointercancel",end)}
    function feedback(card,type){const mark=document.createElement("span");mark.className=type==="correct"?"feedback-check":"feedback-x";mark.textContent=type==="correct"?"✓":"×";card.appendChild(mark);setTimeout(()=>mark.remove(),760)}
    function finishDrag(index,target){if(target===index&&!solved[index]){smartPlace(index);return}const card=cards[index];card.classList.remove("wrong");void card.offsetWidth;card.classList.add("wrong");feedback(card,"wrong");setTimeout(()=>card.classList.remove("wrong"),620)}
    function smartPlace(index){const pin=pinCenter(index),currentSlot=slotMap[index];let targetSlot=currentSlot,best=Infinity;answers.forEach((_,other)=>{if(solved[other]&&other!==index)return;const candidate=slotMap[other],slot=slots[candidate];if(!slot)return;const distance=Math.hypot(slot.x+slot.w/2-pin.x,slot.y+slot.h/2-pin.y);if(distance<best){best=distance;targetSlot=candidate}});const occupant=slotMap.findIndex(slotIndex=>slotIndex===targetSlot);if(occupant>=0&&occupant!==index&&!solved[occupant]){slotMap[occupant]=currentSlot;positionCard(occupant,true)}slotMap[index]=targetSlot;solved[index]=true;cards[index].classList.add("solved","correct-pop");pins[index].classList.add("solved");positionCard(index,true);feedback(cards[index],"correct");animateLines();const done=solved.filter(Boolean).length;progress.textContent=`${done}/${answers.length}`;setTimeout(()=>cards[index].classList.remove("correct-pop"),650);if(done===answers.length)setTimeout(showFinish,850)}
    function showFinish(){finishOverlay.hidden=false;createConfetti()}
    function createConfetti(){const node=document.getElementById("confetti");node.textContent="";const colors=["#efd553","#2fa7f2","#ef5b5b","#42b979","#a86bd2"];for(let i=0;i<36;i++){const bit=document.createElement("span");bit.style.left=`${Math.random()*100}%`;bit.style.setProperty("--c",colors[i%colors.length]);bit.style.setProperty("--d",`${Math.random()*-2.6}s`);bit.style.setProperty("--x",`${(Math.random()-.5)*180}px`);node.appendChild(bit)}}
    function reset(){finishOverlay.hidden=true;solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));cards.forEach(card=>card.classList.remove("solved","wrong","correct-pop"));pins.forEach(pin=>pin.classList.remove("solved","target"));progress.textContent=`0/${answers.length}`;connectorLayer.textContent="";applyLayout()}
    function backTarget(){const requested=String(params.get("return")||"");if(launch==="test")return "../index.html#imagePinsSetup";if(requested){if(/^https?:/i.test(requested))return requested;return requested.startsWith("../")?requested:`../${requested.replace(/^\.\//,"")}`}return launch==="saved"?"../index.html#savedGames":"../index.html"}
    function collapseSafari(){if(scrollY<2)try{scrollTo(0,1)}catch(_){}}
    payload=normalize(await readPayload()||{});answers=payload.answers;if(!payload.imageData||!answers.length){startOverlay.querySelector(".overlay-title").textContent="تعذر تشغيل اللعبة";startOverlay.querySelector(".overlay-text").textContent="لم نجد الصورة أو الإجابات. ارجع إلى الإعدادات وأكمل المحتوى.";document.getElementById("startBtn").textContent="رجوع";document.getElementById("startBtn").addEventListener("click",()=>location.href=backTarget())}else{page.className=`page theme-${payload.theme}`;page.dataset.font=payload.fontFamily;page.style.setProperty("--content-direction",payload.language==="en"?"ltr":"rtl");document.documentElement.dir=payload.language==="en"?"ltr":"rtl";gameTitle.textContent=payload.name;mainImage.src=payload.imageData;mainImage.onload=()=>{if(!payload.imageWidth||payload.imageWidth===4){payload.imageWidth=mainImage.naturalWidth||4;payload.imageHeight=mainImage.naturalHeight||3}applyLayout()};solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));render();document.getElementById("startBtn").addEventListener("click",()=>{started=true;startOverlay.hidden=true;page.classList.add("started");applyLayout()})}
    document.getElementById("backBtn").addEventListener("click",()=>location.href=backTarget());document.getElementById("restartBtn").addEventListener("click",reset);document.getElementById("homeBtn").addEventListener("click",()=>location.href="../index.html");window.addEventListener("resize",applyLayout,{passive:true});window.addEventListener("orientationchange",()=>setTimeout(applyLayout,160),{passive:true});document.addEventListener("touchend",collapseSafari,{passive:true});if(window.visualViewport)window.visualViewport.addEventListener("resize",applyLayout,{passive:true});collapseSafari();
  })();
  </script>
