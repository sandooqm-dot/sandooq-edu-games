<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>توصيل الاجزاء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800&family=Noto+Kufi+Arabic:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#161616;--yellow:#f4d34f;--blue:#298fd3;--red:#ee4d58;--green:#31a867;--answer-text-color:#fff;--game-font:"Noto Naskh Arabic",Tahoma,Arial,sans-serif;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--intro-bg-final-scale:1.12}

    html,body{margin:0;width:100%;min-height:100%;background:#fff;color:var(--ink);-webkit-text-size-adjust:100%}
    body{min-height:calc(100dvh + 160px);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch}
    body::after{content:"";display:block;height:160px;pointer-events:none}
    button{font:inherit}
    .page{position:sticky;top:0;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;isolation:isolate;touch-action:none;user-select:none;background:#fff}
    .page[data-font="cairo"]{--game-font:"Cairo",Tahoma,Arial,sans-serif}.page[data-font="tajawal"]{--game-font:"Tajawal",Tahoma,Arial,sans-serif}.page[data-font="noto-kufi"]{--game-font:"Noto Kufi Arabic",Tahoma,Arial,sans-serif}.page[data-font="noto-naskh"]{--game-font:"Noto Naskh Arabic",Tahoma,serif}
    .theme-background{position:absolute;inset:0;z-index:0;background:#fff center/cover no-repeat;transform:translate3d(0,0,0) scale(1);transform-origin:center;will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none}
    .theme-classroom .theme-background{background-image:url("../theme-classroom-bg-v2.webp?v=2")}.theme-sky-clouds .theme-background{background-color:#63cef3;background-image:url("../theme-sky-clouds-bg.webp?v=45")}.theme-forest .theme-background{background-color:#7ccfef;background-image:url("../theme-forest-bg.webp?v=45")}.theme-math .theme-background{background-color:#f5f4e7;background-image:url("../theme-math-bg.webp?v=45")}.theme-english .theme-background{background-color:#72d0d2;background-image:url("../theme-english-bg.webp?v=46")}.theme-flowers .theme-background{background-color:#f8edf3;background-image:url("../theme-flowers-bg.webp?v=48")}.theme-national-day .theme-background{background-color:#165f55;background-image:url("../theme-national-day-v2-bg.webp?v=53")}.theme-founding-day .theme-background{background-color:#d7c9b1;background-image:url("../theme-founding-day-bg.webp?v=1")}
    .game-logo{position:absolute;z-index:90;top:max(5px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));width:clamp(54px,5vw,76px);height:auto;object-fit:contain}
    .game-area{position:absolute;z-index:2;inset:0;overflow:hidden;direction:ltr;opacity:0;transform:scale(.985);transition:opacity .42s ease,transform .42s ease}

    .page.intro-done .theme-background{transform:translate3d(0,0,0) scale(var(--intro-bg-final-scale))}
    .page.intro-playing .back-btn{opacity:0;pointer-events:none}

    .pin.target{transform:translate(-50%,-50%) scale(1.28);background:#fff6b8;box-shadow:0 0 0 clamp(7px,1vw,13px) rgba(244,211,79,.28),0 3px 7px rgba(0,0,0,.18)}.pin.solved{transform:translate(-50%,-50%) scale(1.08)}

    .answer-card.solved{cursor:default;filter:saturate(.94) brightness(1.02)}.answer-card.connecting{filter:brightness(1.18) saturate(.92)}.answer-card.wrong{animation:wrongShake .55s ease}.answer-card.correct-pop{animation:correctPop .58s cubic-bezier(.2,1.15,.2,1)}

    .answer-card.handle-bottom::after{left:-10px;right:-10px;top:0;bottom:clamp(-58px,-4.4vw,-42px)}.answer-card.handle-top::after{left:-10px;right:-10px;top:clamp(-58px,-4.4vw,-42px);bottom:0}
    .answer-handle{position:absolute;width:clamp(18px,1.95vw,25px);height:clamp(18px,1.95vw,25px);border:0;border-radius:50%;background:var(--card-color);box-shadow:0 2px 3px rgba(0,0,0,.12);pointer-events:auto;touch-action:none;transition:opacity .14s ease}.answer-handle::before{content:"";position:absolute;background:var(--card-color);z-index:-1;pointer-events:auto}.handle-right .answer-handle{right:clamp(-44px,-3.45vw,-30px);top:50%;transform:translateY(-50%)}.handle-right .answer-handle::before{right:100%;top:50%;width:clamp(22px,2.5vw,32px);height:clamp(4px,.48vw,7px);transform:translateY(-50%)}.handle-left .answer-handle{left:clamp(-44px,-3.45vw,-30px);top:50%;transform:translateY(-50%)}.handle-left .answer-handle::before{left:100%;top:50%;width:clamp(22px,2.5vw,32px);height:clamp(4px,.48vw,7px);transform:translateY(-50%)}.handle-bottom .answer-handle{left:50%;bottom:clamp(-44px,-3.45vw,-30px);transform:translateX(-50%)}.handle-bottom .answer-handle::before{left:50%;bottom:100%;width:clamp(4px,.48vw,7px);height:clamp(22px,2.5vw,32px);transform:translateX(-50%)}.handle-top .answer-handle{left:50%;top:clamp(-44px,-3.45vw,-30px);transform:translateX(-50%)}.handle-top .answer-handle::before{left:50%;top:100%;width:clamp(4px,.48vw,7px);height:clamp(22px,2.5vw,32px);transform:translateX(-50%)}.answer-card.solved .answer-handle{opacity:0;pointer-events:none}

    .connector-layer{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:8;pointer-events:none;overflow:visible}.connector{fill:none;stroke:#17263b;stroke-width:clamp(4px,.5vw,7px);stroke-linecap:round;filter:drop-shadow(0 3px 1px rgba(0,0,0,.16));opacity:.96}.connector.live{stroke-dasharray:none;opacity:.94}.connector-dot{stroke:transparent;stroke-width:0}
    .page[data-answer-density="medium"] .answer-card{font-size:clamp(14px,1.7vw,23px)}.page[data-answer-density="compact"] .answer-card{font-size:clamp(11px,1.25vw,17px);padding:4px}
    .back-btn{position:absolute;z-index:90;left:max(7px,var(--safe-left));bottom:max(7px,var(--safe-bottom));min-width:clamp(62px,7vw,84px);height:clamp(34px,4.6vh,41px);border:2.5px solid #111;border-radius:11px;background:var(--yellow);color:#111;font-size:clamp(13px,1.5vw,17px);font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer;transition:opacity .34s ease}.back-btn:active,.activity-overlay button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

gap:clamp(8px,1.2vw,12px);margin-top:clamp(14px,2.2vw,20px);flex-wrap:nowrap}.activity-overlay .celebration-actions button{min-width:clamp(104px,15vw,145px);height:clamp(40px,5.5vh,48px);border:3px solid #111;border-radius:15px;font-size:clamp(15px,2vw,20px);font-weight:900;line-height:1;padding-inline:clamp(12px,1.8vw,20px);box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer;white-space:nowrap}.activity-overlay .restart-btn{background:linear-gradient(180deg,#2fa7f2 0%,#1688d3 56%,#0d6fb4 100%);color:#fff}.activity-overlay .home-btn{background:linear-gradient(180deg,#ffe56d 0%,#efd553 58%,#dfc13f 100%);color:#111}.start-gate .activity-start-btn{min-width:clamp(136px,20vw,184px);font-size:clamp(16px,2.1vw,21px)}.celebration-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 18px rgba(239,213,83,.86);animation:startSpark 1.8s ease-in-out infinite;pointer-events:none;z-index:1}.spark-one{left:18%;top:26%;animation-delay:.1s}.spark-two{right:17%;top:31%;animation-delay:.55s}.spark-three{left:24%;bottom:24%;animation-delay:.85s}.spark-four{right:23%;bottom:27%;animation-delay:1.15s}
    .celebration-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:0}.celebration-confetti span{position:absolute;top:-12vh;width:clamp(8px,1.2vw,14px);height:clamp(14px,2vw,24px);border-radius:4px;background:var(--confetti-color,#efd553);opacity:0}.page.ended #finishOverlay .finish-card{animation:finishPanelIn .52s cubic-bezier(.2,.9,.2,1) both}.finish-trophy{animation:none!important;opacity:0;transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);transform-origin:center;filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.12));will-change:transform,opacity,filter}.finish-sequence-start .finish-trophy{animation:finishTrophyArrival 2.52s cubic-bezier(.16,.82,.18,1) both!important}.finish-title,.finish-subtitle{visibility:hidden;opacity:0;will-change:transform,opacity,filter}.finish-message-in .finish-title{visibility:visible;animation:finishTitleBurst .68s cubic-bezier(.16,1.22,.2,1) both}.finish-message-in .finish-subtitle{visibility:visible;animation:finishSubtitleBurst .62s cubic-bezier(.18,1.08,.2,1) both .055s}.finish-actions{visibility:hidden;opacity:0;transform:translate3d(0,28px,0) scale(.94);pointer-events:none;will-change:transform,opacity}.finish-actions-in .finish-actions{visibility:visible;pointer-events:auto;animation:finishActionsRise .62s cubic-bezier(.18,1.08,.2,1) both}.finish-confetti-on .celebration-confetti{opacity:1}.finish-confetti-on .celebration-confetti span{animation:finishConfettiBurst 2.45s cubic-bezier(.18,.72,.22,1) 1 both}.finish-confetti-on .celebration-confetti span:nth-child(3n+2){animation-delay:.055s}.finish-confetti-on .celebration-confetti span:nth-child(3n){animation-delay:.11s}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

    @keyframes feedback{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(.88)}}
    @keyframes introLogoFade{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}

}
    @media(max-width:720px){.answer-card{font-size:clamp(11px,2.4vw,16px)}.pin{width:16px;height:16px}}

<body>
  <main class="page" id="page">
    <div class="theme-background" id="themeBackground" aria-hidden="true"></div>
    <img class="game-logo" src="../logo.PNG" alt="" onerror="this.style.display='none'">
    <section class="game-area" id="gameArea" aria-label="منطقة اللعبة">
      <div class="image-shell" id="imageShell"><img class="main-image" id="mainImage" alt="صورة النشاط"><div class="pin-layer" id="pinLayer"></div></div>
      <svg class="connector-layer" id="connectorLayer" aria-hidden="true"></svg>
      <div class="answer-layer" id="answerLayer"></div>
    </section>
    <button class="back-btn" id="backBtn" type="button">رجوع</button>
    <section class="activity-overlay start-gate is-visible" id="startOverlay" aria-hidden="false">
      <div class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="startGateTitle">
        <span class="celebration-spark spark-one" aria-hidden="true"></span><span class="celebration-spark spark-two" aria-hidden="true"></span><span class="celebration-spark spark-three" aria-hidden="true"></span><span class="celebration-spark spark-four" aria-hidden="true"></span>
        <svg class="celebration-icon" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="startBlue" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#2fa7f2"/><stop offset="100%" stop-color="#0d6fb4"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.76)" stroke="rgba(255,255,255,.92)" stroke-width="5"/><circle cx="60" cy="60" r="35" fill="url(#startBlue)"/><path d="M52 42l27 18-27 18z" fill="#fff"/></svg>
        <h1 class="celebration-title" id="startGateTitle">ابدأ اللعبة</h1><p class="celebration-subtitle">اضغط للبدء وتشغيل الصوت</p><div class="celebration-actions"><button class="restart-btn activity-start-btn" id="startBtn" type="button">تشغيل</button></div>
      </div>
    </section>
    <section class="activity-overlay" id="finishOverlay" aria-hidden="true">
      <div class="celebration-confetti" id="confetti" aria-hidden="true"></div>

    function render(){pinLayer.textContent="";answerLayer.textContent="";connectorLayer.textContent="";cards=[];pins=[];page.dataset.answerDensity=answers.length>16?"compact":answers.length>10?"medium":"normal";answers.forEach((answer,index)=>{pins.push(createPin(answer,index));cards.push(createCard(answer,index))});applyLayout()}
    function pinCenter(answerIndex){const area=gameArea.getBoundingClientRect(),rect=pins[answerIndex].getBoundingClientRect();return{x:rect.left-area.left+rect.width/2,y:rect.top-area.top+rect.height/2}}
    function connectionPoint(answerIndex){const area=gameArea.getBoundingClientRect(),card=cards[answerIndex],handle=card?.querySelector(".answer-handle");if(card?.classList.contains("solved")){const rect=card.getBoundingClientRect(),centerX=rect.left-area.left+rect.width/2,centerY=rect.top-area.top+rect.height/2;if(card.classList.contains("handle-bottom"))return{x:centerX,y:rect.bottom-area.top};if(card.classList.contains("handle-top"))return{x:centerX,y:rect.top-area.top};return{x:(card.classList.contains("handle-right")?rect.right:rect.left)-area.left,y:centerY}}const rect=handle?.getBoundingClientRect();return rect?{x:rect.left-area.left+rect.width/2,y:rect.top-area.top+rect.height/2}:{x:0,y:0}}
    function cardColor(index){return cards[index]?.dataset.lineColor||getComputedStyle(cards[index]).getPropertyValue("--card-color").trim()||"#3788d8"}
    function appendLine(from,to,color,live=false){const path=document.createElementNS("http://www.w3.org/2000/svg","path"),dot=document.createElementNS("http://www.w3.org/2000/svg","circle"),radius=Math.max(8,Math.min(12.5,gameArea.clientWidth*.0098));path.setAttribute("class",live?"connector live":"connector");path.setAttribute("d",`M ${from.x} ${from.y} L ${to.x} ${to.y}`);path.style.stroke=color;dot.setAttribute("class","connector-dot");dot.setAttribute("cx",String(to.x));dot.setAttribute("cy",String(to.y));dot.setAttribute("r",String(radius));dot.style.fill=color;connectorLayer.append(path,dot)}
    function drawLines(){connectorLayer.setAttribute("viewBox",`0 0 ${gameArea.clientWidth} ${gameArea.clientHeight}`);connectorLayer.textContent="";answers.forEach((_,index)=>{if(solved[index])appendLine(connectionPoint(index),pinCenter(index),cardColor(index),false)});if(activeDrag){const target=activeDrag.target>=0?pinCenter(activeDrag.target):{x:activeDrag.x,y:activeDrag.y};appendLine(connectionPoint(activeDrag.index),target,activeDrag.color,true)}}
    function animateLines(duration=500){cancelAnimationFrame(lineAnimation);const start=performance.now();const tick=now=>{drawLines();if(now-start<duration)lineAnimation=requestAnimationFrame(tick)};lineAnimation=requestAnimationFrame(tick)}
    function nearestTarget(clientX,clientY){let best=-1,distance=Infinity;pins.forEach((pin,index)=>{if(solved[index])return;const rect=pin.getBoundingClientRect(),dx=clientX-(rect.left+rect.width/2),dy=clientY-(rect.top+rect.height/2),d=Math.hypot(dx,dy);if(d<distance){distance=d;best=index}});const attraction=Math.max(34,Math.min(46,innerWidth*.029));return distance<=attraction?best:-1}
    function beginDrag(event,index){if(!started||solved[index]||activeDrag)return;event.preventDefault();const source=cards[index],area=gameArea.getBoundingClientRect(),local=(clientX,clientY)=>({x:clamp(clientX-area.left,0,area.width),y:clamp(clientY-area.top,0,area.height)}),first=local(event.clientX,event.clientY);activeDrag={index,source,pointerId:event.pointerId,x:first.x,y:first.y,target:nearestTarget(event.clientX,event.clientY),color:cardColor(index)};source.classList.add("connecting");source.setPointerCapture?.(event.pointerId);drawLines();const cleanup=()=>{source.classList.remove("connecting");source.removeEventListener("pointermove",move);source.removeEventListener("pointerup",end);source.removeEventListener("pointercancel",cancel);source.removeEventListener("lostpointercapture",cancel);pins.forEach(pin=>pin.classList.remove("target"))},move=moveEvent=>{if(!activeDrag)return;moveEvent.preventDefault();const point=local(moveEvent.clientX,moveEvent.clientY),target=nearestTarget(moveEvent.clientX,moveEvent.clientY);activeDrag.x=point.x;activeDrag.y=point.y;activeDrag.target=target;pins.forEach((pin,pinIndex)=>pin.classList.toggle("target",pinIndex===target));drawLines()},end=endEvent=>{if(!activeDrag)return;const target=nearestTarget(endEvent.clientX,endEvent.clientY);cleanup();activeDrag=null;finishDrag(index,target);drawLines()},cancel=()=>{if(!activeDrag)return;cleanup();activeDrag=null;drawLines()};source.addEventListener("pointermove",move);source.addEventListener("pointerup",end);source.addEventListener("pointercancel",cancel);source.addEventListener("lostpointercapture",cancel)}
    function feedback(card,type){const mark=document.createElement("span");mark.className=type==="correct"?"feedback-check":"feedback-x";mark.textContent=type==="correct"?"✓":"×";card.appendChild(mark);setTimeout(()=>mark.remove(),760)}
    function finishDrag(index,target){if(target<0)return;if(target===index&&!solved[index]){smartPlace(index);return}if(payload.soundEnabled)gameAudio.play("wrong");const card=cards[index];card.classList.remove("wrong");void card.offsetWidth;card.classList.add("wrong");feedback(card,"wrong");setTimeout(()=>card.classList.remove("wrong"),620)}
    function smartPlace(index){if(payload.soundEnabled)gameAudio.play("correct");const pin=pinCenter(index),currentSlot=slotMap[index];let targetSlot=currentSlot,best=Infinity;answers.forEach((_,other)=>{if(solved[other]&&other!==index)return;const candidate=slotMap[other],slot=slots[candidate];if(!slot)return;const distance=Math.hypot(slot.x+slot.w/2-pin.x,slot.y+slot.h/2-pin.y);if(distance<best){best=distance;targetSlot=candidate}});const occupant=slotMap.findIndex(slotIndex=>slotIndex===targetSlot);if(occupant>=0&&occupant!==index&&!solved[occupant]){slotMap[occupant]=currentSlot;positionCard(occupant,true)}const color=cardColor(index);cards[index].dataset.lineColor=color;slotMap[index]=targetSlot;solved[index]=true;cards[index].classList.add("solved","correct-pop");pins[index].classList.add("solved");pins[index].style.background=color;pins[index].style.borderColor=color;positionCard(index,true);feedback(cards[index],"correct");animateLines();const done=solved.filter(Boolean).length;setTimeout(()=>cards[index].classList.remove("correct-pop"),650);if(done===answers.length)setTimeout(showEndCelebration,850)}
    function clearFinishTimers(){finishTimers.forEach(clearTimeout);finishTimers=[]}
    function resetFinishClasses(){finishOverlay.classList.remove("finish-sequence-start","finish-message-in","finish-actions-in","finish-confetti-on")}
    function queueFinishStep(token,delay,classNames){finishTimers.push(setTimeout(()=>{if(token!==finishToken)return;classNames.forEach(name=>finishOverlay.classList.add(name))},delay))}
    function createConfetti(){const node=document.getElementById("confetti");node.textContent="";const colors=["#efd553","#1688d3","#f47a45","#e91e63","#43a047","#8e24aa","#ffd166","#06b6d4"];for(let i=0;i<36;i++){const bit=document.createElement("span");bit.style.left=`${4+(i*7)%94}%`;bit.style.setProperty("--confetti-color",colors[i%colors.length]);bit.style.setProperty("--confetti-drift",`${((i%7)-3)*18}px`);bit.style.setProperty("--confetti-rotate",`${(i*31)%180}deg`);node.appendChild(bit)}}
    async function showEndCelebration(){const token=++finishToken;clearFinishTimers();resetFinishClasses();createConfetti();page.classList.add("activity-ended","ended");finishOverlay.classList.add("is-visible");finishOverlay.setAttribute("aria-hidden","false");if(payload.soundEnabled)await gameAudio.ready("finish");if(token!==finishToken)return;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));if(token!==finishToken)return;finishOverlay.classList.add("finish-sequence-start");if(payload.soundEnabled)gameAudio.play("finish");queueFinishStep(token,2680,["finish-message-in","finish-confetti-on"]);queueFinishStep(token,3180,["finish-actions-in"]);collapseSafariBars({refresh:false})}
    function hideEndCelebration(){finishToken+=1;clearFinishTimers();resetFinishClasses();gameAudio.stop("finish");page.classList.remove("activity-ended","ended");finishOverlay.classList.remove("is-visible");finishOverlay.setAttribute("aria-hidden","true")}
    function reset(){hideEndCelebration();gameAudio.stop("correct");gameAudio.stop("wrong");activeDrag=null;solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));cards.forEach(card=>{card.classList.remove("solved","wrong","correct-pop");delete card.dataset.lineColor});pins.forEach(pin=>{pin.classList.remove("solved","target");pin.style.background="";pin.style.borderColor=""});connectorLayer.textContent="";refreshResponsiveLayout();collapseSafariBars()}
    function backTarget(){const requested=String(params.get("return")||"");if(launch==="test")return "../index.html#imagePinsSetup";if(requested){if(/^https?:/i.test(requested))return requested;return requested.startsWith("../")?requested:`../${requested.replace(/^\.\//,"")}`}return launch==="saved"?"../index.html#savedGames":"../index.html"}
    async function startGame(event){event?.preventDefault?.();event?.stopPropagation?.();if(started||introRunning)return;if(payload.soundEnabled)gameAudio.unlock();introRunning=true;if(payload.soundEnabled)themeIntroAudio.play(payload.theme);startOverlay.classList.remove("is-visible");startOverlay.setAttribute("aria-hidden","true");try{await playOpeningIntro()}catch(_){page.classList.remove("intro-playing");page.classList.add("intro-done","started");started=true;refreshResponsiveLayout()}finally{introRunning=false}}
    payload=normalize(await readPayload()||{});answers=payload.answers;if(!payload.imageData||!answers.length){startOverlay.querySelector(".celebration-title").textContent="تعذر تشغيل اللعبة";startOverlay.querySelector(".celebration-subtitle").textContent="لم نجد الصورة أو الإجابات. ارجع إلى الإعدادات وأكمل المحتوى.";document.getElementById("startBtn").textContent="رجوع";document.getElementById("startBtn").addEventListener("click",()=>location.href=backTarget())}else{page.className=`page theme-${payload.theme}`;page.dataset.font=payload.fontFamily;page.style.setProperty("--content-direction",payload.language==="en"?"ltr":"rtl");page.style.setProperty("--answer-text-color",payload.textColor);document.documentElement.dir=payload.language==="en"?"ltr":"rtl";syncVisualViewportFrame();mainImage.src=payload.imageData;mainImage.onload=()=>{if(!payload.imageWidth||payload.imageWidth===4){payload.imageWidth=mainImage.naturalWidth||4;payload.imageHeight=mainImage.naturalHeight||3}scheduleResponsiveLayout()};solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));render();const startButton=document.getElementById("startBtn");if(payload.soundEnabled){themeIntroAudio.preload(payload.theme);gameAudio.preload();startButton.addEventListener("pointerdown",()=>gameAudio.unlock(),{once:true,passive:true})}startButton.addEventListener("click",startGame)}
    document.getElementById("backBtn").addEventListener("click",()=>{themeIntroAudio.stop();gameAudio.stopAll();location.href=backTarget()});document.getElementById("restartBtn").addEventListener("click",reset);document.getElementById("homeBtn").addEventListener("click",()=>{themeIntroAudio.stop();gameAudio.stopAll();location.href="../index.html"});window.addEventListener("resize",()=>scheduleResponsiveLayout(40),{passive:true});window.addEventListener("orientationchange",()=>setTimeout(()=>{collapseSafariBars();scheduleResponsiveLayout(80)},160),{passive:true});document.addEventListener("touchend",()=>collapseSafariBars(),{passive:true});if(window.visualViewport){window.visualViewport.addEventListener("resize",()=>scheduleResponsiveLayout(34),{passive:true});window.visualViewport.addEventListener("scroll",()=>scheduleResponsiveLayout(34),{passive:true})}window.addEventListener("pageshow",()=>{collapseSafariBars();scheduleResponsiveLayout(60)},{passive:true});window.addEventListener("pagehide",()=>{finishToken+=1;clearFinishTimers();themeIntroAudio.stop();gameAudio.stopAll();cancelAnimationFrame(introFrame)},{passive:true});if(document.fonts?.ready)document.fonts.ready.then(()=>scheduleResponsiveLayout()).catch(()=>{});collapseSafariBars();scheduleResponsiveLayout();
  })();
