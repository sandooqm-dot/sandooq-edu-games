  <style>
    :root{--ink:#161616;--yellow:#f4d34f;--blue:#298fd3;--red:#ee4d58;--green:#31a867;--game-font:"Noto Naskh Arabic",Tahoma,Arial,sans-serif}

    .game-logo{position:absolute;z-index:90;top:max(5px,env(safe-area-inset-top));left:max(6px,env(safe-area-inset-left));width:clamp(54px,5vw,76px);height:auto;object-fit:contain}

    .answer-card:nth-child(5n+2){--card-color:#bd4ecb;--card-top:#d061de;--card-bottom:#bd4ecb}.answer-card:nth-child(5n+3){--card-color:#279ce1;--card-top:#27a4f1;--card-bottom:#1592df}.answer-card:nth-child(5n+4){--card-color:#298f50;--card-top:#38a660;--card-bottom:#1a8041}.answer-card:nth-child(5n){--card-color:#ff7b0b;--card-top:#ff861a;--card-bottom:#f16900}.answer-card.solved{cursor:default;filter:saturate(.94) brightness(1.02)}.answer-card.connecting{filter:brightness(1.18) saturate(.92)}.answer-card.wrong{animation:wrongShake .55s ease}.answer-card.correct-pop{animation:correctPop .58s cubic-bezier(.2,1.15,.2,1)}
    .answer-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;overflow-wrap:anywhere;border-radius:inherit;pointer-events:none}.answer-card.has-image{padding:3px;background:#fff;border-color:var(--card-color)}.answer-card.has-image.solved{background:#fff}.answer-image{display:block;width:100%;height:100%;object-fit:contain;border-radius:8px;pointer-events:none}

    .feedback-x,.feedback-check{position:absolute;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);font:1000 clamp(25px,3.4vw,46px)/1 Arial;pointer-events:none;text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff}.feedback-x{color:var(--red);animation:feedback .62s ease both}.feedback-check{color:var(--green);animation:feedback .72s ease both}

    .page[data-answer-density="medium"] .answer-card{font-size:clamp(14px,1.7vw,23px)}.page[data-answer-density="compact"] .answer-card{font-size:clamp(11px,1.25vw,17px);padding:4px}
    .back-btn{position:absolute;z-index:90;left:max(7px,env(safe-area-inset-left));bottom:max(7px,env(safe-area-inset-bottom));min-width:clamp(62px,7vw,84px);height:clamp(34px,4.6vh,41px);border:2.5px solid #111;border-radius:11px;background:var(--yellow);color:#111;font-size:clamp(13px,1.5vw,17px);font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}.back-btn:active,.overlay-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

    .overlay-card{width:min(420px,88vw);border:2px solid rgba(255,255,255,.9);border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 18px 46px rgba(0,0,0,.18);text-align:center;padding:clamp(22px,4vw,38px);animation:overlayIn .5s cubic-bezier(.2,1.08,.2,1) both}
    .overlay-icon{font-size:clamp(55px,9vw,92px);line-height:1;margin-bottom:9px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.14))}.overlay-title{margin:0;color:#102b57;font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.12}.overlay-text{margin:10px 0 18px;color:#33445b;font-size:clamp(15px,2vw,20px);font-weight:800;line-height:1.55}.overlay-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.overlay-btn{min-width:130px;height:46px;border:3px solid #111;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer}.overlay-btn.secondary{background:var(--yellow);color:#111}
    .confetti{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.confetti span{position:absolute;top:-12%;width:10px;height:20px;border-radius:3px;background:var(--c);animation:fall 2.7s linear infinite;animation-delay:var(--d)}
    @keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
    @keyframes correctPop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
    @keyframes feedback{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(.88)}}
    @keyframes overlayIn{from{opacity:0;transform:scale(.82) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes fall{to{transform:translate3d(var(--x),115vh,0) rotate(620deg)}}
    @media(max-width:720px){.game-title{max-width:48vw}.progress{min-width:60px}.answer-card{font-size:clamp(11px,2.4vw,16px)}.pin{width:16px;height:16px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="theme-background" aria-hidden="true"></div>
    <img class="game-logo" src="../logo.PNG" alt="" onerror="this.style.display='none'">
    <h1 class="game-title" id="gameTitle">وضع الدبابيس بالصورة</h1>
    <div class="progress" id="progress">0/0</div>
    <section class="game-area" id="gameArea" aria-label="منطقة اللعبة">
      <div class="image-shell" id="imageShell"><img class="main-image" id="mainImage" alt="صورة النشاط"><div class="pin-layer" id="pinLayer"></div></div>
      <svg class="connector-layer" id="connectorLayer" aria-hidden="true"></svg>
      <div class="answer-layer" id="answerLayer"></div>
    </section>
    <button class="back-btn" id="backBtn" type="button">رجوع</button>
    <section class="overlay" id="startOverlay">
      <div class="overlay-card"><div class="overlay-icon" aria-hidden="true">📌</div><h2 class="overlay-title">وضع الدبابيس بالصورة</h2><p class="overlay-text">اسحب كل إجابة إلى الدبوس الصحيح على الصورة</p><div class="overlay-actions"><button class="overlay-btn" id="startBtn" type="button">تشغيل</button></div></div>
    </section>
    <section class="overlay" id="finishOverlay" hidden>
      <div class="confetti" id="confetti" aria-hidden="true"></div><div class="overlay-card"><div class="overlay-icon" aria-hidden="true">🏆</div><h2 class="overlay-title">أحسنت!</h2><p class="overlay-text">تم توصيل جميع الإجابات بالمواقع الصحيحة</p><div class="overlay-actions"><button class="overlay-btn" id="restartBtn" type="button">إعادة</button><button class="overlay-btn secondary" id="homeBtn" type="button">الصفحة الرئيسية</button></div></div>
    </section>
  </main>
  <script>
  (async()=>{
    "use strict";
    const KEY="sandooq_image_pins_payload_v1",DB_PREFIX="image-pins",MAX=24;
    const params=new URLSearchParams(location.search),payloadId=String(params.get("payloadId")||""),launch=String(params.get("launch")||"home").toLowerCase();
    const page=document.getElementById("page"),gameArea=document.getElementById("gameArea"),imageShell=document.getElementById("imageShell"),mainImage=document.getElementById("mainImage"),pinLayer=document.getElementById("pinLayer"),answerLayer=document.getElementById("answerLayer"),connectorLayer=document.getElementById("connectorLayer"),progress=document.getElementById("progress"),gameTitle=document.getElementById("gameTitle"),startOverlay=document.getElementById("startOverlay"),finishOverlay=document.getElementById("finishOverlay");
    let payload,answers=[],slots=[],slotMap=[],solved=[],cards=[],pins=[],started=false,layoutFrame=0,lineAnimation=0,activeDrag=null,currentImageRect={x:0,y:0,w:0,h:0};
    const parse=value=>{try{return JSON.parse(value||"null")}catch(_){return null}};
    function readDb(key){if(!("indexedDB" in window))return Promise.resolve(null);return new Promise(resolve=>{const request=indexedDB.open("sandooq_edu_games_v1",1);request.onerror=()=>resolve(null);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains("payloads"))db.createObjectStore("payloads",{keyPath:"key"})};request.onsuccess=()=>{const db=request.result;try{const tx=db.transaction("payloads","readonly"),get=tx.objectStore("payloads").get(key);get.onsuccess=()=>resolve(get.result?.payload||null);get.onerror=()=>resolve(null);tx.oncomplete=tx.onerror=tx.onabort=()=>db.close()}catch(_){db.close();resolve(null)}}})}
    async function readPayload(){const stores=[sessionStorage,localStorage];if(payloadId){const exact=`${KEY}_${payloadId}`;for(const store of stores){try{const value=parse(store.getItem(exact));if(value)return value}catch(_){}}const fromDb=await readDb(`${DB_PREFIX}:${payloadId}`);if(fromDb)return fromDb;for(const store of stores){try{const value=parse(store.getItem(KEY));if(value?.payloadId===payloadId)return value}catch(_){}}const latest=await readDb(`${DB_PREFIX}:latest`);return latest?.payloadId===payloadId?latest:null}for(const store of stores){try{const value=parse(store.getItem(KEY));if(value)return value}catch(_){}}return readDb(`${DB_PREFIX}:latest`)}
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
    function normalize(raw={}){const image=raw.mainImage||{},list=(Array.isArray(raw.answers)?raw.answers:Array.isArray(raw.entries)?raw.entries:[]).slice(0,MAX).map((item,index)=>({id:String(item?.id||index),contentType:item?.contentType==="image"?"image":"text",text:String(item?.text||item?.answer||""),imageData:String(item?.imageData||item?.image||""),pin:{x:clamp(Number(item?.pin?.x??item?.position?.x)||50,.4,99.6),y:clamp(Number(item?.pin?.y??item?.position?.y)||50,.4,99.6)}})).filter(item=>item.contentType==="image"?item.imageData:item.text.trim());return{name:String(raw.name||raw.gameName||"وضع الدبابيس بالصورة"),theme:String(raw.theme||raw.selectedTheme||params.get("theme")||"classic"),fontFamily:String(raw.fontFamily||"noto-naskh"),language:raw.contentLanguage==="en"||raw.language==="en"?"en":"ar",imageData:String(image.data||raw.imageData||""),imageWidth:Number(image.width||raw.imageWidth)||4,imageHeight:Number(image.height||raw.imageHeight)||3,answers:list}}
    function shuffle(values){const copy=values.slice();for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
    function sideBankRects(rect,count,W,H){if(count<=0)return[];const cols=count>7?2:1,rows=Math.ceil(count/cols),gapX=clamp(W*.01,6,13),cellW=(rect.w-gapX*(cols-1))/cols,baseSize=Math.min(W*.1135,H*.2015),availableHeight=rect.h/Math.max(1,rows),cardSize=Math.max(42,Math.min(baseSize,cellW*(cols===1?.72:.9),availableHeight*(rows<=3?.96:.82))),gridW=cols*cardSize+(cols-1)*gapX,startX=rect.x+(rect.w-gridW)/2;let startY,stepY;if(cols===1&&rows===1){startY=rect.y+(rect.h-cardSize)/2;stepY=0}else if(cols===1&&rows<=3){const inset=rows===2?rect.h*.14:rect.h*.03;startY=rect.y+inset;stepY=(rect.h-(inset*2)-cardSize)/(rows-1)}else{const free=Math.max(0,rect.h-rows*cardSize),gapY=rows>1?free/(rows+1):free/2;startY=rect.y+gapY;stepY=cardSize+gapY}return Array.from({length:count},(_,index)=>{const col=index%cols,row=Math.floor(index/cols);return{x:startX+col*(cardSize+gapX),y:startY+row*stepY,w:cardSize,h:cardSize}})}
    function computeLayout(){const W=gameArea.clientWidth,H=gameArea.clientHeight,count=answers.length,leftCount=Math.ceil(count/2),rightCount=count-leftCount,bankY=H*.14,bankH=H*.72,leftBank={x:W*.035,y:bankY,w:W*.175,h:bankH},rightBank={x:W*.79,y:bankY,w:W*.175,h:bankH},scale=Math.min((W*.74)/payload.imageWidth,(H*.725)/payload.imageHeight),iw=payload.imageWidth*scale,ih=payload.imageHeight*scale,imageRect={x:(W-iw)/2,y:(H-ih)/2,w:iw,h:ih},slotRects=sideBankRects(leftBank,leftCount,W,H).concat(sideBankRects(rightBank,rightCount,W,H));return{imageRect,slotRects}}
    function applyLayout(){cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(()=>{if(!answers.length)return;const result=computeLayout();slots=result.slotRects;currentImageRect=result.imageRect;Object.assign(imageShell.style,{left:`${result.imageRect.x}px`,top:`${result.imageRect.y}px`,width:`${result.imageRect.w}px`,height:`${result.imageRect.h}px`});cards.forEach((card,index)=>positionCard(index,false));drawLines()})}
    function updateHandleSide(answerIndex){const card=cards[answerIndex],slot=slots[slotMap[answerIndex]];if(!card||!slot)return;card.classList.remove("handle-left","handle-right","handle-top","handle-bottom");card.classList.add(slot.x+slot.w/2<gameArea.clientWidth/2?"handle-right":"handle-left")}
    function positionCard(answerIndex,animate=true){const card=cards[answerIndex],slot=slots[slotMap[answerIndex]];if(!card||!slot)return;card.style.transitionDuration=animate?"":"0s";card.style.left=`${slot.x}px`;card.style.top=`${slot.y}px`;card.style.width=`${slot.w}px`;card.style.height=`${slot.h}px`;updateHandleSide(answerIndex);if(!animate)requestAnimationFrame(()=>card.style.transitionDuration="")}
    function createPin(answer,index){const pin=document.createElement("div");pin.className="pin";pin.style.left=`${answer.pin.x}%`;pin.style.top=`${answer.pin.y}%`;pin.dataset.index=String(index);pin.setAttribute("aria-label",`موضع الإجابة ${index+1}`);pinLayer.appendChild(pin);return pin}
    function createCard(answer,index){const card=document.createElement("div"),content=document.createElement("div"),handle=document.createElement("span");card.className="answer-card";card.dataset.index=String(index);card.draggable=false;content.className="answer-content";handle.className="answer-handle";if(answer.contentType==="image"){card.classList.add("has-image");const image=document.createElement("img");image.className="answer-image";image.src=answer.imageData;image.alt=`الإجابة ${index+1}`;image.draggable=false;content.appendChild(image)}else content.textContent=answer.text;card.append(content,handle);card.addEventListener("dragstart",event=>event.preventDefault());card.addEventListener("pointerdown",event=>beginDrag(event,index));answerLayer.appendChild(card);return card}
    function render(){pinLayer.textContent="";answerLayer.textContent="";connectorLayer.textContent="";cards=[];pins=[];page.dataset.answerDensity=answers.length>16?"compact":answers.length>10?"medium":"normal";answers.forEach((answer,index)=>{pins.push(createPin(answer,index));cards.push(createCard(answer,index))});progress.textContent=`0/${answers.length}`;applyLayout()}
    function pinCenter(answerIndex){const area=gameArea.getBoundingClientRect(),rect=pins[answerIndex].getBoundingClientRect();return{x:rect.left-area.left+rect.width/2,y:rect.top-area.top+rect.height/2}}
    function connectionPoint(answerIndex){const area=gameArea.getBoundingClientRect(),card=cards[answerIndex],handle=card?.querySelector(".answer-handle");if(card?.classList.contains("solved")){const rect=card.getBoundingClientRect(),fromRight=card.classList.contains("handle-right");return{x:(fromRight?rect.right:rect.left)-area.left,y:rect.top-area.top+rect.height/2}}const rect=handle?.getBoundingClientRect();return rect?{x:rect.left-area.left+rect.width/2,y:rect.top-area.top+rect.height/2}:{x:0,y:0}}
    function cardColor(index){return cards[index]?.dataset.lineColor||getComputedStyle(cards[index]).getPropertyValue("--card-color").trim()||"#3788d8"}
    function appendLine(from,to,color,live=false){const path=document.createElementNS("http://www.w3.org/2000/svg","path"),dot=document.createElementNS("http://www.w3.org/2000/svg","circle"),radius=Math.max(8,Math.min(12.5,gameArea.clientWidth*.0098));path.setAttribute("class",live?"connector live":"connector");path.setAttribute("d",`M ${from.x} ${from.y} L ${to.x} ${to.y}`);path.style.stroke=color;dot.setAttribute("class","connector-dot");dot.setAttribute("cx",String(to.x));dot.setAttribute("cy",String(to.y));dot.setAttribute("r",String(radius));dot.style.fill=color;connectorLayer.append(path,dot)}
    function drawLines(){connectorLayer.setAttribute("viewBox",`0 0 ${gameArea.clientWidth} ${gameArea.clientHeight}`);connectorLayer.textContent="";answers.forEach((_,index)=>{if(solved[index])appendLine(connectionPoint(index),pinCenter(index),cardColor(index),false)});if(activeDrag){const target=activeDrag.target>=0?pinCenter(activeDrag.target):{x:activeDrag.x,y:activeDrag.y};appendLine(connectionPoint(activeDrag.index),target,activeDrag.color,true)}}
    function animateLines(duration=500){cancelAnimationFrame(lineAnimation);const start=performance.now();const tick=now=>{drawLines();if(now-start<duration)lineAnimation=requestAnimationFrame(tick)};lineAnimation=requestAnimationFrame(tick)}
    function nearestTarget(clientX,clientY){let best=-1,distance=Infinity;pins.forEach((pin,index)=>{if(solved[index])return;const rect=pin.getBoundingClientRect(),dx=clientX-(rect.left+rect.width/2),dy=clientY-(rect.top+rect.height/2),d=Math.hypot(dx,dy);if(d<distance){distance=d;best=index}});const attraction=Math.max(34,Math.min(46,innerWidth*.029));return distance<=attraction?best:-1}
    function beginDrag(event,index){if(!started||solved[index]||activeDrag)return;event.preventDefault();const source=cards[index],area=gameArea.getBoundingClientRect(),local=(clientX,clientY)=>({x:clamp(clientX-area.left,0,area.width),y:clamp(clientY-area.top,0,area.height)}),first=local(event.clientX,event.clientY);activeDrag={index,source,pointerId:event.pointerId,x:first.x,y:first.y,target:nearestTarget(event.clientX,event.clientY),color:cardColor(index)};source.classList.add("connecting");source.setPointerCapture?.(event.pointerId);drawLines();const cleanup=()=>{source.classList.remove("connecting");source.removeEventListener("pointermove",move);source.removeEventListener("pointerup",end);source.removeEventListener("pointercancel",cancel);source.removeEventListener("lostpointercapture",cancel);pins.forEach(pin=>pin.classList.remove("target"))},move=moveEvent=>{if(!activeDrag)return;moveEvent.preventDefault();const point=local(moveEvent.clientX,moveEvent.clientY),target=nearestTarget(moveEvent.clientX,moveEvent.clientY);activeDrag.x=point.x;activeDrag.y=point.y;activeDrag.target=target;pins.forEach((pin,pinIndex)=>pin.classList.toggle("target",pinIndex===target));drawLines()},end=endEvent=>{if(!activeDrag)return;const target=nearestTarget(endEvent.clientX,endEvent.clientY);cleanup();activeDrag=null;finishDrag(index,target);drawLines()},cancel=()=>{if(!activeDrag)return;cleanup();activeDrag=null;drawLines()};source.addEventListener("pointermove",move);source.addEventListener("pointerup",end);source.addEventListener("pointercancel",cancel);source.addEventListener("lostpointercapture",cancel)}
    function feedback(card,type){const mark=document.createElement("span");mark.className=type==="correct"?"feedback-check":"feedback-x";mark.textContent=type==="correct"?"✓":"×";card.appendChild(mark);setTimeout(()=>mark.remove(),760)}
    function finishDrag(index,target){if(target<0)return;if(target===index&&!solved[index]){smartPlace(index);return}const card=cards[index];card.classList.remove("wrong");void card.offsetWidth;card.classList.add("wrong");feedback(card,"wrong");setTimeout(()=>card.classList.remove("wrong"),620)}
    function smartPlace(index){const pin=pinCenter(index),currentSlot=slotMap[index];let targetSlot=currentSlot,best=Infinity;answers.forEach((_,other)=>{if(solved[other]&&other!==index)return;const candidate=slotMap[other],slot=slots[candidate];if(!slot)return;const distance=Math.hypot(slot.x+slot.w/2-pin.x,slot.y+slot.h/2-pin.y);if(distance<best){best=distance;targetSlot=candidate}});const occupant=slotMap.findIndex(slotIndex=>slotIndex===targetSlot);if(occupant>=0&&occupant!==index&&!solved[occupant]){slotMap[occupant]=currentSlot;positionCard(occupant,true)}const color=cardColor(index);cards[index].dataset.lineColor=color;slotMap[index]=targetSlot;solved[index]=true;cards[index].classList.add("solved","correct-pop");pins[index].classList.add("solved");pins[index].style.background=color;pins[index].style.borderColor=color;positionCard(index,true);feedback(cards[index],"correct");animateLines();const done=solved.filter(Boolean).length;progress.textContent=`${done}/${answers.length}`;setTimeout(()=>cards[index].classList.remove("correct-pop"),650);if(done===answers.length)setTimeout(showFinish,850)}
    function showFinish(){finishOverlay.hidden=false;createConfetti()}
    function createConfetti(){const node=document.getElementById("confetti");node.textContent="";const colors=["#efd553","#2fa7f2","#ef5b5b","#42b979","#a86bd2"];for(let i=0;i<36;i++){const bit=document.createElement("span");bit.style.left=`${Math.random()*100}%`;bit.style.setProperty("--c",colors[i%colors.length]);bit.style.setProperty("--d",`${Math.random()*-2.6}s`);bit.style.setProperty("--x",`${(Math.random()-.5)*180}px`);node.appendChild(bit)}}
    function reset(){finishOverlay.hidden=true;activeDrag=null;solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));cards.forEach(card=>{card.classList.remove("solved","wrong","correct-pop");delete card.dataset.lineColor});pins.forEach(pin=>{pin.classList.remove("solved","target");pin.style.background="";pin.style.borderColor=""});progress.textContent=`0/${answers.length}`;connectorLayer.textContent="";applyLayout()}
    function backTarget(){const requested=String(params.get("return")||"");if(launch==="test")return "../index.html#imagePinsSetup";if(requested){if(/^https?:/i.test(requested))return requested;return requested.startsWith("../")?requested:`../${requested.replace(/^\.\//,"")}`}return launch==="saved"?"../index.html#savedGames":"../index.html"}
    function collapseSafari(){if(scrollY<2)try{scrollTo(0,1)}catch(_){}}
    payload=normalize(await readPayload()||{});answers=payload.answers;if(!payload.imageData||!answers.length){startOverlay.querySelector(".overlay-title").textContent="تعذر تشغيل اللعبة";startOverlay.querySelector(".overlay-text").textContent="لم نجد الصورة أو الإجابات. ارجع إلى الإعدادات وأكمل المحتوى.";document.getElementById("startBtn").textContent="رجوع";document.getElementById("startBtn").addEventListener("click",()=>location.href=backTarget())}else{page.className=`page theme-${payload.theme}`;page.dataset.font=payload.fontFamily;page.style.setProperty("--content-direction",payload.language==="en"?"ltr":"rtl");document.documentElement.dir=payload.language==="en"?"ltr":"rtl";gameTitle.textContent=payload.name;mainImage.src=payload.imageData;mainImage.onload=()=>{if(!payload.imageWidth||payload.imageWidth===4){payload.imageWidth=mainImage.naturalWidth||4;payload.imageHeight=mainImage.naturalHeight||3}applyLayout()};solved=answers.map(()=>false);slotMap=shuffle(answers.map((_,index)=>index));render();document.getElementById("startBtn").addEventListener("click",()=>{started=true;startOverlay.hidden=true;page.classList.add("started");applyLayout()})}
    document.getElementById("backBtn").addEventListener("click",()=>location.href=backTarget());document.getElementById("restartBtn").addEventListener("click",reset);document.getElementById("homeBtn").addEventListener("click",()=>location.href="../index.html");window.addEventListener("resize",applyLayout,{passive:true});window.addEventListener("orientationchange",()=>setTimeout(applyLayout,160),{passive:true});document.addEventListener("touchend",collapseSafari,{passive:true});if(window.visualViewport)window.visualViewport.addEventListener("resize",applyLayout,{passive:true});collapseSafari();
  })();
