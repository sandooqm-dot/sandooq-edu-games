<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>الترتيب - صندوق الألعاب التعليمية</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --edge-guard:clamp(12px,2vw,28px);
      --ink:#111;
      --navy:#241a43;
      --tile-gray:#b7b0ac;
      --tile-gray-light:#d2ccc7;
      --tile-gray-dark:#766d75;
      --tile-orange:#f5aa2d;
      --tile-orange-light:#ffc45d;
      --tile-orange-dark:#c6780d;
      --yellow:#efd553;
      --blue:#1688d3;
      --green:#28ad6d;
      --intro-bg-final-scale:1.12;
      --game-font:Tahoma,Arial,"Segoe UI",sans-serif;
      --tile-size:clamp(48px,7vw,92px);
      --tile-gap:clamp(7px,1vw,13px);
      --group-gap:clamp(24px,4vw,54px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:var(--game-font);
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    button{font:inherit}

    .order-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:none;
      isolation:isolate;
    }

    .order-page[data-font="arial"]{--game-font:Arial,sans-serif}
    .order-page[data-font="traditional"]{--game-font:"Traditional Arabic","Arabic Typesetting",Tahoma,Arial,sans-serif}

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
      transform:translate3d(0,0,0) scale(1);
      transform-origin:center center;
      will-change:transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .theme-classic .theme-background{background:#fff}
    .theme-classroom .theme-background{background:#fff url("theme-classroom-bg-v2.webp?v=2") center/cover no-repeat}
    .theme-sky-clouds .theme-background{background:#63cef3 url("theme-sky-clouds-bg.webp?v=45") center/cover no-repeat}
    .theme-forest .theme-background{background:#7ccfef url("theme-forest-bg.webp?v=45") center/cover no-repeat}
    .theme-math .theme-background{background:#f5f4e7 url("theme-math-bg.webp?v=45") center/cover no-repeat}
    .theme-english .theme-background{background:#72d0d2 url("theme-english-bg.webp?v=46") center/cover no-repeat}
    .theme-flowers .theme-background{background:#f8edf3 url("theme-flowers-bg.webp?v=48") center/cover no-repeat}
    .theme-national-day .theme-background{background:#165f55 url("theme-national-day-v2-bg.webp?v=53") center/cover no-repeat}
    .theme-founding-day .theme-background{background:#d7c9b1 url("theme-founding-day-bg.webp?v=1") center/cover no-repeat}


    /* حركة الزوم الافتتاحية وصوت الثيم: مطابقة لصفحة المطابقة. */
    .fixed-controls{
      transition:opacity .34s ease,transform .34s ease;
    }

    .order-page.intro-playing .fixed-controls{
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
    }

    .order-page.intro-camera .groups-canvas{
      visibility:hidden;
      opacity:0;
      pointer-events:none;
    }

    .order-page.intro-pre-reveal .groups-canvas{
      visibility:visible;
      opacity:0;
      pointer-events:none;
      transition:none;
    }

    .order-page.intro-reveal .groups-canvas{
      visibility:visible;
      opacity:1;
      pointer-events:none;
      transition:opacity .82s ease;
    }

    .order-page.intro-playing .theme-background{
      transform:translate3d(0,0,0) scale(1);
    }

    .order-page.intro-done .theme-background{
      transform:translate3d(0,0,0) scale(var(--intro-bg-final-scale));
    }

    .order-page.intro-playing .game-logo{
      animation:introLogoFade .75s ease-out both;
    }

    @keyframes introLogoFade{
      0%{opacity:0;transform:translateY(-8px)}
      100%{opacity:1;transform:translateY(0)}
    }

    .game-logo{
      position:absolute;
      top:clamp(10px,1.7vw,22px);
      left:clamp(12px,2vw,30px);
      width:clamp(86px,9.2vw,148px);
      height:auto;
      max-height:clamp(68px,9vw,120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(58px + var(--safe-top))
        calc(var(--edge-guard) + var(--safe-right))
        calc(78px + var(--safe-bottom))
        calc(var(--edge-guard) + var(--safe-left));
      overflow:hidden;
      direction:ltr;
      transform-origin:center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .groups-canvas{
      width:100%;
      max-width:1480px;
      max-height:100%;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      align-content:center;
      justify-content:center;
      gap:var(--group-gap) clamp(28px,5vw,74px);
      direction:rtl;
      transform-origin:center;
      transform:scale(var(--order-fit-scale,1));
      will-change:transform,opacity;
    }

    .order-group{
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(9px,1.25vw,17px);
      min-width:0;
      direction:inherit;
    }

    .token-bank{
      min-height:var(--tile-size);
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:var(--tile-gap);
      direction:inherit;
    }

    .order-token{
      position:relative;
      flex:0 0 auto;
      min-width:var(--tile-size);
      width:var(--tile-size);
      height:var(--tile-size);
      border:clamp(3px,.38vw,5px) solid var(--navy);
      border-radius:clamp(11px,1.35vw,19px);
      background:
        linear-gradient(145deg,var(--tile-gray-light) 0%,var(--tile-gray) 58%,var(--tile-gray-dark) 100%);
      color:#111;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.34),
        inset 0 -3px 5px rgba(0,0,0,.10),
        0 clamp(4px,.72vw,8px) 0 rgba(36,26,67,.45),
        0 11px 18px rgba(0,0,0,.16);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(4px,.7vw,9px);
      font-size:clamp(26px,calc(var(--tile-size) * .53),58px);
      font-weight:900;
      line-height:1;
      cursor:grab;
      touch-action:none;
      overflow:hidden;
      transform:translate3d(0,0,0);
      transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;
    }

    .order-token:active{cursor:grabbing}

    .order-token.is-selected{
      transform:translateY(-5px) scale(1.06);
      filter:brightness(1.08);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.38),
        0 7px 0 rgba(36,26,67,.50),
        0 0 0 5px rgba(22,136,211,.30),
        0 14px 22px rgba(0,0,0,.20);
    }

    .order-token.is-wrong{
      animation:tokenWrong .52s ease both;
    }

    .order-token.word-token{
      width:auto;
      min-width:clamp(92px,14vw,190px);
      max-width:min(310px,42vw);
      padding-inline:clamp(12px,2vw,26px);
      font-size:clamp(18px,2.4vw,36px);
      line-height:1.15;
      white-space:normal;
      overflow-wrap:anywhere;
    }

    .order-token.image-token{
      width:clamp(84px,13vw,148px);
      height:clamp(84px,13vw,148px);
      padding:clamp(5px,.65vw,9px);
    }

    .order-token img{
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:clamp(7px,.8vw,12px);
      background:#fff;
      pointer-events:none;
    }

    .slot-tray{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:var(--tile-gap);
      min-height:calc(var(--tile-size) + clamp(24px,3vw,42px));
      padding:clamp(13px,1.7vw,22px) clamp(14px,1.9vw,26px);
      border:clamp(4px,.48vw,6px) solid var(--navy);
      border-radius:clamp(20px,2.4vw,34px);
      background:rgba(255,254,250,.98);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.94),
        0 clamp(5px,.8vw,9px) 0 rgba(36,26,67,.34),
        0 15px 24px rgba(0,0,0,.13);
      direction:inherit;
    }

    .order-slot{
      position:relative;
      flex:0 0 auto;
      width:var(--tile-size);
      height:var(--tile-size);
      display:flex;
      align-items:center;
      justify-content:center;
      border:0;
      background:transparent;
      padding:0;
      border-radius:clamp(10px,1.2vw,17px);
      transition:transform .16s ease,background .16s ease;
    }

    .order-slot::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:clamp(5px,.7vw,9px);
      width:72%;
      height:clamp(5px,.56vw,8px);
      border-radius:999px;
      background:#9897ab;
      transform:translateX(-50%);
      opacity:1;
      pointer-events:none;
    }

    .order-slot.is-filled::after{opacity:0}

    .order-slot.drag-over{
      background:rgba(22,136,211,.18);
      transform:scale(1.09);
      box-shadow:0 0 0 clamp(5px,.65vw,9px) rgba(22,136,211,.22);
    }

    .order-slot.is-wrong-target{
      animation:slotWrong .52s ease both;
    }

    .accepted-token{
      width:100%;
      height:100%;
      min-width:0;
      border:clamp(2px,.26vw,4px) solid var(--navy);
      border-radius:clamp(9px,1.05vw,15px);
      background:
        linear-gradient(145deg,var(--tile-orange-light) 0%,var(--tile-orange) 60%,var(--tile-orange-dark) 100%);
      color:#111;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.38),
        inset 0 -3px 5px rgba(0,0,0,.08);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(4px,.55vw,8px);
      font-size:clamp(24px,calc(var(--tile-size) * .50),54px);
      font-weight:900;
      line-height:1;
      overflow:hidden;
      animation:acceptedPop .26s cubic-bezier(.2,.9,.2,1) both;
    }

    .accepted-token.word-token{
      font-size:clamp(16px,2.15vw,32px);
      line-height:1.12;
      overflow-wrap:anywhere;
    }

    .accepted-token.image-token{padding:4px}
    .accepted-token img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff}

    .drop-check{
      position:absolute;
      z-index:4;
      left:50%;
      top:50%;
      color:#fff;
      font-family:Arial,sans-serif;
      font-size:clamp(40px,calc(var(--tile-size) * .72),78px);
      font-weight:1000;
      line-height:1;
      text-shadow:
        0 3px 0 rgba(17,17,17,.85),
        0 7px 12px rgba(0,0,0,.28);
      transform:translate(-50%,-50%) scale(.25) rotate(-12deg);
      opacity:0;
      pointer-events:none;
      animation:checkFlash .58s cubic-bezier(.18,1.12,.24,1) both;
    }

    .wrong-mark{
      position:absolute;
      z-index:18;
      left:50%;
      top:50%;
      color:#f04747;
      font-family:Arial,sans-serif;
      font-size:clamp(52px,calc(var(--tile-size) * 1.08),108px);
      font-weight:1000;
      line-height:.8;
      text-shadow:
        0 3px 0 rgba(255,255,255,.98),
        3px 0 0 rgba(255,255,255,.98),
        -3px 0 0 rgba(255,255,255,.98),
        0 -3px 0 rgba(255,255,255,.98),
        0 8px 15px rgba(0,0,0,.24);
      transform:translate(-50%,-50%) scale(.25);
      opacity:0;
      pointer-events:none;
    }

    .order-group.show-wrong .wrong-mark{
      animation:wrongMark .58s cubic-bezier(.18,1.05,.22,1) both;
    }

    .group-celebration{
      position:absolute;
      z-index:12;
      left:50%;
      top:52%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      pointer-events:none;
      white-space:nowrap;
      transform:translate(-50%,-50%);
      opacity:0;
    }

    .order-group.is-celebrating .group-celebration{
      animation:celebrationRise 1.55s cubic-bezier(.16,.9,.18,1) both;
    }

    .celebration-word{
      color:#fff;
      font-size:clamp(31px,4.6vw,66px);
      font-weight:1000;
      text-shadow:
        0 3px 0 rgba(17,17,17,.75),
        0 9px 17px rgba(0,0,0,.24);
    }

    .celebration-points{
      color:#19aa53;
      font-family:Arial,sans-serif;
      font-size:clamp(27px,4vw,58px);
      font-weight:1000;
      text-shadow:
        0 3px 0 #fff,
        0 7px 13px rgba(0,0,0,.20);
    }

    .sequence-shell{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:clamp(8px,1.2vw,16px);
      direction:inherit;
    }

    .sequence-shell .order-slot{
      width:clamp(92px,14vw,168px);
      height:clamp(72px,10vw,126px);
      border:clamp(3px,.4vw,5px) solid var(--navy);
      border-radius:clamp(14px,1.7vw,23px);
      background:rgba(255,254,250,.98);
      box-shadow:0 5px 0 rgba(36,26,67,.28),0 11px 18px rgba(0,0,0,.11);
      padding:clamp(5px,.65vw,9px);
    }

    .sequence-shell .order-slot::after{bottom:10%;width:62%}
    .sequence-shell .order-slot.image-slot{width:clamp(92px,14vw,168px);height:clamp(92px,14vw,168px)}

    .sequence-arrow{
      color:var(--navy);
      font-size:clamp(26px,4vw,52px);
      font-weight:1000;
      line-height:1;
      text-shadow:0 2px 0 rgba(255,255,255,.68);
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px,6.2vh,60px);
      z-index:90;
      pointer-events:none;
    }

    .right-controls{
      pointer-events:auto;
      position:absolute;
      right:clamp(16px,2.8vw,42px);
      bottom:0;
      display:flex;
      align-items:center;
      gap:clamp(8px,1vw,12px);
      direction:ltr;
    }

    .control-btn{
      pointer-events:auto;
      height:clamp(34px,4.8vh,44px);
      min-width:clamp(78px,8vw,110px);
      border:2.5px solid #111;
      border-radius:11px;
      color:#111;
      font-size:clamp(14px,1.7vw,19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px,2vw,24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .previous-btn{background:var(--green);color:#fff}
    .next-btn{background:var(--blue);color:#fff}
    .control-btn:disabled{opacity:.38;cursor:default;box-shadow:none;filter:saturate(.55)}
    .control-btn[hidden],.right-controls[hidden]{display:none}
    .control-btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.20)}

    .activity-overlay{
      position:absolute;
      inset:0;
      z-index:220;
      display:none;
      align-items:center;
      justify-content:center;
      padding:clamp(18px,4vw,44px);
      background:rgba(17,17,17,.14);
      direction:rtl;
    }

    .activity-overlay.is-visible{display:flex}

    .overlay-card{
      width:min(480px,86vw);
      min-height:clamp(250px,42vh,370px);
      border:2px solid rgba(255,255,255,.86);
      border-radius:28px;
      background:rgba(255,255,255,.86);
      -webkit-backdrop-filter:blur(9px);
      backdrop-filter:blur(9px);
      box-shadow:0 18px 45px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
      text-align:center;
      padding:clamp(24px,4vw,40px);
      pointer-events:auto;
      animation:overlayPop .58s cubic-bezier(.2,1.08,.22,1) both;
    }

    .overlay-icon{font-size:clamp(72px,14vw,126px);line-height:1}
    .overlay-title{margin:0;color:#102b57;font-size:clamp(32px,5.7vw,60px);font-weight:1000}
    .overlay-text{margin:0;color:#36485d;font-size:clamp(16px,2.4vw,24px);font-weight:850}
    .overlay-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .overlay-actions button,.start-btn{
      min-width:140px;
      min-height:48px;
      border:3px solid #111;
      border-radius:15px;
      font-size:18px;
      font-weight:950;
      cursor:pointer;
      padding:8px 20px;
      box-shadow:0 5px 0 rgba(0,0,0,.20);
    }
    .start-btn,.restart-btn{background:var(--blue);color:#fff}
    .home-btn{background:var(--yellow);color:#111}

    .order-token.is-drag-source{
      opacity:.22;
      transform:scale(.96);
      filter:saturate(.75);
    }

    .drag-ghost{
      position:fixed;
      z-index:9999;
      pointer-events:none;
      margin:0;
      transform:translate(-50%,-50%) scale(1.04);
      opacity:.96;
      transition:none!important;
      will-change:left,top,transform,opacity;
      contain:layout paint style;
    }

    @keyframes tokenWrong{
      0%,100%{transform:translateX(0) rotate(0)}
      20%{transform:translateX(-10px) rotate(-3deg)}
      40%{transform:translateX(9px) rotate(2.5deg)}
      60%{transform:translateX(-6px) rotate(-1.5deg)}
      80%{transform:translateX(4px) rotate(1deg)}
    }
    @keyframes slotWrong{
      0%,100%{transform:scale(1)}
      45%{transform:scale(1.08)}
    }
    @keyframes acceptedPop{
      0%{opacity:.25;transform:scale(.70)}
      72%{opacity:1;transform:scale(1.10)}
      100%{opacity:1;transform:scale(1)}
    }
    @keyframes checkFlash{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-12deg)}
      42%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}
      72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.82) rotate(0)}
    }
    @keyframes wrongMark{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.20) rotate(-8deg)}
      35%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(4deg)}
      72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
      100%{opacity:0;transform:translate(-50%,-50%) scale(.84)}
    }
    @keyframes celebrationRise{
      0%{opacity:0;transform:translate(-50%,-22%) scale(.55)}
      24%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
      70%{opacity:1;transform:translate(-50%,-70%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-120%) scale(.92)}
    }
    @keyframes overlayPop{
      0%{opacity:0;transform:scale(.82) translateY(18px)}
      70%{opacity:1;transform:scale(1.035) translateY(0)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }

    @media(max-width:760px){
      :root{
        --tile-size:clamp(46px,14vw,68px);
        --tile-gap:clamp(5px,1.8vw,9px);
        --group-gap:clamp(22px,6vw,36px);
      }
      .stage{
        padding:
          calc(52px + var(--safe-top))
          calc(8px + var(--safe-right))
          calc(68px + var(--safe-bottom))
          calc(8px + var(--safe-left));
      }
      .groups-canvas{gap:var(--group-gap) 18px}
      .slot-tray{padding:11px 12px;border-width:4px;border-radius:21px;min-height:calc(var(--tile-size) + 22px)}
      .order-token{border-width:3px;border-radius:12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.30),0 5px 0 rgba(36,26,67,.42),0 9px 13px rgba(0,0,0,.14)}
      .order-token.word-token{min-width:92px;max-width:44vw;font-size:clamp(16px,4.8vw,24px)}
      .sequence-shell .order-slot{width:clamp(86px,25vw,120px);height:clamp(64px,18vw,92px)}
      .sequence-shell .order-slot.image-slot{width:clamp(82px,24vw,118px);height:clamp(82px,24vw,118px)}
      .sequence-arrow{font-size:clamp(23px,8vw,38px)}
      .right-controls{right:12px}
      .control-btn{height:40px;min-width:82px;font-size:15px;padding:0 14px}
      .overlay-card{width:min(360px,88vw);min-height:260px;border-radius:24px}
    }

    @media(max-height:560px) and (orientation:landscape){
      :root{--tile-size:clamp(42px,11vh,70px);--group-gap:18px}
      .stage{padding-top:12px;padding-bottom:54px}
      .game-logo{width:76px;top:7px;left:9px}
      .slot-tray{padding:8px 10px;min-height:calc(var(--tile-size) + 17px)}
      .order-group{gap:7px}
      .fixed-controls{bottom:8px}
      .control-btn{height:36px}
    }


    /* النهاية السينمائية المرتبطة بصوت النهاية: مطابقة لصفحة المطابقة. */
    .celebration-confetti{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .celebration-confetti span{
      position:absolute;
      top:-12vh;
      width:clamp(8px,1.2vw,14px);
      height:clamp(14px,2vw,24px);
      border-radius:4px;
      background:var(--confetti-color,#efd553);
      opacity:.9;
      transform:rotate(var(--confetti-rotate,0deg));
    }

    #finishView .finish-card{
      animation:none;
      opacity:0;
      transform:translate3d(0,18px,0) scale(.965);
      transform-origin:center;
      overflow:hidden;
    }

    #finishView.is-visible .finish-card{
      animation:finishPanelIn .52s cubic-bezier(.2,.9,.2,1) both;
    }

    #finishView .finish-trophy{
      width:clamp(92px,17vw,144px);
      height:clamp(92px,17vw,144px);
      margin-bottom:clamp(12px,2.6vw,20px);
      animation:none;
      opacity:0;
      transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);
      transform-origin:center;
      filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.12));
      will-change:transform,opacity,filter;
      position:relative;
      z-index:1;
    }

    #finishView.finish-sequence-start .finish-trophy{
      animation:finishTrophyArrival 2.52s cubic-bezier(.16,.82,.18,1) both;
    }

    #finishView .finish-title,
    #finishView .finish-subtitle{
      position:relative;
      z-index:1;
      visibility:hidden;
      opacity:0;
      will-change:transform,opacity,filter;
    }

    #finishView .finish-title{
      margin:0;
      color:#102b57;
      font-size:clamp(34px,6.2vw,64px);
      line-height:1.05;
      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    #finishView .finish-subtitle{
      margin:clamp(8px,1.7vw,14px) 0 0;
      color:#26364a;
      font-size:clamp(17px,2.7vw,28px);
      line-height:1.35;
      font-weight:800;
    }

    #finishView.finish-message-in .finish-title{
      visibility:visible;
      animation:finishTitleBurst .68s cubic-bezier(.16,1.22,.2,1) both;
    }

    #finishView.finish-message-in .finish-subtitle{
      visibility:visible;
      animation:finishSubtitleBurst .62s cubic-bezier(.18,1.08,.2,1) both .055s;
    }

    #finishView .finish-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,2.2vw,20px);
      margin-top:clamp(22px,4vw,34px);
      flex-wrap:wrap;
      visibility:hidden;
      opacity:0;
      transform:translate3d(0,28px,0) scale(.94);
      pointer-events:none;
      will-change:transform,opacity;
    }

    #finishView .finish-actions button{
      min-width:clamp(118px,18vw,178px);
      height:clamp(44px,6.4vh,58px);
      border:3px solid #111;
      border-radius:15px;
      font-size:clamp(17px,2.5vw,25px);
      font-weight:900;
      padding:0 clamp(20px,3vw,32px);
      box-shadow:0 5px 0 rgba(0,0,0,.22);
      cursor:pointer;
      white-space:nowrap;
    }

    #finishView.finish-actions-in .finish-actions{
      visibility:visible;
      pointer-events:auto;
      animation:finishActionsRise .62s cubic-bezier(.18,1.08,.2,1) both;
    }

    #finishView .finish-confetti{opacity:0;transition:none}
    #finishView .finish-confetti span{animation:none;opacity:0}
    #finishView.finish-confetti-on .finish-confetti{opacity:1}
    #finishView.finish-confetti-on .finish-confetti span{
      animation:finishConfettiBurst 2.45s cubic-bezier(.18,.72,.22,1) 1 both;
      animation-delay:0s!important;
    }
    #finishView.finish-confetti-on .finish-confetti span:nth-child(3n+2){animation-delay:.055s!important}
    #finishView.finish-confetti-on .finish-confetti span:nth-child(3n){animation-delay:.11s!important}

    .order-page.activity-ended .groups-canvas{visibility:hidden;pointer-events:none}

    @keyframes finishPanelIn{
      0%{opacity:0;transform:translate3d(0,18px,0) scale(.965)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
    }
    @keyframes finishTrophyArrival{
      0%{opacity:0;transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.10))}
      18%{opacity:1;filter:blur(1.5px) drop-shadow(0 10px 18px rgba(0,0,0,.16))}
      62%{opacity:1;transform:translate3d(-10%,7%,0) scale(1.13) rotate(-7deg);filter:blur(0) drop-shadow(0 10px 18px rgba(0,0,0,.17))}
      77%{transform:translate3d(5%,-4%,0) scale(.965) rotate(3deg)}
      89%{transform:translate3d(-2%,2%,0) scale(1.025) rotate(-1.2deg)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:blur(0) drop-shadow(0 8px 14px rgba(0,0,0,.15))}
    }
    @keyframes finishTitleBurst{
      0%{opacity:0;transform:translate3d(0,24px,0) scale(.22) rotate(-3deg);filter:blur(8px)}
      55%{opacity:1;transform:translate3d(0,-3px,0) scale(1.16) rotate(1deg);filter:blur(0)}
      78%{transform:translate3d(0,1px,0) scale(.97) rotate(-.35deg)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:blur(0)}
    }
    @keyframes finishSubtitleBurst{
      0%{opacity:0;transform:translate3d(0,18px,0) scale(.72);filter:blur(5px)}
      62%{opacity:1;transform:translate3d(0,-2px,0) scale(1.055);filter:blur(0)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}
    }
    @keyframes finishActionsRise{
      0%{opacity:0;transform:translate3d(0,28px,0) scale(.94)}
      70%{opacity:1;transform:translate3d(0,-3px,0) scale(1.02)}
      100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
    }
    @keyframes finishConfettiBurst{
      0%{opacity:0;transform:translate3d(0,-9vh,0) rotate(var(--confetti-rotate,0deg)) scale(.55)}
      8%{opacity:.96}
      72%{opacity:.92}
      100%{opacity:0;transform:translate3d(var(--confetti-drift,0px),108vh,0) rotate(calc(var(--confetti-rotate,0deg) + 620deg)) scale(1)}
    }

    @media(prefers-reduced-motion:reduce){
      .order-token,.accepted-token,.drop-check,.wrong-mark,.group-celebration,.overlay-card,#finishView .finish-title,#finishView .finish-subtitle,#finishView .finish-actions,#finishView .finish-confetti span{animation-duration:.01ms!important;transition-duration:.01ms!important}
    }
  

    /* الواجهة قبل بدء اللعبة: نفس بوابة التشغيل المعتمدة في افتح الصندوق. */
    .order-page.pre-start .groups-canvas,
    .order-page.pre-start .game-logo,
    .order-page.pre-start .fixed-controls{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .groups-canvas,
    .game-logo,
    .fixed-controls{
      transition:opacity .28s ease,visibility .28s ease;
    }

    .back-btn{
      pointer-events:auto;
      position:absolute;
      left:clamp(16px,2.6vw,34px);
      bottom:0;
      min-width:clamp(78px,8vw,108px);
      height:clamp(34px,4.8vh,44px);
      border:2.5px solid #111;
      border-radius:11px;
      background:#efd553;
      color:#111;
      font-size:clamp(14px,1.7vw,19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px,2vw,24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .back-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    .start-gate .celebration-card{
      position:relative;
      width:min(520px,86vw);
      min-height:clamp(250px,40vh,370px);
      border:2px solid rgba(255,255,255,.86);
      border-radius:28px;
      background:rgba(255,255,255,.78);
      -webkit-backdrop-filter:blur(9px);
      backdrop-filter:blur(9px);
      box-shadow:0 18px 45px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.72);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(22px,4.6vw,44px);
      pointer-events:auto;
      animation:startCardPop .62s cubic-bezier(.2,1.12,.22,1) both;
      overflow:hidden;
    }

    .start-gate .celebration-card::before{
      content:"";
      position:absolute;
      width:92%;
      aspect-ratio:1;
      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(239,213,83,.32) 0%,rgba(239,213,83,.14) 34%,rgba(255,255,255,0) 68%);
      animation:startGlow 2.4s ease-in-out infinite;
      pointer-events:none;
    }

    .start-gate .celebration-icon{
      position:relative;
      z-index:1;
      width:clamp(92px,17vw,144px);
      height:clamp(92px,17vw,144px);
      margin-bottom:clamp(12px,2.6vw,20px);
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
      animation:startIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s;
    }

    .start-gate .celebration-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#102b57;
      font-size:clamp(34px,6.2vw,64px);
      line-height:1.05;
      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    .start-gate .celebration-subtitle{
      position:relative;
      z-index:1;
      margin:clamp(8px,1.7vw,14px) 0 0;
      color:#26364a;
      font-size:clamp(17px,2.7vw,28px);
      line-height:1.35;
      font-weight:800;
    }

    .start-gate .celebration-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-top:clamp(22px,4vw,34px);
    }

    .start-gate .activity-start-btn{
      min-width:clamp(150px,23vw,220px);
      height:clamp(44px,6.4vh,58px);
      border:3px solid #111;
      border-radius:15px;
      background:linear-gradient(180deg,#2fa7f2 0%,#1688d3 56%,#0d6fb4 100%);
      color:#fff;
      font-size:clamp(17px,2.5vw,25px);
      font-weight:900;
      line-height:1;
      padding:0 clamp(20px,3vw,32px);
      box-shadow:0 5px 0 rgba(0,0,0,.22);
      cursor:pointer;
      white-space:nowrap;
    }

    .start-gate .celebration-spark{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 18px rgba(239,213,83,.86);
      animation:startSpark 1.8s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
    }

    .start-gate .spark-one{left:18%;top:26%;animation-delay:.1s}
    .start-gate .spark-two{right:17%;top:31%;animation-delay:.55s}
    .start-gate .spark-three{left:24%;bottom:24%;animation-delay:.85s}
    .start-gate .spark-four{right:23%;bottom:27%;animation-delay:1.15s}

    /* لا تعاد حركة الحروف المثبتة عند العمل على كلمة أخرى. */
    .accepted-token{animation:none}
    .accepted-token.is-new{animation:acceptedPop .26s cubic-bezier(.2,.9,.2,1) both}

    /* اكتمال كل كلمة مستقل: حرفًا بعد حرف، ثم تكبر الكلمة كلها قليلًا. */
    .order-group.is-completing .accepted-token{
      animation:completedLetterWave .46s cubic-bezier(.18,.92,.2,1) both;
      animation-delay:calc(var(--wave-index,0) * 120ms);
    }

    .order-group.is-completing .slot-tray,
    .order-group.is-completing .sequence-shell{
      animation:completedWholeWord .42s cubic-bezier(.18,.92,.2,1) both;
      animation-delay:calc((var(--wave-count,1) - 1) * 120ms + 470ms);
    }

    .group-celebration{display:none!important}

    @keyframes completedLetterWave{
      0%,100%{transform:scale(1)}
      48%{transform:scale(1.17) translateY(-4px)}
    }

    @keyframes completedWholeWord{
      0%,100%{transform:scale(1)}
      55%{transform:scale(1.055)}
    }

    @keyframes startCardPop{
      0%{opacity:0;transform:scale(.82) translateY(20px)}
      70%{opacity:1;transform:scale(1.035) translateY(0)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }

    @keyframes startIconPop{
      0%{opacity:0;transform:scale(.5) rotate(-12deg)}
      72%{opacity:1;transform:scale(1.12) rotate(3deg)}
      100%{opacity:1;transform:scale(1) rotate(0)}
    }

    @keyframes startGlow{
      0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(.92)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
    }

    @keyframes startSpark{
      0%,100%{opacity:.25;transform:scale(.72)}
      45%{opacity:1;transform:scale(1.22)}
    }

    @media(max-width:430px){
      .start-gate .celebration-card{
        width:min(360px,88vw);
        min-height:clamp(250px,42vh,360px);
        border-radius:24px;
      }
      .back-btn{left:12px;height:40px;min-width:82px;font-size:15px;padding:0 14px}
    }

    @media(prefers-reduced-motion:reduce){
      .order-group.is-completing .accepted-token,
      .order-group.is-completing .slot-tray,
      .order-group.is-completing .sequence-shell,
      .start-gate .celebration-card,
      .start-gate .celebration-icon{
        animation-duration:.01ms!important;
        animation-delay:0ms!important;
      }
    }

  </style>
</head>
<body>
  <main class="order-page theme-classic pre-start" id="orderPage" data-font="default">
    <div class="theme-background" aria-hidden="true"></div>
    <img class="game-logo" src="logo.PNG" alt="" onerror="this.style.display='none'">

    <section class="stage" id="stage" aria-label="لعبة الترتيب">
      <div class="groups-canvas" id="groupsCanvas"></div>
    </section>

    <nav class="fixed-controls" aria-label="التنقل بين الأسئلة">
      <button class="back-btn" id="backBtn" type="button">رجوع</button>
      <div class="right-controls" id="questionNavigation">
        <button class="control-btn previous-btn" id="previousBtn" type="button">السابق</button>
        <button class="control-btn next-btn" id="nextBtn" type="button" disabled>التالي</button>
      </div>
    </nav>

    <section class="activity-overlay start-gate is-visible" id="startGate" aria-hidden="false">
      <div class="celebration-card activity-start-card" role="dialog" aria-modal="true" aria-labelledby="startGateTitle">
        <span class="celebration-spark spark-one" aria-hidden="true"></span>
        <span class="celebration-spark spark-two" aria-hidden="true"></span>
        <span class="celebration-spark spark-three" aria-hidden="true"></span>
        <span class="celebration-spark spark-four" aria-hidden="true"></span>
        <svg class="celebration-icon" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="startBlue" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#2fa7f2"/>
              <stop offset="100%" stop-color="#0d6fb4"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.76)" stroke="rgba(255,255,255,.92)" stroke-width="5"/>
          <circle cx="60" cy="60" r="35" fill="url(#startBlue)"/>
          <path d="M52 42l27 18-27 18z" fill="#fff"/>
        </svg>
        <h1 class="celebration-title" id="startGateTitle">ابدأ اللعبة</h1>
        <p class="celebration-subtitle">اضغط للبدء وتشغيل الصوت</p>
        <div class="celebration-actions">
          <button class="start-btn activity-start-btn" id="startBtn" type="button">تشغيل</button>
        </div>
      </div>
    </section>

    <section class="activity-overlay" id="finishView" aria-hidden="true">
      <div class="celebration-confetti finish-confetti" id="finishConfetti" aria-hidden="true">
        <span style="left:5%;--confetti-color:#1688d3;--confetti-drift:-42px;--confetti-rotate:18deg"></span>
        <span style="left:13%;--confetti-color:#f47a45;--confetti-drift:35px;--confetti-rotate:62deg"></span>
        <span style="left:22%;--confetti-color:#e91e63;--confetti-drift:-25px;--confetti-rotate:103deg"></span>
        <span style="left:31%;--confetti-color:#43a047;--confetti-drift:46px;--confetti-rotate:144deg"></span>
        <span style="left:40%;--confetti-color:#8e24aa;--confetti-drift:-38px;--confetti-rotate:175deg"></span>
        <span style="left:49%;--confetti-color:#ffd166;--confetti-drift:18px;--confetti-rotate:32deg"></span>
        <span style="left:58%;--confetti-color:#06b6d4;--confetti-drift:-48px;--confetti-rotate:78deg"></span>
        <span style="left:67%;--confetti-color:#efd553;--confetti-drift:40px;--confetti-rotate:119deg"></span>
        <span style="left:76%;--confetti-color:#1688d3;--confetti-drift:-30px;--confetti-rotate:156deg"></span>
        <span style="left:85%;--confetti-color:#f47a45;--confetti-drift:28px;--confetti-rotate:47deg"></span>
        <span style="left:94%;--confetti-color:#e91e63;--confetti-drift:-36px;--confetti-rotate:92deg"></span>
      </div>
      <div class="overlay-card finish-card" id="finishCard" role="status" aria-live="polite">
        <svg class="finish-trophy" id="finishTrophy" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="finishGold" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#fff08a"/><stop offset="45%" stop-color="#efd553"/><stop offset="100%" stop-color="#f4a51f"/>
            </linearGradient>
            <linearGradient id="finishBlue" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#24a6ef"/><stop offset="100%" stop-color="#116eb5"/>
            </linearGradient>
          </defs>
          <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.90)" stroke-width="5"/>
          <path d="M38 26h44v13c0 22-8 35-22 38C46 74 38 61 38 39V26z" fill="url(#finishGold)" stroke="#111" stroke-opacity=".16" stroke-width="2"/>
          <path d="M38 36H23c1 17 9 28 22 30M82 36h15c-1 17-9 28-22 30" fill="none" stroke="url(#finishGold)" stroke-width="8" stroke-linecap="round"/>
          <path d="M55 76h10v13H55z" fill="#e7a51d"/><path d="M42 89h36v10H42z" fill="url(#finishBlue)"/><path d="M36 99h48v8H36z" fill="#102b57" opacity=".92"/>
          <path d="M60 34l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L60 60.6 49.6 66l2-11.6-8.5-8.2 11.7-1.7L60 34z" fill="#fff" opacity=".92"/>

        </div>
      </div>
    </section>
  </main>

  <script>
  (() => {
    "use strict";

    const PAYLOAD_KEY = "sandooq_order_payload_v1";
    const DRAFT_KEY = "sandooq_order_draft_v1";
    const THEMES = ["classic","classroom","sky-clouds","forest","math","english","flowers","national-day","founding-day"];

    const page = document.getElementById("orderPage");
    const stage = document.getElementById("stage");
    const themeBackground = page.querySelector(".theme-background");
    const fixedControls = page.querySelector(".fixed-controls");
    const groupsCanvas = document.getElementById("groupsCanvas");
    const backBtn = document.getElementById("backBtn");
    const previousBtn = document.getElementById("previousBtn");
    const nextBtn = document.getElementById("nextBtn");
    const startGate = document.getElementById("startGate");
    const startBtn = document.getElementById("startBtn");
    const finishView = document.getElementById("finishView");
    const restartBtn = document.getElementById("restartBtn");

    let payload = null;
    let questionIndex = 0;
    let questionStates = [];
    let state = null;
    let selectedItem = null;
    let suppressClickUntil = 0;
    let activeDragCleanup = null;
    let safariTimers = [];
    let layoutFrame = 0;
    let introFrameId = null;
    let gameStarted = false;
    let finishSequenceToken = 0;
    let finishSequenceTimers = [];

    function getParam(name){
      try{return new URLSearchParams(location.search).get(name) || ""}
      catch(_){return ""}
    }

    function normalizeTheme(value){
      const theme = String(value || "").trim().toLowerCase();
      return THEMES.includes(theme) ? theme : "classic";
    }

    function normalizePayload(raw){
      const mode = ["letters","words","images"].includes(raw?.contentMode) ? raw.contentMode : "letters";
      const questions = (Array.isArray(raw?.questions) ? raw.questions : []).map((question,index)=>({
        id:String(question?.id || `question-${index + 1}`),
        text:String(question?.text || ""),
        images:(Array.isArray(question?.images) ? question.images : []).map((image,imageIndex)=>({
          id:`image-${index}-${imageIndex}`,
          name:String(image?.name || image?.imageName || ""),
          data:String(image?.data || image?.imageData || image?.image || "")
        })).filter((image)=>Boolean(image.data))
      })).filter((question)=>mode === "images" ? question.images.length >= 2 : Boolean(question.text.trim()));

      return {
        gameName:String(raw?.gameName || raw?.name || "الترتيب").trim() || "الترتيب",
        theme:normalizeTheme(raw?.theme || raw?.selectedTheme || getParam("theme")),
        contentMode:mode,
        soundEnabled:raw?.soundEnabled !== false && (!raw?.sounds || raw.sounds.enabled !== false),
        fontFamily:["default","arial","traditional"].includes(raw?.fontFamily) ? raw.fontFamily : "default",
        questions
      };
    }

    function demoPayload(){
      return normalizePayload({
        gameName:"الترتيب",
        theme:getParam("theme") || "classroom",
        contentMode:"letters",
        questions:[{text:"لعبة سباق الحروف"}]
      });
    }

    function openDb(){
      return new Promise((resolve,reject)=>{
        const request = indexedDB.open("sandooq_edu_games_v1",1);
        request.onupgradeneeded = ()=>{
          const db = request.result;
          if (!db.objectStoreNames.contains("payloads")) db.createObjectStore("payloads",{keyPath:"key"});
        };
        request.onsuccess = ()=>resolve(request.result);
        request.onerror = ()=>reject(request.error || new Error("db failed"));
      });
    }

    async function readIndexedPayload(key){
      const db = await openDb();
      return new Promise((resolve,reject)=>{
        const tx = db.transaction("payloads","readonly");
        const request = tx.objectStore("payloads").get(key);
        request.onsuccess = ()=>resolve(request.result?.payload || null);
        request.onerror = ()=>reject(request.error || new Error("read failed"));
      });
    }

    async function loadPayload(){
      const payloadId = getParam("payloadId");
      let raw = null;

      if (payloadId) {
        try{raw = await readIndexedPayload(`order:${payloadId}`)}catch(_){}
        if (!raw) {
          try{
            const stored = sessionStorage.getItem(`${PAYLOAD_KEY}_${payloadId}`);
            if (stored) raw = JSON.parse(stored);
          }catch(_){}
        }
      }

      if (!raw) {
        for (const key of [PAYLOAD_KEY,DRAFT_KEY]) {
          try{
            const stored = sessionStorage.getItem(key);
            if (stored) {
              raw = JSON.parse(stored);
              break;
            }
          }catch(_){}
        }
      }

      payload = raw ? normalizePayload(raw) : demoPayload();
      if (!payload.questions.length) payload = demoPayload();
      document.title = `${payload.gameName} - صندوق الألعاب التعليمية`;
      THEMES.forEach((theme)=>page.classList.remove(`theme-${theme}`));
      page.classList.add(`theme-${payload.theme}`);
      page.dataset.font = payload.fontFamily;
    }

    function cleanText(value){
      return String(value || "").replace(/\s+/g," ").trim();
    }

    function graphemes(value){
      const text = String(value || "");
      try{
        if (Intl?.Segmenter) {
          return Array.from(new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(text),(part)=>part.segment);
        }
      }catch(_){}
      return Array.from(text);
    }

    function detectDirection(text){
      const value = String(text || "");
      const arabic = (value.match(/[\u0600-\u06ff]/g) || []).length;
      const latin = (value.match(/[A-Za-z]/g) || []).length;
      return arabic >= latin ? "rtl" : "ltr";
    }

    function shuffle(values){
      const list = values.slice();
      for (let i=list.length-1;i>0;i-=1) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i],list[j]] = [list[j],list[i]];
      }
      if (list.length > 1 && list.every((value,index)=>value === values[index])) {
        [list[0],list[1]] = [list[1],list[0]];
      }
      return list;
    }

    function makeGroup(contents,groupIndex,type){
      const items = contents.map((content,index)=>({
        id:`q${questionIndex}-g${groupIndex}-i${index}-${Math.random().toString(36).slice(2,7)}`,
        content,
        originalIndex:index,
        groupIndex,
        type
      }));
      return {
        items,
        bank:shuffle(items.map((item)=>item.id)),
        slots:Array(items.length).fill(null),
        completed:false,
        celebrating:false,
        lastAcceptedSlot:-1,
        wrongPulse:false,
        wrongSlotIndex:-1
      };
    }

    function createState(index){
      const question = payload.questions[index];
      const mode = payload.contentMode;
      const direction = mode === "images" ? "rtl" : detectDirection(question.text);
      let groups = [];

      if (mode === "letters") {
        groups = cleanText(question.text).split(/\s+/).filter(Boolean).map((word,groupIndex)=>
          makeGroup(graphemes(word),groupIndex,"letter")
        );
      } else if (mode === "words") {
        groups = [makeGroup(cleanText(question.text).split(/\s+/).filter(Boolean),0,"word")];
      } else {
        groups = [makeGroup(question.images,0,"image")];
      }

      return {direction,groups,completed:false};
    }

    function currentState(){
      if (!questionStates[questionIndex]) questionStates[questionIndex] = createState(questionIndex);
      state = questionStates[questionIndex];
      return state;
    }

    function itemById(group,id){
      return group.items.find((item)=>item.id === id) || null;
    }

    function expectedContent(group,slotIndex){
      return group.items[slotIndex]?.content;
    }

    function removeFromBank(group,itemId){
      const index = group.bank.indexOf(itemId);
      if (index >= 0) group.bank.splice(index,1);
    }

    function isCorrectForSlot(group,item,slotIndex){
      if (!item) return false;
      if (item.type === "image") return item.originalIndex === slotIndex;
      return String(item.content) === String(expectedContent(group,slotIndex));
    }

    const sfx = (()=>{
      let context = null;
      let master = null;
      const buffers = new Map();
      const loading = new Map();
      const activeSources = new Set();

      function enabled(){return payload?.soundEnabled !== false}

      function ensure(){
        try{
          context ||= new (window.AudioContext || window.webkitAudioContext)();
          if (!master && context) {
            master = context.createGain();
            master.gain.value = .92;
            master.connect(context.destination);
          }
          if (context?.state === "suspended") context.resume();
        }catch(_){}
        return context;
      }

      async function load(name){
        if (buffers.has(name)) return buffers.get(name);
        if (loading.has(name)) return loading.get(name);
        const promise = (async()=>{
          const ctx = ensure();
          if (!ctx) return null;
          try{
            const response = await fetch(SOUND_DATA[name]);
            const arrayBuffer = await response.arrayBuffer();
            const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
            buffers.set(name,decoded);
            return decoded;
          }catch(_){return null}
        })();
        loading.set(name,promise);
        const result = await promise;
        loading.delete(name);
        return result;
      }

      async function play(name,volume=1,delay=0){
        if (!enabled()) return;
        const ctx = ensure();
        if (!ctx || !master) return;
        const buffer = await load(name);
        if (!buffer) return;
        try{
          const source = ctx.createBufferSource();
          const gain = ctx.createGain();
          gain.gain.value = Math.max(0,Math.min(1.4,volume));
          source.buffer = buffer;
          source.connect(gain).connect(master);
          activeSources.add(source);
          source.onended = ()=>{
            activeSources.delete(source);
            try{source.disconnect()}catch(_){}
            try{gain.disconnect()}catch(_){}
          };
          source.start(ctx.currentTime + Math.max(0,delay));
        }catch(_){}
      }

      function unlock(){
        ensure();
        Object.keys(SOUND_DATA).forEach((name)=>{load(name)});
      }

      function ready(name){return load(name)}

      function stop(){
        activeSources.forEach((source)=>{
          try{source.stop(0)}catch(_){}
          try{source.disconnect()}catch(_){}
        });
        activeSources.clear();
      }

      function close(){
        stop();
        try{context?.close()}catch(_){}
      }
      return {unlock,play,ready,stop,close};
    })();

    const themeAudio = (()=>{
      const files = {
        default:"sounds/theme-default.mp3?v=1",
        "sky-clouds":"sounds/theme-sky-clouds.mp3?v=1",
        "national-day":"sounds/theme-national-day.mp3?v=1",
        "founding-day":"sounds/theme-founding-day.mp3?v=1"
      };
      let audio = null;
      let fadeTimer = null;

      function enabled(){return payload?.soundEnabled !== false}
      function key(theme){return ["sky-clouds","national-day","founding-day"].includes(theme) ? theme : "default"}

      function ensure(theme){
        const src = files[key(theme)];
        if (!audio || audio.dataset.src !== src) {
          stop();
          audio = new Audio(src);
          audio.dataset.src = src;
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = 1;
          audio.setAttribute("playsinline","");
          audio.setAttribute("webkit-playsinline","");
        }
        return audio;
      }

      function preload(theme){
        if (!enabled()) return;
        try{ensure(theme).load()}catch(_){}
      }

      function play(theme){
        if (!enabled()) return;
        const target = ensure(theme);
        try{
          target.pause();
          target.currentTime = 0;
          target.volume = 1;
          const promise = target.play();
          promise?.catch?.(()=>{});
        }catch(_){}
      }

      function stop(){
        if (fadeTimer) clearInterval(fadeTimer);
        fadeTimer = null;
        try{audio?.pause?.();if(audio) audio.currentTime=0}catch(_){}
      }

      function fadeOut(duration=300){
        if (!audio || audio.paused) {stop();return}
        if (fadeTimer) clearInterval(fadeTimer);
        const startVolume = audio.volume;
        const started = performance.now();
        fadeTimer = setInterval(()=>{
          const progress = Math.min(1,(performance.now()-started)/duration);
          audio.volume = Math.max(0,startVolume*(1-progress));
          if (progress >= 1) {
            clearInterval(fadeTimer);
            fadeTimer = null;
            stop();
          }
        },30);
      }

      return {preload,play,stop,fadeOut};
    })();

    function tokenLabel(item){
      if (item.type === "image") return item.content.name || `الصورة ${item.originalIndex + 1}`;
      return String(item.content);
    }

    function createAccepted(item,slotIndex,group){
      const accepted = document.createElement("div");
      accepted.className = `accepted-token ${item.type === "word" ? "word-token" : ""} ${item.type === "image" ? "image-token" : ""} ${group?.lastAcceptedSlot === slotIndex ? "is-new" : ""}`.trim();
      accepted.style.setProperty("--wave-index",String(slotIndex));
      if (item.type === "image") {
        const image = document.createElement("img");
        image.src = item.content.data;
        image.alt = tokenLabel(item);
        accepted.appendChild(image);
      } else {
        accepted.textContent = String(item.content);
        accepted.dir = "auto";
      }
      return accepted;
    }

    function answerFirstEmptySlot(groupIndex,itemId){
      const group = state.groups[groupIndex];
      if (!group || group.completed || !group.bank.includes(itemId)) return;
      const slotIndex = group.slots.findIndex((slotId)=>!slotId);
      if (slotIndex < 0) return;
      acceptItem(groupIndex,itemId,slotIndex);
    }

    function firstEmptySlotIndex(group){
      return group?.slots?.findIndex((slotId)=>!slotId) ?? -1;
    }

    function flashWrong(groupIndex,itemId){
      const group = state.groups[groupIndex];
      if (!group) return;
      const slotIndex = firstEmptySlotIndex(group);
      if (slotIndex < 0) return;
      group.wrongPulse = true;
      group.wrongSlotIndex = slotIndex;
      sfx.play("wrong",1);
      render();
      requestAnimationFrame(()=>{
        const token = groupsCanvas.querySelector(`[data-item-id="${itemId}"]`);
        const slot = groupsCanvas.querySelector(`[data-group-index="${groupIndex}"][data-slot-index="${slotIndex}"]`);
        token?.classList.add("is-wrong");
        slot?.classList.add("is-wrong-target");
      });
      window.setTimeout(()=>{
        group.wrongPulse = false;
        group.wrongSlotIndex = -1;
        selectedItem = null;
        render();
      },620);
    }

    function completeGroup(groupIndex){
      const group = state.groups[groupIndex];
      if (!group || group.completed) return;
      group.completed = true;
      group.celebrating = true;
      sfx.play("complete",1,.06);
      state.completed = state.groups.every((entry)=>entry.completed);
      render();
      const waveDuration = Math.max(900,group.items.length * 120 + 680);
      window.setTimeout(()=>{
        group.celebrating = false;
        render();
      },waveDuration);
    }

    function acceptItem(groupIndex,itemId,slotIndex){
      const group = state.groups[groupIndex];
      const item = itemById(group,itemId);
      if (!group || !item || group.completed || group.slots[slotIndex]) return false;
      if (!isCorrectForSlot(group,item,slotIndex)) {
        flashWrong(groupIndex,itemId);
        return false;
      }

      removeFromBank(group,itemId);
      group.slots[slotIndex] = itemId;
      group.lastAcceptedSlot = slotIndex;
      selectedItem = null;
      sfx.play("place",.95);
      render();

      window.setTimeout(()=>{
        if (group.lastAcceptedSlot === slotIndex) {
          group.lastAcceptedSlot = -1;
          if (!group.celebrating) render();
        }
      },650);

      if (group.slots.every(Boolean)) window.setTimeout(()=>completeGroup(groupIndex),300);
      return true;
    }

    function createToken(item){
      const token = document.createElement("button");
      token.type = "button";
      token.className = `order-token ${item.type === "word" ? "word-token" : ""} ${item.type === "image" ? "image-token" : ""}`.trim();
      token.dataset.itemId = item.id;
      token.dataset.groupIndex = String(item.groupIndex);
      token.setAttribute("aria-label",tokenLabel(item));
      token.classList.toggle("is-selected",selectedItem?.groupIndex === item.groupIndex && selectedItem?.itemId === item.id);

      if (item.type === "image") {
        const image = document.createElement("img");
        image.src = item.content.data;
        image.alt = tokenLabel(item);
        token.appendChild(image);
      } else {
        token.textContent = String(item.content);
        token.dir = "auto";
      }

      attachPointerDrag(token,item);
      token.addEventListener("click",()=>{
        if (Date.now() < suppressClickUntil) return;
        answerFirstEmptySlot(item.groupIndex,item.id);
      });
      return token;
    }

    function cancelActiveDrag(){
      const cleanup = activeDragCleanup;
      activeDragCleanup = null;
      try{cleanup?.()}catch(_){}
      document.querySelectorAll(".drag-ghost").forEach((node)=>node.remove());
      groupsCanvas.querySelectorAll(".order-slot.drag-over").forEach((slot)=>slot.classList.remove("drag-over"));
      groupsCanvas.querySelectorAll(".order-token.is-drag-source").forEach((token)=>token.classList.remove("is-drag-source"));
    }

    function magneticTarget(groupIndex,clientX,clientY){
      const group = state.groups[groupIndex];
      if (!group || group.completed) return null;
      const slotIndex = firstEmptySlotIndex(group);
      if (slotIndex < 0) return null;
      const slot = groupsCanvas.querySelector(`[data-group-index="${groupIndex}"][data-slot-index="${slotIndex}"]`);
      if (!slot || slot.classList.contains("is-filled")) return null;
      const rect = slot.getBoundingClientRect();
      const radius = Math.min(66,Math.max(36,Math.min(rect.width,rect.height) * .68));
      const dx = Math.max(rect.left - clientX,0,clientX - rect.right);
      const dy = Math.max(rect.top - clientY,0,clientY - rect.bottom);
      if (Math.hypot(dx,dy) > radius) return null;
      return {slot,slotIndex,rect};
    }

    function attachPointerDrag(element,item){
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let sourceRect = null;
      let dragging = false;
      let settling = false;
      let ghost = null;
      let settleTimer = 0;
      let moveFrame = 0;
      let pendingX = 0;
      let pendingY = 0;

      const clearTargets = ()=>groupsCanvas.querySelectorAll(".order-slot.drag-over").forEach((slot)=>slot.classList.remove("drag-over"));
      const paintGhost = ()=>{
        moveFrame = 0;
        if (!ghost) return;
        ghost.style.left = `${pendingX}px`;
        ghost.style.top = `${pendingY}px`;
      };
      const queueGhost = (x,y)=>{
        pendingX = x;
        pendingY = y;
        if (!moveFrame) moveFrame = requestAnimationFrame(paintGhost);
      };
      const cleanup = ()=>{
        clearTargets();
        if (moveFrame) cancelAnimationFrame(moveFrame);
        moveFrame = 0;
        if (settleTimer) clearTimeout(settleTimer);
        settleTimer = 0;
        try{
          if (pointerId !== null && element.hasPointerCapture?.(pointerId)) element.releasePointerCapture(pointerId);
        }catch(_){}
        element.classList.remove("is-drag-source");
        ghost?.getAnimations?.().forEach((animation)=>animation.cancel());
        ghost?.remove();
        ghost = null;
        pointerId = null;
        dragging = false;
        settling = false;
        if (activeDragCleanup === cleanup) activeDragCleanup = null;
      };

      element.addEventListener("pointerdown",(event)=>{
        if (event.button > 0 || state.groups[item.groupIndex]?.completed) return;
        cancelActiveDrag();
        pointerId = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        sourceRect = element.getBoundingClientRect();
        activeDragCleanup = cleanup;
        try{element.setPointerCapture?.(pointerId)}catch(_){}
      });

      element.addEventListener("pointermove",(event)=>{
        if (event.pointerId !== pointerId) return;
        const distance = Math.hypot(event.clientX - startX,event.clientY - startY);
        if (!dragging && distance > 6) {
          dragging = true;
          ghost = element.cloneNode(true);
          ghost.classList.remove("is-selected","is-drag-source");
          ghost.classList.add("drag-ghost");
          ghost.style.width = `${sourceRect.width}px`;
          ghost.style.height = `${sourceRect.height}px`;
          document.body.appendChild(ghost);
          element.classList.add("is-drag-source");
        }
        if (!dragging || !ghost) return;
        queueGhost(event.clientX,event.clientY);
        clearTargets();
        const target = magneticTarget(item.groupIndex,event.clientX,event.clientY);
        target?.slot.classList.add("drag-over");
        event.preventDefault();
      });

      const animateBackAndCleanup = (clientX,clientY)=>{
        if (!ghost || !sourceRect) {
          cleanup();
          return;
        }
        const centerX = sourceRect.left + sourceRect.width / 2;
        const centerY = sourceRect.top + sourceRect.height / 2;
        ghost.animate([
          {left:`${clientX}px`,top:`${clientY}px`,transform:"translate(-50%,-50%) scale(1.04)",opacity:.96},
          {left:`${centerX}px`,top:`${centerY}px`,transform:"translate(-50%,-50%) scale(1)",opacity:.20}
        ],{duration:250,easing:"cubic-bezier(.22,.72,.24,1)",fill:"forwards"});
        settleTimer = window.setTimeout(cleanup,245);
      };

      const finish = (event)=>{
        if (event.pointerId !== pointerId) return;
        if (!dragging) {
          cleanup();
          return;
        }

        suppressClickUntil = Date.now() + 420;
        settling = true;
        const target = magneticTarget(item.groupIndex,event.clientX,event.clientY);
        if (!target) {
          animateBackAndCleanup(event.clientX,event.clientY);
          return;
        }

        const group = state.groups[item.groupIndex];
        const correct = isCorrectForSlot(group,item,target.slotIndex);
        const destination = correct ? target.rect : sourceRect;
        const centerX = destination.left + destination.width / 2;
        const centerY = destination.top + destination.height / 2;

        clearTargets();
        target.slot.classList.add("drag-over");
        ghost?.animate([
          {left:`${event.clientX}px`,top:`${event.clientY}px`,transform:"translate(-50%,-50%) scale(1.04)",opacity:.96},
          {left:`${centerX}px`,top:`${centerY}px`,transform:`translate(-50%,-50%) scale(${correct ? .90 : 1})`,opacity:correct ? .28 : .82}
        ],{
          duration:correct ? 165 : 300,
          easing:correct ? "cubic-bezier(.18,.82,.18,1)" : "cubic-bezier(.22,.72,.24,1)",
          fill:"forwards"
        });

        settleTimer = window.setTimeout(()=>{
          if (correct) acceptItem(item.groupIndex,item.id,target.slotIndex);
          else flashWrong(item.groupIndex,item.id);
          cleanup();
        },correct ? 150 : 285);
      };

      element.addEventListener("pointerup",finish);
      element.addEventListener("pointercancel",cleanup);
      element.addEventListener("lostpointercapture",()=>{
        if (!settling && dragging && activeDragCleanup === cleanup) cleanup();
      });
    }

    function createSlot(group,groupIndex,slotIndex,itemType){
      const slot = document.createElement("button");
      slot.type = "button";
      slot.className = `order-slot ${itemType === "image" ? "image-slot" : ""}`.trim();
      slot.dataset.groupIndex = String(groupIndex);
      slot.dataset.slotIndex = String(slotIndex);
      const id = group.slots[slotIndex];
      slot.classList.toggle("is-filled",Boolean(id));

      if (id) {
        const item = itemById(group,id);
        if (item) slot.appendChild(createAccepted(item,slotIndex,group));
        if (group.lastAcceptedSlot === slotIndex) {
          const check = document.createElement("span");
          check.className = "drop-check";
          check.textContent = "✓";
          slot.appendChild(check);
        }
      }

      if (group.wrongPulse && group.wrongSlotIndex === slotIndex) {
        slot.classList.add("show-wrong");
        const wrong = document.createElement("span");
        wrong.className = "wrong-mark";
        wrong.textContent = "×";
        slot.appendChild(wrong);
      }

      return slot;
    }

    function renderLetterGroup(group,groupIndex){
      const wrapper = document.createElement("section");
      wrapper.className = `order-group ${group.wrongPulse ? "show-wrong" : ""} ${group.celebrating ? "is-completing" : ""}`.trim();
      wrapper.style.setProperty("--wave-count",String(group.items.length));
      wrapper.dir = state.direction;

      const bank = document.createElement("div");
      bank.className = "token-bank";
      bank.dir = state.direction;
      group.bank.forEach((id)=>{
        const item = itemById(group,id);
        if (item) bank.appendChild(createToken(item));
      });

      const tray = document.createElement("div");
      tray.className = "slot-tray";
      tray.dir = state.direction;
      group.slots.forEach((_,slotIndex)=>tray.appendChild(createSlot(group,groupIndex,slotIndex,"letter")));

      wrapper.append(bank,tray);
      return wrapper;
    }

    function renderSequenceGroup(group,groupIndex){
      const wrapper = document.createElement("section");
      wrapper.className = `order-group ${group.wrongPulse ? "show-wrong" : ""} ${group.celebrating ? "is-completing" : ""}`.trim();
      wrapper.style.setProperty("--wave-count",String(group.items.length));
      wrapper.dir = state.direction;

      const bank = document.createElement("div");
      bank.className = "token-bank";
      bank.dir = state.direction;
      group.bank.forEach((id)=>{
        const item = itemById(group,id);
        if (item) bank.appendChild(createToken(item));
      });

      const sequence = document.createElement("div");
      sequence.className = "sequence-shell";
      sequence.dir = state.direction;
      group.slots.forEach((_,slotIndex)=>{
        sequence.appendChild(createSlot(group,groupIndex,slotIndex,group.items[0]?.type || "word"));
        if (slotIndex < group.slots.length - 1) {
          const arrow = document.createElement("span");
          arrow.className = "sequence-arrow";
          arrow.textContent = state.direction === "rtl" ? "←" : "→";
          arrow.setAttribute("aria-hidden","true");
          sequence.appendChild(arrow);
        }
      });

      wrapper.append(bank,sequence);
      return wrapper;
    }

    function updateNavigation(){
      previousBtn.hidden = questionIndex <= 0;
      nextBtn.hidden = false;
      nextBtn.disabled = !state.completed;
      nextBtn.textContent = questionIndex >= payload.questions.length - 1 ? "إنهاء" : "التالي";
    }

    function render(){
      groupsCanvas.textContent = "";
      groupsCanvas.dir = state.direction;
      groupsCanvas.classList.toggle("is-sequence-mode",payload.contentMode !== "letters");
      state.groups.forEach((group,index)=>{
        groupsCanvas.appendChild(payload.contentMode === "letters"
          ? renderLetterGroup(group,index)
          : renderSequenceGroup(group,index));
      });
      updateNavigation();
      scheduleLayout();
    }

    function getVisualViewportMetrics(){
      const viewport = window.visualViewport;
      const layoutWidth = Math.max(280,document.documentElement.clientWidth || 0,window.innerWidth || 0);
      const layoutHeight = Math.max(260,page?.clientHeight || 0,document.documentElement.clientHeight || 0,window.innerHeight || 0);
      return {
        width:Math.max(280,Math.min(layoutWidth,Number(viewport?.width) || layoutWidth)),
        height:Math.max(260,Math.min(layoutHeight,Number(viewport?.height) || layoutHeight)),
        offsetLeft:Math.max(0,Number(viewport?.offsetLeft) || 0)
      };
    }

    function syncVisualViewportFrame(){
      const metrics = getVisualViewportMetrics();
      stage.style.left = `${metrics.offsetLeft.toFixed(2)}px`;
      stage.style.right = "auto";
      stage.style.top = "0px";
      stage.style.bottom = "auto";
      stage.style.width = `${metrics.width.toFixed(2)}px`;
      stage.style.height = `${metrics.height.toFixed(2)}px`;
      page.style.setProperty("--visual-viewport-width",`${metrics.width}px`);
      page.style.setProperty("--visual-viewport-height",`${metrics.height}px`);
    }

    function fitCanvas(){
      syncVisualViewportFrame();
      groupsCanvas.style.setProperty("--order-fit-scale","1");
      const availableWidth = Math.max(1,stage.clientWidth - 20);
      const availableHeight = Math.max(1,stage.clientHeight - 104);
      const width = Math.max(1,groupsCanvas.scrollWidth);
      const height = Math.max(1,groupsCanvas.scrollHeight);
      const scale = Math.max(.54,Math.min(1,availableWidth / width,availableHeight / height));
      groupsCanvas.style.setProperty("--order-fit-scale",scale.toFixed(4));
    }

    function scheduleLayout(delay=0){
      cancelAnimationFrame(layoutFrame);
      const run = ()=>{layoutFrame = requestAnimationFrame(fitCanvas)};
      if (delay > 0) window.setTimeout(run,delay);
      else run();
    }

    function collapseSafariBars(){
      safariTimers.forEach((timer)=>clearTimeout(timer));
      safariTimers = [];
      [0,80,220,520,900].forEach((delay)=>{
        safariTimers.push(window.setTimeout(()=>{
          try{window.scrollTo({top:80,left:0,behavior:"auto"})}
          catch(_){window.scrollTo(0,80)}
          scheduleLayout(20);
        },delay));
      });
    }


    function wait(ms){return new Promise((resolve)=>setTimeout(resolve,ms))}

    function clearFinishSequenceTimers(){
      finishSequenceTimers.forEach((timer)=>clearTimeout(timer));
      finishSequenceTimers = [];
    }

    function resetFinishSequenceClasses(){
      finishView.classList.remove("finish-sequence-start","finish-message-in","finish-actions-in","finish-confetti-on");
    }

    function queueFinishStep(token,delay,classNames){
      const timer = setTimeout(()=>{
        if (token !== finishSequenceToken) return;
        classNames.forEach((className)=>finishView.classList.add(className));
      },delay);
      finishSequenceTimers.push(timer);
    }

    function hideFinish(){
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      page.classList.remove("activity-ended");
      finishView.classList.remove("is-visible");
      finishView.setAttribute("aria-hidden","true");
    }

    async function showFinish(){
      cancelActiveDrag();
      const token = ++finishSequenceToken;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      page.classList.add("activity-ended");
      finishView.classList.add("is-visible");
      finishView.setAttribute("aria-hidden","false");

      await sfx.ready("finish");
      if (token !== finishSequenceToken) return;
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      if (token !== finishSequenceToken) return;

      finishView.classList.add("finish-sequence-start");
      void sfx.play("finish",1);
      queueFinishStep(token,2680,["finish-message-in","finish-confetti-on"]);
      queueFinishStep(token,3180,["finish-actions-in"]);
    }

    function easeInOutSine(value){
      return -(Math.cos(Math.PI*value)-1)/2;
    }

    async function playOpeningIntro(){
      if (!page || !stage || !groupsCanvas) return;
      if (introFrameId) {
        cancelAnimationFrame(introFrameId);
        introFrameId = null;
      }

      page.classList.remove("intro-done");
      page.classList.add("intro-playing","intro-camera");
      page.classList.remove("pre-start");

      const holdMs = 2200;
      const zoomMs = 7600;
      const settleMs = 280;
      const startScale = 1;
      const endScale = Number(getComputedStyle(page).getPropertyValue("--intro-bg-final-scale")) || 1.12;
      let startedAt = null;

      const setFrame = (scale)=>{
        if (themeBackground) {
          themeBackground.style.transform = `translate3d(0,0,0) scale(${Number(scale).toFixed(5)})`;
          themeBackground.style.animation = "none";
          const ratio = (scale-startScale)/Math.max(.001,endScale-startScale);
          const saturation = 1.04-ratio*.04;
          themeBackground.style.filter = `saturate(${Math.max(1,Math.min(1.04,saturation))})`;
        }
      };

      if (fixedControls) {
        fixedControls.style.opacity = "0";
        fixedControls.style.transform = "translateY(12px)";
        fixedControls.style.pointerEvents = "none";
      }

      syncVisualViewportFrame();
      fitCanvas();
      setFrame(startScale);
      collapseSafariBars();
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reducedMotion) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startedAt === null) startedAt = now;
            const elapsed = now-startedAt;
            if (elapsed < holdMs) {
              setFrame(startScale);
              introFrameId = requestAnimationFrame(animate);
              return;
            }
            const progress = Math.max(0,Math.min(1,(elapsed-holdMs)/zoomMs));
            const scale = startScale+(endScale-startScale)*easeInOutSine(progress);
            setFrame(scale);
            if (progress < 1) {
              introFrameId = requestAnimationFrame(animate);
              return;
            }
            introFrameId = null;
            resolve();
          };
          introFrameId = requestAnimationFrame(animate);
        });
      } else {
        setFrame(endScale);
      }

      setFrame(endScale);
      collapseSafariBars();
      await wait(settleMs);
      themeAudio.fadeOut(240);
      await wait(260);
      await wait(780);

      syncVisualViewportFrame();
      fitCanvas();
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      page.classList.remove("intro-camera");
      page.classList.add("intro-pre-reveal");
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      page.classList.remove("intro-pre-reveal");
      page.classList.add("intro-reveal");
      await wait(840);
      page.classList.remove("intro-reveal","intro-playing");
      page.classList.add("intro-done");

      if (themeBackground) themeBackground.style.filter = "";
      if (fixedControls) {
        fixedControls.style.opacity = "1";
        fixedControls.style.transform = "none";
        fixedControls.style.pointerEvents = "";
      }
      collapseSafariBars();
    }

    function showQuestion(index){
      if (!Number.isInteger(index) || index < 0 || index >= payload.questions.length) return;
      cancelActiveDrag();
      questionIndex = index;
      selectedItem = null;
      currentState();
      render();
      collapseSafariBars();
    }

    function goPrevious(){
      if (questionIndex <= 0) return;
      showQuestion(questionIndex - 1);
    }

    function goNext(){
      if (!state.completed) return;
      if (questionIndex >= payload.questions.length - 1) {
        void showFinish();
        return;
      }
      showQuestion(questionIndex + 1);
    }

    function goToOrderSettings(){
      cancelActiveDrag();
      sfx.stop();
      themeAudio.stop();
      try{
        const requested = getParam("return");
        const target = requested || "index.html#orderSetup";
        const url = new URL(target,window.location.href);
        if (url.origin === window.location.origin) {
          window.location.href = `${url.pathname}${url.search}${url.hash || "#orderSetup"}`;
          return;
        }
      }catch(_){}
      window.location.href = "index.html#orderSetup";
    }

    function restart(){
      cancelActiveDrag();
      sfx.stop();
      themeAudio.stop();
      hideFinish();
      questionStates = [];
      showQuestion(0);
    }

    backBtn.addEventListener("click",goToOrderSettings);
    previousBtn.addEventListener("click",goPrevious);
    nextBtn.addEventListener("click",goNext);
    restartBtn.addEventListener("click",restart);
    homeBtn.addEventListener("click",()=>{
      sfx.stop();
      themeAudio.stop();
      location.href = "index.html";
    });
    startBtn.addEventListener("click",async(event)=>{
      event.preventDefault();
      event.stopPropagation();
      if (gameStarted) return;
      gameStarted = true;
      sfx.unlock();
      themeAudio.play(payload.theme);
      startGate.classList.remove("is-visible");
      startGate.setAttribute("aria-hidden","true");
      await playOpeningIntro();
      scheduleLayout(80);
    });

    window.addEventListener("resize",()=>{cancelActiveDrag();scheduleLayout(34)},{passive:true});
    window.addEventListener("orientationchange",()=>{
      cancelActiveDrag();
      window.setTimeout(()=>{collapseSafariBars();scheduleLayout(80)},160);
    },{passive:true});
    window.addEventListener("blur",cancelActiveDrag,{passive:true});
    window.addEventListener("pagehide",()=>{
      cancelActiveDrag();
      if (introFrameId) cancelAnimationFrame(introFrameId);
      introFrameId = null;
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      sfx.stop();
      themeAudio.stop();
    },{passive:true});
    document.addEventListener("visibilitychange",()=>{if (document.hidden) cancelActiveDrag()});
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize",()=>scheduleLayout(34),{passive:true});
      window.visualViewport.addEventListener("scroll",()=>scheduleLayout(34),{passive:true});
    }
    document.addEventListener("touchend",collapseSafariBars,{passive:true});
    window.addEventListener("pageshow",()=>{collapseSafariBars();scheduleLayout(60)},{passive:true});
    window.addEventListener("beforeunload",()=>{
      themeAudio.stop();
      sfx.close();
    });

    loadPayload().then(()=>{
      questionStates = [];
      themeAudio.preload(payload.theme);
      void sfx.ready("finish");
      showQuestion(0);
      collapseSafariBars();
    });
  })();
  </script>
</body>
</html>
