<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: moving-question-v7-settle-audio-aligned-film-controls -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#eef5fb">
  <title>السؤال المتحرك - صندوق الألعاب التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --red:#ef4f52;
      --green:#27ad69;
      --question-frame:#354052;
      --question-text:#161616;
      --answer-unified:#1688d3;
      --page-font:"Cairo",Arial,sans-serif;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;
      min-height:100%;
      margin:0;
      color:var(--ink);
      background:#eef5fb;
      -webkit-text-size-adjust:100%;
    }

    /* نفس معالجة Safari المستخدمة في لعبة افتح الصندوق. */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
      font-family:var(--page-font);
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }
    button{font:inherit}
    [hidden]{display:none !important}

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-width:280px;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      isolation:isolate;
      background:#f7fbff;
      direction:ltr;
      user-select:none;
      touch-action:none;
    }

    .theme-background{
      position:absolute;
      inset:-2px;
      z-index:-3;
      background:
        radial-gradient(circle at 15% 16%,rgba(255,255,255,.96) 0 9%,transparent 32%),
        radial-gradient(circle at 86% 10%,rgba(150,213,244,.38),transparent 30%),
        linear-gradient(150deg,#f9fcff 0%,#e8f4fb 54%,#f7f2df 100%);
      background-size:cover;
      background-position:center;
      transform:translate3d(0,0,0) scale(1);
      transform-origin:center center;
      will-change:transform;
    }

    .game-page.theme-classroom .theme-background{
      background-image:
        linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.34)),
        url("theme-classroom-bg-v2.webp?v=2"),
        linear-gradient(150deg,#f9fcff,#e8f4fb 60%,#f7f2df);
    }

    .game-page.theme-sky-clouds .theme-background{
      background-image:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.18)),url("theme-sky-clouds-bg.webp?v=45"),linear-gradient(#58c7f3,#eaf9ff);
    }

    .game-page.theme-forest .theme-background{
      background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),url("theme-forest-bg.webp?v=45"),linear-gradient(#83d4f2,#b9e5b1);
    }

    .game-page.theme-math .theme-background{
      background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url("theme-math-bg.webp?v=45"),linear-gradient(#f5f4e7,#fff);
    }

    .game-page.theme-english .theme-background{
      background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url("theme-english-bg.webp?v=46"),linear-gradient(#72d0d2,#f6ffff);
    }

    .game-logo{
      position:absolute;
      z-index:80;
      top:var(--safe-top);
      left:var(--safe-left);
      width:clamp(62px,6.4vw,98px);
      height:auto;
      max-height:clamp(52px,6.2vw,80px);
      object-fit:contain;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .hud{
      position:absolute;
      top:calc(var(--safe-top) + 12px);
      right:calc(var(--safe-right) + clamp(14px,2vw,28px));
      z-index:22;
      display:flex;
      gap:10px;
      direction:ltr;
    }

    .hud-pill{
      min-width:86px;
      height:44px;
      padding:0 15px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:3px solid #111;
      border-radius:15px;
      background:rgba(255,255,255,.86);
      box-shadow:0 5px 0 rgba(17,17,17,.18);
      font-weight:900;
      font-size:20px;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .timer-track{
      position:absolute;
      z-index:22;
      top:calc(var(--safe-top) + 64px);
      left:50%;
      width:min(56vw,650px);
      height:14px;
      transform:translateX(-50%);
      overflow:hidden;
      border:3px solid #111;
      border-radius:999px;
      background:rgba(255,255,255,.88);
    }

    .timer-fill{height:100%;width:100%;transform-origin:left center;background:linear-gradient(90deg,#28ad6d,#efd553,#ef4f52)}

    .playfield{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-rows:auto minmax(150px,1fr);
      padding:
        calc(var(--safe-top) + clamp(6px,1.2vh,12px))
        0
        calc(var(--safe-bottom) + clamp(66px,9vh,94px))
        0;
      gap:clamp(2px,.7vh,7px);
      direction:ltr;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .strip-zone{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      min-height:0;
      padding-top:0;
    }

    .glass-panel{
      display:none;
    }

    .strip-viewport{
      position:relative;
      width:100%;
      height:clamp(220px,39vh,340px);
      overflow:hidden;
      z-index:2;
      contain:layout paint;
    }

    .question-strip{
      --film-mark-start:clamp(21px,2.3vw,38px);
      --film-mark-end:clamp(31px,3.15vw,50px);
      --film-period:clamp(60px,6.1vw,94px);
      position:absolute;
      inset:0 -2px;
      display:grid;
      grid-template-rows:clamp(12px,1.65vh,17px) minmax(0,1fr) clamp(12px,1.65vh,17px);
      border-top:clamp(2px,.16vw,3px) solid var(--question-frame);
      border-bottom:clamp(2px,.16vw,3px) solid var(--question-frame);
      background:transparent;
      box-shadow:none;
      overflow:hidden;
    }

    .film-edge{
      position:relative;
      background:
        repeating-linear-gradient(90deg,
          transparent 0 var(--film-mark-start),
          rgba(102,107,114,.55) var(--film-mark-start) var(--film-mark-end),
          transparent var(--film-mark-end) var(--film-period)
        ),
        linear-gradient(180deg,rgba(250,250,250,.98),rgba(231,233,236,.98));
      background-position:0 50%,0 0;
      background-repeat:repeat-x,no-repeat;
      background-size:var(--film-period) 100%,100% 100%;
      will-change:background-position;
    }

    .film-edge.top{border-bottom:clamp(2px,.16vw,3px) solid var(--question-frame)}
    .film-edge.bottom{border-top:clamp(2px,.16vw,3px) solid var(--question-frame)}

    .question-window{
      position:relative;
      min-width:0;
      min-height:0;
      overflow:hidden;
      background:linear-gradient(115deg,rgba(255,255,255,.66),rgba(232,241,248,.48));
      backdrop-filter:blur(12px) saturate(1.08);
      -webkit-backdrop-filter:blur(12px) saturate(1.08);
      isolation:isolate;
    }

    .question-content{
      position:absolute;
      inset:0;
      min-width:0;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(8px,1.1vw,18px);
      padding:clamp(7px,1vh,13px) clamp(14px,2vw,34px);
      background:transparent;
      color:var(--question-text);
      will-change:transform,opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .question-content.text-only,.question-content.image-only{justify-content:center}

    .question-text{
      min-width:0;
      max-width:min(72%,1120px);
      flex:0 1 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      text-align:center;
      font-size:clamp(29px,4vw,66px);
      line-height:1.35;
      font-weight:900;
      overflow-wrap:anywhere;
      unicode-bidi:plaintext;
    }

    .question-content.text-only .question-text{max-width:94%}

    .question-image-wrap{
      min-width:0;
      width:clamp(130px,21vw,320px);
      max-width:30%;
      height:calc(100% - clamp(6px,1.4vh,16px));
      flex:0 1 clamp(130px,21vw,320px);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-radius:clamp(14px,1.5vw,24px);
    }

    .question-image{
      display:block;
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      user-select:none;
      -webkit-user-drag:none;
    }

    .answers-zone{
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(12px,2vw,32px);
    }

    .answer-bank{
      width:min(96%,1420px);
      max-height:100%;
      display:flex;
      flex-wrap:wrap;
      align-content:center;
      align-items:center;
      justify-content:center;
      gap:clamp(10px,1.4vw,22px);
      direction:rtl;
    }

    .game-page[data-language="en"] .answer-bank{direction:ltr}

    .answer-card{
      position:relative;
      flex:0 1 clamp(150px,18vw,280px);
      min-width:120px;
      height:clamp(66px,10vh,112px);
      border:clamp(3px,.28vw,5px) solid rgba(15,32,63,.82);
      border-radius:clamp(13px,1.25vw,20px);
      background:var(--answer-color,#1688d3);
      color:#fff;
      box-shadow:none;
      padding:clamp(6px,.7vw,11px) clamp(12px,1.3vw,22px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(10px,1.3vw,20px);
      cursor:pointer;
      overflow:hidden;
      transition:filter .16s ease,transform .16s ease;
      touch-action:manipulation;
      will-change:transform,opacity;
    }

    .answer-card:hover{filter:brightness(1.07);transform:translateY(-2px)}
    .answer-card:active{transform:translateY(2px);box-shadow:none}
    .answer-card:disabled{cursor:default}

    .answer-card.has-both{
      direction:ltr;
      justify-content:space-between;
    }

    .answer-card.has-image:not(.has-text){padding:6px}

    .answer-text{
      min-width:0;
      flex:1 1 auto;
      text-align:center;
      font-size:clamp(25px,3.1vw,48px);
      line-height:1.15;
      font-weight:900;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      unicode-bidi:plaintext;
    }

    .answer-card.has-both .answer-text{direction:rtl;text-align:center}
    .game-page[data-language="en"] .answer-card.has-both .answer-text{direction:ltr}

    .answer-image{
      flex:0 0 auto;
      width:clamp(50px,6.8vw,88px);
      height:calc(100% - 2px);
      object-fit:contain;
      border-radius:10px;
      background:rgba(255,255,255,.92);
    }

    .answer-card.has-image:not(.has-text) .answer-image{width:100%;height:100%;background:transparent}

    .answer-card.has-visible-mark{
      z-index:24;
      overflow:visible;
      isolation:isolate;
    }

    .answer-mark{
      --mark-corner-left:0px;
      --mark-corner-top:0px;
      --mark-corner-scale:.40;
      position:absolute;
      z-index:40;
      left:50%;
      top:50%;
      width:auto;
      height:auto;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      color:#fff;
      font-family:Arial,sans-serif;
      font-weight:1000;
      font-size:clamp(72px,10vw,150px);
      line-height:.82;
      transform:translate(-50%,-50%) scale(.2);
      transform-origin:center center;
      opacity:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      will-change:left,top,transform,opacity;
    }

    .answer-mark.is-correct{
      color:#25ad69;
      text-shadow:0 3px 0 rgba(255,255,255,.96),3px 0 0 rgba(255,255,255,.96),-3px 0 0 rgba(255,255,255,.96),0 -3px 0 rgba(255,255,255,.96),0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-wrong{
      color:#f04747;
      text-shadow:0 3px 0 rgba(255,255,255,.96),3px 0 0 rgba(255,255,255,.96),-3px 0 0 rgba(255,255,255,.96),0 -3px 0 rgba(255,255,255,.96),0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-visible{animation:answerMarkRevealThenCorner 1.34s linear both}
    .answer-card.is-wrong{animation:wrongShake .46s ease both}

    @keyframes answerMarkRevealThenCorner{
      0%{left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.08) rotate(-18deg);animation-timing-function:cubic-bezier(.16,1,.3,1)}
      14%{left:50%;top:50%;opacity:1;transform:translate(-50%,-50%) scale(.48) rotate(-9deg)}
      32%{left:50%;top:50%;opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(4deg)}
      44%{left:50%;top:50%;opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);animation-timing-function:cubic-bezier(.22,.72,.24,1)}
      60%{left:50%;top:50%;opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
      100%{left:var(--mark-corner-left);top:var(--mark-corner-top);opacity:1;transform:translate(-50%,-50%) scale(var(--mark-corner-scale)) rotate(0)}
    }
    @keyframes wrongShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-11px) rotate(-1deg)}38%{transform:translateX(9px) rotate(1deg)}58%{transform:translateX(-7px)}78%{transform:translateX(4px)}}

    .fixed-controls{
      position:absolute;
      z-index:90;
      inset:0;
      pointer-events:none;
    }

    .control-btn{
      position:absolute;
      bottom:calc(var(--safe-bottom) + 7px);
      min-width:clamp(78px,8vw,110px);
      height:clamp(34px,4.8vh,44px);
      border:2.5px solid #111;
      border-radius:11px;
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      color:#111;
      font-size:clamp(14px,1.7vw,19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px,2vw,24px);
      cursor:pointer;
      pointer-events:auto;
      white-space:nowrap;
    }

    .back-btn{
      left:calc(var(--safe-left) + 7px);
      background:var(--yellow);
    }
    .finish-btn{
      right:calc(var(--safe-right) + 7px);
      background:var(--red);
      color:#fff;
    }
    .control-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.20)}

    .activity-overlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:220;
      overflow:hidden;
      padding:clamp(18px,4vw,44px);
      direction:rtl;
      background:rgba(17,17,17,.12);
      pointer-events:none;
    }

    .activity-overlay.is-visible{display:flex}

    .activity-overlay .celebration-card{
      position:relative;
      width:min(390px,82vw);
      min-height:0;
      max-height:calc(100dvh - max(20px,var(--safe-top)) - max(20px,var(--safe-bottom)));
      border:2px solid rgba(255,255,255,.86);
      border-radius:clamp(20px,2.4vw,26px);
      background:rgba(255,255,255,.78);
      -webkit-backdrop-filter:blur(9px);
      backdrop-filter:blur(9px);
      box-shadow:0 18px 45px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.72);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(16px,2.8vw,24px);
      pointer-events:auto;
      overflow:hidden;
    }

    .activity-overlay .celebration-card::before{
      content:"";
      position:absolute;
      width:92%;
      aspect-ratio:1/1;
      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(239,213,83,.32) 0%,rgba(239,213,83,.14) 34%,rgba(255,255,255,0) 68%);
      pointer-events:none;
    }

    .activity-overlay .celebration-icon{
      position:relative;
      z-index:1;
      width:clamp(76px,12vw,106px);
      height:clamp(76px,12vw,106px);
      margin-bottom:clamp(6px,1.2vw,10px);
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
    }

    .activity-overlay .celebration-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#102b57;
      font-size:clamp(30px,4.8vw,48px);
      line-height:1.02;
      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    .activity-overlay .celebration-subtitle{
      position:relative;
      z-index:1;
      margin:clamp(6px,1.1vw,10px) 0 0;
      color:#26364a;
      font-size:clamp(15px,2.1vw,22px);
      line-height:1.25;
      font-weight:800;
    }

    .activity-overlay .celebration-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(8px,1.2vw,12px);
      margin-top:clamp(14px,2.2vw,20px);
      flex-wrap:nowrap;
    }

    .activity-overlay .celebration-actions button{
      min-width:clamp(104px,15vw,145px);
      height:clamp(40px,5.5vh,48px);
      border:3px solid #111;
      border-radius:15px;
      font-size:clamp(15px,2vw,20px);
      font-weight:900;
      line-height:1;
      padding:0 clamp(12px,1.8vw,20px);
      box-shadow:0 5px 0 rgba(0,0,0,.22);
      cursor:pointer;
      white-space:nowrap;
    }

    .activity-overlay .celebration-actions button:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
    .activity-overlay .restart-btn{background:linear-gradient(180deg,#2fa7f2 0%,#1688d3 56%,#0d6fb4 100%);color:#fff}
    .activity-overlay .home-btn{background:linear-gradient(180deg,#ffe56d 0%,#efd553 58%,#dfc13f 100%);color:#111}
    .activity-overlay .activity-start-btn{min-width:clamp(136px,20vw,184px);font-size:clamp(16px,2.1vw,21px);padding-inline:clamp(16px,2.4vw,24px)}

    .activity-overlay .celebration-spark{
      position:absolute;
      z-index:1;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 18px rgba(239,213,83,.86);
      pointer-events:none;
    }
    .activity-overlay .spark-one{left:18%;top:26%;animation-delay:.1s}
    .activity-overlay .spark-two{right:17%;top:31%;animation-delay:.55s}
    .activity-overlay .spark-three{left:24%;bottom:24%;animation-delay:.85s}
    .activity-overlay .spark-four{right:23%;bottom:27%;animation-delay:1.15s}

    .start-gate .celebration-card{animation:startCardPop .62s cubic-bezier(.2,1.12,.22,1) both}
    .start-gate .celebration-card::before{animation:startGlow 2.4s ease-in-out infinite}
    .start-gate .celebration-icon{animation:startIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s}
    .start-gate .celebration-spark{animation:startSpark 1.8s ease-in-out infinite}

    .game-page.activity-ended .playfield,.game-page.activity-ended .fixed-controls{visibility:hidden;pointer-events:none}

    #finishView{background:rgba(17,17,17,.14);z-index:220}
    #finishView .finish-card{animation:none;opacity:0;transform:translate3d(0,18px,0) scale(.965);transform-origin:center}
    .game-page.ended #finishView .finish-card{animation:finishPanelIn .52s cubic-bezier(.2,.9,.2,1) both}
    #finishView .finish-trophy{animation:none;opacity:0;transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);transform-origin:center;filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.12));will-change:transform,opacity,filter}
    #finishView.finish-sequence-start .finish-trophy{animation:finishTrophyArrival 2.52s cubic-bezier(.16,.82,.18,1) both}
    #finishView .finish-title,#finishView .finish-subtitle{visibility:hidden;opacity:0;will-change:transform,opacity,filter}
    #finishView.finish-message-in .finish-title{visibility:visible;animation:finishTitleBurst .68s cubic-bezier(.16,1.22,.2,1) both}
    #finishView.finish-message-in .finish-subtitle{visibility:visible;animation:finishSubtitleBurst .62s cubic-bezier(.18,1.08,.2,1) both .055s}
    #finishView .finish-actions{visibility:hidden;opacity:0;transform:translate3d(0,28px,0) scale(.94);pointer-events:none;will-change:transform,opacity}
    #finishView.finish-actions-in .finish-actions{visibility:visible;pointer-events:auto;animation:finishActionsRise .62s cubic-bezier(.18,1.08,.2,1) both}

    @keyframes startCardPop{0%{opacity:0;transform:scale(.82) translateY(20px)}70%{opacity:1;transform:scale(1.035) translateY(0)}100%{opacity:1;transform:scale(1) translateY(0)}}

    @keyframes finishTrophyArrival{0%{opacity:0;transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.10))}18%{opacity:1;filter:blur(1.5px) drop-shadow(0 10px 18px rgba(0,0,0,.16))}62%{opacity:1;transform:translate3d(-10%,7%,0) scale(1.13) rotate(-7deg);filter:blur(0) drop-shadow(0 10px 18px rgba(0,0,0,.17))}77%{transform:translate3d(5%,-4%,0) scale(.965) rotate(3deg)}89%{transform:translate3d(-2%,2%,0) scale(1.025) rotate(-1.2deg)}100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0) drop-shadow(0 8px 14px rgba(0,0,0,.15))}}
    @keyframes finishTitleBurst{0%{opacity:0;transform:translate3d(0,24px,0) scale(.22) rotate(-3deg);filter:blur(8px)}55%{opacity:1;transform:translate3d(0,-3px,0) scale(1.16) rotate(1deg);filter:blur(0)}78%{transform:translate3d(0,1px,0) scale(.97) rotate(-.35deg)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:blur(0)}}
    @keyframes finishSubtitleBurst{0%{opacity:0;transform:translate3d(0,18px,0) scale(.72);filter:blur(5px)}62%{opacity:1;transform:translate3d(0,-2px,0) scale(1.055);filter:blur(0)}100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
    @keyframes finishActionsRise{0%{opacity:0;transform:translate3d(0,28px,0) scale(.94)}70%{opacity:1;transform:translate3d(0,-3px,0) scale(1.02)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    @keyframes finishConfettiBurst{0%{opacity:0;transform:translate3d(0,-9vh,0) rotate(0) scale(.55)}8%{opacity:.96}72%{opacity:.92}100%{opacity:0;transform:translate3d(var(--x),108vh,0) rotate(620deg) scale(1)}}

    .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .confetti i{position:absolute;top:-10%;width:12px;height:22px;border-radius:4px;background:var(--c);animation:confettiFall 2.7s linear infinite;animation-delay:var(--d)}
    @keyframes confettiFall{0%{transform:translate3d(0,-12vh,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--x),115vh,0) rotate(620deg);opacity:0}}

    @media(max-width:760px) and (orientation:portrait){
      .playfield{grid-template-rows:auto minmax(230px,1fr);padding-top:calc(var(--safe-top) + 5px);padding-bottom:calc(var(--safe-bottom) + 62px);gap:3px}

      .hud-pill{height:38px;min-width:70px;font-size:17px}

    @media(max-height:560px) and (orientation:landscape){
      .playfield{grid-template-rows:auto minmax(105px,1fr);padding-top:calc(var(--safe-top) + 4px);padding-bottom:calc(var(--safe-bottom) + 50px);gap:2px}
      .strip-zone{padding-top:0}

      .celebration-icon{width:78px;height:78px}

    /* زر الرجوع أصغر ومثبت فعليًا في الزاوية السفلية اليسرى. */
    .back-btn{
      left:calc(var(--safe-left) + 2px);
      bottom:calc(var(--safe-bottom) + 2px);
      min-width:clamp(58px,6.2vw,76px);
      height:clamp(29px,4vh,36px);
      padding:0 clamp(9px,1.1vw,13px);

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important}
    }
  </style>

<body>
  <main class="game-page theme-classroom" id="gamePage" data-language="ar">
    <div class="theme-background" id="themeBackground" aria-hidden="true"></div>
    <img class="game-logo" src="../logo.PNG" alt="شعار صندوق المسابقات">

    <div class="hud" id="attemptsHud" hidden>

    <section class="activity-overlay start-gate is-visible" id="startGate" aria-hidden="false">

          <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.76)" stroke="rgba(255,255,255,.92)" stroke-width="5"/>

        <span class="celebration-spark spark-one" aria-hidden="true"></span>
        <span class="celebration-spark spark-two" aria-hidden="true"></span>
        <span class="celebration-spark spark-three" aria-hidden="true"></span>
        <span class="celebration-spark spark-four" aria-hidden="true"></span>
        <svg class="celebration-icon finish-trophy" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="cupGold" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff08a"/><stop offset="45%" stop-color="#efd553"/><stop offset="100%" stop-color="#f4a51f"/></linearGradient>
            <linearGradient id="cupBlue" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#24a6ef"/><stop offset="100%" stop-color="#116eb5"/></linearGradient>
          </defs>
          <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.90)" stroke-width="5"/>
          <path d="M38 26h44v13c0 22-8 35-22 38C46 74 38 61 38 39V26z" fill="url(#cupGold)" stroke="#111" stroke-opacity=".16" stroke-width="2"/>
          <path d="M38 36H23c1 17 9 28 22 30" fill="none" stroke="url(#cupGold)" stroke-width="8" stroke-linecap="round"/>
          <path d="M82 36h15c-1 17-9 28-22 30" fill="none" stroke="url(#cupGold)" stroke-width="8" stroke-linecap="round"/>
          <path d="M55 76h10v13H55z" fill="#e7a51d"/>
          <path d="M42 89h36v10H42z" fill="url(#cupBlue)"/>
          <path d="M36 99h48v8H36z" fill="#102b57" opacity=".92"/>
          <path d="M60 34l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L60 60.6 49.6 66l2-11.6-8.5-8.2 11.7-1.7L60 34z" fill="#fff" opacity=".92"/>
        </svg>
        <h1 class="celebration-title finish-title">أحسنتم!</h1>
        <p class="celebration-subtitle finish-subtitle">انتهى النشاط بنجاح</p>
        <div class="celebration-actions finish-actions">
          <button class="restart-btn" id="restartBtn" type="button">إعادة</button>
          <button class="home-btn" id="homeBtn" type="button">الصفحة الرئيسية</button>
        </div>
      </div>
    </section>
  </main>

  <script>
  (()=>{
    "use strict";

    const PAYLOAD_KEY = "sandooq_moving_question_payload_v1";
    const DRAFT_KEY = "sandooq_moving_question_draft_v1";
    const DB_NAME = "sandooq_edu_games_v1";
    const DB_PREFIX = "moving-question";
    const PALETTE = ["#9c4fd0","#1f94db","#f47730","#123fd0","#d90b3d","#23ad6b","#15933b","#e1a400","#7a55c6","#e65353"];
    const STRIP_MOTION_MS = 2600;
    const QUESTION_OVERLAP_DELAY_MS = 1100;
    const WRONG_FEEDBACK_FALLBACK_MS = 1800;

    const page = document.getElementById("gamePage");
    const playfield = document.querySelector(".playfield");
    const themeBackground = document.getElementById("themeBackground");
    const fixedControls = document.querySelector(".fixed-controls");
    const stripViewport = document.getElementById("stripViewport");
    const questionStrip = document.getElementById("questionStrip");
    const questionWindow = document.getElementById("questionWindow");
    let questionContent = document.getElementById("questionContent");
    const filmEdges = [...document.querySelectorAll(".film-edge")];
    const answerBank = document.getElementById("answerBank");
    const startGate = document.getElementById("startGate");
    const finishView = document.getElementById("finishView");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const homeBtn = document.getElementById("homeBtn");
    const backBtn = document.getElementById("backBtn");
    const finishBtn = document.getElementById("finishBtn");
    const attemptsHud = document.getElementById("attemptsHud");
    const attemptsText = document.getElementById("attemptsText");
    const timerTrack = document.getElementById("timerTrack");
    const timerFill = document.getElementById("timerFill");
    const confetti = document.getElementById("confetti");

    const bikeImage = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
        <rect width="720" height="470" rx="30" fill="#eef9ff"/>
        <ellipse cx="360" cy="405" rx="280" ry="25" fill="#cfe6ef"/>
        <circle cx="210" cy="355" r="82" fill="#fff" stroke="#18344b" stroke-width="13"/>
        <circle cx="510" cy="355" r="82" fill="#fff" stroke="#18344b" stroke-width="13"/>
        <path d="M210 355l100-145 82 145H210zm182 0l70-125 48 125m-200-145h86" fill="none" stroke="#e91e63" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="372" cy="118" r="47" fill="#ffc9a5"/>
        <path d="M328 105c5-55 90-60 94 0-20-19-70-21-94 0" fill="#d92857"/>
        <path d="M354 162l-57 90 91 30 45-110z" fill="#53b949"/>
        <path d="M365 180l-38 88m59 13l72 15" stroke="#ffc9a5" stroke-width="24" stroke-linecap="round"/>
        <path d="M357 274l-19 74m50-63l77 56" stroke="#25314b" stroke-width="24" stroke-linecap="round"/>
        <path d="M423 188l70 20" stroke="#ffc9a5" stroke-width="20" stroke-linecap="round"/>
      </svg>`);

    const DEMO_PAYLOAD = {
      gameName:"السؤال المتحرك",
      theme:"classroom",
      contentLanguage:"en",
      soundEnabled:true,
      settings:{
        deleteCorrectAnswer:true,
        attemptsEnabled:false,
        attempts:10,
        timerEnabled:false,
        timerSeconds:90
      },
      appearance:{
        textColor:"#161616",
        stripBorderColor:"#354052",
        unifyAnswerColors:false,
        answerColor:"#1688d3"
      },
      answers:[
        {id:"us",text:"us"},
        {id:"her",text:"her"},
        {id:"him",text:"him"},
        {id:"them",text:"them"},
        {id:"me",text:"me"},
        {id:"you",text:"you"},
        {id:"it",text:"it"}
      ],
      questions:[
        {id:"q1",text:"Look at ______. I can ride a bike.",imageData:bikeImage,answerId:"me"},
        {id:"q2",text:"Sara is my sister. I love ______.",answerId:"her"},
        {id:"q3",text:"Ali is my friend. I can see ______.",answerId:"him"},
        {id:"q4",text:"The books are new. Read ______.",answerId:"them"},
        {id:"q5",text:"This is my bicycle. I ride ______ every day.",answerId:"it"}
      ]
    };

    let payload = null;
    let answers = [];
    let questions = [];
    let currentIndex = 0;
    let hiddenAnswers = new Set();
    let interactionLocked = true;
    let gameStarted = false;
    let gameEnded = false;
    let attemptsLeft = 10;
    let timerId = null;
    let timerDeadline = 0;
    let railOffset = 0;
    let viewportLayoutFrame = null;
    let viewportLayoutTimer = null;
    let safariTimers = [];
    let introFrameId = null;
    let finishSequenceToken = 0;
    let finishSequenceTimers = [];

    const wait = (ms)=>new Promise((resolve)=>setTimeout(resolve,ms));
    const reducedMotion = ()=>window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;
    const easeInOutSine = (value)=>-(Math.cos(Math.PI * value) - 1) / 2;
    const safeText = (value)=>String(value ?? "").trim();
    const normalizeHex = (value,fallback)=>/^#[0-9a-f]{6}$/i.test(String(value || "")) ? String(value).toUpperCase() : fallback;
    const getParam = (name)=>new URLSearchParams(location.search).get(name) || "";
    const assetUrl = (path)=>new URL(`../${String(path || "").replace(/^\/+/,"")}`,document.baseURI).href;

    function normalizeTheme(value){
      const theme = safeText(value).toLowerCase().replace(/^theme-/,"");
      return ["classroom","white","sky-clouds","forest","math","english"].includes(theme) ? theme : "classroom";
    }

    function normalizeAnswer(item,index){
      const imageData = item?.imageData || item?.image || item?.src || "";
      const text = safeText(item?.text || item?.label || item?.value);
      return {
        id:safeText(item?.id || item?.answerId || `answer-${index + 1}`),
        text,
        imageData,
        color:normalizeHex(item?.color,PALETTE[index % PALETTE.length])
      };
    }

    function normalizeQuestion(item,index){
      return {
        id:safeText(item?.id || `question-${index + 1}`),
        text:safeText(item?.text || item?.questionText || item?.question),
        imageData:item?.imageData || item?.questionImageData || item?.image || "",
        answerId:safeText(item?.answerId || item?.correctAnswerId || item?.correctId)
      };
    }

    function normalizePayload(source){
      const rawAnswers = Array.isArray(source?.answers)
        ? source.answers
        : (Array.isArray(source?.answerBank) ? source.answerBank : []);
      const cleanAnswers = rawAnswers.map(normalizeAnswer).filter((item)=>item.id && (item.text || item.imageData));
      const answerIds = new Set(cleanAnswers.map((item)=>item.id));
      const cleanQuestions = (Array.isArray(source?.questions) ? source.questions : [])
        .map(normalizeQuestion)
        .filter((item)=>item.answerId && answerIds.has(item.answerId) && (item.text || item.imageData));
      if (!cleanAnswers.length || !cleanQuestions.length) return null;

      const settings = source?.settings || {};
      const appearance = source?.appearance || {};
      return {
        gameName:safeText(source?.gameName || "السؤال المتحرك"),
        theme:normalizeTheme(source?.theme),
        contentLanguage:(source?.contentLanguage || source?.language) === "ar" ? "ar" : "en",
        soundEnabled:source?.soundEnabled !== false && source?.soundsEnabled !== false,
        settings:{
          deleteCorrectAnswer:settings.deleteCorrectAnswer !== false,
          attemptsEnabled:Boolean(settings.attemptsEnabled),
          attempts:Math.max(1,Math.min(30,Number(settings.attempts) || 10)),
          timerEnabled:Boolean(settings.timerEnabled),
          timerSeconds:Math.max(10,Math.min(3600,Number(settings.timerSeconds) || 90))
        },
        appearance:{
          textColor:normalizeHex(appearance.textColor || source?.textColor,"#161616"),
          stripBorderColor:normalizeHex(appearance.stripBorderColor || source?.stripBorderColor,"#354052"),
          unifyAnswerColors:Boolean(appearance.unifyAnswerColors || source?.unifyAnswerColors),
          answerColor:normalizeHex(appearance.answerColor || source?.answerColor,"#1688d3")
        },
        answers:cleanAnswers,
        questions:cleanQuestions
      };
    }

    function openDb(){
      return new Promise((resolve,reject)=>{
        const request = indexedDB.open(DB_NAME,1);
        request.onupgradeneeded = ()=>{
          if (!request.result.objectStoreNames.contains("payloads")) {
            request.result.createObjectStore("payloads",{keyPath:"key"});
          }
        };
        request.onsuccess = ()=>resolve(request.result);
        request.onerror = ()=>reject(request.error);
      });
    }

    async function readDbPayload(key){
      const db = await openDb();
      return new Promise((resolve,reject)=>{
        const request = db.transaction("payloads","readonly").objectStore("payloads").get(key);
        request.onsuccess = ()=>resolve(request.result?.payload || null);
        request.onerror = ()=>reject(request.error);
      });
    }

    async function hydratePayload(){
      const payloadId = getParam("payloadId");
      if (payloadId) {
        try {
          const dbPayload = await readDbPayload(`${DB_PREFIX}:${payloadId}`);
          const clean = normalizePayload(dbPayload);
          if (clean) return clean;
        } catch (_) {}
        try {
          const raw = sessionStorage.getItem(`${PAYLOAD_KEY}_${payloadId}`);
          const clean = normalizePayload(raw ? JSON.parse(raw) : null);
          if (clean) return clean;
        } catch (_) {}
      }
      for (const key of [PAYLOAD_KEY,DRAFT_KEY]) {
        try {
          const raw = sessionStorage.getItem(key) || localStorage.getItem(key);
          const clean = normalizePayload(raw ? JSON.parse(raw) : null);
          if (clean) return clean;
        } catch (_) {}
      }
      return normalizePayload(DEMO_PAYLOAD);
    }

    /* نفس إدارة الصوت الفعلية المستخدمة في افتح الصندوق والاختيارات. */
    const audio = (()=>{
      const files = {
        correct:assetUrl("sounds/open-box-open.mp3?v=1"),
        wrong:assetUrl("sounds/choice-wrong.mp3?v=1"),
        settle:assetUrl("sounds/match-shuffle-end.mp3?v=1"),
        finish:assetUrl("sounds/match-finish.mp3?v=1")
      };
      const volumes = {correct:1,wrong:1,settle:1,finish:1};
      const cache = {};
      const scheduledTimers = new Set();
      let enabled = true;

      function canPlay(){ return enabled && payload?.soundEnabled !== false; }

      function get(name){
        if (!files[name]) return null;
        if (!cache[name]) {
          const element = new Audio(files[name]);
          element.preload = "auto";
          element.loop = false;
          element.volume = volumes[name] ?? 1;
          element.setAttribute("playsinline","");
          element.setAttribute("webkit-playsinline","");
          cache[name] = element;
        }
        return cache[name];
      }

      function clearScheduled(){
        scheduledTimers.forEach((timer)=>window.clearTimeout(timer));
        scheduledTimers.clear();
      }

      function stop(except=null){
        clearScheduled();
        Object.values(cache).forEach((element)=>{
          if (element === except) return;
          try { element.pause(); element.currentTime = 0; } catch (_) {}
        });
      }

      function play(name){
        if (!canPlay()) return false;
        const element = get(name);
        if (!element) return false;
        stop(element);
        try {
          element.pause();
          element.currentTime = 0;
          element.volume = volumes[name] ?? 1;
          element.playbackRate = 1;
          element.play()?.catch(()=>{});
          return true;
        } catch (_) { return false; }
      }

      function playAndWait(name,fallbackMs=WRONG_FEEDBACK_FALLBACK_MS){
        const fallback = Math.max(300,Number(fallbackMs) || WRONG_FEEDBACK_FALLBACK_MS);
        if (!canPlay()) return new Promise((resolve)=>window.setTimeout(resolve,fallback));
        const element = get(name);
        if (!element) return new Promise((resolve)=>window.setTimeout(resolve,fallback));
        return new Promise((resolve)=>{
          let finished = false;
          let timer = 0;
          const complete = ()=>{
            if (finished) return;
            finished = true;
            window.clearTimeout(timer);
            element.removeEventListener("ended",complete);
            element.removeEventListener("error",complete);
            resolve();
          };
          element.addEventListener("ended",complete,{once:true});
          element.addEventListener("error",complete,{once:true});
          const durationMs = Number.isFinite(element.duration) && element.duration > 0
            ? Math.ceil(element.duration * 1000) + 80
            : fallback;
          timer = window.setTimeout(complete,durationMs);
          if (!play(name)) complete();
        });
      }

      /* يبدأ المقطع قبل نهاية الحركة بمدته الفعلية لينتهي لحظة ثبات السؤال. */
      function playEndingAt(name,endInMs,fallbackLeadMs=850){
        if (!canPlay()) return 0;
        const element = get(name);
        if (!element) return 0;
        const durationMs = Number.isFinite(element.duration) && element.duration > 0
          ? Math.ceil(element.duration * 1000)
          : Math.max(250,Number(fallbackLeadMs) || 850);
        const delay = Math.max(0,Math.round(Number(endInMs) || 0) - durationMs);
        const timer = window.setTimeout(()=>{
          scheduledTimers.delete(timer);
          play(name);
        },delay);
        scheduledTimers.add(timer);
        return timer;
      }

      function unlock(){
        Object.keys(files).forEach((name)=>{ try { get(name)?.load(); } catch (_) {} });
      }

      function setEnabled(value){ enabled = value !== false; if (!enabled) stop(); }

      function stopNamed(name){
        const element = cache[name];
        if (!element) return;
        try { element.pause(); element.currentTime = 0; } catch (_) {}
      }

      function ready(name){
        const element = get(name);
        if (!element || element.readyState >= 2) return Promise.resolve();
        return new Promise((resolve)=>{
          let settled = false;
          const finish = ()=>{
            if (settled) return;
            settled = true;
            element.removeEventListener("loadeddata",finish);
            element.removeEventListener("canplaythrough",finish);
            element.removeEventListener("error",finish);
            resolve();
          };
          element.addEventListener("loadeddata",finish,{once:true});
          element.addEventListener("canplaythrough",finish,{once:true});
          element.addEventListener("error",finish,{once:true});
          try { element.load(); } catch (_) {}
          window.setTimeout(finish,900);
        });
      }

      return {play,playAndWait,playEndingAt,unlock,stop,stopNamed,ready,setEnabled};
    })();

    /* نفس نغمة الثيم المستخدمة في بداية لعبة افتح الصندوق. */
    const themeIntroAudio = (()=>{
      const files = {
        default:assetUrl("sounds/theme-default.mp3?v=1"),
        "sky-clouds":assetUrl("sounds/theme-sky-clouds.mp3?v=1"),
        "national-day":assetUrl("sounds/theme-national-day.mp3?v=1"),
        "founding-day":assetUrl("sounds/theme-founding-day.mp3?v=1")
      };
      let element = null;
      let currentSrc = "";
      let enabled = true;

      function themeKey(theme){
        const value = safeText(theme).toLowerCase();
        if (["sky","clouds","sky-clouds","theme-sky-clouds","سماء","سماء وغيوم"].includes(value)) return "sky-clouds";
        if (["national-day","theme-national-day","اليوم الوطني"].includes(value)) return "national-day";
        if (["founding-day","theme-founding-day","يوم التأسيس","التأسيس"].includes(value)) return "founding-day";
        return "default";
      }

      function ensure(theme){
        const src = files[themeKey(theme)] || files.default;
        if (!element || currentSrc !== src) {
          try { element?.pause?.(); } catch (_) {}
          element = new Audio(src);
          element.preload = "auto";
          element.loop = false;
          element.volume = 1;
          element.setAttribute("playsinline","");
          element.setAttribute("webkit-playsinline","");
          currentSrc = src;
        }
        return element;
      }

      function preload(theme){
        if (!enabled) return;
        try { ensure(theme).load(); } catch (_) {}
      }

      function play(theme){
        if (!enabled) return false;
        const target = ensure(theme);
        try {
          target.pause();
          target.currentTime = 0;
          target.volume = 1;
          target.playbackRate = 1;
          target.play()?.catch(()=>{});
          return true;
        } catch (_) { return false; }
      }

      function stop(){
        try { element?.pause?.(); if (element) element.currentTime = 0; } catch (_) {}
      }

      function setEnabled(value){ enabled = value !== false; if (!enabled) stop(); }
      return {preload,play,stop,setEnabled};
    })();

    function applyPayload(){
      answers = payload.answers.map((item)=>({...item}));
      questions = payload.questions.map((item)=>({...item}));
      page.className = `game-page theme-${payload.theme}`;
      page.dataset.language = payload.contentLanguage;
      document.documentElement.lang = payload.contentLanguage;
      document.documentElement.dir = "rtl";
      document.title = `${payload.gameName} - صندوق الألعاب التعليمية`;
      document.documentElement.style.setProperty("--question-frame",payload.appearance.stripBorderColor);
      document.documentElement.style.setProperty("--question-text",payload.appearance.textColor);
      document.documentElement.style.setProperty("--answer-unified",payload.appearance.answerColor);
      attemptsLeft = payload.settings.attempts;
      attemptsHud.hidden = !payload.settings.attemptsEnabled;
      timerTrack.hidden = !payload.settings.timerEnabled;
      audio.setEnabled(payload.soundEnabled);
      themeIntroAudio.setEnabled(payload.soundEnabled);
      updateAttempts();
    }

    function updateAttempts(){
      attemptsText.textContent = `❤️ ${attemptsLeft}/${payload.settings.attempts}`;
    }

    function createAnswerCard(answer,index){
      const button = document.createElement("button");
      button.type = "button";
      button.className = "answer-card";
      button.dataset.answerId = answer.id;
      button.style.setProperty("--answer-color",payload.appearance.unifyAnswerColors ? payload.appearance.answerColor : answer.color);
      const hasText = Boolean(answer.text);
      const hasImage = Boolean(answer.imageData);
      button.classList.toggle("has-text",hasText);
      button.classList.toggle("has-image",hasImage);
      button.classList.toggle("has-both",hasText && hasImage);
      button.setAttribute("aria-label",answer.text || `الإجابة ${index + 1}`);

      if (hasImage) {
        const image = document.createElement("img");
        image.className = "answer-image";
        image.src = answer.imageData;
        image.alt = "";
        image.draggable = false;
        button.appendChild(image);
      }
      if (hasText) {
        const text = document.createElement("span");
        text.className = "answer-text";
        text.textContent = answer.text;
        text.dir = payload.contentLanguage === "en" ? "ltr" : "rtl";
        button.appendChild(text);
      }
      const mark = document.createElement("span");
      mark.className = "answer-mark";
      mark.textContent = "";
      button.appendChild(mark);
      button.addEventListener("click",()=>chooseAnswer(button,answer));
      return button;
    }

    function renderAnswerBank(){
      answerBank.textContent = "";
      const visible = answers.filter((answer)=>!hiddenAnswers.has(answer.id));
      visible.forEach((answer,index)=>answerBank.appendChild(createAnswerCard(answer,index)));
      answerBank.dataset.answerCount = String(visible.length);
    }

    function renderQuestion(index,target = questionContent){
      const question = questions[index];
      target.textContent = "";
      const hasText = Boolean(question?.text);
      const hasImage = Boolean(question?.imageData);
      target.className = "question-content";
      target.classList.toggle("text-only",hasText && !hasImage);
      target.classList.toggle("image-only",hasImage && !hasText);

      if (hasImage) {
        const wrap = document.createElement("div");
        wrap.className = "question-image-wrap";
        const image = document.createElement("img");
        image.className = "question-image";
        image.src = question.imageData;
        image.alt = "";
        image.draggable = false;
        wrap.appendChild(image);
        target.appendChild(wrap);
      }
      if (hasText) {
        const text = document.createElement("div");
        text.className = "question-text";
        text.textContent = question.text;
        text.dir = payload.contentLanguage === "en" ? "ltr" : "rtl";
        target.appendChild(text);
      }
    }

    function resetAnswerMark(card){
      if (!card) return;
      card.classList.remove("has-visible-mark","is-correct","is-wrong");
      const mark = card.querySelector(".answer-mark");
      if (!mark) return;
      mark.className = "answer-mark";
      mark.textContent = "";
    }

    function showMark(card,type){
      const mark = card?.querySelector(".answer-mark");
      if (!mark) return;
      card.classList.add("has-visible-mark");
      mark.className = `answer-mark ${type === "correct" ? "is-correct" : "is-wrong"}`;
      mark.textContent = type === "correct" ? "✓" : "×";
      requestAnimationFrame(()=>mark.classList.add("is-visible"));
    }

    function animateStrip(keyframes,duration = STRIP_MOTION_MS){
      const last = keyframes[keyframes.length - 1];
      const viewportWidth = Math.max(320,stripViewport?.clientWidth || window.innerWidth || 0);
      const edgeStart = railOffset;
      const edgeEnd = edgeStart + viewportWidth * 1.1;
      railOffset = edgeEnd;
      const edgeStartPosition = `${edgeStart.toFixed(2)}px 50%,0 0`;
      const edgeEndPosition = `${edgeEnd.toFixed(2)}px 50%,0 0`;

      if (reducedMotion() || typeof questionContent.animate !== "function") {
        Object.assign(questionContent.style,last);
        filmEdges.forEach((edge)=>{edge.style.backgroundPosition=edgeEndPosition});
        return Promise.resolve();
      }

      const timing = {
        duration,
        easing:"linear",
        fill:"forwards"
      };
      const contentAnimation = questionContent.animate(keyframes,timing);
      const edgeAnimations = filmEdges.map((edge)=>edge.animate([
        {backgroundPosition:edgeStartPosition},
        {backgroundPosition:edgeEndPosition}
      ],timing));

      return Promise.all([
        contentAnimation.finished.catch(()=>{}),
        ...edgeAnimations.map((animation)=>animation.finished.catch(()=>{}))
      ]).then(()=>{
        Object.assign(questionContent.style,last);
        filmEdges.forEach((edge,index)=>{
          edge.style.backgroundPosition=edgeEndPosition;
          edgeAnimations[index]?.cancel();
        });
        contentAnimation.cancel();
      });
    }

    async function enterQuestion(index){
      renderQuestion(index);
      interactionLocked = true;
      questionContent.style.transform = "translate3d(-120%,0,0)";
      questionContent.style.opacity = "1";
      if (reducedMotion()) audio.play("settle");
      else audio.playEndingAt("settle",STRIP_MOTION_MS);
      await animateStrip([
        {transform:"translate3d(-120%,0,0)",opacity:1},
        {transform:"translate3d(0,0,0)",opacity:1}
      ],STRIP_MOTION_MS);
      questionContent.style.transform = "translate3d(0,0,0)";
      questionContent.style.opacity = "1";
      interactionLocked = false;
      answerBank.querySelectorAll(".answer-card").forEach((card)=>{card.disabled=false;resetAnswerMark(card)});
    }

    async function exitQuestion(){
      interactionLocked = true;
      await animateStrip([
        {transform:"translate3d(0,0,0)",opacity:1},
        {transform:"translate3d(120%,0,0)",opacity:1}
      ],STRIP_MOTION_MS);
    }

    async function transitionToQuestion(index){
      interactionLocked = true;
      const outgoing = questionContent;
      const incoming = document.createElement("div");
      incoming.id = "questionContentNext";
      incoming.className = "question-content";
      renderQuestion(index,incoming);
      incoming.style.transform = "translate3d(-120%,0,0)";
      incoming.style.opacity = "1";
      questionWindow.appendChild(incoming);

      const viewportWidth = Math.max(320,stripViewport?.clientWidth || window.innerWidth || 0);
      const totalDuration = QUESTION_OVERLAP_DELAY_MS + STRIP_MOTION_MS;
      if (reducedMotion()) audio.play("settle");
      else audio.playEndingAt("settle",totalDuration);
      const edgeStart = railOffset;
      const edgeDistance = viewportWidth * 1.1 * (totalDuration / STRIP_MOTION_MS);
      const edgeEnd = edgeStart + edgeDistance;
      railOffset = edgeEnd;
      const edgeStartPosition = `${edgeStart.toFixed(2)}px 50%,0 0`;
      const edgeEndPosition = `${edgeEnd.toFixed(2)}px 50%,0 0`;

      if (reducedMotion() || typeof outgoing.animate !== "function") {
        outgoing.remove();
        incoming.id = "questionContent";
        incoming.style.transform = "translate3d(0,0,0)";
        incoming.style.opacity = "1";
        questionContent = incoming;
        filmEdges.forEach((edge)=>{edge.style.backgroundPosition=edgeEndPosition});
      } else {
        const outgoingAnimation = outgoing.animate([
          {transform:"translate3d(0,0,0)",opacity:1},
          {transform:"translate3d(120%,0,0)",opacity:1}
        ],{
          duration:STRIP_MOTION_MS,
          easing:"linear",
          fill:"forwards"
        });
        const incomingAnimation = incoming.animate([
          {transform:"translate3d(-120%,0,0)",opacity:1},
          {transform:"translate3d(0,0,0)",opacity:1}
        ],{
          duration:STRIP_MOTION_MS,
          delay:QUESTION_OVERLAP_DELAY_MS,
          easing:"linear",
          fill:"forwards"
        });
        const edgeAnimations = filmEdges.map((edge)=>edge.animate([
          {backgroundPosition:edgeStartPosition},
          {backgroundPosition:edgeEndPosition}
        ],{
          duration:totalDuration,
          easing:"linear",
          fill:"forwards"
        }));

        await Promise.all([
          outgoingAnimation.finished.catch(()=>{}),
          incomingAnimation.finished.catch(()=>{}),
          ...edgeAnimations.map((animation)=>animation.finished.catch(()=>{}))
        ]);

        incoming.style.transform = "translate3d(0,0,0)";
        incoming.style.opacity = "1";
        filmEdges.forEach((edge,index)=>{
          edge.style.backgroundPosition=edgeEndPosition;
          edgeAnimations[index]?.cancel();
        });
        outgoingAnimation.cancel();
        incomingAnimation.cancel();
        outgoing.remove();
        incoming.id = "questionContent";
        questionContent = incoming;
      }

      interactionLocked = false;
      answerBank.querySelectorAll(".answer-card").forEach((card)=>{
        card.disabled=false;
        resetAnswerMark(card);
      });
    }

    async function chooseAnswer(button,answer){
      if (!gameStarted || gameEnded || interactionLocked) return;
      const question = questions[currentIndex];
      if (!question) return;
      if (answer.id !== question.answerId) {
        interactionLocked = true;
        resetAnswerMark(button);
        void button.offsetWidth;
        button.classList.add("is-wrong");
        showMark(button,"wrong");
        const wrongSoundFinished = audio.playAndWait("wrong");
        if (payload.settings.attemptsEnabled) {
          attemptsLeft = Math.max(0,attemptsLeft - 1);
          updateAttempts();
          if (attemptsLeft === 0) {
            await wrongSoundFinished;
            await showFinish(false);
            return;
          }
        }
        await wrongSoundFinished;
        resetAnswerMark(button);
        interactionLocked = false;
        return;
      }

      interactionLocked = true;
      answerBank.querySelectorAll(".answer-card").forEach((card)=>card.disabled=true);
      button.classList.add("is-correct");
      showMark(button,"correct");
      audio.play("correct");
      await wait(1360);

      if (payload.settings.deleteCorrectAnswer) {
        if (typeof button.animate === "function" && !reducedMotion()) {
          await button.animate([
            {transform:"scale(1)",opacity:1},
            {transform:"scale(1.1)",opacity:1,offset:.28},
            {transform:"scale(.15)",opacity:0}
          ],{duration:520,easing:"cubic-bezier(.3,.02,.2,1)",fill:"forwards"}).finished.catch(()=>{});
        }
        hiddenAnswers.add(answer.id);
        button.remove();
      }

      currentIndex += 1;
      if (currentIndex >= questions.length) {
        await exitQuestion();
        await showFinish(true);
        return;
      }
      await transitionToQuestion(currentIndex);
    }

    function startTimer(){
      stopTimer();
      if (!payload.settings.timerEnabled) return;
      const total = payload.settings.timerSeconds * 1000;
      timerDeadline = Date.now() + total;
      const tick = ()=>{
        const remaining = Math.max(0,timerDeadline - Date.now());
        timerFill.style.transform = `scaleX(${remaining / total})`;
        if (remaining <= 0) showFinish(false);
      };
      tick();
      timerId = setInterval(tick,120);
    }

    function stopTimer(){
      if (timerId) clearInterval(timerId);
      timerId = null;
    }

    function getVisualViewportMetrics(){
      const visualViewport = window.visualViewport;
      const layoutWidth = Math.max(
        280,
        document.documentElement.clientWidth || 0,
        window.innerWidth || 0
      );
      const layoutHeight = Math.max(
        260,
        page?.clientHeight || 0,
        document.documentElement.clientHeight || 0,
        window.innerHeight || 0
      );

      return {
        width:Math.max(280,Math.min(layoutWidth,Number(visualViewport?.width) || layoutWidth)),
        height:Math.max(260,Math.min(layoutHeight,Number(visualViewport?.height) || layoutHeight)),
        offsetLeft:Math.max(0,Number(visualViewport?.offsetLeft) || 0)
      };
    }

    function syncVisualViewportFrame(){
      if (!playfield) return;
      const metrics = getVisualViewportMetrics();
      playfield.style.left = `${metrics.offsetLeft.toFixed(2)}px`;
      playfield.style.right = "auto";
      playfield.style.top = "0px";
      playfield.style.bottom = "auto";
      playfield.style.width = `${metrics.width.toFixed(2)}px`;
      playfield.style.height = `${metrics.height.toFixed(2)}px`;
      page.style.setProperty("--visual-viewport-width",`${metrics.width}px`);
      page.style.setProperty("--visual-viewport-height",`${metrics.height}px`);
    }

    function scheduleResponsiveLayout(delay = 0){
      if (viewportLayoutFrame) {
        cancelAnimationFrame(viewportLayoutFrame);
        viewportLayoutFrame = null;
      }
      if (viewportLayoutTimer) {
        clearTimeout(viewportLayoutTimer);
        viewportLayoutTimer = null;
      }

      const run = ()=>{
        viewportLayoutFrame = requestAnimationFrame(()=>{
          viewportLayoutFrame = null;
          syncVisualViewportFrame();
        });
      };

      if (delay > 0) {
        viewportLayoutTimer = setTimeout(()=>{
          viewportLayoutTimer = null;
          run();
        },delay);
      } else {
        run();
      }
    }

    function collapseSafariBars(){
      safariTimers.forEach((timer)=>clearTimeout(timer));
      safariTimers = [];
      [0,80,220,520,900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({top:80,left:0,behavior:"auto"});
          } catch (_) {
            window.scrollTo(0,80);
          }
          scheduleResponsiveLayout();
        },delay));
      });
    }

    function buildConfetti(){
      confetti.textContent = "";
      const colors = ["#1688d3","#f47a45","#e91e63","#43a047","#8e24aa","#efd553"];
      for (let index=0;index<30;index+=1) {
        const piece = document.createElement("i");
        piece.style.left = `${3 + (index * 3.2) % 94}%`;
        piece.style.setProperty("--c",colors[index % colors.length]);
        piece.style.setProperty("--d",`${-(index % 11) * .17}s`);
        piece.style.setProperty("--x",`${(index % 2 ? 1 : -1) * (18 + index % 5 * 12)}px`);
        confetti.appendChild(piece);
      }
    }

    function clearFinishSequenceTimers(){
      finishSequenceTimers.forEach((timer)=>clearTimeout(timer));
      finishSequenceTimers = [];
    }

    function resetFinishSequenceClasses(){
      finishView?.classList.remove(
        "finish-sequence-start",
        "finish-message-in",
        "finish-actions-in",
        "finish-confetti-on"
      );
    }

    function queueFinishStep(token,delay,classNames){
      const timer = window.setTimeout(()=>{
        if (token !== finishSequenceToken) return;
        classNames.forEach((className)=>finishView?.classList.add(className));
      },delay);
      finishSequenceTimers.push(timer);
    }

    function hideFinish(){
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      audio.stopNamed("finish");
      page.classList.remove("activity-ended","ended");
      finishView.classList.remove("is-visible");
      finishView.setAttribute("aria-hidden","true");
    }

    async function showFinish(success=true){
      if (gameEnded) return;
      const token = ++finishSequenceToken;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      gameEnded = true;
      interactionLocked = true;
      stopTimer();
      answerBank.querySelectorAll("button").forEach((button)=>button.disabled=true);
      finishView.querySelector(".celebration-title").textContent = success ? "أحسنتم!" : "انتهى النشاط";
      finishView.querySelector(".celebration-subtitle").textContent = success ? "انتهى النشاط بنجاح" : "يمكنكم المحاولة مرة أخرى";
      page.classList.add("activity-ended","ended");
      finishView.classList.add("is-visible");
      finishView.setAttribute("aria-hidden","false");
      await audio.ready("finish");
      if (token !== finishSequenceToken) return;
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      if (token !== finishSequenceToken) return;
      finishView.classList.add("finish-sequence-start");
      audio.play("finish");
      queueFinishStep(token,2680,["finish-message-in","finish-confetti-on"]);
      queueFinishStep(token,3180,["finish-actions-in"]);
      collapseSafariBars();
    }

    async function playOpeningIntro(){
      if (!page || !themeBackground || !playfield) return;
      if (introFrameId) cancelAnimationFrame(introFrameId);
      introFrameId = null;

      const holdMs = 2200;
      const zoomMs = 7600;
      const settlePauseMs = 280;
      const startScale = 1;
      const endScale = 1.18;
      let startTime = null;

      const setFrame = (scale)=>{
        themeBackground.style.transform = `translate3d(0,0,0) scale(${Number(scale).toFixed(5)})`;
        themeBackground.style.animation = "none";
        const ratio = (scale - startScale) / Math.max(.001,endScale - startScale);
        themeBackground.style.filter = `saturate(${Math.max(1,Math.min(1.04,1.04 - ratio * .04))})`;
      };

      playfield.style.opacity = "0";
      playfield.style.pointerEvents = "none";
      fixedControls.style.opacity = "0";
      fixedControls.style.transform = "translateY(12px)";
      fixedControls.style.pointerEvents = "none";
      setFrame(startScale);
      collapseSafariBars();
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

      if (!reducedMotion()) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) startTime = now;
            const elapsed = now - startTime;
            if (elapsed < holdMs) {
              setFrame(startScale);
              introFrameId = requestAnimationFrame(animate);
              return;
            }
            const progress = Math.max(0,Math.min(1,(elapsed - holdMs) / zoomMs));
            setFrame(startScale + (endScale - startScale) * easeInOutSine(progress));
            if (progress < 1) {
              introFrameId = requestAnimationFrame(animate);
              return;
            }
            introFrameId = null;
            resolve();
          };
          introFrameId = requestAnimationFrame(animate);
        });
      } else {
        setFrame(endScale);
      }

      await wait(settlePauseMs);
      themeBackground.style.filter = "";
      playfield.style.opacity = "1";
      playfield.style.pointerEvents = "";
      fixedControls.style.opacity = "1";
      fixedControls.style.transform = "none";
      fixedControls.style.pointerEvents = "";
      collapseSafariBars();
    }

    async function startGame(options = {}){
      const playIntro = options?.playIntro !== false;
      audio.unlock();
      collapseSafariBars();
      startGate.classList.remove("is-visible");
      startGate.setAttribute("aria-hidden","true");
      gameStarted = true;
      gameEnded = false;
      interactionLocked = true;
      currentIndex = 0;
      hiddenAnswers = new Set();
      attemptsLeft = payload.settings.attempts;
      updateAttempts();
      renderAnswerBank();
      if (playIntro) {
        themeIntroAudio.play(payload.theme);
        await playOpeningIntro();
      } else {
        playfield.style.opacity = "1";
        playfield.style.pointerEvents = "";
        fixedControls.style.opacity = "1";
        fixedControls.style.transform = "none";
        fixedControls.style.pointerEvents = "";
      }
      await enterQuestion(0);
      startTimer();
    }

    async function restartGame(){
      audio.stop();
      themeIntroAudio.stop();
      stopTimer();
      hideFinish();
      questionContent.getAnimations?.().forEach((animation)=>animation.cancel());
      filmEdges.forEach((edge)=>edge.getAnimations?.().forEach((animation)=>animation.cancel()));
      railOffset = 0;
      filmEdges.forEach((edge)=>{edge.style.backgroundPosition="0 50%,0 0"});
      gameEnded = false;
      await startGame({playIntro:false});
    }

    function goHome(){
      const explicit = getParam("returnTo");
      if (explicit && !/^https?:/i.test(explicit)) {
        location.href = explicit;
        return;
      }
      location.href = "../index.html";
    }

    function goBack(){
      const explicit = getParam("returnTo");
      if (explicit && !/^https?:/i.test(explicit)) {
        location.href = explicit;
      } else if (history.length > 1) {
        history.back();
      } else {
        goHome();
      }
    }

    startBtn.addEventListener("click",()=>startGame());
    restartBtn.addEventListener("click",restartGame);
    homeBtn.addEventListener("click",goHome);
    backBtn.addEventListener("click",goBack);
    finishBtn.addEventListener("click",()=>showFinish(false));
    window.addEventListener("resize",()=>scheduleResponsiveLayout(40),{passive:true});
    window.addEventListener("orientationchange",()=>{
      window.setTimeout(()=>{
        collapseSafariBars();
        scheduleResponsiveLayout(80);
      },160);
    },{passive:true});
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize",()=>scheduleResponsiveLayout(34),{passive:true});
      window.visualViewport.addEventListener("scroll",()=>scheduleResponsiveLayout(34),{passive:true});
    }
    document.addEventListener("touchend",collapseSafariBars,{passive:true});
    window.addEventListener("pageshow",()=>{
      collapseSafariBars();
      scheduleResponsiveLayout(60);
    },{passive:true});
    window.addEventListener("pagehide",()=>{
      audio.stop();
      themeIntroAudio.stop();
      stopTimer();
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      if (introFrameId) cancelAnimationFrame(introFrameId);
      introFrameId = null;
      safariTimers.forEach((timer)=>clearTimeout(timer));
      safariTimers=[];
      if (viewportLayoutFrame) cancelAnimationFrame(viewportLayoutFrame);
      if (viewportLayoutTimer) clearTimeout(viewportLayoutTimer);
    },{passive:true});

    (async()=>{
      payload = await hydratePayload();
      applyPayload();
      themeIntroAudio.preload(payload.theme);
      buildConfetti();
      renderAnswerBank();
      renderQuestion(0);
      questionContent.style.transform = "translate3d(-120%,0,0)";
      questionContent.style.opacity = "1";
      filmEdges.forEach((edge)=>{edge.style.backgroundPosition="0 50%,0 0"});
      syncVisualViewportFrame();
      collapseSafariBars();
    })();
  })();
  </script>
</body>
</html>
