<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: wheel-text-safe-visible-v24 -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>العجلة الدوارة - wheel-text-safe-visible-v24</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --footer-space-p: 98px;
      --footer-space-l: 28px;
      --ink:#111;
      --yellow:#efd553;
      --red:#f05d5b;
      --orange:#f47a45;
      --orange-dark:#e85f2f;
      --wheel-size:min(84vw, calc(100dvh - 168px), 640px);
      --arrow-left:8px;
      --arrow-w:52px;
      --arrow-h:28px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:#222;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    /* wheel-safari-scroll-v2: نفس فكرة barcode مع مساحة تمرير بسيطة حتى يطوي Safari الشريط */
    .wheel-page{
      position:sticky;
      top:0;
      width:100%;
      min-height:100dvh;
      height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      user-select:none;
      touch-action:none;
      direction:ltr;
    }

    .wheel-logo{
      position:absolute;
      top:clamp(14px, 2.4vw, 30px);
      left:clamp(16px, 2.8vw, 38px);
      width:clamp(64px, 8.2vw, 120px);
      height:auto;
      max-height:clamp(52px, 8vw, 96px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
    }

    .wheel-stage{
      position:absolute;
      inset:0;
      overflow:hidden;
    }

    .wheel-arrow{
      position:absolute;
      left:var(--arrow-left);
      top:var(--arrow-top, 50%);
      transform:translateY(-50%);
      width:0;
      height:0;
      border-top:var(--arrow-h) solid transparent;
      border-bottom:var(--arrow-h) solid transparent;
      border-left:var(--arrow-w) solid #111;
      filter:drop-shadow(0 1px 0 rgba(0,0,0,.22));
      z-index:30;
      pointer-events:none;
    }

    .wheel-shell{
      width:var(--wheel-size);
      height:var(--wheel-size);
      max-width:var(--wheel-size);
      max-height:var(--wheel-size);
      aspect-ratio:1/1;
      position:absolute;
      left:var(--wheel-left);
      top:var(--wheel-top);
      border-radius:50%;
      /* transform-origin fixed at left-center (arrow contact point) so zoom never shifts the wheel away from the arrow */
      transform-origin:left center;
      transform:scale(var(--visual-zoom, 1));
      filter:drop-shadow(0 5px 14px rgba(0,0,0,.16));
      touch-action:none;
      cursor:grab;
      background:transparent;
      will-change:transform;
    }

    .wheel-shell:active{
      cursor:grabbing;
    }

    /* Wordwall-style zoom: keep arrow side anchored and let the wheel crop outside the stage */
    .wheel-shell.zoom{
      transform:scale(var(--visual-zoom, 1));
    }

    .wheel-shell.zoom .wheel-center{
      transform:translate(-50%,-50%) scale(var(--visual-zoom-inverse, 1));
      transform-origin:center center;
    }

    .wheel-rotor{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:50%;
      transform-origin:50% 50%;
      will-change:transform;
      overflow:visible;
    }

    .wheel-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
      pointer-events:none;
    }

    .wheel-sector{
      stroke:#fff;
      stroke-width:2.4;
      stroke-linejoin:round;
    }

    .wheel-sector.selected{
      animation:sectorPulse .72s ease-in-out .12s 2;
      filter:brightness(1.13) saturate(1.05);
      transform-box:fill-box;
      transform-origin:center;
    }

    .wheel-sector.eliminating{
      animation:sectorEliminate .42s ease-in forwards;
      transform-box:fill-box;
      transform-origin:center;
    }

    .wheel-label.eliminating{
      animation:labelEliminate .42s ease-in forwards;
    }

    .wheel-shell.merging{
      animation:wheelMergeSettle .46s cubic-bezier(.22,.82,.18,1);
    }

    @keyframes sectorPulse{
      0%{ opacity:1; }
      35%{ opacity:.72; }
      70%{ opacity:1; }
      100%{ opacity:1; }
    }

    @keyframes sectorEliminate{
      0%{ opacity:1; transform:scale(1); filter:brightness(1.12) saturate(1.08); }
      100%{ opacity:0; transform:scale(.78); filter:brightness(1.28) saturate(.85); }
    }

    @keyframes labelEliminate{
      0%{ opacity:1; transform:translate(-50%, -50%) rotate(var(--label-angle, 0deg)) scale(1); }
      100%{ opacity:0; transform:translate(-50%, -50%) rotate(var(--label-angle, 0deg)) scale(.78); }
    }

    @keyframes wheelMergeSettle{
      0%{ filter:drop-shadow(0 5px 14px rgba(0,0,0,.16)) saturate(1.08); }
      45%{ filter:drop-shadow(0 7px 16px rgba(0,0,0,.18)) saturate(1.18); }
      100%{ filter:drop-shadow(0 5px 14px rgba(0,0,0,.16)) saturate(1); }
    }

    .label-layer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      pointer-events:none;
      z-index:4;
      direction:ltr;
      transform-origin:50% 50%;
      will-change:transform;
    }

    .wheel-label{
      position:absolute;
      left:50%;
      top:50%;
      width:var(--label-w, 150px);
      height:var(--label-h, 56px);
      transform-origin:50% 50%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      overflow:hidden;
      z-index:5;
    }

    .wheel-label-content{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:var(--label-gap, 8px);
      overflow:hidden;
      pointer-events:none;
      padding:0 4px;
      direction:ltr;
      transform:scale(var(--visual-label-zoom, 1));
      transform-origin:center center;
      will-change:transform;
    }

    .wheel-label.text-only .wheel-label-content{
      padding:0 6px;
      justify-content:flex-end;
    }

    /* Split layout for text + image: separate elements, same sector angle, different radii. */
    .wheel-label.mixed-text-label .wheel-label-content,
    .wheel-label.mixed-image-label .wheel-label-content{
      justify-content:center;
      flex-direction:row;
      gap:0;
      padding:0;
    }

    .wheel-label.mixed-text-label{
      overflow:visible;
    }

    .wheel-label.mixed-text-label .wheel-label-content{
      overflow:visible;
      padding:2px 3px;
    }

    .wheel-label.mixed-text-label .wheel-text{
      display:block;
      -webkit-line-clamp:unset;
      line-clamp:unset;
      flex:0 0 var(--text-max, 116px);
      width:var(--text-max, 116px);
      max-width:var(--text-max, 116px);
      overflow:visible;
      line-height:1.16;
      padding:2px 3px;
    }

    .wheel-label.mixed-image-label .wheel-image{
      flex:0 0 var(--image-size, 62px);
    }

    .wheel-label.image-only .wheel-label-content{
      justify-content:center;
    }

    .wheel-text{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:var(--line-clamp, 4);
      max-width:var(--text-max, 100%);
      width:var(--text-max, auto);
      overflow:hidden;
      color:#fff;
      font-size:var(--font-size, 18px);
      font-weight:900;
      line-height:1.12;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      white-space:normal;
      overflow-wrap:normal;
      word-break:keep-all;
      text-shadow:0 1px 2px rgba(0,0,0,.25);
      flex:0 1 var(--text-max, auto);
      min-width:0;
    }

    .wheel-label.dark .wheel-text{
      color:#151515;
      text-shadow:0 1px 0 rgba(255,255,255,.56);
    }

    .wheel-image{
      width:var(--image-size, 48px);
      height:var(--image-size, 48px);
      object-fit:contain;
      display:block;
      flex:0 0 auto;
      border-radius:5px;
      background:transparent;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .wheel-center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(var(--visual-zoom-inverse, 1));
      width:18.5%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:#fff;
      border:4px solid rgba(0,0,0,.10);
      box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.12);
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      font-size:0;
      line-height:1.15;
      font-weight:900;
      overflow:hidden;
      pointer-events:none;
      padding:0;
    }

    .wheel-center.has-question{
      width:22%;
      font-size:clamp(12px, 2.45vmin, 24px);
      line-height:1.2;
      padding:clamp(8px, 1.5vmin, 16px);
      overflow-wrap:anywhere;
      word-break:normal;
    }

    .selected-result{
      display:none !important;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .back-btn,
    .right-actions,
    .right-actions button{
      pointer-events:auto;
    }

    .back-btn{
      position:absolute;
      left:clamp(16px, 2.6vw, 34px);
      bottom:0;
      width:clamp(88px, 9.5vw, 126px);
      height:clamp(40px, 5.5vh, 52px);
      border:3px solid #111;
      border-radius:13px;
      background:#efd553;
      color:#111;
      font-size:clamp(16px, 2vw, 23px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }

    .right-actions{
      position:absolute;
      right:clamp(16px, 2.8vw, 42px);
      bottom:0;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:clamp(10px, 1.5vw, 18px);
      height:clamp(40px, 5.5vh, 54px);
    }

    .after-spin{
      display:none;
      padding:0;
      margin:0;
      height:auto;
      min-height:0;
      flex:0 0 auto;
    }

    .after-spin.show{
      display:flex;
      align-items:center;
      gap:clamp(8px, 1.2vw, 14px);
    }

    .spin-btn,
    .resume-btn,
    .remove-btn{
      min-width:0;
      width:auto;
      height:clamp(40px, 5.5vh, 54px);
      min-height:0;
      border:3px solid #111;
      border-radius:14px;
      color:#fff;
      font-size:clamp(17px, 2.15vw, 26px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 clamp(18px, 2.6vw, 32px);
      box-shadow:0 4px 0 rgba(0,0,0,.20);
      cursor:pointer;
      white-space:nowrap;
    }

    .spin-btn{
      min-width:clamp(118px, 13vw, 178px);
      background:linear-gradient(180deg, #ff8548 0%, #f3703b 52%, #e85f2f 100%);
    }

    .resume-btn{
      min-width:clamp(86px, 9vw, 128px);
      background:#1688d3;
    }

    .remove-btn{
      min-width:clamp(86px, 9vw, 128px);
      background:#f05d5b;
    }

    .spin-btn:active,
    .resume-btn:active,
    .remove-btn:active,
    .back-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    @media (orientation:landscape){
      :root{
        --wheel-size:min(64vw, calc(100dvh - 38px), 90dvh, 780px);
      }

      .wheel-stage{
        padding:0 6px calc(42px + var(--safe-bottom));
      }

      .wheel-logo{
        top:clamp(10px, 2.2vh, 18px);
        left:clamp(14px, 2vw, 28px);
        width:clamp(54px, 7vw, 92px);
        max-height:clamp(44px, 10vh, 70px);
      }

      .wheel-center.has-question{
        font-size:clamp(10px, 2.1vmin, 20px);
      }

      .selected-result{
        bottom:calc(42px + var(--safe-bottom));
        min-height:18px;
        font-size:clamp(13px, 2.5vh, 18px);
        padding:0 8px;
      }

      .fixed-controls{
        bottom:calc(8px + var(--safe-bottom));
        height:clamp(32px, 8.2vh, 44px);
      }

      .back-btn,
      .spin-btn,
      .resume-btn,
      .remove-btn{
        height:clamp(32px, 8vh, 42px);
        border-width:2px;
        border-radius:10px;
        font-size:clamp(14px, 3.3vh, 20px);
        box-shadow:0 3px 0 rgba(0,0,0,.18);
      }

      .back-btn{
        width:clamp(72px, 8vw, 104px);
        left:clamp(12px, 2vw, 26px);
      }

      .right-actions{
        right:clamp(12px, 2.4vw, 34px);
        gap:clamp(8px, 1.1vw, 14px);
        height:clamp(32px, 8vh, 42px);
      }

      .spin-btn{
        min-width:clamp(92px, 12vw, 142px);
        padding:0 clamp(14px, 2.2vw, 24px);
      }

      .resume-btn{
        min-width:clamp(66px, 8vw, 96px);
        padding:0 clamp(12px, 1.8vw, 20px);
      }

      .remove-btn{
        min-width:clamp(66px, 8vw, 96px);
        padding:0 clamp(12px, 1.8vw, 20px);
      }
    }

    @media (max-width:430px){
      :root{
        --wheel-size:min(84vw, calc(100dvh - 172px), 360px);
      }

      .wheel-logo{
        top:12px;
        left:14px;
        width:64px;
      }

      .fixed-controls{
        bottom:calc(12px + var(--safe-bottom));
      }

      .back-btn{
        left:12px;
        width:78px;
        height:40px;
        font-size:15px;
        border-radius:11px;
      }

      .right-actions{
        right:12px;
        gap:8px;
        height:40px;
      }

      .spin-btn,
      .resume-btn,
      .remove-btn{
        height:40px;
        border-radius:11px;
        font-size:15px;
      }

      .spin-btn{
        min-width:92px;
        padding:0 18px;
      }

      .remove-btn{
        min-width:62px;
        padding:0 14px;
      }

      .resume-btn{
        min-width:74px;
        padding:0 14px;
      }

      .wheel-text{
        line-height:1.12;
      }
    }
  </style>
</head>
<body>
  <main class="wheel-page" id="wheelPage">
    <img class="wheel-logo" src="logo.PNG" alt="" aria-hidden="true" />

    <div class="wheel-stage" id="wheelStage">
      <div class="wheel-arrow" aria-hidden="true"></div>

      <div class="wheel-shell" id="wheelShell">
        <div class="wheel-rotor" id="wheelRotor">
          <svg class="wheel-svg" viewBox="-250 -250 500 500" aria-label="العجلة الدوارة">
            <g id="sectorLayer"></g>
          </svg>
          <div class="label-layer" id="labelLayer" aria-hidden="true"></div>
        </div>

        <div class="wheel-center" id="wheelCenter"></div>
      </div>
    </div>

    <div class="selected-result" id="selectedResult" aria-live="polite"></div>

    <div class="fixed-controls" aria-label="أزرار التحكم في العجلة">
      <button class="back-btn" type="button" id="backBtn">رجوع</button>

      <div class="right-actions">
        <div class="after-spin" id="afterSpin">
          <button class="resume-btn" type="button" id="resumeBtn">استئناف</button>
          <button class="remove-btn" type="button" id="removeBtn">حذف</button>
        </div>
        <button class="spin-btn" type="button" id="spinBtn">تدوير</button>
      </div>
    </div>
  </main>

  <script>
    const PAYLOAD_KEY = "sandooq_wheel_payload_v1";
    const DRAFT_KEY = "sandooq_wheel_draft_v1";
    const SVG_NS = "http://www.w3.org/2000/svg";

    const defaultWheelEntries = [
      { text:"اتغدى" },
      { text:"انام" },
      { text:"اشتغل" },
      { text:"اروح" },
      { text:"اكعد" },
      { text:"احجي" },
      { text:"اقرأ" },
      { text:"العب" }
    ];

    const wheelColors = [
      "#e91e63", "#0097a7", "#f4511e", "#8e24aa",
      "#1e88e5", "#43a047", "#ef6c00", "#c2185b",
      "#7b1fa2", "#00897b", "#3949ab", "#d81b60",
      "#7cb342", "#039be5", "#fb8c00", "#ec407a"
    ];

    let payload = readPayload();
    let rotation = 0;
    let selectedIndex = -1;
    let animationId = null;
    let zoomAnimationId = null;
    let visualZoomScale = 1;
    let dragState = null;
    let labelNodes = [];
    let safariTimers = [];
    let isRemoving = false;
    let layoutGeometry = { size:0, left:0, top:0, centerX:0, centerY:0, arrowLeft:8, arrowTop:0, arrowW:52, arrowH:28 };

    const wheelPage = document.getElementById("wheelPage");
    const wheelStage = document.getElementById("wheelStage");
    const wheelShell = document.getElementById("wheelShell");
    const wheelRotor = document.getElementById("wheelRotor");
    const sectorLayer = document.getElementById("sectorLayer");
    const labelLayer = document.getElementById("labelLayer");
    const wheelCenter = document.getElementById("wheelCenter");
    const selectedResult = document.getElementById("selectedResult");
    const afterSpin = document.getElementById("afterSpin");
    const fixedControls = document.querySelector(".fixed-controls");

    function readPayload(){
      const candidates = [];

      [PAYLOAD_KEY, DRAFT_KEY].forEach((key)=>{
        try {
          const raw = sessionStorage.getItem(key);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (!data || typeof data !== "object") return;
          candidates.push(normalizePayload(data));
        } catch (_) {}
      });

      if (candidates.length) {
        return candidates.sort((a, b)=> b.entries.length - a.entries.length)[0];
      }

      return normalizePayload({
        type:"text",
        entries: defaultWheelEntries,
        centerQuestionEnabled:false,
        centerQuestion:""
      });
    }

    function normalizePayload(data){
      const type = normalizeWheelType(data.type);
      const sourceEntries = firstArray(data.entries, data.items, data.wheelEntries, data.images, data.cards);
      const normalized = sourceEntries.map((entry, index)=> normalizeWheelEntry(entry, index));
      const filled = normalized.filter((entry)=> isEntryFilledForType(entry, type));
      const entries = filled.length
        ? filled
        : defaultWheelEntries.map((entry, index)=> normalizeWheelEntry(entry, index));

      return {
        version: 1,
        type,
        entries,
        centerQuestionEnabled: Boolean(data.centerQuestionEnabled),
        centerQuestion: String(data.centerQuestion || "")
      };
    }

    function normalizeWheelType(type){
      const value = String(type || "").trim().toLowerCase();
      if (["images", "image", "photos", "pictures"].includes(value)) return "images";
      if (["mixed", "both", "text-image", "image-text"].includes(value)) return "mixed";
      return "text";
    }

    function firstArray(...values){
      const found = values.find((value)=> Array.isArray(value));
      return found || [];
    }

    function firstString(...values){
      const found = values.find((value)=> typeof value === "string" && value.trim());
      return found ? String(found).trim() : "";
    }

    function normalizeWheelEntry(entry, index){
      const item = entry && typeof entry === "object" ? entry : { text: entry };

      return {
        text: firstString(item.text, item.label, item.title, item.question, item.name),
        imageName: firstString(item.imageName, item.fileName, item.filename, item.name),
        imageData: firstString(item.imageData, item.dataUrl, item.dataURL, item.image, item.src, item.url, item.href),
        color: normalizeEntryColor(item.color, index)
      };
    }

    function isEntryFilledForType(entry, type){
      if (type === "images") return Boolean(entry.imageData || entry.imageName);
      if (type === "mixed") return Boolean(entry.text || entry.imageData || entry.imageName);
      return Boolean(entry.text);
    }

    function normalizeEntryColor(color, index){
      const value = String(color || "").trim();
      if (/^#[0-9a-f]{6}$/i.test(value)) return value;
      return wheelColors[index % wheelColors.length];
    }

    function persistPayload(){
      try {
        sessionStorage.setItem(PAYLOAD_KEY, JSON.stringify(payload));
        sessionStorage.setItem(DRAFT_KEY, JSON.stringify({
          version: 1,
          type: payload.type,
          entries: payload.entries,
          centerQuestionEnabled: payload.centerQuestionEnabled,
          centerQuestion: payload.centerQuestion,
          updatedAt: Date.now()
        }));
      } catch (_) {}
    }

    function isIosWebKit(){
      const ua = navigator.userAgent || "";
      const isiOS = /iP(ad|hone|od)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      return isiOS && /WebKit/i.test(ua);
    }

    function collapseSafariBars(){
      safariTimers.forEach((timer)=> clearTimeout(timer));
      safariTimers = [];

      [0, 80, 220, 520, 900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80, left:0, behavior:"auto" });
          } catch (_) {
            window.scrollTo(0, 80);
          }
          requestAnimationFrame(updateLayout);
        }, delay));
      });
    }

    function getItems(){
      return payload.entries && payload.entries.length ? payload.entries : defaultWheelEntries;
    }

    function textForEntry(entry, index){
      const text = String(entry.text || "").trim();
      if (text) return text;
      if (payload.type !== "text") return "";
      const imageName = String(entry.imageName || "").trim();
      if (imageName) return imageName.replace(/\.[^.]+$/, "");
      return `عنصر ${index + 1}`;
    }

    function normalizeAngle(angle){
      return ((angle % 360) + 360) % 360;
    }

    function polarToCartesian(radius, angleDeg){
      const angle = angleDeg * Math.PI / 180;
      return {
        x: radius * Math.cos(angle),
        y: radius * Math.sin(angle)
      };
    }

    function sectorPath(startAngle, endAngle, radius){
      const sweep = Math.abs(endAngle - startAngle);

      if (sweep >= 359.999) {
        return [
          `M ${radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${-radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${radius} 0`,
          `Z`
        ].join(" ");
      }

      const start = polarToCartesian(radius, startAngle);
      const end = polarToCartesian(radius, endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;

      return [
        `M 0 0`,
        `L ${start.x.toFixed(3)} ${start.y.toFixed(3)}`,
        `A ${radius} ${radius} 0 ${largeArc} 1 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`,
        `Z`
      ].join(" ");
    }

    function createSvgElement(tag, attrs = {}){
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value])=> el.setAttribute(key, value));
      return el;
    }

    function colorBrightness(hex){
      const value = String(hex || "").replace("#", "");
      const r = parseInt(value.substring(0, 2), 16) || 0;
      const g = parseInt(value.substring(2, 4), 16) || 0;
      const b = parseInt(value.substring(4, 6), 16) || 0;
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function clamp(value, min, max){
      return Math.max(min, Math.min(max, value));
    }

    function labelMetrics(count, entry){
      const size = Math.max(260, layoutGeometry.size || wheelShell.offsetWidth || wheelShell.clientWidth || 360);
      const step = 360 / Math.max(count, 1);
      const hasImage = Boolean((payload.type === "images" || payload.type === "mixed") && entry.imageData);
      const hasText = Boolean(payload.type !== "images" && textForEntry(entry, 0));
      const imageOnly = hasImage && !hasText;
      const mixed = hasImage && hasText;
      const text = textForEntry(entry, 0);
      const textLength = String(text || "").trim().length;
      const hasMultipleWords = /\s/.test(String(text || "").trim());

      const centerRect = wheelCenter.getBoundingClientRect();
      const centerSize = centerRect.width || size * (payload.centerQuestionEnabled ? 0.220 : 0.185);
      const centerRadius = centerSize / 2;

      const rimRadius = size * 0.448;
      const innerEdge = centerRadius + size * (count <= 5 ? 0.064 : count <= 8 ? 0.058 : count <= 12 ? 0.052 : 0.046);
      const outerEdge = rimRadius - size * (count <= 5 ? 0.052 : count <= 8 ? 0.044 : count <= 12 ? 0.036 : 0.030);
      const available = Math.max(size * 0.12, outerEdge - innerEdge);

      if (mixed) {
        /*
          Wordwall-like split layout v23:
          - Bigger wheel + smaller center gives each sector more usable area.
          - Text and image stay separate, each with its own radius.
          - Content sizes are based on the real sector arc at each radius.
          - Zoom remains neutralized by --visual-label-zoom, so text/images keep their visual size.
        */
        const mixedInnerEdge = centerRadius + size * (count <= 5 ? 0.040 : count <= 8 ? 0.036 : count <= 12 ? 0.032 : 0.028);
        const mixedOuterEdge = rimRadius - size * (count <= 5 ? 0.018 : count <= 8 ? 0.016 : count <= 12 ? 0.014 : 0.012);
        const safeInnerEdge = mixedInnerEdge + size * (count <= 5 ? 0.004 : count <= 8 ? 0.004 : 0.003);
        const safeOuterEdge = mixedOuterEdge - size * (count <= 5 ? 0.008 : count <= 8 ? 0.007 : 0.006);
        const radialBand = Math.max(size * 0.175, safeOuterEdge - safeInnerEdge);

        const imageWantedRadius = safeInnerEdge + radialBand * (count <= 5 ? 0.790 : count <= 8 ? 0.775 : 0.760);
        const imageArc = (2 * Math.PI * imageWantedRadius) * (step / 360);
        let imageSize = clamp(
          Math.min(
            size * (count <= 5 ? 0.128 : count <= 8 ? 0.106 : count <= 12 ? 0.084 : 0.064),
            imageArc * (count <= 5 ? 0.355 : count <= 8 ? 0.320 : 0.280),
            radialBand * (count <= 5 ? 0.360 : count <= 8 ? 0.340 : 0.315)
          ),
          size * (count <= 5 ? 0.072 : count <= 8 ? 0.058 : count <= 12 ? 0.046 : 0.036),
          size * (count <= 5 ? 0.138 : count <= 8 ? 0.112 : count <= 12 ? 0.088 : 0.068)
        );

        const gap = clamp(size * (count <= 5 ? 0.018 : count <= 8 ? 0.015 : 0.012), 7, 13);
        const imageMidRadius = clamp(
          imageWantedRadius,
          safeInnerEdge + radialBand * 0.610,
          safeOuterEdge - imageSize / 2
        );
        const imageInnerLimit = imageMidRadius - imageSize / 2;

        const textInnerLimit = safeInnerEdge + size * (count <= 5 ? 0.018 : count <= 8 ? 0.014 : 0.010);
        const textOuterLimit = Math.max(
          textInnerLimit + size * (count <= 5 ? 0.110 : count <= 8 ? 0.086 : 0.066),
          imageInnerLimit - gap
        );
        const textBand = Math.max(size * (count <= 5 ? 0.100 : count <= 8 ? 0.080 : 0.060), textOuterLimit - textInnerLimit);
        const textLabelWidth = clamp(
          textBand * (count <= 5 ? 0.980 : count <= 8 ? 0.950 : 0.910),
          Math.min(textBand, size * (count <= 5 ? 0.122 : count <= 8 ? 0.094 : 0.070)),
          textBand * 1.000
        );
        const textMidRadius = textInnerLimit + textLabelWidth / 2;

        const textArc = (2 * Math.PI * Math.max(textMidRadius, safeInnerEdge + 1)) * (step / 360);
        let textLabelHeight = clamp(
          textArc * (count <= 5 ? 0.470 : count <= 8 ? 0.400 : count <= 12 ? 0.330 : 0.270),
          size * (count <= 5 ? 0.082 : count <= 8 ? 0.064 : count <= 12 ? 0.050 : 0.040),
          size * (count <= 5 ? 0.150 : count <= 8 ? 0.116 : count <= 12 ? 0.090 : 0.070)
        );

        let maxFont = size * (count <= 5 ? 0.055 : count <= 8 ? 0.044 : count <= 12 ? 0.034 : 0.026);
        let fontSize = Math.min(textLabelHeight * 0.560, maxFont);

        if (textLabelWidth > 0) {
          fontSize = Math.min(fontSize, textLabelWidth * (textLength > 22 ? 0.52 : textLength > 12 ? 0.66 : 0.86));
        }

        if (textLength > 58) fontSize *= 0.74;
        else if (textLength > 42) fontSize *= 0.82;
        else if (textLength > 26) fontSize *= 0.91;

        if (!hasMultipleWords && textLength > 14) fontSize *= 0.74;
        else if (!hasMultipleWords && textLength > 10) fontSize *= 0.84;

        fontSize = clamp(
          fontSize,
          count <= 5 ? 17 : count <= 8 ? 13.5 : count <= 12 ? 10.5 : 8.5,
          maxFont
        );

        const visibleLines = textLength > 24
          ? (count <= 8 ? 4 : 3)
          : textLength > 12
            ? (count <= 8 ? 3 : 2)
            : 2;
        const requiredTextHeight = fontSize * 1.16 * visibleLines + size * (count <= 5 ? 0.030 : count <= 8 ? 0.024 : 0.018);
        textLabelHeight = Math.max(textLabelHeight, requiredTextHeight);
        textLabelHeight = Math.min(
          textLabelHeight,
          Math.min(
            textArc * (count <= 5 ? 0.640 : count <= 8 ? 0.560 : count <= 12 ? 0.470 : 0.390),
            size * (count <= 5 ? 0.230 : count <= 8 ? 0.180 : count <= 12 ? 0.138 : 0.108)
          )
        );

        return {
          splitMixed: true,
          textMidRadius,
          imageMidRadius,
          textLabelWidth,
          textLabelHeight,
          imageLabelSize: imageSize,
          imageSize,
          fontSize,
          gap,
          lines: visibleLines,
          textMax: Math.max(22, textLabelWidth)
        };
      }

      const radialWidth = clamp(
        available * (imageOnly ? 0.70 : 0.82),
        size * (count <= 5 ? 0.145 : count <= 8 ? 0.115 : count <= 12 ? 0.090 : 0.070),
        available * 0.86
      );

      const midRadius = innerEdge + available * (imageOnly ? 0.52 : 0.56);
      const arcAtMiddle = (2 * Math.PI * midRadius) * (step / 360);
      const heightRatio = imageOnly
        ? (count <= 5 ? 0.50 : count <= 8 ? 0.42 : count <= 12 ? 0.34 : 0.28)
        : (count <= 5 ? 0.46 : count <= 8 ? 0.38 : count <= 12 ? 0.31 : 0.25);

      const labelHeight = clamp(
        arcAtMiddle * heightRatio,
        size * (imageOnly ? (count <= 5 ? 0.072 : count <= 8 ? 0.058 : 0.046) : (count <= 5 ? 0.064 : count <= 8 ? 0.052 : 0.042)),
        size * (imageOnly ? (count <= 5 ? 0.150 : count <= 8 ? 0.116 : count <= 12 ? 0.088 : 0.066) : (count <= 5 ? 0.142 : count <= 8 ? 0.108 : count <= 12 ? 0.082 : 0.062))
      );

      const imageSize = hasImage
        ? clamp(
            labelHeight * 0.94,
            size * 0.052,
            Math.min(
              radialWidth * 0.54,
              labelHeight * 0.98,
              size * (count <= 5 ? 0.132 : count <= 8 ? 0.102 : count <= 12 ? 0.078 : 0.058)
            )
          )
        : 0;

      let maxFont = size * (count <= 5 ? 0.052 : count <= 8 ? 0.040 : count <= 12 ? 0.030 : 0.022);
      let fontSize = Math.min(labelHeight * 0.48, maxFont);

      if (textLength > 58) fontSize *= 0.72;
      else if (textLength > 42) fontSize *= 0.82;
      else if (textLength > 26) fontSize *= 0.92;

      if (!hasMultipleWords && textLength > 14) fontSize *= 0.64;
      else if (!hasMultipleWords && textLength > 10) fontSize *= 0.78;

      fontSize = clamp(fontSize, count <= 8 ? 10.5 : count <= 12 ? 8.5 : 7, maxFont);

      const gap = clamp(size * 0.014, 5, 10);
      const lines = count <= 8 ? 4 : count <= 12 ? 3 : 3;
      const textMax = hasImage ? Math.max(size * 0.060, radialWidth - imageSize - gap - 10) : Math.max(size * 0.100, radialWidth - 10);

      return {
        midRadius,
        radialWidth,
        labelHeight,
        imageSize,
        fontSize,
        gap,
        lines,
        textMax
      };
    }


    function buildWheel(){
      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;

      sectorLayer.innerHTML = "";
      labelLayer.innerHTML = "";
      labelNodes = [];
      clearSelected();

      const radius = 224;

      function createTextElement(entry, index){
        const textEl = document.createElement("div");
        textEl.className = "wheel-text";
        textEl.setAttribute("dir", "rtl");
        textEl.textContent = textForEntry(entry, index);
        return textEl;
      }

      function createImageElement(entry){
        const img = document.createElement("img");
        img.className = "wheel-image";
        img.alt = "";
        img.draggable = false;
        img.src = entry.imageData;
        return img;
      }

      function createLabel(className, baseAngle, child){
        const label = document.createElement("div");
        label.className = className;
        label.dataset.baseAngle = String(baseAngle);

        const content = document.createElement("div");
        content.className = "wheel-label-content";
        content.appendChild(child);

        label.appendChild(content);
        labelLayer.appendChild(label);
        return { label, content };
      }

      items.forEach((entry, index)=>{
        const start = -90 + index * step;
        const end = start + step;
        const mid = start + step / 2;
        const color = normalizeEntryColor(entry.color, index);
        entry.color = color;

        const sector = createSvgElement("path", {
          d: sectorPath(start, end, radius),
          fill: color,
          class: "wheel-sector",
          "data-index": String(index)
        });
        sectorLayer.appendChild(sector);

        const rim = index === count - 1 ? createSvgElement("circle", {
          cx:"0",
          cy:"0",
          r:String(radius),
          fill:"none",
          stroke:"rgba(0,0,0,.16)",
          "stroke-width":"1.3"
        }) : null;
        if (rim) sectorLayer.appendChild(rim);

        const isDark = colorBrightness(color) > 168;
        const toneClass = isDark ? "dark" : "light";
        const hasImage = Boolean((payload.type === "images" || payload.type === "mixed") && entry.imageData);
        const hasText = Boolean(payload.type !== "images" && textForEntry(entry, index));
        const node = { baseAngle: mid, entry, labels: [] };

        if (hasImage && hasText) {
          const textPart = createLabel(`wheel-label ${toneClass} mixed-text-label`, mid, createTextElement(entry, index));
          const imagePart = createLabel(`wheel-label ${toneClass} mixed-image-label`, mid, createImageElement(entry));
          node.textLabel = textPart.label;
          node.textContent = textPart.content;
          node.imageLabel = imagePart.label;
          node.imageContent = imagePart.content;
          node.labels.push(textPart.label, imagePart.label);
        } else {
          const className = `wheel-label ${toneClass} ${hasImage ? "image-only" : "text-only"}`;
          const child = hasImage ? createImageElement(entry) : createTextElement(entry, index);
          const single = createLabel(className, mid, child);
          node.label = single.label;
          node.content = single.content;
          node.labels.push(single.label);
        }

        labelNodes.push(node);
      });

      const centerText = payload.centerQuestionEnabled ? (payload.centerQuestion || "السؤال") : "";
      wheelCenter.textContent = centerText;
      wheelCenter.classList.toggle("has-question", Boolean(payload.centerQuestionEnabled));

      selectedResult.textContent = "";
      afterSpin.classList.remove("show");
      selectedIndex = -1;

      setRotation(rotation);
      requestAnimationFrame(()=>{
        updateLayout();
        fitCenterText();
      });
    }


    function readNumber(value, fallback){
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    /*
      wheel-safari-scroll-v2:
      نفس طريقة barcode: نعتمد على صفحة عادية min-height:100dvh، ولا نبني
      ارتفاع اللعبة على visualViewport حتى لا يتغير حجم المشهد مع شريط Safari.
    */
    function getBarcodeStyleViewportHeight(){
      const pageH = wheelPage ? Math.round(wheelPage.clientHeight || 0) : 0;
      const innerH = Math.round(window.innerHeight || 0);
      const clientH = Math.round(document.documentElement.clientHeight || 0);

      return Math.max(320, pageH, innerH, clientH);
    }

    function computeLayoutGeometry(){
      const viewportH = getBarcodeStyleViewportHeight();
      const viewportW = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 0);
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const isNarrow = viewportW <= 600;

      const controlsHeight = Math.max(
        isLandscape ? 36 : 44,
        fixedControls ? fixedControls.offsetHeight || 0 : 0
      );

      // The controls are absolutely fixed to the bottom of .wheel-page.
      // Do not read their current getBoundingClientRect() as a layout source;
      // that creates feedback loops when viewport height changes.
      const controlBottomGap = isLandscape ? 8 : 12;
      const controlsTop = viewportH - controlsHeight - controlBottomGap;

      /*
        One geometry source only.
        Wheel, arrow, and selected-sector math all use these values.
        Mobile gets a slightly lower visual center so the page no longer feels
        lifted upward, while desktop remains effectively unchanged.
      */
      const topReserve = isLandscape ? 8 : (isNarrow ? 44 : 58);
      const bottomReserve = isLandscape ? 12 : (isNarrow ? 24 : 14);
      const availableTop = topReserve;
      const availableBottom = Math.max(availableTop + 260, controlsTop - bottomReserve);
      const availableH = Math.max(260, availableBottom - availableTop);

      const maxByWidth = isLandscape ? viewportW * 0.64 : viewportW * 0.94;
      const maxByHeight = availableH * (isLandscape ? 0.94 : 0.86);
      const maxAbsolute = isLandscape ? 780 : 480;
      const minSize = Math.min(isLandscape ? 360 : 330, viewportW * 0.84, availableH * 0.80);
      const size = Math.round(clamp(Math.min(maxByWidth, maxByHeight, maxAbsolute), Math.max(280, minSize), maxAbsolute));

      const left = Math.round((viewportW - size) / 2);

      // Center in the stage above buttons. On phones, nudge downward a little
      // because the original visual result was consistently too high.
      const mobileDownShift = isLandscape ? Math.round(Math.min(44, availableH * 0.055)) : (isNarrow ? Math.round(Math.min(54, availableH * 0.060)) : 0);
      const maxTop = Math.max(availableTop, availableBottom - size);
      const centeredTop = availableTop + (availableH - size) / 2 + mobileDownShift;
      const top = Math.round(clamp(centeredTop, availableTop, maxTop));

      const centerX = left + size / 2;
      const centerY = top + size / 2;

      const arrowW = Math.round(clamp(size * 0.092, 36, 62));
      const arrowH = Math.round(clamp(size * 0.056, 22, 38));
      const arrowGap = Math.max(4, size * 0.010);
      const arrowLeft = Math.max(2, Math.round(left - arrowW - arrowGap));
      const arrowTop = Math.round(centerY);

      return { size, left, top, centerX, centerY, arrowLeft, arrowTop, arrowW, arrowH, viewportW, viewportH, controlsTop };
    }

    function applyLayoutGeometry(geometry){
      layoutGeometry = geometry;
      wheelPage.style.setProperty("--wheel-size", `${geometry.size}px`);
      wheelPage.style.setProperty("--wheel-left", `${geometry.left}px`);
      wheelPage.style.setProperty("--wheel-top", `${geometry.top}px`);
      wheelPage.style.setProperty("--arrow-left", `${geometry.arrowLeft}px`);
      wheelPage.style.setProperty("--arrow-top", `${geometry.arrowTop}px`);
      wheelPage.style.setProperty("--arrow-w", `${geometry.arrowW}px`);
      wheelPage.style.setProperty("--arrow-h", `${geometry.arrowH}px`);
    }

    /* Wordwall-style zoom.
       No translateX: transform-origin is left center on .wheel-shell so the
       arrow contact point (9-o'clock rim) stays fixed while the wheel crops out. */
    function configureZoom(geometry = layoutGeometry){
      const size = geometry.size || wheelShell.offsetWidth || 0;
      if (!size) return;

      const isLandscape = (geometry.viewportW || window.innerWidth || 0) > (geometry.viewportH || window.innerHeight || 0);
      const desiredScale = isLandscape ? 1.86 : 1.72;
      const scale = desiredScale;

      wheelPage.style.setProperty("--zoom-scale", scale.toFixed(4));
    }

    function getConfiguredZoomScale(){
      const scale = parseFloat(getComputedStyle(wheelPage).getPropertyValue("--zoom-scale"));
      return Number.isFinite(scale) && scale > 0 ? scale : 1;
    }

    function setVisualZoomScale(scale){
      const safeScale = Math.max(1, Number(scale) || 1);
      const inverseScale = 1 / safeScale;
      visualZoomScale = safeScale;
      wheelPage.style.setProperty("--visual-zoom", safeScale.toFixed(5));
      wheelPage.style.setProperty("--visual-zoom-inverse", inverseScale.toFixed(5));
      wheelPage.style.setProperty("--visual-label-zoom", inverseScale.toFixed(5));
    }

    function cancelZoomAnimation(){
      if (zoomAnimationId) {
        cancelAnimationFrame(zoomAnimationId);
        zoomAnimationId = null;
      }
    }

    function animateVisualZoom(targetScale, duration = 1500){
      cancelZoomAnimation();

      const start = visualZoomScale;
      const target = Math.max(1, Number(targetScale) || 1);
      const change = target - start;

      if (!duration || Math.abs(change) < 0.0001) {
        setVisualZoomScale(target);
        return;
      }

      const startTime = performance.now();

      function frame(now){
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOutQuint(progress);
        const scale = start + change * eased;

        setVisualZoomScale(scale);

        if (progress < 1) {
          zoomAnimationId = requestAnimationFrame(frame);
        } else {
          zoomAnimationId = null;
          setVisualZoomScale(target);
        }
      }

      zoomAnimationId = requestAnimationFrame(frame);
    }

    function updateLayout(){
      const geometry = computeLayoutGeometry();
      applyLayoutGeometry(geometry);
      configureZoom(geometry);
      positionLabels();
    }

    function positionLabels(){
      const size = layoutGeometry.size || wheelShell.offsetWidth || wheelShell.clientWidth || 0;
      if (!size || !labelNodes.length) return;

      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const center = size / 2;

      function applyCommonStyles(label, metrics){
        label.style.setProperty("--font-size", `${metrics.fontSize}px`);
        label.style.setProperty("--image-size", `${metrics.imageSize}px`);
        label.style.setProperty("--line-clamp", String(metrics.lines));
        label.style.setProperty("--text-max", `${metrics.textMax}px`);
        label.style.setProperty("--label-gap", `${metrics.gap || 0}px`);
      }

      labelNodes.forEach((node, index)=>{
        const entry = items[index] || {};
        const metrics = labelMetrics(count, entry);
        const baseAngle = node.baseAngle || (-90 + index * step + step / 2);

        if (metrics.splitMixed && node.textLabel && node.imageLabel) {
          const textPoint = polarToCartesian(metrics.textMidRadius, baseAngle);
          node.textLabel.style.left = `${center + textPoint.x}px`;
          node.textLabel.style.top = `${center + textPoint.y}px`;
          node.textLabel.style.setProperty("--label-w", `${metrics.textLabelWidth}px`);
          node.textLabel.style.setProperty("--label-h", `${metrics.textLabelHeight}px`);
          applyCommonStyles(node.textLabel, metrics);

          const imagePoint = polarToCartesian(metrics.imageMidRadius, baseAngle);
          node.imageLabel.style.left = `${center + imagePoint.x}px`;
          node.imageLabel.style.top = `${center + imagePoint.y}px`;
          node.imageLabel.style.setProperty("--label-w", `${metrics.imageLabelSize}px`);
          node.imageLabel.style.setProperty("--label-h", `${metrics.imageLabelSize}px`);
          applyCommonStyles(node.imageLabel, metrics);
          return;
        }

        const label = node.label || (node.labels && node.labels[0]);
        if (!label) return;

        const p = polarToCartesian(metrics.midRadius, baseAngle);
        label.style.left = `${center + p.x}px`;
        label.style.top = `${center + p.y}px`;
        label.style.setProperty("--label-w", `${metrics.radialWidth}px`);
        label.style.setProperty("--label-h", `${metrics.labelHeight}px`);
        applyCommonStyles(label, metrics);
      });

      updateLabelDirections();
    }

    function updateLabelDirections(){
      labelNodes.forEach((node)=>{
        const labelAngle = node.baseAngle + 180;
        const labels = node.labels && node.labels.length ? node.labels : [node.label].filter(Boolean);
        labels.forEach((label)=>{
          label.style.setProperty("--label-angle", `${labelAngle.toFixed(3)}deg`);
          label.style.transform = `translate(-50%, -50%) rotate(${labelAngle.toFixed(3)}deg)`;
        });
      });
    }

    function setRotation(degrees){
      rotation = degrees;
      wheelRotor.style.transform = `rotate(${degrees}deg)`;
    }

    function fitCenterText(){
      if (!wheelCenter.classList.contains("has-question")) return;

      wheelCenter.style.fontSize = "";
      let size = parseFloat(getComputedStyle(wheelCenter).fontSize || "18");

      for (let i = 0; i < 14; i++) {
        if (wheelCenter.scrollWidth <= wheelCenter.clientWidth + 2 && wheelCenter.scrollHeight <= wheelCenter.clientHeight + 2) break;
        size -= 1;
        if (size < 8) break;
        wheelCenter.style.fontSize = `${size}px`;
      }
    }

    function clearSelected(){
      document.querySelectorAll(".wheel-sector.selected").forEach((sector)=>{
        sector.classList.remove("selected");
      });
      document.querySelectorAll(".wheel-sector.eliminating").forEach((sector)=>{
        sector.classList.remove("eliminating");
      });
      document.querySelectorAll(".wheel-label.eliminating").forEach((label)=>{
        label.classList.remove("eliminating");
      });
    }

    function highlightSelected(index){
      clearSelected();
      const sector = document.querySelector(`.wheel-sector[data-index="${index}"]`);
      if (!sector) return;
      sector.classList.remove("selected");
      void sector.getBoundingClientRect();
      sector.classList.add("selected");
    }

    function resetFocus(){
      wheelShell.classList.remove("zoom");
      wheelShell.classList.remove("merging");
      afterSpin.classList.remove("show");
      clearSelected();
      animateVisualZoom(1, 420);
    }

    function playMergeSettle(){
      wheelShell.classList.remove("merging");
      void wheelShell.offsetWidth;
      wheelShell.classList.add("merging");
      setTimeout(()=> wheelShell.classList.remove("merging"), 520);
    }

    function resumeWheelZoomOnly(){
      wheelShell.classList.remove("zoom");
      afterSpin.classList.remove("show");
      animateVisualZoom(1, 420);
      collapseSafariBars();
    }

    function applyFocus(){
      requestAnimationFrame(()=>{
        configureZoom(layoutGeometry);
        wheelShell.classList.add("zoom");
        animateVisualZoom(getConfiguredZoomScale(), 1500);
        collapseSafariBars();
      });
    }

    function getSelectedIndexAtArrow(){
      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const localAngleAtArrow = normalizeAngle(180 - normalizeAngle(rotation));
      const relative = normalizeAngle(localAngleAtArrow - (-90));
      const nearestCenterIndex = Math.round((relative - step / 2) / step);
      return ((nearestCenterIndex % count) + count) % count;
    }

    function showSelected(forcedIndex = null){
      const items = getItems();
      const count = Math.max(items.length, 1);
      const index = Number.isInteger(forcedIndex)
        ? ((forcedIndex % count) + count) % count
        : getSelectedIndexAtArrow();

      selectedIndex = index;
      selectedResult.textContent = "";
      afterSpin.classList.add("show");
      highlightSelected(index);
      applyFocus();
    }

    function easeOutQuint(t){
      return 1 - Math.pow(1 - t, 5);
    }

    function preStopShakeOffset(progress){
      if (progress < 0.76) return 0;

      const t = (progress - 0.76) / 0.24;
      const fade = Math.pow(1 - t, 1.35);
      const slowWave = Math.sin(t * Math.PI * 5.25);
      const tinyWave = Math.sin(t * Math.PI * 13) * 0.22;

      return (slowWave + tinyWave) * fade * 2.15;
    }

    function cancelAnimation(){
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }

    function delay(ms){
      return new Promise((resolve)=> setTimeout(resolve, ms));
    }

    async function eliminateSelectedSection(){
      if (isRemoving || selectedIndex < 0) return;

      const items = getItems();
      if (!items.length) return;

      isRemoving = true;
      afterSpin.classList.remove("show");

      const sector = document.querySelector(`.wheel-sector[data-index="${selectedIndex}"]`);
      const selectedNode = labelNodes[selectedIndex] || null;
      const labels = selectedNode?.labels && selectedNode.labels.length ? selectedNode.labels : [selectedNode?.label].filter(Boolean);

      if (sector) sector.classList.add("eliminating");
      labels.forEach((label)=> label.classList.add("eliminating"));

      await delay(430);

      payload.entries = items.slice();
      payload.entries.splice(selectedIndex, 1);

      if (!payload.entries.length) {
        payload.entries = defaultWheelEntries.map((entry, index)=> ({
          ...entry,
          color: normalizeEntryColor(entry.color, index)
        }));
      }

      selectedIndex = -1;
      rotation = 0;
      resetFocus();
      persistPayload();
      buildWheel();
      playMergeSettle();
      isRemoving = false;
    }

    function animateTo(targetRotation, duration = 5200, targetIndex = null){
      cancelAnimation();

      const start = rotation;
      const change = targetRotation - start;
      const startTime = performance.now();
      resetFocus();
      selectedResult.textContent = "";

      function frame(now){
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOutQuint(progress);

        const baseRotation = start + change * eased;
        const shake = preStopShakeOffset(progress);
        setRotation(baseRotation + shake);

        if (progress < 1) {
          animationId = requestAnimationFrame(frame);
        } else {
          animationId = null;
          setRotation(targetRotation);
          showSelected(targetIndex);
        }
      }

      animationId = requestAnimationFrame(frame);
    }

    function spinRandom(direction = 1){
      if (isRemoving) return;

      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const selected = count === 1 ? 0 : Math.floor(Math.random() * count);
      const selectedCenterAngle = -90 + selected * step + step / 2;
      const desiredNorm = normalizeAngle(180 - selectedCenterAngle);
      const currentNorm = normalizeAngle(rotation);

      let delta = desiredNorm - currentNorm;
      const fullTurns = 5 + Math.floor(Math.random() * 3);

      if (direction < 0) {
        while (delta > 0) delta -= 360;
        delta -= fullTurns * 360;
      } else {
        while (delta < 0) delta += 360;
        delta += fullTurns * 360;
      }

      selectedIndex = selected;
      animateTo(rotation + delta, 4700 + Math.floor(Math.random() * 450), selected);
    }

    function angleFromPointer(event, element){
      const rect = element.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI;
    }

    wheelShell.addEventListener("pointerdown", (event)=>{
      if (isRemoving) return;

      cancelAnimation();
      resetFocus();
      wheelShell.setPointerCapture?.(event.pointerId);
      selectedResult.textContent = "";

      dragState = {
        pointerId: event.pointerId,
        lastAngle: angleFromPointer(event, wheelShell),
        totalDelta: 0,
        lastDirection: 1
      };
    });

    wheelShell.addEventListener("pointermove", (event)=>{
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      event.preventDefault();

      const currentAngle = angleFromPointer(event, wheelShell);
      let delta = currentAngle - dragState.lastAngle;

      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      dragState.lastAngle = currentAngle;
      dragState.totalDelta += delta;
      if (Math.abs(delta) > 0.35) dragState.lastDirection = delta >= 0 ? 1 : -1;

      setRotation(rotation + delta);
    });

    function endDrag(event){
      if (!dragState || dragState.pointerId !== event.pointerId) return;

      const totalDelta = dragState.totalDelta || 0;
      const direction = totalDelta < 0 ? -1 : (dragState.lastDirection || 1);
      dragState = null;

      if (Math.abs(totalDelta) >= 4) {
        spinRandom(direction);
      } else {
        showSelected();
      }
    }

    wheelShell.addEventListener("pointerup", endDrag);
    wheelShell.addEventListener("pointercancel", endDrag);

    document.getElementById("spinBtn").addEventListener("click", ()=>{
      afterSpin.classList.remove("show");
      spinRandom(1);
    });

    document.getElementById("resumeBtn").addEventListener("click", resumeWheelZoomOnly);

    document.getElementById("removeBtn").addEventListener("click", eliminateSelectedSection);

    document.getElementById("backBtn").addEventListener("click", ()=>{
      persistPayload();

      if (document.referrer && document.referrer !== location.href) {
        history.back();
      } else {
        window.location.href = "index-6.html#wheelSetup";
      }
    });

    window.addEventListener("resize", ()=> {
      requestAnimationFrame(updateLayout);
      requestAnimationFrame(fitCenterText);
    }, { passive:true });

    window.addEventListener("orientationchange", ()=> {
      setTimeout(()=>{
        updateLayout();
        fitCenterText();
        collapseSafariBars();
      }, 120);
    }, { passive:true });

    document.addEventListener("touchend", collapseSafariBars, { passive:true });

    setVisualZoomScale(1);
    buildWheel();
    updateLayout();
    fitCenterText();
    collapseSafariBars();
  </script>
</body>
</html>
