<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>العجلة الدوارة - صندوق الألعاب التعليمية</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --footer-space-p: 98px;
      --footer-space-l: 28px;
      --ink:#111;
      --yellow:#efd553;
      --red:#f05d5b;
      --orange:#f47a45;
      --orange-dark:#e85f2f;
      --wheel-size:min(84vw, calc(100dvh - 168px), 640px);
      --arrow-left:8px;
      --arrow-w:104px;
      --arrow-h:80px;
      --arrow-focus-scale:1;
      --arrow-focus-x:0px;
      --wheel-arrow-color:#111111;
      --wheel-font:Tahoma,Arial,"Segoe UI",sans-serif;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:var(--wheel-font);
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:#222;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    /* wheel-safari-scroll-v2: نفس فكرة barcode مع مساحة تمرير بسيطة حتى يطوي Safari الشريط */
    .wheel-page{
      position:sticky;
      top:0;
      width:100%;
      min-height:100dvh;
      height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      user-select:none;
      touch-action:none;
      direction:ltr;
    }

    /* wheel-33: خلفيات الثيمات بطبقة مستقلة حتى لا تفشل الخلفية عند تعارض الكلاسات */
    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1);
      transform-origin:center center;
      will-change:transform, opacity;
    }

    .wheel-page.wheel-theme-original{
      background:#fff;
    }

    .wheel-page.wheel-theme-original .theme-background{
      opacity:0;
      background-image:none;
    }

    .wheel-page.wheel-theme-classroom .theme-background{
      opacity:1;
      background-color:#fff;
      background-image:
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        url("theme-original.webp?v=45"),
        url("theme-original.png?v=45");
    }

    .wheel-page.wheel-theme-sky-clouds .theme-background{
      opacity:1;
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        url("theme-sky-clouds.webp?v=45"),
        url("theme-sky-clouds.png?v=45");
    }

    .wheel-page.wheel-theme-forest .theme-background{
      opacity:1;
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg, #7bd2f3 0%, #7eb64b 100%);
    }

    .wheel-page.wheel-theme-math .theme-background{
      opacity:1;
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg, #f5f4e7 0%, #dfe7ef 100%);
    }

    .wheel-page.wheel-theme-english .theme-background{
      opacity:1;
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg, #72d0d2 0%, #72d0d2 100%);
    }

    .wheel-page.wheel-theme-flowers .theme-background{
      opacity:1;
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg, #f8edf3 0%, #f3dce7 100%);
    }

    .wheel-page.wheel-theme-national-day .theme-background{
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg, #165f55 0%, #0f4f46 100%);
    }

    .wheel-page.wheel-theme-founding-day .theme-background{
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg, #d9ccb5 0%, #c9baa2 100%);
    }

    .wheel-logo{
      position:absolute;
      top:clamp(14px, 2.4vw, 30px);
      left:clamp(16px, 2.8vw, 38px);
      width:clamp(120px, 15.4vw, 225px);
      height:auto;
      max-height:clamp(98px, 15vw, 180px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
    }

    .wheel-stage{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:10;
    }

    /* wheel-32: حركة افتتاحية جمالية فقط قبل بداية اللعب */
    .fixed-controls{
      transition:opacity .34s ease, transform .34s ease;
    }

    .wheel-page.intro-playing .fixed-controls{
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
    }

    /*
      wheel-43:
      Camera Zoom In / Ken Burns intro + الحذف يتم بعد رجوع العجلة للوضع الطبيعي.
      البداية: الخلفية تظهر كمشهد واسع + العجلة بعيدة.
      النهاية: الخلفية تكبر فتختفي الأطراف + العجلة تصل للحجم الطبيعي.
      بعد الانترو تظهر الأزرار وتبدأ اللعبة طبيعي.
    */
    :root{
      --intro-duration:8.60s;
      --intro-bg-final-scale:1.18;
    }

    .wheel-page.intro-playing .wheel-stage{
      transform-origin:center center;
      transform:scale(.42);
      will-change:transform, opacity;
    }

    .wheel-page.intro-playing .theme-background{
      transform:scale(1);
      will-change:transform, filter;
    }

    .wheel-page.intro-done .theme-background{
      transform:scale(var(--intro-bg-final-scale));
    }

    .wheel-page.intro-playing .wheel-arrow{
      opacity:0;
    }

    .wheel-page.intro-playing .wheel-logo{
      animation:introLogoFade .75s ease-out both;
    }

    @keyframes introArrowEnter{
      0%{ opacity:0; transform:translateY(-50%) translateX(-14px) scale(.92); }
      100%{ opacity:1; transform:translateY(-50%) translateX(var(--arrow-focus-x, 0px)) scale(var(--arrow-focus-scale, 1)); }
    }

    @keyframes introLogoFade{
      0%{ opacity:0; transform:translateY(-8px); }
      100%{ opacity:1; transform:translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      .wheel-page.intro-playing .wheel-stage,
      .wheel-page.intro-playing .wheel-arrow,
      .wheel-page.intro-playing .wheel-logo,
      .wheel-page.intro-playing .theme-background{
        animation:none !important;
      }
    }

    .wheel-arrow{
      position:absolute;
      left:var(--arrow-left);
      top:var(--arrow-top, 50%);
      transform:translateY(-50%) translateX(var(--arrow-focus-x, 0px)) scale(var(--arrow-focus-scale, 1));
      transform-origin:right center;
      width:var(--arrow-w);
      height:var(--arrow-h);
      background:var(--wheel-arrow-color,#111);
      clip-path:polygon(0 37%, 58% 37%, 58% 13%, 100% 50%, 58% 87%, 58% 63%, 0 63%);
      filter:drop-shadow(0 1px 0 rgba(0,0,0,.22));
      z-index:30;
      pointer-events:none;
    }

    .wheel-shell{
      width:var(--wheel-size);
      height:var(--wheel-size);
      max-width:var(--wheel-size);
      max-height:var(--wheel-size);
      aspect-ratio:1/1;
      position:absolute;
      left:var(--wheel-left);
      top:var(--wheel-top);
      border-radius:50%;
      /* transform-origin fixed at left-center (arrow contact point) so zoom never shifts the wheel away from the arrow */
      transform-origin:left center;
      transform:scale(var(--visual-zoom, 1));
      filter:drop-shadow(0 5px 14px rgba(0,0,0,.16));
      touch-action:none;
      cursor:grab;
      background:transparent;
      will-change:transform;
    }

    .wheel-shell:active{
      cursor:grabbing;
    }

    /* Wordwall-style zoom: keep arrow side anchored and let the wheel crop outside the stage */
    .wheel-shell.zoom{
      transform:scale(var(--visual-zoom, 1));
    }

    .wheel-shell.zoom .wheel-center{
      transform:translate(-50%,-50%) scale(var(--visual-zoom-inverse, 1));
      transform-origin:center center;
    }

    .wheel-shell.zoom .wheel-center.has-question{
      transform:translate(-50%,-50%) scale(var(--center-question-zoom, 1));
    }

    .wheel-rotor{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:50%;
      transform-origin:50% 50%;
      will-change:transform;
      overflow:visible;
    }

    .wheel-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      overflow:visible;
      pointer-events:none;
    }

    .wheel-sector{
      stroke:#fff;
      stroke-width:2.4;
      stroke-linejoin:round;
    }

    .wheel-page.wheel-theme-national-day .wheel-sector{
      stroke:#083D2B;
      stroke-width:3;
    }

    .wheel-page.wheel-theme-founding-day .wheel-sector{
      stroke:#6E5A43;
      stroke-width:2.8;
    }

    .wheel-sector.selected{
      animation:sectorPulse .72s ease-in-out .12s 2;
      filter:brightness(1.13) saturate(1.05);
      transform-box:fill-box;
      transform-origin:center;
    }

    .wheel-sector.eliminating{
      animation:sectorEliminate .72s ease-in-out forwards;
      transform-box:fill-box;
      transform-origin:center;
    }

    .wheel-label.eliminating{
      animation:labelEliminate .72s ease-in-out forwards;
    }

    .wheel-shell.merging{
      animation:wheelMergeSettle .98s cubic-bezier(.16,.76,.20,1);
    }

    @keyframes sectorPulse{
      0%{ opacity:1; }
      35%{ opacity:.72; }
      70%{ opacity:1; }
      100%{ opacity:1; }
    }

    @keyframes sectorEliminate{
      0%{ opacity:1; transform:scale(1); filter:brightness(1.12) saturate(1.08); }
      45%{ opacity:.58; transform:scale(1.025); filter:brightness(1.22) saturate(1.04); }
      100%{ opacity:0; transform:scale(.62); filter:brightness(1.34) saturate(.82); }
    }

    @keyframes labelEliminate{
      0%{ opacity:1; transform:translate(-50%, -50%) rotate(var(--label-angle, 0deg)) scale(1); }
      45%{ opacity:.55; transform:translate(-50%, -50%) rotate(var(--label-angle, 0deg)) scale(1.03); }
      100%{ opacity:0; transform:translate(-50%, -50%) rotate(var(--label-angle, 0deg)) scale(.62); }
    }

    @keyframes wheelMergeSettle{
      0%{ filter:drop-shadow(0 5px 14px rgba(0,0,0,.16)) saturate(1.06); }
      38%{ filter:drop-shadow(0 8px 18px rgba(0,0,0,.19)) saturate(1.18); }
      72%{ filter:drop-shadow(0 6px 15px rgba(0,0,0,.17)) saturate(1.08); }
      100%{ filter:drop-shadow(0 5px 14px rgba(0,0,0,.16)) saturate(1); }
    }

    .label-layer{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      pointer-events:none;
      z-index:4;
      direction:ltr;
      transform-origin:50% 50%;
      will-change:transform;
    }

    .wheel-label{
      position:absolute;
      left:50%;
      top:50%;
      width:var(--label-w, 150px);
      height:var(--label-h, 56px);
      transform-origin:50% 50%;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
      overflow:hidden;
      z-index:5;
    }

    .wheel-label-content{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:var(--label-gap, 8px);
      overflow:hidden;
      pointer-events:none;
      padding:0 4px;
      direction:ltr;
      transform:scale(var(--visual-label-zoom, 1));
      transform-origin:center center;
      will-change:transform;
    }

    .wheel-label.text-only .wheel-label-content{
      padding:0 6px;
      justify-content:flex-end;
    }

    .wheel-label.text-only .wheel-text{
      line-height:1.08;
    }

    /* Split layout for text + image: separate elements, same sector angle, different radii. */
    .wheel-label.mixed-text-label .wheel-label-content,
    .wheel-label.mixed-image-label .wheel-label-content{
      justify-content:center;
      flex-direction:row;
      gap:0;
      padding:0;
    }

    .wheel-label.mixed-text-label{
      overflow:visible;
    }

    .wheel-label.mixed-text-label .wheel-label-content{
      overflow:visible;
      padding:2px 3px;
    }

    .wheel-label.mixed-text-label .wheel-text{
      display:block;
      -webkit-line-clamp:unset;
      line-clamp:unset;
      flex:0 0 var(--text-max, 116px);
      width:var(--text-max, 116px);
      max-width:var(--text-max, 116px);
      overflow:visible;
      line-height:1.16;
      padding:2px 3px;
    }

    .wheel-label.mixed-image-label .wheel-image{
      flex:0 0 var(--image-w, var(--image-size, 62px));
    }

    .wheel-shell.zoom .wheel-label,
    .wheel-shell.zoom .wheel-label-content{
      overflow:visible;
    }

    .wheel-label.image-only,
    .wheel-label.image-only .wheel-label-content{
      overflow:visible;
    }

    .wheel-label.image-only .wheel-label-content{
      justify-content:center;
      padding:0;
    }

    .wheel-text{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:var(--line-clamp, 4);
      max-width:var(--text-max, 100%);
      width:var(--text-max, auto);
      overflow:hidden;
      color:#fff;
      font-size:var(--font-size, 18px);
      font-weight:900;
      line-height:1.12;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      white-space:normal;
      overflow-wrap:normal;
      word-break:keep-all;
      text-shadow:0 1px 2px rgba(0,0,0,.25);
      flex:0 1 var(--text-max, auto);
      min-width:0;
    }

    .wheel-label.dark .wheel-text{
      color:#151515;
      text-shadow:0 1px 0 rgba(255,255,255,.56);
    }

    .wheel-image{
      width:var(--image-w, var(--image-size, 48px));
      height:var(--image-h, var(--image-size, 48px));
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
      border-radius:5px;
      background:transparent;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .wheel-center{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(var(--visual-zoom-inverse, 1));
      width:18.5%;
      aspect-ratio:1/1;
      border-radius:50%;
      background:#fff;
      border:4px solid rgba(0,0,0,.10);
      box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.12);
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      font-size:0;
      line-height:1.15;
      font-weight:900;
      overflow:hidden;
      pointer-events:none;
      padding:0;
    }

    .wheel-center.has-question{
      width:26%;
      font-size:clamp(15px, 3.10vmin, 34px);
      line-height:1.16;
      padding:clamp(10px, 1.85vmin, 20px);
      border-width:5px;
      box-shadow:0 0 0 4px rgba(255,255,255,.92), 0 3px 10px rgba(0,0,0,.14);
      overflow-wrap:anywhere;
      word-break:normal;
    }

    .selected-result{
      display:none !important;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .back-btn,
    .right-actions,
    .right-actions button{
      pointer-events:auto;
    }

    .back-btn{
      position:absolute;
      left:clamp(16px, 2.6vw, 34px);
      bottom:0;
      width:clamp(88px, 9.5vw, 126px);
      height:clamp(40px, 5.5vh, 52px);
      border:3px solid #111;
      border-radius:13px;
      background:#efd553;
      color:#111;
      font-size:clamp(16px, 2vw, 23px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
    }

    .right-actions{
      position:absolute;
      right:clamp(16px, 2.8vw, 42px);
      bottom:0;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:clamp(10px, 1.5vw, 18px);
      height:clamp(40px, 5.5vh, 54px);
    }

    .after-spin{
      display:none;
      padding:0;
      margin:0;
      height:auto;
      min-height:0;
      flex:0 0 auto;
    }

    .after-spin.show{
      display:flex;
      align-items:center;
      gap:clamp(8px, 1.2vw, 14px);
    }

    .spin-btn,
    .resume-btn,
    .remove-btn{
      min-width:0;
      width:auto;
      height:clamp(40px, 5.5vh, 54px);
      min-height:0;
      border:3px solid #111;
      border-radius:14px;
      color:#fff;
      font-size:clamp(17px, 2.15vw, 26px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 clamp(18px, 2.6vw, 32px);
      box-shadow:0 4px 0 rgba(0,0,0,.20);
      cursor:pointer;
      white-space:nowrap;
    }

    .spin-btn{
      min-width:clamp(118px, 13vw, 178px);
      background:linear-gradient(180deg, #ff8548 0%, #f3703b 52%, #e85f2f 100%);
    }

    .resume-btn{
      min-width:clamp(86px, 9vw, 128px);
      background:#1688d3;
    }

    .remove-btn{
      min-width:clamp(86px, 9vw, 128px);
      background:#f05d5b;
    }

    .spin-btn:active,
    .resume-btn:active,
    .remove-btn:active,
    .back-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }


    .wheel-page.ended .wheel-shell,
    .wheel-page.ended .wheel-arrow,
    .wheel-page.ended .fixed-controls,
    .wheel-page.ended .selected-result{
      display:none !important;
    }

    .end-celebration{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:120;
      pointer-events:none;
      overflow:hidden;
      padding:clamp(18px, 4vw, 44px);
      direction:rtl;
    }

    .wheel-page.ended .end-celebration{
      display:flex;
    }

    .celebration-card{
      position:relative;
      width:min(520px, 86vw);
      min-height:clamp(260px, 44vh, 420px);
      border:2px solid rgba(255,255,255,.86);
      border-radius:28px;
      background:rgba(255,255,255,.74);
      -webkit-backdrop-filter:blur(9px);
      backdrop-filter:blur(9px);
      box-shadow:0 18px 45px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.72);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(22px, 4.6vw, 44px);
      pointer-events:auto;
      animation:celebrationPop .62s cubic-bezier(.2,1.12,.22,1) both;
      overflow:hidden;
    }

    .celebration-card::before{
      content:"";
      position:absolute;
      width:92%;
      aspect-ratio:1/1;
      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle, rgba(239,213,83,.32) 0%, rgba(239,213,83,.14) 34%, rgba(255,255,255,0) 68%);
      animation:celebrationGlow 2.4s ease-in-out infinite;
      pointer-events:none;
    }

    .celebration-icon{
      position:relative;
      width:clamp(92px, 17vw, 144px);
      height:clamp(92px, 17vw, 144px);
      margin-bottom:clamp(12px, 2.6vw, 20px);
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
      animation:celebrationIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s;
      z-index:1;
    }

    .celebration-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#102b57;
      font-size:clamp(34px, 6.2vw, 64px);
      line-height:1.05;
      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    .celebration-subtitle{
      position:relative;
      z-index:1;
      margin:clamp(8px, 1.7vw, 14px) 0 0;
      color:#26364a;
      font-size:clamp(17px, 2.7vw, 28px);
      line-height:1.35;
      font-weight:800;
    }

    .celebration-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px, 2.2vw, 20px);
      margin-top:clamp(22px, 4vw, 34px);
      flex-wrap:wrap;
    }

    .celebration-actions button{
      min-width:clamp(118px, 18vw, 178px);

  <script>
    const PAYLOAD_KEY = "sandooq_wheel_payload_v1";
    const DRAFT_KEY = "sandooq_wheel_draft_v1";
    const SVG_NS = "http://www.w3.org/2000/svg";

    const defaultWheelEntries = [];

    const wheelColors = [
      "#e91e63", "#0097a7", "#f4511e", "#8e24aa",
      "#1e88e5", "#43a047", "#ef6c00", "#c2185b",
      "#7b1fa2", "#00897b", "#3949ab", "#d81b60",
      "#7cb342", "#039be5", "#fb8c00", "#ec407a"
    ];

    /*
      wheel-55:
      ألوان عجلة خاصة ببعض الثيمات.
      - سماء وغيوم: لونان أزرقان بالتناوب مثل مرجع Wordwall.
      - ازهار وورود: درجات وردية متناسقة مع الخلفية.
      - اليوم الوطني: لونان فقط؛ أخضر متوسط + أبيض مائل للأخضر.
        مع حدود خضراء غامقة جدًا حتى تظهر الفواصل بوضوح.
      باقي الثيمات تبقى على ألوانها السابقة بدون تغيير.
    */
    const themeWheelColors = {
      "sky-clouds": [
        "#2F55C7",
        "#5F85DE"
      ],
      flowers: [
        "#C94582",
        "#E85C9A",
        "#F48AB8",
        "#F3B7D1"
      ],
      "national-day": [
        "#1E8A57",
        "#F4FFF7"
      ],
      "founding-day": [
        "#8D715B",
        "#DCCCB5",
        "#B49579",
        "#F1E6D5"
      ]
    };


    /*
      wheel-56: نظام صوت داخلي مرتب بدون ملفات خارجية.
      - لا يعمل تلقائياً عند فتح الصفحة.
      - يعمل فقط بعد تفاعل المستخدم.
      - يمنع تداخل صوت مرور الأقسام عبر throttle وتتبع القسم الحالي.
      - مناسب للجوال وسفاري لأن الأصوات قصيرة ومولدة بـ Web Audio API.
    */
    const wheelAudio = (()=>{
      const SOUND_FILES = {
        button: "sounds/wheel-button.mp3?v=63",
        tick: "sounds/wheel-tick.mp3?v=63",
        select: "sounds/wheel-select.mp3?v=63",
        remove: "sounds/wheel-remove.mp3?v=63",
        intro: "sounds/wheel-intro.mp3?v=63",
        win: "sounds/wheel-win.mp3?v=63",
        finish: "sounds/match-finish.mp3?v=1"
      };

      let enabled = true;
      let tickingActive = false;
      let lastTickIndex = -1;
      let lastTickBin = null;
      let tickPoolIndex = 0;
      const cache = {};
      const tickPool = [];

      // Web Audio للـ tick: أدق وأسرع من HTMLAudio عند التكرار السريع.
      let ctx = null;
      let master = null;
      let tickBuffer = null;
      let tickBufferPromise = null;

      function readEnabled(){
        try {
          return payload?.soundEnabled !== false && (!payload?.sounds || payload.sounds.enabled !== false);
        } catch (_) {
          return true;
        }
      }

      function canPlay(){
        return readEnabled() && enabled !== false;
      }

      function getAudio(name){
        const src = SOUND_FILES[name];
        if (!src) return null;

        if (!cache[name]) {
          const audio = new Audio(src);
          audio.preload = "auto";
          audio.volume = name === "tick" ? 1.0 : 0.98;
          cache[name] = audio;
        }

        return cache[name];
      }

      function getTickAudio(){
        const src = SOUND_FILES.tick;
        if (!src) return null;

        if (!tickPool.length) {
          for (let i = 0; i < 14; i += 1) {
            const audio = new Audio(src);
            audio.preload = "auto";
            audio.volume = 1.0;
            tickPool.push(audio);
          }
        }

        const audio = tickPool[tickPoolIndex % tickPool.length];
        tickPoolIndex += 1;
        return audio;
      }

      function ensureAudioContext(){
        if (!canPlay()) return null;

        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;

          if (!ctx) {
            ctx = new AudioCtx();
            master = ctx.createGain();
            master.gain.value = 1.0;
            master.connect(ctx.destination);
          }

          if (ctx.state === "suspended") {
            ctx.resume().catch(()=>{});
          }

          return ctx;
        } catch (_) {
          return null;
        }
      }

      function loadTickBuffer(){
        const audio = ensureAudioContext();
        if (!audio) return Promise.resolve(null);
        if (tickBuffer) return Promise.resolve(tickBuffer);
        if (tickBufferPromise) return tickBufferPromise;

        tickBufferPromise = fetch(SOUND_FILES.tick, { cache: "reload" })
          .then((response)=> response.arrayBuffer())
          .then((arrayBuffer)=> audio.decodeAudioData(arrayBuffer))
          .then((buffer)=>{
            tickBuffer = buffer;
            return tickBuffer;
          })
          .catch(()=>{
            tickBuffer = null;
            return null;
          })
          .finally(()=>{
            tickBufferPromise = null;
          });

        return tickBufferPromise;
      }

      function playTickBufferBurst(count = 1){
        const audio = ensureAudioContext();
        if (!audio || !master || !tickBuffer) return false;

        try {
          const safeCount = Math.max(1, Math.min(18, count));
          const startAt = audio.currentTime;
          const spacing = safeCount > 5 ? 0.010 : 0.014;

          for (let i = 0; i < safeCount; i += 1) {
            const source = audio.createBufferSource();
            const gain = audio.createGain();
            source.buffer = tickBuffer;
            source.playbackRate.value = 1 + ((i % 3) - 1) * 0.012;
            gain.gain.value = 1.0;
            source.connect(gain);
            gain.connect(master);
            source.start(startAt + i * spacing);
          }

          return true;
        } catch (_) {
          return false;
        }
      }

      function playAudioElement(audio, options = {}){
        if (!audio || !canPlay()) return false;
        try {
          const reset = options.reset !== false;
          const volume = Number.isFinite(options.volume) ? options.volume : 0.98;
          const playbackRate = Number.isFinite(options.playbackRate) ? options.playbackRate : 1;

          if (reset) {
            audio.pause();
            audio.currentTime = 0;
          }

          audio.loop = false;
          audio.volume = Math.max(0, Math.min(1, volume));
          audio.playbackRate = playbackRate;

          const promise = audio.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(()=>{});
          }
          return true;
        } catch (_) {
          return false;
        }
      }

      function fallbackToneBurst(count = 1){
        const audio = ensureAudioContext();
        if (!audio || !master) return;

        const safeCount = Math.max(1, Math.min(18, count));
        const startAt = audio.currentTime;
        const spacing = safeCount > 5 ? 0.010 : 0.014;

        for (let i = 0; i < safeCount; i += 1) {
          const now = startAt + i * spacing;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(610 + (i % 2) * 35, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 0.065);
        }
      }

      function playTickBurst(count = 1){
        if (playTickBufferBurst(count)) return;

        const safeCount = Math.max(1, Math.min(10, count));
        for (let i = 0; i < safeCount; i += 1) {
          window.setTimeout(()=>{
            const audio = getTickAudio();
            const ok = playAudioElement(audio, {
              volume: 1.0,
              playbackRate: 1 + ((i % 3) - 1) * 0.012
            });
            if (!ok) fallbackToneBurst(1);
          }, i * 10);
        }
      }

      function playNamed(name){
        const ok = playAudioElement(getAudio(name), { volume: name === "button" ? 0.92 : 0.98 });
        if (!ok && name === "tick") fallbackToneBurst(1);
      }

      function playButton(){
        playNamed("button");
      }

      function playTick(index = 0, tickPosition = null){
        if (!tickingActive) return;

        const currentBin = Number.isFinite(tickPosition)
          ? Math.floor(tickPosition)
          : Number(index);

        if (!Number.isFinite(currentBin)) return;

        if (lastTickBin === null) {
          lastTickBin = currentBin;
          lastTickIndex = index;
          return;
        }

        if (currentBin === lastTickBin) {
          lastTickIndex = index;
          return;
        }

        const crossed = Math.abs(currentBin - lastTickBin);
        lastTickBin = currentBin;
        lastTickIndex = index;

        playTickBurst(crossed);
      }

      function playSelect(){
        playNamed("select");
      }

      function playRemove(){
        playNamed("remove");
      }

      function playIntro(){
        playNamed("intro");
      }

      function playWin(){
        playNamed("win");
      }

      function playFinish(){
        playNamed("finish");
      }

      function stopNamed(name){
        const audio = cache[name];
        if (!audio) return;
        try { audio.pause(); audio.currentTime = 0; } catch (_) {}
      }

      function ready(name){
        const audio = getAudio(name);
        if (!audio || audio.readyState >= 2) return Promise.resolve();
        return new Promise((resolve)=>{
          let done = false;
          const finish = ()=>{
            if (done) return;
            done = true;
            audio.removeEventListener("loadeddata",finish);
            audio.removeEventListener("canplaythrough",finish);
            audio.removeEventListener("error",finish);
            resolve();
          };
          audio.addEventListener("loadeddata",finish,{once:true});

    */
    const themeIntroAudio = (()=>{
      const SOUND_FILES = {
        default: "sounds/theme-default.mp3?v=1",
        "sky-clouds": "sounds/theme-sky-clouds.mp3?v=1",
        "national-day": "sounds/theme-national-day.mp3?v=1",
        "founding-day": "sounds/theme-founding-day.mp3?v=1"
      };

      let audio = null;
      let currentSrc = "";
      let enabled = true;
      let pendingTheme = "";
      let pendingUntil = 0;
      let unlockArmed = false;

      function normalizeThemeKey(theme){
        const value = String(theme || "").trim().toLowerCase();
        if (["sky","clouds","sky-clouds","theme-sky-clouds","سماء","سماء وغيوم"].includes(value)) {
          return "sky-clouds";
        }
        if (["national-day","theme-national-day","اليوم الوطني"].includes(value)) {
          return "national-day";
        }
        if (["founding-day","theme-founding-day","يوم التأسيس","التأسيس"].includes(value)) {
          return "founding-day";
        }
        return "default";
      }

      function resolveSrc(theme){
        return SOUND_FILES[normalizeThemeKey(theme)] || SOUND_FILES.default;
      }

      function ensureAudio(theme){
        const src = resolveSrc(theme);
        if (!audio || currentSrc !== src) {
          try {
            audio?.pause?.();
          } catch (_) {}

          audio = new Audio(src);
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = 1;
          audio.setAttribute("playsinline", "");
          audio.setAttribute("webkit-playsinline", "");
          currentSrc = src;
        }
        return audio;
      }

      function clearPending(){
        pendingTheme = "";
        pendingUntil = 0;
      }

      function disarmUnlock(){
        if (!unlockArmed) return;
        unlockArmed = false;
        document.removeEventListener("pointerdown", resumePending, true);
        document.removeEventListener("touchstart", resumePending, true);
        document.removeEventListener("keydown", resumePending, true);
      }

      function resumePending(){
        disarmUnlock();
        if (!pendingTheme || performance.now() > pendingUntil) {
          clearPending();
          return;
        }
        const theme = pendingTheme;
        clearPending();
        play(theme, false);
      }

      function armUnlock(){
        if (unlockArmed) return;
        unlockArmed = true;
        document.addEventListener("pointerdown", resumePending, true);
        document.addEventListener("touchstart", resumePending, true);
        document.addEventListener("keydown", resumePending, true);
      }

      function preload(theme){
        if (!enabled) return;
        const target = ensureAudio(theme);
        try { target.load(); } catch (_) {}
      }

      function play(theme, allowFallback = true){
        if (!enabled) return false;
        const target = ensureAudio(theme);

        try {
          target.pause();
          target.currentTime = 0;
          target.volume = 1;
          target.playbackRate = 1;

          const promise = target.play();
          if (promise && typeof promise.then === "function") {
            promise.then(()=>{
              clearPending();
              disarmUnlock();
            }).catch(()=>{
              if (!allowFallback) return;
              pendingTheme = String(theme || "default");
              pendingUntil = performance.now() + 15000;
              armUnlock();
            });
          }
          return true;
        } catch (_) {
          if (allowFallback) {
            pendingTheme = String(theme || "default");
            pendingUntil = performance.now() + 15000;
            armUnlock();
          }
          return false;
        }
      }

      function stop(){
        clearPending();
        disarmUnlock();
        try {
          audio?.pause?.();
          if (audio) audio.currentTime = 0;
        } catch (_) {}
      }

      function setEnabled(value){
        enabled = value !== false;
        if (!enabled) stop();
      }

      window.addEventListener("pagehide", stop, { passive:true });

        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80, left:0, behavior:"auto" });
          } catch (_) {
            window.scrollTo(0, 80);
          }
          requestAnimationFrame(updateLayout);
        }, delay));
      });

    function getItems(){
      return payload.entries && payload.entries.length ? payload.entries : [];
    }

    function textForEntry(entry, index){
      const text = String(entry.text || "").trim();
      if (text) return text;
      if (payload.type !== "text") return "";
      const imageName = String(entry.imageName || "").trim();
      if (imageName) return imageName.replace(/\.[^.]+$/, "");
      return "";
    }

    function normalizeAngle(angle){
      return ((angle % 360) + 360) % 360;
    }

    function polarToCartesian(radius, angleDeg){

      return {
        x: radius * Math.cos(angle),
        y: radius * Math.sin(angle)
      };
    }

    function sectorPath(startAngle, endAngle, radius){
      const sweep = Math.abs(endAngle - startAngle);

      if (sweep >= 359.999) {
        return [
          `M ${radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${-radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${radius} 0`,
          `Z`
        ].join(" ");
      }

      const start = polarToCartesian(radius, startAngle);
      const end = polarToCartesian(radius, endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;

      return [
        `M 0 0`,
        `L ${start.x.toFixed(3)} ${start.y.toFixed(3)}`,
        `A ${radius} ${radius} 0 ${largeArc} 1 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`,
        `Z`

      const b = parseInt(value.substring(4, 6), 16) || 0;
      return (r * 299 + g * 587 + b * 114) / 1000;

    function fitWheelTextBox(boxWidth, boxHeight, textLength, hasMultipleWords, options = {}){
      const length = Math.max(1, Number(textLength) || 1);
      const maxFont = Number(options.maxFont) || 18;
      const minFont = Number(options.minFont) || 7;
      const requestedMaxLines = Math.max(1, Math.round(Number(options.maxLines) || 3));
      const maxLines = hasMultipleWords ? requestedMaxLines : 1;

      let best = { lines:1, fontSize:minFont, score:minFont };

      for (let lines = 1; lines <= maxLines; lines += 1) {
        const charsPerLine = hasMultipleWords ? Math.ceil(length / lines) : length;
        const widthFit = boxWidth / Math.max(1, charsPerLine * charFactor);
        const heightFit = boxHeight / Math.max(1, lines * lineHeight);

        lines: best.lines,

          textAvailable * (liveSmall ? 0.970 : liveMedium ? 0.945 : liveLarge ? 0.900 : 0.830),

          textArc * (liveSmall ? 0.760 : liveMedium ? 0.640 : liveLarge ? 0.515 : 0.405),

          liveSmall ? 0.060 :
          liveMedium ? 0.047 :
          liveLarge ? 0.035 :

          minFont: liveSmall ? 10.2 : liveMedium ? 8.6 : liveLarge ? 7.2 : 6.4,
          maxLines: lines,
          lineHeight: 1.10
        });

        const fontSize = fit.fontSize;
        const requiredHeight = fontSize * 1.10 * lines + size * (liveSmall ? 0.014 : liveMedium ? 0.011 : 0.009);
        labelHeight = Math.max(labelHeight, requiredHeight);

          midRadius,
          radialWidth,
          labelHeight,
          imageSize: 0,
          imageWidth: 0,
          imageHeight: 0,
          fontSize,
          gap: 0,
          lines,
          textMax: Math.max(30, radialWidth),

          tangentLimit,
          size * (liveSmall ? 0.110 : liveMedium ? 0.088 : liveLarge ? 0.066 : 0.050),
          size * (liveSmall ? 0.285 : liveMedium ? 0.235 : liveLarge ? 0.182 : 0.140)

        imageBoxH = clamp(imageBoxH * imageOnlySizeScale, size * 0.045, Math.max(size * 0.055, arcAtMiddle * 0.82));

          midRadius + imageOnlyRadialShiftPx,
          safeInnerEdge + imageBoxW / 2,

          radialWidth: imageBoxW,
          labelHeight: imageBoxH,

          imageWidth: imageBoxW,
          imageHeight: imageBoxH,

          gap: 0,

            available * 0.82,
            size * (count <= 5 ? 0.145 : count <= 8 ? 0.115 : count <= 12 ? 0.090 : 0.070),

            imageOnlyInnerEdge + imageOnlyAvailable * (count <= 5 ? 0.675 : count <= 8 ? 0.665 : count <= 12 ? 0.650 : 0.635),

        radialWidth,
        labelHeight,
        imageSize,
        fontSize,

        lines,

    function buildWheel(){
      const items = getItems();

      // wheel-13:
      // Keep the original content count for text/image sizing.
      // Deleting sectors changes the wheel shape, but must not inflate text/images.
      if (!initialLayoutCount && items.length) {
        initialLayoutCount = items.length;
      }

      const count = Math.max(items.length, 1);
      const step = 360 / count;

      sectorLayer.innerHTML = "";
      labelLayer.innerHTML = "";
      labelNodes = [];
      clearSelected();

      const radius = 224;

      function createTextElement(entry, index){
        const textEl = document.createElement("div");
        const value = textForEntry(entry,index);
        textEl.className = `wheel-text ${String(value).trim().length <= 18 ? "text-short" : "text-long"}`;
        const isArabic = /[\u0600-\u06FF]/.test(value);
        textEl.setAttribute("dir",isArabic ? "rtl" : "auto");
        if (isArabic) textEl.setAttribute("lang","ar");
        textEl.textContent = value;
        return textEl;
      }

      function createImageElement(entry){
        const img = document.createElement("img");
        img.className = "wheel-image";
        img.alt = "";
        img.draggable = false;
        img.src = entry.imageData;
        return img;
      }

      function createLabel(className, baseAngle, child){
        const label = document.createElement("div");
        label.className = className;
        label.dataset.baseAngle = String(baseAngle);

        const content = document.createElement("div");
        content.className = "wheel-label-content";
        content.appendChild(child);

        label.appendChild(content);
        labelLayer.appendChild(label);
        return { label, content };
      }

      items.forEach((entry, index)=>{
        const start = -90 + index * step;
        const end = start + step;
        const mid = start + step / 2;
        const color = getThemeEntryColor(index, entry.color);
        entry.color = color;

        const sector = createSvgElement("path", {
          d: sectorPath(start, end, radius),
          fill: color,
          class: "wheel-sector",
          "data-index": String(index)
        });
        sectorLayer.appendChild(sector);

        const rim = index === count - 1 ? createSvgElement("circle", {
          cx:"0",
          cy:"0",
          r:String(radius),
          fill:"none",
          stroke:"rgba(0,0,0,.16)",
          "stroke-width":"1.3"
        }) : null;
        if (rim) sectorLayer.appendChild(rim);

        const isDark = colorBrightness(color) > 168;
        const toneClass = isDark ? "dark" : "light";
        const hasImage = Boolean((payload.type === "images" || payload.type === "mixed") && entry.imageData);
        const hasText = Boolean(payload.type !== "images" && textForEntry(entry, index));
        const node = { baseAngle: mid, entry, labels: [] };

        if (hasImage && hasText) {
          const textPart = createLabel(`wheel-label ${toneClass} mixed-text-label`, mid, createTextElement(entry, index));
          const imagePart = createLabel(`wheel-label ${toneClass} mixed-image-label`, mid, createImageElement(entry));
          node.textLabel = textPart.label;
          node.textContent = textPart.content;
          node.imageLabel = imagePart.label;
          node.imageContent = imagePart.content;
          node.labels.push(textPart.label, imagePart.label);
        } else {
          const className = `wheel-label ${toneClass} ${hasImage ? "image-only" : "text-only"}`;
          const child = hasImage ? createImageElement(entry) : createTextElement(entry, index);
          const single = createLabel(className, mid, child);
          node.label = single.label;
          node.content = single.content;
          node.labels.push(single.label);
        }

        labelNodes.push(node);
      });

      const centerText = payload.centerQuestionEnabled ? (payload.centerQuestion || "السؤال") : "";
      wheelCenter.textContent = centerText;
      wheelCenter.classList.toggle("has-question", Boolean(payload.centerQuestionEnabled));

      selectedResult.textContent = "";
      afterSpin.classList.remove("show");
      selectedIndex = -1;

      setRotation(rotation);
      requestAnimationFrame(()=>{
        updateLayout();
        fitCenterText();
      });
    }


    function readNumber(value, fallback){
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    /*
      wheel-safari-scroll-v2:

    */
    function getBarcodeStyleViewportHeight(){
      const pageH = wheelPage ? Math.round(wheelPage.clientHeight || 0) : 0;
      const innerH = Math.round(window.innerHeight || 0);
      const clientH = Math.round(document.documentElement.clientHeight || 0);

      return Math.max(320, pageH, innerH, clientH);
    }

    function computeLayoutGeometry(){
      const viewportH = getBarcodeStyleViewportHeight();
      const viewportW = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 0);
      const isLandscape = window.matchMedia("(orientation: landscape)").matches;
      const isNarrow = viewportW <= 600;

      const controlsHeight = Math.max(
        isLandscape ? 36 : 44,
        fixedControls ? fixedControls.offsetHeight || 0 : 0
      );

      // The controls are absolutely fixed to the bottom of .wheel-page.
      // Do not read their current getBoundingClientRect() as a layout source;
      // that creates feedback loops when viewport height changes.
      const controlBottomGap = isLandscape ? 8 : 12;
      const controlsTop = viewportH - controlsHeight - controlBottomGap;

      /*
        One geometry source only.
        Wheel, arrow, and selected-sector math all use these values.
        Mobile gets a slightly lower visual center so the page no longer feels
        lifted upward, while desktop remains effectively unchanged.
      */
      const topReserve = isLandscape ? 8 : (isNarrow ? 44 : 58);
      const bottomReserve = isLandscape ? 12 : (isNarrow ? 24 : 14);
      const availableTop = topReserve;
      const availableBottom = Math.max(availableTop + 260, controlsTop - bottomReserve);
      const availableH = Math.max(260, availableBottom - availableTop);

      /*
        wheel-26:
        On narrow portrait screens, leave real space for the Wordwall-style arrow outside the wheel.
        The previous portrait wheel was too wide, forcing the arrow to sit on top of the wheel.
      */
      const portraitWidthFactor = isLandscape ? 0.64 : (isNarrow ? 0.74 : 0.94);
      const maxByWidth = viewportW * portraitWidthFactor;
      const maxByHeight = availableH * (isLandscape ? 0.94 : 0.86);
      const maxAbsolute = isLandscape ? 780 : 480;
      const minSize = Math.min(
        isLandscape ? 360 : (isNarrow ? 238 : 330),
        viewportW * (isNarrow && !isLandscape ? 0.66 : 0.84),
        availableH * 0.80
      );
      const lowerBound = isNarrow && !isLandscape ? Math.max(230, minSize) : Math.max(280, minSize);
      const size = Math.round(clamp(Math.min(maxByWidth, maxByHeight, maxAbsolute), lowerBound, maxAbsolute));

      const left = Math.round((viewportW - size) / 2);

      // Center in the stage above buttons. On phones, nudge downward a little
      // because the original visual result was consistently too high.
      const mobileDownShift = isLandscape ? Math.round(Math.min(44, availableH * 0.055)) : (isNarrow ? Math.round(Math.min(54, availableH * 0.060)) : 0);
      const maxTop = Math.max(availableTop, availableBottom - size);
      const centeredTop = availableTop + (availableH - size) / 2 + mobileDownShift;
      const top = Math.round(clamp(centeredTop, availableTop, maxTop));

      const centerX = left + size / 2;
      const centerY = top + size / 2;

      /*
        wheel-27:
        Normal mode arrow is slightly smaller and closer to the wheel.
        Focus/zoom mode gets its own CSS scale/shift in setVisualZoomScale().
      */
      const arrowW = Math.round(clamp(size * 0.145, 68, 108));
      const arrowH = Math.round(clamp(size * 0.108, 52, 84));

      /*
        Keep the arrow outside the wheel.
        Negative left is allowed so the arrow can be partially clipped by the screen edge while its tip
        stays before the wheel rim, exactly like the Wordwall portrait behavior.
      */
      const arrowGap = Math.max(isLandscape ? 3 : 4, size * (isLandscape ? 0.006 : 0.010));
      const arrowLeft = Math.round(left - arrowW - arrowGap);
      const arrowTop = Math.round(centerY);

      return { size, left, top, centerX, centerY, arrowLeft, arrowTop, arrowW, arrowH, viewportW, viewportH, controlsTop };
    }

    function applyLayoutGeometry(geometry){
      layoutGeometry = geometry;
      wheelPage.style.setProperty("--wheel-size", `${geometry.size}px`);
      wheelPage.style.setProperty("--wheel-left", `${geometry.left}px`);
      wheelPage.style.setProperty("--wheel-top", `${geometry.top}px`);
      wheelPage.style.setProperty("--arrow-left", `${geometry.arrowLeft}px`);
      wheelPage.style.setProperty("--arrow-top", `${geometry.arrowTop}px`);
      wheelPage.style.setProperty("--arrow-w", `${geometry.arrowW}px`);
      wheelPage.style.setProperty("--arrow-h", `${geometry.arrowH}px`);
    }

    /* Wordwall-style zoom.
       No translateX: transform-origin is left center on .wheel-shell so the
       arrow contact point (9-o'clock rim) stays fixed while the wheel crops out. */
    function configureZoom(geometry = layoutGeometry){
      const size = geometry.size || wheelShell.offsetWidth || 0;
      if (!size) return;

      const isLandscape = (geometry.viewportW || window.innerWidth || 0) > (geometry.viewportH || window.innerHeight || 0);
      /*
        wheel-26:
        Stronger Wordwall-style focus zoom.
        The selected sector becomes closer and clearer while keeping existing label compensation.
      */
      const desiredScale = isLandscape ? 2.36 : 2.24;
      const scale = desiredScale;

      wheelPage.style.setProperty("--zoom-scale", scale.toFixed(4));
    }

    function getConfiguredZoomScale(){
      const scale = parseFloat(getComputedStyle(wheelPage).getPropertyValue("--zoom-scale"));
      return Number.isFinite(scale) && scale > 0 ? scale : 1;
    }

    function setVisualZoomScale(scale){
      const safeScale = Math.max(1, Number(scale) || 1);
      const inverseScale = 1 / safeScale;
      /*
        wheel-9:
        Normal mode keeps the old compensated size.
        Focus/zoom mode gives text and images an extra readable boost inside the enlarged sector.
      */
      const focusProgress = clamp((safeScale - 1) / 0.86, 0, 1);
      const zoomContentBoost = 0.90 + focusProgress * 0.15;
      const labelScale = safeScale > 1.001 ? zoomContentBoost : inverseScale;

      /*
        wheel-21:
        The center circle is a question area when enabled, so it must not shrink like an empty hub.
        Effective screen size at max zoom becomes about 1.34x instead of staying tiny.
      */
      const centerQuestionScale = safeScale > 1.001
        ? inverseScale * (1 + focusProgress * 0.34)
        : 1;

      const arrowFocusScale = 1 + focusProgress * 0.16;
      const arrowFocusX = focusProgress * Math.max(5, (layoutGeometry.size || 360) * 0.014);

      visualZoomScale = safeScale;
      wheelPage.style.setProperty("--visual-zoom", safeScale.toFixed(5));
      wheelPage.style.setProperty("--visual-zoom-inverse", inverseScale.toFixed(5));
      wheelPage.style.setProperty("--visual-label-zoom", labelScale.toFixed(5));
      wheelPage.style.setProperty("--center-question-zoom", centerQuestionScale.toFixed(5));
      wheelPage.style.setProperty("--arrow-focus-scale", arrowFocusScale.toFixed(5));
      wheelPage.style.setProperty("--arrow-focus-x", `${arrowFocusX.toFixed(2)}px`);
    }

    function cancelZoomAnimation(){
      if (zoomAnimationId) {
        cancelAnimationFrame(zoomAnimationId);
        zoomAnimationId = null;
      }
    }

    function animateVisualZoom(targetScale, duration = 1500){
      cancelZoomAnimation();

      const start = visualZoomScale;
      const target = Math.max(1, Number(targetScale) || 1);
      const change = target - start;

      if (!duration || Math.abs(change) < 0.0001) {
        setVisualZoomScale(target);
        return Promise.resolve();
      }

      const startTime = performance.now();

      /*
        wheel-43:
        الدالة ترجع Promise الآن حتى نقدر ننتظر عودة الزوم
        قبل تنفيذ حذف القسم وحركة الالتئام.
      */
      function easeInOutSine(t){
        const p = Math.max(0, Math.min(1, t));
        return -(Math.cos(Math.PI * p) - 1) / 2;
      }

      return new Promise((resolve)=>{
        function frame(now){
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = easeInOutSine(progress);
          const scale = start + change * eased;

          setVisualZoomScale(scale);

          if (progress < 1) {
            zoomAnimationId = requestAnimationFrame(frame);
          } else {
            zoomAnimationId = null;
            setVisualZoomScale(target);
            resolve();
          }
        }

        zoomAnimationId = requestAnimationFrame(frame);
      });
    }

    function updateLayout(){
      const geometry = computeLayoutGeometry();
      applyLayoutGeometry(geometry);
      configureZoom(geometry);
      positionLabels();
    }

    function positionLabels(){
      const size = layoutGeometry.size || wheelShell.offsetWidth || wheelShell.clientWidth || 0;
      if (!size || !labelNodes.length) return;

      const items = getItems();
      const count = Math.max(items.length, 1);
      const metricCount = Math.max(count, initialLayoutCount || count);
      const step = 360 / count;
      const center = size / 2;

      function applyCommonStyles(label, metrics){
        label.style.setProperty("--font-size", `${metrics.fontSize}px`);
        label.style.setProperty("--image-size", `${metrics.imageSize}px`);
        label.style.setProperty("--image-w", `${metrics.imageWidth || metrics.imageSize || 0}px`);
        label.style.setProperty("--image-h", `${metrics.imageHeight || metrics.imageSize || 0}px`);
        label.style.setProperty("--line-clamp", String(metrics.lines));
        label.style.setProperty("--text-max", `${metrics.textMax}px`);
        label.style.setProperty("--label-gap", `${metrics.gap || 0}px`);
      }

      labelNodes.forEach((node, index)=>{
        const entry = items[index] || {};
        const metrics = labelMetrics(metricCount, entry, count);
        const baseAngle = node.baseAngle || (-90 + index * step + step / 2);

        if (metrics.splitMixed && node.textLabel && node.imageLabel) {
          // wheel-25: fixed radial zones. Text is near the center; image is near the outer rim.
          const textPoint = polarToCartesian(metrics.textMidRadius, baseAngle);
          node.textLabel.style.left = `${center + textPoint.x}px`;
          node.textLabel.style.top = `${center + textPoint.y}px`;
          node.textLabel.style.setProperty("--label-w", `${metrics.textLabelWidth}px`);
          node.textLabel.style.setProperty("--label-h", `${metrics.textLabelHeight}px`);
          applyCommonStyles(node.textLabel, metrics);

          const imagePoint = polarToCartesian(metrics.imageMidRadius, baseAngle);
          node.imageLabel.style.left = `${center + imagePoint.x}px`;
          node.imageLabel.style.top = `${center + imagePoint.y}px`;
          node.imageLabel.style.setProperty("--label-w", `${metrics.imageLabelWidth || metrics.imageLabelSize}px`);
          node.imageLabel.style.setProperty("--label-h", `${metrics.imageLabelHeight || metrics.imageLabelSize}px`);
          applyCommonStyles(node.imageLabel, metrics);
          return;
        }

        const label = node.label || (node.labels && node.labels[0]);
        if (!label) return;

        const p = polarToCartesian(metrics.midRadius, baseAngle);
        if (metrics.imageOnly) {
          const sidePoint = polarToCartesian(metrics.imageOnlySideShiftPx || 0, baseAngle + 90);
          p.x += sidePoint.x + (metrics.imageOnlyScreenX || 0);
          p.y += sidePoint.y + (metrics.imageOnlyScreenY || 0);
        }
        label.style.left = `${center + p.x}px`;
        label.style.top = `${center + p.y}px`;
        label.style.setProperty("--label-w", `${metrics.radialWidth}px`);
        label.style.setProperty("--label-h", `${metrics.labelHeight}px`);
        applyCommonStyles(label, metrics);
      });

      updateLabelDirections();
    }

    function updateLabelDirections(){
      labelNodes.forEach((node)=>{
        const labelAngle = node.baseAngle + 180;
        const labels = node.labels && node.labels.length ? node.labels : [node.label].filter(Boolean);
        labels.forEach((label)=>{
          label.style.setProperty("--label-angle", `${labelAngle.toFixed(3)}deg`);
          label.style.transform = `translate(-50%, -50%) rotate(${labelAngle.toFixed(3)}deg)`;
        });
      });
    }

    function tickPositionForRotation(degrees){
      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      return (270 - degrees) / step;
    }

    function setRotation(degrees){
      rotation = degrees;
      wheelRotor.style.transform = `rotate(${degrees}deg)`;
      wheelAudio.playTick(
        currentSectorIndexForRotation(degrees),
        tickPositionForRotation(degrees)
      );
    }

    function fitCenterText(){
      if (!wheelCenter.classList.contains("has-question")) return;

      const question = String(wheelCenter.textContent || "").trim();
      const length = question.length;
      wheelCenter.style.fontSize = "";

      let size = parseFloat(getComputedStyle(wheelCenter).fontSize || "20");
      const maxSize = size;
      const minSize = length > 52 ? 9 : length > 34 ? 10 : 11;

      // Short center questions should look important, like Wordwall.
      if (length && length <= 18) {
        size = Math.min(maxSize * 1.08, maxSize + 3);
        wheelCenter.style.fontSize = `${size}px`;
      }

      for (let i = 0; i < 20; i++) {
        if (wheelCenter.scrollWidth <= wheelCenter.clientWidth + 2 && wheelCenter.scrollHeight <= wheelCenter.clientHeight + 2) break;
        size -= 1;
        if (size < minSize) break;
        wheelCenter.style.fontSize = `${size}px`;
      }
    }

    function clearSelected(){
      document.querySelectorAll(".wheel-sector.selected").forEach((sector)=>{
        sector.classList.remove("selected");
      });
      document.querySelectorAll(".wheel-sector.eliminating").forEach((sector)=>{
        sector.classList.remove("eliminating");
      });
      document.querySelectorAll(".wheel-label.eliminating").forEach((label)=>{
        label.classList.remove("eliminating");
      });
    }

    function highlightSelected(index){
      clearSelected();
      const sector = document.querySelector(`.wheel-sector[data-index="${index}"]`);
      if (!sector) return;
      sector.classList.remove("selected");
      void sector.getBoundingClientRect();
      sector.classList.add("selected");
    }

    function resetFocus(duration = 520){
      wheelShell.classList.remove("zoom");
      wheelShell.classList.remove("merging");
      afterSpin.classList.remove("show");
      clearSelected();
      animateVisualZoom(1, duration);
    }

    function playMergeSettle(){
      wheelShell.classList.remove("merging");
      void wheelShell.offsetWidth;
      wheelShell.classList.add("merging");
      setTimeout(()=> wheelShell.classList.remove("merging"), 1050);
    }

    function resumeWheelZoomOnly(){
      wheelShell.classList.remove("zoom");
      afterSpin.classList.remove("show");
      animateVisualZoom(1, 1450);
      collapseSafariBars();
    }

    function applyFocus(){
      requestAnimationFrame(()=>{
        configureZoom(layoutGeometry);
        wheelShell.classList.add("zoom");
        animateVisualZoom(getConfiguredZoomScale(), 2400);
        collapseSafariBars();
      });
    }

    function getSelectedIndexAtArrow(){
      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const localAngleAtArrow = normalizeAngle(180 - normalizeAngle(rotation));
      const relative = normalizeAngle(localAngleAtArrow - (-90));
      const nearestCenterIndex = Math.round((relative - step / 2) / step);
      return ((nearestCenterIndex % count) + count) % count;
    }

    function showSelected(forcedIndex = null){
      if (activityEnded) return;
      const items = getItems();
      const count = Math.max(items.length, 1);
      const index = Number.isInteger(forcedIndex)
        ? ((forcedIndex % count) + count) % count
        : getSelectedIndexAtArrow();

      selectedIndex = index;
      wheelAudio.endTicks();
      wheelAudio.playSelect();
      selectedResult.textContent = "";
      afterSpin.classList.add("show");
      highlightSelected(index);
      applyFocus();
    }

    function easeOutQuint(t){
      return 1 - Math.pow(1 - t, 5);
    }

    function preStopShakeOffset(progress){
      if (progress < 0.76) return 0;

      const t = (progress - 0.76) / 0.24;
      const fade = Math.pow(1 - t, 1.35);
      const slowWave = Math.sin(t * Math.PI * 5.25);
      const tinyWave = Math.sin(t * Math.PI * 13) * 0.22;

      return (slowWave + tinyWave) * fade * 2.15;
    }

    function cancelAnimation(){
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }

    function delay(ms){
      return new Promise((resolve)=> setTimeout(resolve, ms));
    }

    function animateRemovalHealing(removeIndex, duration = 980){
      const items = getItems();
      const oldCount = items.length;
      const newCount = oldCount - 1;

      if (oldCount <= 1 || newCount <= 0) {
        return Promise.resolve();
      }

      const radius = 224;
      const oldStep = 360 / oldCount;
      const newStep = 360 / newCount;
      const records = [];

      document.querySelectorAll(".wheel-sector[data-index]").forEach((sector)=>{
        const oldIndex = Number(sector.dataset.index);
        if (!Number.isInteger(oldIndex) || oldIndex === removeIndex) return;

        const newIndex = oldIndex < removeIndex ? oldIndex : oldIndex - 1;
        const oldStart = -90 + oldIndex * oldStep;
        const oldEnd = oldStart + oldStep;
        const newStart = -90 + newIndex * newStep;
        const newEnd = newStart + newStep;
        const node = labelNodes[oldIndex] || null;

        records.push({
          sector,
          node,
          oldStart,
          oldEnd,
          newStart,
          newEnd,
          oldMid: oldStart + oldStep / 2,
          newMid: newStart + newStep / 2
        });
      });

      if (!records.length) {
        return Promise.resolve();
      }

      const easeInOutSine = (t)=> {
        const p = Math.max(0, Math.min(1, t));
        return -(Math.cos(Math.PI * p) - 1) / 2;
      };

      const lerp = (a, b, t)=> a + (b - a) * t;

      return new Promise((resolve)=>{
        const startTime = performance.now();

        function frame(now){
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = easeInOutSine(progress);

          records.forEach((record)=>{
            const start = lerp(record.oldStart, record.newStart, eased);
            const end = lerp(record.oldEnd, record.newEnd, eased);
            record.sector.setAttribute("d", sectorPath(start, end, radius));

            if (record.node) {
              record.node.baseAngle = lerp(record.oldMid, record.newMid, eased);
            }
          });

          positionLabels();

          if (progress < 1) {
            requestAnimationFrame(frame);
            return;
          }

          records.forEach((record)=>{
            record.sector.setAttribute("d", sectorPath(record.newStart, record.newEnd, radius));
            if (record.node) record.node.baseAngle = record.newMid;
          });

          positionLabels();
          resolve();
        }

        requestAnimationFrame(frame);
      });
    }

    async function eliminateSelectedSection(){
      if (isRemoving || selectedIndex < 0) return;

      const items = getItems();
      if (!items.length) return;

      isRemoving = true;
      afterSpin.classList.remove("show");

      const removeIndex = selectedIndex;

      /*
        wheel-43:
        الحذف لا يبدأ داخل الزوم.
        نرجع العجلة أولًا للوضع الطبيعي، ثم ننفذ اختفاء القسم والالتئام.
      */
      wheelShell.classList.remove("zoom");
      await animateVisualZoom(1, 1050);
      await delay(120);

      wheelAudio.playRemove();

      const sector = document.querySelector(`.wheel-sector[data-index="${removeIndex}"]`);
      const selectedNode = labelNodes[removeIndex] || null;
      const labels = selectedNode?.labels && selectedNode.labels.length ? selectedNode.labels : [selectedNode?.label].filter(Boolean);

      if (sector) sector.classList.add("eliminating");
      labels.forEach((label)=> label.classList.add("eliminating"));

      // اختفاء أبطأ قليلًا للقسم بعد رجوع العجلة كاملة
      await delay(720);

      // تحريك الأقسام المحيطة بصريًا حتى تغلق مكان القسم المحذوف
      await animateRemovalHealing(removeIndex, 980);

      payload.entries = items.slice();
      payload.entries.splice(removeIndex, 1);

      if (!payload.entries.length) {
        selectedIndex = -1;
        rotation = 0;
        persistPayload();
        showEndCelebration();
        isRemoving = false;
        return;
      }

      selectedIndex = -1;
      rotation = 0;
      resetFocus(520);
      persistPayload();
      buildWheel();
      playMergeSettle();
      isRemoving = false;
    }

    function animateTo(targetRotation, duration = 5200, targetIndex = null){
      cancelAnimation();
      wheelAudio.beginTicks();

      const start = rotation;
      const change = targetRotation - start;
      const startTime = performance.now();
      resetFocus();
      selectedResult.textContent = "";

      function frame(now){
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOutQuint(progress);

        const baseRotation = start + change * eased;
        const shake = preStopShakeOffset(progress);
        setRotation(baseRotation + shake);

        if (progress < 1) {
          animationId = requestAnimationFrame(frame);
        } else {
          animationId = null;
          setRotation(targetRotation);
          showSelected(targetIndex);
        }
      }

      animationId = requestAnimationFrame(frame);
    }

    function spinRandom(direction = 1){
      if (isRemoving || activityEnded) return;

      const items = getItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const selected = count === 1 ? 0 : Math.floor(Math.random() * count);
      const selectedCenterAngle = -90 + selected * step + step / 2;
      const desiredNorm = normalizeAngle(180 - selectedCenterAngle);
      const currentNorm = normalizeAngle(rotation);

      let delta = desiredNorm - currentNorm;
      const fullTurns = 5 + Math.floor(Math.random() * 3);

      if (direction < 0) {
        while (delta > 0) delta -= 360;
        delta -= fullTurns * 360;
      } else {
        while (delta < 0) delta += 360;
        delta += fullTurns * 360;
      }

      selectedIndex = selected;
      animateTo(rotation + delta, 4700 + Math.floor(Math.random() * 450), selected);
    }

    function angleFromPointer(event, element){
      const rect = element.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI;
    }

    wheelShell.addEventListener("pointerdown", (event)=>{
      if (isRemoving || activityEnded) return;

      wheelAudio.unlock();
      wheelAudio.beginTicks();
      cancelAnimation();
      resetFocus();
      wheelShell.setPointerCapture?.(event.pointerId);
      selectedResult.textContent = "";

      dragState = {
        pointerId: event.pointerId,
        lastAngle: angleFromPointer(event, wheelShell),
        totalDelta: 0,
        lastDirection: 1
      };
    });

    wheelShell.addEventListener("pointermove", (event)=>{
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      event.preventDefault();

      const currentAngle = angleFromPointer(event, wheelShell);
      let delta = currentAngle - dragState.lastAngle;

      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      dragState.lastAngle = currentAngle;
      dragState.totalDelta += delta;
      if (Math.abs(delta) > 0.35) dragState.lastDirection = delta >= 0 ? 1 : -1;

      setRotation(rotation + delta);
    });

    function endDrag(event){
      if (!dragState || dragState.pointerId !== event.pointerId) return;

      const totalDelta = dragState.totalDelta || 0;
      const direction = totalDelta < 0 ? -1 : (dragState.lastDirection || 1);
      dragState = null;

      if (Math.abs(totalDelta) >= 4) {
        spinRandom(direction);
      } else {
        showSelected();
      }
    }

    wheelShell.addEventListener("pointerup", endDrag);
    wheelShell.addEventListener("pointercancel", endDrag);

    document.getElementById("spinBtn").addEventListener("click", async ()=>{
      await wheelAudio.unlock();
      wheelAudio.playButton();
      afterSpin.classList.remove("show");
      spinRandom(1);
    });

    document.getElementById("resumeBtn").addEventListener("click", ()=>{
      wheelAudio.unlock();
      wheelAudio.playButton();
      resumeWheelZoomOnly();
    });

    document.getElementById("removeBtn").addEventListener("click", ()=>{
      wheelAudio.unlock();
      wheelAudio.playButton();
      eliminateSelectedSection();
    });

    restartBtn?.addEventListener("click", ()=>{
      wheelAudio.unlock();
      wheelAudio.playButton();
      restartActivity();
    });
    homeBtn?.addEventListener("click", (event)=>{
      wheelAudio.stopNamed("finish");
      wheelAudio.unlock();
      wheelAudio.playButton();
      goHomePage(event);
    });
    homeBtn?.addEventListener("pointerup", (event)=>{
      if (event.pointerType === "touch" || event.pointerType === "pen") {
        goHomePage(event);
      }
    });

    document.getElementById("backBtn").addEventListener("click", ()=>{
      wheelAudio.stopNamed("finish");
      wheelAudio.unlock();
      wheelAudio.playButton();
      persistPayload();

      if (document.referrer && document.referrer !== location.href) {
        history.back();
      } else {
        window.location.href = "index-6.html#wheelSetup";
      }
    });

    window.addEventListener("resize", ()=> {
      requestAnimationFrame(updateLayout);
      requestAnimationFrame(fitCenterText);
    }, { passive:true });

    window.addEventListener("orientationchange", ()=> {
      setTimeout(()=>{
        updateLayout();
        fitCenterText();
        collapseSafariBars();
      }, 120);
    }, { passive:true });

    document.addEventListener("touchend", collapseSafariBars, { passive:true });


    function finishIntroAnimation(){
      if (!wheelPage) return;

      wheelPage.classList.remove("intro-done");

      /*
        wheel-40:
        حركة كاميرا مستمرة بدون keyframe stops.
        - وقفة بداية بسيطة.
        - بعدها تكبير مستمر كل فريم باستخدام requestAnimationFrame.
        - لا توجد محطات وسطية، لذلك لا يحدث إحساس "تكبر ثم توقف".
      */
      const holdMs = 2200;
      const zoomMs = 7600;
      const startWheelScale = 0.42;
      const endWheelScale = 1;
      const startBgScale = 1;
      const endBgScale = Number(getComputedStyle(wheelPage).getPropertyValue("--intro-bg-final-scale")) || 1.18;

      let introFrame = null;
      let startTime = null;

      const easeInOutSine = (t)=> {
        const p = Math.max(0, Math.min(1, t));
        return -(Math.cos(Math.PI * p) - 1) / 2;
      };

      const setIntroFrame = (wheelScale, bgScale)=> {
        if (wheelStage) {
          wheelStage.style.transform = `scale(${wheelScale})`;
          wheelStage.style.animation = "none";
        }

        if (themeBackground) {
          themeBackground.style.transform = `scale(${bgScale})`;
          themeBackground.style.animation = "none";
          const saturation = 1.04 - ((bgScale - startBgScale) / Math.max(0.001, endBgScale - startBgScale)) * 0.04;
          themeBackground.style.filter = `saturate(${Math.max(1, Math.min(1.04, saturation))})`;
        }
      };

      const endIntro = ()=> {
        if (introFrame) cancelAnimationFrame(introFrame);

        wheelPage.classList.remove("intro-playing");
        wheelPage.classList.add("intro-done");

        if (wheelStage) {
          wheelStage.style.transform = "";
          wheelStage.style.animation = "";
        }

        if (themeBackground) {
          themeBackground.style.transform = `scale(${endBgScale})`;
          themeBackground.style.animation = "";
          themeBackground.style.filter = "";
        }

        if (fixedControls) {
          fixedControls.style.opacity = "1";
          fixedControls.style.transform = "none";
          fixedControls.style.pointerEvents = "";
        }
      };

      setIntroFrame(startWheelScale, startBgScale);

      const animate = (now)=> {
        if (startTime === null) startTime = now;
        const elapsed = now - startTime;

        if (elapsed < holdMs) {
          setIntroFrame(startWheelScale, startBgScale);
          introFrame = requestAnimationFrame(animate);
          return;
        }

        const rawProgress = (elapsed - holdMs) / zoomMs;
        const progress = Math.max(0, Math.min(1, rawProgress));
        const eased = easeInOutSine(progress);

        const wheelScale = startWheelScale + (endWheelScale - startWheelScale) * eased;
        const bgScale = startBgScale + (endBgScale - startBgScale) * eased;

        setIntroFrame(wheelScale.toFixed(5), bgScale.toFixed(5));

        if (progress < 1) {
          introFrame = requestAnimationFrame(animate);
          return;
        }

        setTimeout(endIntro, 220);
      };

      introFrame = requestAnimationFrame(animate);
    }

    wheelAudio.setEnabled(payload.soundEnabled !== false);
    themeIntroAudio.setEnabled(normalizeSoundEnabled(payload));
    applyWheelTheme(payload.theme);
    applyWheelAppearance();
    setVisualZoomScale(1);
    buildWheel();
    updateLayout();
    fitCenterText();
    collapseSafariBars();
    let wheelGameStarted = false;

    async function startWheelFromGate(event){
      event?.preventDefault?.();
      event?.stopPropagation?.();
      if (wheelGameStarted) return;
      wheelGameStarted = true;

      await wheelAudio.unlock();
      themeIntroAudio.play(payload.theme, false);

      startGate?.classList.remove("is-visible");
      startGate?.setAttribute("aria-hidden", "true");

      finishIntroAnimation();
    }

    startGameBtn?.addEventListener("click", startWheelFromGate);
    window.addEventListener("pagehide",()=>{
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      wheelAudio.stopNamed("finish");
      themeIntroAudio.stop();
    },{passive:true});
    themeIntroAudio.preload(payload.theme);
    wheelAudio.ready("finish");
  </script>
</body>
</html>
