<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مختبر سقوط الصندوق - إصدار 4</title>
  <style>
    :root{
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --panel:#10233f;
      --yellow:#ffd24a;
      --cyan:#28d7ff;
      --pink:#ff4f9a;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{min-height:100dvh;overflow:hidden}

    .page{
      position:relative;
      width:100vw;
      height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      background:
        linear-gradient(180deg,#bfcbe8 0%,#dce3f2 45%,#ead5ac 46%,#d7a464 72%,#bd7f42 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      z-index:1;
    }

    .panel{
      position:absolute;
      left:14px;
      right:14px;
      bottom:calc(14px + var(--safe-bottom));
      z-index:5;
      display:flex;
      gap:9px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      direction:rtl;
      padding:11px;
      background:rgba(13,30,58,.84);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      backdrop-filter:blur(8px);
    }

    .panel-title{
      color:#fff;
      font-weight:900;
      font-size:14px;
      margin-inline:6px 8px;
      white-space:nowrap;
    }

    button{
      border:0;
      border-radius:999px;
      padding:10px 13px;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      color:#10233f;
      background:var(--yellow);
      box-shadow:0 5px 0 rgba(0,0,0,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }

    button:nth-of-type(2n){background:var(--cyan)}
    button:nth-of-type(3n){background:var(--pink);color:#fff}

    button:active{
      transform:translateY(3px);
      box-shadow:0 2px 0 rgba(0,0,0,.22);
    }

    .note{
      position:absolute;
      top:13px;
      right:13px;
      z-index:5;
      direction:rtl;
      max-width:min(600px,calc(100vw - 26px));
      padding:10px 13px;
      border-radius:15px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.55);
      color:#17345d;
      font-weight:900;
      line-height:1.55;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
    }

    .small{font-size:12px;font-weight:750;color:#365477}

    @media (max-width:700px){
      .note{font-size:12px}
      .panel{bottom:calc(8px + var(--safe-bottom));left:8px;right:8px}
      button{font-size:11px;padding:9px 10px}
      .panel-title{width:100%;text-align:center}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="note">
      مختبر حركة السقوط والاصطفاف — كل السقوط يبدأ من اليمين.
      <div class="small">فيه الآن أكثر من صندوق، ترتيب داخل العربة، قفزة فاصل حسب أقرب عربة، واصطدام مقطورة السائق مع دوران ثم ثبات.</div>
    </div>

    <svg id="stage" class="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="مختبر سقوط صناديق داخل عربات القطار">
      <defs>
        <linearGradient id="sceneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfcae6"/>
          <stop offset="45%" stop-color="#dce3f2"/>
          <stop offset="46%" stop-color="#ead5ac"/>
          <stop offset="72%" stop-color="#d7a464"/>
          <stop offset="100%" stop-color="#bd7f42"/>
        </linearGradient>
        <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b87948"/>
          <stop offset="48%" stop-color="#8d552f"/>
          <stop offset="100%" stop-color="#5f351e"/>
        </linearGradient>
        <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#cc8d58"/>
          <stop offset="100%" stop-color="#87502d"/>
        </linearGradient>
        <filter id="softShadow" x="-35%" y="-35%" width="170%" height="180%">
          <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#2b170c" flood-opacity=".25"/>
        </filter>
      </defs>

      <g id="backgroundLayer"></g>
      <g id="trainBackLayer"></g>
      <g id="settledBoxLayer"></g>
      <g id="activeBoxLayer"></g>
      <g id="trainFrontLayer"></g>
      <g id="fxLayer"></g>
    </svg>

    <div class="panel">
      <div class="panel-title">اختبار الحركة:</div>
      <button data-action="drop-right">إسقاط صندوق</button>
      <button data-action="drop-three">إسقاط ٣ صناديق</button>
      <button data-action="gap-right">فاصل → العربة اليمنى</button>
      <button data-action="gap-left">فاصل → العربة اليسرى</button>
      <button data-action="roof">اصطدام مقطورة السائق</button>
      <button data-action="clear">مسح الصناديق</button>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const backgroundLayer = document.getElementById("backgroundLayer");
  const trainBackLayer = document.getElementById("trainBackLayer");
  const trainFrontLayer = document.getElementById("trainFrontLayer");
  const activeBoxLayer = document.getElementById("activeBoxLayer");
  const settledBoxLayer = document.getElementById("settledBoxLayer");
  const fxLayer = document.getElementById("fxLayer");

  const BOX = {left:46, right:58, top:32, bottom:42, width:104, height:74};

  const WAGONS = [
    {id:"left", label:"العربة اليسرى", x:202, y:486, w:300, h:111, floorY:535},
    {id:"right", label:"العربة اليمنى", x:490, y:486, w:300, h:111, floorY:535}
  ];

  const ENGINE = {x:782, y:430, w:320, h:179};
  const ROOF = {x1:784, x2:904, y:424};

  const settledByWagon = {left:[], right:[]};
  let activeBox = null;
  let activeAnim = null;
  let runId = 0;
  let sequenceTimer = null;

  function el(name, attrs = {}, parent = stage){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clearNode(node){
    while(node.firstChild) node.removeChild(node.firstChild);
  }

  function clamp(v, min, max){
    return Math.max(min, Math.min(max, v));
  }

  function wagonCenter(wagon){
    return wagon.x + wagon.w / 2;
  }

  function makeImage(href, attrs, parent){
    const image = el("image", {href, ...attrs}, parent);
    image.setAttributeNS("http://www.w3.org/1999/xlink", "href", href);
    return image;
  }

  function drawBackground(){
    clearNode(backgroundLayer);

    el("rect", {x:0, y:0, width:1280, height:720, fill:"url(#sceneGrad)"}, backgroundLayer);
    el("path", {
      d:"M-120 314 C-55 240 40 306 116 198 C185 101 246 210 318 116 C392 230 448 146 517 270 C582 150 642 212 716 100 C785 230 840 166 916 304 C990 190 1047 260 1120 150 C1190 250 1295 210 1400 270 L1400 426 L-120 426 Z",
      fill:"#7d86aa",
      opacity:".31"
    }, backgroundLayer);
    el("path", {
      d:"M-120 360 C0 302 110 343 230 238 C352 150 403 302 492 228 C590 310 674 252 752 330 C834 242 926 304 1005 216 C1085 346 1185 260 1400 332 L1400 426 L-120 426 Z",
      fill:"#afa0ad",
      opacity:".44"
    }, backgroundLayer);

    makeImage("train-track.webp?v=lab4", {
      x:-55,
      y:604,
      width:1390,
      height:27,
      preserveAspectRatio:"none"
    }, backgroundLayer);
  }

  function drawTrain(){
    clearNode(trainBackLayer);
    clearNode(trainFrontLayer);

    WAGONS.forEach((wagon, index) => {
      // عجلات مثل صفحة القطار تقريبًا.
      const wheelY = 585.3;
      const size = 47.4;
      const firstX = wagon.x + 49;
      const gap = 66;

      for(let i = 0; i < 4; i++){
        makeImage("train-wheel.webp?v=lab4", {
          x:firstX + i * gap - size / 2,
          y:wheelY - size / 2,
          width:size,
          height:size,
          preserveAspectRatio:"xMidYMid meet"
        }, trainBackLayer);
      }

      makeImage("train-wagon.webp?v=lab4", {
        x:wagon.x,
        y:wagon.y,
        width:wagon.w,
        height:wagon.h,
        preserveAspectRatio:"xMidYMid meet"
      }, trainBackLayer);

      // نسخة أمامية تغطي جزءًا من الصناديق حتى يظهر الاصطفاف داخل الحوض.
      makeImage("train-wagon.webp?v=lab4", {
        x:wagon.x,
        y:wagon.y,
        width:wagon.w,
        height:wagon.h,
        preserveAspectRatio:"xMidYMid meet"
      }, trainFrontLayer);

      el("text", {
        x:wagonCenter(wagon),
        y:wagon.y + wagon.h * .56,
        "text-anchor":"middle",
        "dominant-baseline":"middle",
        fill:"#ffe28a",
        stroke:"#5b2618",
        "stroke-width":2.6,
        "paint-order":"stroke fill",
        "font-size":26,
        "font-weight":900,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"rtl"
      }, trainFrontLayer).textContent = index === 0 ? "يسار" : "يمين";
    });

    makeImage("train-engine-transparent.png?v=lab4", {
      x:ENGINE.x,
      y:ENGINE.y,
      width:ENGINE.w,
      height:ENGINE.h,
      preserveAspectRatio:"xMidYMid meet"
    }, trainBackLayer);

    // تحديد بصري خفيف لمنطقة اصطدام مقطورة السائق في المختبر فقط.
    el("rect", {
      x:ROOF.x1,
      y:ROOF.y - 4,
      width:ROOF.x2 - ROOF.x1,
      height:20,
      rx:7,
      fill:"#32a8ff",
      opacity:".18",
      stroke:"#1383d5",
      "stroke-width":2
    }, trainBackLayer);
  }

  function createBox(label = "إجابة"){
    const g = el("g", {filter:"url(#softShadow)"}, activeBoxLayer);

    el("path", {
      d:"M-46 -32 L46 -32 L58 -18 L-34 -18 Z",
      fill:"url(#boxTop)",
      stroke:"#4e2b18",
      "stroke-width":2
    }, g);

    el("rect", {
      x:-46,
      y:-18,
      width:92,
      height:60,
      rx:7,
      fill:"url(#boxBody)",
      stroke:"#4e2b18",
      "stroke-width":2.5
    }, g);

    el("path", {
      d:"M-46 2 L46 2 M-18 -18 L-18 42 M18 -18 L18 42",
      fill:"none",
      stroke:"#d3a06a",
      "stroke-width":3,
      opacity:".72"
    }, g);

    el("text", {
      x:0,
      y:5,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#fff0b8",
      stroke:"#442313",
      "stroke-width":1.9,
      "paint-order":"stroke fill",
      "font-size":16,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g).textContent = label;

    return g;
  }

  function setBoxState(node, state){
    node.setAttribute(
      "transform",
      `translate(${state.x.toFixed(2)} ${state.y.toFixed(2)}) rotate(${state.r.toFixed(2)}) scale(${(state.s ?? 1).toFixed(3)})`
    );

    if(state.inside && node.parentNode !== settledBoxLayer){
      settledBoxLayer.appendChild(node);
    }
  }

  function catmull(p0, p1, p2, p3, t){
    const t2 = t * t;
    const t3 = t2 * t;
    return .5 * (
      (2 * p1) +
      (-p0 + p2) * t +
      (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
      (-p0 + 3 * p1 - 3 * p2 + p3) * t3
    );
  }

  function sample(frames, index, prop, t){
    const p0 = frames[Math.max(0, index - 1)][prop];
    const p1 = frames[index][prop];
    const p2 = frames[Math.min(frames.length - 1, index + 1)][prop];
    const p3 = frames[Math.min(frames.length - 1, index + 2)][prop];
    return catmull(p0, p1, p2, p3, t);
  }

  function interpolate(frames, elapsed){
    if(elapsed <= frames[0].t) return {...frames[0]};

    for(let i = 0; i < frames.length - 1; i++){
      const a = frames[i];
      const b = frames[i + 1];

      if(elapsed >= a.t && elapsed <= b.t){
        const t = clamp((elapsed - a.t) / (b.t - a.t || 1), 0, 1);
        return {
          x:sample(frames, i, "x", t),
          y:sample(frames, i, "y", t),
          r:sample(frames, i, "r", t),
          s:(a.s ?? 1) + ((b.s ?? 1) - (a.s ?? 1)) * t,
          inside:!!(a.inside || b.inside)
        };
      }
    }

    return {...frames[frames.length - 1]};
  }

  function getSlot(wagonId){
    const wagon = WAGONS.find(w => w.id === wagonId) || WAGONS[1];
    const count = settledByWagon[wagonId].length;
    const c = wagonCenter(wagon);

    // الأول للخلف، الثاني بارز للأمام، الثالث وسط/خلف.
    const slots = [
      {x:c - 18, y:489, r:-7, s:.94},
      {x:c + 18, y:493, r:-9, s:1.03},
      {x:c + 42, y:487, r:-4, s:.98}
    ];

    return {wagon, ...slots[Math.min(count, slots.length - 1)]};
  }

  function rememberSettled(node, wagonId){
    const list = settledByWagon[wagonId];

    if(list.length >= 3){
      const old = list.shift();
      if(old && old.parentNode) old.remove();
    }

    list.push(node);

    // إعادة ترتيب الرسم: الأقدم خلف، الأحدث أمام داخل نفس طبقة الصناديق.
    [...settledByWagon.left, ...settledByWagon.right].forEach(box => {
      if(box && box.parentNode === settledBoxLayer){
        settledBoxLayer.appendChild(box);
      }
    });
  }

  function buildDirectDropFrames(slot){
    const c = wagonCenter(slot.wagon);
    const impactX = c + 34;
    return [
      {t:0, x:748, y:122, r:-7},
      {t:140, x:742, y:160, r:-10},
      {t:300, x:728, y:235, r:-17},
      {t:470, x:704, y:346, r:-28},
      {t:610, x:impactX + 6, y:455, r:-39},
      {t:700, x:impactX, y:493, r:-34, inside:true},
      // السقوط المباشر: نطة بسيطة بدون دوران كبير.
      {t:805, x:impactX - 16, y:476, r:-27, inside:true},
      {t:980, x:slot.x + 24, y:slot.y - 7, r:slot.r - 9, inside:true},
      {t:1210, x:slot.x + 9, y:slot.y - 2, r:slot.r - 3, inside:true, s:slot.s},
      {t:1510, x:slot.x, y:slot.y, r:slot.r, inside:true, s:slot.s},
      {t:1780, x:slot.x, y:slot.y, r:slot.r, inside:true, s:slot.s}
    ];
  }

  function buildGapFrames(slot, side){
    const c = wagonCenter(slot.wagon);
    const hitX = side === "left" ? 500 : 530;

    return [
      {t:0, x:760, y:124, r:-6},
      {t:150, x:754, y:166, r:-10},
      {t:320, x:744, y:245, r:-18},
      {t:500, x:729, y:365, r:-30},
      {t:640, x:hitX + 18, y:470, r:-43},
      {t:720, x:hitX, y:494, r:-39},
      // الفاصل يقفز باتجاه العربة الأقرب.
      {t:850, x:hitX + (side === "left" ? -34 : 34), y:398, r:-62},
      {t:1040, x:c + (side === "left" ? 12 : -4), y:382, r:-76},
      {t:1240, x:c + (side === "left" ? 26 : 34), y:443, r:-58},
      {t:1390, x:c + 24, y:493, r:-38, inside:true},
      {t:1540, x:c + 7, y:476, r:-25, inside:true},
      {t:1820, x:slot.x + 10, y:slot.y - 3, r:slot.r - 7, inside:true, s:slot.s},
      {t:2220, x:slot.x, y:slot.y, r:slot.r, inside:true, s:slot.s}
    ];
  }

  function buildRoofFrames(slot){
    const c = wagonCenter(slot.wagon);
    return [
      {t:0, x:854, y:108, r:-4},
      {t:150, x:850, y:156, r:-9},
      {t:320, x:840, y:250, r:-20},
      {t:500, x:826, y:374, r:-34},
      {t:600, x:814, y:390, r:-42},
      // قفزة أعلى مع دوران واضح مثل الفيديو.
      {t:780, x:770, y:258, r:-88},
      {t:1010, x:728, y:304, r:-124},
      {t:1200, x:696, y:420, r:-101},
      // اصطدام العربة بعد القفزة، ثم نطة صغيرة وانزلاق.
      {t:1340, x:c + 42, y:493, r:-64, inside:true},
      {t:1500, x:c + 16, y:474, r:-43, inside:true},
      {t:1800, x:slot.x + 18, y:slot.y - 4, r:slot.r - 12, inside:true, s:slot.s},
      {t:2220, x:slot.x, y:slot.y, r:slot.r, inside:true, s:slot.s}
    ];
  }

  function playFrames(frames, options = {}){
    runId += 1;
    const localRun = runId;

    if(activeAnim) cancelAnimationFrame(activeAnim);
    activeBox = createBox(options.label || "إجابة");

    const start = performance.now();

    function frame(now){
      if(localRun !== runId) return;

      const elapsed = now - start;
      const state = interpolate(frames, elapsed);
      setBoxState(activeBox, state);

      const end = frames[frames.length - 1].t;
      if(elapsed < end){
        activeAnim = requestAnimationFrame(frame);
      }else{
        const finalState = frames[frames.length - 1];
        setBoxState(activeBox, finalState);

        if(options.settleWagonId){
          rememberSettled(activeBox, options.settleWagonId);
        }

        activeBox = null;
        activeAnim = null;
      }
    }

    requestAnimationFrame(frame);
  }

  function dropDirect(wagonId = "right"){
    const slot = getSlot(wagonId);
    playFrames(buildDirectDropFrames(slot), {
      settleWagonId:wagonId,
      label:String(settledByWagon[wagonId].length + 1)
    });
  }

  function dropGap(side){
    const wagonId = side === "left" ? "left" : "right";
    const slot = getSlot(wagonId);
    playFrames(buildGapFrames(slot, side), {
      settleWagonId:wagonId,
      label:String(settledByWagon[wagonId].length + 1)
    });
  }

  function dropRoof(){
    const wagonId = "right";
    const slot = getSlot(wagonId);
    playFrames(buildRoofFrames(slot), {
      settleWagonId:wagonId,
      label:String(settledByWagon[wagonId].length + 1)
    });
  }

  function dropThree(){
    clearAll(false);
    dropDirect("right");
    sequenceTimer = setTimeout(() => dropDirect("right"), 2100);
    setTimeout(() => dropDirect("right"), 4200);
  }

  function clearAll(redraw = true){
    runId += 1;
    if(activeAnim) cancelAnimationFrame(activeAnim);
    if(sequenceTimer) clearTimeout(sequenceTimer);
    activeAnim = null;
    sequenceTimer = null;
    activeBox = null;

    clearNode(activeBoxLayer);
    clearNode(settledBoxLayer);
    clearNode(fxLayer);
    settledByWagon.left.length = 0;
    settledByWagon.right.length = 0;

    if(redraw){
      drawBackground();
      drawTrain();
    }
  }

  document.querySelectorAll("button[data-action]").forEach(button => {
    button.addEventListener("click", () => {
      const action = button.dataset.action;
      if(action === "drop-right") dropDirect("right");
      if(action === "drop-three") dropThree();
      if(action === "gap-right") dropGap("right");
      if(action === "gap-left") dropGap("left");
      if(action === "roof") dropRoof();
      if(action === "clear") clearAll();
    });
  });

  drawBackground();
  drawTrain();
  setTimeout(() => dropDirect("right"), 420);
})();
</script>
</body>
</html>
