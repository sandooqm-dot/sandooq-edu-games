<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>مختبر سقوط الصندوق - إصدار 2</title>
  <style>
    :root{
      --bg:#d9ecff;
      --panel:#10233f;
      --yellow:#ffd24a;
      --cyan:#28d7ff;
      --pink:#ff4f9a;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:100dvh;
      overflow:hidden;
    }

    .page{
      position:relative;
      width:100vw;
      height:100dvh;
      overflow:hidden;
      direction:ltr;
      background:
        linear-gradient(180deg,#bfcbe8 0%,#dce3f2 45%,#ead5ac 46%,#d7a464 72%,#bd7f42 100%);
      user-select:none;
    }

    .stage{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      z-index:1;
    }

    .panel{
      position:absolute;
      inset-inline:18px;
      bottom:18px;
      z-index:5;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      direction:rtl;
      padding:12px;
      background:rgba(13,30,58,.82);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      backdrop-filter:blur(8px);
    }

    .panel-title{
      color:#fff;
      font-weight:900;
      font-size:15px;
      margin-inline:6px 10px;
      white-space:nowrap;
    }

    button{
      border:0;
      border-radius:999px;
      padding:11px 15px;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      color:#10233f;
      background:var(--yellow);
      box-shadow:0 5px 0 rgba(0,0,0,.18);
      transition:transform .12s ease, box-shadow .12s ease;
    }

    button:nth-of-type(2n){background:var(--cyan)}
    button:nth-of-type(3n){background:var(--pink);color:#fff}

    button:active{
      transform:translateY(3px);
      box-shadow:0 2px 0 rgba(0,0,0,.22);
    }

    .note{
      position:absolute;
      top:16px;
      right:16px;
      z-index:5;
      direction:rtl;
      max-width:min(560px,calc(100vw - 32px));
      padding:12px 15px;
      border-radius:16px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.55);
      color:#17345d;
      font-weight:800;
      line-height:1.55;
      box-shadow:0 10px 28px rgba(0,0,0,.12);
    }

    .small{
      font-size:13px;
      font-weight:700;
      color:#365477;
    }

    @media (max-width:700px){
      .note{font-size:12px}
      .panel{bottom:10px;inset-inline:10px}
      button{font-size:12px;padding:10px 12px}
      .panel-title{width:100%;text-align:center}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="note">
      مختبر مستقل لحركة السقوط فقط — السقوط المعتمد الآن من اليمين فقط.
      <div class="small">الهدف: ضبط الحركة قبل نقلها للعبة القطار الأساسية. بدون Matter.js وبدون تعديل ملف القطار.</div>
    </div>

    <svg id="stage" class="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="مختبر سقوط الصندوق داخل العربة">
      <defs>
        <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b87948"/>
          <stop offset="48%" stop-color="#8d552f"/>
          <stop offset="100%" stop-color="#5f351e"/>
        </linearGradient>
        <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#cc8d58"/>
          <stop offset="100%" stop-color="#87502d"/>
        </linearGradient>
        <linearGradient id="wagonBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d84a33"/>
          <stop offset="55%" stop-color="#9d2b22"/>
          <stop offset="100%" stop-color="#642016"/>
        </linearGradient>
        <linearGradient id="wagonLip" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffad58"/>
          <stop offset="100%" stop-color="#d77231"/>
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#2b170c" flood-opacity=".25"/>
        </filter>
      </defs>

      <g id="scene">
        <rect x="0" y="0" width="1280" height="720" fill="transparent"/>
        <path d="M-90 610 C180 585 310 635 530 604 C760 574 930 636 1370 595 L1370 760 L-90 760 Z" fill="#a76634" opacity=".28"/>
        <rect x="0" y="610" width="1280" height="18" fill="#3c2c28" opacity=".35"/>
        <rect x="-50" y="628" width="1380" height="8" fill="#2d241f" opacity=".58"/>
      </g>

      <g id="wagonBack"></g>
      <g id="roofLayer"></g>
      <g id="boxLayer"></g>
      <g id="wagonFront"></g>
      <g id="fxLayer"></g>
    </svg>

    <div class="panel">
      <div class="panel-title">اختبر الحركة:</div>
      <button data-clip="right">السقوط المعتمد من اليمين</button>
      <button data-clip="gap">قفزة الفاصل</button>
      <button data-clip="roof">اصطدام مقطورة السائق</button>
      <button data-clip="track">سقوط على السكة</button>
      <button data-clip="random">عشوائي من اليمين</button>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const wagonBack = document.getElementById("wagonBack");
  const wagonFront = document.getElementById("wagonFront");
  const roofLayer = document.getElementById("roofLayer");
  const boxLayer = document.getElementById("boxLayer");
  const fxLayer = document.getElementById("fxLayer");

  const WAGON = {
    // نفس مقاسات العربة الفعلية تقريبًا داخل صفحة القطار.
    x:490,
    y:486,
    w:300,
    h:111,
    floorY:535,
    frontTop:520,
    leftSafe:520,
    rightSafe:760
  };

  const ROOF = {
    x:784,
    y:424,
    w:120,
    h:18
  };

  let currentBox = null;
  let currentAnim = null;
  let clipCounter = 0;

  function el(name, attrs = {}, parent = stage){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }

  function easeOutCubic(t){
    return 1 - Math.pow(1 - t, 3);
  }

  function easeInCubic(t){
    return t * t * t;
  }

  function easeInOutSine(t){
    return -(Math.cos(Math.PI * t) - 1) / 2;
  }

  function easeOutSine(t){
    return Math.sin((t * Math.PI) / 2);
  }

  const eases = {
    linear:t => t,
    outCubic:easeOutCubic,
    inCubic:easeInCubic,
    inOutSine:easeInOutSine,
    outSine:easeOutSine
  };

  function clearNode(node){
    while(node.firstChild) node.removeChild(node.firstChild);
  }

  function drawWagon(){
    clearNode(wagonBack);
    clearNode(wagonFront);
    clearNode(roofLayer);

    // خلفية حوض العربة.
    el("path", {
      d:`M${WAGON.x + 24} ${WAGON.y + 28}
         C${WAGON.x + 70} ${WAGON.y + 12} ${WAGON.x + WAGON.w - 72} ${WAGON.y + 12} ${WAGON.x + WAGON.w - 24} ${WAGON.y + 28}
         L${WAGON.x + WAGON.w - 40} ${WAGON.y + 86}
         C${WAGON.x + WAGON.w - 82} ${WAGON.y + 112} ${WAGON.x + 82} ${WAGON.y + 112} ${WAGON.x + 40} ${WAGON.y + 86}
         Z`,
      fill:"#5f241b",
      opacity:".86"
    }, wagonBack);

    // أرضية داخلية ظاهرة خفيفة.
    el("ellipse", {
      cx:WAGON.x + WAGON.w / 2,
      cy:WAGON.floorY - 18,
      rx:WAGON.w * .39,
      ry:24,
      fill:"#3f1712",
      opacity:".55"
    }, wagonBack);

    // العجلات خلف الجسم.
    [0,1,2,3].forEach(i => {
      const cx = WAGON.x + 49 + i * 66;
      el("circle", {cx, cy:585, r:23.7, fill:"#30251f", stroke:"#17110e", "stroke-width":4.2}, wagonBack);
      el("circle", {cx, cy:585, r:10, fill:"#b68b5e", stroke:"#4a3022", "stroke-width":3.4}, wagonBack);
    });

    // سقف/منطقة مقطورة السائق للتجربة.
    el("rect", {
      x:ROOF.x,
      y:ROOF.y,
      width:ROOF.w,
      height:ROOF.h,
      rx:8,
      fill:"#2c9cff",
      opacity:".68",
      stroke:"#0067c7",
      "stroke-width":3
    }, roofLayer);
    el("text", {
      x:ROOF.x + ROOF.w / 2,
      y:ROOF.y - 12,
      "text-anchor":"middle",
      fill:"#08345f",
      "font-size":18,
      "font-weight":900,
      direction:"rtl"
    }, roofLayer).textContent = "منطقة القفزة";

    // واجهة العربة فوق الصندوق.
    el("path", {
      d:`M${WAGON.x + 18} ${WAGON.y + 38}
         C${WAGON.x + 78} ${WAGON.y + 60} ${WAGON.x + WAGON.w - 78} ${WAGON.y + 60} ${WAGON.x + WAGON.w - 18} ${WAGON.y + 38}
         L${WAGON.x + WAGON.w - 45} ${WAGON.y + WAGON.h - 4}
         C${WAGON.x + WAGON.w - 96} ${WAGON.y + WAGON.h + 18} ${WAGON.x + 96} ${WAGON.y + WAGON.h + 18} ${WAGON.x + 45} ${WAGON.y + WAGON.h - 4}
         Z`,
      fill:"url(#wagonBody)",
      stroke:"#531d15",
      "stroke-width":5,
      filter:"url(#softShadow)"
    }, wagonFront);

    el("path", {
      d:`M${WAGON.x + 30} ${WAGON.y + 38}
         C${WAGON.x + 88} ${WAGON.y + 25} ${WAGON.x + WAGON.w - 88} ${WAGON.y + 25} ${WAGON.x + WAGON.w - 30} ${WAGON.y + 38}`,
      fill:"none",
      stroke:"url(#wagonLip)",
      "stroke-width":13,
      "stroke-linecap":"round"
    }, wagonFront);

    el("text", {
      x:WAGON.x + WAGON.w / 2,
      y:WAGON.y + 82,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffe28a",
      stroke:"#5b2618",
      "stroke-width":3,
      "paint-order":"stroke fill",
      "font-size":34,
      "font-weight":1000,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, wagonFront).textContent = "العربة";
  }

  function createBox(){
    clearNode(boxLayer);
    clearNode(fxLayer);

    const g = el("g", {filter:"url(#softShadow)"}, boxLayer);

    el("path", {
      d:"M-48 -34 L48 -34 L60 -19 L-36 -19 Z",
      fill:"url(#boxTop)",
      stroke:"#4e2b18",
      "stroke-width":2.3
    }, g);

    el("rect", {
      x:-48,
      y:-19,
      width:96,
      height:62,
      rx:8,
      fill:"url(#boxBody)",
      stroke:"#4e2b18",
      "stroke-width":3
    }, g);

    el("path", {
      d:"M-48 3 L48 3 M-18 -19 L-18 43 M18 -19 L18 43",
      fill:"none",
      stroke:"#d3a06a",
      "stroke-width":3.2,
      opacity:".72"
    }, g);

    el("text", {
      x:0,
      y:7,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#fff0b8",
      stroke:"#442313",
      "stroke-width":2,
      "paint-order":"stroke fill",
      "font-size":18,
      "font-weight":900,
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g).textContent = "إجابة";

    currentBox = g;
    return g;
  }

  function setBoxState(state){
    if(!currentBox) return;

    currentBox.setAttribute(
      "transform",
      `translate(${state.x.toFixed(2)} ${state.y.toFixed(2)}) rotate(${state.r.toFixed(2)}) scale(${(state.s ?? 1).toFixed(3)})`
    );

    // الصندوق يبدأ فوق العربة، ثم يدخل خلف واجهتها بعد نقطة الاصطدام.
    if(state.inside){
      if(currentBox.parentNode !== boxLayer){
        boxLayer.appendChild(currentBox);
      }
    }
  }

  function burst(x, y){
    clearNode(fxLayer);
    const g = el("g", {transform:`translate(${x} ${y})`}, fxLayer);

    for(let i = 0; i < 16; i++){
      const angle = Math.random() * Math.PI * 2;
      const dist = 22 + Math.random() * 60;
      const dot = el("circle", {
        cx:0,
        cy:0,
        r:3 + Math.random() * 4,
        fill:i % 2 ? "#8a5a34" : "#e0ae71",
        opacity:".86"
      }, g);

      const move = el("animateTransform", {
        attributeName:"transform",
        type:"translate",
        from:"0 0",
        to:`${Math.cos(angle) * dist} ${Math.sin(angle) * dist * .55}`,
        dur:".45s",
        fill:"freeze"
      }, dot);
      const fade = el("animate", {
        attributeName:"opacity",
        values:".86;.35;0",
        dur:".45s",
        fill:"freeze"
      }, dot);
      move.beginElement();
      fade.beginElement();
    }

    setTimeout(() => clearNode(fxLayer), 620);
  }

  function interpolateFrames(frames, elapsed){
    if(elapsed <= frames[0].t) return {...frames[0]};

    for(let i = 0; i < frames.length - 1; i++){
      const a = frames[i];
      const b = frames[i + 1];

      if(elapsed >= a.t && elapsed <= b.t){
        const span = b.t - a.t || 1;
        const raw = (elapsed - a.t) / span;
        const ease = eases[b.ease || "linear"] || eases.linear;
        const p = ease(raw);

        return {
          x:a.x + (b.x - a.x) * p,
          y:a.y + (b.y - a.y) * p,
          r:a.r + (b.r - a.r) * p,
          s:(a.s ?? 1) + ((b.s ?? 1) - (a.s ?? 1)) * p,
          inside:b.inside || a.inside
        };
      }
    }

    return {...frames[frames.length - 1]};
  }

  const clips = {
    right:{
      label:"السقوط المعتمد من اليمين",
      frames:[
        {t:0, x:740, y:132, r:-8},
        {t:270, x:724, y:252, r:-18, ease:"inCubic"},
        {t:520, x:696, y:430, r:-36, ease:"inCubic"},
        {t:650, x:672, y:491, r:-30, inside:true, ease:"linear"},
        {t:780, x:648, y:472, r:-21, inside:true, ease:"linear"},
        {t:1040, x:622, y:484, r:-13, inside:true, ease:"linear"},
        {t:1420, x:603, y:486, r:-8, inside:true, ease:"outCubic"},
        {t:1760, x:594, y:486, r:-7, inside:true, ease:"outCubic"}
      ]
    },
    gap:{
      label:"قفزة الفاصل",
      frames:[
        {t:0, x:454, y:138, r:-6},
        {t:285, x:466, y:268, r:-18, ease:"inCubic"},
        {t:535, x:486, y:442, r:-34, ease:"inCubic"},
        {t:650, x:506, y:490, r:-26, ease:"linear"},
        {t:800, x:548, y:382, r:-54, ease:"outSine"},
        {t:1040, x:606, y:435, r:-69, ease:"linear"},
        {t:1240, x:650, y:491, r:-43, inside:true, ease:"linear"},
        {t:1400, x:636, y:472, r:-28, inside:true, ease:"linear"},
        {t:1740, x:612, y:484, r:-15, inside:true, ease:"linear"},
        {t:2200, x:600, y:486, r:-9, inside:true, ease:"outCubic"}
      ]
    },
    roof:{
      label:"اصطدام مقطورة السائق",
      frames:[
        {t:0, x:840, y:108, r:-4},
        {t:300, x:834, y:260, r:-20, ease:"inCubic"},
        {t:500, x:824, y:382, r:-34, ease:"inCubic"},
        {t:610, x:812, y:388, r:-40, ease:"linear"},
        {t:805, x:768, y:292, r:-78, ease:"outSine"},
        {t:1080, x:720, y:380, r:-104, ease:"linear"},
        {t:1280, x:680, y:491, r:-61, inside:true, ease:"linear"},
        {t:1440, x:656, y:472, r:-38, inside:true, ease:"linear"},
        {t:1800, x:624, y:484, r:-19, inside:true, ease:"linear"},
        {t:2280, x:604, y:486, r:-11, inside:true, ease:"outCubic"}
      ]
    },
    track:{
      label:"سقوط على السكة",
      frames:[
        {t:0, x:1000, y:130, r:5},
        {t:300, x:980, y:286, r:24, ease:"inCubic"},
        {t:590, x:948, y:514, r:52, ease:"inCubic"},
        {t:720, x:932, y:602, r:68, ease:"linear"}
      ],
      breakAtEnd:true
    }
  };

  const randomOrder = ["right", "right", "right", "gap", "roof"];

  function playClip(name){
    if(name === "random"){
      name = randomOrder[Math.floor(Math.random() * randomOrder.length)];
    }

    const clip = clips[name] || clips.center;
    clipCounter += 1;
    const runId = clipCounter;

    if(currentAnim) cancelAnimationFrame(currentAnim);
    createBox();

    const start = performance.now();
    const frames = clip.frames;

    function frame(now){
      if(runId !== clipCounter) return;

      const elapsed = now - start;
      const state = interpolateFrames(frames, elapsed);
      setBoxState(state);

      const endTime = frames[frames.length - 1].t;
      if(elapsed < endTime){
        currentAnim = requestAnimationFrame(frame);
      }else{
        setBoxState(frames[frames.length - 1]);
        currentAnim = null;

        if(clip.breakAtEnd){
          burst(frames[frames.length - 1].x, frames[frames.length - 1].y);
          if(currentBox) currentBox.remove();
          currentBox = null;
        }
      }
    }

    requestAnimationFrame(frame);
  }

  drawWagon();

  document.querySelectorAll("button[data-clip]").forEach(button => {
    button.addEventListener("click", () => playClip(button.dataset.clip));
  });

  setTimeout(() => playClip("right"), 450);
})();
</script>
</body>
</html>
