<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 6</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --train-h:clamp(74px, 13.5vw, 150px);
      --train-scale:1;
      --sky1:#cfe8ff;
      --sky2:#edf8ff;
      --sand1:#f6ddad;
      --sand2:#c8955d;
      --rail:#5d3e25;
      --hud:#6d719c;
      --gold:#ead06c;
      --gold-dark:#8c5e1d;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    }

    /* نفس طريقة صفحة العجلة: الصفحة نفسها sticky وباقي body يعطي مساحة بسيطة لسفاري حتى يطوي الشريط. */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.50) 0 10%,transparent 22%),
        radial-gradient(circle at 78% 18%,rgba(255,255,255,.35) 0 8%,transparent 18%),
        linear-gradient(180deg,var(--sky1) 0 55%,var(--sky2) 55.2% 56%,var(--sand1) 56.1%,var(--sand2) 100%);
    }

    .hud{
      position:absolute;
      z-index:40;
      top:calc(12px + var(--safe-top));
      left:clamp(12px,3vw,24px);
      right:clamp(12px,3vw,24px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      pointer-events:none;
    }

    .pill{
      background:rgba(101,106,155,.88);
      border:1px solid rgba(255,255,255,.32);
      box-shadow:0 8px 18px rgba(36,42,91,.14), inset 0 1px 0 rgba(255,255,255,.18);
      border-radius:18px;
      padding:10px 18px;
      color:#fff;
      font-size:clamp(16px,2.4vw,28px);
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      backdrop-filter:blur(6px);
    }

    .score{direction:ltr;min-width:70px;text-align:center}

    .ground{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:22%;
      min-height:88px;
      z-index:1;
      background:repeating-linear-gradient(90deg,rgba(78,48,24,.17) 0 64px,rgba(78,48,24,.05) 64px 128px);
      opacity:.65;
      animation:groundMove 12s linear infinite;
      pointer-events:none;
    }

    @keyframes groundMove{from{background-position:0 0}to{background-position:-900px 0}}

    .rails{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(34px + var(--safe-bottom));
      height:26px;
      z-index:5;
      pointer-events:none;
    }

    .rail-line{
      position:absolute;
      left:0;
      right:0;
      height:7px;
      border-radius:9px;
      background:var(--rail);
      box-shadow:0 2px 0 rgba(255,255,255,.18) inset,0 2px 5px rgba(0,0,0,.14);
    }
    .rail-line.top{top:2px}.rail-line.bottom{bottom:2px}
    .sleepers{
      position:absolute;
      left:0;
      right:0;
      top:8px;
      height:13px;
      background:repeating-linear-gradient(90deg,transparent 0 34px,#9a6d42 34px 66px,transparent 66px 100px);
      animation:sleeperMove 5s linear infinite;
    }
    @keyframes sleeperMove{from{background-position:0 0}to{background-position:-700px 0}}

    .train-camera{
      position:absolute;
      z-index:12;
      left:0;
      right:0;
      bottom:calc(44px + var(--safe-bottom));
      height:calc(var(--train-h) + 12px);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      overflow:visible;
      pointer-events:none;
      direction:ltr;
    }

    .train-set{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      direction:ltr;
      transform:scale(var(--train-scale));
      transform-origin:center bottom;
      will-change:transform;
    }

    .unit{
      position:relative;
      height:var(--train-h);
      flex:0 0 auto;
      margin-left:-2px;
      filter:drop-shadow(0 8px 9px rgba(0,0,0,.18));
    }

    .unit img.body{
      position:absolute;
      z-index:3;
      left:0;
      bottom:0;
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:bottom center;
      display:block;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .car{width:calc(var(--train-h) * 390 / 311)}
    .passenger{width:calc(var(--train-h) * 388 / 311)}
    .coal{width:calc(var(--train-h) * 195 / 311)}
    .loco{width:calc(var(--train-h) * 485 / 311)}

    /* train-6: العجلات الآن صور مستقلة مأخوذة من نفس القطار ومركبة على فتحات العجلات بدقة. */
    .wheel{
      position:absolute;
      z-index:2;
      aspect-ratio:1/1;
      border-radius:50%;
      pointer-events:none;
      animation:wheelSpin .82s linear infinite;
      transform-origin:center center;
      background-size:contain;
      background-repeat:no-repeat;
      background-position:center center;
      filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));
      will-change:transform;
    }

    @keyframes wheelSpin{to{transform:rotate(360deg)}}

    /* عربات الإجابات: نفس مواقع عجلات الصورة الأصلية بعد إزالة العجلات الثابتة. */
    .car .wheel{
      width:13.846%;
      bottom:5.466%;
      background-image:url('wheelCar.png');
    }
    .car .w1{left:10.000%}
    .car .w2{left:27.692%}
    .car .w3{left:61.795%}
    .car .w4{left:78.974%}

    /* مقطورة الركاب. */
    .passenger .wheel{
      width:13.918%;
      bottom:5.145%;
      background-image:url('wheelCar.png');
    }
    .passenger .w1{left:13.660%}
    .passenger .w2{left:30.155%}
    .passenger .w3{left:60.309%}
    .passenger .w4{left:76.804%}

    /* عربة الفحم. */
    .coal .wheel{
      width:27.692%;
      bottom:5.145%;
      background-image:url('wheelCar.png');
    }
    .coal .w1{left:28.205%}
    .coal .w2{left:63.077%}

    /* القاطرة. */
    .loco .wheel{animation-duration:.88s}
    .loco .big{
      width:25.979%;
      left:9.350%;
      bottom:8.682%;
      background-image:url('wheelL.png');
      animation-duration:1.02s;
    }
    .loco .mid{
      width:18.144%;
      left:42.268%;
      bottom:7.717%;
      background-image:url('wheelM.png');
      animation-duration:.88s;
    }
    .loco .small{
      width:18.144%;
      left:66.804%;
      bottom:7.717%;
      background-image:url('wheelS.png');
      animation-duration:.84s;
    }

    @media (orientation:landscape){
      :root{--train-h:clamp(110px, 29dvh, 190px)}
      .rails{bottom:calc(24px + var(--safe-bottom))}
      .train-camera{bottom:calc(34px + var(--safe-bottom))}
      .pill{font-size:clamp(14px,3.2vh,24px);padding:8px 15px;border-radius:15px}
    }

    @media (max-width:430px){
      .hud{top:calc(10px + var(--safe-top));left:12px;right:12px}
      .pill{font-size:16px;padding:8px 13px;border-radius:15px}
      .score{min-width:62px}
      .rails{bottom:calc(32px + var(--safe-bottom))}
      .train-camera{bottom:calc(42px + var(--safe-bottom))}
    }
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <div class="hud">
      <div class="pill score">0 ✓</div>
      <div class="pill title">قطار الإجابات</div>
    </div>

    <div class="ground" aria-hidden="true"></div>
    <div class="rails" aria-hidden="true">
      <div class="rail-line top"></div>
      <div class="sleepers"></div>
      <div class="rail-line bottom"></div>
    </div>

    <div class="train-camera" aria-hidden="true">
      <div class="train-set" id="train"></div>
    </div>
  </main>

  <script>
    const categories = ['استفهام','تعجب','أمر'];
    const train = document.getElementById('train');

    function makeUnit(kind, src, alt){
      const unit = document.createElement('div');
      unit.className = 'unit ' + kind;
      const img = document.createElement('img');
      img.className = 'body';
      img.src = src;
      img.alt = alt;
      unit.appendChild(img);
      addWheels(unit, kind);
      train.appendChild(unit);
      return unit;
    }

    function addWheel(unit, cls){
      const w = document.createElement('span');
      w.className = 'wheel ' + cls;
      unit.appendChild(w);
    }

    function addWheels(unit, kind){
      if(kind === 'car' || kind === 'passenger') ['w1','w2','w3','w4'].forEach(c => addWheel(unit,c));
      if(kind === 'coal') ['w1','w2'].forEach(c => addWheel(unit,c));
      if(kind === 'loco') { addWheel(unit,'big'); addWheel(unit,'mid'); addWheel(unit,'small'); }
    }

    function buildTrain(){
      train.innerHTML = '';
      categories.forEach(() => makeUnit('car','car.png','عربة إجابة'));
      makeUnit('passenger','passenger.png','مقطورة ركاب');
      makeUnit('coal','coal.png','عربة الفحم');
      makeUnit('loco','loco.png','القاطرة');
      requestAnimationFrame(fitTrain);
    }

    function fitTrain(){
      const rawWidth = train.scrollWidth;
      const viewport = window.innerWidth || document.documentElement.clientWidth || 390;
      const portrait = window.innerHeight > window.innerWidth;
      const target = viewport * (portrait ? 0.98 : 0.96);
      const scale = rawWidth > 0 ? Math.min(1, target / rawWidth) : 1;
      document.documentElement.style.setProperty('--train-scale', scale.toFixed(4));
    }

    buildTrain();
    addEventListener('resize', () => requestAnimationFrame(fitTrain), {passive:true});
    addEventListener('orientationchange', () => setTimeout(() => requestAnimationFrame(fitTrain), 260), {passive:true});
  </script>
</body>
</html>
