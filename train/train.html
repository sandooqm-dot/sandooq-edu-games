<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 43</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bfcae6;
      --sky-mid:#dce3f2;
      --sand:#d7a464;
      --sand2:#bd7f42;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 120px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:120px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,#ead5ac 46%,var(--sand) 72%,var(--sand2) 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:10;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      pointer-events:none;
    }

    .train-wheel{
      transform-box:fill-box;
      transform-origin:center;
      animation:wheelSpin .55s linear infinite;
    }

    .train-idle-motion{
      transform-box:fill-box;
      transform-origin:center;
      animation:trainIdleMotion 3.2s ease-in-out infinite;
      will-change:transform;
    }

    @keyframes trainIdleMotion{
      0%,100%{transform:translateX(0)}
      45%{transform:translateX(4px)}
      68%{transform:translateX(2px)}
    }

    @keyframes wheelSpin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="خلفية وسكة قطار الإجابات"></svg>
  </main>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("stage");
  const NS = "http://www.w3.org/2000/svg";

  function el(name, attrs = {}, parent = svg){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clear(){
    svg.innerHTML = "";
  }

  function defs(){
    const d = el("defs");

    const scene = el("linearGradient", {id:"sceneGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#bfcae6"}, scene);
    el("stop", {offset:"45%", "stop-color":"#dce3f2"}, scene);
    el("stop", {offset:"46%", "stop-color":"#ead5ac"}, scene);
    el("stop", {offset:"72%", "stop-color":"#d7a464"}, scene);
    el("stop", {offset:"100%", "stop-color":"#bd7f42"}, scene);

    const sand = el("linearGradient", {id:"sandGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#e7c188"}, sand);
    el("stop", {offset:"100%", "stop-color":"#b47538"}, sand);

    const softShadow = el("filter", {id:"softShadow", x:"-20%", y:"-20%", width:"140%", height:"140%"}, d);
    el("feDropShadow", {dx:"0", dy:"5", stdDeviation:"4", "flood-color":"#000", "flood-opacity":".16"}, softShadow);

    const balloonBody = el("radialGradient", {
      id:"balloonBodyGrad",
      cx:"34%",
      cy:"30%",
      r:"72%",
      fx:"28%",
      fy:"22%"
    }, d);
    el("stop", {offset:"0%", "stop-color":"#f5f8ff"}, balloonBody);
    el("stop", {offset:"23%", "stop-color":"#cfdaf0"}, balloonBody);
    el("stop", {offset:"52%", "stop-color":"#8fa0c1"}, balloonBody);
    el("stop", {offset:"78%", "stop-color":"#5f6170"}, balloonBody);
    el("stop", {offset:"100%", "stop-color":"#3f3d47"}, balloonBody);

    const balloonHighlight = el("linearGradient", {id:"balloonHighlightGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#ffffff", "stop-opacity":".08"}, balloonHighlight);
    el("stop", {offset:"38%", "stop-color":"#ffffff", "stop-opacity":".58"}, balloonHighlight);
    el("stop", {offset:"70%", "stop-color":"#ffffff", "stop-opacity":".12"}, balloonHighlight);
    el("stop", {offset:"100%", "stop-color":"#ffffff", "stop-opacity":"0"}, balloonHighlight);

    const balloonFin = el("linearGradient", {id:"balloonFinGrad", x1:"0", y1:"0", x2:"1", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#aab6d0"}, balloonFin);
    el("stop", {offset:"100%", "stop-color":"#68718d"}, balloonFin);

    const balloonShadow = el("filter", {id:"balloonShadow", x:"-20%", y:"-25%", width:"140%", height:"150%"}, d);
    el("feDropShadow", {dx:"0", dy:"8", stdDeviation:"6", "flood-color":"#1e2332", "flood-opacity":".22"}, balloonShadow);
  }

  function makeCloud(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, opacity:".78"}, parent);
    [[0,0,20],[22,-6,30],[52,-2,24],[76,6,18],[24,16,25],[58,15,22]].forEach(([cx, cy, r]) => {
      el("circle", {
        cx,
        cy,
        r,
        fill:"#eef3fa",
        stroke:"#b2bdcd",
        "stroke-width":2,
        opacity:".85"
      }, g);
    });
  }

  function makeCactus(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    el("rect", {x:-10, y:-70, width:20, height:80, rx:10, fill:"#4c8b53", stroke:"#39703f", "stroke-width":3}, g);
    el("path", {d:"M-9 -44 C-45 -52 -43 -6 -20 -7", fill:"none", stroke:"#4c8b53", "stroke-width":16, "stroke-linecap":"round"}, g);
    el("path", {d:"M8 -54 C45 -64 47 -20 20 -19", fill:"none", stroke:"#4c8b53", "stroke-width":15, "stroke-linecap":"round"}, g);
    el("ellipse", {cx:0, cy:12, rx:30, ry:6, fill:"rgba(66,39,16,.22)"}, g);
  }

  function makeBush(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    [[-22,0,20],[0,-8,28],[26,0,19],[10,9,16]].forEach(([cx,cy,r]) => {
      el("circle", {cx, cy, r, fill:"#8faa52", opacity:".88"}, g);
    });
  }

  function answerBalloon(parent, options = {}){
    // إصدار 43:
    // بالون/منطاد تجريبي مرسوم بالكامل بالكود داخل SVG.
    // لا يعتمد على صورة خارجية، والنص قابل للتغيير لاحقًا من بيانات اللعبة.
    const x = options.x ?? 760;
    const y = options.y ?? 165;
    const scale = options.scale ?? 1;
    const lines = options.lines || ["ما أجمل", "الزهور!"];

    const g = el("g", {
      id:"answerBalloonDemo",
      transform:`translate(${x} ${y}) scale(${scale})`,
      filter:"url(#balloonShadow)"
    }, parent);

    // زعانف خلفية يمين مثل المرجع.
    el("path", {
      d:"M116 -23 L153 -43 L153 -5 L118 3 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".92"
    }, g);
    el("path", {
      d:"M118 12 L153 4 L153 42 L113 25 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".9"
    }, g);
    el("path", {
      d:"M122 -7 L162 -18 L162 20 L122 9 Z",
      fill:"#75809d",
      stroke:"#646f8a",
      "stroke-width":2,
      opacity:".7"
    }, g);

    // جسم البالون.
    el("ellipse", {
      cx:0,
      cy:0,
      rx:138,
      ry:64,
      fill:"url(#balloonBodyGrad)",
      stroke:"#68738f",
      "stroke-width":3.2
    }, g);

    // خطوط جسم البالون لإحساس الشكل المعدني/المنفوخ.
    [-42,-18,8,34].forEach((yy, idx) => {
      el("path", {
        d:`M-120 ${yy} C-58 ${yy - 16 + idx * 4} 52 ${yy - 14 + idx * 3} 120 ${yy - 2}`,
        fill:"none",
        stroke:idx < 2 ? "#eef4ff" : "#4e566c",
        "stroke-width":idx < 2 ? 2.2 : 1.6,
        opacity:idx < 2 ? ".55" : ".35"
      }, g);
    });

    // لمعة علوية خفيفة.
    el("ellipse", {
      cx:-30,
      cy:-27,
      rx:86,
      ry:21,
      fill:"url(#balloonHighlightGrad)",
      opacity:".72"
    }, g);

    // سلة/محرك صغير أسفل البالون.
    const gondola = el("g", {transform:"translate(-8 68)"}, g);
    el("path", {
      d:"M-34 -8 L35 -8 L27 18 L-25 18 Z",
      fill:"#6f7080",
      stroke:"#56596a",
      "stroke-width":2,
      opacity:".86"
    }, gondola);
    [-18,0,18].forEach(cx => {
      el("circle", {cx, cy:7, r:5, fill:"#858899", stroke:"#55586a", "stroke-width":1.5}, gondola);
    });

    // النص من الكود، وليس جزءًا من صورة.
    const text = el("text", {
      x:0,
      y:-10,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#050505",
      stroke:"#ffffff",
      "stroke-width":2.7,
      "paint-order":"stroke fill",
      "font-size":37,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    lines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 40
      }, text).textContent = line;
    });

    return g;
  }

  function balloonsLayer(){
    const balloons = el("g", {id:"balloonsLayer"});
    answerBalloon(balloons, {
      x:780,
      y:178,
      scale:.92,
      lines:["ما أجمل", "الزهور!"]
    });
  }

  function background(){
    const bg = el("g", {id:"background"});

    el("rect", {x:0, y:0, width:1280, height:720, fill:"url(#sceneGrad)"}, bg);

    el("path", {
      d:"M-120 314 C-55 240 40 306 116 198 C185 101 246 210 318 116 C392 230 448 146 517 270 C582 150 642 212 716 100 C785 230 840 166 916 304 C990 190 1047 260 1120 150 C1190 250 1295 210 1400 270 L1400 426 L-120 426 Z",
      fill:"#7d86aa",
      opacity:".31"
    }, bg);

    el("path", {
      d:"M-120 360 C0 302 110 343 230 238 C352 150 403 302 492 228 C590 310 674 252 752 330 C834 242 926 304 1005 216 C1085 346 1185 260 1400 332 L1400 426 L-120 426 Z",
      fill:"#afa0ad",
      opacity:".44"
    }, bg);

    makeCloud(bg, 105, 126, .72);
    makeCloud(bg, 390, 95, .62);
    makeCloud(bg, 780, 112, .68);
    makeCloud(bg, 1075, 142, .58);
    makeCloud(bg, 1240, 96, .5);

    el("rect", {
      x:-20,
      y:402,
      width:1320,
      height:245,
      fill:"url(#sandGrad)",
      opacity:".58"
    }, bg);

    makeCactus(bg, 250, 444, .95);
    makeCactus(bg, 890, 436, 1.05);
    makeBush(bg, 760, 504, 1);

    const track = el("g", {id:"track"}, bg);
    const trackImage = el("image", {
      href:"train-track.webp?v=43",
      x:-55,
      y:604,
      width:1390,
      height:27,
      preserveAspectRatio:"none"
    }, track);
    trackImage.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-track.webp?v=43");
  }

  function addWheel(layer, cx, cy, size, version = 43){
    const wheel = el("image", {
      href:`train-wheel.webp?v=${version}`,
      x:cx - size / 2,
      y:cy - size / 2,
      width:size,
      height:size,
      preserveAspectRatio:"xMidYMid meet",
      class:"train-wheel"
    }, layer);
    wheel.setAttributeNS("http://www.w3.org/1999/xlink", "href", `train-wheel.webp?v=${version}`);
    return wheel;
  }

  // بيانات مؤقتة للتجربة فقط.
  // لاحقًا ستأتي هذه القائمة من إعدادات المعلم في صفحة الإنشاء.
  // عدد العناصر هنا هو الذي يحدد عدد عربات الإجابة تلقائيًا:
  // عنصران = عربتان، ثلاثة = ثلاث عربات، أربعة = أربع عربات.
  const TRAIN_ANSWER_TEXTS = ["استفهام", "تعجب", "نقطة"];

  function buildAnswerCars(answerTexts){
    return answerTexts
      .map(text => String(text || "").trim())
      .filter(Boolean)
      .slice(0, 4)
      .map(text => ({type:"answer", text}));
  }

  const TRAIN_CARS = buildAnswerCars(TRAIN_ANSWER_TEXTS);

  const TRAIN_LAYOUT = {
    nearestWagonX:490,
    wagonY:486,
    wagonW:300,
    wagonH:111,
    wagonStep:288
  };

  const trainCarRegistry = [];

  function answerWagon(train, car, index){
    // قالب عربة الإجابة:
    // نفس العربة المعتمدة سابقًا، لكن صارت قابلة للتكرار حسب عدد الإجابات.
    const wagonX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    const wagonY = TRAIN_LAYOUT.wagonY;
    const wagonW = TRAIN_LAYOUT.wagonW;
    const wagonH = TRAIN_LAYOUT.wagonH;

    const targetArea = {
      // منطقة الاستهداف الداخلية للعربة.
      // هذه البيانات لا تظهر بصريًا، وستستخدم لاحقًا لمعرفة سقوط الصندوق/البالون داخل العربة.
      left:wagonX + 14,
      right:wagonX + wagonW - 14,
      top:wagonY + 16,
      bottom:wagonY + wagonH - 16,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2
    };

    trainCarRegistry[index] = {
      type:car.type,
      text:car.text,
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      left:wagonX,
      right:wagonX + wagonW,
      top:wagonY,
      bottom:wagonY + wagonH,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2,
      targetArea
    };

    const wheelLayer = el("g", {id:`wagonWheelLayer-${index}`}, train);
    // عجلات عربات الإجابة بنفس حجم وارتفاع العجلات الثلاث الصغيرة في القاطرة.
    // جسم العربة يُرسم بعدها، لذلك يبقى الجزء العلوي من العجلة مخفيًا خلف العربة.
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = wagonX + 49;
    const gap = 66;
    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`wagonBodyLayer-${index}`}, train);
    const wagonBody = el("image", {
      href:"train-wagon.webp?v=43",
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      preserveAspectRatio:"xMidYMid meet",
      id:`wagonBody-${index}`
    }, bodyLayer);
    wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=43");

    el("text", {
      x:wagonX + wagonW / 2,
      y:wagonY + wagonH * .56,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffe28a",
      stroke:"#5b2618",
      "stroke-width":2.6,
      "paint-order":"stroke fill",
      "font-size":30,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, bodyLayer).textContent = car.text;
  }

  function wagons(train){
    // نرسم العربات من الخلف إلى الأمام حتى تكون العربة الأقرب للقاطرة فوق الوصلات بصريًا.
    for(let i = TRAIN_CARS.length - 1; i >= 0; i--){
      const car = TRAIN_CARS[i];
      if(car.type === "answer") answerWagon(train, car, i);
    }
  }

  function getAnswerTargetArea(index){
    const car = trainCarRegistry[index];
    return car ? car.targetArea : null;
  }

  function locomotive(train){
    // إصدار 43:
    // زيادة المسافة بين العربة والقاطرة، إرجاع العجلات الثلاث للخلف،
    // تكبيرها 10%، وتقديم العجلة الكبيرة للأمام مع رفعها قليلًا.
    const locoX = 782;
    const locoY = 430;
    const locoW = 320;
    const locoH = 179;

    const bodyLayer = el("g", {id:"locomotiveBodyLayer"}, train);
    const locomotiveBody = el("image", {
      href:"train-engine-transparent.png?v=43",
      x:locoX,
      y:locoY,
      width:locoW,
      height:locoH,
      preserveAspectRatio:"xMidYMid meet",
      id:"locomotiveBody"
    }, bodyLayer);
    locomotiveBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-engine-transparent.png?v=43");

    const wheelLayer = el("g", {id:"locomotiveWheelLayer"}, train);

    // العجلة الكبيرة: تقديم للأمام بحوالي 3% ورفع للأعلى بحوالي 2%.
    const largeWheelSize = 90.2;
    const largeWheelCx = locoX + 64;
    const largeWheelCy = 565;
    addWheel(wheelLayer, largeWheelCx, largeWheelCy, largeWheelSize, 39);

    // العجلات الثلاث الصغيرة: إرجاع للخلف داخل القاطرة وتكبير 10% تقريبًا.
    const smallWheelSize = 47.4;
    const smallWheelCy = 585.3;
    const smallStartX = locoX + 148;
    const smallGap = 50;
    addWheel(wheelLayer, smallStartX, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap * 2, smallWheelCy, smallWheelSize, 39);
  }

  function build(){
    clear();
    defs();
    background();
    balloonsLayer();

    // المجموعة الخارجية مخصصة لاحقًا لحركة تقدم القطار بين العربات.
    const trainPositionGroup = el("g", {id:"trainPositionGroup"});

    // المجموعة الداخلية مخصصة للحركة الخفيفة المستمرة فقط.
    const train = el("g", {id:"trainScene", class:"train-idle-motion"}, trainPositionGroup);

    wagons(train);
    locomotive(train);
  }

  build();
})();
</script>
</body>
</html>
