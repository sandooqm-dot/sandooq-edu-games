<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 94</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bfcae6;
      --sky-mid:#dce3f2;
      --sand:#d7a464;
      --sand2:#bd7f42;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 120px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:120px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,#ead5ac 46%,var(--sand) 72%,var(--sand2) 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:10;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      pointer-events:auto;
    }

    .train-wheel{
      transform-box:fill-box;
      transform-origin:center;
      animation:wheelSpin .55s linear infinite;
    }

    .train-idle-motion{
      transform-box:fill-box;
      transform-origin:center;
      animation:trainIdleMotion 3.2s ease-in-out infinite;
      will-change:transform;
    }

    @keyframes trainIdleMotion{
      0%,100%{transform:translateX(0)}
      45%{transform:translateX(4px)}
      68%{transform:translateX(2px)}
    }

    @keyframes wheelSpin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="خلفية وسكة قطار الإجابات"></svg>
  </main>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("stage");
  const NS = "http://www.w3.org/2000/svg";

  function el(name, attrs = {}, parent = svg){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clear(){
    svg.innerHTML = "";
  }

  function defs(){
    const d = el("defs");

    const scene = el("linearGradient", {id:"sceneGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#bfcae6"}, scene);
    el("stop", {offset:"45%", "stop-color":"#dce3f2"}, scene);
    el("stop", {offset:"46%", "stop-color":"#ead5ac"}, scene);
    el("stop", {offset:"72%", "stop-color":"#d7a464"}, scene);
    el("stop", {offset:"100%", "stop-color":"#bd7f42"}, scene);

    const sand = el("linearGradient", {id:"sandGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);

    const softShadow = el("filter", {id:"softShadow", x:"-20%", y:"-20%", width:"140%", height:"140%"}, d);

    const balloonBody = el("radialGradient", {

    el("stop", {offset:"23%", "stop-color":"#cfdaf0"}, balloonBody);
    el("stop", {offset:"52%", "stop-color":"#8fa0c1"}, balloonBody);
    el("stop", {offset:"78%", "stop-color":"#5f6170"}, balloonBody);
    el("stop", {offset:"100%", "stop-color":"#3f3d47"}, balloonBody);

    const balloonHighlight = el("linearGradient", {id:"balloonHighlightGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);

    el("stop", {offset:"38%", "stop-color":"#ffffff", "stop-opacity":".58"}, balloonHighlight);

    el("stop", {offset:"100%", "stop-color":"#ffffff", "stop-opacity":"0"}, balloonHighlight);

    const balloonFin = el("linearGradient", {id:"balloonFinGrad", x1:"0", y1:"0", x2:"1", y2:"1"}, d);

    const balloonShadow = el("filter", {id:"balloonShadow", x:"-20%", y:"-25%", width:"140%", height:"150%"}, d);
    el("feDropShadow", {dx:"0", dy:"8", stdDeviation:"6", "flood-color":"#1e2332", "flood-opacity":".22"}, balloonShadow);

    const boxBody = el("linearGradient", {id:"answerBoxGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#b07445"}, boxBody);
    el("stop", {offset:"48%", "stop-color":"#8e552f"}, boxBody);
    el("stop", {offset:"100%", "stop-color":"#62351d"}, boxBody);

    const boxTop = el("linearGradient", {id:"answerBoxTopGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#c78a56"}, boxTop);
    el("stop", {offset:"100%", "stop-color":"#8a4d2b"}, boxTop);

    const boxShadow = el("filter", {id:"answerBoxShadow", x:"-35%", y:"-35%", width:"170%", height:"180%"}, d);
    el("feDropShadow", {dx:"0", dy:"7", stdDeviation:"5", "flood-color":"#2b170c", "flood-opacity":".24"}, boxShadow);
  }

  function makeCloud(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, opacity:".78"}, parent);
    [[0,0,20],[22,-6,30],[52,-2,24],[76,6,18],[24,16,25],[58,15,22]].forEach(([cx, cy, r]) => {
      el("circle", {
        cx,
        cy,
        r,
        fill:"#eef3fa",
        stroke:"#b2bdcd",
        "stroke-width":2,
        opacity:".85"
      }, g);
    });
  }

  function makeCactus(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    el("rect", {x:-10, y:-70, width:20, height:80, rx:10, fill:"#4c8b53", stroke:"#39703f", "stroke-width":3}, g);
    el("path", {d:"M-9 -44 C-45 -52 -43 -6 -20 -7", fill:"none", stroke:"#4c8b53", "stroke-width":16, "stroke-linecap":"round"}, g);
    el("path", {d:"M8 -54 C45 -64 47 -20 20 -19", fill:"none", stroke:"#4c8b53", "stroke-width":15, "stroke-linecap":"round"}, g);
    el("ellipse", {cx:0, cy:12, rx:30, ry:6, fill:"rgba(66,39,16,.22)"}, g);
  }

  function makeBush(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    [[-22,0,20],[0,-8,28],[26,0,19],[10,9,16]].forEach(([cx,cy,r]) => {
      el("circle", {cx, cy, r, fill:"#8faa52", opacity:".88"}, g);
    });
  }

  function answerBalloon(parent, options = {}){
    // إصدار 72:
    // بالون/منطاد تجريبي مرسوم بالكامل بالكود داخل SVG.
    // لا يعتمد على صورة خارجية، والنص قابل للتغيير لاحقًا من بيانات اللعبة.
    const x = options.x ?? 760;
    const y = options.y ?? 165;
    const scale = options.scale ?? 1;
    const lines = options.lines || ["ما أجمل", "الزهور!"];

    const g = el("g", {
      id:options.id || "answerBalloonDemo",
      transform:`translate(${x} ${y}) scale(${scale})`,
      filter:options.shadow === false ? "none" : "url(#balloonShadow)"

    // زعانف خلفية يمين مثل المرجع.
    el("path", {
      d:"M116 -23 L153 -43 L153 -5 L118 3 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,

      d:"M118 12 L153 4 L153 42 L113 25 Z",
      fill:"url(#balloonFinGrad)",

    // جسم البالون.
    el("ellipse", {
      cx:0,
      cy:0,
      rx:138,
      ry:64,
      fill:"url(#balloonBodyGrad)",
      stroke:"#68738f",
      "stroke-width":3.2

    // خطوط جسم البالون لإحساس الشكل المعدني/المنفوخ.
    [-42,-18,8,34].forEach((yy, idx) => {
      el("path", {
        d:`M-120 ${yy} C-58 ${yy - 16 + idx * 4} 52 ${yy - 14 + idx * 3} 120 ${yy - 2}`,

    // لمعة علوية خفيفة.
    el("ellipse", {
      cx:-30,
      cy:-27,
      rx:86,
      ry:21,
      fill:"url(#balloonHighlightGrad)",
      opacity:".72"
    }, g);

    // سلة/محرك صغير أسفل البالون.
    const gondola = el("g", {transform:"translate(-8 68)"}, g);
    el("path", {
      d:"M-34 -8 L35 -8 L27 18 L-25 18 Z",
      fill:"#6f7080",
      stroke:"#56596a",
      "stroke-width":2,
      opacity:".86"
    }, gondola);
    [-18,0,18].forEach(cx => {
      el("circle", {cx, cy:7, r:5, fill:"#858899", stroke:"#55586a", "stroke-width":1.5}, gondola);
    });

    // النص من الكود، وليس جزءًا من صورة.
    const text = el("text", {
      x:0,
      y:-10,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#050505",
      stroke:"#ffffff",
      "stroke-width":2.7,
      "paint-order":"stroke fill",
      "font-size":37,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    lines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 40
      }, text).textContent = line;
    });

    return g;
  }

  const DEBUG_COLLISION = false;

  let fallingObjectsLayer = null;
  let settledObjectsLayer = null;
  let wagonForegroundCoverLayer = null;
  let wagonDropCoverPositionGroup = null;
  let wagonDropCoverLayer = null;
  let trainPositionGroup = null;
  let collisionDebugLayer = null;
  const collisionMap = [];

  const TRAIN_MOTION = {
    enterOffset:-1350,
    centerOffset:0,
    exitOffset:1450,

    // أبطأ بنسبة 40% من إصدار 88.
    enterDuration:7280,
    betweenDuration:5200,
    exitDuration:8680
  };

  let trainVisualOffsetX = TRAIN_MOTION.enterOffset;
  let trainPhysicsOffsetX = 0;
  let trainMotionState = "entering";
  let trainAnimationFrame = 0;
  let activeQuestionPointer = 0;
  let stageCompleteTriggered = false;

  const BALLOONS_PER_ROUND = 5;
  const MEDIUM_BALLOON_SCALE = .80;
  const MAX_ACTIVE_FALLING_BOXES = 4;
  const MAX_SETTLED_BOXES = 6;
  const MAX_SETTLED_BOXES_PER_WAGON = 2;

  let activeFallingBoxes = 0;
  const settledBoxes = [];
  const settledBoxesByWagon = Object.create(null);

  function removeSettledBoxRecord(record){
    if(!record) return;
    const node = record.node || record;
    if(node && node.parentNode) node.remove();
  }

  function rememberSettledBox(node, wagonIndex){
    const record = {node, wagonIndex};
    settledBoxes.push(record);

    if(wagonIndex !== null && wagonIndex !== undefined){
      const key = String(wagonIndex);
      const list = settledBoxesByWagon[key] || (settledBoxesByWagon[key] = []);
      list.push(record);

      while(list.length > MAX_SETTLED_BOXES_PER_WAGON){
        const oldRecord = list.shift();
        removeSettledBoxRecord(oldRecord);
        const globalIndex = settledBoxes.indexOf(oldRecord);
        if(globalIndex >= 0) settledBoxes.splice(globalIndex, 1);
      }
    }

    while(settledBoxes.length > MAX_SETTLED_BOXES){
      removeSettledBoxRecord(settledBoxes.shift());
    }
  }

  function balloonBurst(parent, x, y, scale = 1){
    const burst = el("g", {
      transform:`translate(${x} ${y}) scale(${scale})`,
      opacity:"1"
    }, parent);

    const boom = el("text", {
      x:0,
      y:-86,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#e92323",
      stroke:"#fff1a8",
      "stroke-width":5.2,
      "paint-order":"stroke fill",
      "font-size":46,
      "font-weight":1000,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      transform:"scale(.72)",
      opacity:"0"
    }, burst);
    boom.textContent = "بووم!";

    const boomIn = el("animate", {
      attributeName:"opacity",
      values:"0;1;1;0",
      keyTimes:"0;.18;.68;1",
      dur:".62s",
      fill:"freeze"
    }, boom);
    const boomScale = el("animateTransform", {
      attributeName:"transform",
      type:"scale",
      values:".72;1.18;1.02;.9",
      keyTimes:"0;.2;.62;1",
      dur:".62s",
      fill:"freeze"
    }, boom);
    boomIn.beginElement();
    boomScale.beginElement();

    const pieces = [
      [-36,-16,-74,-42],[-12,-28,-28,-72],[20,-24,44,-68],
      [46,-4,90,-22],[-44,18,-86,38],[-8,30,-24,76],
      [26,24,58,66],[58,20,106,46],[-78,0,-126,-10],[78,-8,132,-18]
    ];

    pieces.forEach(([x1,y1,x2,y2], index) => {
      const shard = el("path", {
        d:`M${x1} ${y1} L${x1 + 12} ${y1 + 8} L${x2} ${y2} Z`,
        fill:index % 2 ? "#cbd7ef" : "#828da9",
        stroke:"#66718f",
        "stroke-width":1.3,
        opacity:".96"
      }, burst);
      const animate = el("animate", {
        attributeName:"opacity",
        values:".96;.62;0",
        dur:".58s",
        fill:"freeze"
      }, shard);
      animate.beginElement();
    });

    const ring = el("ellipse", {
      cx:0,
      cy:0,
      rx:46,
      ry:22,
      fill:"none",
      stroke:"#ff3b30",
      "stroke-width":5,
      opacity:".7"
    }, burst);

    const ringGrow = el("animate", {
      attributeName:"rx",
      values:"34;84;114",
      dur:".52s",
      fill:"freeze"
    }, ring);
    const ringFade = el("animate", {
      attributeName:"opacity",
      values:".7;.35;0",
      dur:".52s",
      fill:"freeze"
    }, ring);
    ringGrow.beginElement();
    ringFade.beginElement();

    setTimeout(() => burst.remove(), 760);
  }

  function answerBox(parent, textLines = ["ما أجمل", "الزهور!"]){
    const g = el("g", {
      filter:"url(#answerBoxShadow)"
    }, parent);

    // صندوق مستقيم مثل المختبر: لا منظور مائل، الفيزياء وحدها تديره.
    el("rect", {
      x:-48,
      y:-36,
      width:96,
      height:72,
      rx:7,
      fill:"url(#answerBoxGrad)",

    el("rect", {

    }, g);

    el("path", {

      fill:"none",
      stroke:"#d3a06a",
      "stroke-width":3,
      opacity:".72"
    }, g);

    const text = el("text", {
      x:0,
      y:7,
      "text-anchor":"middle",
      "dominant-baseline":"middle",

      stroke:"#442313",
      "stroke-width":1.9,

      "font-size":16,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    textLines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 20
      }, text).textContent = line;
    });

    return g;
  }

  function trackImpactBurst(parent, x, y){
    const burst = el("g", {
      transform:`translate(${x} ${y})`,
      opacity:"1"
    }, parent);

    for(let i = 0; i < 12; i++){
      const angle = Math.PI + Math.random() * Math.PI;
      const dist = 20 + Math.random() * 48;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist * .42;
      const dot = el("circle", {
        cx:0,
        cy:0,
        r:3 + Math.random() * 4,
        fill:i % 2 ? "#8a5a34" : "#d2a36a",
        opacity:".75"
      }, burst);
      const move = el("animateTransform", {
        attributeName:"transform",
        type:"translate",
        from:"0 0",
        to:`${dx.toFixed(1)} ${dy.toFixed(1)}`,
        dur:".38s",
        fill:"freeze"
      }, dot);
      const fade = el("animate", {
        attributeName:"opacity",
        values:".75;.35;0",
        dur:".42s",
        fill:"freeze"
      }, dot);
      move.beginElement();
      fade.beginElement();
    }

    setTimeout(() => burst.remove(), 520);
  }

  const BOX = {
    left:48,
    right:48,
    top:36,
    bottom:36,
    width:96,
    height:72
  };

  // تصغير القطار والسكة فقط. البالونات والصناديق تبقى بنفس الحجم.
  const TRAIN_SCALE = .92;
  const TRAIN_SCALE_PIVOT = {x:640, y:604};

  function trainX(x){
    return TRAIN_SCALE_PIVOT.x + (x - TRAIN_SCALE_PIVOT.x) * TRAIN_SCALE;
  }

  function trainY(y){
    return TRAIN_SCALE_PIVOT.y + (y - TRAIN_SCALE_PIVOT.y) * TRAIN_SCALE;
  }

  function trainLen(value){
    return value * TRAIN_SCALE;
  }

  function trainRect(rect){
    return {
      left:trainX(rect.left),
      right:trainX(rect.right),
      top:trainY(rect.top),
      bottom:trainY(rect.bottom)
    };
  }

  function trainWorldX(x){
    return x + trainPhysicsOffsetX;
  }

  function trainWorldRect(rect){
    return {
      left:rect.left + trainPhysicsOffsetX,
      right:rect.right + trainPhysicsOffsetX,
      top:rect.top,
      bottom:rect.bottom
    };
  }

  function trainOffsetForWagonIndex(index){
    return trainLen((Number(index) || 0) * TRAIN_LAYOUT.wagonStep);
  }

  function currentQuestionWagonIndex(){
    return QUESTION_WAGON_INDICES[activeQuestionPointer] ?? QUESTION_WAGON_INDICES[0] ?? 0;
  }

  /*
    نظام فيزياء القطار المنقول من المختبر:
    - لا يوجد manual fallback.
    - لا يوجد سحب للصندوق أو nudge أو target slot.
    - الصندوق يسقط بـ Matter.js والجاذبية.
    - الفاصل الذكي والنطاطات تعمل بنفس منطق المختبر.
    - الصندوق المستقر يتحول إلى عنصر بصري فقط.
  */
  const TRAIN_PHYSICS_PROFILES = {

      }
    },

    wagon:{
      floor:{
        inset:14,

      },
      wall:{

      },
      topBumper:{
        xInset:18,

    passenger:{
      bouncer:{
        // نطاطات خفيفة أعلى وجانبي عربة الركاب، تدفع الصندوق لليسار باتجاه العربة الأخيرة.
        inset:14,

    gap:{
      yOffset:-7,
      width:54,
      height:22,
      cooldown:85,
      inwardVelocity:1.32,
      upVelocity:.92,
      spinKick:.026,
      liftOut:6,
      centerDeadZone:4,
      friction:.05,
      frictionStatic:.08,
      restitution:.38
    },

    engine:{
      roof:{
        // نطاط مقطورة السائق: شريط صغير فقط على السطح المحدد، بدون تمديد يمين/يسار أو للأعلى.
        x1:786,
        x2:874,
        y:424,
        h:14
      },
      roofBounce:{
        cooldown:620,
        minUpVelocity:3.05,
        maxUpVelocity:4.35,
        backwardVelocity:-1.42,
        maxBackwardVelocity:-1.72,
        spinKick:-.065,
        liftOut:14,
        friction:.05,
        frictionStatic:.08,
        restitution:.94
      }
    },

    track:{
      y:636,
      w:1500,
      h:44
    },

    freeFallAirDrift:{
      // انجراف هوائي واضح لليسار أثناء السقوط الحر فقط، مع سقوط أسرع.
      // يتوقف نهائيًا عند أول ملامسة لأي سطح/نطاط/فاصل/قاطرة.
      enabled:true,

      // الميل لليسار — متوسط، ليس عموديًا وليس حادًا.
      targetVX:-3.18,
      maxLeftVX:-3.55,
      velocityStepX:.15,
      forceX:.000095,

      // سرعة النزول أثناء السقوط الحر فقط.
      targetVY:6.35,
      maxDownVY:6.9,
      velocityStepY:.32,
      forceY:.00012
    }
  };

  let matterEngine = null;
  let matterRunnerStarted = false;
  let matterLastTime = 0;
  let matterLibraryLoading = false;

  const matterBoxes = [];
  const matterStaticBodies = [];
  const settledVisualMatterBoxes = [];
  const pendingMatterSpawns = [];

  const MATTER_COLLISION = {
    // الصناديق لا تتصادم مع بعضها أبدًا.
    // الصندوق يتصادم فقط مع القطار/العربة/النطاطات/الفواصل/مناطق الانفجار.
    train:0x0001,
    box:0x0002
  };

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }

  function setTrainVisualOffset(x){
    trainVisualOffsetX = x;

    const transform = `translate(${x.toFixed(2)} 0)`;

    if(trainPositionGroup){
      trainPositionGroup.setAttribute("transform", transform);
    }

    if(wagonDropCoverPositionGroup){
      wagonDropCoverPositionGroup.setAttribute("transform", transform);
    }
  }

  function trainEaseInOut(t){
    return t < .5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animateTrainTo(targetX, duration, nextState, onComplete){
    if(trainAnimationFrame){
      cancelAnimationFrame(trainAnimationFrame);
      trainAnimationFrame = 0;
    }

    const startX = trainVisualOffsetX;
    const startTime = performance.now();

    function frame(now){
      const t = clamp((now - startTime) / duration, 0, 1);
      const eased = trainEaseInOut(t);
      const x = startX + (targetX - startX) * eased;

      setTrainVisualOffset(x);

      if(t < 1){
        trainAnimationFrame = requestAnimationFrame(frame);
        return;
      }

      setTrainVisualOffset(targetX);
      trainAnimationFrame = 0;

      if(nextState){
        trainMotionState = nextState;
      }

      if(typeof onComplete === "function"){
        onComplete();
      }
    }

    trainAnimationFrame = requestAnimationFrame(frame);
  }

  function startTrainEntry(){
    trainMotionState = "entering";
    setTrainVisualOffset(TRAIN_MOTION.enterOffset);

    requestAnimationFrame(() => {
      animateTrainTo(TRAIN_MOTION.centerOffset, TRAIN_MOTION.enterDuration, "playing");
    });
  }

  function clearActiveFallingMatterBoxes(){
    pendingMatterSpawns.length = 0;
    matterBoxes.slice().forEach(item => cleanupMatterBox(item, true));
    activeFallingBoxes = 0;
  }

  function rebuildTrainPhysicsAtCurrentOffset(){
    trainPhysicsOffsetX = trainVisualOffsetX;
    buildCollisionMap();
  }

  function advanceTrainToQuestionWagon(wagonIndex){
    trainMotionState = "advancing";
    clearActiveFallingMatterBoxes();

    const targetOffset = trainOffsetForWagonIndex(wagonIndex);

    animateTrainTo(targetOffset, TRAIN_MOTION.betweenDuration, "playing", () => {
      rebuildTrainPhysicsAtCurrentOffset();
    });
  }

  function handleQuestionWagonSettled(well){
    if(!well) return;

    const activeWagonIndex = currentQuestionWagonIndex();

    if(well.index !== activeWagonIndex){
      return;
    }

    const nextPointer = activeQuestionPointer + 1;

    if(nextPointer < QUESTION_WAGON_INDICES.length){
      activeQuestionPointer = nextPointer;
      advanceTrainToQuestionWagon(currentQuestionWagonIndex());
      return;
    }

    requestTrainExit();
  }

  function requestTrainExit(){
    if(stageCompleteTriggered || trainMotionState !== "playing") return;

    stageCompleteTriggered = true;
    trainMotionState = "exiting";
    clearActiveFallingMatterBoxes();
    animateTrainTo(TRAIN_MOTION.exitOffset, TRAIN_MOTION.exitDuration, "done");
  }

  function isMatterReady(){
    return !!(window.Matter && Matter.Engine && Matter.World && Matter.Bodies && Matter.Body);
  }

  function makeZone(type, rect, meta = {}){
    return {type, ...rect, ...meta};
  }

  function makeWell(rect, meta = {}){
    return makeZone("well", rect, meta);
  }

  function makeSurface(rect, meta = {}){
    return makeZone("surface", rect, meta);
  }

  function makeBreak(rect, meta = {}){
    return makeZone("break", rect, meta);
  }

  function makeBreakSurface(rect, meta = {}){
    return makeZone("break-surface", rect, meta);
  }

  function loadMatterLibrary(){
    if(isMatterReady()){
      buildCollisionMap();
      startMatterLoop();
      flushPendingMatterSpawns();
      return;
    }

    if(matterLibraryLoading) return;
    matterLibraryLoading = true;

    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js";
    script.async = true;

    script.onload = () => {
      matterLibraryLoading = false;
      buildCollisionMap();
      startMatterLoop();
      flushPendingMatterSpawns();
    };

    script.onerror = () => {
      matterLibraryLoading = false;
    };

    document.head.appendChild(script);
  }

  function flushPendingMatterSpawns(){
    if(!isMatterReady() || !matterEngine || !pendingMatterSpawns.length) return;

    const pending = pendingMatterSpawns.splice(0, pendingMatterSpawns.length);
    pending.forEach(job => {
      spawnMatterAnswerBox(job.startX, job.startY, job.textLines, true);
    });
  }

  function resetMatterWorld(){
    if(!isMatterReady()) return;

    if(!matterEngine){
      matterEngine = Matter.Engine.create({
        enableSleeping:true,
        positionIterations:10,
        velocityIterations:10,
        constraintIterations:2
      });

      matterEngine.gravity.x = 0;
      matterEngine.gravity.y = .82;

      Matter.Events.on(matterEngine, "collisionStart", event => {
        event.pairs.forEach(pair => {
          handleMatterCollision(pair.bodyA, pair.bodyB);
          handleMatterCollision(pair.bodyB, pair.bodyA);
        });
      });

      Matter.Events.on(matterEngine, "collisionActive", event => {
        event.pairs.forEach(pair => {
          handleGapActiveCollision(pair.bodyA, pair.bodyB);
          handleGapActiveCollision(pair.bodyB, pair.bodyA);
        });
      });
    }else{
      Matter.World.clear(matterEngine.world, false);
      matterEngine.gravity.x = 0;
      matterEngine.gravity.y = .82;
    }

    matterStaticBodies.length = 0;
    matterBoxes.length = 0;
    settledVisualMatterBoxes.length = 0;
    activeFallingBoxes = 0;
  }

  function addMatterBody(body){
    if(!isMatterReady() || !matterEngine) return null;
    matterStaticBodies.push(body);
    Matter.World.add(matterEngine.world, body);
    return body;
  }

  function addMatterRect(x, y, w, h, options = {}){
    if(!isMatterReady() || !matterEngine) return null;

    const body = Matter.Bodies.rectangle(x, y, w, h, {
      isStatic:true,
      friction:.9,
      frictionStatic:1.1,
      restitution:.08,
      collisionFilter:{
        category:MATTER_COLLISION.train,
        mask:MATTER_COLLISION.box
      },
      ...options
    });

    return addMatterBody(body);
  }

  function buildTrainPhysicsParts(){
    const parts = [];

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      parts.push({
        type:"wagon",
        id:`wagon-${index}`,
        index,
        car,
        x:trainWorldX(car.x),
        y:car.y,
        w:car.width,
        h:car.height,
        floorY:car.y + trainLen(TRAIN_PHYSICS_PROFILES.wagon.floor.yOffsetFromTop)
      });
    });

    TRAIN_CARS.forEach((car, index) => {
      if(!car || car.type !== "passenger") return;

      const layout = passengerLayoutForIndex(index);

      parts.push({
        type:"passenger",
        id:`passenger-${index}`,
        index,
        car,
        x:trainWorldX(layout.x),
        y:layout.y,
        w:layout.width,
        h:layout.height
      });
    });

    parts.push({
      type:"engine",
      id:"engine",
      x:trainWorldX(trainX(782)),
      y:trainY(430),
      w:trainLen(320),
      h:trainLen(179),
      roof:{
        x1:trainWorldX(trainX(TRAIN_PHYSICS_PROFILES.engine.roof.x1)),
        x2:trainWorldX(trainX(TRAIN_PHYSICS_PROFILES.engine.roof.x2)),
        y:trainY(TRAIN_PHYSICS_PROFILES.engine.roof.y),
        h:trainLen(TRAIN_PHYSICS_PROFILES.engine.roof.h)
      }
    });

    return parts;
  }

  function getAdjacentWagonParts(parts){
    return parts
      .filter(part => part && part.type === "wagon")
      .sort((a, b) => a.x - b.x);
  }

  function addWagonPhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.wagon;
    const car = part.car;
    const index = part.index;

    const floorInset = trainLen(profile.floor.inset);
    const floorH = trainLen(profile.floor.h);
    const wallXInset = trainLen(profile.wall.xInset);
    const wallYOffset = trainLen(profile.wall.yOffset);
    const wallW = trainLen(profile.wall.w);
    const wallH = trainLen(profile.wall.h);
    const topXInset = trainLen(profile.topBumper.xInset);
    const topYOffset = trainLen(profile.topBumper.yOffset);
    const topW = trainLen(profile.topBumper.w);
    const topH = trainLen(profile.topBumper.h);

    const well = {
      left:part.x + trainLen(2),
      right:part.x + part.w - trainLen(2),
      top:part.y + trainLen(4),
      bottom:part.y + part.h - trainLen(10)
    };

    collisionMap.push(makeWell(well, {
      car,
      index,
      partId:part.id,
      floorY:part.floorY,
      name:`wagon-well-${index}`
    }));

    addMatterRect(part.x + part.w / 2, part.floorY, part.w - floorInset * 2, floorH, {
      label:`${part.id}-floor`,
      sgType:"wagon-floor",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.floor.friction,
      frictionStatic:profile.floor.frictionStatic,
      restitution:profile.floor.restitution
    });

    addMatterRect(part.x + wallXInset, part.y + wallYOffset, wallW, wallH, {
      label:`${part.id}-left-wall`,
      sgType:"wagon-wall",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.wall.friction,
      frictionStatic:profile.wall.frictionStatic,
      restitution:profile.wall.restitution
    });

    addMatterRect(part.x + part.w - wallXInset, part.y + wallYOffset, wallW, wallH, {
      label:`${part.id}-right-wall`,
      sgType:"wagon-wall",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.wall.friction,
      frictionStatic:profile.wall.frictionStatic,
      restitution:profile.wall.restitution
    });

    addMatterRect(part.x + topXInset, part.y + topYOffset, topW, topH, {
      label:`${part.id}-left-top-edge-bumper`,
      sgType:"wagon-top-edge-bumper",
      sgPartId:part.id,
      sgWellIndex:index,
      sgPushX:1,
      isSensor:true,
      angle:-profile.topBumper.angle,
      friction:profile.topBumper.friction,
      frictionStatic:profile.topBumper.frictionStatic,
      restitution:profile.topBumper.restitution
    });

    addMatterRect(part.x + part.w - topXInset, part.y + topYOffset, topW, topH, {
      label:`${part.id}-right-top-edge-bumper`,
      sgType:"wagon-top-edge-bumper",
      sgPartId:part.id,
      sgWellIndex:index,
      sgPushX:-1,
      isSensor:true,
      angle:profile.topBumper.angle,
      friction:profile.topBumper.friction,
      frictionStatic:profile.topBumper.frictionStatic,
      restitution:profile.topBumper.restitution
    });

    collisionMap.push(makeSurface({
      left:part.x + topXInset - profile.topBumper.w / 2,
      right:part.x + topXInset + profile.topBumper.w / 2,
      y:part.y + topYOffset,
      thickness:topH
    }, {name:`${part.id}-left-top-edge-bumper`}));

    collisionMap.push(makeSurface({
      left:part.x + part.w - topXInset - profile.topBumper.w / 2,
      right:part.x + part.w - topXInset + profile.topBumper.w / 2,
      y:part.y + topYOffset,
      thickness:topH
    }, {name:`${part.id}-right-top-edge-bumper`}));
  }

  function addEnginePhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.engine;
    const roof = part.roof || profile.roof;

    collisionMap.push(makeSurface({
      left:roof.x1,
      right:roof.x2,
      y:roof.y,
      thickness:roof.h
    }, {name:"driver-roof-bumper"}));

    addMatterRect((roof.x1 + roof.x2) / 2, roof.y + roof.h / 2, roof.x2 - roof.x1, roof.h, {
      label:`${part.id}-roof-bounce`,
      sgType:"driver-roof",
      sgPartId:part.id,
      sgRoofY:roof.y,
      friction:profile.roofBounce.friction,
      frictionStatic:profile.roofBounce.frictionStatic,
      restitution:profile.roofBounce.restitution
    });
  }

  function addPassengerPhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.passenger.bouncer;

    const inset = trainLen(profile.inset);
    const topY = part.y + trainLen(profile.topYOffset);
    const topH = trainLen(profile.topH);
    const sideInset = trainLen(profile.sideInset);
    const sideW = trainLen(profile.sideW);
    const sideH = trainLen(profile.sideH);
    const sideCenterY = part.y + trainLen(profile.sideYOffset) + sideH / 2;

    addMatterRect(part.x + part.w / 2, topY, part.w - inset * 2, topH, {
      label:`${part.id}-top-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(part.x + sideInset, sideCenterY, sideW, sideH, {
      label:`${part.id}-left-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(part.x + part.w - sideInset, sideCenterY, sideW, sideH, {
      label:`${part.id}-right-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    collisionMap.push(makeSurface({
      left:part.x + inset,
      right:part.x + part.w - inset,
      y:topY - topH / 2,
      thickness:topH
    }, {name:`${part.id}-top-passenger-bouncer`}));

    collisionMap.push(makeSurface({
      left:part.x,
      right:part.x + sideW + sideInset,
      y:sideCenterY - sideH / 2,
      thickness:sideH
    }, {name:`${part.id}-left-passenger-bouncer`}));

    collisionMap.push(makeSurface({
      left:part.x + part.w - sideW - sideInset,
      right:part.x + part.w,
      y:sideCenterY - sideH / 2,
      thickness:sideH
    }, {name:`${part.id}-right-passenger-bouncer`}));
  }

  function addGapPhysicsBetweenParts(leftPart, rightPart){
    const profile = TRAIN_PHYSICS_PROFILES.gap;
    const leftEdge = leftPart.x + leftPart.w;
    const rightEdge = rightPart.x;
    const center = (leftEdge + rightEdge) / 2;
    const y = Math.min(leftPart.y, rightPart.y) + trainLen(profile.yOffset);
    const gapW = trainLen(profile.width);
    const gapH = trainLen(profile.height);
    const halfW = gapW / 2;

    collisionMap.push(makeSurface({
      left:center - gapW / 2,
      right:center + gapW / 2,
      y,
      thickness:gapH
    }, {name:`gap-smart-${leftPart.id}-${rightPart.id}`}));

    addMatterRect(center - halfW / 2, y, halfW, gapH, {
      label:`gap-${leftPart.id}-${rightPart.id}-left-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(center + halfW / 2, y, halfW, gapH, {
      label:`gap-${leftPart.id}-${rightPart.id}-right-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });
  }

  function addAllSmartGaps(parts){
    const wagons = getAdjacentWagonParts(parts);
    for(let i = 0; i < wagons.length - 1; i++){
      const left = wagons[i];
      const right = wagons[i + 1];

      // لا ننشئ فاصلًا ذكيًا طويلًا إذا كانت عربة ركاب بصرية بين عربتي السؤال.
      if(Math.abs((right.index ?? 0) - (left.index ?? 0)) !== 1) continue;

      addGapPhysicsBetweenParts(left, right);
    }
  }

  function addAllTrainPartPhysics(){
    const parts = buildTrainPhysicsParts();

    parts.forEach(part => {
      if(part.type === "wagon") addWagonPhysicsPart(part);
      if(part.type === "passenger") addPassengerPhysicsPart(part);
      if(part.type === "engine") addEnginePhysicsPart(part);
    });

    addAllSmartGaps(parts);
  }

  function buildCollisionMap(){
    collisionMap.length = 0;
    resetMatterWorld();

    collisionMap.push(makeBreakSurface({
      left:trainX(-90),
      right:trainX(1380),
      y:trainY(604),
      thickness:trainLen(54)
    }, {name:"track"}));

    addMatterRect(
      trainX(640),
      trainY(TRAIN_PHYSICS_PROFILES.track.y),
      trainLen(TRAIN_PHYSICS_PROFILES.track.w),
      trainLen(TRAIN_PHYSICS_PROFILES.track.h),
      {
        label:"kill-track",
        isSensor:true
      }
    );

    addAllTrainPartPhysics();

    [
      // الخلف جهة العربة غير قاتل. النطاط فقط هو الشريط الصغير فوق مقطورة السائق.
      // ما عدا ذلك من جسم القاطرة يعتبر اصطدام/انفجار.
      {name:"driver-cabin-front", left:890, right:960, top:424, bottom:514},
      {name:"engine-top-mid", left:920, right:1088, top:430, bottom:505},
      {name:"engine-body-mid", left:930, right:1085, top:488, bottom:590},
      {name:"engine-front", left:1058, right:1164, top:438, bottom:610},
      {name:"engine-nose", left:1116, right:1208, top:498, bottom:620},
      {name:"engine-plow", left:1088, right:1210, top:550, bottom:632}
    ].forEach(zone => {
      const scaledZone = trainWorldRect(trainRect(zone));

      collisionMap.push(makeBreak({
        left:scaledZone.left,
        right:scaledZone.right,
        top:scaledZone.top,
        bottom:scaledZone.bottom
      }, {name:zone.name}));

      addMatterRect(
        (scaledZone.left + scaledZone.right) / 2,
        (scaledZone.top + scaledZone.bottom) / 2,
        scaledZone.right - scaledZone.left,
        scaledZone.bottom - scaledZone.top,
        {
          label:`kill-${zone.name}`,
          sgType:"kill",
          isSensor:true
        }
      );
    });

    drawCollisionDebug();
  }

  function drawCollisionDebug(){
    if(!DEBUG_COLLISION || !collisionDebugLayer) return;
    collisionDebugLayer.innerHTML = "";

    const colors = {
      "well":"#00c853",
      "surface":"#00b0ff",
      "break":"#ff1744",
      "break-surface":"#ff7a00"
    };

    collisionMap.forEach(zone => {
      if(zone.type === "surface" || zone.type === "break-surface"){
        el("rect", {
          x:zone.left,
          y:zone.y,
          width:zone.right - zone.left,
          height:zone.thickness || 22,
          fill:colors[zone.type],
          opacity:".16",
          stroke:colors[zone.type],
          "stroke-width":2
        }, collisionDebugLayer);
      }else{
        el("rect", {
          x:zone.left,
          y:zone.top,
          width:zone.right - zone.left,
          height:zone.bottom - zone.top,
          fill:colors[zone.type] || "#fff",
          opacity:".16",
          stroke:colors[zone.type] || "#fff",
          "stroke-width":2
        }, collisionDebugLayer);
      }
    });
  }

  function getWellByIndex(index){
    for(const zone of collisionMap){
      if(zone.type === "well" && zone.index === index) return zone;
    }
    return null;
  }

  function isBodyInsideWell(body, well){
    return body.position.x >= well.left + 2 &&
      body.position.x <= well.right - 2 &&
      body.position.y >= well.top &&
      body.position.y <= well.bottom + 30;
  }

  function getWellByMatterBody(body){
    for(const zone of collisionMap){
      if(zone.type !== "well") continue;
      if(isBodyInsideWell(body, zone)) return zone;
    }
    return null;
  }

  function syncMatterBox(item){
    if(!item || !item.body || !item.node) return;

    const body = item.body;
    const localX = item.insideWagonLayer
      ? body.position.x - trainVisualOffsetX
      : body.position.x;

    item.node.setAttribute(
      "transform",
      `translate(${localX.toFixed(2)} ${body.position.y.toFixed(2)}) rotate(${(body.angle * 180 / Math.PI).toFixed(2)})`
    );
  }

  function moveMatterBoxBehindWagonCover(item){
    if(!item || item.insideWagonLayer || !settledObjectsLayer || !item.node) return;
    item.insideWagonLayer = true;
    settledObjectsLayer.appendChild(item.node);
    syncMatterBox(item);
  }

  function applySmartGapBounceToMatter(item, body, gapBody, activeMode = false){
    if(!item || !body || !gapBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.gap;
    const now = performance.now();
    const cooldown = activeMode ? profile.cooldown : Math.max(40, profile.cooldown - 35);

    if(item.lastGapSmartAt && now - item.lastGapSmartAt < cooldown){
      return;
    }

    item.lastGapSmartAt = now;

    const dx = body.position.x - gapBody.sgGapCenter;
    let direction = 0;

    if(Math.abs(dx) > profile.centerDeadZone){
      direction = dx < 0 ? -1 : 1;
    }else if(Math.abs(body.velocity.x) > .08){
      direction = body.velocity.x < 0 ? -1 : 1;
    }else{
      direction = gapBody.sgDefaultPushX || 1;
    }

    item.lastWellIndex = direction < 0 ? gapBody.sgLeftWellIndex : gapBody.sgRightWellIndex;

    const inwardX = direction < 0
      ? Math.min(body.velocity.x, -profile.inwardVelocity)
      : Math.max(body.velocity.x, profile.inwardVelocity);

    Matter.Body.setVelocity(body, {
      x:inwardX,
      y:Math.min(body.velocity.y * .12, -profile.upVelocity)
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .58 + (direction < 0 ? -profile.spinKick : profile.spinKick)
    );

    Matter.Body.setPosition(body, {
      x:body.position.x + direction * profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyWagonTopBumperBounceToMatter(item, body, bumperBody){
    if(!item || !body || !bumperBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.wagon.topBumper;
    const now = performance.now();

    if(item.lastTopEdgeBumperAt && now - item.lastTopEdgeBumperAt < profile.cooldown){
      return;
    }

    item.lastTopEdgeBumperAt = now;
    item.lastWellIndex = bumperBody.sgWellIndex ?? item.lastWellIndex;

    const direction = bumperBody.sgPushX || 0;
    const inwardX = direction > 0
      ? Math.max(body.velocity.x, profile.inwardVelocity)
      : Math.min(body.velocity.x, -profile.inwardVelocity);

    Matter.Body.setVelocity(body, {
      x:inwardX,
      y:Math.min(body.velocity.y * .18, -profile.upVelocity)
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .64 + (direction > 0 ? profile.spinKick : -profile.spinKick)
    );

    Matter.Body.setPosition(body, {
      x:body.position.x + direction * profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyPassengerBouncerBounce(item, body, bouncerBody){
    if(!item || !body || !bouncerBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.passenger.bouncer;
    const now = performance.now();

    if(item.lastPassengerBounceAt && now - item.lastPassengerBounceAt < profile.cooldown){
      return;
    }

    item.lastPassengerBounceAt = now;

    Matter.Body.setVelocity(body, {
      // دفع ثابت لليسار باتجاه العربة الأخيرة، مع قفزة خفيفة فقط.
      x:Math.min(body.velocity.x, -profile.leftVelocity),
      y:Math.min(body.velocity.y * .22, -profile.upVelocity)
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .62 - profile.spinKick
    );

    Matter.Body.setPosition(body, {
      x:body.position.x - profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyDriverRoofBounce(item, body, roofBody){
    if(!item || !body || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.engine.roofBounce;
    const roofY = (roofBody && roofBody.sgRoofY) || TRAIN_PHYSICS_PROFILES.engine.roof.y;
    const now = performance.now();

    if(item.lastRoofBounceAt && now - item.lastRoofBounceAt < profile.cooldown){
      return;
    }

    item.lastRoofBounceAt = now;

    const incomingY = Math.abs(body.velocity.y);
    const upVelocity = -clamp(incomingY * .92, profile.minUpVelocity, profile.maxUpVelocity);
    const backVelocity = Math.max(
      profile.maxBackwardVelocity,
      Math.min(profile.backwardVelocity, body.velocity.x - .82)
    );

    Matter.Body.setVelocity(body, {
      x:backVelocity,
      y:upVelocity
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .48 + profile.spinKick
    );

    Matter.Body.setPosition(body, {
      x:body.position.x - 3,
      y:Math.min(body.position.y - profile.liftOut, roofY - BOX.height / 2 - 8)
    });
  }

  function stopFreeFallAirDrift(item){
    if(!item || !item.airDriftActive) return;
    item.airDriftActive = false;
    item.firstSurfaceContactAt = item.firstSurfaceContactAt || performance.now();
  }

  function applyFreeFallAirDrift(item){
    if(!item || item.done || !item.airDriftActive || item.firstSurfaceContactAt || item.insideWagon) return;
    if(!item.body || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.freeFallAirDrift;
    if(!profile || !profile.enabled) return;

    const body = item.body;

    // أثناء السقوط الحر فقط:
    // نثبت المسار كهبوط مائل بفعل الهواء، لا كهروب عمودي.
    let nextVX = body.velocity.x;
    let nextVY = body.velocity.y;

    if(nextVX > profile.targetVX){
      nextVX = Math.max(profile.targetVX, nextVX - profile.velocityStepX);
      Matter.Body.applyForce(body, body.position, {
        x:-body.mass * profile.forceX,
        y:0
      });
    }else if(nextVX < profile.maxLeftVX){
      nextVX = profile.maxLeftVX;
    }

    if(nextVY < profile.targetVY){
      nextVY = Math.min(profile.targetVY, nextVY + profile.velocityStepY);
      Matter.Body.applyForce(body, body.position, {
        x:0,
        y:body.mass * profile.forceY
      });
    }else if(nextVY > profile.maxDownVY){
      nextVY = profile.maxDownVY;
    }

    Matter.Body.setVelocity(body, {
      x:nextVX,
      y:nextVY
    });
  }

  function handleGapActiveCollision(bodyA, bodyB){
    const item = bodyA && bodyA.sgItem;
    if(!item || item.done || !bodyB) return;

    if(bodyB.sgType === "gap-smart-bouncer"){
      stopFreeFallAirDrift(item);
      applySmartGapBounceToMatter(item, bodyA, bodyB, true);
    }
  }

  function handleMatterCollision(bodyA, bodyB){
    const item = bodyA && bodyA.sgItem;
    if(!item || item.done || !bodyB) return;

    stopFreeFallAirDrift(item);

    if(bodyB.label === "kill-track"){
      if(!item.insideWagon){
        breakMatterBox(item);
      }
      return;
    }

    if(bodyB.sgType === "kill" || String(bodyB.label || "").startsWith("kill-")){
      breakMatterBox(item);
      return;
    }

    if(bodyB.sgType === "gap-smart-bouncer"){
      applySmartGapBounceToMatter(item, bodyA, bodyB, false);
      return;
    }

    if(bodyB.sgType === "passenger-bouncer"){
      applyPassengerBouncerBounce(item, bodyA, bodyB);
      return;
    }

    if(bodyB.sgType === "wagon-top-edge-bumper"){
      applyWagonTopBumperBounceToMatter(item, bodyA, bodyB);
      return;
    }

    if(bodyB.sgType === "wagon-floor" || bodyB.sgType === "wagon-wall"){
      item.insideWagon = true;
      item.lastWagonContactAt = performance.now();
      item.lastWellIndex = bodyB.sgWellIndex;

      if(!item.enteredWellAt){
        item.enteredWellAt = performance.now();
      }

      moveMatterBoxBehindWagonCover(item);
      return;
    }

    if(bodyB.sgType === "driver-roof"){
      applyDriverRoofBounce(item, bodyA, bodyB);
      return;
    }
  }

  function cleanupMatterBox(item, removeVisual = true){
    if(!item || item.done) return;
    item.done = true;

    if(item.body && matterEngine && matterEngine.world){
      Matter.World.remove(matterEngine.world, item.body);
    }

    if(removeVisual && item.node && item.node.parentNode){
      item.node.remove();
    }

    const index = matterBoxes.indexOf(item);
    if(index >= 0) matterBoxes.splice(index, 1);

    activeFallingBoxes = Math.max(0, activeFallingBoxes - 1);
  }

  function breakMatterBox(item){
    if(!item || item.done) return;

    const x = item.body ? item.body.position.x : 0;
    const y = item.body ? item.body.position.y : 610;

    cleanupMatterBox(item, true);
    trackImpactBurst(fallingObjectsLayer || svg, x, Math.min(y + BOX.bottom, 610));
  }

  function settleMatterBoxAsVisualOnly(item, well){
    if(!item || item.done || !item.body || !item.node) return;

    const body = item.body;
    const node = item.node;
    const x = body.position.x;
    const y = body.position.y;
    const r = body.angle * 180 / Math.PI;

    const localX = x - trainVisualOffsetX;

    node.setAttribute(
      "transform",
      `translate(${localX.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`
    );

    // بعد الاستقرار يصبح بصريًا فقط: نخفف الفلتر الثقيل أيضًا لتقليل الضغط على الجوال.
    node.removeAttribute("filter");

    cleanupMatterBox(item, false);

    const layer = settledObjectsLayer || fallingObjectsLayer || svg;
    if(node && node.parentNode !== layer){
      layer.appendChild(node);
    }

    settledVisualMatterBoxes.push(item);
    rememberSettledBox(node, well && well.index);

    // إذا كان الصندوق في عربة السؤال النشطة:
    // ننتقل إلى عربة السؤال التالية، أو نخرج إذا كانت آخر عربة سؤال.
    handleQuestionWagonSettled(well);
  }

  function updateMatterBoxState(item){
    if(!item || item.done || !item.body || !item.node) return;

    const body = item.body;
    applyFreeFallAirDrift(item);
    syncMatterBox(item);

    const activeWell = item.insideWagon
      ? (getWellByIndex(item.lastWellIndex) || getWellByMatterBody(body))
      : getWellByMatterBody(body);

    if(item.insideWagon && activeWell){
      const speed = body.speed;
      const angular = Math.abs(body.angularVelocity);

      if(speed < .18 && angular < .018){
        item.stableFrames += 1;
      }else{
        item.stableFrames = 0;
      }

      if(item.stableFrames > 40){
        settleMatterBoxAsVisualOnly(item, activeWell);
        return;
      }
    }

    if(body.position.y > 700 || body.position.x < -240 || body.position.x > 1450){
      breakMatterBox(item);
    }
  }

  function startMatterLoop(){
    if(matterRunnerStarted || !isMatterReady() || !matterEngine) return;
    matterRunnerStarted = true;

    function frame(){
      if(matterEngine){
        Matter.Engine.update(matterEngine, 1000 / 60);
        matterBoxes.slice().forEach(updateMatterBoxState);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function releaseOldestMatterBoxIfNeeded(){
    const liveBoxes = matterBoxes.filter(item => item && !item.done);
    activeFallingBoxes = Math.min(activeFallingBoxes, liveBoxes.length);

    if(activeFallingBoxes < MAX_ACTIVE_FALLING_BOXES) return;

    const oldest = liveBoxes[0];
    if(oldest){
      cleanupMatterBox(oldest, true);
    }else{
      activeFallingBoxes = 0;
    }
  }

  function spawnMatterAnswerBox(startX, startY, textLines, fromQueue = false){
    if(!isMatterReady() || !matterEngine){
      if(!fromQueue){
        pendingMatterSpawns.push({startX, startY, textLines});
      }
      loadMatterLibrary();
      return false;
    }

    releaseOldestMatterBoxIfNeeded();

    const layer = fallingObjectsLayer || svg;
    const node = answerBox(layer, textLines);

    const body = Matter.Bodies.rectangle(startX, startY + 54, BOX.width, BOX.height, {
      label:"answer-box",
      collisionFilter:{
        category:MATTER_COLLISION.box,
        mask:MATTER_COLLISION.train
      },
      ...TRAIN_PHYSICS_PROFILES.box.body
    });

    Matter.Body.setVelocity(body, {x:-1.95, y:1.9});
    Matter.Body.setAngularVelocity(body, 0);

    const item = {
      node,
      body,
      textLines,
      spawnedAt:performance.now(),
      insideWagon:false,
      insideWagonLayer:false,
      enteredWellAt:0,
      lastWellIndex:null,
      lastTopEdgeBumperAt:0,
      lastGapSmartAt:0,
      lastPassengerBounceAt:0,
      lastRoofBounceAt:0,
      firstSurfaceContactAt:0,
      airDriftActive:true,
      stableFrames:0,
      done:false
    };

    body.sgItem = item;
    matterBoxes.push(item);
    activeFallingBoxes += 1;
    Matter.World.add(matterEngine.world, body);
    syncMatterBox(item);

    return true;
  }

  function spawnFallingAnswerBox(startX, startY, textLines){
    // مسار واحد فقط: نفس نظام المختبر Matter.js.
    return spawnMatterAnswerBox(startX, startY, textLines);
  }

  const BALLOON_SPEED_LEVEL = 6; // مؤقتًا: لاحقًا يرتبط بشريط السرعة من 1 إلى 10.

  const BALLOON_FLIGHT = {
    startX:1355,
    endX:-230,
    minY:112,
    maxY:292,
    baseY:178,
    scale:.92,
    speedLevel:BALLOON_SPEED_LEVEL
  };

  function speedFromLevel(level){
    const safeLevel = clamp(Number(level) || 1, 1, 10);
    // سرعة بطيئة الآن، وقابلة للتوسيع لاحقًا من شريط السرعة.
    return 24 + safeLevel * 9;
  }

  const BALLOON_TEXT_BANK = [
    ["ما أجمل", "الزهور!"],
    ["أين", "القلم؟"],
    ["هذا", "طالب"],
    ["يا", "محمد!"],
    ["هل", "تسمع؟"],

  ];

  const activeBalloons = [];
  let balloonTextCursor = 0;
  let balloonLoopStarted = false;
  let balloonLoopLastTime = 0;

  function nextBalloonLines(){
    const lines = BALLOON_TEXT_BANK[balloonTextCursor % BALLOON_TEXT_BANK.length];
    balloonTextCursor += 1;
    return lines;
  }

  function setBalloonLines(balloon, lines){
    const tspans = balloon.querySelectorAll("text tspan");
    if(tspans[0]) tspans[0].textContent = lines[0] || "";
    if(tspans[1]) tspans[1].textContent = lines[1] || "";

  function createBalloonMotionState(config, index = 0){
    const now = performance.now();
    return {
      x:(config.startX ?? 1355) + index * 168 + Math.random() * 34,
      y:(config.baseY ?? 178) + (Math.random() * 34 - 17),
      lastTime:now,
      phaseA:Math.random() * Math.PI * 2,
      phaseB:Math.random() * Math.PI * 2,
      phaseC:Math.random() * Math.PI * 2,
      drift:0,
      driftTarget:0,
      nextDriftAt:now + 650 + Math.random() * 1200
    };
  }

  function recycleBalloon(item, now, forceFarRight = false){
    const rightMost = activeBalloons.reduce((max, other) => {
      if(other === item || other.popped) return max;
      return Math.max(max, other.state.x);
    }, BALLOON_FLIGHT.startX);

    item.config.lines = nextBalloonLines();
    setBalloonLines(item.node, item.config.lines);

    item.state.x = forceFarRight
      ? BALLOON_FLIGHT.startX + item.index * 168 + Math.random() * 38
      : Math.max(BALLOON_FLIGHT.startX + Math.random() * 90, rightMost + 156 + Math.random() * 52);

    item.state.y = item.config.baseY + (Math.random() * 40 - 20);
    item.state.phaseA = Math.random() * Math.PI * 2;
    item.state.phaseB = Math.random() * Math.PI * 2;
    item.state.phaseC = Math.random() * Math.PI * 2;
    item.state.drift = 0;
    item.state.driftTarget = Math.random() * 44 - 22;
    item.state.nextDriftAt = now + 750 + Math.random() * 1700;

    // تحديث المكان الجديد وهو مخفي أولًا، ثم إظهاره.
    // هذا يمنع لمحة ظهور البالون القديم بعد الفرقعة بدون لمس القطار أو الفيزياء.
    item.node.setAttribute(
      "transform",
      `translate(${item.state.x.toFixed(2)} ${item.state.y.toFixed(2)}) scale(${item.config.scale})`
    );

    item.node.style.display = "";
    item.node.setAttribute("opacity", "1");
    item.node.style.pointerEvents = "auto";
    item.popped = false;
    item.resetAt = 0;
  }

  function popPooledBalloon(item, now){
    if(item.popped) return;
    if(trainMotionState !== "playing") return;

    item.popped = true;
    item.resetAt = now + 950;

    item.node.setAttribute("opacity", "0");
    item.node.style.display = "none";
    item.node.style.pointerEvents = "none";

    balloonBurst(fallingObjectsLayer || svg, item.state.x, item.state.y, item.config.scale);
    spawnFallingAnswerBox(item.state.x, item.state.y, item.config.lines || ["ما أجمل", "الزهور!"]);
  }

  function updateBalloonItem(item, now, dtMs){
    if(item.popped){
      if(now >= item.resetAt){
        recycleBalloon(item, now, false);
      }
      return;
    }

    const dt = dtMs / 1000;
    const speed = item.speed;

    const speedPulse =
      0.96 +
      Math.sin(now * 0.0011 + item.state.phaseB) * 0.045 +
      Math.sin(now * 0.0021 + item.state.phaseC) * 0.024;

    item.state.x -= speed * speedPulse * dt;

    if(now >= item.state.nextDriftAt){
      item.state.driftTarget = Math.random() * 48 - 24;
      item.state.nextDriftAt = now + 900 + Math.random() * 2100;
    }

    item.state.drift += (item.state.driftTarget - item.state.drift) * 0.018;

    const wave =
      Math.sin(now * 0.00125 + item.state.phaseA) * 29 +
      Math.sin(now * 0.00235 + item.state.phaseB) * 10 +
      Math.sin(now * 0.00058 + item.state.phaseC) * 14;

    item.state.y = clamp(item.config.baseY + wave + item.state.drift, item.config.minY, item.config.maxY);

    item.node.setAttribute(
      "transform",
      `translate(${item.state.x.toFixed(2)} ${item.state.y.toFixed(2)}) scale(${item.config.scale})`
    );

    if(item.state.x < item.config.endX){
      recycleBalloon(item, now, false);
    }
  }

  function startBalloonPoolLoop(){
    if(balloonLoopStarted) return;
    balloonLoopStarted = true;

    function frame(now){
      const dtMs = balloonLoopLastTime ? Math.min(40, now - balloonLoopLastTime) : 16;
      balloonLoopLastTime = now;

      for(const item of activeBalloons){
        updateBalloonItem(item, now, dtMs);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function balloonsLayer(){
    const balloons = el("g", {id:"balloonsLayer"});

    // نظام جولات خفيف: 5 بالونات نشطة فقط، وتُعاد تدويرها حتى نهاية الجولة.
    const ACTIVE_BALLOONS = BALLOONS_PER_ROUND;
    const yPattern = [158, 126, 196, 232, 174];
    const scalePattern = [MEDIUM_BALLOON_SCALE, MEDIUM_BALLOON_SCALE, MEDIUM_BALLOON_SCALE, MEDIUM_BALLOON_SCALE, MEDIUM_BALLOON_SCALE];
    const speedPattern = [1.08, 1.16, 1.02, 1.12, 1.06];

    for(let index = 0; index < ACTIVE_BALLOONS; index++){
      const lines = nextBalloonLines();
      const config = {
        ...BALLOON_FLIGHT,
        lines,
        scale:MEDIUM_BALLOON_SCALE,
        baseY:yPattern[index],
        minY:88,
        maxY:312,
        speedLevel:BALLOON_SPEED_LEVEL,
        speedMultiplier:speedPattern[index]
      };

      const balloon = answerBalloon(balloons, {
        id:`answerBalloonDemo-${index}`,
        x:BALLOON_FLIGHT.startX + index * 168,
        y:config.baseY,
        scale:config.scale,
        lines:config.lines,
        shadow:false
      });

      balloon.style.pointerEvents = "auto";
      balloon.style.cursor = "pointer";

      const item = {
        node:balloon,
        index,
        config,
        state:createBalloonMotionState(config, index),
        speed:speedFromLevel(config.speedLevel) * (config.speedMultiplier || 1),
        popped:false,
        resetAt:0
      };

      balloon.addEventListener("pointerdown", event => {
        event.preventDefault();
        popPooledBalloon(item, performance.now());
      });

      activeBalloons.push(item);
    }

    startBalloonPoolLoop();
  }

  function addWheel(layer, cx, cy, size, version = 72){
    const scaledCx = trainX(cx);
    const scaledCy = trainY(cy);
    const scaledSize = trainLen(size);

    const wheel = el("image", {
      href:`train-wheel.webp?v=${version}`,
      x:scaledCx - scaledSize / 2,
      y:scaledCy - scaledSize / 2,
      width:scaledSize,
      height:scaledSize,
      preserveAspectRatio:"xMidYMid meet",
      class:"train-wheel"
    }, layer);
    wheel.setAttributeNS("http://www.w3.org/1999/xlink", "href", `train-wheel.webp?v=${version}`);
    return wheel;
  }

  function buildAnswerCars(answerTexts){
    return answerTexts
      .map(text => String(text || "").trim())
      .filter(Boolean)
      .slice(0, 4)
      .map(text => ({type:"answer", text}));
  }

  const TRAIN_CARS = [
    {type:"answer", text:"ثديّات"},
    {type:"passenger"},
    {type:"answer", text:"رخويات"}
  ];

  const QUESTION_WAGON_INDICES = TRAIN_CARS
    .map((car, index) => car && car.type === "answer" ? index : null)
    .filter(index => index !== null);

  const TRAIN_LAYOUT = {
    nearestWagonX:490,
    wagonY:486,
    wagonW:300,
    wagonH:111,
    wagonStep:288
  };

  function passengerLayoutForIndex(index){
    const rawSlotX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    const rawPassengerW = 320;
    const rawPassengerH = 179;
    const rawPassengerX = rawSlotX + (TRAIN_LAYOUT.wagonW - rawPassengerW) / 2;
    const rawPassengerY = 418;

    return {
      rawX:rawPassengerX,
      rawY:rawPassengerY,
      rawW:rawPassengerW,
      rawH:rawPassengerH,
      x:trainX(rawPassengerX),
      y:trainY(rawPassengerY),
      width:trainLen(rawPassengerW),
      height:trainLen(rawPassengerH)
    };
  }

  const trainCarRegistry = [];

  function answerWagon(train, car, index){
    // قالب عربة الإجابة:
    // نفس العربة المعتمدة سابقًا، لكن صارت قابلة للتكرار حسب عدد الإجابات.
    // يتم تصغير القطار هنا فقط؛ الصندوق والبالونات تبقى بالحجم الأصلي.
    const rawWagonX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    const rawWagonY = TRAIN_LAYOUT.wagonY;
    const rawWagonW = TRAIN_LAYOUT.wagonW;
    const rawWagonH = TRAIN_LAYOUT.wagonH;

    const wagonX = trainX(rawWagonX);
    const wagonY = trainY(rawWagonY);
    const wagonW = trainLen(rawWagonW);
    const wagonH = trainLen(rawWagonH);

    const targetArea = {
      // منطقة الاستهداف الداخلية للعربة، مصغرة بنفس حجم العربة المرئية.
      left:wagonX + trainLen(14),
      right:wagonX + wagonW - trainLen(14),
      top:wagonY + trainLen(16),
      bottom:wagonY + wagonH - trainLen(16),
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2
    };

    trainCarRegistry[index] = {
      type:car.type,
      text:car.text,
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      left:wagonX,
      right:wagonX + wagonW,
      top:wagonY,
      bottom:wagonY + wagonH,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2,
      targetArea
    };

    const wheelLayer = el("g", {id:`wagonWheelLayer-${index}`}, train);
    // عجلات عربات الإجابة بنفس حجم وارتفاع العجلات الثلاث الصغيرة في القاطرة.
    // جسم العربة يُرسم بعدها، لذلك يبقى الجزء العلوي من العجلة مخفيًا خلف العربة.
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = rawWagonX + 49;
    const gap = 66;
    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`wagonBodyLayer-${index}`}, train);
    const wagonBody = el("image", {
      href:"train-wagon.webp?v=84",
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      preserveAspectRatio:"xMidYMid meet",
      id:`wagonBody-${index}`
    }, bodyLayer);
    wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=84");

    el("text", {
      x:wagonX + wagonW / 2,
      y:wagonY + wagonH * .56,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffe28a",
      stroke:"#5b2618",
      "stroke-width":trainLen(2.6),
      "paint-order":"stroke fill",
      "font-size":trainLen(30),
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, bodyLayer).textContent = car.text;
  }

  function passengerWagon(train, car, index){
    // عربة الركاب بصرية فقط:
    // لا تدخل في trainCarRegistry ولا تُحسب كعربة سؤال.
    // نطاطاتها الفيزيائية تعتمد على نفس passengerLayoutForIndex المستخدم للرسم.
    const layout = passengerLayoutForIndex(index);
    const rawPassengerX = layout.rawX;
    const passengerX = layout.x;
    const passengerY = layout.y;
    const passengerW = layout.width;
    const passengerH = layout.height;

    const wheelLayer = el("g", {id:`passengerWheelLayer-${index}`}, train);
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = rawPassengerX + 49;
    const gap = 66;

    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`passengerBodyLayer-${index}`}, train);
    const passengerBody = el("image", {
      href:PASSENGER_WAGON_IMAGE,
      x:passengerX,
      y:passengerY,
      width:passengerW,
      height:passengerH,
      preserveAspectRatio:"none",
      id:`passengerBody-${index}`
    }, bodyLayer);

    passengerBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", PASSENGER_WAGON_IMAGE);
  }

  function wagons(train){
    // نرسم العربات من الخلف إلى الأمام حتى تكون العربة الأقرب للقاطرة فوق الوصلات بصريًا.
    for(let i = TRAIN_CARS.length - 1; i >= 0; i--){
      const car = TRAIN_CARS[i];
      if(car.type === "answer") answerWagon(train, car, i);
      if(car.type === "passenger") passengerWagon(train, car, i);
    }
  }

  function renderWagonForegroundCovers(){
    if(!wagonForegroundCoverLayer) return;

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const wagonBody = el("image", {
        href:"train-wagon.webp?v=84",
        x:car.x,
        y:car.y,
        width:car.width,
        height:car.height,
        preserveAspectRatio:"xMidYMid meet",
        id:`wagonCoverBody-${index}`
      }, wagonForegroundCoverLayer);
      wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=84");

      el("text", {
        x:car.centerX,
        y:car.y + car.height * .56,
        "text-anchor":"middle",
        "dominant-baseline":"middle",
        fill:"#ffe28a",
        stroke:"#5b2618",
        "stroke-width":2.6,
        "paint-order":"stroke fill",
        "font-size":30,
        "font-weight":900,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"rtl"
      }, wagonForegroundCoverLayer).textContent = car.text;
    });
  }

  function getAnswerTargetArea(index){
    const car = trainCarRegistry[index];
    return car ? car.targetArea : null;
  }

  function locomotive(train){
    // إصدار 82:
    // القاطرة مصغرة بنفس مقياس القطار، بينما البالونات والصناديق لا تتغير.
    const rawLocoX = 782;
    const rawLocoY = 430;
    const rawLocoW = 320;
    const rawLocoH = 179;

    const locoX = trainX(rawLocoX);
    const locoY = trainY(rawLocoY);
    const locoW = trainLen(rawLocoW);
    const locoH = trainLen(rawLocoH);

    const bodyLayer = el("g", {id:"locomotiveBodyLayer"}, train);
    const locomotiveBody = el("image", {
      href:"train-engine-transparent.png?v=84",
      x:locoX,
      y:locoY,
      width:locoW,
      height:locoH,
      preserveAspectRatio:"xMidYMid meet",
      id:"locomotiveBody"
    }, bodyLayer);
    locomotiveBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-engine-transparent.png?v=84");

    const wheelLayer = el("g", {id:"locomotiveWheelLayer"}, train);

    // العجلة الكبيرة: تقديم للأمام بحوالي 3% ورفع للأعلى بحوالي 2%.
    const largeWheelSize = 90.2;
    const largeWheelCx = rawLocoX + 64;
    const largeWheelCy = 565;
    addWheel(wheelLayer, largeWheelCx, largeWheelCy, largeWheelSize, 39);

    // العجلات الثلاث الصغيرة: إرجاع للخلف داخل القاطرة وتكبير 10% تقريبًا.
    const smallWheelSize = 47.4;
    const smallWheelCy = 585.3;
    const smallStartX = rawLocoX + 148;
    const smallGap = 50;
    addWheel(wheelLayer, smallStartX, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap * 2, smallWheelCy, smallWheelSize, 39);
  }

  function renderWagonDropCovers(){
    wagonDropCoverPositionGroup = el("g", {
      id:"wagonDropCoverPositionGroup",
      "pointer-events":"none"
    });

    wagonDropCoverLayer = el("g", {
      id:"wagonDropCoverLayer",
      class:"train-idle-motion",
      "pointer-events":"none"
    }, wagonDropCoverPositionGroup);

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const clipId = `wagonDropCoverClip-${index}`;
      const defsNode = svg.querySelector("defs");
      const clip = el("clipPath", {id:clipId}, defsNode);

      // نغطي الثلث السفلي فقط حتى لا نحجب نص العربة،
      // وفي نفس الوقت نمنع ظهور أسفل الصندوق فوق واجهة العربة.
      el("rect", {
        x:car.x,
        y:car.y + car.height * .62,
        width:car.width,
        height:car.height * .38
      }, clip);

      const cover = el("image", {
        href:"train-wagon.webp?v=84",
        x:car.x,
        y:car.y,
        width:car.width,
        height:car.height,
        preserveAspectRatio:"xMidYMid meet",
        "clip-path":`url(#${clipId})`,
        "pointer-events":"none"
      }, wagonDropCoverLayer);
      cover.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=84");
    });
  }

  function build(){
    clear();
    defs();
    background();
    balloonsLayer();

    // المجموعة الخارجية لحركة دخول وخروج القطار.
    trainPositionGroup = el("g", {id:"trainPositionGroup"});
    setTrainVisualOffset(TRAIN_MOTION.enterOffset);

    // المجموعة الداخلية مخصصة للحركة الخفيفة المستمرة فقط.
    const train = el("g", {id:"trainScene", class:"train-idle-motion"}, trainPositionGroup);

    wagons(train);
    locomotive(train);

    // طبقة الصناديق التي استقرت داخل أحواض العربات.
    // توضع داخل trainScene حتى تتحرك مع الحركة الخفيفة للقطار.
    settledObjectsLayer = el("g", {id:"settledObjectsLayer"}, train);
    wagonForegroundCoverLayer = el("g", {id:"wagonForegroundCoverLayer"}, train);
    renderWagonForegroundCovers();

    // طبقة الصناديق أثناء السقوط تبقى خارج trainScene حتى لا تتحرك مع القطار أثناء السقوط.
    fallingObjectsLayer = el("g", {id:"fallingObjectsLayer"});

    // غطاء بصري سفلي فوق الصناديق الساقطة فقط، بدون نقل الصندوق أو تغيير الفيزياء.
    renderWagonDropCovers();

    // خريطة تصادم غير مرئية للقطار: أحواض، حواف، نطاطات، فواصل ذكية، قاطرة، وسكة.
    collisionDebugLayer = el("g", {id:"collisionDebugLayer"});
    loadMatterLibrary();

    // المرحلة الأولى: يبدأ القطار خارج الشاشة من اليسار ثم يدخل حتى تستقر العربة في المنتصف.
    startTrainEntry();
  }

  build();
  /* إصدار 94: إضافة نطاطات خفيفة أعلى وجانبي أي عربة ركاب، تدفع الصندوق لليسار باتجاه العربة الأخيرة. */
})();
</script>
</body>
</html>
