<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 49</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bfcae6;
      --sky-mid:#dce3f2;
      --sand:#d7a464;
      --sand2:#bd7f42;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 120px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:120px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,#ead5ac 46%,var(--sand) 72%,var(--sand2) 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:10;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      pointer-events:auto;
    }

    .train-wheel{
      transform-box:fill-box;
      transform-origin:center;
      animation:wheelSpin .55s linear infinite;
    }

    .train-idle-motion{
      transform-box:fill-box;
      transform-origin:center;
      animation:trainIdleMotion 3.2s ease-in-out infinite;
      will-change:transform;
    }

    @keyframes trainIdleMotion{
      0%,100%{transform:translateX(0)}
      45%{transform:translateX(4px)}
      68%{transform:translateX(2px)}
    }

    @keyframes wheelSpin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="خلفية وسكة قطار الإجابات"></svg>
  </main>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("stage");
  const NS = "http://www.w3.org/2000/svg";

  function el(name, attrs = {}, parent = svg){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clear(){
    svg.innerHTML = "";
  }

  function defs(){
    const d = el("defs");

    const scene = el("linearGradient", {id:"sceneGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#bfcae6"}, scene);
    el("stop", {offset:"45%", "stop-color":"#dce3f2"}, scene);
    el("stop", {offset:"46%", "stop-color":"#ead5ac"}, scene);
    el("stop", {offset:"72%", "stop-color":"#d7a464"}, scene);
    el("stop", {offset:"100%", "stop-color":"#bd7f42"}, scene);

    const sand = el("linearGradient", {id:"sandGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#e7c188"}, sand);
    el("stop", {offset:"100%", "stop-color":"#b47538"}, sand);

    const softShadow = el("filter", {id:"softShadow", x:"-20%", y:"-20%", width:"140%", height:"140%"}, d);
    el("feDropShadow", {dx:"0", dy:"5", stdDeviation:"4", "flood-color":"#000", "flood-opacity":".16"}, softShadow);

    const balloonBody = el("radialGradient", {
      id:"balloonBodyGrad",
      cx:"34%",
      cy:"30%",
      r:"72%",
      fx:"28%",
      fy:"22%"
    }, d);
    el("stop", {offset:"0%", "stop-color":"#f5f8ff"}, balloonBody);
    el("stop", {offset:"23%", "stop-color":"#cfdaf0"}, balloonBody);
    el("stop", {offset:"52%", "stop-color":"#8fa0c1"}, balloonBody);
    el("stop", {offset:"78%", "stop-color":"#5f6170"}, balloonBody);
    el("stop", {offset:"100%", "stop-color":"#3f3d47"}, balloonBody);

    const balloonHighlight = el("linearGradient", {id:"balloonHighlightGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#ffffff", "stop-opacity":".08"}, balloonHighlight);
    el("stop", {offset:"38%", "stop-color":"#ffffff", "stop-opacity":".58"}, balloonHighlight);
    el("stop", {offset:"70%", "stop-color":"#ffffff", "stop-opacity":".12"}, balloonHighlight);
    el("stop", {offset:"100%", "stop-color":"#ffffff", "stop-opacity":"0"}, balloonHighlight);

    const balloonFin = el("linearGradient", {id:"balloonFinGrad", x1:"0", y1:"0", x2:"1", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#aab6d0"}, balloonFin);
    el("stop", {offset:"100%", "stop-color":"#68718d"}, balloonFin);

    const balloonShadow = el("filter", {id:"balloonShadow", x:"-20%", y:"-25%", width:"140%", height:"150%"}, d);
    el("feDropShadow", {dx:"0", dy:"8", stdDeviation:"6", "flood-color":"#1e2332", "flood-opacity":".22"}, balloonShadow);

    const boxBody = el("linearGradient", {id:"answerBoxGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#b07445"}, boxBody);
    el("stop", {offset:"48%", "stop-color":"#8e552f"}, boxBody);
    el("stop", {offset:"100%", "stop-color":"#62351d"}, boxBody);

    const boxTop = el("linearGradient", {id:"answerBoxTopGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#c78a56"}, boxTop);
    el("stop", {offset:"100%", "stop-color":"#8a4d2b"}, boxTop);

    const boxShadow = el("filter", {id:"answerBoxShadow", x:"-35%", y:"-35%", width:"170%", height:"180%"}, d);
    el("feDropShadow", {dx:"0", dy:"7", stdDeviation:"5", "flood-color":"#2b170c", "flood-opacity":".24"}, boxShadow);
  }

  function makeCloud(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, opacity:".78"}, parent);
    [[0,0,20],[22,-6,30],[52,-2,24],[76,6,18],[24,16,25],[58,15,22]].forEach(([cx, cy, r]) => {
      el("circle", {
        cx,
        cy,
        r,
        fill:"#eef3fa",
        stroke:"#b2bdcd",
        "stroke-width":2,
        opacity:".85"
      }, g);
    });
  }

  function makeCactus(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    el("rect", {x:-10, y:-70, width:20, height:80, rx:10, fill:"#4c8b53", stroke:"#39703f", "stroke-width":3}, g);
    el("path", {d:"M-9 -44 C-45 -52 -43 -6 -20 -7", fill:"none", stroke:"#4c8b53", "stroke-width":16, "stroke-linecap":"round"}, g);
    el("path", {d:"M8 -54 C45 -64 47 -20 20 -19", fill:"none", stroke:"#4c8b53", "stroke-width":15, "stroke-linecap":"round"}, g);
    el("ellipse", {cx:0, cy:12, rx:30, ry:6, fill:"rgba(66,39,16,.22)"}, g);
  }

  function makeBush(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    [[-22,0,20],[0,-8,28],[26,0,19],[10,9,16]].forEach(([cx,cy,r]) => {
      el("circle", {cx, cy, r, fill:"#8faa52", opacity:".88"}, g);
    });
  }

  function answerBalloon(parent, options = {}){
    // إصدار 49:
    // بالون/منطاد تجريبي مرسوم بالكامل بالكود داخل SVG.
    // لا يعتمد على صورة خارجية، والنص قابل للتغيير لاحقًا من بيانات اللعبة.
    const x = options.x ?? 760;
    const y = options.y ?? 165;
    const scale = options.scale ?? 1;
    const lines = options.lines || ["ما أجمل", "الزهور!"];

    const g = el("g", {
      id:"answerBalloonDemo",
      transform:`translate(${x} ${y}) scale(${scale})`,
      filter:"url(#balloonShadow)"
    }, parent);

    // زعانف خلفية يمين مثل المرجع.
    el("path", {
      d:"M116 -23 L153 -43 L153 -5 L118 3 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".92"
    }, g);
    el("path", {
      d:"M118 12 L153 4 L153 42 L113 25 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".9"
    }, g);
    el("path", {
      d:"M122 -7 L162 -18 L162 20 L122 9 Z",
      fill:"#75809d",
      stroke:"#646f8a",
      "stroke-width":2,
      opacity:".7"
    }, g);

    // جسم البالون.
    el("ellipse", {
      cx:0,
      cy:0,
      rx:138,
      ry:64,
      fill:"url(#balloonBodyGrad)",
      stroke:"#68738f",
      "stroke-width":3.2
    }, g);

    // خطوط جسم البالون لإحساس الشكل المعدني/المنفوخ.
    [-42,-18,8,34].forEach((yy, idx) => {
      el("path", {
        d:`M-120 ${yy} C-58 ${yy - 16 + idx * 4} 52 ${yy - 14 + idx * 3} 120 ${yy - 2}`,
        fill:"none",
        stroke:idx < 2 ? "#eef4ff" : "#4e566c",
        "stroke-width":idx < 2 ? 2.2 : 1.6,
        opacity:idx < 2 ? ".55" : ".35"
      }, g);
    });

    // لمعة علوية خفيفة.
    el("ellipse", {
      cx:-30,
      cy:-27,
      rx:86,
      ry:21,
      fill:"url(#balloonHighlightGrad)",
      opacity:".72"
    }, g);

    // سلة/محرك صغير أسفل البالون.
    const gondola = el("g", {transform:"translate(-8 68)"}, g);
    el("path", {
      d:"M-34 -8 L35 -8 L27 18 L-25 18 Z",
      fill:"#6f7080",
      stroke:"#56596a",
      "stroke-width":2,
      opacity:".86"
    }, gondola);
    [-18,0,18].forEach(cx => {
      el("circle", {cx, cy:7, r:5, fill:"#858899", stroke:"#55586a", "stroke-width":1.5}, gondola);
    });

    // النص من الكود، وليس جزءًا من صورة.
    const text = el("text", {
      x:0,
      y:-10,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#050505",
      stroke:"#ffffff",
      "stroke-width":2.7,
      "paint-order":"stroke fill",
      "font-size":37,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    lines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 40
      }, text).textContent = line;
    });

    return g;
  }

  const DEBUG_COLLISION = false;

  let fallingObjectsLayer = null;
  let settledObjectsLayer = null;
  let wagonForegroundCoverLayer = null;
  let collisionDebugLayer = null;
  const collisionMap = [];

  function balloonBurst(parent, x, y, scale = 1){
    const burst = el("g", {
      transform:`translate(${x} ${y}) scale(${scale})`,
      opacity:"1"
    }, parent);

    const pieces = [
      [-36,-16,-74,-42],[-12,-28,-28,-72],[20,-24,44,-68],
      [46,-4,90,-22],[-44,18,-86,38],[-8,30,-24,76],
      [26,24,58,66],[58,20,106,46]
    ];

    pieces.forEach(([x1,y1,x2,y2], index) => {
      const shard = el("path", {
        d:`M${x1} ${y1} L${x1 + 12} ${y1 + 8} L${x2} ${y2} Z`,
        fill:index % 2 ? "#cbd7ef" : "#828da9",
        stroke:"#66718f",
        "stroke-width":1.3,
        opacity:".92"
      }, burst);
      const animate = el("animate", {
        attributeName:"opacity",
        values:".95;.55;0",
        dur:".55s",
        fill:"freeze"
      }, shard);
      animate.beginElement();
    });

    const ring = el("ellipse", {
      cx:0,
      cy:0,
      rx:48,
      ry:23,
      fill:"none",
      stroke:"#ffffff",
      "stroke-width":4,
      opacity:".55"
    }, burst);

    const ringFade = el("animate", {
      attributeName:"opacity",
      values:".55;.2;0",
      dur:".45s",
      fill:"freeze"
    }, ring);
    ringFade.beginElement();

    setTimeout(() => burst.remove(), 650);
  }

  function answerBox(parent, textLines = ["ما أجمل", "الزهور!"]){
    const g = el("g", {
      filter:"url(#answerBoxShadow)"
    }, parent);

    // صندوق بسيط مؤقت لاختبار فيزياء السقوط فقط.
    el("path", {
      d:"M-46 -32 L46 -32 L58 -18 L-34 -18 Z",
      fill:"url(#answerBoxTopGrad)",
      stroke:"#4e2b18",
      "stroke-width":2
    }, g);

    el("rect", {
      x:-46,
      y:-18,
      width:92,
      height:60,
      rx:7,
      fill:"url(#answerBoxGrad)",
      stroke:"#4e2b18",
      "stroke-width":2.5
    }, g);

    el("path", {
      d:"M-46 2 L46 2 M-18 -18 L-18 42 M18 -18 L18 42",
      fill:"none",
      stroke:"#d3a06a",
      "stroke-width":3,
      opacity:".72"
    }, g);

    const text = el("text", {
      x:0,
      y:5,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#fff0b8",
      stroke:"#442313",
      "stroke-width":1.9,
      "paint-order":"stroke fill",
      "font-size":17,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    textLines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 20
      }, text).textContent = line;
    });

    return g;
  }

  function trackImpactBurst(parent, x, y){
    const burst = el("g", {
      transform:`translate(${x} ${y})`,
      opacity:"1"
    }, parent);

    for(let i = 0; i < 12; i++){
      const angle = Math.PI + Math.random() * Math.PI;
      const dist = 20 + Math.random() * 48;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist * .42;
      const dot = el("circle", {
        cx:0,
        cy:0,
        r:3 + Math.random() * 4,
        fill:i % 2 ? "#8a5a34" : "#d2a36a",
        opacity:".75"
      }, burst);
      const move = el("animateTransform", {
        attributeName:"transform",
        type:"translate",
        from:"0 0",
        to:`${dx.toFixed(1)} ${dy.toFixed(1)}`,
        dur:".38s",
        fill:"freeze"
      }, dot);
      const fade = el("animate", {
        attributeName:"opacity",
        values:".75;.35;0",
        dur:".42s",
        fill:"freeze"
      }, dot);
      move.beginElement();
      fade.beginElement();
    }

    setTimeout(() => burst.remove(), 520);
  }

  function getBoxCollisionInfo(state){
    const boxTop = state.y - 32;
    const boxBottom = state.y + 42;
    const boxLeft = state.x - 46;
    const boxRight = state.x + 58;
    const boxCenterX = state.x;
    const boxCenterY = state.y + 5;

    return {
      boxTop,
      boxBottom,
      boxLeft,
      boxRight,
      boxCenterX,
      boxCenterY,
      bottomPoint:{x:boxCenterX, y:boxBottom},
      leftBottom:{x:boxLeft + 14, y:boxBottom},
      rightBottom:{x:boxRight - 14, y:boxBottom},
      leftPoint:{x:boxLeft, y:boxCenterY},
      rightPoint:{x:boxRight, y:boxCenterY}
    };
  }

  function rectContainsPoint(rect, point){
    return point.x >= rect.left &&
      point.x <= rect.right &&
      point.y >= rect.top &&
      point.y <= rect.bottom;
  }

  function rectsOverlap(a, b){
    return a.right > b.left &&
      a.left < b.right &&
      a.bottom > b.top &&
      a.top < b.bottom;
  }

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }

  function makeZone(type, rect, meta = {}){
    return {type, ...rect, ...meta};
  }

  function buildCollisionMap(){
    collisionMap.length = 0;

    // السكة والأرض: انفجار واختفاء إذا لم يدخل الصندوق في حوض العربة.
    collisionMap.push(makeZone("track", {
      left:-90,
      right:1380,
      top:602,
      bottom:642
    }, {name:"track"}));

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const well = {
        left:car.x + 44,
        right:car.x + car.width - 44,
        top:car.y + 30,
        bottom:car.y + car.height - 20
      };

      // الحوض الحقيقي: لا يلتقط الصندوق إلا إذا دخل بوضوح إلى الداخل.
      collisionMap.push(makeZone("wagon-well", well, {
        car,
        index,
        name:`wagon-well-${index}`
      }));

      // حافة العربة: ليست مغناطيسًا. تضرب الصندوق وتجعله ينزلق تدريجيًا.
      collisionMap.push(makeZone("wagon-rim", {
        left:car.x + 24,
        right:car.x + car.width - 24,
        top:car.y + 5,
        bottom:car.y + 34
      }, {car, index, name:`wagon-rim-${index}`}));

      // جوانب وجسم العربة كأجسام صلبة.
      collisionMap.push(makeZone("wagon-solid", {
        left:car.x + 2,
        right:car.x + 44,
        top:car.y + 24,
        bottom:car.y + car.height + 2
      }, {car, index, side:"left", name:`wagon-left-wall-${index}`}));

      collisionMap.push(makeZone("wagon-solid", {
        left:car.x + car.width - 44,
        right:car.x + car.width - 2,
        top:car.y + 24,
        bottom:car.y + car.height + 2
      }, {car, index, side:"right", name:`wagon-right-wall-${index}`}));

      collisionMap.push(makeZone("wagon-solid", {
        left:car.x + 34,
        right:car.x + car.width - 34,
        top:car.y + car.height - 24,
        bottom:car.y + car.height + 6
      }, {car, index, side:"bottom", name:`wagon-bottom-${index}`}));
    });

    // مناطق صلبة موسعة للقاطرة، خصوصًا المقدمة والقاعدة حتى لا يخترقها الصندوق.
    const locomotiveZones = [
      {name:"locomotive-cabin", left:770, right:910, top:424, bottom:600},
      {name:"locomotive-roof", left:785, right:895, top:400, bottom:465},
      {name:"locomotive-boiler", left:885, right:1088, top:448, bottom:592},
      {name:"locomotive-front-face", left:1062, right:1146, top:438, bottom:604},
      {name:"locomotive-nose", left:1116, right:1190, top:502, bottom:614},
      {name:"locomotive-plow", left:1084, right:1198, top:548, bottom:628},
      {name:"locomotive-base", left:772, right:1144, top:555, bottom:620},
      {name:"locomotive-big-wheel-solid", left:780, right:890, top:510, bottom:618},
      {name:"locomotive-small-wheels-solid", left:895, right:1080, top:548, bottom:618}
    ];

    locomotiveZones.forEach(zone => {
      collisionMap.push(makeZone("locomotive-solid", {
        left:zone.left,
        right:zone.right,
        top:zone.top,
        bottom:zone.bottom
      }, {name:zone.name}));
    });
  }

  function drawCollisionDebug(){
    if(!DEBUG_COLLISION || !collisionDebugLayer) return;
    collisionDebugLayer.innerHTML = "";

    const colors = {
      "track":"#ff7a00",
      "wagon-well":"#00c853",
      "wagon-rim":"#00b0ff",
      "wagon-solid":"#ff1744",
      "locomotive-solid":"#aa00ff"
    };

    collisionMap.forEach(zone => {
      el("rect", {
        x:zone.left,
        y:zone.top,
        width:zone.right - zone.left,
        height:zone.bottom - zone.top,
        fill:colors[zone.type] || "#fff",
        opacity:".16",
        stroke:colors[zone.type] || "#fff",
        "stroke-width":2
      }, collisionDebugLayer);
    });
  }

  function getBoxRect(state){
    const info = getBoxCollisionInfo(state);
    return {
      left:info.boxLeft,
      right:info.boxRight,
      top:info.boxTop,
      bottom:info.boxBottom
    };
  }

  function getCollisionAtState(state){
    const info = getBoxCollisionInfo(state);
    const boxRect = getBoxRect(state);

    // 1) الأجزاء الصلبة أولًا حتى لا يخترق الصندوق مقدمة القاطرة أو جوانب العربات.
    for(const zone of collisionMap){
      if((zone.type === "locomotive-solid" || zone.type === "wagon-solid") &&
        rectsOverlap(boxRect, zone) &&
        state.vy > 0){
        return {zone, info};
      }
    }

    // 2) الحافة: تصطدم ثم تنزلق، ولا يتم سحب الصندوق مباشرة للحوض.
    for(const zone of collisionMap){
      if(zone.type !== "wagon-rim") continue;
      const bottomHitsRim =
        info.boxBottom >= zone.top &&
        info.boxBottom <= zone.bottom + 16 &&
        rectsOverlap(boxRect, zone) &&
        state.vy > 0;

      if(bottomHitsRim){
        return {zone, info};
      }
    }

    // 3) الحوض: لا يلتقط إلا عندما يكون قاع الصندوق داخل الحوض فعليًا.
    for(const zone of collisionMap){
      if(zone.type !== "wagon-well") continue;

      const insideByBottom =
        rectContainsPoint(zone, info.bottomPoint) ||
        rectContainsPoint(zone, info.leftBottom) ||
        rectContainsPoint(zone, info.rightBottom);

      const deepEnough = info.boxBottom > zone.top + 18;

      if(insideByBottom && deepEnough && state.vy > 0){
        return {zone, info};
      }
    }

    // 4) السكة أخيرًا.
    for(const zone of collisionMap){
      if(zone.type === "track" && info.boxBottom >= zone.top && state.vy > 0){
        return {zone, info};
      }
    }

    return null;
  }

  function findWagonCatchTarget(state){
    const hit = getCollisionAtState(state);
    if(!hit || hit.zone.type !== "wagon-well") return null;
    return hit.zone.car || null;
  }

  function getTrainSolidHit(state){
    if(state.solidBounces >= 3) return null;
    const hit = getCollisionAtState(state);
    if(!hit) return null;

    if(hit.zone.type === "locomotive-solid" || hit.zone.type === "wagon-solid" || hit.zone.type === "wagon-rim"){
      return hit.zone;
    }

    return null;
  }

  function getTrackImpact(state){
    const hit = getCollisionAtState(state);
    return hit && hit.zone.type === "track" ? hit.zone : null;
  }

  function applySolidResponse(state, zone){
    state.solidBounces += 1;

    if(zone.type === "wagon-rim"){
      // ضربة الحافة: نزول أقل + انزلاق تدريجي للداخل، بدون سحب مغناطيسي.
      const center = zone.car ? zone.car.targetArea.centerX : state.x - 80;
      const desiredVx = clamp((center - state.x) * 1.15, -185, 105);
      state.vx = state.vx * .38 + desiredVx * .62;
      state.vy = Math.max(42, state.vy * .28);
      state.vr = state.vx < 0 ? -130 : 115;
      state.y = Math.min(state.y, zone.top - 39);
      state.rotation += state.vx < 0 ? -8 : 8;
      return;
    }

    if(zone.type === "locomotive-solid"){
      // القاطرة جسم صلب: دفع واضح للخلف/لليسار مثل الفيديو.
      state.vx = Math.min(state.vx, -245);
      state.vy = Math.max(48, state.vy * .22);
      state.vr = -175;
      state.rotation -= 12;
      state.y = Math.min(state.y, zone.top - 41);
      return;
    }

    // جسم العربة من الخارج: ارتداد خفيف ثم استمرار سقوطه.
    state.vx = zone.side === "right" ? Math.min(state.vx, -190) : Math.max(state.vx, 84);
    state.vy = Math.max(46, state.vy * .34);
    state.vr = zone.side === "right" ? -155 : 135;
    state.rotation += zone.side === "right" ? -8 : 8;
    state.y = Math.min(state.y, zone.top - 41);
  }

  function settleBoxIntoWagon(startState, car, textLines){
    const layer = settledObjectsLayer || fallingObjectsLayer || svg;
    const box = answerBox(layer, textLines);

    // لا نسحب الصندوق إلى منتصف العربة بسرعة.
    // نثبته قريبًا من نقطة دخوله حتى يبدو كأنه وقع داخل الحوض.
    const minX = car.x + 70;
    const maxX = car.x + car.width - 70;
    const projectedX = startState.x + startState.vx * .10;
    const targetX = clamp(projectedX, minX, maxX);
    const targetY = car.y + 26 + (Math.random() * 8 - 4);
    const targetRotation = clamp(startState.rotation * .45, -18, 18);

    const startX = startState.x;
    const startY = startState.y;
    const startRotation = startState.rotation;
    const startedAt = performance.now();
    const duration = 620;

    function easeOutBack(t){
      const c1 = 1.35;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function frame(now){
      const t = Math.min(1, (now - startedAt) / duration);
      const e = easeOutBack(t);

      // دخول ناعم للحوض، بدون قفزة أو سحب واضح.
      const x = startX + (targetX - startX) * e;
      const y = startY + (targetY - startY) * e + Math.sin(t * Math.PI) * 8;
      const r = startRotation + (targetRotation - startRotation) * e;

      box.setAttribute(
        "transform",
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`
      );

      if(t < 1){
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  }

  function spawnFallingAnswerBox(startX, startY, textLines){
    const layer = fallingObjectsLayer || svg;
    const box = answerBox(layer, textLines);

    const state = {
      x:startX,
      y:startY + 54,
      vx:-118,       // ميل لليسار بسبب حركة البالون/الرياح
      vy:22,         // يبدأ نزوله خفيفًا ثم تتسارع الجاذبية
      gravity:710,
      wind:-18,
      rotation:-8,
      vr:-54,
      solidBounces:0,
      lastTime:performance.now()
    };

    function draw(){
      box.setAttribute(
        "transform",
        `translate(${state.x.toFixed(2)} ${state.y.toFixed(2)}) rotate(${state.rotation.toFixed(2)})`
      );
    }

    function step(dt){
      state.vx += state.wind * dt;
      state.vy += state.gravity * dt;
      state.x += state.vx * dt;
      state.y += state.vy * dt;
      state.rotation += state.vr * dt;

      const catchTarget = findWagonCatchTarget(state);
      if(catchTarget){
        box.remove();
        settleBoxIntoWagon(state, catchTarget, textLines);
        return "settled";
      }

      const solidHit = getTrainSolidHit(state);
      if(solidHit){
        applySolidResponse(state, solidHit);
        return "continue";
      }

      if(getTrackImpact(state) || state.x < -180){
        box.remove();
        trackImpactBurst(fallingObjectsLayer || svg, state.x, Math.min(state.y + 42, 610));
        return "done";
      }

      return "continue";
    }

    function frame(now){
      let remaining = Math.min(0.045, (now - state.lastTime) / 1000);
      state.lastTime = now;

      // خطوات صغيرة داخل كل فريم لمنع اختراق مقدمة القاطرة أو حافة العربة.
      while(remaining > 0){
        const dt = Math.min(0.012, remaining);
        remaining -= dt;
        const result = step(dt);
        if(result === "settled" || result === "done"){
          return;
        }
      }

      draw();

      if(state.y < 700 && state.x > -190){
        requestAnimationFrame(frame);
      }else{
        box.remove();
      }
    }

    requestAnimationFrame(frame);
  }

  const BALLOON_SPEED_LEVEL = 2; // مؤقتًا: لاحقًا يرتبط بشريط السرعة من 1 إلى 10.

  const BALLOON_FLIGHT = {
    startX:1355,
    endX:-230,
    minY:112,
    maxY:292,
    baseY:178,
    scale:.92,
    speedLevel:BALLOON_SPEED_LEVEL
  };

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }

  function speedFromLevel(level){
    const safeLevel = clamp(Number(level) || 1, 1, 10);
    // سرعة بطيئة الآن، وقابلة للتوسيع لاحقًا من شريط السرعة.
    return 16 + safeLevel * 6;
  }

  function createBalloonMotionState(config){
    const now = performance.now();
    return {
      x:config.startX,
      y:config.baseY,
      startedAt:now,
      lastTime:now,
      phaseA:Math.random() * Math.PI * 2,
      phaseB:Math.random() * Math.PI * 2,
      phaseC:Math.random() * Math.PI * 2,
      drift:0,
      driftTarget:0,
      nextDriftAt:now + 900 + Math.random() * 1700
    };
  }

  function resetBalloonMotion(state, config, now){
    state.x = config.startX + Math.random() * 90;
    state.y = config.baseY + (Math.random() * 36 - 18);
    state.startedAt = now;
    state.lastTime = now;
    state.phaseA = Math.random() * Math.PI * 2;
    state.phaseB = Math.random() * Math.PI * 2;
    state.phaseC = Math.random() * Math.PI * 2;
    state.drift = 0;
    state.driftTarget = Math.random() * 32 - 16;
    state.nextDriftAt = now + 1200 + Math.random() * 2300;
  }

  function startBalloonFlight(balloon, config = BALLOON_FLIGHT){
    const state = createBalloonMotionState(config);
    const speed = speedFromLevel(config.speedLevel);
    let popped = false;
    let resetAt = 0;

    function popBalloon(now){
      if(popped) return;
      popped = true;
      resetAt = now + 1700;

      const currentScale = config.scale;
      balloon.setAttribute("opacity", "0");
      balloonBurst(fallingObjectsLayer || svg, state.x, state.y, currentScale);
      spawnFallingAnswerBox(state.x, state.y, ["ما أجمل", "الزهور!"]);
    }

    // البالون لا يفرقع تلقائيًا؛ اللاعب فقط هو الذي يفرقه بالضغط عليه.
    balloon.style.pointerEvents = "auto";
    balloon.style.cursor = "pointer";
    balloon.addEventListener("pointerdown", event => {
      event.preventDefault();
      popBalloon(performance.now());
    });

    function frame(now){
      const dt = Math.min(40, now - state.lastTime);
      state.lastTime = now;

      if(popped){
        if(now >= resetAt){
          resetBalloonMotion(state, config, now);
          balloon.setAttribute("opacity", "1");
          popped = false;
        }
        requestAnimationFrame(frame);
        return;
      }

      // تسارع وتهدئة خفيفان جدًا حتى لا تكون الحركة ميكانيكية.
      const speedPulse =
        0.94 +
        Math.sin(now * 0.0009 + state.phaseB) * 0.045 +
        Math.sin(now * 0.0017 + state.phaseC) * 0.025;

      state.x -= speed * speedPulse * (dt / 1000);

      // تغيّر عشوائي ناعم كل فترة، بدون قفزات مزعجة.
      if(now >= state.nextDriftAt){
        state.driftTarget = Math.random() * 52 - 26;
        state.nextDriftAt = now + 1200 + Math.random() * 2600;
      }
      state.drift += (state.driftTarget - state.drift) * 0.018;

      const wave =
        Math.sin(now * 0.00125 + state.phaseA) * 34 +
        Math.sin(now * 0.00235 + state.phaseB) * 13 +
        Math.sin(now * 0.00058 + state.phaseC) * 18;

      state.y = clamp(config.baseY + wave + state.drift, config.minY, config.maxY);

      balloon.setAttribute(
        "transform",
        `translate(${state.x.toFixed(2)} ${state.y.toFixed(2)}) scale(${config.scale})`
      );

      if(state.x < config.endX){
        resetBalloonMotion(state, config, now);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function balloonsLayer(){
    const balloons = el("g", {id:"balloonsLayer"});
    const balloon = answerBalloon(balloons, {
      x:BALLOON_FLIGHT.startX,
      y:BALLOON_FLIGHT.baseY,
      scale:BALLOON_FLIGHT.scale,
      lines:["ما أجمل", "الزهور!"]
    });

    startBalloonFlight(balloon, BALLOON_FLIGHT);
  }

  function background(){
    const bg = el("g", {id:"background"});

    el("rect", {x:0, y:0, width:1280, height:720, fill:"url(#sceneGrad)"}, bg);

    el("path", {
      d:"M-120 314 C-55 240 40 306 116 198 C185 101 246 210 318 116 C392 230 448 146 517 270 C582 150 642 212 716 100 C785 230 840 166 916 304 C990 190 1047 260 1120 150 C1190 250 1295 210 1400 270 L1400 426 L-120 426 Z",
      fill:"#7d86aa",
      opacity:".31"
    }, bg);

    el("path", {
      d:"M-120 360 C0 302 110 343 230 238 C352 150 403 302 492 228 C590 310 674 252 752 330 C834 242 926 304 1005 216 C1085 346 1185 260 1400 332 L1400 426 L-120 426 Z",
      fill:"#afa0ad",
      opacity:".44"
    }, bg);

    makeCloud(bg, 105, 126, .72);
    makeCloud(bg, 390, 95, .62);
    makeCloud(bg, 780, 112, .68);
    makeCloud(bg, 1075, 142, .58);
    makeCloud(bg, 1240, 96, .5);

    el("rect", {
      x:-20,
      y:402,
      width:1320,
      height:245,
      fill:"url(#sandGrad)",
      opacity:".58"
    }, bg);

    makeCactus(bg, 250, 444, .95);
    makeCactus(bg, 890, 436, 1.05);
    makeBush(bg, 760, 504, 1);

    const track = el("g", {id:"track"}, bg);
    const trackImage = el("image", {
      href:"train-track.webp?v=49",
      x:-55,
      y:604,
      width:1390,
      height:27,
      preserveAspectRatio:"none"
    }, track);
    trackImage.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-track.webp?v=49");
  }

  function addWheel(layer, cx, cy, size, version = 49){
    const wheel = el("image", {
      href:`train-wheel.webp?v=${version}`,
      x:cx - size / 2,
      y:cy - size / 2,
      width:size,
      height:size,
      preserveAspectRatio:"xMidYMid meet",
      class:"train-wheel"
    }, layer);
    wheel.setAttributeNS("http://www.w3.org/1999/xlink", "href", `train-wheel.webp?v=${version}`);
    return wheel;
  }

  // بيانات مؤقتة للتجربة فقط.
  // لاحقًا ستأتي هذه القائمة من إعدادات المعلم في صفحة الإنشاء.
  // عدد العناصر هنا هو الذي يحدد عدد عربات الإجابة تلقائيًا:
  // عنصران = عربتان، ثلاثة = ثلاث عربات، أربعة = أربع عربات.
  const TRAIN_ANSWER_TEXTS = ["استفهام", "تعجب", "نقطة"];

  function buildAnswerCars(answerTexts){
    return answerTexts
      .map(text => String(text || "").trim())
      .filter(Boolean)
      .slice(0, 4)
      .map(text => ({type:"answer", text}));
  }

  const TRAIN_CARS = buildAnswerCars(TRAIN_ANSWER_TEXTS);

  const TRAIN_LAYOUT = {
    nearestWagonX:490,
    wagonY:486,
    wagonW:300,
    wagonH:111,
    wagonStep:288
  };

  const trainCarRegistry = [];

  function answerWagon(train, car, index){
    // قالب عربة الإجابة:
    // نفس العربة المعتمدة سابقًا، لكن صارت قابلة للتكرار حسب عدد الإجابات.
    const wagonX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    const wagonY = TRAIN_LAYOUT.wagonY;
    const wagonW = TRAIN_LAYOUT.wagonW;
    const wagonH = TRAIN_LAYOUT.wagonH;

    const targetArea = {
      // منطقة الاستهداف الداخلية للعربة.
      // هذه البيانات لا تظهر بصريًا، وستستخدم لاحقًا لمعرفة سقوط الصندوق/البالون داخل العربة.
      left:wagonX + 14,
      right:wagonX + wagonW - 14,
      top:wagonY + 16,
      bottom:wagonY + wagonH - 16,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2
    };

    trainCarRegistry[index] = {
      type:car.type,
      text:car.text,
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      left:wagonX,
      right:wagonX + wagonW,
      top:wagonY,
      bottom:wagonY + wagonH,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2,
      targetArea
    };

    const wheelLayer = el("g", {id:`wagonWheelLayer-${index}`}, train);
    // عجلات عربات الإجابة بنفس حجم وارتفاع العجلات الثلاث الصغيرة في القاطرة.
    // جسم العربة يُرسم بعدها، لذلك يبقى الجزء العلوي من العجلة مخفيًا خلف العربة.
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = wagonX + 49;
    const gap = 66;
    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`wagonBodyLayer-${index}`}, train);
    const wagonBody = el("image", {
      href:"train-wagon.webp?v=49",
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      preserveAspectRatio:"xMidYMid meet",
      id:`wagonBody-${index}`
    }, bodyLayer);
    wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=49");

    el("text", {
      x:wagonX + wagonW / 2,
      y:wagonY + wagonH * .56,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffe28a",
      stroke:"#5b2618",
      "stroke-width":2.6,
      "paint-order":"stroke fill",
      "font-size":30,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, bodyLayer).textContent = car.text;
  }

  function wagons(train){
    // نرسم العربات من الخلف إلى الأمام حتى تكون العربة الأقرب للقاطرة فوق الوصلات بصريًا.
    for(let i = TRAIN_CARS.length - 1; i >= 0; i--){
      const car = TRAIN_CARS[i];
      if(car.type === "answer") answerWagon(train, car, i);
    }
  }

  function renderWagonForegroundCovers(){
    if(!wagonForegroundCoverLayer) return;

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const wagonBody = el("image", {
        href:"train-wagon.webp?v=49",
        x:car.x,
        y:car.y,
        width:car.width,
        height:car.height,
        preserveAspectRatio:"xMidYMid meet",
        id:`wagonCoverBody-${index}`
      }, wagonForegroundCoverLayer);
      wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=49");

      el("text", {
        x:car.centerX,
        y:car.y + car.height * .56,
        "text-anchor":"middle",
        "dominant-baseline":"middle",
        fill:"#ffe28a",
        stroke:"#5b2618",
        "stroke-width":2.6,
        "paint-order":"stroke fill",
        "font-size":30,
        "font-weight":900,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"rtl"
      }, wagonForegroundCoverLayer).textContent = car.text;
    });
  }

  function getAnswerTargetArea(index){
    const car = trainCarRegistry[index];
    return car ? car.targetArea : null;
  }

  function locomotive(train){
    // إصدار 49:
    // زيادة المسافة بين العربة والقاطرة، إرجاع العجلات الثلاث للخلف،
    // تكبيرها 10%، وتقديم العجلة الكبيرة للأمام مع رفعها قليلًا.
    const locoX = 782;
    const locoY = 430;
    const locoW = 320;
    const locoH = 179;

    const bodyLayer = el("g", {id:"locomotiveBodyLayer"}, train);
    const locomotiveBody = el("image", {
      href:"train-engine-transparent.png?v=49",
      x:locoX,
      y:locoY,
      width:locoW,
      height:locoH,
      preserveAspectRatio:"xMidYMid meet",
      id:"locomotiveBody"
    }, bodyLayer);
    locomotiveBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-engine-transparent.png?v=49");

    const wheelLayer = el("g", {id:"locomotiveWheelLayer"}, train);

    // العجلة الكبيرة: تقديم للأمام بحوالي 3% ورفع للأعلى بحوالي 2%.
    const largeWheelSize = 90.2;
    const largeWheelCx = locoX + 64;
    const largeWheelCy = 565;
    addWheel(wheelLayer, largeWheelCx, largeWheelCy, largeWheelSize, 39);

    // العجلات الثلاث الصغيرة: إرجاع للخلف داخل القاطرة وتكبير 10% تقريبًا.
    const smallWheelSize = 47.4;
    const smallWheelCy = 585.3;
    const smallStartX = locoX + 148;
    const smallGap = 50;
    addWheel(wheelLayer, smallStartX, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap * 2, smallWheelCy, smallWheelSize, 39);
  }

  function build(){
    clear();
    defs();
    background();
    balloonsLayer();

    // المجموعة الخارجية مخصصة لاحقًا لحركة تقدم القطار بين العربات.
    const trainPositionGroup = el("g", {id:"trainPositionGroup"});

    // المجموعة الداخلية مخصصة للحركة الخفيفة المستمرة فقط.
    const train = el("g", {id:"trainScene", class:"train-idle-motion"}, trainPositionGroup);

    wagons(train);
    locomotive(train);

    // طبقة الصناديق التي استقرت داخل أحواض العربات.
    // تأتي فوق القطار الأصلي، ثم تغطيها واجهة العربة لتظهر كأنها داخل الحوض.
    settledObjectsLayer = el("g", {id:"settledObjectsLayer"});
    wagonForegroundCoverLayer = el("g", {id:"wagonForegroundCoverLayer"});
    renderWagonForegroundCovers();

    // خريطة تصادم غير مرئية للقطار: أحواض، حواف، جسم القاطرة، السكة.
    buildCollisionMap();
    collisionDebugLayer = el("g", {id:"collisionDebugLayer"});
    drawCollisionDebug();

    // طبقة الصناديق أثناء السقوط، تبقى فوق واجهة العربة إلى لحظة الدخول للحوض.
    fallingObjectsLayer = el("g", {id:"fallingObjectsLayer"});
  }

  build();
})();
</script>
