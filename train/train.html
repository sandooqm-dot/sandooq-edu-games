<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 13</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bbc8e8;
      --sky-mid:#dce4f5;
      --sand-light:#e9cf9a;
      --sand:#d29a5a;
      --sand-dark:#a9733b;
      --rail:#3f2717;
      --wood:#6a3f20;
      --gold:#f0c85b;
      --gold2:#fff0a6;
      --ink:#201a22;
      --red:#b5322b;
      --blue:#3d5390;
      --purple:#7f4b85;
      --green:#476f38;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:#d9ecff;color:#fff}
    body{min-height:calc(100dvh + 140px);overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;-webkit-text-size-adjust:100%}
    body::after{content:"";display:block;height:140px;pointer-events:none}
    .train-page{
      position:sticky;top:0;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;direction:ltr;user-select:none;touch-action:none;
      background:
        radial-gradient(circle at 18% 18%,rgba(255,255,255,.35) 0 9%,transparent 22%),
        radial-gradient(circle at 80% 10%,rgba(255,255,255,.25) 0 7%,transparent 18%),
        linear-gradient(180deg,var(--sky-top) 0%, var(--sky-mid) 46%, #efdfbd 47%, var(--sand-light) 55%, var(--sand) 100%);
    }
    .hud{
      position:absolute;z-index:80;top:calc(9px + var(--safe-top));left:clamp(8px,2.4vw,22px);right:clamp(8px,2.4vw,22px);
      display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;
    }
    .pill{
      background:rgba(72,79,128,.82);border:1px solid rgba(255,255,255,.35);border-radius:16px;
      box-shadow:0 7px 18px rgba(31,35,83,.15), inset 0 1px 0 rgba(255,255,255,.2);padding:9px 15px;color:#fff;
      font-size:clamp(14px,2.5vw,26px);font-weight:900;line-height:1;white-space:nowrap;backdrop-filter:blur(6px)
    }
    .score{direction:ltr;min-width:72px;text-align:center}.timer{min-width:80px;text-align:center}
    .stage{position:absolute;inset:0;width:100%;height:100%;z-index:10;display:block;overflow:visible;touch-action:none;cursor:default}
    .hit{cursor:pointer;pointer-events:auto}
    .label-text{font-weight:950;font-size:33px;fill:#ffdc64;paint-order:stroke;stroke:#5f2117;stroke-width:5px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext;font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,Arial,sans-serif}
    .small-label{font-weight:900;font-size:20px;fill:#fff8d2;paint-order:stroke;stroke:#421d12;stroke-width:4px;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext}
    .balloon-text{font-weight:950;font-size:31px;fill:#1b1d30;paint-order:stroke;stroke:#fff;stroke-width:3px;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext}
    .crate-text{font-weight:950;font-size:19px;fill:#fff2b4;paint-order:stroke;stroke:#442415;stroke-width:3px;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext}
    .pop-text{font-weight:1000;font-size:43px;fill:#c7272e;paint-order:stroke;stroke:#fff2a8;stroke-width:8px;text-anchor:middle;dominant-baseline:middle;letter-spacing:1px}
    .score-pop{font-weight:1000;font-size:38px;fill:#f5d85d;paint-order:stroke;stroke:#7a2818;stroke-width:5px;text-anchor:middle;dominant-baseline:middle}
    .wheel-spin{animation:wheelSpin .72s linear infinite;transform-box:fill-box;transform-origin:center;will-change:transform}@keyframes wheelSpin{to{transform:rotate(360deg)}}
    .bob{animation:trainBob .8s ease-in-out infinite}@keyframes trainBob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
    .pulse{animation:pulse .8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.86;transform:scale(1.025)}}
    @media (orientation:portrait){.pill{font-size:16px;padding:8px 12px}.score{min-width:62px}.timer{min-width:70px}}
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <div class="hud">
      <div class="pill score" id="score">0 ✓</div>
      <div class="pill title">قطار الإجابات</div>
      <div class="pill timer" id="timer">0:57</div>
    </div>
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="لعبة قطار الإجابات"></svg>
  </main>
<script>
(() => {
  const svg = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const NS = 'http://www.w3.org/2000/svg';
  const W = 1280, H = 720;
  const state = {
    score: 0,
    timeLeft: 57,
    balloons: [],
    crates: [],
    locked: false,
    trackOffset: 0,
    cloudOffset: 0,
    cactusOffset: 0,
    trainShake: 0,
    last: performance.now()
  };

  const categories = ['استفهام', 'تعجب', 'أمر'];
  const bank = [
    {text:'ما أعظم القطار!', answer:'تعجب'},
    {text:'ما هذا؟', answer:'استفهام'},
    {text:'اكتب الدرس', answer:'أمر'},
    {text:'أين الحقيبة؟', answer:'استفهام'},
    {text:'أكمل السؤال', answer:'أمر'},
    {text:'يا له من قطار!', answer:'تعجب'},
    {text:'لماذا نقرأ؟', answer:'استفهام'},
    {text:'رتّب الكلمات', answer:'أمر'},
    {text:'ما أجمل المطر!', answer:'تعجب'}
  ];

  const zones = [
    {label:'استفهام', x:118, y:455, w:240, h:116, fill:'#b93733', spots:[]},
    {label:'تعجب', x:390, y:455, w:240, h:116, fill:'#394c8d', spots:[]},
    {label:'أمر', x:662, y:455, w:240, h:116, fill:'#814a83', spots:[]}
  ];

  function el(name, attrs = {}, parent = svg){
    const n = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k,v]) => n.setAttribute(k, v));
    parent.appendChild(n); return n;
  }
  function setAttrs(n, attrs){Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
  function clear(){svg.innerHTML=''}

  function defs(){
    const d = el('defs');
    const lin = (id, stops, attrs={}) => {
      const g = el('linearGradient', Object.assign({id, x1:'0', y1:'0', x2:'0', y2:'1'}, attrs), d);
      stops.forEach(s => el('stop', s, g)); return g;
    };
    const rad = (id, stops, attrs={}) => {
      const g = el('radialGradient', Object.assign({id, cx:'35%', cy:'25%', r:'70%'}, attrs), d);
      stops.forEach(s => el('stop', s, g)); return g;
    };
    lin('skyMist', [{offset:'0%', 'stop-color':'#f6f7ff'}, {offset:'100%', 'stop-color':'#b9c4df'}]);
    lin('sandGrad', [{offset:'0%', 'stop-color':'#e8c58b'}, {offset:'100%', 'stop-color':'#b57a3c'}]);
    lin('redBody', [{offset:'0%', 'stop-color':'#f1684e'}, {offset:'52%', 'stop-color':'#bd302a'}, {offset:'100%', 'stop-color':'#6f1716'}]);
    lin('blueBody', [{offset:'0%', 'stop-color':'#5b70b0'}, {offset:'55%', 'stop-color':'#344a8f'}, {offset:'100%', 'stop-color':'#20285c'}]);
    lin('purpleBody', [{offset:'0%', 'stop-color':'#ac6cad'}, {offset:'55%', 'stop-color':'#7e4987'}, {offset:'100%', 'stop-color':'#4b2855'}]);
    lin('goldH', [{offset:'0%', 'stop-color':'#fff3a5'}, {offset:'25%', 'stop-color':'#e6bb4f'}, {offset:'70%', 'stop-color':'#9e6922'}, {offset:'100%', 'stop-color':'#fff0a0'}], {x1:'0',y1:'0',x2:'1',y2:'0'});
    lin('darkMetal', [{offset:'0%', 'stop-color':'#3f342b'}, {offset:'100%', 'stop-color':'#120f0c'}]);
    lin('woodBox', [{offset:'0%', 'stop-color':'#9b6332'}, {offset:'52%', 'stop-color':'#75421f'}, {offset:'100%', 'stop-color':'#4c2915'}]);
    lin('woodLight', [{offset:'0%', 'stop-color':'#dca462'}, {offset:'100%', 'stop-color':'#7b441e'}], {x1:'0',y1:'0',x2:'1',y2:'1'});
    lin('glass', [{offset:'0%', 'stop-color':'#c8f1ff'}, {offset:'100%', 'stop-color':'#367a8c'}]);
    rad('wheelGold', [{offset:'0%', 'stop-color':'#fff2b3'}, {offset:'43%', 'stop-color':'#d8a24e'}, {offset:'72%', 'stop-color':'#805018'}, {offset:'100%', 'stop-color':'#eac76b'}]);
    rad('balloonGrad', [{offset:'0%', 'stop-color':'#f1f5ff'}, {offset:'58%', 'stop-color':'#c2c9da'}, {offset:'100%', 'stop-color':'#79849a'}]);
    const shadow = el('filter', {id:'softShadow', x:'-25%', y:'-25%', width:'150%', height:'150%'}, d);
    el('feDropShadow', {dx:'0', dy:'6', stdDeviation:'4', 'flood-color':'#000', 'flood-opacity':'.25'}, shadow);
    const glow = el('filter', {id:'softGlow', x:'-40%', y:'-40%', width:'180%', height:'180%'}, d);
    el('feDropShadow', {dx:'0', dy:'0', stdDeviation:'5', 'flood-color':'#fff3a0', 'flood-opacity':'.65'}, glow);
    zones.forEach((z,i)=>{
      const cp = el('clipPath', {id:'binClip'+i}, d);
      el('rect', {x:z.x+24, y:z.y+30, width:z.w-48, height:z.h-48, rx:10, ry:10}, cp);
    });
  }

  function background(){
    const bg = el('g', {id:'background'});
    // distant mountains like the reference video
    el('path',{d:'M0 315 C55 245 110 305 165 195 C220 90 270 210 320 115 C370 225 435 145 500 265 C570 145 630 215 705 100 C770 230 825 170 900 305 C975 190 1040 260 1110 145 C1180 250 1238 210 1280 270 L1280 420 L0 420 Z',fill:'#7c83a4',opacity:.32},bg);
    el('path',{d:'M0 360 C95 300 170 345 260 235 C355 150 400 300 490 228 C585 310 675 252 750 330 C830 240 925 305 1005 215 C1085 345 1160 260 1280 330 L1280 420 L0 420 Z',fill:'#afa0af',opacity:.43},bg);
    el('rect',{x:0,y:402,width:1280,height:180,fill:'url(#sandGrad)',opacity:.56},bg);
    // moving dust/clouds/cacti are rebuilt each frame through transforms.
    const clouds = el('g',{id:'clouds',opacity:.78},bg);
    for(let i=0;i<7;i++) makeCloud(clouds, 80+i*220, 132+(i%3)*42, .72+(i%2)*.22);
    const props = el('g',{id:'props'},bg);
    makeSign(props, 170, 430, 'المستوى 1');
    makeCactus(props, 380, 470, .9);
    makeCactus(props, 960, 462, 1.05);
    makeBush(props, 720, 500, 1);
    makeBush(props, 1160, 510, .8);
    const track = el('g',{id:'track'},bg);
    el('rect',{x:0,y:618,width:1280,height:10,rx:5,fill:'#4b2f1c'},track);
    el('rect',{x:0,y:646,width:1280,height:10,rx:5,fill:'#4b2f1c'},track);
    const sleepers = el('g',{id:'sleepers'},track);
    for(let i=-80;i<1400;i+=58){
      el('rect',{x:i,y:624,width:33,height:32,rx:3,fill:'#9b6b3d',transform:'rotate(-10 '+(i+16)+' 640)',opacity:.88},sleepers);
    }
  }

  function makeCloud(parent,x,y,s){
    const g=el('g',{class:'cloud',transform:`translate(${x} ${y}) scale(${s})`},parent);
    [[0,0,20],[22,-6,30],[52,-2,24],[76,6,18],[24,16,25],[58,15,22]].forEach(([cx,cy,r])=>el('circle',{cx,cy,r,fill:'#eef3fa',stroke:'#b2bdcd','stroke-width':2,opacity:.85},g));
  }
  function makeCactus(parent,x,y,s){
    const g=el('g',{class:'prop',transform:`translate(${x} ${y}) scale(${s})`},parent);
    el('rect',{x:-10,y:-70,width:20,height:80,rx:10,fill:'#4c8b53',stroke:'#39703f','stroke-width':3},g);
    el('path',{d:'M-9 -44 C-45 -52 -43 -6 -20 -7',fill:'none',stroke:'#4c8b53','stroke-width':16,'stroke-linecap':'round'},g);
    el('path',{d:'M8 -54 C45 -64 47 -20 20 -19',fill:'none',stroke:'#4c8b53','stroke-width':15,'stroke-linecap':'round'},g);
    el('ellipse',{cx:0,cy:12,rx:30,ry:6,fill:'rgba(66,39,16,.22)'},g);
  }
  function makeBush(parent,x,y,s){
    const g=el('g',{class:'prop',transform:`translate(${x} ${y}) scale(${s})`},parent);
    [[-22,0,20],[0,-8,28],[26,0,19],[10,9,16]].forEach(([cx,cy,r])=>el('circle',{cx,cy,r,fill:'#8faa52',opacity:.9},g));
  }
  function makeSign(parent,x,y,text){
    const g=el('g',{class:'prop',transform:`translate(${x} ${y})`},parent);
    el('rect',{x:-8,y:26,width:16,height:62,rx:3,fill:'#6d4525'},g);
    el('rect',{x:-60,y:-15,width:120,height:54,rx:5,fill:'#7b502d',stroke:'#4a2d18','stroke-width':4},g);
    el('text',{x:0,y:11,class:'small-label',style:'font-size:18px;stroke-width:3px'},g).textContent=text;
  }

  function ornateWheel(parent,cx,cy,r){
    const out=el('g',{transform:`translate(${cx} ${cy})`,filter:'url(#softShadow)'},parent);
    const g=el('g',{class:'wheel-spin'},out);
    el('circle',{cx:0,cy:0,r,fill:'url(#wheelGold)',stroke:'#4f2c13','stroke-width':Math.max(2,r*.08)},g);
    for(let i=0;i<14;i++){
      const a=Math.PI*2*i/14;
      el('line',{x1:Math.cos(a)*r*.24,y1:Math.sin(a)*r*.24,x2:Math.cos(a)*r*.78,y2:Math.sin(a)*r*.78,stroke:'#714616','stroke-width':Math.max(2,r*.08),'stroke-linecap':'round'},g);
      el('line',{x1:Math.cos(a+.03)*r*.28,y1:Math.sin(a+.03)*r*.28,x2:Math.cos(a+.03)*r*.69,y2:Math.sin(a+.03)*r*.69,stroke:'#ffe28a','stroke-width':Math.max(1,r*.035),'stroke-linecap':'round',opacity:.75},g);
    }
    el('circle',{cx:0,cy:0,r:r*.28,fill:'#b72825',stroke:'#4f2c13','stroke-width':Math.max(2,r*.06)},g);
    el('circle',{cx:0,cy:0,r:r*.1,fill:'#18130f'},g);
  }

  function drawTrain(){
    const train = el('g',{id:'train',class:'bob',filter:'url(#softShadow)'});
    const parked = el('g',{id:'parkedCrates'},train);
    // answer cars
    zones.forEach((z,i)=>drawAnswerCar(train, z, i));
    // passenger car
    drawPassenger(train, 930, 454);
    // coal car and locomotive to the right, like the video
    drawCoal(train, 1100, 490);
    drawLoco(train, 1168, 424);
    // couplers
    [374,646,918,1076,1148].forEach(x=>{
      el('rect',{x,y:558,width:28,height:9,rx:4,fill:'#1d1713',stroke:'url(#goldH)','stroke-width':2},train);
    });
    return {train, parked};
  }

  function drawAnswerCar(parent,z,i){
    const fill = i===0 ? 'url(#redBody)' : i===1 ? 'url(#blueBody)' : 'url(#purpleBody)';
    // wheels behind body
    ornateWheel(parent,z.x+55,590,18); ornateWheel(parent,z.x+100,590,18); ornateWheel(parent,z.x+173,590,18); ornateWheel(parent,z.x+218,590,18);
    el('rect',{x:z.x+10,y:570,width:z.w+6,height:18,rx:5,fill:'url(#goldH)',stroke:'#684016','stroke-width':2},parent);
    // open cargo box with visible inner floor and side lips
    el('path',{d:`M${z.x} ${z.y+12} L${z.x+z.w} ${z.y+12} L${z.x+z.w-20} ${z.y+z.h} L${z.x+20} ${z.y+z.h} Z`,fill,stroke:'url(#goldH)','stroke-width':5,'stroke-linejoin':'round'},parent);
    el('rect',{x:z.x+22,y:z.y+34,width:z.w-44,height:z.h-48,rx:8,fill:'rgba(28,12,10,.18)',stroke:'rgba(255,255,255,.18)','stroke-width':2},parent);
    // front/rear inner walls to make the crate visually trapped inside
    el('rect',{x:z.x+14,y:z.y+28,width:13,height:z.h-35,rx:5,fill:'rgba(41,16,14,.34)'},parent);
    el('rect',{x:z.x+z.w-28,y:z.y+28,width:13,height:z.h-35,rx:5,fill:'rgba(41,16,14,.34)'},parent);
    el('line',{x1:z.x+15,y1:z.y+25,x2:z.x+z.w-15,y2:z.y+25,stroke:'url(#goldH)','stroke-width':9,'stroke-linecap':'round'},parent);
    el('line',{x1:z.x+28,y1:z.y+z.h-15,x2:z.x+z.w-28,y2:z.y+z.h-15,stroke:'url(#goldH)','stroke-width':7,'stroke-linecap':'round'},parent);
    el('text',{x:z.x+z.w/2,y:z.y+z.h-37,class:'label-text'},parent).textContent=z.label;
  }

  function drawPassenger(parent,x,y){
    ornateWheel(parent,x+40,590,15); ornateWheel(parent,x+84,590,15); ornateWheel(parent,x+172,590,15); ornateWheel(parent,x+214,590,15);
    el('rect',{x:x+6,y:570,width:250,height:16,rx:5,fill:'url(#goldH)',stroke:'#684016','stroke-width':2},parent);
    el('rect',{x:x+18,y:y,width:226,height:95,rx:8,fill:'url(#blueBody)',stroke:'url(#goldH)','stroke-width':5},parent);
    el('line',{x1:x+20,y1:y-7,x2:x+244,y2:y-7,stroke:'url(#goldH)','stroke-width':13,'stroke-linecap':'round'},parent);
    for(let i=0;i<5;i++){
      const wx=x+36+i*38;
      el('rect',{x:wx,y:y+18,width:28,height:39,rx:7,fill:'url(#glass)',stroke:'#7c511f','stroke-width':3},parent);
    }
    el('path',{d:`M${x+70} ${y+76} C${x+112} ${y+96} ${x+150} ${y+96} ${x+190} ${y+76}`,fill:'none',stroke:'url(#goldH)','stroke-width':5,'stroke-linecap':'round'},parent);
  }
  function drawCoal(parent,x,y){
    ornateWheel(parent,x+35,590,15); ornateWheel(parent,x+88,590,15);
    el('rect',{x:x+2,y:570,width:130,height:16,rx:5,fill:'url(#goldH)',stroke:'#684016','stroke-width':2},parent);
    el('rect',{x:x+12,y:y+42,width:110,height:68,rx:6,fill:'#8d2f28',stroke:'url(#goldH)','stroke-width':5},parent);
    for(let i=0;i<20;i++){
      const cx=x+22+(i%10)*10.5, cy=y+35-Math.floor(i/10)*9-(i%2)*4;
      el('circle',{cx,cy,r:9,fill:'#171411'},parent);
    }
  }
  function drawLoco(parent,x,y){
    ornateWheel(parent,x+72,575,42); ornateWheel(parent,x+177,586,26); ornateWheel(parent,x+250,586,26);
    el('path',{d:`M${x+14} 555 L${x+318} 555 L${x+318} 576 L${x+14} 576 Z`,fill:'url(#goldH)',stroke:'#6d4214','stroke-width':3},parent);
    el('rect',{x:x+22,y:y+64,width:94,height:124,rx:7,fill:'url(#redBody)',stroke:'url(#goldH)','stroke-width':6},parent);
    el('rect',{x:x+36,y:y+14,width:66,height:55,rx:5,fill:'#b52225',stroke:'url(#goldH)','stroke-width':5},parent);
    el('text',{x:x+69,y:y+43,fill:'#ffdf6b','font-size':41,'font-weight':950,'text-anchor':'middle','dominant-baseline':'middle'},parent).textContent='1';
    el('path',{d:`M${x+16} ${y+12} L${x+115} ${y+12} L${x+129} ${y+27} L${x+5} ${y+27} Z`,fill:'url(#darkMetal)',stroke:'url(#goldH)','stroke-width':3},parent);
    el('path',{d:`M${x+108} ${y+94} L${x+296} ${y+94} Q${x+312} ${y+94} ${x+312} ${y+112} L${x+312} ${y+160} Q${x+312} ${y+178} ${x+296} ${y+178} L${x+108} ${y+178} Z`,fill:'url(#redBody)',stroke:'url(#goldH)','stroke-width':5},parent);
    el('line',{x1:x+122,y1:y+129,x2:x+292,y2:y+129,stroke:'url(#goldH)','stroke-width':5,'stroke-linecap':'round'},parent);
    el('path',{d:`M${x+292} ${y+82} C${x+325} ${y+92} ${x+325} ${y+186} ${x+292} ${y+192} C${x+270} ${y+166} ${x+270} ${y+108} ${x+292} ${y+82}Z`,fill:'url(#darkMetal)',stroke:'#2a1b14','stroke-width':3},parent);
    el('path',{d:`M${x+160} ${y+78} C${x+166} ${y+55} ${x+214} ${y+55} ${x+220} ${y+78} Z`,fill:'url(#darkMetal)',stroke:'url(#goldH)','stroke-width':4},parent);
    el('rect',{x:x+246,y:y+26,width:34,height:70,rx:5,fill:'url(#darkMetal)',stroke:'url(#goldH)','stroke-width':4},parent);
    el('ellipse',{cx:x+263,cy:y+25,rx:24,ry:9,fill:'url(#darkMetal)',stroke:'url(#goldH)','stroke-width':4},parent);
    el('path',{d:`M${x+308} ${y+174} L${x+366} 575 L${x+315} 575 Z`,fill:'url(#goldH)',stroke:'#6d4214','stroke-width':3,'stroke-linejoin':'round'},parent);
  }

  function makeBlimp(item){
    const g = el('g',{class:'hit blimp pulse',transform:`translate(${item.x} ${item.y}) scale(${item.scale})`},layers.balloonLayer);
    el('ellipse',{cx:0,cy:0,rx:96,ry:40,fill:'url(#balloonGrad)',stroke:'#657084','stroke-width':3},g);
    el('ellipse',{cx:-28,cy:-14,rx:56,ry:16,fill:'#fff',opacity:.42},g);
    el('path',{d:'M -96 -1 C -125 -19 -126 19 -96 1 M96 0 L128 -24 L120 0 L128 24 Z',fill:'#8b96ad',stroke:'#657084','stroke-width':2.5},g);
    el('rect',{x:-34,y:38,width:68,height:18,rx:4,fill:'#6f6871',stroke:'#49434c','stroke-width':2.5},g);
    el('line',{x1:-52,y1:23,x2:-24,y2:40,stroke:'#77717a','stroke-width':3},g);
    el('line',{x1:52,y1:23,x2:24,y2:40,stroke:'#77717a','stroke-width':3},g);
    const t=el('text',{x:0,y:1,class:'balloon-text'},g); t.textContent=item.text;
    item.node=g;
    g.addEventListener('pointerdown', e=>{e.preventDefault(); popBalloon(item)}, {passive:false});
    state.balloons.push(item);
  }

  function createCrateGroup(parent, text, scale=1){
    const g=el('g',{class:'crate',transform:`scale(${scale})`},parent);
    el('rect',{x:-43,y:-34,width:86,height:68,rx:5,fill:'url(#woodBox)',stroke:'#3b2111','stroke-width':4},g);
    el('rect',{x:-36,y:-27,width:72,height:54,rx:3,fill:'#8f5328',stroke:'#5c3117','stroke-width':2},g);
    [-13,8].forEach(yy=>el('line',{x1:-36,y1:yy,x2:36,y2:yy,stroke:'#4f2b16','stroke-width':3,opacity:.72},g));
    [-16,16].forEach(xx=>el('line',{x1:xx,y1:-27,x2:xx,y2:27,stroke:'#4f2b16','stroke-width':3,opacity:.72},g));
    el('path',{d:'M -37 -27 L37 27 M37 -27 L-37 27',stroke:'url(#woodLight)','stroke-width':5,opacity:.62},g);
    el('text',{x:0,y:2,class:'crate-text'},g).textContent=text;
    return g;
  }

  function popBalloon(item){
    if(state.locked || item.popped || !item.node) return;
    item.popped = true;
    const x = item.x;
    const y = item.currentY || item.y;
    popEffect(x,y);
    item.node.remove(); item.node=null;
    const g = createCrateGroup(layers.physicsLayer, item.text, 1);
    const crate = {node:g,item,x,y:y+52,vx:item.vx*0.25 - 18,vy:180,rot:-8,vr:(Math.random()>.5?1:-1)*(320+Math.random()*190),halfW:43,halfH:34,landed:false,bounces:0,wrong:false};
    state.crates.push(crate);
    setAttrs(g,{transform:`translate(${crate.x} ${crate.y}) rotate(${crate.rot})`});
  }

  function popEffect(x,y){
    const g=el('g',{transform:`translate(${x} ${y})`,filter:'url(#softGlow)'},layers.fxLayer);
    el('text',{x:0,y:-8,class:'pop-text'},g).textContent='POP';
    for(let i=0;i<16;i++){
      const a=Math.PI*2*i/16;
      el('line',{x1:Math.cos(a)*32,y1:Math.sin(a)*22,x2:Math.cos(a)*64,y2:Math.sin(a)*45,stroke:i%2?'#fff3a0':'#d5322d','stroke-width':5,'stroke-linecap':'round'},g);
    }
    smoke(x-30,y+8,.8); smoke(x+34,y-14,.62);
    animateLife(g, .62, (life)=>`translate(${x} ${y-life*30}) scale(${1+life*.35})`);
  }
  function smoke(x,y,s=1){
    const g=el('g',{transform:`translate(${x} ${y}) scale(${s})`,opacity:.9},layers.fxLayer);
    [[-18,0,15],[-4,-8,20],[15,-2,17],[30,5,13],[5,11,15]].forEach(([cx,cy,r])=>el('circle',{cx,cy,r,fill:'#b7c3c9',stroke:'#899aa4','stroke-width':2,opacity:.86},g));
    animateLife(g,1.15, life=>`translate(${x} ${y-life*32}) scale(${s*(1+life*.34)})`, .9);
  }
  function scoreBurst(x,y,txt){
    const g=el('g',{transform:`translate(${x} ${y})`},layers.fxLayer);
    el('text',{x:0,y:0,class:'score-pop'},g).textContent=txt;
    animateLife(g,1.05, life=>`translate(${x} ${y-life*60}) scale(${1+life*.12})`);
  }
  function animateLife(node,dur,transformFn,startOpacity=1){
    const t0=performance.now();
    function step(now){
      const life=Math.min(1,(now-t0)/(dur*1000));
      node.setAttribute('opacity', Math.max(0,startOpacity*(1-life)));
      node.setAttribute('transform', transformFn(life));
      if(life>=1) node.remove(); else requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function chooseSpot(z){
    const index = z.spots.length;
    const cols = 3;
    const col = index % cols;
    const row = Math.floor(index / cols);
    const x = z.x + 62 + col*58;
    const y = z.y + 68 - row*9;
    z.spots.push({x,y});
    return {x,y,rot: [-9,7,-4,10,-7,5][index%6]};
  }
  function settleCrate(crate,z,good){
    crate.landed=true;
    const spot = chooseSpot(z);
    // Recreate inside parked layer and clip it visually inside the wagon.
    const clipIndex = zones.indexOf(z);
    const wrap = el('g',{'clip-path':`url(#binClip${clipIndex})`},layers.parkedLayer);
    const parked = createCrateGroup(wrap, crate.item.text, .62);
    setAttrs(parked,{transform:`translate(${spot.x} ${spot.y}) rotate(${spot.rot})`});
    crate.node.remove();
    state.crates = state.crates.filter(c=>c!==crate);
    if(good){
      state.score += 10;
      scoreEl.textContent = state.score + ' ✓';
      scoreBurst(spot.x-44, spot.y-42, '+10');
      smoke(spot.x+18, spot.y+18, .45);
    } else {
      scoreBurst(spot.x-36, spot.y-42, 'خطأ');
      smoke(spot.x+8, spot.y+10, .42);
    }
    state.locked = true;
    setTimeout(()=>{state.locked=false; respawn(crate.item, 680)}, 650);
  }

  function respawn(item, delay=500){
    setTimeout(()=>{
      item.popped=false;
      item.x = -180 - Math.random()*240;
      item.y = 155 + Math.random()*112;
      item.phase += Math.PI*.65 + Math.random();
      item.vx = 95 + Math.random()*38;
      item.scale = .9 + Math.random()*.2;
      makeBlimp(item);
    },delay);
  }

  function updateCrates(dt){
    for(const c of [...state.crates]){
      if(c.landed) continue;
      c.vy += 2350*dt;
      c.x += c.vx*dt;
      c.y += c.vy*dt;
      c.rot += c.vr*dt;

      const zone = zones.find(z => c.x > z.x+22 && c.x < z.x+z.w-22 && c.y + c.halfH >= z.y+48 && c.y - c.halfH < z.y+z.h);
      if(zone){
        const floor = zone.y + zone.h - 44;
        const left = zone.x + 30 + c.halfW*.42;
        const right = zone.x + zone.w - 30 - c.halfW*.42;
        // side walls keep the crate inside the compartment if it enters it.
        if(c.x < left){ c.x = left; c.vx = Math.abs(c.vx)*.34; c.vr *= -.45; }
        if(c.x > right){ c.x = right; c.vx = -Math.abs(c.vx)*.34; c.vr *= -.45; }
        if(c.y + c.halfH >= floor){
          c.y = floor - c.halfH;
          const isGood = c.item.answer === zone.label;
          if(!isGood) c.wrong = true;
          if(Math.abs(c.vy) > 210 && c.bounces < 3){
            c.vy = -Math.abs(c.vy) * (isGood ? .30 : .45);
            c.vx *= isGood ? .38 : .62;
            c.vr *= -.48;
            c.bounces++;
            smoke(c.x, c.y+28, .28);
          } else {
            settleCrate(c, zone, isGood);
            continue;
          }
        }
      }
      const ground = 660;
      if(c.y + c.halfH > ground){
        c.y = ground - c.halfH;
        if(c.bounces < 2){
          c.vy = -Math.abs(c.vy)*.36;
          c.vx *= .6;
          c.vr *= -.52;
          c.bounces++;
          smoke(c.x, c.y+26, .3);
        } else {
          c.node.remove(); state.crates = state.crates.filter(x=>x!==c); respawn(c.item, 450); continue;
        }
      }
      if(c.x<-160 || c.x>1440 || c.y>760){
        c.node.remove(); state.crates=state.crates.filter(x=>x!==c); respawn(c.item, 450); continue;
      }
      setAttrs(c.node,{transform:`translate(${c.x} ${c.y}) rotate(${c.rot})`});
    }
  }

  function updateBalloons(dt, now){
    state.balloons = state.balloons.filter(item=>item.node && !item.popped);
    for(const item of state.balloons){
      item.x += item.vx*dt;
      item.currentY = item.y + Math.sin(now/470 + item.phase)*22 + Math.sin(now/190 + item.phase)*5;
      setAttrs(item.node,{transform:`translate(${item.x} ${item.currentY}) scale(${item.scale})`});
      if(item.x > W + 190){
        item.node.remove(); item.node=null; respawn(item,0);
      }
    }
  }

  function updateWorld(dt){
    state.trackOffset = (state.trackOffset - 240*dt) % 58;
    state.cloudOffset = (state.cloudOffset + 13*dt) % 220;
    state.cactusOffset = (state.cactusOffset - 90*dt) % 1280;
    const sleepers = document.getElementById('sleepers');
    const clouds = document.getElementById('clouds');
    const props = document.getElementById('props');
    if(sleepers) sleepers.setAttribute('transform',`translate(${state.trackOffset} 0)`);
    if(clouds) clouds.setAttribute('transform',`translate(${state.cloudOffset} 0)`);
    if(props) props.setAttribute('transform',`translate(${state.cactusOffset} 0)`);
  }

  function startTimer(){
    setInterval(()=>{
      state.timeLeft = Math.max(0,state.timeLeft-1);
      const m = Math.floor(state.timeLeft/60), s = String(state.timeLeft%60).padStart(2,'0');
      timerEl.textContent = `${m}:${s}`;
    },1000);
  }

  function initItems(){
    const initial = [
      {text:'ماذا؟', answer:'استفهام', x:205, y:168, vx:112, phase:.2, scale:.98},
      {text:'ما أجمل الزهور!', answer:'تعجب', x:560, y:122, vx:105, phase:1.8, scale:.92},
      {text:'أكمل السؤال', answer:'أمر', x:910, y:185, vx:96, phase:3.1, scale:1.0},
      {text:'اكتب', answer:'أمر', x:1190, y:122, vx:88, phase:4.8, scale:.9}
    ];
    initial.forEach(makeBlimp);
    // Continue adding from the bank so the screen never feels empty.
    let i=0;
    setInterval(()=>{
      if(state.balloons.length < 4){
        const b = bank[i++ % bank.length];
        makeBlimp({text:b.text, answer:b.answer, x:-160-Math.random()*250, y:120+Math.random()*128, vx:95+Math.random()*35, phase:Math.random()*6.28, scale:.88+Math.random()*.2});
      }
    },1400);
  }

  let layers;
  function build(){
    clear(); defs(); background();
    layers = {
      physicsLayer: el('g',{id:'physicsLayer'}),
      trainLayer: el('g',{id:'trainLayer'}),
      balloonLayer: el('g',{id:'balloonLayer'}),
      fxLayer: el('g',{id:'fxLayer'})
    };
    const trainData = drawTrain();
    layers.trainLayer.appendChild(trainData.train);
    layers.parkedLayer = trainData.parked;
    initItems(); startTimer();
  }

  function loop(now){
    const dt = Math.min(.034,(now-state.last)/1000); state.last = now;
    updateWorld(dt); updateBalloons(dt,now); updateCrates(dt);
    requestAnimationFrame(loop);
  }

  build(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
