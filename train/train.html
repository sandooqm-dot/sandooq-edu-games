  const TRAIN_LAYOUT = {
    nearestWagonX:490,
    wagonY:486,
    wagonW:300,
    wagonH:111,
    wagonStep:288,

    // مسافة بسيطة فقط بين مقطورة السائق وعربة الركاب إذا كانت خلفه مباشرة.
    // تطبق على مجموعة العربات كلها حتى تبقى المسافات الخلفية متناسقة.
    driverPassengerGap:16
  };

  function hasPassengerBehindDriver(){
    return !!(TRAIN_CARS && TRAIN_CARS[0] && TRAIN_CARS[0].type === "passenger");
  }

  function trainSlotRawX(index){
    const baseX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    return hasPassengerBehindDriver()
      ? baseX - TRAIN_LAYOUT.driverPassengerGap
      : baseX;
  }

  function passengerLayoutForIndex(index){
    const rawSlotX = trainSlotRawX(index);
    const rawPassengerW = 320;
    const rawPassengerH = 179;
    const rawPassengerX = rawSlotX + (TRAIN_LAYOUT.wagonW - rawPassengerW) / 2;
    const rawPassengerY = 418;

    return {
      rawX:rawPassengerX,
      rawY:rawPassengerY,
      rawW:rawPassengerW,
      rawH:rawPassengerH,
      x:trainX(rawPassengerX),
      y:trainY(rawPassengerY),
      width:trainLen(rawPassengerW),
      height:trainLen(rawPassengerH)
    };
  }

  function coalLayoutForIndex(index){
    const rawSlotX = trainSlotRawX(index);
    const rawCoalW = 320;
    const rawCoalH = 150;
    const rawCoalX = rawSlotX + (TRAIN_LAYOUT.wagonW - rawCoalW) / 2;
    const rawCoalY = TRAIN_LAYOUT.wagonY + TRAIN_LAYOUT.wagonH - rawCoalH;

    return {
      rawX:rawCoalX,
      rawY:rawCoalY,
      rawW:rawCoalW,
      rawH:rawCoalH,
      x:trainX(rawCoalX),
      y:trainY(rawCoalY),
      width:trainLen(rawCoalW),
      height:trainLen(rawCoalH)
    };
  }

  const trainCarRegistry = [];

  function renderWagonMedia(parent,car,x,y,width,height){
    const media = normalizeRuntimeMedia(car?.media || {text:car?.text || ""});
    const hasImage = Boolean(media.imageData);
    const hasText = Boolean(media.text);

    if(hasImage){
      const image = el("image",{
        x:hasText ? x + width * .13 : x + width * .35,
        y:y + height * .25,
        width:hasText ? width * .20 : width * .30,
        height:height * .48,
        preserveAspectRatio:"xMidYMid meet",
        "pointer-events":"none"
      },parent);
      setSvgImageHref(image,media.imageData);
    }

    if(hasText){
      el("text", {
        x:hasImage ? x + width * .61 : x + width / 2,
        y:y + height * .56,
        "text-anchor":"middle",
        "dominant-baseline":"middle",
        fill:"#ffe28a",
        stroke:"#5b2618",
        "stroke-width":hasImage ? trainLen(2.2) : trainLen(2.6),
        "paint-order":"stroke fill",
        "font-size":hasImage ? trainLen(22) : trainLen(30),
        "font-weight":900,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"rtl",
        "pointer-events":"none"
      }, parent).textContent = media.text;
    }
  }

  function answerWagon(train, car, index){
    // قالب عربة الإجابة:
    // نفس العربة المعتمدة سابقًا، لكن صارت قابلة للتكرار حسب عدد الإجابات.
    // يتم تصغير القطار هنا فقط؛ الصندوق والبالونات تبقى بالحجم الأصلي.
    const rawWagonX = trainSlotRawX(index);
    const rawWagonY = TRAIN_LAYOUT.wagonY;
    const rawWagonW = TRAIN_LAYOUT.wagonW;
    const rawWagonH = TRAIN_LAYOUT.wagonH;

    const wagonX = trainX(rawWagonX);
    const wagonY = trainY(rawWagonY);
    const wagonW = trainLen(rawWagonW);
    const wagonH = trainLen(rawWagonH);

    const targetArea = {
      // منطقة الاستهداف الداخلية للعربة، مصغرة بنفس حجم العربة المرئية.
      left:wagonX + trainLen(14),
      right:wagonX + wagonW - trainLen(14),
      top:wagonY + trainLen(16),
      bottom:wagonY + wagonH - trainLen(16),
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2
    };

    trainCarRegistry[index] = {
      type:car.type,
      text:car.text,
      media:normalizeRuntimeMedia(car.media || {text:car.text || ""}),
      wagonId:String(car.wagonId || `wagon-${index}`),
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      left:wagonX,
      right:wagonX + wagonW,
      top:wagonY,
      bottom:wagonY + wagonH,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2,
      targetArea
    };

    const carVisualGroup = el("g", {id:`answerCar-${index}`}, train);
    const wheelLayer = el("g", {id:`wagonWheelLayer-${index}`}, carVisualGroup);
    // عجلات عربات الإجابة بنفس حجم وارتفاع العجلات الثلاث الصغيرة في القاطرة.
    // جسم العربة يُرسم بعدها، لذلك يبقى الجزء العلوي من العجلة مخفيًا خلف العربة.
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = rawWagonX + 49;
    const gap = 66;
    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`wagonBodyLayer-${index}`}, carVisualGroup);
    const wagonBody = el("image", {
      href:"train-wagon.webp?v=84",
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      preserveAspectRatio:"xMidYMid meet",
      id:`wagonBody-${index}`
    }, bodyLayer);
    wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=84");

    renderWagonMedia(bodyLayer,car,wagonX,wagonY,wagonW,wagonH);

    registerTrainVisualPart(carVisualGroup, wagonX, wagonX + wagonW);
  }

  function passengerWagon(train, car, index){
    // عربة الركاب بصرية فقط:
    // لا تدخل في trainCarRegistry ولا تُحسب كعربة سؤال.
    // نطاطاتها الفيزيائية تعتمد على نفس passengerLayoutForIndex المستخدم للرسم.
    const layout = passengerLayoutForIndex(index);
    const rawPassengerX = layout.rawX;
    const passengerX = layout.x;
    const passengerY = layout.y;
    const passengerW = layout.width;
    const passengerH = layout.height;

    const carVisualGroup = el("g", {id:`passengerCar-${index}`}, train);
    const wheelLayer = el("g", {id:`passengerWheelLayer-${index}`}, carVisualGroup);
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = rawPassengerX + 49;
    const gap = 66;

    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`passengerBodyLayer-${index}`}, carVisualGroup);
    const passengerBody = el("image", {
      href:PASSENGER_WAGON_IMAGE,
      x:passengerX,
      y:passengerY,
      width:passengerW,
      height:passengerH,
      preserveAspectRatio:"none",
      id:`passengerBody-${index}`
    }, bodyLayer);

    passengerBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", PASSENGER_WAGON_IMAGE);
    registerTrainVisualPart(carVisualGroup, passengerX, passengerX + passengerW);
  }

  function coalWagon(train, car, index){
    // عربة الفحم بصرية + صلبة، لكنها ليست عربة سؤال.
    // أسفلها متساوٍ مع عربات السؤال وتستخدم نفس العجلات.
    const layout = coalLayoutForIndex(index);
    const rawCoalX = layout.rawX;
    const coalX = layout.x;
    const coalY = layout.y;
    const coalW = layout.width;
    const coalH = layout.height;

    const carVisualGroup = el("g", {id:`coalCar-${index}`}, train);
    const wheelLayer = el("g", {id:`coalWheelLayer-${index}`}, carVisualGroup);
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = rawCoalX + 49;
    const gap = 66;

    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`coalBodyLayer-${index}`}, carVisualGroup);
    const coalBody = el("image", {
      href:COAL_WAGON_IMAGE,
      x:coalX,
      y:coalY,
      width:coalW,
      height:coalH,
      preserveAspectRatio:"none",
      id:`coalBody-${index}`
    }, bodyLayer);

    coalBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", COAL_WAGON_IMAGE);
    registerTrainVisualPart(carVisualGroup, coalX, coalX + coalW);
  }

  function wagons(train){
    // نرسم العربات من الخلف إلى الأمام حتى تكون العربة الأقرب للقاطرة فوق الوصلات بصريًا.
    for(let i = TRAIN_CARS.length - 1; i >= 0; i--){
      const car = TRAIN_CARS[i];
      if(car.type === "answer") answerWagon(train, car, i);
      if(car.type === "passenger") passengerWagon(train, car, i);
      if(car.type === "coal") coalWagon(train, car, i);
    }
  }

  function renderWagonForegroundCovers(){
    if(!wagonForegroundCoverLayer) return;

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const wagonBody = el("image", {
        href:"train-wagon.webp?v=84",
        x:car.x,
        y:car.y,
        width:car.width,
        height:car.height,
        preserveAspectRatio:"xMidYMid meet",
        id:`wagonCoverBody-${index}`
      }, wagonForegroundCoverLayer);
      wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=84");

      renderWagonMedia(wagonForegroundCoverLayer,car,car.x,car.y,car.width,car.height);
    });
  }

  function getAnswerTargetArea(index){
    const car = trainCarRegistry[index];
    return car ? car.targetArea : null;
  }

  function locomotive(train){
    // إصدار 82:
    // القاطرة مصغرة بنفس مقياس القطار، بينما البالونات والصناديق لا تتغير.
    const rawLocoX = 782;
    const rawLocoY = 430;
    const rawLocoW = 320;
    const rawLocoH = 179;

    const locoX = trainX(rawLocoX);
    const locoY = trainY(rawLocoY);
    const locoW = trainLen(rawLocoW);
    const locoH = trainLen(rawLocoH);

    const locomotiveVisualGroup = el("g", {id:"locomotiveVisualGroup"}, train);
    const bodyLayer = el("g", {id:"locomotiveBodyLayer"}, locomotiveVisualGroup);
    const locomotiveBody = el("image", {
      href:"train-engine-transparent.png?v=84",
      x:locoX,
      y:locoY,
      width:locoW,
      height:locoH,
      preserveAspectRatio:"xMidYMid meet",
      id:"locomotiveBody"
    }, bodyLayer);
    locomotiveBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-engine-transparent.png?v=84");

    const wheelLayer = el("g", {id:"locomotiveWheelLayer"}, locomotiveVisualGroup);

    // العجلة الكبيرة: تقديم للأمام بحوالي 3% ورفع للأعلى بحوالي 2%.
    const largeWheelSize = 90.2;
    const largeWheelCx = rawLocoX + 64;
    const largeWheelCy = 565;
    addWheel(wheelLayer, largeWheelCx, largeWheelCy, largeWheelSize, 39);

    // العجلات الثلاث الصغيرة: إرجاع للخلف داخل القاطرة وتكبير 10% تقريبًا.
    const smallWheelSize = 47.4;
    const smallWheelCy = 585.3;
    const smallStartX = rawLocoX + 148;
    const smallGap = 50;
    addWheel(wheelLayer, smallStartX, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap * 2, smallWheelCy, smallWheelSize, 39);
    registerTrainVisualPart(locomotiveVisualGroup, locoX, locoX + locoW);
  }

  function renderWagonDropCovers(){
    if(!wagonDropCoverLayer) return;

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      // بنية الطبقات الصحيحة:
      // خلفية العربة الأصلية -> الصندوق داخل الحوض -> هذه الواجهة الأمامية المعتمة.
      // لا توجد صورة مكررة ولا clipPath على صورة خارجية.
      const coverGroup = el("g", {
        id:`wagonFrontFace-${index}`,
        "pointer-events":"none",
        "shape-rendering":"geometricPrecision"
      }, wagonDropCoverLayer);

      const sideInset = trainLen(7);
      const topRailY = car.y + trainLen(1);
      const topRailH = trainLen(12);
      const faceX = car.x + sideInset;
      const faceY = car.y + topRailH;
      const faceW = car.width - sideInset * 2;
      const faceH = car.height - topRailH - trainLen(10);

      // جسم الواجهة الأحمر المعتم: هو الذي يحجب الجزء السفلي من الصندوق.
      el("rect", {
        x:faceX,
        y:faceY,
        width:faceW,
        height:faceH,
        rx:trainLen(2.5),
        fill:"url(#wagonFrontRedGrad)",
        stroke:"#5b1d16",
        "stroke-width":trainLen(2.6)
      }, coverGroup);

      // الإطار الداخلي الذهبي.
      el("rect", {
        x:faceX + trainLen(10),
        y:faceY + trainLen(10),
        width:faceW - trainLen(20),
        height:faceH - trainLen(20),
        rx:trainLen(1.5),
        fill:"none",
        stroke:"url(#wagonFrontGoldGrad)",
        "stroke-width":trainLen(2.2)
      }, coverGroup);

      // الحافة الذهبية العلوية فوق الصندوق.
      el("rect", {
        x:car.x + trainLen(1.5),
        y:topRailY,
        width:car.width - trainLen(3),
        height:topRailH,
        rx:trainLen(2.5),
        fill:"url(#wagonFrontGoldGrad)",
        stroke:"#633415",
        "stroke-width":trainLen(2)
      }, coverGroup);

      // العمودان الأماميان.
      [car.x + trainLen(4), car.right - trainLen(12)].forEach(x => {
        el("rect", {
          x,
          y:car.y + trainLen(8),
          width:trainLen(8),
          height:car.height - trainLen(20),
          rx:trainLen(2),
          fill:"url(#wagonFrontGoldGrad)",
          stroke:"#6c3714",
          "stroke-width":trainLen(1.4)
        }, coverGroup);
      });

      // الحافة السفلية.
      el("rect", {
        x:car.x + trainLen(5),
        y:car.bottom - trainLen(16),
        width:car.width - trainLen(10),
        height:trainLen(8),
        rx:trainLen(2),
        fill:"url(#wagonFrontGoldGrad)",
        stroke:"#6c3714",
        "stroke-width":trainLen(1.4)
      }, coverGroup);

      // زخارف زوايا خفيفة داخل الواجهة.
      const cornerY1 = faceY + trainLen(8);
      const cornerY2 = car.bottom - trainLen(21);
      const cornerX1 = faceX + trainLen(8);
      const cornerX2 = car.right - sideInset - trainLen(8);

      [
        `M${cornerX1 + trainLen(8)} ${cornerY1} H${cornerX1} V${cornerY1 + trainLen(8)}`,
        `M${cornerX2 - trainLen(8)} ${cornerY1} H${cornerX2} V${cornerY1 + trainLen(8)}`,
        `M${cornerX1 + trainLen(8)} ${cornerY2} H${cornerX1} V${cornerY2 - trainLen(8)}`,
        `M${cornerX2 - trainLen(8)} ${cornerY2} H${cornerX2} V${cornerY2 - trainLen(8)}`
      ].forEach(d => {
        el("path", {
          d,
          fill:"none",
          stroke:"#f2c95c",
          "stroke-width":trainLen(1.7),
          "stroke-linecap":"round",
          "stroke-linejoin":"round"
        }, coverGroup);
      });

      // نص العربة فوق الواجهة الأمامية.
      renderWagonMedia(coverGroup,car,car.x,car.y,car.width,car.height);

      registerTrainVisualPart(coverGroup, car.left, car.right, trainCoverVisualParts);
    });
  }

  function build(){
    const persistentBackgroundReady = !!svg.querySelector("#background") &&
      parallaxBackGroup &&
      parallaxLayerRecords.length === 3;

    // نبني الخلفية والسكة مرة واحدة فقط، ثم نُبقيهما أثناء جميع المراحل.
    if(!persistentBackgroundReady){
      clear();
      defs();
      background();
      showLevelSignAtCenter(currentStageIndex + 1);
      startParallaxLoop();
    }

    ensureGameHud();

    // كل مرحلة تعيد بناء عناصرها فقط فوق الخلفية المستمرة.
    trainCarRegistry.splice(0, trainCarRegistry.length);
    trainVisualParts.splice(0, trainVisualParts.length);
    trainCoverVisualParts.splice(0, trainCoverVisualParts.length);
    activeBalloons.splice(0, activeBalloons.length);

    balloonsLayer();

    // المجموعة الخارجية لحركة دخول وخروج القطار.
    trainPositionGroup = el("g", {id:"trainPositionGroup"});
    setTrainVisualOffset(TRAIN_MOTION.enterOffset);

    // المجموعة الداخلية مخصصة للحركة الخفيفة المستمرة فقط.
    const train = el("g", {id:"trainScene", class:"train-idle-motion"}, trainPositionGroup);

    wagons(train);
    locomotive(train);

    // الطبقة الوسطى: الصناديق التي دخلت أحواض العربات.
    settledObjectsLayer = el("g", {
      id:"settledObjectsLayer",
      "pointer-events":"none"
    }, train);

    // الطبقة الأمامية الحقيقية للعربة، داخل نفس trainScene وفوق الصناديق مباشرة.
    // لذلك يتحرك الجميع بنفس دخول القطار وحركته الخفيفة دون أي اختلاف في التوقيت.
    wagonDropCoverPositionGroup = null;
    wagonDropCoverLayer = el("g", {
      id:"wagonDropCoverLayer",
      "pointer-events":"none"
    }, train);
    wagonForegroundCoverLayer = wagonDropCoverLayer;
    renderWagonDropCovers();

    renderParallaxForeground();

    ensureLocomotiveSmokeLayer();

    // الصندوق يبقى فوق القطار أثناء السقوط الحر.
    // عند ملامسة جدار/قاع العربة يُنقل إلى settledObjectsLayer خلف الواجهة الأمامية.
    fallingObjectsLayer = el("g", {id:"fallingObjectsLayer"});

    feedbackEffectsLayer = el("g", {
      id:"feedbackEffectsLayer",
      "pointer-events":"none"
    });

    if(gameHudLayer?.isConnected) svg.appendChild(gameHudLayer);

    // خريطة تصادم غير مرئية للقطار: أحواض، حواف، نطاطات، فواصل ذكية، قاطرة، وسكة.
    collisionDebugLayer = el("g", {id:"collisionDebugLayer"});
    loadMatterLibrary();

    updateTrainVisualCulling();
    startParallaxLoop();

    // قبل الضغط على تشغيل نبني المشهد فقط، ويبقى القطار خارج الشاشة.
    if(trainStartGatePending){
      setTrainVisualOffset(TRAIN_MOTION.enterOffset);
      syncTrainPhysicsToVisualOffset();
    }else{
      startTrainEntry();
    }
  }

  function initializeTrainGame(){
    trainGameStarted = false;
    trainStartGatePending = true;
    attemptsRemaining = TRAIN_ATTEMPTS_TOTAL;
    trainAudio.preload();

    startGate?.classList.add("is-visible");
    startGate?.setAttribute("aria-hidden","false");
    endCelebration?.classList.remove("is-visible");
    endCelebration?.setAttribute("aria-hidden","true");
    resetTrainFinishClasses();
    startTrainStage(0);
    void trainAudio.ready("finish");
  }

  initializeTrainGame();
  /* إصدار 139: مؤقت تنازلي للمستوى وعدد محاولات اختياري للعبة. */
  window.addEventListener("pagehide",()=>{
    trainAudio.stopAll();
  },{passive:true});
  window.addEventListener("beforeunload", stopTrainMovementSound);

})();
</script>
</body>
</html>
