  function addGapPhysicsBetweenParts(leftPart, rightPart){
    const profile = TRAIN_PHYSICS_PROFILES.gap;
    const leftEdge = leftPart.x + leftPart.w;
    const rightEdge = rightPart.x;
    const center = (leftEdge + rightEdge) / 2;
    const y = Math.min(leftPart.y, rightPart.y) + trainLen(profile.yOffset);
    const gapW = trainLen(profile.width);
    const gapH = trainLen(profile.height);
    const halfW = gapW / 2;

    collisionMap.push(makeSurface({
      left:center - gapW / 2,
      right:center + gapW / 2,
      y,
      thickness:gapH
    }, {name:`gap-smart-${leftPart.id}-${rightPart.id}`}));

    addMatterRect(center - halfW / 2, y, halfW, gapH, {
      label:`gap-${leftPart.id}-${rightPart.id}-left-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(center + halfW / 2, y, halfW, gapH, {
      label:`gap-${leftPart.id}-${rightPart.id}-right-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });
  }

  function addAllSmartGaps(parts){
    const wagons = getAdjacentWagonParts(parts);
    for(let i = 0; i < wagons.length - 1; i++){
      const left = wagons[i];
      const right = wagons[i + 1];

      // لا ننشئ فاصلًا ذكيًا طويلًا إذا كانت عربة ركاب بصرية بين عربتي السؤال.
      if(Math.abs((right.index ?? 0) - (left.index ?? 0)) !== 1) continue;

      addGapPhysicsBetweenParts(left, right);
    }
  }

  function addAllTrainPartPhysics(){
    const parts = buildTrainPhysicsParts();

    parts.forEach(part => {
      if(part.type === "wagon") addWagonPhysicsPart(part);
      if(part.type === "passenger") addPassengerPhysicsPart(part);
      if(part.type === "coal") addCoalPhysicsPart(part);
      if(part.type === "engine") addEnginePhysicsPart(part);
    });

    addAllSmartGaps(parts);
  }

  function buildCollisionMap(){
    collisionMap.length = 0;
    resetMatterWorld();

    collisionMap.push(makeBreakSurface({
      left:trainX(-300),
      right:trainX(1560),
      y:trainY(604),
      thickness:trainLen(54)
    }, {name:"track"}));

    addMatterRect(
      trainX(630),
      trainY(TRAIN_PHYSICS_PROFILES.track.y),
      trainLen(1860),
      trainLen(TRAIN_PHYSICS_PROFILES.track.h),
      {
        label:"kill-track",
        isSensor:true
      }
    );

    addAllTrainPartPhysics();

    [
      // الخلف جهة العربة غير قاتل. النطاط فقط هو الشريط الصغير فوق مقطورة السائق.
      // ما عدا ذلك من جسم القاطرة يعتبر اصطدام/انفجار.
      {name:"driver-cabin-front", left:890, right:960, top:424, bottom:514},
      {name:"engine-top-mid", left:920, right:1088, top:430, bottom:505},
      {name:"engine-body-mid", left:930, right:1085, top:488, bottom:590},
      {name:"engine-front", left:1058, right:1164, top:438, bottom:610},
      {name:"engine-nose", left:1116, right:1208, top:498, bottom:620},
      {name:"engine-plow", left:1088, right:1210, top:550, bottom:632}
    ].forEach(zone => {
      const scaledZone = trainWorldRect(trainRect(zone));

      collisionMap.push(makeBreak({
        left:scaledZone.left,
        right:scaledZone.right,
        top:scaledZone.top,
        bottom:scaledZone.bottom
      }, {name:zone.name}));

      addMatterRect(
        (scaledZone.left + scaledZone.right) / 2,
        (scaledZone.top + scaledZone.bottom) / 2,
        scaledZone.right - scaledZone.left,
        scaledZone.bottom - scaledZone.top,
        {
          label:`kill-${zone.name}`,
          sgType:"kill",
          isSensor:true
        }
      );
    });

    drawCollisionDebug();
  }

  function drawCollisionDebug(){
    if(!DEBUG_COLLISION || !collisionDebugLayer) return;
    collisionDebugLayer.innerHTML = "";

    const colors = {
      "well":"#00c853",
      "surface":"#00b0ff",
      "break":"#ff1744",
      "break-surface":"#ff7a00"
    };

    collisionMap.forEach(zone => {
      if(zone.type === "surface" || zone.type === "break-surface"){
        el("rect", {
          x:zone.left,
          y:zone.y,
          width:zone.right - zone.left,
          height:zone.thickness || 22,
          fill:colors[zone.type],
          opacity:".16",
          stroke:colors[zone.type],
          "stroke-width":2
        }, collisionDebugLayer);
      }else{
        el("rect", {
          x:zone.left,
          y:zone.top,
          width:zone.right - zone.left,
          height:zone.bottom - zone.top,
          fill:colors[zone.type] || "#fff",
          opacity:".16",
          stroke:colors[zone.type] || "#fff",
          "stroke-width":2
        }, collisionDebugLayer);
      }
    });
  }

  function getWellByIndex(index){
    for(const zone of collisionMap){
      if(zone.type === "well" && zone.index === index) return zone;
    }
    return null;
  }

  function getWagonCaptureLineY(well){
    if(!well) return Number.POSITIVE_INFINITY;

    // الخط الشفاف يقع أسفل حافة فتحة العربة بقليل.
    return well.top + trainLen(WAGON_CAPTURE_LINE_OFFSET);
  }

  function isMatterBodyPastWagonCaptureLine(body, well){
    if(!body || !well) return false;

    const overlapRatio = getBodyHorizontalOverlapRatio(body, well);
    const centerInside = body.position.x >= well.left &&
      body.position.x <= well.right;

    if(!centerInside && overlapRatio < WAGON_CAPTURE_MIN_OVERLAP){
      return false;
    }

    const captureLineY = getWagonCaptureLineY(well);
    const bodyBottom = body.bounds?.max?.y ??
      (body.position.y + BOX.bottom);
    const bodyTop = body.bounds?.min?.y ??
      (body.position.y - BOX.top);

    // يكفي أن ينزل جزء واضح من الصندوق تحت الخط مع بقائه داخل ارتفاع العربة.
    return bodyBottom >= captureLineY + trainLen(WAGON_CAPTURE_MIN_DEPTH) &&
      bodyTop <= well.bottom + trainLen(12);
  }

  function getCaptureWellByMatterBody(body){
    if(!body) return null;

    let bestWell = null;
    let bestScore = -Infinity;

    for(const zone of collisionMap){
      if(zone.type !== "well" ||
         !isMatterBodyPastWagonCaptureLine(body, zone)){
        continue;
      }

      const overlapRatio = getBodyHorizontalOverlapRatio(body, zone);
      const centerX = (zone.left + zone.right) / 2;
      const distancePenalty = Math.abs(body.position.x - centerX) /
        Math.max(1, zone.right - zone.left);
      const captureDepth = Math.max(
        0,
        (body.bounds?.max?.y ?? body.position.y + BOX.bottom) -
          getWagonCaptureLineY(zone)
      );

      const score =
        overlapRatio * 12 +
        Math.min(captureDepth / 40, 1.5) -
        distancePenalty;

      if(score > bestScore){
        bestScore = score;
        bestWell = zone;
      }
    }

    return bestWell;
  }

  function resetWagonCaptureCandidate(item){
    if(!item) return;
    item.captureCandidateWellIndex = null;
    item.captureCandidateSince = 0;
  }

  function updateWagonCaptureConfirmation(item, now){
    if(!item || item.done || item.settleCommitted || !item.body){
      return false;
    }

    const captureWell = getCaptureWellByMatterBody(item.body);

    if(!captureWell){
      resetWagonCaptureCandidate(item);
      return false;
    }

    if(item.captureCandidateWellIndex !== captureWell.index){
      item.captureCandidateWellIndex = captureWell.index;
      item.captureCandidateSince = now;
      return false;
    }

    if(!item.captureCandidateSince){
      item.captureCandidateSince = now;
      return false;
    }

    if(now - item.captureCandidateSince < WAGON_CAPTURE_CONFIRM_MS){
      return false;
    }

    // بقي الصندوق داخل العربة وتحت الخط الشفاف للمدة المطلوبة.
    // هنا فقط نعتمد العربة، دون أي تغيير في السقوط أو النطات قبل ذلك.
    return commitMatterBoxToWagon(item, captureWell);
  }

  function getBodyHorizontalOverlapRatio(body, well){
    if(!body || !well) return 0;

    const bodyLeft = body.bounds?.min?.x ?? (body.position.x - BOX.left);
    const bodyRight = body.bounds?.max?.x ?? (body.position.x + BOX.right);
    const bodyWidth = Math.max(1, bodyRight - bodyLeft);
    const overlap = Math.max(
      0,
      Math.min(bodyRight, well.right) - Math.max(bodyLeft, well.left)
    );

    return overlap / bodyWidth;
  }

  function isBodyInsideWell(body, well){
    if(!body || !well) return false;

    const overlapRatio = getBodyHorizontalOverlapRatio(body, well);
    const centerInside = body.position.x >= well.left && body.position.x <= well.right;
    const verticalInside = body.position.y >= well.top - 8 &&
      body.position.y <= well.bottom + 30;

    return verticalInside && (centerInside || overlapRatio >= .45);
  }

  function getWellByMatterBody(body){
    if(!body) return null;

    let bestWell = null;
    let bestScore = -Infinity;

    for(const zone of collisionMap){
      if(zone.type !== "well" || !isBodyInsideWell(body, zone)) continue;

      const overlapRatio = getBodyHorizontalOverlapRatio(body, zone);
      const centerX = (zone.left + zone.right) / 2;
      const distancePenalty = Math.abs(body.position.x - centerX) /
        Math.max(1, zone.right - zone.left);
      const score = overlapRatio * 10 - distancePenalty;

      if(score > bestScore){
        bestScore = score;
        bestWell = zone;
      }
    }

    return bestWell;
  }

  function isMatterBodyAtWellFloor(body, well, tolerance = 10){
    if(!body || !well) return false;

    const overlapRatio = getBodyHorizontalOverlapRatio(body, well);
    if(overlapRatio < .48) return false;

    const floorHalfHeight = trainLen(TRAIN_PHYSICS_PROFILES.wagon.floor.h) / 2;
    const floorTop = well.floorY - floorHalfHeight;
    const bodyBottom = body.bounds?.max?.y ?? (body.position.y + BOX.bottom);
    const bodyTop = body.bounds?.min?.y ?? (body.position.y - BOX.top);

    return bodyBottom >= floorTop - Math.max(4, tolerance) &&
      bodyBottom <= well.floorY + floorHalfHeight + 24 &&
      bodyTop < floorTop &&
      body.velocity.y >= -.75;
  }

  function placeMatterBoxExactlyOnWellFloor(body, well){
    if(!body || !well || !Matter || !Matter.Body) return;

    const lowerExtent = Math.max(
      BOX.bottom,
      body.bounds?.max?.y !== undefined
        ? body.bounds.max.y - body.position.y
        : BOX.bottom
    );

    const floorTop = well.floorY -
      trainLen(TRAIN_PHYSICS_PROFILES.wagon.floor.h) / 2;

    Matter.Body.setPosition(body, {
      x:clamp(
        body.position.x,
        well.left + BOX.left * .55,
        well.right - BOX.right * .55
      ),
      y:floorTop - lowerExtent + .5
    });

    Matter.Body.setVelocity(body, {x:0, y:0});
    Matter.Body.setAngularVelocity(body, 0);
  }

  function commitMatterBoxToWagon(item, well, floorBody = null){
    if(!item || item.done || item.settleCommitted || !item.body || !well) return false;

    const targetCar = trainCarRegistry[well.index];
    const landedWagonId = String(targetCar?.wagonId || "");

    if(TRAIN_ANSWER_LOGIC_ENABLED && item.targetWagonId && landedWagonId !== item.targetWagonId){
      item.settleCommitted = true;
      item.currentWellIndex = well.index;
      item.lastWellIndex = well.index;
      breakMatterBox(item,{wrongWagon:true});
      return true;
    }

    item.settleCommitted = true;
    item.insideWagon = true;
    item.currentWellIndex = well.index;
    item.lastWellIndex = well.index;

    // قفل النطاطات يتبع العربة الفعلية الحالية بدل أول عربة لمسها الصندوق.
    item.lockedWellIndex = well.index;
    item.lastWagonContactAt = performance.now();

    if(!item.enteredWellAt){
      item.enteredWellAt = item.lastWagonContactAt;
    }

    if(floorBody){
      placeMatterBoxExactlyOnWagonFloor(item.body, floorBody);
    }else{
      placeMatterBoxExactlyOnWellFloor(item.body, well);
    }

    moveMatterBoxBehindWagonCover(item);
    settleMatterBoxAsVisualOnly(item, well);
    return true;
  }

  function syncMatterBox(item){
    if(!item || !item.body || !item.node) return;

    const body = item.body;
    const localX = item.insideWagonLayer
      ? body.position.x - trainVisualOffsetX
      : body.position.x;

    item.node.setAttribute(
      "transform",
      `translate(${localX.toFixed(2)} ${body.position.y.toFixed(2)}) rotate(${(body.angle * 180 / Math.PI).toFixed(2)})`
    );
  }

  function moveMatterBoxBehindWagonCover(item){
    if(!item || item.insideWagonLayer || !settledObjectsLayer || !item.node) return;
    item.insideWagonLayer = true;
    settledObjectsLayer.appendChild(item.node);
    syncMatterBox(item);
  }

  function placeMatterBoxExactlyOnWagonFloor(body, floorBody){
    if(!body || !floorBody || !Matter || !Matter.Body) return;

    // نستخدم حدود الجسم الحالية حتى تبقى زاوية الصندوق كما هي.
    const lowerExtent = Math.max(
      BOX.bottom,
      body.bounds && body.bounds.max
        ? body.bounds.max.y - body.position.y
        : BOX.bottom
    );

    const floorTop = floorBody.bounds && floorBody.bounds.min
      ? floorBody.bounds.min.y
      : floorBody.position.y - trainLen(TRAIN_PHYSICS_PROFILES.wagon.floor.h) / 2;

    Matter.Body.setPosition(body, {
      x:body.position.x,
      y:floorTop - lowerExtent + .5
    });

    Matter.Body.setVelocity(body, {x:0, y:0});
    Matter.Body.setAngularVelocity(body, 0);
  }

  function applySmartGapBounceToMatter(item, body, gapBody, activeMode = false){
    if(!item || !body || !gapBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.gap;
    const now = performance.now();
    const cooldown = activeMode ? profile.cooldown : Math.max(40, profile.cooldown - 35);

    if(item.lastGapSmartAt && now - item.lastGapSmartAt < cooldown){
      return;
    }

    item.lastGapSmartAt = now;
    markLandingQualityPenalty(item, "gap-bounce");

    const dx = body.position.x - gapBody.sgGapCenter;
    let direction = 0;

    // بعد اختيار العربة لأول مرة، يبقى الفاصل الذكي يعيد الصندوق إلى نفس العربة
    // بدل تبديل الاتجاه في كل نطة وانتقاله إلى العربة المجاورة.
    if(item.lockedWellIndex === gapBody.sgLeftWellIndex){
      direction = -1;
    }else if(item.lockedWellIndex === gapBody.sgRightWellIndex){
      direction = 1;
    }else{
      if(Math.abs(dx) > profile.centerDeadZone){
        direction = dx < 0 ? -1 : 1;
      }else if(Math.abs(body.velocity.x) > .08){
        direction = body.velocity.x < 0 ? -1 : 1;
      }else{
        direction = gapBody.sgDefaultPushX || 1;
      }

      item.lockedWellIndex = direction < 0
        ? gapBody.sgLeftWellIndex
        : gapBody.sgRightWellIndex;
    }

    item.lastWellIndex = item.lockedWellIndex;

    const inwardX = direction < 0
      ? Math.min(body.velocity.x, -profile.inwardVelocity)
      : Math.max(body.velocity.x, profile.inwardVelocity);

    Matter.Body.setVelocity(body, {
      x:inwardX,
      y:Math.min(body.velocity.y * .12, -profile.upVelocity)
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .58 + (direction < 0 ? -profile.spinKick : profile.spinKick)
    );

    Matter.Body.setPosition(body, {
      x:body.position.x + direction * profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyWagonTopBumperBounceToMatter(item, body, bumperBody){
    if(!item || !body || !bumperBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.wagon.topBumper;
    const now = performance.now();

    if(item.lastTopEdgeBumperAt && now - item.lastTopEdgeBumperAt < profile.cooldown){
      return;
    }

    item.lastTopEdgeBumperAt = now;
    markLandingQualityPenalty(item, "wagon-edge");

    if(item.lockedWellIndex === null || item.lockedWellIndex === undefined){
      item.lockedWellIndex = bumperBody.sgWellIndex ?? null;
    }

    item.lastWellIndex = item.lockedWellIndex ?? bumperBody.sgWellIndex ?? item.lastWellIndex;

    let direction = bumperBody.sgPushX || 0;

    // إذا لامس الصندوق حافة العربة المجاورة بعد أن حُددت عربته،
    // تكون النطة باتجاه عربته الأصلية لا باتجاه العربة الأخرى.
    if(item.lockedWellIndex !== null &&
      item.lockedWellIndex !== undefined &&
      bumperBody.sgWellIndex !== item.lockedWellIndex){
      const lockedWell = getWellByIndex(item.lockedWellIndex);
      if(lockedWell){
        const lockedCenterX = (lockedWell.left + lockedWell.right) / 2;
        direction = lockedCenterX < body.position.x ? -1 : 1;
      }
    }
    const inwardX = direction > 0
      ? Math.max(body.velocity.x, profile.inwardVelocity)
      : Math.min(body.velocity.x, -profile.inwardVelocity);

    Matter.Body.setVelocity(body, {
      x:inwardX,
      y:Math.min(body.velocity.y * .18, -profile.upVelocity)
    });

    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .64 + (direction > 0 ? profile.spinKick : -profile.spinKick)
    );

    Matter.Body.setPosition(body, {
      x:body.position.x + direction * profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyPassengerBouncerBounce(item, body, bouncerBody){
    if(!item || !body || !bouncerBody || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.passenger.bouncer;
    const now = performance.now();
    const isTopBouncerSurface = bouncerBody.sgBouncerSurface === "top";

    // صوت النطاط خاص بسطحه العلوي فقط؛ جوانب عربة الركاب تبقى تصادمًا فيزيائيًا صامتًا.
    if(isTopBouncerSurface &&
      (!item.lastPassengerBounceSoundAt || now - item.lastPassengerBounceSoundAt >= profile.cooldown)){
      item.lastPassengerBounceSoundAt = now;
      playTrainSound("bounce");
    }

    if(item.lastPassengerBounceAt && now - item.lastPassengerBounceAt < profile.cooldown){
      return;
    }

    item.lastPassengerBounceAt = now;
    markLandingQualityPenalty(item, "passenger-bounce");

    Matter.Body.setVelocity(body, {
      // نطات عالية وواضحة باتجاه الخلف/اليسار، وليست عمودية فوق نفس المكان.
      x:Math.min(body.velocity.x - 1.35, -profile.leftVelocity),
      y:Math.min(body.velocity.y * .10, -profile.upVelocity)
    });

    // لا نضيف أي دوران: الصندوق يقفز بنفس حالته بدل الدحرجة.
    Matter.Body.setAngularVelocity(body, 0);

    Matter.Body.setPosition(body, {
      x:body.position.x - profile.liftOut,
      y:body.position.y - profile.liftOut
    });
  }

  function applyDriverRoofBounce(item, body, roofBody){
    if(!item || !body || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.engine.roofBounce;
    const roofY = (roofBody && roofBody.sgRoofY) || TRAIN_PHYSICS_PROFILES.engine.roof.y;
    const now = performance.now();

    if(item.lastRoofBounceAt && now - item.lastRoofBounceAt < profile.cooldown){
      return;
    }

    item.lastRoofBounceAt = now;
    playTrainSound("bounce");
    markLandingQualityPenalty(item, "driver-roof");

    const incomingY = Math.abs(body.velocity.y);
    const upVelocity = -clamp(incomingY * 1.08, profile.minUpVelocity, profile.maxUpVelocity);

    // نطة قوسية قوية للخلف/اليسار: الدفع الأفقي هنا أقوى من السابق حتى لا تصبح النطة عمودية.
    const backVelocity = clamp(
      Math.min(body.velocity.x - 3.4, profile.backwardVelocity),
      profile.maxBackwardVelocity,
      profile.backwardVelocity
    );

    Matter.Body.setVelocity(body, {
      x:backVelocity,
      y:upVelocity
    });

    // لا نضيف أي دوران: القفز يكون عمودي/مرن أكثر وليس دحرجة.
    Matter.Body.setAngularVelocity(body, 0);

    Matter.Body.setPosition(body, {
      // إزاحة واضحة لليسار بعد النطة الواحدة حتى لا يبقى فوق نفس النطاط.
      x:body.position.x - profile.liftOut,
      y:Math.min(body.position.y - profile.liftOut, roofY - BOX.height / 2 - 8)
    });
  }

  function stopFreeFallAirDrift(item){
    if(!item || !item.airDriftActive) return;
    item.airDriftActive = false;
    item.firstSurfaceContactAt = item.firstSurfaceContactAt || performance.now();
  }

  function applyFreeFallAirDrift(item){
    if(!item || item.done || !item.airDriftActive || item.firstSurfaceContactAt || item.insideWagon) return;
    if(!item.body || !Matter || !Matter.Body) return;

    const profile = TRAIN_PHYSICS_PROFILES.freeFallAirDrift;
    if(!profile || !profile.enabled) return;

    const body = item.body;

    // أثناء السقوط الحر فقط:
    // نثبت المسار كهبوط مائل بفعل الهواء، لا كهروب عمودي.
    let nextVX = body.velocity.x;
    let nextVY = body.velocity.y;

    if(nextVX > profile.targetVX){
      nextVX = Math.max(profile.targetVX, nextVX - profile.velocityStepX);
      Matter.Body.applyForce(body, body.position, {
        x:-body.mass * profile.forceX,
        y:0
      });
    }else if(nextVX < profile.maxLeftVX){
      nextVX = profile.maxLeftVX;
    }

    if(nextVY < profile.targetVY){
      nextVY = Math.min(profile.targetVY, nextVY + profile.velocityStepY);
      Matter.Body.applyForce(body, body.position, {
        x:0,
        y:body.mass * profile.forceY
      });
    }else if(nextVY > profile.maxDownVY){
      nextVY = profile.maxDownVY;
    }

    Matter.Body.setVelocity(body, {
      x:nextVX,
      y:nextVY
    });
  }

  function handleGapActiveCollision(bodyA, bodyB){
    const item = bodyA && bodyA.sgItem;
    if(!item || item.done || !bodyB) return;

    if(bodyB.sgType === "gap-smart-bouncer"){
      stopFreeFallAirDrift(item);
      applySmartGapBounceToMatter(item, bodyA, bodyB, true);
      return;
    }

    if(bodyB.sgType === "passenger-bouncer" || bodyB.sgType === "passenger-solid"){
      stopFreeFallAirDrift(item);
      applyPassengerBouncerBounce(item, bodyA, bodyB);
      return;
    }

    if(bodyB.sgType === "coal-solid"){
      stopFreeFallAirDrift(item);
      breakMatterBox(item);
      return;
    }
  }

  function handleMatterCollision(bodyA, bodyB){
    const item = bodyA && bodyA.sgItem;
    if(!item || item.done || item.settleCommitted || !bodyB) return;

    stopFreeFallAirDrift(item);

    if(bodyB.label === "kill-track"){
      const actualWell = getWellByMatterBody(bodyA);

      if(actualWell && isMatterBodyAtWellFloor(bodyA, actualWell)){
        commitMatterBoxToWagon(item, actualWell);
      }else if(!actualWell){
        breakMatterBox(item);
      }
      return;
    }

    if(bodyB.sgType === "kill" || String(bodyB.label || "").startsWith("kill-")){
      breakMatterBox(item);
      return;
    }

    if(bodyB.sgType === "coal-solid"){
      breakMatterBox(item);
      return;
    }

    if(bodyB.sgType === "gap-smart-bouncer"){
      applySmartGapBounceToMatter(item, bodyA, bodyB, false);
      return;
    }

    if(bodyB.sgType === "passenger-bouncer" || bodyB.sgType === "passenger-solid"){
      applyPassengerBouncerBounce(item, bodyA, bodyB);
      return;
    }

    if(bodyB.sgType === "wagon-top-edge-bumper"){
      applyWagonTopBumperBounceToMatter(item, bodyA, bodyB);
      return;
    }

    if(bodyB.sgType === "wagon-floor"){
      // القاع الذي اصطدم به الصندوق هو مصدر الحقيقة، لا أول عربة لمسها سابقًا.
      const actualWell = getWellByIndex(bodyB.sgWellIndex) || getWellByMatterBody(bodyA);

      if(actualWell){
        commitMatterBoxToWagon(item, actualWell, bodyB);
      }

      return;
    }

    if(bodyB.sgType === "wagon-wall"){
      markLandingQualityPenalty(item, "wagon-wall");
      item.insideWagon = true;
      item.lastWagonContactAt = performance.now();

      // عند انتقال الصندوق بسبب نطة إلى عربة أخرى نحدّث العربة الحالية فورًا.
      item.currentWellIndex = bodyB.sgWellIndex;
      item.lastWellIndex = bodyB.sgWellIndex;
      item.lockedWellIndex = bodyB.sgWellIndex;

      if(!item.enteredWellAt){
        item.enteredWellAt = item.lastWagonContactAt;
      }

      moveMatterBoxBehindWagonCover(item);
      return;
    }

    if(bodyB.sgType === "driver-roof"){
      applyDriverRoofBounce(item, bodyA, bodyB);
      return;
    }
  }

  function cleanupMatterBox(item, removeVisual = true){
    if(!item || item.done) return;
    item.done = true;

    if(item.body && matterEngine && matterEngine.world){
      Matter.World.remove(matterEngine.world, item.body);
    }

    if(removeVisual && item.node && item.node.parentNode){
      item.node.remove();
    }

    const index = matterBoxes.indexOf(item);
    if(index >= 0) matterBoxes.splice(index, 1);

    activeFallingBoxes = Math.max(0, activeFallingBoxes - 1);
  }

  function breakMatterBox(item, options = {}){
    if(!item || item.done) return;

    const x = item.body ? item.body.position.x : 0;
    const y = item.body ? item.body.position.y : 610;

    playTrainSound("boxBreak");
    cleanupMatterBox(item, true);
    trackImpactBurst(
      feedbackEffectsLayer || fallingObjectsLayer || svg,
      x,
      Math.min(y + BOX.bottom, 610),
      Boolean(options.wrongWagon)
    );
    if(options.wrongWagon) loseAttempt();
    resolveMatterBoxAttempt(item,false);
  }

  function settleMatterBoxAsVisualOnly(item, well){
    if(!item || item.done || !item.body || !item.node) return;

    const body = item.body;
    const node = item.node;
    const x = body.position.x;
    const y = body.position.y;
    const r = body.angle * 180 / Math.PI;

    const localX = x - trainVisualOffsetX;

    node.setAttribute(
      "transform",
      `translate(${localX.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`
    );

    const awardedPoints = landingPointsFor(item, body);
    item.awardedPoints = awardedPoints;
    lastCorrectDropAudio = playTrainSound("correctDrop");
    correctAnswerFeedback(x, y, awardedPoints);

    // بعد الاستقرار يصبح بصريًا فقط: نخفف الفلتر الثقيل أيضًا لتقليل الضغط على الجوال.
    node.removeAttribute("filter");

    cleanupMatterBox(item, false);

    const layer = settledObjectsLayer || fallingObjectsLayer || svg;
    if(node && node.parentNode !== layer){
      layer.appendChild(node);
    }

    settledVisualMatterBoxes.push(item);
    rememberSettledBox(node, well && well.index);

    // نسجل الإجابة الصحيحة للعربة المحددة، ولا نكمل العربة حتى تصل كل إجاباتها.
    handleQuestionWagonSettled(well,item);
    resolveMatterBoxAttempt(item,true);
  }

  function updateMatterBoxState(item){
    if(!item || item.done || item.settleCommitted || !item.body || !item.node) return;

    const body = item.body;
    applyFreeFallAirDrift(item);
    syncMatterBox(item);

    // خط كشف شفاف + مهلة قصيرة:
    // إذا بقي جزء واضح من الصندوق داخل العربة 220ms يُحتسب،
    // حتى لو كان مائلًا أو لم يصل القاع بالشكل المثالي.
    if(updateWagonCaptureConfirmation(item, performance.now())){
      return;
    }

    // فحص هندسي احتياطي كل إطار: لا نعتمد فقط على collisionStart،
    // لأن القطار نفسه قد يكون متحركًا أو قد يقفز الصندوق إلى عربة بعيدة.
    const actualWell = getWellByMatterBody(body);

    if(actualWell){
      item.insideWagon = true;
      item.currentWellIndex = actualWell.index;
      item.lastWellIndex = actualWell.index;
      item.lockedWellIndex = actualWell.index;
      item.lastWagonContactAt = performance.now();

      if(!item.enteredWellAt){
        item.enteredWellAt = item.lastWagonContactAt;
      }

      moveMatterBoxBehindWagonCover(item);

      if(isMatterBodyAtWellFloor(body, actualWell)){
        commitMatterBoxToWagon(item, actualWell);
        return;
      }

      const speed = body.speed;
      const angular = Math.abs(body.angularVelocity);

      if(speed < .18 && angular < .018){
        item.stableFrames += 1;
      }else{
        item.stableFrames = 0;
      }

      // احتياط إضافي للصندوق الهادئ قرب القاع، حتى لو فات حدث الاصطدام.
      if(item.stableFrames > 18 && isMatterBodyAtWellFloor(body, actualWell, 22)){
        commitMatterBoxToWagon(item, actualWell);
        return;
      }
    }else{
      item.stableFrames = 0;
    }

    // إذا كان الصندوق خارج كل العربات، يترك حتى يصل السكة ثم ينكسر.
    const trackBreakY = trainY(TRAIN_PHYSICS_PROFILES.track.y) - BOX.bottom + 6;
    if(!actualWell && body.position.y >= trackBreakY){
      breakMatterBox(item);
      return;
    }

    if(body.position.y > 700 || body.position.x < -240 || body.position.x > 1450){
      breakMatterBox(item);
    }
  }

  function startMatterLoop(){
    if(matterRunnerStarted || !isMatterReady() || !matterEngine) return;
    matterRunnerStarted = true;

    function frame(now){
      const elapsed = matterLastTime
        ? clamp(now - matterLastTime, 0, MATTER_MAX_FRAME_MS)
        : MATTER_FIXED_STEP_MS;
      matterLastTime = now;

      if(matterEngine && (matterStaticBodies.length || matterBoxes.length)){
        matterAccumulator += elapsed;
        let substeps = 0;

        while(matterAccumulator >= MATTER_FIXED_STEP_MS && substeps < MATTER_MAX_SUBSTEPS){
          Matter.Engine.update(matterEngine, MATTER_FIXED_STEP_MS);
          matterAccumulator -= MATTER_FIXED_STEP_MS;
          substeps += 1;
        }

  function readTrainPayloadFromIndexedDb(payloadId){
    if(!payloadId || !("indexedDB" in window)) return Promise.resolve(null);

    return new Promise((resolve)=>{
      const request = indexedDB.open("sandooq_edu_games_v1",1);

      request.onerror = ()=>resolve(null);
      request.onupgradeneeded = ()=>{
        const db = request.result;
        if(!db.objectStoreNames.contains("payloads")){
          db.createObjectStore("payloads",{keyPath:"key"});
        }
      };

      request.onsuccess = ()=>{
        const db = request.result;
        try {
          const tx = db.transaction("payloads","readonly");
          const getRequest = tx.objectStore("payloads").get(`train:${payloadId}`);

          getRequest.onsuccess = ()=>{
            const payload = parseTrainPayload(getRequest.result?.payload);
            db.close();
            resolve(payload);
          };
          getRequest.onerror = ()=>{
            db.close();
            resolve(null);
          };
        } catch (_) {
          db.close();
          resolve(null);
        }
      };
    });
  }

    const words = text.split(/\s+/).filter(Boolean);
    if(words.length <= 2) return [text];

  function nextDistractorStageRelation(){
    const explicitDistractors = currentStageDistractorRelations.filter(relationIsStillAvailable);
    if(explicitDistractors.length){
      return chooseRelationWithRepeatGap(explicitDistractors);
    }

    const activeIds = new Set(currentStageActiveWagonIds);
    const fallbackDistractors = stageBalloonDeck.filter(relation =>
      relationIsStillAvailable(relation) && !activeIds.has(relation.targetWagonId)
    );
    return chooseRelationWithRepeatGap(fallbackDistractors);
  }

  function refreshBalloonPriorityPrefetchQueue(){
    const wagonIds = priorityUncompletedWagonIds();
    const signature = wagonIds.slice(0,2).join("|");

    if(signature !== balloonPrioritySignature){
      balloonPrioritySignature = signature;
      balloonPriorityPrefetchQueue = [];
      if(wagonIds[0]) balloonPriorityPrefetchQueue.push("current");
      if(wagonIds[1]) balloonPriorityPrefetchQueue.push("next");
      stageBalloonPriorityCursor = 0;
    }

    return wagonIds;
  }

  function nextStageBalloonContent(preferredType = ""){
    if(!TRAIN_ANSWER_LOGIC_ENABLED || !stageBalloonDeck.length) return null;

    stageBalloonSpawnCounter += 1;

    const wagonIds = refreshBalloonPriorityPrefetchQueue();
    const patternType = preferredType || BALLOON_PRIORITY_PATTERN[
      stageBalloonPriorityCursor % BALLOON_PRIORITY_PATTERN.length
    ];

    if(!preferredType){
      stageBalloonPriorityCursor += 1;
    }

    let selected = null;

    if(patternType === "current"){
      selected = nextRelationForWagon(wagonIds[0]);
    }else if(patternType === "next"){
      selected = nextRelationForWagon(wagonIds[1]);
    }else if(patternType === "distractor"){
      selected = nextDistractorStageRelation();
    }

    return selected || nextGeneralStageRelation();
  }

  function nextBalloonLines(){
    const lines = BALLOON_TEXT_BANK[balloonTextCursor % BALLOON_TEXT_BANK.length];
    balloonTextCursor += 1;
    return lines;
  }

  function setBalloonLines(balloon, lines){
    const textNode = balloon.querySelector('[data-role="balloon-media-text"]');
    if(!textNode) return;
    const tspans = textNode.querySelectorAll("tspan");
    if(tspans[0]) tspans[0].textContent = lines[0] || "";
    if(tspans[1]) tspans[1].textContent = lines[1] || "";
  }

  function nextBalloonMotionProfile(previousId = ""){
    const activeIds = new Set(
      activeBalloons
        .filter(item => item && !item.popped && !item.flyAway)
        .map(item => item.config?.motionProfile?.id)
        .filter(Boolean)
    );

    const total = BALLOON_MOTION_PROFILES.length;

    for(let offset = 0; offset < total; offset++){
      const index = (balloonMotionProfileCursor + offset) % total;
      const profile = BALLOON_MOTION_PROFILES[index];

      if(profile.id === previousId || activeIds.has(profile.id)) continue;

      balloonMotionProfileCursor = (index + 1) % total;
      return profile;
    }

    for(let offset = 0; offset < total; offset++){
      const index = (balloonMotionProfileCursor + offset) % total;
      const profile = BALLOON_MOTION_PROFILES[index];

      if(profile.id === previousId) continue;

      balloonMotionProfileCursor = (index + 1) % total;
      return profile;
    }

    return BALLOON_MOTION_PROFILES[0];
  }

  function balloonSpeedMultiplier(index, spawnSerial = 0){
    const offset = (Number(index) + Number(spawnSerial)) % BALLOON_SPEED_MULTIPLIERS.length;
    return BALLOON_SPEED_MULTIPLIERS[offset];
  }

  function initialBalloonX(index){
    // كل عناصر المسبح تبدأ مخفية خارج الطرف الأيمن، ثم يفعّلها المجدول واحدًا بعد الآخر.
    return BALLOON_FLIGHT.startX + 115;
  }

  function createBalloonMotionState(config, index = 0){
    const motionTime = index * 1.31;

    return {
      x:initialBalloonX(index),
      y:balloonYForProfile(config.motionProfile, motionTime, config.scale),
      motionTime
    };
  }

  function releaseStageBalloonsUpward(){
    const now = performance.now();

    activeBalloons.forEach(item => {
      if(!item || !item.node || item.flyAway) return;

      item.flyAway = true;
      item.flyAwayStartedAt = now;
      item.flyAwayDelay = 650 + item.index * 90;
      item.flyAwaySpeed = 118 + item.index * 8 + Math.random() * 16;
      item.flyAwayDrift = -(44 + item.index * 4 + Math.random() * 18);

      item.popped = false;
      item.resetAt = 0;
      item.node.style.pointerEvents = "none";
      item.node.style.cursor = "default";

      if(item.node.style.display !== "none"){
        item.node.setAttribute("opacity", "1");
      }
    });
  }

  function visibleStreamBalloons(){
    return activeBalloons.filter(item =>
      item &&
      !item.popped &&
      !item.flyAway &&
      item.node?.style.display !== "none"
    );
  }

  function readyStreamBalloons(now){
    return activeBalloons
      .filter(item =>
        item &&
        item.popped &&
        !item.flyAway &&
        !item.attemptPending &&
        now >= (Number(item.resetAt) || 0)
      )
      .sort((a,b) => {
        const retryA = a.pendingRetryContent ? 0 : 1;
        const retryB = b.pendingRetryContent ? 0 : 1;
        return retryA - retryB || a.index - b.index;
      });
  }

  function parkBalloonForStream(item, now, readyDelay = 0){
    if(!item?.node) return;

    item.node.setAttribute("opacity","0");
    item.node.style.display = "none";
    item.node.style.pointerEvents = "none";
    item.node.style.cursor = "default";

    item.popped = true;
    item.streamActive = false;
    item.streamTriggerFired = false;
    item.attemptPending = false;
    item.resetAt = now + Math.max(0, Number(readyDelay) || 0);
  }

  function balloonSpawnDelay(initial = false){
    const pattern = initial
      ? BALLOON_INITIAL_DELAY_PATTERN_MS
      : BALLOON_CONTINUOUS_DELAY_PATTERN_MS;
    const cursor = initial
      ? balloonInitialDelayCursor++
      : balloonContinuousDelayCursor++;
    const baseDelay = pattern[cursor % pattern.length];
    const jitter = (Math.random() - .5) * 180;

    // الفواصل الأطول تمنع تجمع البالونات رغم اختلاف السرعات،
    // وتترك وقتًا كافيًا لتحديث أولوية العربة الحالية والعربة التالية قبل إنشاء البالون القادم.
    return Math.max(initial ? 1850 : 1450, baseDelay + jitter);
  }

  function canUseBalloonEntry(){
    const visible = visibleStreamBalloons();
    const crowded = visible.filter(item => item.state.x > BALLOON_ENTRY_ZONE_X);
    return crowded.length < BALLOON_ENTRY_MAX_COUNT;
  }

  function nextContinuousSpawnX(item){
    const baseX = BALLOON_FLIGHT.startX + 115;
    const rightSide = visibleStreamBalloons()
      .filter(other => other !== item && other.state.x > 1260)
      .map(other => other.state.x)
      .sort((a,b) => b - a);

    if(!rightSide.length) return baseX;

    return clamp(
      rightSide[0] + BALLOON_ENTRY_MIN_SPACING,
      baseX,
      baseX + 210
    );
  }

  function activateBalloonForStream(item, now, preferredType = ""){
    recycleBalloon(item, now, false, preferredType);

    if(item.popped || item.node.style.display === "none") return false;

    balloonStreamSequence += 1;
    item.streamActive = true;
    item.streamTriggerFired = false;
    item.streamSequence = balloonStreamSequence;
    lastSpawnedBalloonItem = item;
    balloonStreamLastSpawnAt = now;
    return true;
  }

  function leftmostRecyclableBalloon(){
    return visibleStreamBalloons()
      .filter(item => item.state.x < BALLOON_EARLY_RECYCLE_X)
      .sort((a,b) => a.state.x - b.state.x)[0] || null;
  }

  function updateBalloonStreamScheduler(now){
    if(stageCompleteTriggered ||
       trainMotionState === "exiting" ||
       trainMotionState === "done"){
      return;
    }

    let active = visibleStreamBalloons();
    const ready = readyStreamBalloons(now);
    if(!ready.length || now < balloonStreamNextSpawnAt) return;

    const initialFill = !balloonInitialFillComplete;
    const triggerItem = active
      .filter(item =>
        !item.streamTriggerFired &&
        item.state.x <= BALLOON_CONTINUOUS_TRIGGER_X
      )
      .sort((a,b) => a.streamSequence - b.streamSequence)[0] || null;

    refreshBalloonPriorityPrefetchQueue();
    let preferredType = "";
    let shouldSpawn = false;

    if(active.length === 0){
      shouldSpawn = true;
    }else if(initialFill && active.length < BALLOON_VISIBLE_TARGET){
      shouldSpawn = true;
    }else if(!initialFill && active.length < BALLOON_VISIBLE_TARGET){
      // تعويض أي بالون فُرقع، مع إبقاء العدد الأساسي ستة.
      shouldSpawn = true;
    }else if(triggerItem && active.length < BALLOON_ACTIVE_STREAM_LIMIT){
      // عندما تتجاوز مجموعة البالونات منتصف الشاشة بقليل،
      // نجهز أولًا إجابة للعربة الحالية ثم للعربة التالية قبل المشتتات.
      preferredType = balloonPriorityPrefetchQueue[0] || "";
      shouldSpawn = true;
    }else if(triggerItem && active.length >= BALLOON_ACTIVE_STREAM_LIMIT){
      const recyclable = leftmostRecyclableBalloon();
      if(recyclable){
        parkBalloonForStream(recyclable,now,0);
        active = visibleStreamBalloons();
        preferredType = balloonPriorityPrefetchQueue[0] || "";
        shouldSpawn = true;
      }
    }

    if(!shouldSpawn || !canUseBalloonEntry()) return;

    if(triggerItem) triggerItem.streamTriggerFired = true;

    const readyItem = ready[0];
    const usedPriorityContent = Boolean(preferredType && !readyItem.pendingRetryContent);
    const activated = activateBalloonForStream(readyItem,now,preferredType);
    if(!activated) return;

    if(usedPriorityContent && balloonPriorityPrefetchQueue[0] === preferredType){
      balloonPriorityPrefetchQueue.shift();
    }

    const activeAfter = visibleStreamBalloons().length;
    if(activeAfter >= BALLOON_VISIBLE_TARGET){
      balloonInitialFillComplete = true;
    }

    balloonStreamNextSpawnAt = now + balloonSpawnDelay(!balloonInitialFillComplete);
  }

  function recycleBalloon(item, now, forceFarRight = false, preferredType = ""){
    const previousProfileId = item.config.motionProfile?.id || "";
    const motionProfile = nextBalloonMotionProfile(previousProfileId);

    let content = null;
    if(TRAIN_ANSWER_LOGIC_ENABLED){
      content = item.pendingRetryContent || nextStageBalloonContent(preferredType);

      if(!content){
        item.pendingRetryContent = null;
        item.config.content = null;
        item.attemptPending = false;
        item.node.removeAttribute("data-balloon-id");
        item.node.removeAttribute("data-target-wagon-id");
        item.node.style.display = "none";
        item.node.style.pointerEvents = "none";
        item.node.style.cursor = "default";
        item.popped = true;
        item.streamActive = false;
        item.streamTriggerFired = false;
        item.resetAt = now + 420;
        return;
      }

      item.pendingRetryContent = null;
      item.config.content = content;
      item.config.media = content.balloon;
      item.config.lines = mediaTextLines(content.balloon,["",""]);
      item.node.setAttribute("data-balloon-id", String(content.balloonId || ""));
      item.node.setAttribute("data-target-wagon-id", String(content.targetWagonId || content.wagonId || ""));
      setBalloonMedia(item.node,content.balloon);
    }else{
      item.config.lines = nextBalloonLines();
      setBalloonLines(item.node, item.config.lines);
    }

    item.config.motionProfile = motionProfile;
    item.config.minY = motionProfile.minY;
    item.config.maxY = motionProfile.maxY;
    item.spawnSerial = (item.spawnSerial || 0) + 1;
    item.attemptPending = false;

    item.node.setAttribute("data-motion-profile", motionProfile.id);

    item.state.x = forceFarRight
      ? BALLOON_FLIGHT.startX + item.index * 225
      : nextContinuousSpawnX(item);

    item.state.motionTime =
      (item.spawnSerial * 1.37 + item.index * .71) % motionProfile.cycle;
    item.state.y = balloonProfileY(item);

    item.speedMultiplier = balloonSpeedMultiplier(item.index, item.spawnSerial);
    item.speed = speedFromLevel(item.config.speedLevel) * item.speedMultiplier;
    item.verticalTempo = .92 + item.speedMultiplier * .12;
    item.node.setAttribute("data-speed-multiplier", item.speedMultiplier.toFixed(2));
      const transform = `translate(${item.state.x.toFixed(1)} ${item.state.y.toFixed(1)}) scale(${item.config.scale})`;
      if(item.lastTransform !== transform){
        item.node.setAttribute("transform", transform);
        item.lastTransform = transform;
      }

    item.node.style.display = "";
    item.node.setAttribute("opacity", "1");
    item.node.style.pointerEvents = "auto";
    item.node.style.cursor = "pointer";
    item.popped = false;
    item.streamActive = true;
    item.streamTriggerFired = false;
    item.resetAt = 0;
  }

  function canPopBalloonNow(){
    if(stageCompleteTriggered || trainExitSequencePending || gameOverByAttempts) return false;
    return trainMotionState === "entering" ||
      trainMotionState === "playing" ||
      trainMotionState === "advancing";
  }

  function popPooledBalloon(item, now){
    if(item.popped || item.flyAway) return;
    if(!canPopBalloonNow()) return;
    if(TRAIN_ANSWER_LOGIC_ENABLED && !item.config.content) return;

    // يبدأ صوت الفرقعة أولًا داخل حدث pointerdown نفسه.
    playTrainSound("balloonPop");

    item.popped = true;
    item.attemptPending = true;
    item.resetAt = Number.POSITIVE_INFINITY;

    item.node.setAttribute("opacity", "0");
    item.node.style.display = "none";
    item.node.style.pointerEvents = "none";

    balloonBurst(fallingObjectsLayer || svg, item.state.x, item.state.y, item.config.scale);
    const relation = item.config.content || null;
    spawnFallingAnswerBox(
      item.state.x,
      item.state.y,
      item.config.lines || ["ما أجمل", "الزهور!"],
      {
        relation,
        media:relation?.balloon || item.config.media,
        balloonId:relation?.balloonId || "",
        targetWagonId:relation?.targetWagonId || relation?.wagonId || "",
        sourceBalloonItem:item
      }
    );
  }

  function updateBalloonItem(item, now, dtMs){
    const dt = dtMs / 1000;

    if(item.flyAway){
      const elapsed = now - (item.flyAwayStartedAt || now);
      if(elapsed < (item.flyAwayDelay || 0)){
        return;
      }

      const flyDt = Math.min(dt, .05);
      item.state.y -= item.flyAwaySpeed * flyDt;
      item.state.x += item.flyAwayDrift * flyDt;
      const transform = `translate(${item.state.x.toFixed(1)} ${item.state.y.toFixed(1)}) scale(${item.config.scale})`;
      if(item.lastTransform !== transform){
        item.node.setAttribute("transform", transform);
        item.lastTransform = transform;
      }

      const fade = clamp((item.state.y + 120) / 120, 0, 1);

      if(item.node.style.display !== "none"){
        const opacity = fade.toFixed(2);
        if(item.lastOpacity !== opacity){
          item.node.setAttribute("opacity", opacity);
          item.lastOpacity = opacity;
        }
      }

      if(item.state.y < -135 || item.state.x < -230){
        item.node.setAttribute("opacity", "0");
        item.node.style.display = "none";
      }

      return;
    }

    if(item.popped){
      // إعادة إدخال البالون أصبحت تحت تحكم مجدول التدفق، حتى لا تظهر عدة بالونات دفعة واحدة.
      return;
    }

    item.state.x -= item.speed * dt;

    item.state.motionTime += dt * item.verticalTempo;
    item.state.y = balloonProfileY(item);
      const transform = `translate(${item.state.x.toFixed(1)} ${item.state.y.toFixed(1)}) scale(${item.config.scale})`;
      if(item.lastTransform !== transform){
        item.node.setAttribute("transform", transform);
        item.lastTransform = transform;
      }

    if(item.state.x < item.config.endX){
      parkBalloonForStream(item,now,0);
    }
  }

  function startBalloonPoolLoop(){
    if(balloonLoopStarted) return;
    balloonLoopStarted = true;

    function frame(now){
      const dtMs = balloonLoopLastTime ? clamp(now - balloonLoopLastTime, 0, 50) : 16;
      balloonLoopLastTime = now;

      for(const item of activeBalloons){
        updateBalloonItem(item, now, dtMs);
      }

      updateBalloonStreamScheduler(now);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function balloonsLayer(){
    const POOL_SIZE = currentBalloonFlowSize();
    const balloons = el("g", {
      id:"balloonsLayer",
      "data-speed-level":String(BALLOON_SPEED_LEVEL),
      "data-pool-size":String(POOL_SIZE),
      "data-visible-target":String(BALLOON_VISIBLE_TARGET),
      "data-visible-limit":String(BALLOON_VISIBLE_LIMIT),
      "data-active-stream-limit":String(BALLOON_ACTIVE_STREAM_LIMIT),
      "data-required-count":String(currentStageRequiredRelations.length),
      "data-distractor-count":String(currentStageDistractorRelations.length)
    });

    const now = performance.now();

    for(let index = 0; index < POOL_SIZE; index++){
      const motionProfile = nextBalloonMotionProfile();
      const initialMotionTime = index * 1.31;
      const initialY = balloonYForProfile(
        motionProfile,
        initialMotionTime,
        MEDIUM_BALLOON_SCALE
      );

      const config = {
        ...BALLOON_FLIGHT,
        lines:["",""],
        media:{text:"",imageData:""},
        content:null,
        scale:MEDIUM_BALLOON_SCALE,
        baseY:initialY,
        minY:motionProfile.minY,
        maxY:motionProfile.maxY,
        motionProfile,
        speedLevel:BALLOON_SPEED_LEVEL
      };

      const balloon = answerBalloon(balloons, {
        id:`answerBalloonDemo-${index}`,
        x:initialBalloonX(index),
        y:initialY,
        scale:config.scale,
        lines:config.lines,
        media:config.media,
        shadow:false
      });

      balloon.style.pointerEvents = "none";
      balloon.style.cursor = "default";
      balloon.style.display = "none";
      balloon.setAttribute("opacity","0");
      balloon.setAttribute("data-motion-profile", motionProfile.id);
      balloon.setAttribute("data-speed-multiplier", balloonSpeedMultiplier(index, 0).toFixed(2));

      const item = {
        node:balloon,
        index,
        config,
        state:createBalloonMotionState(config, index),
        speedMultiplier:balloonSpeedMultiplier(index, 0),
        speed:speedFromLevel(config.speedLevel) * balloonSpeedMultiplier(index, 0),
        verticalTempo:.92 + balloonSpeedMultiplier(index, 0) * .12,
        spawnSerial:0,
        streamSequence:0,
        streamActive:false,
        streamTriggerFired:false,
        popped:true,
        attemptPending:false,
        pendingRetryContent:null,
        resetAt:now,
        flyAway:false,
        flyAwayStartedAt:0,
        flyAwayDelay:0,
        flyAwaySpeed:0,
        flyAwayDrift:0
      };

      balloon.addEventListener("pointerdown", event => {
        event.preventDefault();
        popPooledBalloon(item, performance.now());
      });

      activeBalloons.push(item);
    }

    // البداية متدرجة: يظهر أول بالون سريعًا، ثم البقية واحدًا بعد الآخر.
    balloonStreamNextSpawnAt = now + 90;
    balloonStreamLastSpawnAt = 0;
    balloonStreamSequence = 0;
    balloonInitialFillComplete = false;
    balloonInitialDelayCursor = 0;
    balloonContinuousDelayCursor = 0;
    balloonPrioritySignature = "";
    balloonPriorityPrefetchQueue = [];
    lastSpawnedBalloonItem = null;

    startBalloonPoolLoop();
  }

  function setSvgImageHref(node, href){
    node.setAttribute("href", href);
    node.setAttributeNS("http://www.w3.org/1999/xlink", "href", href);
  }

  function ensureLocomotiveSmokeLayer(){
    if(locomotiveSmokeLayer && locomotiveSmokeLayer.isConnected){
      svg.appendChild(locomotiveSmokeLayer);
      return locomotiveSmokeLayer;
    }

    locomotiveSmokeLayer = el("g", {
      id:"locomotiveSmokeLayer",
      "pointer-events":"none"
    });
    return locomotiveSmokeLayer;
  }

  function locomotiveChimneyScreenPoint(){
    return {
      x:trainX(LOCOMOTIVE_SMOKE_CONFIG.chimneyRawX) + trainVisualOffsetX,
      y:trainY(LOCOMOTIVE_SMOKE_CONFIG.chimneyRawY)
    };
  }

  function scheduleNextLocomotiveSmoke(now){
    const range = Math.max(
      0,
      LOCOMOTIVE_SMOKE_CONFIG.intervalMaxMs - LOCOMOTIVE_SMOKE_CONFIG.intervalMinMs
    );
    locomotiveSmokeNextAt = now +
      LOCOMOTIVE_SMOKE_CONFIG.intervalMinMs +
      Math.random() * range;
  }

  function spawnLocomotiveSmoke(now){
    const layer = ensureLocomotiveSmokeLayer();
    const point = locomotiveChimneyScreenPoint();
    const config = LOCOMOTIVE_SMOKE_CONFIG;

    const outer = el("g", {
      transform:`translate(${point.x.toFixed(2)} ${point.y.toFixed(2)})`,
      opacity:".9",
      "pointer-events":"none"
    }, layer);

    const inner = el("g", {
      transform:`scale(${config.startScale})`
    }, outer);

    const smokeImage = el("image", {
      href:config.asset,
      x:-config.baseWidth / 2,
      y:-config.baseHeight / 2,
      width:config.baseWidth,
      height:config.baseHeight,
      preserveAspectRatio:"xMidYMid meet"
    }, inner);
    setSvgImageHref(smokeImage, config.asset);

    const travel = el("animateTransform", {
      attributeName:"transform",
      type:"translate",
      from:`${point.x.toFixed(2)} ${point.y.toFixed(2)}`,
      to:`${(point.x + config.driftX).toFixed(2)} ${(point.y + config.driftY).toFixed(2)}`,
      dur:`${config.durationMs}ms`,
      fill:"freeze"
    }, outer);

    const fade = el("animate", {
      attributeName:"opacity",
      values:".90;.80;.70;.56;.38;.18;0",
      keyTimes:"0;.12;.25;.42;.62;.82;1",
      dur:`${config.durationMs}ms`,
      fill:"freeze"
    }, outer);

    const grow = el("animateTransform", {
      attributeName:"transform",
      type:"scale",
      values:`${config.startScale};.40;.70;1;${config.endScale}`,
      keyTimes:"0;.18;.43;.72;1",
      dur:`${config.durationMs}ms`,
      fill:"freeze"
    }, inner);

    travel.beginElement();
    fade.beginElement();
    grow.beginElement();

    setTimeout(() => outer.remove(), config.durationMs + 180);
    scheduleNextLocomotiveSmoke(now);
  }

  function updateLocomotiveSmoke(now){
    if(trainMotionState === "done") return;

    const point = locomotiveChimneyScreenPoint();
    const chimneyVisible = point.x >= -24 && point.x <= 1304 &&
      point.y >= -30 && point.y <= 740;

    if(!chimneyVisible){
      locomotiveSmokeNextAt = 0;
      return;
    }

    if(!locomotiveSmokeNextAt){
      locomotiveSmokeNextAt = now + 180;
    }

    if(now >= locomotiveSmokeNextAt){
      spawnLocomotiveSmoke(now);
    }
  }

  function ensureScorePlaneLayer(){
    if(scorePlaneLayer && scorePlaneLayer.isConnected){
      svg.appendChild(scorePlaneLayer);
      return scorePlaneLayer;
    }

    scorePlaneLayer = el("g", {
      id:"scorePlaneLayer",
      "pointer-events":"none",
      style:"display:none"
    });
    return scorePlaneLayer;
  }

  function setScorePlaneText(score){
    if(!scorePlaneTextNode) return;
    const safeScore = Math.max(0, Math.round(Number(score) || 0));
    scorePlaneTextNode.textContent = `الدرجة ${safeScore}`;

    const digits = String(safeScore).length;
    const fontSize = digits <= 2 ? 42 : digits === 3 ? 38 : digits === 4 ? 34 : 30;
    scorePlaneTextNode.setAttribute("font-size", String(fontSize));
  }

  function cancelScorePlaneFlyover(removeLayer = false){
    scorePlaneAnimationToken += 1;

    if(scorePlaneAnimationFrame){
      cancelAnimationFrame(scorePlaneAnimationFrame);
      scorePlaneAnimationFrame = 0;
    }

    if(removeLayer){
      scorePlaneLayer?.remove();
      scorePlaneLayer = null;
      scorePlaneGroup = null;
      scorePlaneTextNode = null;

      scorePlaneLayer.style.display = "none";

  function startScorePlaneFlyover(score, onComplete){
    cancelScorePlaneFlyover(false);
    const layer = ensureScorePlaneLayer();
    layer.style.display = "";
    svg.appendChild(layer);

    const config = SCORE_PLANE_CONFIG;
    scorePlaneGroup = el("g", {

    }, layer);

      height:config.height,
      preserveAspectRatio:"xMidYMid meet",
      "pointer-events":"none"
    }, scorePlaneGroup);

    scorePlaneTextNode = el("text", {

    }, scorePlaneGroup);
    setScorePlaneText(score);

    const token = scorePlaneAnimationToken;
    const startedAt = performance.now();
    const distance = config.endX - config.startX;

    function frame(now){
      if(token !== scorePlaneAnimationToken) return;

      const progress = clamp((now - startedAt) / config.durationMs, 0, 1);
      const x = config.startX + distance * progress;
      scorePlaneGroup?.setAttribute("transform", `translate(${x.toFixed(2)} ${config.y})`);

      if(progress < 1){
        scorePlaneAnimationFrame = requestAnimationFrame(frame);
        return;
      }

      scorePlaneAnimationFrame = 0;
      if(scorePlaneLayer) scorePlaneLayer.style.display = "none";
      if(typeof onComplete === "function") onComplete();
    }

    scorePlaneAnimationFrame = requestAnimationFrame(frame);
  }

  function stopParallaxLoop(){
    if(parallaxAnimationFrame){
      cancelAnimationFrame(parallaxAnimationFrame);
      parallaxAnimationFrame = 0;
    }
    parallaxLastFrameTime = 0;
  }

  function parallaxTargetSpeed(record, mode = parallaxMotionMode){
    if(!record) return 0;
    if(record.key === "middle" || record.key === "bottom"){
      return mode === "transition"
        ? PARALLAX_MOTION_CONFIG.transitionSpeed
        : record.baseSpeed;
    }
    return record.baseSpeed;
  }

  function setParallaxMotionMode(mode, durationMs = 0){
    parallaxMotionMode = mode === "gameplay" ? "gameplay" : "transition";
    const duration = Math.max(0, Number(durationMs) || 0);
    const startedAt = performance.now();

    const entries = parallaxLayerRecords.map(record => ({
      record,
      from:Number(record.currentSpeed ?? record.baseSpeed ?? record.speed) || 0,
      to:parallaxTargetSpeed(record, parallaxMotionMode)
    }));

    if(!duration){
      entries.forEach(entry => {
        entry.record.currentSpeed = entry.to;
      });
      parallaxSpeedTween = null;
      return;
    }

    parallaxSpeedTween = {startedAt, duration, entries};
  }

  function updateParallaxSpeedTween(now){
    const tween = parallaxSpeedTween;
    if(!tween) return;

    const raw = clamp((now - tween.startedAt) / tween.duration, 0, 1);
    const eased = raw < .5
      ? 2 * raw * raw
      : 1 - Math.pow(-2 * raw + 2, 2) / 2;

    tween.entries.forEach(entry => {
      entry.record.currentSpeed = entry.from + (entry.to - entry.from) * eased;
    });

    if(raw >= 1){
      tween.entries.forEach(entry => {
        entry.record.currentSpeed = entry.to;
      });
      parallaxSpeedTween = null;
    }
  }

  function getCurrentParallaxSpeed(key){
    const record = parallaxLayerRecords.find(item => item.key === key);
    if(record) return Number(record.currentSpeed ?? record.baseSpeed ?? record.speed) || 0;
    const config = PARALLAX_CONFIG[key];
    if(!config) return 0;
    if((key === "middle" || key === "bottom") && parallaxMotionMode === "transition"){
      return PARALLAX_MOTION_CONFIG.transitionSpeed;
    }
    return Number(config.speed) || 0;
  }

  function applyParallaxLayerPosition(record){
    if(!record || !record.images || !record.images.length) return;

    const wrapWidth = record.width;
    const normalized = ((record.offset % wrapWidth) + wrapWidth) % wrapWidth;
    const firstX = -normalized;
    const overlap = 1;

    record.images[0].setAttribute("x", firstX.toFixed(2));
    record.images[1].setAttribute("x", (firstX + wrapWidth - overlap).toFixed(2));
  }

  function updateParallaxLayers(deltaMs, now){
    updateParallaxSpeedTween(now);
    const dt = deltaMs / 1000;

    parallaxLayerRecords.forEach(record => {
      // السرعة الحالية قد تكون بطيئة أثناء الانتقال أو تعود تدريجيًا إلى السرعة الطبيعية.
      record.offset += (Number(record.currentSpeed) || 0) * dt;
      applyParallaxLayerPosition(record);
    });
  }

  function parallaxFrameLoop(now){
    if(!parallaxLastFrameTime){
      parallaxLastFrameTime = now;
    }

    const delta = Math.min(40, now - parallaxLastFrameTime);
    parallaxLastFrameTime = now;

    if(!document.hidden){
      updateParallaxLayers(delta, now);
      updateLocomotiveSmoke(now);
    }

    parallaxAnimationFrame = requestAnimationFrame(parallaxFrameLoop);
  }

  function startParallaxLoop(){
    if(parallaxAnimationFrame) return;
    parallaxLastFrameTime = 0;
    parallaxAnimationFrame = requestAnimationFrame(parallaxFrameLoop);
  }

  function createParallaxLayer(parent, config){
    const layer = el("g", {
      id:`parallax-${config.key}`,
      opacity:String(config.opacity ?? 1),
      "pointer-events":"none"
    }, parent);

    const images = [];
    for(let i = 0; i < 2; i += 1){
      const image = el("image", {
        x:String(i * config.width),
        y:String(config.y),
        width:String(config.width),
        height:String(config.height),
        preserveAspectRatio:config.preserveAspectRatio || "none"
      }, layer);
      setSvgImageHref(image, config.href);
      images.push(image);
    }

    const baseSpeed = Number(config.speed) || 0;
    const initialSpeed = (config.key === "middle" || config.key === "bottom") && parallaxMotionMode === "transition"
      ? PARALLAX_MOTION_CONFIG.transitionSpeed
      : baseSpeed;

    const record = {
      ...config,
      layer,
      images,
      baseSpeed,
      currentSpeed:initialSpeed,
      offset:0
    };

    parallaxLayerRecords.push(record);
    applyParallaxLayerPosition(record);
    return record;
  }

  function animateLevelSignTo(targetX, onComplete){
    if(!levelSignGroup){
      if(typeof onComplete === "function") onComplete();
      return;
    }

    cancelLevelSignAnimation();
    const token = levelSignAnimationToken;
    const direction = targetX >= levelSignX ? 1 : -1;
    let lastTime = performance.now();

    levelSignGroup.style.display = "";

    function frame(now){
      if(token !== levelSignAnimationToken) return;

      const delta = Math.min(40, Math.max(0, now - lastTime));
      lastTime = now;
      const groundSpeed = Math.max(1, getCurrentParallaxSpeed("bottom"));
      const step = groundSpeed * (delta / 1000);
      const remaining = Math.abs(targetX - levelSignX);

      if(remaining <= step + .01){
        levelSignAnimationFrame = 0;
        setLevelSignPosition(targetX);
        if(typeof onComplete === "function") onComplete();
        return;
      }

      setLevelSignPosition(levelSignX + direction * step);
      levelSignAnimationFrame = requestAnimationFrame(frame);
    }

    levelSignAnimationFrame = requestAnimationFrame(frame);
  }

  function getStageAnswerLabel(answerIndex){
    return TRAIN_STAGE_LABELS[answerIndex % TRAIN_STAGE_LABELS.length];

  function stageAnswerCapacity(stageNumber){
    const pattern = TRAIN_STAGE_PATTERNS[stageNumber - 1] || TRAIN_STAGE_PATTERNS[TRAIN_STAGE_PATTERNS.length - 1];
    return pattern.filter(token => token === "A").length;
  }

  function stageRuntimeWagonStart(stageNumber){
    let total = 0;
    for(let index = 1; index < stageNumber; index++) total += stageAnswerCapacity(index);
    return total;
  }

  function selectRuntimeWagonsForStage(stageNumber,capacity){
    if(!TRAIN_RUNTIME_WAGONS.length || capacity <= 0) return [];
    const count = Math.min(capacity,TRAIN_RUNTIME_WAGONS.length);
    const start = stageRuntimeWagonStart(stageNumber) % TRAIN_RUNTIME_WAGONS.length;
    return Array.from({length:count},(_,offset)=>TRAIN_RUNTIME_WAGONS[(start + offset) % TRAIN_RUNTIME_WAGONS.length]);
  }

  function buildTrainCarsForStage(stageNumber){
    const pattern = TRAIN_STAGE_PATTERNS[stageNumber - 1] || TRAIN_STAGE_PATTERNS[TRAIN_STAGE_PATTERNS.length - 1];
    const runtimeWagons = TRAIN_ANSWER_LOGIC_ENABLED
      ? selectRuntimeWagonsForStage(stageNumber,stageAnswerCapacity(stageNumber))
      : [];
    let answerCursor = 0;

    return pattern.map(token => {
      if(token === "A"){
        if(TRAIN_ANSWER_LOGIC_ENABLED){
          const runtimeWagon = runtimeWagons[answerCursor];
          answerCursor += 1;
          if(!runtimeWagon) return {type:"passenger"};
          return {
            type:"answer",
            text:runtimeWagon.media.text || "",
            media:runtimeWagon.media,
            wagonId:runtimeWagon.wagonId
          };
        }

        const text = getStageAnswerLabel(answerCursor);
        answerCursor += 1;
        return {type:"answer", text, media:{text,imageData:""}, wagonId:`demo-wagon-${stageNumber}-${answerCursor}`};
      }

      if(token === "P") return {type:"passenger"};
      if(token === "C") return {type:"coal"};
      return null;
    }).filter(Boolean);
  }

  function rebuildStageAnswerLogic(){
    acceptedBalloonIds.clear();
    acceptedBalloonIdsByWagon.clear();
    expectedBalloonIdsByWagon.clear();
    stageBalloonCursor = 0;
    stageBalloonSpawnCounter = 0;
    stageBalloonPriorityCursor = 0;
    stageCorrectWagonCursor = 0;
    balloonPrioritySignature = "";
    balloonPriorityPrefetchQueue = [];
    recentDisplayedBalloonIds.length = 0;

    if(!TRAIN_ANSWER_LOGIC_ENABLED){
      currentStageRelations = [];
      currentStageRequiredRelations = [];
      currentStageDistractorRelations = [];
      currentStageActiveWagonIds = [];
      stageBalloonDeck = [];
      return;
    }

    const activeWagonIds = new Set(TRAIN_CARS
      .filter(car => car?.type === "answer" && car.wagonId)
      .map(car => car.wagonId));

    currentStageActiveWagonIds = shuffledTrainRelations(Array.from(activeWagonIds));
    currentStageRequiredRelations = TRAIN_RUNTIME_RELATIONS.filter(entry => activeWagonIds.has(entry.targetWagonId));
    currentStageDistractorRelations = TRAIN_RUNTIME_RELATIONS.filter(entry => !activeWagonIds.has(entry.targetWagonId));

    currentStageRequiredRelations.forEach(entry => {
      const expected = expectedBalloonIdsByWagon.get(entry.targetWagonId) || new Set();
      expected.add(entry.balloonId);
      expectedBalloonIdsByWagon.set(entry.targetWagonId,expected);
    });

    // نبني بنكًا عشوائيًا من جميع إجابات المعلم.
    // الإجابة تبقى في البنك بعد نجاحها، ويمكن أن تسقط صحيحة عدة مرات لاحتساب نقاط مستقبلًا.
    const guaranteed = [];
    const remainingRequired = [];

    currentStageActiveWagonIds.forEach(wagonId => {
      const relations = shuffledTrainRelations(
        currentStageRequiredRelations.filter(entry => entry.targetWagonId === wagonId)
      );
      if(relations.length) guaranteed.push(relations.shift());
      remainingRequired.push(...relations);
    });

    stageBalloonDeck = [
      ...shuffledTrainRelations(guaranteed),
      ...shuffledTrainRelations([
        ...remainingRequired,
        ...currentStageDistractorRelations
      ])
    ];
    currentStageRelations = stageBalloonDeck.slice();
  }

  function updateQuestionWagonIndices(){
    QUESTION_WAGON_INDICES = TRAIN_CARS
      .map((car, index) => car && car.type === "answer" ? index : null)
      .filter(index => index !== null);
  }

  function applyTrainStage(stageIndex){
    currentStageIndex = clamp(Number(stageIndex) || 0, 0, MAX_TRAIN_STAGE - 1);
    const stageNumber = currentStageIndex + 1;

    TRAIN_CARS = buildTrainCarsForStage(stageNumber);
    updateQuestionWagonIndices();
    rebuildStageAnswerLogic();

    currentTrainStage = {
      number:stageNumber,
      cars:TRAIN_CARS.slice(),
      questionIndices:QUESTION_WAGON_INDICES.slice()
    };
  }

  function hasNextTrainStage(){
    return currentStageIndex < MAX_TRAIN_STAGE - 1;
  }

  function disposeFinishedStageRuntime(){
    pendingMatterSpawns.length = 0;
    matterBoxes.slice().forEach(item => cleanupMatterBox(item, true));

    if(isMatterReady() && matterEngine && matterEngine.world){
      Matter.World.clear(matterEngine.world, false);
    }

    matterBoxes.length = 0;
    matterStaticBodies.length = 0;
    settledVisualMatterBoxes.length = 0;
    collisionMap.length = 0;
    activeFallingBoxes = 0;
    matterAccumulator = 0;
    matterLastTime = 0;

    settledBoxes.splice(0, settledBoxes.length);
    Object.keys(settledBoxesByWagon).forEach(key => delete settledBoxesByWagon[key]);
    activeBalloons.splice(0, activeBalloons.length);

    trainVisualParts.splice(0, trainVisualParts.length);
    trainCoverVisualParts.splice(0, trainCoverVisualParts.length);
    trainCarRegistry.splice(0, trainCarRegistry.length);

    // الخلفية والسكة دائمتان بين المراحل؛ نحذف عناصر المرحلة فقط.
    trainPositionGroup?.remove();
    wagonDropCoverPositionGroup?.remove();
    fallingObjectsLayer?.remove();
    feedbackEffectsLayer?.remove();
    collisionDebugLayer?.remove();
    svg.querySelector("#balloonsLayer")?.remove();

    trainPositionGroup = null;
    wagonDropCoverPositionGroup = null;
    wagonDropCoverLayer = null;
    wagonForegroundCoverLayer = null;
    fallingObjectsLayer = null;
    feedbackEffectsLayer = null;
    settledObjectsLayer = null;
    collisionDebugLayer = null;
    // لا نحذف طبقة الدخان؛ الغيمات الموجودة تكمل تلاشيها طبيعيًا بين المستويات.
    // لا نحذف parallaxBackGroup ولا parallaxLayerRecords، فتستمر الحركة بلا انقطاع.
  }

  function formatCountdownTime(totalSeconds){
    const seconds = Math.max(0,Math.ceil(Number(totalSeconds) || 0));
    const minutesPart = Math.floor(seconds / 60);
    const secondsPart = seconds % 60;
    return `${minutesPart}:${String(secondsPart).padStart(2,"0")}`;
  }

  function ensureGameHud(){
    if(gameHudLayer?.isConnected) return;

    gameHudLayer = el("g", {
      id:"gameHudLayer",
      "pointer-events":"none"
    });

    if(TRAIN_COUNTDOWN_ENABLED){
      gameHudTimerText = el("text", {
        x:18,
        y:31,
        fill:"#ffffff",
        stroke:"#294b76",
        "stroke-width":3,
        "paint-order":"stroke fill",
        "font-size":27,
        "font-weight":1000,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"ltr"
      }, gameHudLayer);

      el("rect", {
        x:82,
        y:10,
        width:930,
        height:21,
        rx:2,
        fill:"rgba(35,62,104,.72)"
      }, gameHudLayer);

      gameHudTimerBar = el("rect", {
        x:82,
        y:10,
        width:930,
        height:21,
        rx:2,
        fill:"#ffffff"
      }, gameHudLayer);
    }

    if(TRAIN_ATTEMPTS_ENABLED){
      const attemptsGroup = el("g", {transform:"translate(1040 6)"}, gameHudLayer);
      const heart = el("text", {
        x:0,
        y:27,
        fill:"#e8295f",
        stroke:"#7b1738",
        "stroke-width":2,
        "paint-order":"stroke fill",
        "font-size":28,
        "font-weight":1000
      }, attemptsGroup);
      heart.textContent = "♥";

      gameHudAttemptsText = el("text", {
        x:34,
        y:27,
        fill:"#ffffff",
        stroke:"#294b76",
        "stroke-width":3,
        "paint-order":"stroke fill",
        "font-size":25,
        "font-weight":1000,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"ltr"
      }, attemptsGroup);
    }

    lastHudTimerText = "";
    lastHudTimerBarWidth = -1;
    lastHudAttemptsText = "";
    updateGameHud();
  }

  function updateGameHud(){
    if(TRAIN_COUNTDOWN_ENABLED && gameHudTimerText && gameHudTimerBar){
      const remainingSeconds = stageTimerRemainingMs / 1000;
      const ratio = clamp(
        stageTimerRemainingMs / Math.max(1,TRAIN_COUNTDOWN_SECONDS * 1000),
        0,
        1
      );
      const timerText = formatCountdownTime(remainingSeconds);
      if(timerText !== lastHudTimerText){
        gameHudTimerText.textContent = timerText;
        lastHudTimerText = timerText;
      }

      const barWidth = Math.round(930 * ratio * 2) / 2;
      if(barWidth !== lastHudTimerBarWidth){
        gameHudTimerBar.setAttribute("width",String(barWidth));
        lastHudTimerBarWidth = barWidth;
      }
    }

    if(TRAIN_ATTEMPTS_ENABLED && gameHudAttemptsText){
      const attemptsText = `${attemptsRemaining}/${TRAIN_ATTEMPTS_TOTAL}`;
      if(attemptsText !== lastHudAttemptsText){
        gameHudAttemptsText.textContent = attemptsText;
        lastHudAttemptsText = attemptsText;
      }
    }
  }

  function stopStageCountdown(){
    stageTimerRunning = false;
    if(stageTimerFrame){
      cancelAnimationFrame(stageTimerFrame);
      stageTimerFrame = 0;
    }
  }

  function resetStageCountdown(){
    stopStageCountdown();
    stageTimerRemainingMs = TRAIN_COUNTDOWN_SECONDS * 1000;
    stageTimerStartedAt = 0;
    updateGameHud();
  }

  function startStageCountdown(){
    if(!TRAIN_COUNTDOWN_ENABLED || stageTimerRunning || stageCompleteTriggered || gameOverByAttempts) return;

    stageTimerRunning = true;
    stageTimerStartedAt = performance.now();
    const startingRemaining = stageTimerRemainingMs || TRAIN_COUNTDOWN_SECONDS * 1000;

    function frame(now){
      if(!stageTimerRunning) return;

      const elapsed = now - stageTimerStartedAt;
      stageTimerRemainingMs = Math.max(0,startingRemaining - elapsed);
      updateGameHud();

      if(stageTimerRemainingMs <= 0){
        stopStageCountdown();
        handleStageTimeExpired();
        return;
      }

      stageTimerFrame = requestAnimationFrame(frame);
    }

    stageTimerFrame = requestAnimationFrame(frame);
  }

  function handleStageTimeExpired(){
    if(stageCompleteTriggered || gameOverByAttempts) return;
    requestTrainExit();
  }

  function showAttemptsEndedMessage(){
    const layer = feedbackEffectsLayer || svg;
    const group = el("g", {
      id:"attemptsEndedMessage",
      transform:"translate(640 300)",
      "pointer-events":"none"
    }, layer);

    el("rect", {
      x:-220,
      y:-62,
      width:440,
      height:124,
      rx:28,
      fill:"rgba(32,46,72,.90)",
      stroke:"#ffffff",
      "stroke-width":4
    }, group);

    const text = el("text", {
      x:0,
      y:8,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffffff",
      "font-size":42,
      "font-weight":1000,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, group);
    text.textContent = "انتهت المحاولات";
  }

  async function endGameByAttempts(){
    if(gameOverByAttempts) return;
    gameOverByAttempts = true;
    stopStageCountdown();
    stageCompleteTriggered = true;
    trainExitSequencePending = true;
    showAttemptsEndedMessage();
    const whistleAudio = playTrainSound("whistle");
    await waitForAudioToFinish(whistleAudio,12000);
    trainMotionState = "exiting";
    setParallaxMotionMode("transition", PARALLAX_MOTION_CONFIG.rampDownMs);
    releaseStageBalloonsUpward();
    clearActiveFallingMatterBoxes();

    animateTrainTo(getSafeTrainExitOffset(), TRAIN_MOTION.exitDuration, "done", () => {
      trainMotionState = "done";
      trainExitSequencePending = false;
      stopTrainMovementSound();
    });
  }

  function loseAttempt(){
    if(!TRAIN_ATTEMPTS_ENABLED || gameOverByAttempts || attemptsRemaining <= 0) return;
    attemptsRemaining = Math.max(0,attemptsRemaining - 1);
    updateGameHud();
    if(attemptsRemaining <= 0) endGameByAttempts();
  }

  function scheduleNextTrainStage(){
    if(stageTransitionTimer){
      clearTimeout(stageTransitionTimer);
      stageTransitionTimer = 0;
    }

    const scheduledGeneration = stageGeneration;

    // تظهر الطائرة مباشرة بعد اختفاء القطار وتعرض الدرجة التراكمية الحالية.
    if(!hasNextTrainStage()){
      trainMotionState = "done";
      startScorePlaneFlyover(totalScore,()=>{
        showTrainEndCelebration();
      });
      return;
    }

    startScorePlaneFlyover(totalScore);

    const nextStageIndex = currentStageIndex + 1;
    const nextStageNumber = nextStageIndex + 1;

    stageTransitionTimer = setTimeout(() => {
      stageTransitionTimer = 0;
      if(scheduledGeneration !== stageGeneration) return;

      // تدخل لافتة المستوى التالي والطائرة تعبر السماء في الوقت نفسه.
      bringLevelSignIn(nextStageNumber, () => {
        if(scheduledGeneration !== stageGeneration) return;
        stageTransitionTimer = setTimeout(() => {
          stageTransitionTimer = 0;
          if(scheduledGeneration !== stageGeneration) return;

          // عند بدء ظهور القطار الجديد تكون الطائرة قد غادرت جهة اليمين.
          cancelScorePlaneFlyover(false);
          startTrainStage(nextStageIndex);
        }, LEVEL_SIGN_CONFIG.centerHoldMs);
      });
    }, STAGE_CHANGE_DELAY);
  }

  function resetStageRuntime(){
    if(trainAnimationFrame){
      cancelAnimationFrame(trainAnimationFrame);
      trainAnimationFrame = 0;
    }

    if(stageTransitionTimer){
      clearTimeout(stageTransitionTimer);
      stageTransitionTimer = 0;
    }

    completedQuestionWagons.clear();
    acceptedBalloonIds.clear();
    acceptedBalloonIdsByWagon.clear();
    recentDisplayedBalloonIds.length = 0;

    trainVisualOffsetX = TRAIN_MOTION.enterOffset;

    // الفيزياء تبدأ مع القطار خارج الشاشة، ثم تتابع حركته فريمًا بفريم.
    // هذا يسمح باللعب أثناء الحركة بدون فصل بين الشكل والتصادم.
    trainPhysicsOffsetX = TRAIN_MOTION.enterOffset;
    trainMotionState = "entering";
    activeQuestionPointer = 0;
    stageCompleteTriggered = false;
    trainExitSequencePending = false;
    lastCorrectDropAudio = null;
    pendingTrainProgressReview = false;
    resetStageCountdown();

    pendingMatterSpawns.length = 0;
    matterBoxes.slice().forEach(item => cleanupMatterBox(item, true));
    matterBoxes.length = 0;
    matterStaticBodies.length = 0;
    settledVisualMatterBoxes.length = 0;
    activeFallingBoxes = 0;

    settledBoxes.splice(0, settledBoxes.length);
    Object.keys(settledBoxesByWagon).forEach(key => delete settledBoxesByWagon[key]);

    activeBalloons.splice(0, activeBalloons.length);
    balloonLoopLastTime = 0;
    balloonStreamNextSpawnAt = 0;
    balloonStreamLastSpawnAt = 0;
    balloonStreamSequence = 0;
    balloonInitialFillComplete = false;
    balloonInitialDelayCursor = 0;
    balloonContinuousDelayCursor = 0;
    balloonPrioritySignature = "";
    balloonPriorityPrefetchQueue = [];
    lastSpawnedBalloonItem = null;
    locomotiveSmokeNextAt = 0;
    matterLastTime = 0;
    matterAccumulator = 0;

    trainVisualParts.splice(0, trainVisualParts.length);
    trainCoverVisualParts.splice(0, trainCoverVisualParts.length);
    trainCarRegistry.splice(0, trainCarRegistry.length);
  }

  function startTrainStage(stageIndex){
    cancelScorePlaneFlyover(false);
    stageGeneration += 1;
    applyTrainStage(stageIndex);
    resetStageRuntime();
    build();
  }
