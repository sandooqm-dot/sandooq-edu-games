<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 142</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bfcae6;
      --sky-mid:#dce3f2;
      --sand:#d7a464;
      --sand2:#bd7f42;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 120px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:120px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,#ead5ac 46%,var(--sand) 72%,var(--sand2) 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:10;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      pointer-events:auto;
    }

    .train-wheel{
      transform-box:fill-box;
      transform-origin:center;
      animation:wheelSpin .55s linear infinite;
    }

    .train-wheel.is-offscreen{
      animation-play-state:paused;
    }

    .train-idle-motion{
      transform-box:fill-box;
      transform-origin:center;
      animation:trainIdleMotion 3.15s linear infinite;
      will-change:transform;
    }

    @keyframes trainIdleMotion{
      0%{transform:translateX(0)}
      10%{transform:translateX(2px)}
      20%{transform:translateX(4.4px)}
      30%{transform:translateX(6.4px)}
      40%{transform:translateX(7px)}
      50%{transform:translateX(5.2px)}
      60%{transform:translateX(2.4px)}
      70%{transform:translateX(-1px)}
      80%{transform:translateX(-3.8px)}
      90%{transform:translateX(-2px)}
      100%{transform:translateX(0)}
    }

    @keyframes wheelSpin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
    /* start-end-overlay-v1: بوابة تشغيل متزامنة مع الصوت + نهاية موحدة. */
    .activity-overlay{
      position:absolute;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:220;
      overflow:hidden;
      padding:clamp(18px,4vw,44px);
      direction:rtl;
      background:rgba(17,17,17,.12);
      pointer-events:none;
    }

    .activity-overlay.is-visible{
      display:flex;
    }

    .activity-overlay .celebration-card{
      position:relative;
      width:min(520px,86vw);
      min-height:clamp(260px,44vh,420px);
      border:2px solid rgba(255,255,255,.86);
      border-radius:28px;
      background:rgba(255,255,255,.78);
      -webkit-backdrop-filter:blur(9px);
      backdrop-filter:blur(9px);
      box-shadow:0 18px 45px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.72);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:clamp(22px,4.6vw,44px);
      pointer-events:auto;
      animation:activityCelebrationPop .62s cubic-bezier(.2,1.12,.22,1) both;
      overflow:hidden;
    }

    .activity-overlay .celebration-card::before{
      content:"";
      position:absolute;
      width:92%;
      aspect-ratio:1/1;
      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(239,213,83,.32) 0%,rgba(239,213,83,.14) 34%,rgba(255,255,255,0) 68%);
      animation:activityCelebrationGlow 2.4s ease-in-out infinite;
      pointer-events:none;
    }

    .activity-overlay .celebration-icon{
      position:relative;
      width:clamp(92px,17vw,144px);
      height:clamp(92px,17vw,144px);
      margin-bottom:clamp(12px,2.6vw,20px);
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
      animation:activityIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s;
      z-index:1;
    }

    .activity-overlay .celebration-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#102b57;
      font-size:clamp(34px,6.2vw,64px);
      line-height:1.05;
      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    .activity-overlay .celebration-subtitle{
      position:relative;
      z-index:1;
      margin:clamp(8px,1.7vw,14px) 0 0;
      color:#26364a;
      font-size:clamp(17px,2.7vw,28px);
      line-height:1.35;
      font-weight:800;
    }

    .activity-overlay .celebration-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,2.2vw,20px);
      margin-top:clamp(22px,4vw,34px);
      flex-wrap:wrap;
    }

    .activity-overlay .celebration-actions button{
      min-width:clamp(118px,18vw,178px);
      height:clamp(44px,6.4vh,58px);
      border:3px solid #111;
      border-radius:15px;
      font-size:clamp(17px,2.5vw,25px);
      font-weight:900;
      line-height:1;
      padding:0 clamp(20px,3vw,32px);
      box-shadow:0 5px 0 rgba(0,0,0,.22);
      cursor:pointer;
      white-space:nowrap;
    }

    .activity-overlay .celebration-actions button:active{
      transform:translateY(2px);
      box-shadow:0 3px 0 rgba(0,0,0,.22);
    }

    .activity-overlay .restart-btn{
      background:linear-gradient(180deg,#2fa7f2 0%,#1688d3 56%,#0d6fb4 100%);
      color:#fff;
    }

    .activity-overlay .home-btn{
      background:linear-gradient(180deg,#ffe56d 0%,#efd553 58%,#dfc13f 100%);
      color:#111;
    }

    .activity-overlay .celebration-confetti{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .activity-overlay .celebration-confetti span{
      position:absolute;
      top:-12vh;
      width:clamp(8px,1.2vw,14px);
      height:clamp(14px,2vw,24px);
      border-radius:4px;
      background:var(--confetti-color,#efd553);
      opacity:.9;
      transform:rotate(var(--confetti-rotate,0deg));
      animation:activityConfettiFall var(--confetti-duration,4.4s) linear infinite;
      animation-delay:var(--confetti-delay,0s);
    }

    .activity-overlay .celebration-spark{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 18px rgba(239,213,83,.86);
      animation:activitySparkTwinkle 1.8s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
    }

    .activity-overlay .spark-one{left:18%;top:26%;animation-delay:.1s}
    .activity-overlay .spark-two{right:17%;top:31%;animation-delay:.55s}
    .activity-overlay .spark-three{left:24%;bottom:24%;animation-delay:.85s}
    .activity-overlay .spark-four{right:23%;bottom:27%;animation-delay:1.15s}

    .activity-start-card{
      min-height:clamp(250px,40vh,370px) !important;
    }

    .activity-start-btn{
      min-width:clamp(150px,23vw,220px) !important;
    }

    .game-page.activity-ended .stage,
    .game-page.activity-ended .fixed-controls,
    .wheel-page.activity-ended .wheel-stage,
    .wheel-page.activity-ended .fixed-controls,
    .wheel-page.activity-ended .selected-result{
      visibility:hidden !important;
      pointer-events:none !important;
    }

    @keyframes activityCelebrationPop{
      0%{opacity:0;transform:scale(.82) translateY(20px)}
      70%{opacity:1;transform:scale(1.035) translateY(0)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }

    @keyframes activityIconPop{
      0%{opacity:0;transform:scale(.5) rotate(-12deg)}
      72%{opacity:1;transform:scale(1.12) rotate(3deg)}
      100%{opacity:1;transform:scale(1) rotate(0)}
    }

    @keyframes activityCelebrationGlow{
      0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(.92)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
    }

    @keyframes activityConfettiFall{
      0%{transform:translate3d(0,-12vh,0) rotate(var(--confetti-rotate,0deg));opacity:0}
      9%{opacity:.95}
      100%{transform:translate3d(var(--confetti-drift,0px),112vh,0) rotate(calc(var(--confetti-rotate,0deg) + 680deg));opacity:0}
    }

    @keyframes activitySparkTwinkle{
      0%,100%{opacity:.25;transform:scale(.72)}
      45%{opacity:1;transform:scale(1.22)}
    }

    @media(max-width:430px){
      .activity-overlay .celebration-card{
        width:min(360px,88vw);
        min-height:clamp(250px,42vh,360px);
        border-radius:24px;
      }

      .activity-overlay .celebration-actions{
        gap:10px;
      }

      .activity-overlay .celebration-actions button{
        min-width:118px;
        height:42px;
        font-size:16px;
        border-radius:12px;
        padding:0 18px;
      }
    }

    /* open-box-v75: البداية والنهاية مطابقتان للعجلة في الحجم والحركة والتوقيت. */
    .start-gate .celebration-card,
    #endCelebration .finish-card{
      width:min(390px,82vw) !important;
      min-height:0 !important;
      max-height:calc(100dvh - max(20px,var(--safe-top)) - max(20px,var(--safe-bottom))) !important;
      padding:clamp(16px,2.8vw,24px) !important;
      border-radius:clamp(20px,2.4vw,26px) !important;
    }
    .start-gate .celebration-icon,
    #endCelebration .finish-trophy{
      width:clamp(76px,12vw,106px) !important;
      height:clamp(76px,12vw,106px) !important;
      margin-bottom:clamp(6px,1.2vw,10px) !important;
    }
    .start-gate .celebration-title,
    #endCelebration .finish-title{
      font-size:clamp(30px,4.8vw,48px) !important;
      line-height:1.02 !important;
    }
    .start-gate .celebration-subtitle,
    #endCelebration .finish-subtitle{
      margin-top:clamp(6px,1.1vw,10px) !important;
      font-size:clamp(15px,2.1vw,22px) !important;
      line-height:1.25 !important;
    }
    .start-gate .celebration-actions,
    #endCelebration .finish-actions{
      margin-top:clamp(14px,2.2vw,20px) !important;
      gap:clamp(8px,1.2vw,12px) !important;
      flex-wrap:nowrap !important;
    }
    .start-gate .activity-start-btn{
      min-width:clamp(136px,20vw,184px) !important;
      height:clamp(40px,5.5vh,48px) !important;
      font-size:clamp(16px,2.1vw,21px) !important;
      padding-inline:clamp(16px,2.4vw,24px) !important;
    }
    #endCelebration .finish-actions button{
      min-width:clamp(104px,15vw,145px) !important;
      height:clamp(40px,5.5vh,48px) !important;
      font-size:clamp(15px,2vw,20px) !important;
      padding-inline:clamp(12px,1.8vw,20px) !important;
    }

    .start-gate .celebration-card{animation:startCardPop .62s cubic-bezier(.2,1.12,.22,1) both !important}
    .start-gate .celebration-card::before{animation:startGlow 2.4s ease-in-out infinite !important}
    .start-gate .celebration-icon{animation:startIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s !important}
    .start-gate .celebration-spark{animation:startSpark 1.8s ease-in-out infinite !important}

    #endCelebration{
      background:rgba(17,17,17,.14);
      z-index:220;
    }
    #endCelebration .finish-card{
      animation:none;
      opacity:0;
      transform:translate3d(0,18px,0) scale(.965);
      transform-origin:center;
    }
    .train-page.ended #endCelebration .finish-card{animation:finishPanelIn .52s cubic-bezier(.2,.9,.2,1) both}
    #endCelebration .finish-trophy{
      animation:none !important;
      opacity:0;
      transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);
      transform-origin:center;
      filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.12));
      will-change:transform,opacity,filter;
    }
    #endCelebration.finish-sequence-start .finish-trophy{animation:finishTrophyArrival 2.52s cubic-bezier(.16,.82,.18,1) both !important}
    #endCelebration .finish-title,
    #endCelebration .finish-subtitle{visibility:hidden;opacity:0;will-change:transform,opacity,filter}
    #endCelebration.finish-message-in .finish-title{visibility:visible;animation:finishTitleBurst .68s cubic-bezier(.16,1.22,.2,1) both}
    #endCelebration.finish-message-in .finish-subtitle{visibility:visible;animation:finishSubtitleBurst .62s cubic-bezier(.18,1.08,.2,1) both .055s}
    #endCelebration .finish-actions{
      visibility:hidden;
      opacity:0;
      transform:translate3d(0,28px,0) scale(.94);
      pointer-events:none;
      will-change:transform,opacity;
    }
    #endCelebration.finish-actions-in .finish-actions{visibility:visible;pointer-events:auto;animation:finishActionsRise .62s cubic-bezier(.18,1.08,.2,1) both}
    #endCelebration .finish-confetti{opacity:0;transition:none}
    #endCelebration .finish-confetti span{animation:none;opacity:0}
    #endCelebration.finish-confetti-on .finish-confetti{opacity:1}
    #endCelebration.finish-confetti-on .finish-confetti span{
      animation:finishConfettiBurst 2.45s cubic-bezier(.18,.72,.22,1) 1 both;
      animation-delay:0s !important;
    }
    #endCelebration.finish-confetti-on .finish-confetti span:nth-child(3n+2){animation-delay:.055s !important}
    #endCelebration.finish-confetti-on .finish-confetti span:nth-child(3n){animation-delay:.11s !important}

    @keyframes startCardPop{0%{opacity:0;transform:scale(.82) translateY(20px)}70%{opacity:1;transform:scale(1.035) translateY(0)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes startIconPop{0%{opacity:0;transform:scale(.5) rotate(-12deg)}72%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes startGlow{0%,100%{opacity:.72;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
    @keyframes startSpark{0%,100%{opacity:.25;transform:scale(.72)}45%{opacity:1;transform:scale(1.22)}}
    @keyframes finishPanelIn{0%{opacity:0;transform:translate3d(0,18px,0) scale(.965)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    @keyframes finishTrophyArrival{0%{opacity:0;transform:translate3d(185%,-82%,0) scale(.14) rotate(34deg);filter:blur(9px) drop-shadow(0 8px 14px rgba(0,0,0,.10))}18%{opacity:1;filter:blur(1.5px) drop-shadow(0 10px 18px rgba(0,0,0,.16))}62%{opacity:1;transform:translate3d(-10%,7%,0) scale(1.13) rotate(-7deg);filter:blur(0) drop-shadow(0 10px 18px rgba(0,0,0,.17))}77%{transform:translate3d(5%,-4%,0) scale(.965) rotate(3deg)}89%{transform:translate3d(-2%,2%,0) scale(1.025) rotate(-1.2deg)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:blur(0) drop-shadow(0 8px 14px rgba(0,0,0,.15))}}
    @keyframes finishTitleBurst{0%{opacity:0;transform:translate3d(0,24px,0) scale(.22) rotate(-3deg);filter:blur(8px)}55%{opacity:1;transform:translate3d(0,-3px,0) scale(1.16) rotate(1deg);filter:blur(0)}78%{transform:translate3d(0,1px,0) scale(.97) rotate(-.35deg)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0);filter:blur(0)}}
    @keyframes finishSubtitleBurst{0%{opacity:0;transform:translate3d(0,18px,0) scale(.72);filter:blur(5px)}62%{opacity:1;transform:translate3d(0,-2px,0) scale(1.055);filter:blur(0)}100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
    @keyframes finishActionsRise{0%{opacity:0;transform:translate3d(0,28px,0) scale(.94)}70%{opacity:1;transform:translate3d(0,-3px,0) scale(1.02)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    @keyframes finishConfettiBurst{0%{opacity:0;transform:translate3d(0,-9vh,0) rotate(var(--confetti-rotate,0deg)) scale(.55)}8%{opacity:.96}72%{opacity:.92}100%{opacity:0;transform:translate3d(var(--confetti-drift,0px),108vh,0) rotate(calc(var(--confetti-rotate,0deg) + 620deg)) scale(1)}}

    @media(max-height:520px) and (orientation:landscape){
      .start-gate .celebration-card,
      #endCelebration .finish-card{width:min(360px,78vw) !important;padding:12px 18px !important;border-radius:20px !important}
      .start-gate .celebration-icon,
      #endCelebration .finish-trophy{width:72px !important;height:72px !important;margin-bottom:5px !important}
      .start-gate .celebration-title,
      #endCelebration .finish-title{font-size:34px !important}
      .start-gate .celebration-subtitle,
      #endCelebration .finish-subtitle{margin-top:5px !important;font-size:17px !important}
      .start-gate .celebration-actions,
      #endCelebration .finish-actions{margin-top:10px !important}
      .start-gate .activity-start-btn,
      #endCelebration .finish-actions button{height:38px !important;min-height:38px !important;font-size:16px !important}
    }


    /* train-v141: نفس بوابة البداية وحركة الكاميرا الافتتاحية في افتح الصندوق. */
    .train-page.intro-playing .stage{
      transform-origin:center center;
      will-change:transform;
      pointer-events:none;
    }
    .train-page.intro-done .stage{
      transform:translate3d(0,0,0) scale(1.04);
    }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="خلفية وسكة قطار الإجابات"></svg>
    <section class="activity-overlay start-gate is-visible" id="startGate" aria-hidden="false">
      <div class="celebration-card activity-start-card" role="dialog" aria-modal="true" aria-labelledby="startGateTitle">
        <span class="celebration-spark spark-one" aria-hidden="true"></span>
        <span class="celebration-spark spark-two" aria-hidden="true"></span>
        <span class="celebration-spark spark-three" aria-hidden="true"></span>
        <span class="celebration-spark spark-four" aria-hidden="true"></span>
        <svg class="celebration-icon" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="startBlue" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#2fa7f2"/>
          <stop offset="100%" stop-color="#0d6fb4"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="54" fill="rgba(255,255,255,.76)" stroke="rgba(255,255,255,.92)" stroke-width="5"/>
      <circle cx="60" cy="60" r="35" fill="url(#startBlue)"/>
      <path d="M52 42l27 18-27 18z" fill="#fff"/>
    </svg>
        <h1 class="celebration-title" id="startGateTitle">ابدأ اللعبة</h1>
        <p class="celebration-subtitle">اضغط للبدء وتشغيل الصوت</p>
        <div class="celebration-actions">
          <button class="restart-btn activity-start-btn" type="button" id="startGameBtn">تشغيل</button>
        </div>
      </div>
    </section>

    <section class="activity-overlay end-celebration" id="endCelebration" aria-hidden="true">
      <div class="celebration-confetti finish-confetti" aria-hidden="true">
        <span style="left:9%; --confetti-color:#1688d3; --confetti-duration:3.93s; --confetti-delay:-0.23s; --confetti-drift:-36px; --confetti-rotate:31deg"></span>
        <span style="left:16%; --confetti-color:#f47a45; --confetti-duration:4.26s; --confetti-delay:-0.46s; --confetti-drift:-18px; --confetti-rotate:62deg"></span>
        <span style="left:23%; --confetti-color:#e91e63; --confetti-duration:4.59s; --confetti-delay:-0.69s; --confetti-drift:0px; --confetti-rotate:93deg"></span>
        <span style="left:30%; --confetti-color:#43a047; --confetti-duration:4.92s; --confetti-delay:-0.92s; --confetti-drift:18px; --confetti-rotate:124deg"></span>
        <span style="left:37%; --confetti-color:#8e24aa; --confetti-duration:5.25s; --confetti-delay:-1.15s; --confetti-drift:36px; --confetti-rotate:155deg"></span>
        <span style="left:44%; --confetti-color:#ffd166; --confetti-duration:3.60s; --confetti-delay:-1.38s; --confetti-drift:54px; --confetti-rotate:6deg"></span>
        <span style="left:51%; --confetti-color:#06b6d4; --confetti-duration:3.93s; --confetti-delay:-1.61s; --confetti-drift:-54px; --confetti-rotate:37deg"></span>
        <span style="left:58%; --confetti-color:#efd553; --confetti-duration:4.26s; --confetti-delay:-1.84s; --confetti-drift:-36px; --confetti-rotate:68deg"></span>

      balloonPop:BALLOON_POP_AUDIO_DATA,
      correctDrop:"../sounds/train-correct-drop.mp3",
      boxBreak:"../sounds/train-box-break.mp3",
      intro:"../sounds/theme-default.mp3?v=1",
      finish:"../sounds/match-finish.mp3?v=1"
    });

    const VOLUMES = Object.freeze({
      move:.34,
      levelBell:.82,
      whistle:.78,
      bounce:.68,
      balloonPop:.78,
      correctDrop:.78,
      boxBreak:.80,
      intro:1,
      finish:1
    });

    const cache = Object.create(null);
    let enabled = true;
    let movementWanted = false;
    let movementResumeArmed = false;

    function boundedVolume(value, fallback){
      const number = Number(value);
      return Number.isFinite(number)
        ? Math.max(0, Math.min(1, number))
        : fallback;
    }

    function getAudio(name){
      const src = SOUND_FILES[name];
      if(!src) return null;

      if(!cache[name]){
        const audio = new Audio(src);
        audio.preload = "auto";
        audio.loop = name === "move";
        audio.volume = VOLUMES[name] ?? 1;
        audio.playsInline = true;
        audio.setAttribute("playsinline","");
        audio.setAttribute("webkit-playsinline","");
        cache[name] = audio;
      }

      return cache[name];
    }

    function resetAudio(audio){
      if(!audio) return;
      try{
        audio.pause();
        audio.currentTime = 0;
      }catch(_){ }
    }

    function playNamed(name, options = {}){
      if(!enabled || name === "move") return null;

      const audio = getAudio(name);
      if(!audio) return null;

      try{
        audio.pause();
        audio.currentTime = 0;
        audio.loop = false;
        audio.volume = boundedVolume(options.volume, VOLUMES[name] ?? 1);
        audio.playbackRate = Number.isFinite(Number(options.playbackRate))
          ? Math.max(.6, Math.min(1.8, Number(options.playbackRate)))
          : 1;

        audio.sgTrainPlayToken = (audio.sgTrainPlayToken || 0) + 1;
        const playAttempt = audio.play();
        audio.sgTrainPlayAttempt = playAttempt || null;
        if(playAttempt && typeof playAttempt.catch === "function"){
          playAttempt.catch(()=>{});
        }
        return audio;
      }catch(_){
        return null;
      }
    }

    function disarmMovementResume(){
      if(!movementResumeArmed) return;
      movementResumeArmed = false;
      document.removeEventListener("pointerdown", resumeMovementFromGesture, true);
      document.removeEventListener("touchstart", resumeMovementFromGesture, true);
      document.removeEventListener("keydown", resumeMovementFromGesture, true);
    }

    function resumeMovementFromGesture(){
      disarmMovementResume();
      if(movementWanted) startMovement();
    }

    function armMovementResume(){
      if(movementResumeArmed || !movementWanted) return;
      movementResumeArmed = true;
      document.addEventListener("pointerdown", resumeMovementFromGesture, true);
      document.addEventListener("touchstart", resumeMovementFromGesture, true);
      document.addEventListener("keydown", resumeMovementFromGesture, true);
    }

    function startMovement(){
      if(!enabled) return null;
      movementWanted = true;

      const audio = getAudio("move");
      if(!audio) return null;

      audio.loop = true;
      audio.volume = VOLUMES.move;
      audio.playbackRate = 1;

      if(!audio.paused && !audio.ended){
        disarmMovementResume();
        return audio;
      }

      try{ audio.currentTime = 0; }catch(_){ }

      try{
        const playAttempt = audio.play();
        audio.sgTrainPlayAttempt = playAttempt || null;
        if(playAttempt && typeof playAttempt.then === "function"){
          playAttempt.then(disarmMovementResume).catch(armMovementResume);
        }
      }catch(_){
        armMovementResume();
      }

      return audio;
    }

    function stopMovement(){
      movementWanted = false;
      disarmMovementResume();
      resetAudio(cache.move);
    }

    function stopNamed(name){
      if(name === "move"){
        stopMovement();
        return;
      }
      resetAudio(cache[name]);
    }

    function stopAll(){
      movementWanted = false;
      disarmMovementResume();
      Object.values(cache).forEach(resetAudio);
    }

    function preload(){
      Object.keys(SOUND_FILES).forEach(name => {
        const audio = getAudio(name);
        try{ audio?.load?.(); }catch(_){ }
      });
    }

    function unlock(){
      preload();
    }

    function setEnabled(value){
      enabled = value !== false;
      if(!enabled) stopAll();
    }

    function ready(name){
      const audio = getAudio(name);
      if(!audio || audio.readyState >= 2) return Promise.resolve();

      return new Promise(resolve => {
        let done = false;
        const finish = () => {
          if(done) return;
          done = true;
          audio.removeEventListener("loadeddata", finish);
          audio.removeEventListener("canplaythrough", finish);
          audio.removeEventListener("error", finish);
          resolve();
        };
        audio.addEventListener("loadeddata", finish, {once:true});
        audio.addEventListener("canplaythrough", finish, {once:true});
        audio.addEventListener("error", finish, {once:true});
        try{ audio.load(); }catch(_){ }
        window.setTimeout(finish, 900);
      });
    }

    return {
      unlock,
      preload,
      ready,
      setEnabled,
      playNamed,
      stopNamed,
      stopAll,
      startMovement,
      stopMovement
    };
  })();

  function waitForAudioToFinish(audio, fallbackMs = 12000){
    if(!audio || audio.ended) return Promise.resolve();

    const playToken = audio.sgTrainPlayToken || 0;
    return new Promise(resolve => {
      let completed = false;
      let timer = 0;

      const finish = () => {
        if(completed) return;
        completed = true;
        window.clearTimeout(timer);
        audio.removeEventListener("ended", onEnded);
        audio.removeEventListener("error", finish);
        resolve();
      };

      const onEnded = () => {
        if((audio.sgTrainPlayToken || 0) === playToken) finish();
      };

      const durationMs = Number.isFinite(audio.duration) && audio.duration > 0
        ? (audio.duration - (Number(audio.currentTime) || 0)) * 1000 /
          Math.max(.01, Number(audio.playbackRate) || 1) + 500
        : Math.min(Math.max(1000, fallbackMs), 12000);

      timer = window.setTimeout(finish, Math.max(500, durationMs));
      audio.addEventListener("ended", onEnded, {once:true});
      audio.addEventListener("error", finish, {once:true});

      const playAttempt = audio.sgTrainPlayAttempt;
      if(playAttempt && typeof playAttempt.catch === "function"){
        playAttempt.catch(finish);
      }
    });
  }

  async function playTrainOpeningIntro(){
    trainPage?.classList.remove("intro-done");
    trainPage?.classList.add("intro-playing");
    const holdMs=2200;
    const zoomMs=7600;
    const startScale=1;
    const endScale=1.04;
    const stageNode=document.getElementById("stage");
    if(!stageNode) return;
    stageNode.style.transform=`translate3d(0,0,0) scale(${startScale})`;
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      await new Promise(resolve=>{
        let started=null;
        const frame=now=>{
          if(started===null) started=now;
          const elapsed=now-started;
          if(elapsed<holdMs){
            stageNode.style.transform=`translate3d(0,0,0) scale(${startScale})`;
            requestAnimationFrame(frame);
            return;
          }
          const p=Math.max(0,Math.min(1,(elapsed-holdMs)/zoomMs));
          const eased=-(Math.cos(Math.PI*p)-1)/2;
          const scale=startScale+(endScale-startScale)*eased;
          stageNode.style.transform=`translate3d(0,0,0) scale(${scale.toFixed(5)})`;
          if(p<1) requestAnimationFrame(frame); else resolve();
        };
        requestAnimationFrame(frame);
      });
    }else{
      stageNode.style.transform=`translate3d(0,0,0) scale(${endScale})`;
    }
    trainPage?.classList.remove("intro-playing");
    trainPage?.classList.add("intro-done");
  }

  function isTrainRangeNearViewport(left, right){
    const worldLeft = left + trainVisualOffsetX;

  function updateTrainVisualCulling(force = false){

      return;
    }
    lastTrainCullingOffset = trainVisualOffsetX;

    const updatePart = part => {
      if(!part || !part.node) return;
      const visible = isTrainRangeNearViewport(part.left, part.right);
      if(part.visible === visible) return;
      part.visible = visible;
      part.node.style.display = visible ? "" : "none";

      // العجلات الظاهرة تستمر بالدوران دائمًا، والمتوقفة فقط هي عجلات الأجزاء البعيدة خارج الشاشة.
      part.node.querySelectorAll?.(".train-wheel").forEach(wheel => {
        wheel.classList.toggle("is-offscreen", !visible);

    trainCoverVisualParts.forEach(updatePart);

  function markLandingQualityPenalty(item, reason){
    if(!item || item.done) return;
    item.qualityPenaltyCount = (Number(item.qualityPenaltyCount) || 0) + 1;
    if(reason && Array.isArray(item.qualityPenaltyReasons) &&
      !item.qualityPenaltyReasons.includes(reason)){
      item.qualityPenaltyReasons.push(reason);
    }
  }

  function normalizedLandingTiltDegrees(angle){
    let value = Number(angle) || 0;
    const fullTurn = Math.PI * 2;
    value = ((value + Math.PI) % fullTurn + fullTurn) % fullTurn - Math.PI;
    return Math.abs(value * 180 / Math.PI);
  }

  function landingPointsFor(item, body){
    const tilt = normalizedLandingTiltDegrees(body?.angle);
    const hadAssistedContact = (Number(item?.qualityPenaltyCount) || 0) > 0;
    const cleanAndLevel = !hadAssistedContact &&
      tilt <= LANDING_SCORE_CONFIG.perfectMaxTiltDeg;

    return cleanAndLevel
      ? LANDING_SCORE_CONFIG.perfectPoints
      : LANDING_SCORE_CONFIG.recoveredPoints;
  }

  const TRAIN_SCALE = .92;

    return TRAIN_SCALE_PIVOT.y + (y - TRAIN_SCALE_PIVOT.y) * TRAIN_SCALE;

  function getBaseTrainLeftEdge(){
    // نحسب أقصى يسار للقطار كاملًا بدون تغيير دخول القطار.
    // هذا يستخدم فقط عند الخروج حتى يختفي آخر جزء من القطار بالكامل.
    const leftEdges = [trainX(782)];

    TRAIN_CARS.forEach((car, index) => {
      if(!car) return;

      if(car.type === "answer"){
        leftEdges.push(trainX(trainSlotRawX(index)));
        return;
      }

      if(car.type === "passenger"){
        const layout = passengerLayoutForIndex(index);
        leftEdges.push(layout.x);
        return;
      }

      if(car.type === "coal"){
        const layout = coalLayoutForIndex(index);
        leftEdges.push(layout.x);
      }
    });

    return Math.min(...leftEdges);
  }

    const safetyMargin = 320;

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));

  function setTrainVisualOffset(x){
    trainVisualOffsetX = x;

    const transform = `translate(${x.toFixed(2)} 0)`;

    if(trainPositionGroup && transform !== lastTrainTransform){
      trainPositionGroup.setAttribute("transform", transform);
      lastTrainTransform = transform;
    }

    if(wagonDropCoverPositionGroup && transform !== lastWagonCoverTransform){
      wagonDropCoverPositionGroup.setAttribute("transform", transform);
      lastWagonCoverTransform = transform;
    }

    updateTrainVisualCulling();

  function trainEaseInOut(t){
    return t < .5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animateTrainTo(targetX, duration, nextState, onComplete){
    if(trainAnimationFrame){
      cancelAnimationFrame(trainAnimationFrame);
      trainAnimationFrame = 0;
    }

    const startX = trainVisualOffsetX;
    const startTime = performance.now();
    const movementSoundMode = trainMotionState;
    startTrainMovementSound(movementSoundMode);

    function frame(now){
      const t = clamp((now - startTime) / duration, 0, 1);
      const eased = trainEaseInOut(t);
      const x = startX + (targetX - startX) * eased;

      setTrainVisualOffset(x);
      syncTrainPhysicsToVisualOffset();

      if(t < 1){
        trainAnimationFrame = requestAnimationFrame(frame);
        return;
      }

      setTrainVisualOffset(targetX);
      trainAnimationFrame = 0;

      if(nextState){
        trainMotionState = nextState;
      }

      if(typeof onComplete === "function"){
        onComplete();
      }

      // أي صندوق استقر أثناء حركة القطار يُحتسب فورًا،
      // لكن قرار التوقف/التقدم/الخروج ينتظر انتهاء الحركة الحالية
      // حتى لا تُلغى الحركة أو تبدأ من جديد فتبدو أبطأ.
      if(nextState === "playing" && pendingTrainProgressReview){
        reviewTrainProgressAfterMotion();
      }
    }

    trainAnimationFrame = requestAnimationFrame(frame);
  }

  function startTrainEntry(){
    trainMotionState = "entering";
    setTrainVisualOffset(TRAIN_MOTION.enterOffset);
    syncTrainPhysicsToVisualOffset();

    requestAnimationFrame(() => {
      animateTrainTo(TRAIN_MOTION.centerOffset, TRAIN_MOTION.enterDuration, "playing", () => {
        syncTrainPhysicsToVisualOffset();
        playStageLevelBellOnce();
        startStageCountdown();
        // تبقى اللافتة ثابتة في المنتصف حتى يستقر القطار، ثم تنسحب مع سرعة الأرضية الأمامية.
        releaseLevelSignWithGround();
      });
    });
  }

  function clearActiveFallingMatterBoxes(){

  function syncStaticMatterBodyToViewport(body){
    if(!body || body.label === "kill-track" || !Matter || !Matter.Body) return;

    const desiredX = body.sgBaseX + trainVisualOffsetX;
    const halfWidth = body.sgHalfWidth || 0;
    const nearViewport = desiredX + halfWidth >= -TRAIN_VIEWPORT_MARGIN &&
      desiredX - halfWidth <= 1280 + TRAIN_VIEWPORT_MARGIN;

    if(body.sgViewportActive !== nearViewport){
      body.sgViewportActive = nearViewport;
      body.collisionFilter.mask = nearViewport ? body.sgActiveMask : 0;
    }

    // الأجسام البعيدة لا تُنقل في كل إطار. عند اقترابها تُقفز مباشرة إلى موقعها الصحيح.
    if(nearViewport && Math.abs(body.position.x - desiredX) >= .01){
      Matter.Body.setPosition(body, {x:desiredX, y:body.position.y});
    }
  }

  function syncTrainPhysicsToVisualOffset(){
    if(!isMatterReady() || !matterEngine || !Matter || !Matter.Body){
      trainPhysicsOffsetX = trainVisualOffsetX;
      return;

    matterStaticBodies.forEach(syncStaticMatterBodyToViewport);

    collisionMap.forEach(zone => {
      if(!zone || zone.name === "track") return;

      if(typeof zone.sgBaseLeft === "number"){
        zone.left = zone.sgBaseLeft + trainVisualOffsetX;
      }
      if(typeof zone.sgBaseRight === "number"){
        zone.right = zone.sgBaseRight + trainVisualOffsetX;
      }
    });

    trainPhysicsOffsetX = trainVisualOffsetX;
  }

  function advanceTrainToQuestionWagon(wagonIndex){
    // لا نعيد تشغيل حركة قائمة؛ تسجيل الصناديق أثناء الحركة لا يغير سرعتها.
    if(trainMotionState === "entering" || trainMotionState === "advancing" || trainAnimationFrame){
      pendingTrainProgressReview = true;
      return;
    }

    if(trainMotionState === "exiting" || trainMotionState === "done") return;

    trainMotionState = "advancing";

    const targetOffset = trainOffsetForWagonIndex(wagonIndex);

    animateTrainTo(targetOffset, TRAIN_MOTION.betweenDuration, "playing", () => {
      syncTrainPhysicsToVisualOffset();
    });
  }

  function reviewTrainProgressAfterMotion(){
    pendingTrainProgressReview = false;

    if(stageCompleteTriggered || trainMotionState !== "playing") return;

    if(areAllQuestionWagonsCompleted()){
      requestTrainExit();
      return;
    }

    // إذا بقيت عربة سؤال ظاهرة وغير مكتملة، يبقى القطار في موضعه الحالي.
    if(hasPlayableUncompletedQuestionWagonNow()){
      return;
    }

    const nextIndex = nextUncompletedQuestionWagonIndex();
    if(nextIndex !== undefined){
      const nextPointer = QUESTION_WAGON_INDICES.indexOf(nextIndex);
      if(nextPointer >= 0) activeQuestionPointer = nextPointer;
      advanceTrainToQuestionWagon(nextIndex);
    }
  }

  function isQuestionWagonIndex(index){
    return QUESTION_WAGON_INDICES.includes(index);
  }

  function getQuestionWagonVisualRect(index){
    const car = trainCarRegistry[index];
    if(!car) return null;

    return {
      left:car.x + trainVisualOffsetX,
      right:car.x + car.width + trainVisualOffsetX
    };
  }

  function isQuestionWagonPlayableNow(index){
    const rect = getQuestionWagonVisualRect(index);
    if(!rect) return false;

    // هامش بسيط لأن جزءًا خفيفًا من العربة قد يكون قريبًا من حافة الشاشة.
    return rect.left >= -40 && rect.right <= 1320;
  }

  function hasPlayableUncompletedQuestionWagonNow(){
    // طالما توجد عربة سؤال واضحة وغير مكتملة، لا نحرّك القطار.
    return QUESTION_WAGON_INDICES.some(index =>
      !completedQuestionWagons.has(index) && isQuestionWagonPlayableNow(index)
    );
  }

  function areAllQuestionWagonsCompleted(){
    return QUESTION_WAGON_INDICES.length > 0 &&
      QUESTION_WAGON_INDICES.every(index => completedQuestionWagons.has(index));
  }

  function nextUncompletedQuestionWagonIndex(){
    return QUESTION_WAGON_INDICES.find(index => !completedQuestionWagons.has(index));
  }

  function handleQuestionWagonSettled(well,item = null){
    if(!well) return;
    if(!isQuestionWagonIndex(well.index)) return;

    if(TRAIN_ANSWER_LOGIC_ENABLED){
      const car = trainCarRegistry[well.index];
      const wagonId = String(car?.wagonId || "");
      const balloonId = String(item?.balloonId || "");
      if(!wagonId || !balloonId) return;

      if(!acceptedBalloonIds.has(balloonId)){
        acceptedBalloonIds.add(balloonId);
        const accepted = acceptedBalloonIdsByWagon.get(wagonId) || new Set();
        accepted.add(balloonId);
        acceptedBalloonIdsByWagon.set(wagonId,accepted);
      }

      const expected = expectedBalloonIdsByWagon.get(wagonId) || new Set();
      const accepted = acceptedBalloonIdsByWagon.get(wagonId) || new Set();
      if(expected.size && accepted.size >= expected.size){
        completedQuestionWagons.add(well.index);
      }
    }else{
      completedQuestionWagons.add(well.index);
    }

    // أثناء دخول القطار أو تقدمه نحتسب العربة الآن،
    // لكن لا نوقف الحركة ولا نعيد تشغيلها. القرار التالي يُراجع بعد انتهائها.
    if(trainMotionState === "entering" || trainMotionState === "advancing" || trainAnimationFrame){
      pendingTrainProgressReview = true;
      return;
    }

    reviewTrainProgressAfterMotion();
  }

  async function requestTrainExit(){
    if(stageCompleteTriggered || trainExitSequencePending) return;

    // إذا اكتملت آخر عربة أثناء حركة قائمة، لا نقطع الحركة.
    if(trainMotionState === "entering" || trainMotionState === "advancing" || trainAnimationFrame){
      pendingTrainProgressReview = true;
      return;
    }

    if(trainMotionState !== "playing") return;

    stageCompleteTriggered = true;
    trainExitSequencePending = true;
    pendingTrainProgressReview = false;
    stopStageCountdown();

    // مرجع الصوت يُلتقط الآن حتى لا يستطيع أي اصطدام لاحق تغييره أثناء الانتظار.
    const finalCorrectDropAudio = lastCorrectDropAudio;
    await waitForAudioToFinish(finalCorrectDropAudio,12000);
    const whistleAudio = playTrainSound("whistle");
    await waitForAudioToFinish(whistleAudio,12000);

    trainMotionState = "exiting";
    setParallaxMotionMode("transition", PARALLAX_MOTION_CONFIG.rampDownMs);
    releaseStageBalloonsUpward();
    clearActiveFallingMatterBoxes();

    animateTrainTo(getSafeTrainExitOffset(), TRAIN_MOTION.exitDuration, "done", () => {
      trainExitSequencePending = false;
      disposeFinishedStageRuntime();
      scheduleNextTrainStage();
    });
  }

  function isMatterReady(){
    return !!(window.Matter && Matter.Engine && Matter.World && Matter.Bodies && Matter.Body);

  function makeZone(type, rect, meta = {}){
    const zone = {type, ...rect, ...meta};

    if(meta.name !== "track"){
      if(typeof zone.left === "number") zone.sgBaseLeft = zone.left - trainPhysicsOffsetX;
      if(typeof zone.right === "number") zone.sgBaseRight = zone.right - trainPhysicsOffsetX;
    }

    return zone;
  }

  function makeWell(rect, meta = {}){
    return makeZone("well", rect, meta);

  function makeSurface(rect, meta = {}){
    return makeZone("surface", rect, meta);

    return makeZone("break", rect, meta);

  function makeBreakSurface(rect, meta = {}){
    return makeZone("break-surface", rect, meta);

  function loadMatterLibrary(){
    if(isMatterReady()){
      buildCollisionMap();
      startMatterLoop();
      flushPendingMatterSpawns();
      return;
    }

    if(matterLibraryLoading) return;
    matterLibraryLoading = true;

    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js";
    script.async = true;

    script.onload = () => {
      matterLibraryLoading = false;
      buildCollisionMap();
      startMatterLoop();
      flushPendingMatterSpawns();
    };

    script.onerror = () => {
      matterLibraryLoading = false;
    };

    document.head.appendChild(script);
  }

  function flushPendingMatterSpawns(){
    if(!isMatterReady() || !matterEngine || !pendingMatterSpawns.length) return;

    const pending = pendingMatterSpawns.splice(0, pendingMatterSpawns.length);
    pending.forEach(job => {
      spawnMatterAnswerBox(job.startX, job.startY, job.textLines, job.meta || {}, true);
    });
  }

  function resetMatterWorld(){
    if(!isMatterReady()) return;

    if(!matterEngine){
      matterEngine = Matter.Engine.create({
        enableSleeping:true,
        positionIterations:8,
        velocityIterations:8,
        constraintIterations:2
      });

      matterEngine.gravity.x = 0;
      matterEngine.gravity.y = .82;

      Matter.Events.on(matterEngine, "collisionStart", event => {
        event.pairs.forEach(pair => {
          handleMatterCollision(pair.bodyA, pair.bodyB);
          handleMatterCollision(pair.bodyB, pair.bodyA);
        });
      });

      Matter.Events.on(matterEngine, "collisionActive", event => {
        event.pairs.forEach(pair => {
          handleGapActiveCollision(pair.bodyA, pair.bodyB);
          handleGapActiveCollision(pair.bodyB, pair.bodyA);
        });
      });
    }else{
      Matter.World.clear(matterEngine.world, false);
      matterEngine.gravity.x = 0;
      matterEngine.gravity.y = .82;
    }

    matterStaticBodies.length = 0;
    matterBoxes.length = 0;
    settledVisualMatterBoxes.length = 0;
    activeFallingBoxes = 0;
  }

  function addMatterBody(body){
    if(!isMatterReady() || !matterEngine) return null;
    matterStaticBodies.push(body);
    Matter.World.add(matterEngine.world, body);
    return body;
  }

  function addMatterRect(x, y, w, h, options = {}){
    if(!isMatterReady() || !matterEngine) return null;

    const body = Matter.Bodies.rectangle(x, y, w, h, {
      isStatic:true,
      friction:.9,
      frictionStatic:1.1,
      restitution:.08,
      collisionFilter:{
        category:MATTER_COLLISION.train,
        mask:MATTER_COLLISION.box
      },
      ...options
    });

    body.sgBaseX = x - trainPhysicsOffsetX;
    body.sgHalfWidth = Math.abs(w) / 2;
    body.sgActiveMask = body.collisionFilter.mask;
    body.sgViewportActive = true;

    const added = addMatterBody(body);
    if(body.label !== "kill-track") syncStaticMatterBodyToViewport(body);
    return added;
  }

  function buildTrainPhysicsParts(){
    const parts = [];

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      parts.push({
        type:"wagon",
        id:`wagon-${index}`,
        index,
        car,
        x:trainWorldX(car.x),
        y:car.y,
        w:car.width,
        h:car.height,
        floorY:car.y + trainLen(TRAIN_PHYSICS_PROFILES.wagon.floor.yOffsetFromTop)
      });
    });

    TRAIN_CARS.forEach((car, index) => {
      if(!car || car.type !== "passenger") return;

      const layout = passengerLayoutForIndex(index);

      parts.push({
        type:"passenger",
        id:`passenger-${index}`,
        index,
        car,
        x:trainWorldX(layout.x),
        y:layout.y,
        w:layout.width,
        h:layout.height
      });
    });

    TRAIN_CARS.forEach((car, index) => {
      if(!car || car.type !== "coal") return;

      const layout = coalLayoutForIndex(index);

      parts.push({
        type:"coal",
        id:`coal-${index}`,
        index,
        car,
        x:trainWorldX(layout.x),
        y:layout.y,
        w:layout.width,
        h:layout.height
      });
    });

    parts.push({
      type:"engine",
      id:"engine",
      x:trainWorldX(trainX(782)),
      y:trainY(430),
      w:trainLen(320),
      h:trainLen(179),
      roof:{
        x1:trainWorldX(trainX(TRAIN_PHYSICS_PROFILES.engine.roof.x1)),
        x2:trainWorldX(trainX(TRAIN_PHYSICS_PROFILES.engine.roof.x2)),
        y:trainY(TRAIN_PHYSICS_PROFILES.engine.roof.y),
        h:trainLen(TRAIN_PHYSICS_PROFILES.engine.roof.h)
      }
    });

    return parts;
  }

  function getAdjacentWagonParts(parts){
    return parts
      .filter(part => part && part.type === "wagon")
      .sort((a, b) => a.x - b.x);
  }

  function addWagonPhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.wagon;
    const car = part.car;
    const index = part.index;

    const floorInset = trainLen(profile.floor.inset);
    const floorH = trainLen(profile.floor.h);
    const wallXInset = trainLen(profile.wall.xInset);
    const wallYOffset = trainLen(profile.wall.yOffset);
    const wallW = trainLen(profile.wall.w);
    const wallH = trainLen(profile.wall.h);
    const topXInset = trainLen(profile.topBumper.xInset);
    const topYOffset = trainLen(profile.topBumper.yOffset);
    const topW = trainLen(profile.topBumper.w);
    const topH = trainLen(profile.topBumper.h);

    const well = {
      left:part.x + trainLen(2),
      right:part.x + part.w - trainLen(2),
      top:part.y + trainLen(4),
      bottom:part.y + part.h - trainLen(10)
    };

    collisionMap.push(makeWell(well, {
      car,
      index,
      partId:part.id,
      floorY:part.floorY,
      name:`wagon-well-${index}`
    }));

    addMatterRect(part.x + part.w / 2, part.floorY, part.w - floorInset * 2, floorH, {
      label:`${part.id}-floor`,
      sgType:"wagon-floor",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.floor.friction,
      frictionStatic:profile.floor.frictionStatic,
      restitution:profile.floor.restitution
    });

    addMatterRect(part.x + wallXInset, part.y + wallYOffset, wallW, wallH, {
      label:`${part.id}-left-wall`,
      sgType:"wagon-wall",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.wall.friction,
      frictionStatic:profile.wall.frictionStatic,
      restitution:profile.wall.restitution
    });

    addMatterRect(part.x + part.w - wallXInset, part.y + wallYOffset, wallW, wallH, {
      label:`${part.id}-right-wall`,
      sgType:"wagon-wall",
      sgPartId:part.id,
      sgWellIndex:index,
      friction:profile.wall.friction,
      frictionStatic:profile.wall.frictionStatic,
      restitution:profile.wall.restitution
    });

    addMatterRect(part.x + topXInset, part.y + topYOffset, topW, topH, {
      label:`${part.id}-left-top-edge-bumper`,
      sgType:"wagon-top-edge-bumper",
      sgPartId:part.id,
      sgWellIndex:index,
      sgPushX:1,
      isSensor:true,
      angle:-profile.topBumper.angle,
      friction:profile.topBumper.friction,
      frictionStatic:profile.topBumper.frictionStatic,
      restitution:profile.topBumper.restitution
    });

    addMatterRect(part.x + part.w - topXInset, part.y + topYOffset, topW, topH, {
      label:`${part.id}-right-top-edge-bumper`,
      sgType:"wagon-top-edge-bumper",
      sgPartId:part.id,
      sgWellIndex:index,
      sgPushX:-1,
      isSensor:true,
      angle:profile.topBumper.angle,
      friction:profile.topBumper.friction,
      frictionStatic:profile.topBumper.frictionStatic,
      restitution:profile.topBumper.restitution
    });

    collisionMap.push(makeSurface({
      left:part.x + topXInset - profile.topBumper.w / 2,
      right:part.x + topXInset + profile.topBumper.w / 2,
      y:part.y + topYOffset,
      thickness:topH
    }, {name:`${part.id}-left-top-edge-bumper`}));

    collisionMap.push(makeSurface({
      left:part.x + part.w - topXInset - profile.topBumper.w / 2,
      right:part.x + part.w - topXInset + profile.topBumper.w / 2,
      y:part.y + topYOffset,
      thickness:topH
    }, {name:`${part.id}-right-top-edge-bumper`}));
  }

  function addEnginePhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.engine;
    const roof = part.roof || profile.roof;

    collisionMap.push(makeSurface({
      left:roof.x1,
      right:roof.x2,
      y:roof.y,
      thickness:roof.h
    }, {name:"driver-roof-bumper"}));

    addMatterRect((roof.x1 + roof.x2) / 2, roof.y + roof.h / 2, roof.x2 - roof.x1, roof.h, {
      label:`${part.id}-roof-bounce`,
      sgType:"driver-roof",
      sgPartId:part.id,
      sgRoofY:roof.y,
      friction:profile.roofBounce.friction,
      frictionStatic:profile.roofBounce.frictionStatic,
      restitution:profile.roofBounce.restitution
    });
  }

  function addPassengerPhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.passenger.bouncer;

    const inset = trainLen(profile.inset);
    const topY = part.y + trainLen(profile.topYOffset);
    const topH = trainLen(profile.topH);
    const sideInset = trainLen(profile.sideInset);
    const sideW = trainLen(profile.sideW);
    const sideH = trainLen(profile.sideH);
    const sideCenterY = part.y + trainLen(profile.sideYOffset) + sideH / 2;

    const solidTopY = part.y + trainLen(profile.solidTopYOffset);
    const solidTopH = trainLen(profile.solidTopH);
    const solidBodyY = part.y + trainLen(profile.solidBodyYOffset);
    const solidBodyH = trainLen(profile.solidBodyH);
    const solidSideInset = trainLen(profile.solidSideInset);
    const solidSideW = trainLen(profile.solidSideW);
    const solidSideH = trainLen(profile.solidSideH);
    const solidSideCenterY = part.y + trainLen(profile.solidSideYOffset) + solidSideH / 2;

    // أجسام صلبة لعربة الركاب:
    // تمنع الصندوق من اختراق العربة، لكنها لا تجعلها عربة سؤال ولا تحسب نجاحًا.
    addMatterRect(part.x + part.w / 2, solidTopY, part.w - inset * 2, solidTopH, {
      label:`${part.id}-top-passenger-solid`,
      sgType:"passenger-solid",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"top",
      sgPushX:-1,
      friction:profile.solidFriction,
      frictionStatic:profile.solidFrictionStatic,
      restitution:profile.solidRestitution
    });

    addMatterRect(part.x + part.w / 2, solidBodyY, part.w - trainLen(24), solidBodyH, {
      label:`${part.id}-body-passenger-solid`,
      sgType:"passenger-solid",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"body",
      sgPushX:-1,
      friction:profile.solidFriction,
      frictionStatic:profile.solidFrictionStatic,
      restitution:profile.solidRestitution
    });

    addMatterRect(part.x + solidSideInset, solidSideCenterY, solidSideW, solidSideH, {
      label:`${part.id}-left-passenger-solid`,
      sgType:"passenger-solid",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"side",
      sgPushX:-1,
      friction:profile.solidFriction,
      frictionStatic:profile.solidFrictionStatic,
      restitution:profile.solidRestitution
    });

    addMatterRect(part.x + part.w - solidSideInset, solidSideCenterY, solidSideW, solidSideH, {
      label:`${part.id}-right-passenger-solid`,
      sgType:"passenger-solid",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"side",
      sgPushX:-1,
      friction:profile.solidFriction,
      frictionStatic:profile.solidFrictionStatic,
      restitution:profile.solidRestitution
    });

    addMatterRect(part.x + part.w / 2, topY, part.w - inset * 2, topH, {
      label:`${part.id}-top-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"top",
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(part.x + sideInset, sideCenterY, sideW, sideH, {
      label:`${part.id}-left-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"side",
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(part.x + part.w - sideInset, sideCenterY, sideW, sideH, {
      label:`${part.id}-right-passenger-bouncer`,
      sgType:"passenger-bouncer",
      sgPartId:part.id,
      sgPassengerIndex:part.index,
      sgBouncerSurface:"side",
      sgPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    collisionMap.push(makeSurface({
      left:part.x + inset,
      right:part.x + part.w - inset,
      y:topY - topH / 2,
      thickness:topH
    }, {name:`${part.id}-top-passenger-bouncer`}));

    collisionMap.push(makeSurface({
      left:part.x,
      right:part.x + sideW + sideInset,
      y:sideCenterY - sideH / 2,
      thickness:sideH
    }, {name:`${part.id}-left-passenger-bouncer`}));

    collisionMap.push(makeSurface({
      left:part.x + part.w - sideW - sideInset,
      right:part.x + part.w,
      y:sideCenterY - sideH / 2,
      thickness:sideH
    }, {name:`${part.id}-right-passenger-bouncer`}));
  }

  function addCoalPhysicsPart(part){
    // عربة الفحم جزء صلب من القطار، لكنها ليست عربة سؤال ولا تحسب نجاحًا.
    const bodyH = part.h * .62;
    const bodyY = part.y + part.h * .63;

    addMatterRect(part.x + part.w / 2, topY, part.w * .82, topH, {
      label:`${part.id}-top-coal-solid`,

      sgCoalIndex:part.index,
      friction:.84,
      frictionStatic:1,

    });

    addMatterRect(part.x + part.w / 2, bodyY, part.w - trainLen(22), bodyH, {
      label:`${part.id}-body-coal-solid`,
      sgType:"coal-solid",

      sgCoalIndex:part.index,
      friction:.84,
      frictionStatic:1,

    });

    addMatterRect(part.x + trainLen(12), sideY, sideW, sideH, {
      label:`${part.id}-left-coal-solid`,

      friction:.84,
      frictionStatic:1,

    addMatterRect(part.x + part.w - trainLen(12), sideY, sideW, sideH, {

      sgCoalIndex:part.index,
