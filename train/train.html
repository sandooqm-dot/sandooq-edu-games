<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 73</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky-top:#bfcae6;
      --sky-mid:#dce3f2;
      --sand:#d7a464;
      --sand2:#bd7f42;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 120px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:120px;
      pointer-events:none;
    }

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,#ead5ac 46%,var(--sand) 72%,var(--sand2) 100%);
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:10;
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
      pointer-events:auto;
    }

    .train-wheel{
      transform-box:fill-box;
      transform-origin:center;
      animation:wheelSpin .55s linear infinite;
    }

    .train-idle-motion{
      transform-box:fill-box;
      transform-origin:center;
      animation:trainIdleMotion 3.2s ease-in-out infinite;
      will-change:transform;
    }

    @keyframes trainIdleMotion{
      0%,100%{transform:translateX(0)}
      45%{transform:translateX(4px)}
      68%{transform:translateX(2px)}
    }

    @keyframes wheelSpin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="stage" id="stage" viewBox="0 0 1280 720" preserveAspectRatio="none" role="img" aria-label="خلفية وسكة قطار الإجابات"></svg>
  </main>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("stage");
  const NS = "http://www.w3.org/2000/svg";

  function el(name, attrs = {}, parent = svg){
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  }

  function clear(){
    svg.innerHTML = "";
  }

  function defs(){
    const d = el("defs");

    const scene = el("linearGradient", {id:"sceneGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#bfcae6"}, scene);
    el("stop", {offset:"45%", "stop-color":"#dce3f2"}, scene);
    el("stop", {offset:"46%", "stop-color":"#ead5ac"}, scene);
    el("stop", {offset:"72%", "stop-color":"#d7a464"}, scene);
    el("stop", {offset:"100%", "stop-color":"#bd7f42"}, scene);

    const sand = el("linearGradient", {id:"sandGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#e7c188"}, sand);
    el("stop", {offset:"100%", "stop-color":"#b47538"}, sand);

    const softShadow = el("filter", {id:"softShadow", x:"-20%", y:"-20%", width:"140%", height:"140%"}, d);
    el("feDropShadow", {dx:"0", dy:"5", stdDeviation:"4", "flood-color":"#000", "flood-opacity":".16"}, softShadow);

    const balloonBody = el("radialGradient", {
      id:"balloonBodyGrad",
      cx:"34%",
      cy:"30%",
      r:"72%",
      fx:"28%",
      fy:"22%"
    }, d);
    el("stop", {offset:"0%", "stop-color":"#f5f8ff"}, balloonBody);
    el("stop", {offset:"23%", "stop-color":"#cfdaf0"}, balloonBody);
    el("stop", {offset:"52%", "stop-color":"#8fa0c1"}, balloonBody);
    el("stop", {offset:"78%", "stop-color":"#5f6170"}, balloonBody);
    el("stop", {offset:"100%", "stop-color":"#3f3d47"}, balloonBody);

    const balloonHighlight = el("linearGradient", {id:"balloonHighlightGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#ffffff", "stop-opacity":".08"}, balloonHighlight);
    el("stop", {offset:"38%", "stop-color":"#ffffff", "stop-opacity":".58"}, balloonHighlight);
    el("stop", {offset:"70%", "stop-color":"#ffffff", "stop-opacity":".12"}, balloonHighlight);
    el("stop", {offset:"100%", "stop-color":"#ffffff", "stop-opacity":"0"}, balloonHighlight);

    const balloonFin = el("linearGradient", {id:"balloonFinGrad", x1:"0", y1:"0", x2:"1", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#aab6d0"}, balloonFin);
    el("stop", {offset:"100%", "stop-color":"#68718d"}, balloonFin);

    const balloonShadow = el("filter", {id:"balloonShadow", x:"-20%", y:"-25%", width:"140%", height:"150%"}, d);
    el("feDropShadow", {dx:"0", dy:"8", stdDeviation:"6", "flood-color":"#1e2332", "flood-opacity":".22"}, balloonShadow);

    const boxBody = el("linearGradient", {id:"answerBoxGrad", x1:"0", y1:"0", x2:"0", y2:"1"}, d);
    el("stop", {offset:"0%", "stop-color":"#b07445"}, boxBody);
    el("stop", {offset:"48%", "stop-color":"#8e552f"}, boxBody);
    el("stop", {offset:"100%", "stop-color":"#62351d"}, boxBody);

    const boxTop = el("linearGradient", {id:"answerBoxTopGrad", x1:"0", y1:"0", x2:"1", y2:"0"}, d);
    el("stop", {offset:"0%", "stop-color":"#c78a56"}, boxTop);
    el("stop", {offset:"100%", "stop-color":"#8a4d2b"}, boxTop);

    const boxShadow = el("filter", {id:"answerBoxShadow", x:"-35%", y:"-35%", width:"170%", height:"180%"}, d);
    el("feDropShadow", {dx:"0", dy:"7", stdDeviation:"5", "flood-color":"#2b170c", "flood-opacity":".24"}, boxShadow);
  }

  function makeCloud(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, opacity:".78"}, parent);
    [[0,0,20],[22,-6,30],[52,-2,24],[76,6,18],[24,16,25],[58,15,22]].forEach(([cx, cy, r]) => {
      el("circle", {
        cx,
        cy,
        r,
        fill:"#eef3fa",
        stroke:"#b2bdcd",
        "stroke-width":2,
        opacity:".85"
      }, g);
    });
  }

  function makeCactus(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    el("rect", {x:-10, y:-70, width:20, height:80, rx:10, fill:"#4c8b53", stroke:"#39703f", "stroke-width":3}, g);
    el("path", {d:"M-9 -44 C-45 -52 -43 -6 -20 -7", fill:"none", stroke:"#4c8b53", "stroke-width":16, "stroke-linecap":"round"}, g);
    el("path", {d:"M8 -54 C45 -64 47 -20 20 -19", fill:"none", stroke:"#4c8b53", "stroke-width":15, "stroke-linecap":"round"}, g);
    el("ellipse", {cx:0, cy:12, rx:30, ry:6, fill:"rgba(66,39,16,.22)"}, g);
  }

  function makeBush(parent, x, y, scale){
    const g = el("g", {transform:`translate(${x} ${y}) scale(${scale})`, filter:"url(#softShadow)"}, parent);
    [[-22,0,20],[0,-8,28],[26,0,19],[10,9,16]].forEach(([cx,cy,r]) => {
      el("circle", {cx, cy, r, fill:"#8faa52", opacity:".88"}, g);
    });
  }

  function answerBalloon(parent, options = {}){
    // إصدار 72:
    // بالون/منطاد تجريبي مرسوم بالكامل بالكود داخل SVG.
    // لا يعتمد على صورة خارجية، والنص قابل للتغيير لاحقًا من بيانات اللعبة.
    const x = options.x ?? 760;
    const y = options.y ?? 165;
    const scale = options.scale ?? 1;
    const lines = options.lines || ["ما أجمل", "الزهور!"];

    const g = el("g", {
      id:options.id || "answerBalloonDemo",
      transform:`translate(${x} ${y}) scale(${scale})`,
      filter:options.shadow === false ? "none" : "url(#balloonShadow)"
    }, parent);

    // زعانف خلفية يمين مثل المرجع.
    el("path", {
      d:"M116 -23 L153 -43 L153 -5 L118 3 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".92"
    }, g);
    el("path", {
      d:"M118 12 L153 4 L153 42 L113 25 Z",
      fill:"url(#balloonFinGrad)",
      stroke:"#6e7895",
      "stroke-width":2.2,
      opacity:".9"
    }, g);
    el("path", {
      d:"M122 -7 L162 -18 L162 20 L122 9 Z",
      fill:"#75809d",
      stroke:"#646f8a",
      "stroke-width":2,
      opacity:".7"
    }, g);

    // جسم البالون.
    el("ellipse", {
      cx:0,
      cy:0,
      rx:138,
      ry:64,
      fill:"url(#balloonBodyGrad)",
      stroke:"#68738f",
      "stroke-width":3.2
    }, g);

    // خطوط جسم البالون لإحساس الشكل المعدني/المنفوخ.
    [-42,-18,8,34].forEach((yy, idx) => {
      el("path", {
        d:`M-120 ${yy} C-58 ${yy - 16 + idx * 4} 52 ${yy - 14 + idx * 3} 120 ${yy - 2}`,
        fill:"none",
        stroke:idx < 2 ? "#eef4ff" : "#4e566c",
        "stroke-width":idx < 2 ? 2.2 : 1.6,
        opacity:idx < 2 ? ".55" : ".35"
      }, g);
    });

    // لمعة علوية خفيفة.
    el("ellipse", {
      cx:-30,
      cy:-27,
      rx:86,
      ry:21,
      fill:"url(#balloonHighlightGrad)",
      opacity:".72"
    }, g);

    // سلة/محرك صغير أسفل البالون.
    const gondola = el("g", {transform:"translate(-8 68)"}, g);
    el("path", {
      d:"M-34 -8 L35 -8 L27 18 L-25 18 Z",
      fill:"#6f7080",
      stroke:"#56596a",
      "stroke-width":2,
      opacity:".86"
    }, gondola);
    [-18,0,18].forEach(cx => {
      el("circle", {cx, cy:7, r:5, fill:"#858899", stroke:"#55586a", "stroke-width":1.5}, gondola);
    });

    // النص من الكود، وليس جزءًا من صورة.
    const text = el("text", {
      x:0,
      y:-10,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#050505",
      stroke:"#ffffff",
      "stroke-width":2.7,
      "paint-order":"stroke fill",
      "font-size":37,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    lines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 40
      }, text).textContent = line;
    });

    return g;
  }

  const DEBUG_COLLISION = false;

  let fallingObjectsLayer = null;
  let settledObjectsLayer = null;
  let wagonForegroundCoverLayer = null;
  let collisionDebugLayer = null;
  const collisionMap = [];

  const BALLOONS_PER_ROUND = 5;
  const MEDIUM_BALLOON_SCALE = .80;
  const MAX_ACTIVE_FALLING_BOXES = 2;
  const MAX_SETTLED_BOXES = 6;
  const MAX_SETTLED_BOXES_PER_WAGON = 2;

  let activeFallingBoxes = 0;
  const settledBoxes = [];
  const settledBoxesByWagon = Object.create(null);

  function removeSettledBoxRecord(record){
    if(!record) return;
    const node = record.node || record;
    if(node && node.parentNode) node.remove();
  }

  function rememberSettledBox(node, wagonIndex){
    const record = {node, wagonIndex};
    settledBoxes.push(record);

    if(wagonIndex !== null && wagonIndex !== undefined){
      const key = String(wagonIndex);
      const list = settledBoxesByWagon[key] || (settledBoxesByWagon[key] = []);
      list.push(record);

      while(list.length > MAX_SETTLED_BOXES_PER_WAGON){
        const oldRecord = list.shift();
        removeSettledBoxRecord(oldRecord);
        const globalIndex = settledBoxes.indexOf(oldRecord);
        if(globalIndex >= 0) settledBoxes.splice(globalIndex, 1);
      }
    }

    while(settledBoxes.length > MAX_SETTLED_BOXES){
      removeSettledBoxRecord(settledBoxes.shift());
    }
  }

  function balloonBurst(parent, x, y, scale = 1){
    const burst = el("g", {
      transform:`translate(${x} ${y}) scale(${scale})`,
      opacity:"1"
    }, parent);

    const boom = el("text", {
      x:0,
      y:-86,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#e92323",
      stroke:"#fff1a8",
      "stroke-width":5.2,
      "paint-order":"stroke fill",
      "font-size":46,
      "font-weight":1000,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      transform:"scale(.72)",
      opacity:"0"
    }, burst);
    boom.textContent = "بووم!";

    const boomIn = el("animate", {
      attributeName:"opacity",
      values:"0;1;1;0",
      keyTimes:"0;.18;.68;1",
      dur:".62s",
      fill:"freeze"
    }, boom);
    const boomScale = el("animateTransform", {
      attributeName:"transform",
      type:"scale",
      values:".72;1.18;1.02;.9",
      keyTimes:"0;.2;.62;1",
      dur:".62s",
      fill:"freeze"
    }, boom);
    boomIn.beginElement();
    boomScale.beginElement();

    const pieces = [
      [-36,-16,-74,-42],[-12,-28,-28,-72],[20,-24,44,-68],
      [46,-4,90,-22],[-44,18,-86,38],[-8,30,-24,76],
      [26,24,58,66],[58,20,106,46],[-78,0,-126,-10],[78,-8,132,-18]
    ];

    pieces.forEach(([x1,y1,x2,y2], index) => {
      const shard = el("path", {
        d:`M${x1} ${y1} L${x1 + 12} ${y1 + 8} L${x2} ${y2} Z`,
        fill:index % 2 ? "#cbd7ef" : "#828da9",
        stroke:"#66718f",
        "stroke-width":1.3,
        opacity:".96"
      }, burst);
      const animate = el("animate", {
        attributeName:"opacity",
        values:".96;.62;0",
        dur:".58s",
        fill:"freeze"
      }, shard);
      animate.beginElement();
    });

    const ring = el("ellipse", {
      cx:0,
      cy:0,
      rx:46,
      ry:22,
      fill:"none",
      stroke:"#ff3b30",
      "stroke-width":5,
      opacity:".7"
    }, burst);

    const ringGrow = el("animate", {
      attributeName:"rx",
      values:"34;84;114",
      dur:".52s",
      fill:"freeze"
    }, ring);
    const ringFade = el("animate", {
      attributeName:"opacity",
      values:".7;.35;0",
      dur:".52s",
      fill:"freeze"
    }, ring);
    ringGrow.beginElement();
    ringFade.beginElement();

    setTimeout(() => burst.remove(), 760);
  }

  function answerBox(parent, textLines = ["ما أجمل", "الزهور!"]){
    const g = el("g", {
      filter:"url(#answerBoxShadow)"
    }, parent);

    // صندوق بسيط مؤقت لاختبار فيزياء السقوط فقط.
    el("path", {
      d:"M-46 -32 L46 -32 L58 -18 L-34 -18 Z",
      fill:"url(#answerBoxTopGrad)",
      stroke:"#4e2b18",
      "stroke-width":2
    }, g);

    el("rect", {
      x:-46,
      y:-18,
      width:92,
      height:60,
      rx:7,
      fill:"url(#answerBoxGrad)",
      stroke:"#4e2b18",
      "stroke-width":2.5
    }, g);

    el("path", {
      d:"M-46 2 L46 2 M-18 -18 L-18 42 M18 -18 L18 42",
      fill:"none",
      stroke:"#d3a06a",
      "stroke-width":3,
      opacity:".72"
    }, g);

    const text = el("text", {
      x:0,
      y:5,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#fff0b8",
      stroke:"#442313",
      "stroke-width":1.9,
      "paint-order":"stroke fill",
      "font-size":17,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl",
      style:"direction:rtl;unicode-bidi:plaintext"
    }, g);

    textLines.forEach((line, index) => {
      el("tspan", {
        x:0,
        dy:index === 0 ? 0 : 20
      }, text).textContent = line;
    });

    return g;
  }

  function trackImpactBurst(parent, x, y){
    const burst = el("g", {
      transform:`translate(${x} ${y})`,
      opacity:"1"
    }, parent);

    for(let i = 0; i < 12; i++){
      const angle = Math.PI + Math.random() * Math.PI;
      const dist = 20 + Math.random() * 48;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist * .42;
      const dot = el("circle", {
        cx:0,
        cy:0,
        r:3 + Math.random() * 4,
        fill:i % 2 ? "#8a5a34" : "#d2a36a",
        opacity:".75"
      }, burst);
      const move = el("animateTransform", {
        attributeName:"transform",
        type:"translate",
        from:"0 0",
        to:`${dx.toFixed(1)} ${dy.toFixed(1)}`,
        dur:".38s",
        fill:"freeze"
      }, dot);
      const fade = el("animate", {
        attributeName:"opacity",
        values:".75;.35;0",
        dur:".42s",
        fill:"freeze"
      }, dot);
      move.beginElement();
      fade.beginElement();
    }

    setTimeout(() => burst.remove(), 520);
  }

  const BOX = {
    left:46,
    right:58,
    top:32,
    bottom:42,
    width:104,
    height:74
  };

  const PHYSICS = {
    // سقوط أسرع قليلًا مثل المرجع، بدون أن يصبح ثقيلًا جدًا.
    gravityScale:1.30,

    // مقاومة الهواء أخف، وتعمل أساسًا أثناء السقوط قبل ملامسة القطار.
    airTargetVX:-2.35,
    airPull:.00020,
    maxActiveMatterBoxes:4,

    // داخل العربة: كبح خفيف بعد الاصطدام الحقيقي فقط، بدون تعليق في الهواء.
    wagonDampingX:.90,
    wagonDampingY:.94,
    wagonAngularDamping:.90,
    wagonInnerGravity:.00034,

    // التثبيت بعد أن تهدأ الحركة فعلًا.
    captureDelayMin:650,
    captureDelayMax:1150,
    captureSpeedLimit:.72,

    // الفاصل بين العربات لا يستقبل الصندوق؛ يتم توجيهه للعربة الأقرب.
    gapRouteCooldown:300,

    // أعلى مقطورة السائق: bumper فقط، يسبب قفزة قصيرة ثم يترك الصندوق السطح مباشرة.
    roofBounceVX:-0.26,
    roofBounceVY:-1.92,
    roofBounceSpin:.044,
    roofBounceCooldown:520,
    roofSafeLeft:784,
    roofSafeRight:904,
    roofY:424
  };

  let matterEngine = null;
  let matterRunnerStarted = false;
  let matterLastTime = 0;
  let matterStaticBodies = [];
  const matterBoxes = [];

  function clamp(value, min, max){
    return Math.max(min, Math.min(max, value));
  }

  function isMatterReady(){
    return !!(window.Matter && Matter.Engine && Matter.World && Matter.Bodies && Matter.Body);
  }

  let matterLibraryLoading = false;

  function loadMatterLibrary(){
    if(isMatterReady()){
      buildCollisionMap();
      startMatterLoop();
      return;
    }

    if(matterLibraryLoading) return;
    matterLibraryLoading = true;

    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js";
    script.async = true;

    script.onload = () => {
      matterLibraryLoading = false;
      buildCollisionMap();
      startMatterLoop();
    };

    script.onerror = () => {
      matterLibraryLoading = false;
    };

    document.head.appendChild(script);
  }

  function releaseOldestMatterBoxIfNeeded(){
    const liveBoxes = matterBoxes.filter(item => item && !item.done);
    activeFallingBoxes = Math.min(activeFallingBoxes, liveBoxes.length);

    if(activeFallingBoxes < PHYSICS.maxActiveMatterBoxes) return;

    const oldest = liveBoxes[0];
    if(oldest){
      cleanupMatterBox(oldest, true);
    }else{
      activeFallingBoxes = 0;
    }
  }

  function makeZone(type, rect, meta = {}){
    return {type, ...rect, ...meta};
  }

  function makeWell(rect, meta = {}){
    return makeZone("well", rect, meta);
  }

  function makeSurface(rect, meta = {}){
    return makeZone("surface", rect, meta);
  }

  function makeBreak(rect, meta = {}){
    return makeZone("break", rect, meta);
  }

  function makeBreakSurface(rect, meta = {}){
    return makeZone("break-surface", rect, meta);
  }

  function resetMatterWorld(){
    if(!isMatterReady()) return;

    if(!matterEngine){
      matterEngine = Matter.Engine.create({
        enableSleeping:false,
        positionIterations:8,
        velocityIterations:8,
        constraintIterations:2
      });
      matterEngine.gravity.x = 0;
      matterEngine.gravity.y = PHYSICS.gravityScale;

      Matter.Events.on(matterEngine, "collisionStart", event => {
        for(const pair of event.pairs){
          handleMatterCollision(pair.bodyA, pair.bodyB);
          handleMatterCollision(pair.bodyB, pair.bodyA);
        }
      });

      Matter.Events.on(matterEngine, "collisionActive", event => {
        for(const pair of event.pairs){
          handleMatterCollision(pair.bodyA, pair.bodyB);
          handleMatterCollision(pair.bodyB, pair.bodyA);
        }
      });
    }else{
      Matter.World.clear(matterEngine.world, false);
      matterEngine.gravity.y = PHYSICS.gravityScale;
    }

    matterStaticBodies = [];
    matterBoxes.length = 0;
    activeFallingBoxes = 0;
  }

  function addMatterBody(body){
    if(!isMatterReady() || !matterEngine) return null;
    matterStaticBodies.push(body);
    Matter.World.add(matterEngine.world, body);
    return body;
  }

  function addMatterRect(x, y, w, h, options = {}){
    if(!isMatterReady() || !matterEngine) return null;
    const body = Matter.Bodies.rectangle(x, y, w, h, {
      isStatic:true,
      friction:.72,
      frictionStatic:.88,
      restitution:.02,
      ...options
    });
    return addMatterBody(body);
  }


  function bodyBoxBounds(body){
    return {
      left:body.position.x - BOX.width / 2,
      right:body.position.x + BOX.width / 2,
      top:body.position.y - BOX.height / 2,
      bottom:body.position.y + BOX.height / 2
    };
  }

  function horizontalOverlap(aLeft, aRight, bLeft, bRight){
    return Math.max(0, Math.min(aRight, bRight) - Math.max(aLeft, bLeft));
  }

  function getBestWellForBody(body){
    const bounds = bodyBoxBounds(body);
    let bestWell = null;
    let bestOverlap = 0;
    let nearestWell = null;
    let nearestDistance = Infinity;

    for(const zone of collisionMap){
      if(zone.type !== "well") continue;

      const overlap = horizontalOverlap(bounds.left, bounds.right, zone.left, zone.right);
      if(overlap > bestOverlap){
        bestOverlap = overlap;
        bestWell = zone;
      }

      const center = (zone.left + zone.right) / 2;
      const distance = Math.abs(body.position.x - center);
      if(distance < nearestDistance){
        nearestDistance = distance;
        nearestWell = zone;
      }
    }

    if(bestWell && bestOverlap >= BOX.width * .28){
      return bestWell;
    }

    if(nearestWell && nearestDistance < 190){
      return nearestWell;
    }

    return null;
  }

  function getWellByIndex(index){
    for(const zone of collisionMap){
      if(zone.type === "well" && zone.index === index) return zone;
    }
    return null;
  }

  function getLandingWellForBody(body){
    const bounds = bodyBoxBounds(body);

    // مهم: هذه الدالة لا تلتقط الصندوق من الهواء.
    // تستخدم فقط عندما وصل الصندوق فعليًا إلى مستوى الفاصل بين العربات.
    const reachedGapLevel = bounds.bottom >= TRAIN_LAYOUT.wagonY + 44;
    const stillNearWagons = bounds.top <= TRAIN_LAYOUT.wagonY + TRAIN_LAYOUT.wagonH + 26;
    if(!reachedGapLevel || !stillNearWagons) return null;

    let bestWell = null;
    let bestOverlap = 0;
    let nearestWell = null;
    let nearestDistance = Infinity;

    for(const zone of collisionMap){
      if(zone.type !== "well") continue;

      const overlap = horizontalOverlap(bounds.left, bounds.right, zone.left, zone.right);
      if(overlap > bestOverlap){
        bestOverlap = overlap;
        bestWell = zone;
      }

      const distanceToWell = body.position.x < zone.left
        ? zone.left - body.position.x
        : body.position.x > zone.right
          ? body.position.x - zone.right
          : 0;

      if(distanceToWell < nearestDistance){
        nearestDistance = distanceToWell;
        nearestWell = zone;
      }
    }

    if(bestWell && bestOverlap >= BOX.width * .18){
      return bestWell;
    }

    if(nearestWell && nearestDistance <= 34){
      return nearestWell;
    }

    return null;
  }

  function isOutsideDriverRoofSafeZone(body){
    const bounds = bodyBoxBounds(body);
    const touchesRoofBand =
      bounds.bottom >= PHYSICS.roofY - 2 &&
      bounds.top <= PHYSICS.roofY + 46 &&
      body.position.x >= 748 &&
      body.position.x <= 950;

    if(!touchesRoofBand) return false;

    const centerInsideSafe =
      body.position.x >= PHYSICS.roofSafeLeft &&
      body.position.x <= PHYSICS.roofSafeRight;

    return !centerInsideSafe;
  }

  function buildCollisionMap(){
    collisionMap.length = 0;
    resetMatterWorld();

    // السكة والأرض: منطقة قتل فقط.
    collisionMap.push(makeBreakSurface({
      left:-90,
      right:1380,
      y:604,
      thickness:54
    }, {name:"track"}));

    addMatterRect(640, TRAIN_PHYSICS_PROFILES.track.y, TRAIN_PHYSICS_PROFILES.track.w, TRAIN_PHYSICS_PROFILES.track.h, {
      label:"kill-track",
      isSensor:true
    });

    // المرحلة الأولى: بناء فيزياء القطار من مكوّنات جاهزة، لا من أرقام مبعثرة.
    addAllTrainPartPhysics();

    // مناطق القاطرة القاتلة تبقى كما هي، لأنها خارج نظام استقبال الصناديق.
    [
      {name:"engine-front", left:1058, right:1164, top:438, bottom:610},
      {name:"engine-nose", left:1116, right:1208, top:498, bottom:620},
      {name:"engine-plow", left:1088, right:1210, top:550, bottom:632}
    ].forEach(zone => {
      collisionMap.push(makeBreak({
        left:zone.left,
        right:zone.right,
        top:zone.top,
        bottom:zone.bottom
      }, {name:zone.name}));

      addMatterRect(
        (zone.left + zone.right) / 2,
        (zone.top + zone.bottom) / 2,
        zone.right - zone.left,
        zone.bottom - zone.top,
        {
          label:`kill-${zone.name}`,
          sgType:"kill",
          isSensor:true
        }
      );
    });
  }

  function drawCollisionDebug(){
    if(!DEBUG_COLLISION || !collisionDebugLayer) return;
    collisionDebugLayer.innerHTML = "";

    const colors = {
      "well":"#00c853",
      "surface":"#00b0ff",
      "break":"#ff1744",
      "break-surface":"#ff7a00"
    };

    collisionMap.forEach(zone => {
      if(zone.type === "surface" || zone.type === "break-surface"){
        el("rect", {
          x:zone.left,
          y:zone.y,
          width:zone.right - zone.left,
          height:zone.thickness || 22,
          fill:colors[zone.type],
          opacity:".16",
          stroke:colors[zone.type],
          "stroke-width":2
        }, collisionDebugLayer);
      }else{
        el("rect", {
          x:zone.left,
          y:zone.top,
          width:zone.right - zone.left,
          height:zone.bottom - zone.top,
          fill:colors[zone.type] || "#fff",
          opacity:".16",
          stroke:colors[zone.type] || "#fff",
          "stroke-width":2
        }, collisionDebugLayer);
      }
    });
  }

  function isBodyInsideWell(body, well){
    return body.position.x >= well.left + 2 &&
      body.position.x <= well.right - 2 &&
      body.position.y >= well.top &&
      body.position.y <= well.bottom + 30;
  }

  function getWellByMatterBody(body){
    for(const zone of collisionMap){
      if(zone.type !== "well") continue;
      if(isBodyInsideWell(body, zone)) return zone;
    }
    return null;
  }

  function syncMatterBox(item){
    const body = item.body;
    item.node.setAttribute(
      "transform",
      `translate(${body.position.x.toFixed(2)} ${body.position.y.toFixed(2)}) rotate(${(body.angle * 180 / Math.PI).toFixed(2)})`
    );
  }

  function moveMatterBoxBehindWagonCover(item){
    if(!item || item.insideWagonLayer || !settledObjectsLayer || !item.node) return;
    settledObjectsLayer.appendChild(item.node);
    item.insideWagonLayer = true;
  }

  function dampBodyInsideWagon(body){
    if(!body || !Matter || !Matter.Body) return;

    Matter.Body.setVelocity(body, {
      x:body.velocity.x * PHYSICS.wagonDampingX,
      y:body.velocity.y * PHYSICS.wagonDampingY
    });

    Matter.Body.setAngularVelocity(body, body.angularVelocity * PHYSICS.wagonAngularDamping);

    // جاذبية داخلية خفيفة جدًا للأسفل حتى يستقر داخل العربة بدل الانزلاق الطويل.
    Matter.Body.applyForce(body, body.position, {
      x:0,
      y:body.mass * PHYSICS.wagonInnerGravity
    });
  }

  function nudgeBodyTowardWell(body, well){
    if(!body || !well || !Matter || !Matter.Body) return;

    const safeLeft = well.left + 32;
    const safeRight = well.right - 32;
    const targetX = clamp(body.position.x, safeLeft, safeRight);
    const dx = targetX - body.position.x;

    if(Math.abs(dx) < 4) return;

    const direction = dx > 0 ? 1 : -1;
    const gentleSpeed = Math.min(.28, Math.max(.08, Math.abs(dx) / 260));

    Matter.Body.setVelocity(body, {
      x:body.velocity.x * .94 + direction * gentleSpeed,
      y:body.velocity.y * .985
    });

    Matter.Body.setAngularVelocity(body, body.angularVelocity * .97);
  }

  function applyDriverRoofBounce(item, body){
    if(!item || !body || !Matter || !Matter.Body) return;

    const now = performance.now();
    if(item.lastRoofBounceAt && now - item.lastRoofBounceAt < PHYSICS.roofBounceCooldown){
      return;
    }

    item.lastRoofBounceAt = now;
    item.lastSurfaceContactAt = now;
    item.lastSurfaceType = "driver-roof";

    const currentVx = body.velocity.x;
    const currentVy = body.velocity.y;

    // قفزة من الاصطدام نفسه: نستخدم سرعة النزول لتحديد الارتداد، ولا نتركه يتدحرج.
    const upward = currentVy > 0
      ? -Math.min(2.05, Math.max(1.35, currentVy * .24))
      : Math.min(currentVy, PHYSICS.roofBounceVY);

    Matter.Body.setVelocity(body, {
      x:currentVx * .58 + PHYSICS.roofBounceVX,
      y:upward
    });

    const spinDirection = currentVx <= 0 ? -1 : 1;
    Matter.Body.setAngularVelocity(
      body,
      body.angularVelocity * .50 + spinDirection * PHYSICS.roofBounceSpin
    );

    // رفع بسيط يخرجه من التلامس حتى لا يتحول السقف إلى سطح دحرجة.
    Matter.Body.setPosition(body, {
      x:body.position.x,
      y:Math.min(body.position.y - 5, PHYSICS.roofY - BOX.bottom - 3)
    });
  }

  function routeGapBoxToNearestWagon(item, body, preferredWellIndex = null){
    if(!item || !body || item.done) return;

    const now = performance.now();
    if(item.lastGapRouteAt && now - item.lastGapRouteAt < PHYSICS.gapRouteCooldown){
      return;
    }

    const targetWell = getWellByIndex(preferredWellIndex) || getLandingWellForBody(body);
    if(!targetWell){
      return;
    }

    item.lastGapRouteAt = now;
    item.lastWellIndex = targetWell.index;

    // الفاصل لا يلتقط الصندوق ولا يثبته ولا ينقله خلف العربة.
    // فقط يزحزحه بخفة وهو في مستوى الفاصل، ثم Matter يكمل السقوط/الانزلاق.
    nudgeBodyTowardWell(body, targetWell);
  }

  function cleanupMatterBox(item, removeVisual = true){
    if(!item || item.done) return;
    item.done = true;

    if(item.body && matterEngine && matterEngine.world){
      Matter.World.remove(matterEngine.world, item.body);
    }

    if(removeVisual && item.node && item.node.parentNode){
      item.node.remove();
    }

    const index = matterBoxes.indexOf(item);
    if(index >= 0) matterBoxes.splice(index, 1);

    activeFallingBoxes = Math.max(0, activeFallingBoxes - 1);
  }

  function breakMatterBox(item){
    if(!item || item.done) return;

    const x = item.body.position.x;
    const y = item.body.position.y;

    cleanupMatterBox(item, true);
    trackImpactBurst(fallingObjectsLayer || svg, x, Math.min(y + BOX.bottom, 610));
  }

  function getWagonSlotTarget(well, startX, startRotation){
    // لا توجد خانات ثابتة ولا تعديل سريع للزاوية.
    // نجمّد الصندوق قريبًا جدًا من آخر موضع وصل له، مع تصحيح خفيف فقط للحواف والارتفاع.
    const safeLeft = well.left + 30;
    const safeRight = well.right - 30;

    let targetX = startX;
    if(targetX < safeLeft) targetX = startX + Math.min(12, safeLeft - startX);
    if(targetX > safeRight) targetX = startX - Math.min(12, startX - safeRight);

    const naturalY = well.floorY - BOX.bottom - 8;
    let targetY = startY;
    if(targetY < naturalY - 16) targetY = startY + Math.min(10, (naturalY - 16) - startY);
    if(targetY > naturalY + 10) targetY = startY - Math.min(10, startY - (naturalY + 10));

    const targetRotation = clamp(startRotation, -52, 52);

    return {targetX, targetY, targetRotation};
  }

  function animateBoxToSlot(node, startX, startY, startRotation, targetX, targetY, targetRotation){
    const dx = Math.abs(targetX - startX);
    const dy = Math.abs(targetY - startY);
    const dr = Math.abs(targetRotation - startRotation);

    // إذا كان التصحيح صغيرًا، نثبته مباشرة حتى لا تظهر حركة مبرمجة.
    if(dx < 2.5 && dy < 2.5 && dr < 1.5){
      node.setAttribute(
        "transform",
        `translate(${targetX.toFixed(2)} ${targetY.toFixed(2)}) rotate(${targetRotation.toFixed(2)})`
      );
      return;
    }

    const start = performance.now();
    const duration = 180;

    function easeOutSine(t){
      return Math.sin((t * Math.PI) / 2);
    }

    function frame(now){
      const t = Math.min(1, (now - start) / duration);
      const e = easeOutSine(t);

      const x = startX + (targetX - startX) * e;
      const y = startY + (targetY - startY) * e;
      const r = startRotation + (targetRotation - startRotation) * e;

      node.setAttribute(
        "transform",
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`
      );

      if(t < 1){
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  }

  function settleMatterBox(item, well){
    if(!item || item.done) return;

    const body = item.body;
    const node = item.node;

    if(body && node){
      const x = body.position.x;
      const y = body.position.y;
      const r = body.angle * 180 / Math.PI;

      node.setAttribute(
        "transform",
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)})`
      );
    }

    // المرحلة الأولى: الصندوق المستقر يبقى بصريًا فقط ولا يؤثر على أي صندوق جديد.
    cleanupMatterBox(item, false);

    const layer = settledObjectsLayer || fallingObjectsLayer || svg;
    if(node && node.parentNode !== layer){
      layer.appendChild(node);
    }

    rememberSettledBox(node, well && well.index);
  }

  function handleMatterCollision(bodyA, bodyB){
    const item = bodyA && bodyA.sgItem;
    if(!item || item.done) return;

    if(bodyB && bodyB.sgType === "roof-kill"){
      const now = performance.now();
      const recentlyBounced =
        item.lastRoofBounceAt && now - item.lastRoofBounceAt < PHYSICS.roofBounceCooldown;
      const centerInsideSafe =
        bodyA.position.x >= PHYSICS.roofSafeLeft &&
        bodyA.position.x <= PHYSICS.roofSafeRight;

      if(!recentlyBounced && !centerInsideSafe){
        breakMatterBox(item);
      }
      return;
    }

    if(bodyB && (bodyB.sgType === "kill" || String(bodyB.label || "").startsWith("kill-"))){
      breakMatterBox(item);
      return;
    }

    if(bodyB && bodyB.sgType === "gap-smart-bouncer"){
      applySmartGapBounceToMatter(item, bodyA, bodyB);
      return;
    }

    if(bodyB && bodyB.sgType === "wagon-top-edge-bumper"){
      applyWagonTopBumperBounceToMatter(item, bodyA, bodyB);
      return;
    }

    if(bodyB && (bodyB.sgType === "wagon-floor" || bodyB.sgType === "wagon-wall")){
      item.lastWagonContactAt = performance.now();
      item.lastWellIndex = bodyB.sgWellIndex;
      item.insideWagon = true;

      if(!item.enteredWellAt){
        item.enteredWellAt = performance.now();
        item.captureAfter = PHYSICS.captureDelayMin +
          Math.random() * (PHYSICS.captureDelayMax - PHYSICS.captureDelayMin);
      }

      const hitWell = getWellByIndex(bodyB.sgWellIndex);
      if(hitWell && bodyA.position.y >= hitWell.floorY - BOX.bottom - 18){
        moveMatterBoxBehindWagonCover(item);
      }

      dampBodyInsideWagon(bodyA);
      return;
    }

    if(bodyB && bodyB.sgType === "driver-roof"){
      applyDriverRoofBounce(item, bodyA);
      return;
    }

    if(bodyB && bodyB.sgType === "gap-router"){
      routeGapBoxToNearestWagon(item, bodyA, bodyB.sgWellIndex);
      return;
    }
  }

  function updateMatterBoxState(item, now){
    if(item.done) return;

    const body = item.body;

    const well = getWellByMatterBody(body);
    const activeWell = well || (item.insideWagon ? getWellByIndex(item.lastWellIndex) : null);

    // حماية من الصناديق العالقة: لا نكسر صندوقًا دخل العربة فعلًا.
    if(item.spawnedAt && now - item.spawnedAt > 5200){
      const timeoutWell = activeWell || getWellByMatterBody(body);
      if(timeoutWell && item.insideWagon){
        settleMatterBox(item, timeoutWell);
      }else{
        breakMatterBox(item);
      }
      return;
    }

    if(activeWell && item.insideWagon){
      if(!item.enteredWellAt){
        item.enteredWellAt = now;
        item.captureAfter = PHYSICS.captureDelayMin +
          Math.random() * (PHYSICS.captureDelayMax - PHYSICS.captureDelayMin);
      }

      const closeToFloor = body.position.y >= activeWell.floorY - BOX.bottom - 16;
      if(closeToFloor){
        moveMatterBoxBehindWagonCover(item);
      }

      // لا كبح ولا تثبيت إلا بعد الاصطدام الحقيقي داخل العربة.
      dampBodyInsideWagon(body);

      const timeInside = now - item.enteredWellAt;
      const captureReady = timeInside >= item.captureAfter;
      const slowEnough = body.speed < PHYSICS.captureSpeedLimit && Math.abs(body.angularVelocity) < .095;
      const deepEnough = body.position.y >= activeWell.floorY - BOX.bottom - 18;
      const waitedLongEnough = timeInside > 1700;
      const almostStopped = body.speed < .92 && Math.abs(body.angularVelocity) < .13;

      if(deepEnough && ((captureReady && slowEnough) || (waitedLongEnough && almostStopped))){
        settleMatterBox(item, activeWell);
        return;
      }

      syncMatterBox(item);
      return;
    }

    // سقوط حر كامل. لا نعامل الصندوق كأنه داخل عربة قبل التصادم الحقيقي.
    const recentlyHitRoof = item.lastSurfaceType === "driver-roof" &&
      item.lastSurfaceContactAt &&
      now - item.lastSurfaceContactAt < 260;

    if(!recentlyHitRoof){
      const velocityError = PHYSICS.airTargetVX - body.velocity.x;
      Matter.Body.applyForce(body, body.position, {
        x:velocityError * body.mass * PHYSICS.airPull,
        y:0
      });
    }

    if(body.position.y > 670 || body.position.x < -200){
      breakMatterBox(item);
      return;
    }

    syncMatterBox(item);
  }

  function startMatterLoop(){
    if(matterRunnerStarted || !isMatterReady() || !matterEngine) return;
    matterRunnerStarted = true;

    function frame(now){
      const dt = matterLastTime ? Math.min(34, now - matterLastTime) : 16.666;
      matterLastTime = now;

      if(matterBoxes.length){
        Matter.Engine.update(matterEngine, dt);

        for(const item of [...matterBoxes]){
          updateMatterBoxState(item, now);
        }
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }


  const manualBoxes = [];
  let manualLoopStarted = false;
  let manualLastTime = 0;

  function manualBoxBounds(item){
    return {
      left:item.x - BOX.left,
      right:item.x + BOX.right,
      top:item.y - BOX.top,
      bottom:item.y + BOX.bottom
    };
  }

  function getManualWellForBox(item){
    const bounds = manualBoxBounds(item);
    let bestWell = null;
    let bestOverlap = 0;

    for(const zone of collisionMap){
      if(zone.type !== "well") continue;
      const overlap = horizontalOverlap(bounds.left, bounds.right, zone.left, zone.right);
      if(overlap > bestOverlap){
        bestOverlap = overlap;
        bestWell = zone;
      }
    }

    return bestOverlap >= BOX.width * .16 ? bestWell : null;
  }

  function getNearestManualWell(item){
    let nearestWell = null;
    let nearestDistance = Infinity;

    for(const zone of collisionMap){
      if(zone.type !== "well") continue;

      const distance = item.x < zone.left
        ? zone.left - item.x
        : item.x > zone.right
          ? item.x - zone.right
          : 0;

      if(distance < nearestDistance){
        nearestDistance = distance;
        nearestWell = zone;
      }
    }

    return nearestDistance <= 54 ? nearestWell : null;
  }

  function syncManualBox(item){
    if(!item || !item.node) return;
    item.node.setAttribute(
      "transform",
      `translate(${item.x.toFixed(2)} ${item.y.toFixed(2)}) rotate(${item.rotation.toFixed(2)})`
    );
  }

  function moveManualBoxBehindWagon(item){
    if(!item || item.insideWagonLayer || !settledObjectsLayer || !item.node) return;
    settledObjectsLayer.appendChild(item.node);
    item.insideWagonLayer = true;
  }

  function cleanupManualBox(item, removeVisual = true){
    if(!item || item.done) return;
    item.done = true;

    const index = manualBoxes.indexOf(item);
    if(index >= 0) manualBoxes.splice(index, 1);

    activeFallingBoxes = Math.max(0, activeFallingBoxes - 1);

    if(removeVisual && item.node && item.node.parentNode){
      item.node.remove();
    }
  }

  function breakManualBox(item){
    if(!item || item.done) return;
    const x = item.x;
    const y = item.y;
    cleanupManualBox(item, true);
    trackImpactBurst(fallingObjectsLayer || svg, x, Math.min(y + BOX.bottom, 610));
  }

  function settleManualBox(item, well){
    if(!item || item.done || !well) return;

    const minX = well.left + BOX.left + 8;
    const maxX = well.right - BOX.right - 8;
    const floorCenterY = well.floorY - BOX.bottom - 8;

    item.x = clamp(item.x, minX, maxX);
    item.y = clamp(item.y, floorCenterY - 8, floorCenterY + 6);
    item.rotation = clamp(item.rotation, -48, 48);

    cleanupManualBox(item, false);

    const layer = settledObjectsLayer || fallingObjectsLayer || svg;
    if(item.node && item.node.parentNode !== layer){
      layer.appendChild(item.node);
    }

    syncManualBox(item);
    rememberSettledBox(item.node, well.index);
  }

  function updateManualBox(item, dt, now){
    if(item.done) return;

    const beforeBottom = item.y + BOX.bottom;

    // سقوط حر واضح. لا يوجد أي التقاط من الهواء.
    item.vy += 1280 * dt;

    if(!item.insideWagon){
      // ميل خفيف لليسار أثناء السقوط فقط.
      item.vx += (-88 - item.vx) * .16 * dt;
    }

    item.x += item.vx * dt;
    item.y += item.vy * dt;
    item.rotation += item.vr * dt;

    const afterBottom = item.y + BOX.bottom;

    // قفزة سقف مقطورة السائق كتصادم لحظي، بدون سطح دحرجة.
    if(!item.roofBounced &&
      item.vy > 0 &&
      item.x >= PHYSICS.roofSafeLeft &&
      item.x <= PHYSICS.roofSafeRight &&
      beforeBottom <= PHYSICS.roofY + 8 &&
      afterBottom >= PHYSICS.roofY){

      item.roofBounced = true;
      item.y = PHYSICS.roofY - BOX.bottom - 2;
      item.vy = -365;
      item.vx = Math.min(item.vx, -86);
      item.vr += item.vx < 0 ? -35 : 35;
    }

    const well = getManualWellForBox(item);

    // إذا وقع بين العربات وعلى مستوى الفاصل، نزحة خفيفة فقط. لا تثبيت ولا نقل.
    if(!well && afterBottom >= TRAIN_LAYOUT.wagonY + 42){
      const nearest = getNearestManualWell(item);
      if(nearest){
        const targetX = clamp(item.x, nearest.left + BOX.left + 14, nearest.right - BOX.right - 14);
        const dx = targetX - item.x;
        item.vx += clamp(dx * 1.35, -34, 34) * dt;
        item.vr *= Math.pow(.988, dt * 60);
      }
    }

    if(well){
      const floorBottom = well.floorY - 8;
      const hitFloor = item.vy >= 0 && beforeBottom <= floorBottom + 18 && afterBottom >= floorBottom;

      if(hitFloor){
        if(!item.insideWagon){
          item.insideWagon = true;
          item.enteredWellAt = now;
          item.captureAfter = PHYSICS.captureDelayMin +
            Math.random() * (PHYSICS.captureDelayMax - PHYSICS.captureDelayMin);
          item.lastWellIndex = well.index;
        }

        item.y = well.floorY - BOX.bottom - 8;

        // كتلة ثقيلة: ارتداد بسيط جدًا، ثم انزلاق واحتكاك.
        if(Math.abs(item.vy) > 230){
          item.vy = -Math.abs(item.vy) * .13;
          item.vr += item.vx < 0 ? -20 : 20;
        }else{
          item.vy = 0;
        }

        item.vx *= .80;
        item.vr *= .82;

        moveManualBoxBehindWagon(item);
      }

      if(item.insideWagon){
        const minX = well.left + BOX.left + 8;
        const maxX = well.right - BOX.right - 8;

        if(item.x < minX){
          item.x = minX;
          item.vx = Math.abs(item.vx) * .22;
          item.vr *= .75;
        }

        if(item.x > maxX){
          item.x = maxX;
          item.vx = -Math.abs(item.vx) * .22;
          item.vr *= .75;
        }

        // احتكاك أرضي بطيء، لا يوقف الصندوق فجأة.
        const nearFloor = Math.abs((item.y + BOX.bottom) - well.floorY) < 18;
        if(nearFloor && Math.abs(item.vy) < 12){
          item.vx *= Math.pow(.965, dt * 60);
          item.vr *= Math.pow(.955, dt * 60);
        }

        const timeInside = now - item.enteredWellAt;
        const speed = Math.hypot(item.vx, item.vy);
        const stableEnough =
          timeInside >= item.captureAfter &&
          speed < 18 &&
          Math.abs(item.vr) < 18 &&
          nearFloor;

        const waitedEnough =
          timeInside > 2600 &&
          speed < 36 &&
          nearFloor;

        if(stableEnough || waitedEnough){
          settleManualBox(item, well);
          return;
        }
      }
    }

    // إذا فات العربات وضرب الأرض/السكة، ينكسر.
    if(afterBottom >= 610 && !well && !item.insideWagon){
      breakManualBox(item);
      return;
    }

    if(item.y > 690 || item.x < -240){
      breakManualBox(item);
      return;
    }

    syncManualBox(item);
  }

  function startManualLoop(){
    if(manualLoopStarted) return;
    manualLoopStarted = true;

    function frame(now){
      const dt = manualLastTime ? Math.min(.034, (now - manualLastTime) / 1000) : .016;
      manualLastTime = now;

      for(const item of [...manualBoxes]){
        updateManualBox(item, dt, now);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function releaseOldestManualBoxIfNeeded(){
    const liveBoxes = manualBoxes.filter(item => item && !item.done);
    if(liveBoxes.length < PHYSICS.maxActiveMatterBoxes) return;

    const oldest = liveBoxes[0];
    if(!oldest) return;

    if(oldest.insideWagon && oldest.lastWellIndex !== null){
      const well = getWellByIndex(oldest.lastWellIndex);
      if(well){
        settleManualBox(oldest, well);
        return;
      }
    }

    breakManualBox(oldest);
  }

  function spawnManualAnswerBox(startX, startY, textLines){
    releaseOldestManualBoxIfNeeded();

    const layer = fallingObjectsLayer || svg;
    const node = answerBox(layer, textLines);

    const item = {
      node,
      textLines,
      x:startX,
      y:startY + 54,
      vx:-72 + Math.random() * 18,
      vy:24 + Math.random() * 16,
      rotation:-8 + Math.random() * 16,
      vr:-64 + Math.random() * 128,
      done:false,
      insideWagon:false,
      insideWagonLayer:false,
      enteredWellAt:0,
      captureAfter:0,
      lastWellIndex:null,
      roofBounced:false
    };

    manualBoxes.push(item);
    activeFallingBoxes += 1;
    syncManualBox(item);
    startManualLoop();
    return true;
  }

  function spawnFallbackAnswerBox(startX, startY, textLines){
    const layer = fallingObjectsLayer || svg;
    const box = answerBox(layer, textLines);
    let x = startX;
    let y = startY + 54;
    let vy = 20;
    let vx = -72;
    let rotation = -8;
    let vr = -84;
    let lastTime = performance.now();
    const startedAt = lastTime;
    let cleaned = false;

    function cleanup(){
      if(cleaned) return;
      cleaned = true;
      activeFallingBoxes = Math.max(0, activeFallingBoxes - 1);
    }

    function frame(now){
      const dt = Math.min(.04, (now - lastTime) / 1000);
      lastTime = now;
      vy += 820 * dt;
      x += vx * dt;
      y += vy * dt;
      rotation += vr * dt;
      box.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rotation.toFixed(2)})`);

      if(y > 610 || now - startedAt > 5000){
        box.remove();
        cleanup();
        trackImpactBurst(fallingObjectsLayer || svg, x, Math.min(y, 610));
      }else{
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  }

  function speedFromLevel(level){

    // سرعة بطيئة الآن، وقابلة للتوسيع لاحقًا من شريط السرعة.

  function createBalloonMotionState(config, index = 0){
    const now = performance.now();
    return {
      x:(config.startX ?? 1355) + index * 168 + Math.random() * 34,
      y:(config.baseY ?? 178) + (Math.random() * 34 - 17),
      lastTime:now,

      phaseB:Math.random() * Math.PI * 2,
      phaseC:Math.random() * Math.PI * 2,
      drift:0,
      driftTarget:0,
      nextDriftAt:now + 650 + Math.random() * 1200
    };
  }

  function recycleBalloon(item, now, forceFarRight = false){
    const rightMost = activeBalloons.reduce((max, other) => {
      if(other === item || other.popped) return max;
      return Math.max(max, other.state.x);
    }, BALLOON_FLIGHT.startX);

    item.config.lines = nextBalloonLines();
    setBalloonLines(item.node, item.config.lines);

    item.state.x = forceFarRight
      ? BALLOON_FLIGHT.startX + item.index * 168 + Math.random() * 38
      : Math.max(BALLOON_FLIGHT.startX + Math.random() * 90, rightMost + 156 + Math.random() * 52);

    item.state.y = item.config.baseY + (Math.random() * 40 - 20);
    item.state.phaseA = Math.random() * Math.PI * 2;
    item.state.phaseB = Math.random() * Math.PI * 2;
    item.state.phaseC = Math.random() * Math.PI * 2;
    item.state.drift = 0;
    item.state.driftTarget = Math.random() * 44 - 22;
    item.state.nextDriftAt = now + 750 + Math.random() * 1700;

    item.node.setAttribute("opacity", "1");
    item.node.style.pointerEvents = "auto";
    item.popped = false;
    item.resetAt = 0;
  }

  function popPooledBalloon(item, now){
    if(item.popped) return;

    item.popped = true;
    item.resetAt = now + 950;

    item.node.setAttribute("opacity", "0");
    item.node.style.pointerEvents = "none";

    balloonBurst(fallingObjectsLayer || svg, item.state.x, item.state.y, item.config.scale);
    spawnFallingAnswerBox(item.state.x, item.state.y, item.config.lines || ["ما أجمل", "الزهور!"]);
  }

  function updateBalloonItem(item, now, dtMs){
    if(item.popped){
      if(now >= item.resetAt){
        recycleBalloon(item, now, false);
      }
      return;
    }

    const dt = dtMs / 1000;
    const speed = item.speed;

    const speedPulse =
      0.96 +
      Math.sin(now * 0.0011 + item.state.phaseB) * 0.045 +
      Math.sin(now * 0.0021 + item.state.phaseC) * 0.024;

    item.state.x -= speed * speedPulse * dt;

    if(now >= item.state.nextDriftAt){
      item.state.driftTarget = Math.random() * 48 - 24;
      item.state.nextDriftAt = now + 900 + Math.random() * 2100;
    }

    item.state.drift += (item.state.driftTarget - item.state.drift) * 0.018;

    const wave =
      Math.sin(now * 0.00125 + item.state.phaseA) * 29 +
      Math.sin(now * 0.00235 + item.state.phaseB) * 10 +
      Math.sin(now * 0.00058 + item.state.phaseC) * 14;

    item.state.y = clamp(item.config.baseY + wave + item.state.drift, item.config.minY, item.config.maxY);

    item.node.setAttribute(
      "transform",
      `translate(${item.state.x.toFixed(2)} ${item.state.y.toFixed(2)}) scale(${item.config.scale})`
    );

    if(item.state.x < item.config.endX){
      recycleBalloon(item, now, false);
    }
  }

  function startBalloonPoolLoop(){
    if(balloonLoopStarted) return;
    balloonLoopStarted = true;

    function frame(now){
      const dtMs = balloonLoopLastTime ? Math.min(40, now - balloonLoopLastTime) : 16;
      balloonLoopLastTime = now;

      for(const item of activeBalloons){
        updateBalloonItem(item, now, dtMs);
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

      sgType:"wagon-top-edge-bumper",
      sgPartId:part.id,
      sgWellIndex:index,
      sgPushX:-1,
      isSensor:true,
      angle:profile.topBumper.angle,
      friction:profile.topBumper.friction,
      frictionStatic:profile.topBumper.frictionStatic,
      restitution:profile.topBumper.restitution
    });

    // مناطق debug فقط، حتى نعرف أن كل عربة أخذت مكوّناتها.
    collisionMap.push(makeSurface({
      left:part.x + profile.topBumper.xInset - profile.topBumper.w / 2,
      right:part.x + profile.topBumper.xInset + profile.topBumper.w / 2,
      y:part.y + profile.topBumper.yOffset,
      thickness:profile.topBumper.h
    }, {name:`${part.id}-left-top-bumper-debug`}));

    collisionMap.push(makeSurface({
      left:part.x + part.w - profile.topBumper.xInset - profile.topBumper.w / 2,
      right:part.x + part.w - profile.topBumper.xInset + profile.topBumper.w / 2,
      y:part.y + profile.topBumper.yOffset,
      thickness:profile.topBumper.h
    }, {name:`${part.id}-right-top-bumper-debug`}));
  }

  function addGapPhysicsBetweenParts(leftPart, rightPart){
    const profile = TRAIN_PHYSICS_PROFILES.gap;
    const leftEdge = leftPart.x + leftPart.w;
    const rightEdge = rightPart.x;
    const center = (leftEdge + rightEdge) / 2;
    const y = Math.min(leftPart.y, rightPart.y) + profile.yOffset;
    const halfW = profile.width / 2;

    collisionMap.push(makeSurface({
      left:center - profile.width / 2,
      right:center + profile.width / 2,
      y,
      thickness:profile.height
    }, {
      name:`gap-smart-${leftPart.id}-${rightPart.id}`
    }));

    addMatterRect(center - halfW / 2, y, halfW, profile.height, {
      label:`gap-${leftPart.id}-${rightPart.id}-left-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:-1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });

    addMatterRect(center + halfW / 2, y, halfW, profile.height, {
      label:`gap-${leftPart.id}-${rightPart.id}-right-smart-bouncer`,
      sgType:"gap-smart-bouncer",
      sgGapCenter:center,
      sgLeftWellIndex:leftPart.index,
      sgRightWellIndex:rightPart.index,
      sgDefaultPushX:1,
      isSensor:true,
      friction:profile.friction,
      frictionStatic:profile.frictionStatic,
      restitution:profile.restitution
    });
  }

  function addAllSmartGaps(parts){
    const wagons = getAdjacentWagonParts(parts);
    for(let i = 0; i < wagons.length - 1; i++){
      addGapPhysicsBetweenParts(wagons[i], wagons[i + 1]);
    }
  }

  function addEnginePhysicsPart(part){
    const profile = TRAIN_PHYSICS_PROFILES.engine;
    const roof = part.roof || profile.roof;

    collisionMap.push(makeSurface({
      left:roof.x1,
      right:roof.x2,
      y:roof.y,
      thickness:roof.h
    }, {
      name:"driver-roof-bumper"
    }));

    addMatterRect((roof.x1 + roof.x2) / 2, roof.y + 8, roof.x2 - roof.x1, roof.h, {
      label:`${part.id}-roof-bounce`,
      sgType:"driver-roof",
      sgPartId:part.id,
      friction:profile.roofBounce.friction,
      frictionStatic:profile.roofBounce.frictionStatic,
      restitution:profile.roofBounce.restitution
    });
  }

  function addAllTrainPartPhysics(){
    const parts = buildTrainPhysicsParts();

    parts.forEach(part => {
      if(part.type === "wagon") addWagonPhysicsPart(part);
      if(part.type === "engine") addEnginePhysicsPart(part);
    });

    addAllSmartGaps(parts);
  }

  function answerWagon(train, car, index){
    // قالب عربة الإجابة:
    // نفس العربة المعتمدة سابقًا، لكن صارت قابلة للتكرار حسب عدد الإجابات.
    const wagonX = TRAIN_LAYOUT.nearestWagonX - index * TRAIN_LAYOUT.wagonStep;
    const wagonY = TRAIN_LAYOUT.wagonY;
    const wagonW = TRAIN_LAYOUT.wagonW;
    const wagonH = TRAIN_LAYOUT.wagonH;

    const targetArea = {
      // منطقة الاستهداف الداخلية للعربة.
      // هذه البيانات لا تظهر بصريًا، وستستخدم لاحقًا لمعرفة سقوط الصندوق/البالون داخل العربة.
      left:wagonX + 14,
      right:wagonX + wagonW - 14,
      top:wagonY + 16,
      bottom:wagonY + wagonH - 16,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2
    };

    trainCarRegistry[index] = {
      type:car.type,
      text:car.text,
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      left:wagonX,
      right:wagonX + wagonW,
      top:wagonY,
      bottom:wagonY + wagonH,
      centerX:wagonX + wagonW / 2,
      centerY:wagonY + wagonH / 2,
      targetArea
    };

    const wheelLayer = el("g", {id:`wagonWheelLayer-${index}`}, train);
    // عجلات عربات الإجابة بنفس حجم وارتفاع العجلات الثلاث الصغيرة في القاطرة.
    // جسم العربة يُرسم بعدها، لذلك يبقى الجزء العلوي من العجلة مخفيًا خلف العربة.
    const wheelSize = 47.4;
    const wheelY = 585.3;
    const firstWheelX = wagonX + 49;
    const gap = 66;
    addWheel(wheelLayer, firstWheelX, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 2, wheelY, wheelSize);
    addWheel(wheelLayer, firstWheelX + gap * 3, wheelY, wheelSize);

    const bodyLayer = el("g", {id:`wagonBodyLayer-${index}`}, train);
    const wagonBody = el("image", {
      href:"train-wagon.webp?v=73",
      x:wagonX,
      y:wagonY,
      width:wagonW,
      height:wagonH,
      preserveAspectRatio:"xMidYMid meet",
      id:`wagonBody-${index}`
    }, bodyLayer);
    wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=73");

    el("text", {
      x:wagonX + wagonW / 2,
      y:wagonY + wagonH * .56,
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      fill:"#ffe28a",
      stroke:"#5b2618",
      "stroke-width":2.6,
      "paint-order":"stroke fill",
      "font-size":30,
      "font-weight":900,
      "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
      direction:"rtl"
    }, bodyLayer).textContent = car.text;
  }

  function wagons(train){
    // نرسم العربات من الخلف إلى الأمام حتى تكون العربة الأقرب للقاطرة فوق الوصلات بصريًا.
    for(let i = TRAIN_CARS.length - 1; i >= 0; i--){
      const car = TRAIN_CARS[i];
      if(car.type === "answer") answerWagon(train, car, i);
    }
  }

  function renderWagonForegroundCovers(){
    if(!wagonForegroundCoverLayer) return;

    trainCarRegistry.forEach((car, index) => {
      if(!car || car.type !== "answer") return;

      const wagonBody = el("image", {
        href:"train-wagon.webp?v=73",
        x:car.x,
        y:car.y,
        width:car.width,
        height:car.height,
        preserveAspectRatio:"xMidYMid meet",
        id:`wagonCoverBody-${index}`
      }, wagonForegroundCoverLayer);
      wagonBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-wagon.webp?v=73");

      el("text", {
        x:car.centerX,
        y:car.y + car.height * .56,
        "text-anchor":"middle",
        "dominant-baseline":"middle",
        fill:"#ffe28a",
        stroke:"#5b2618",
        "stroke-width":2.6,
        "paint-order":"stroke fill",
        "font-size":30,
        "font-weight":900,
        "font-family":"system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif",
        direction:"rtl"
      }, wagonForegroundCoverLayer).textContent = car.text;
    });
  }

  function getAnswerTargetArea(index){
    const car = trainCarRegistry[index];
    return car ? car.targetArea : null;
  }

  function locomotive(train){
    // إصدار 72:
    // زيادة المسافة بين العربة والقاطرة، إرجاع العجلات الثلاث للخلف،
    // تكبيرها 10%، وتقديم العجلة الكبيرة للأمام مع رفعها قليلًا.
    const locoX = 782;
    const locoY = 430;
    const locoW = 320;
    const locoH = 179;

    const bodyLayer = el("g", {id:"locomotiveBodyLayer"}, train);
    const locomotiveBody = el("image", {
      href:"train-engine-transparent.png?v=73",
      x:locoX,
      y:locoY,
      width:locoW,
      height:locoH,
      preserveAspectRatio:"xMidYMid meet",
      id:"locomotiveBody"
    }, bodyLayer);
    locomotiveBody.setAttributeNS("http://www.w3.org/1999/xlink", "href", "train-engine-transparent.png?v=73");

    const wheelLayer = el("g", {id:"locomotiveWheelLayer"}, train);

    // العجلة الكبيرة: تقديم للأمام بحوالي 3% ورفع للأعلى بحوالي 2%.
    const largeWheelSize = 90.2;
    const largeWheelCx = locoX + 64;
    const largeWheelCy = 565;
    addWheel(wheelLayer, largeWheelCx, largeWheelCy, largeWheelSize, 39);

    // العجلات الثلاث الصغيرة: إرجاع للخلف داخل القاطرة وتكبير 10% تقريبًا.
    const smallWheelSize = 47.4;
    const smallWheelCy = 585.3;
    const smallStartX = locoX + 148;
    const smallGap = 50;
    addWheel(wheelLayer, smallStartX, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap, smallWheelCy, smallWheelSize, 39);
    addWheel(wheelLayer, smallStartX + smallGap * 2, smallWheelCy, smallWheelSize, 39);
  }

  function build(){
    clear();
    defs();
    background();
    balloonsLayer();

    // المجموعة الخارجية مخصصة لاحقًا لحركة تقدم القطار بين العربات.
    const trainPositionGroup = el("g", {id:"trainPositionGroup"});

    // المجموعة الداخلية مخصصة للحركة الخفيفة المستمرة فقط.
    const train = el("g", {id:"trainScene", class:"train-idle-motion"}, trainPositionGroup);

    wagons(train);
    locomotive(train);

    // طبقة الصناديق التي استقرت داخل أحواض العربات.
    // توضع داخل trainScene حتى تتحرك مع الحركة الخفيفة للقطار.
    settledObjectsLayer = el("g", {id:"settledObjectsLayer"}, train);
    wagonForegroundCoverLayer = el("g", {id:"wagonForegroundCoverLayer"}, train);
    renderWagonForegroundCovers();

    // خريطة تصادم غير مرئية للقطار: أحواض، حواف، جسم القاطرة، السكة.
    buildCollisionMap();
    collisionDebugLayer = el("g", {id:"collisionDebugLayer"});
    drawCollisionDebug();

    // طبقة الصناديق أثناء السقوط تبقى خارج trainScene حتى لا تتحرك مع القطار أثناء السقوط.
    fallingObjectsLayer = el("g", {id:"fallingObjectsLayer"});
  }

  build();
  /* المرحلة الأولى: نظام الفيزياء الموحد جاهز. ربط سقوط البالونات به سيكون في المرحلة الثانية. */
})();
</script>
