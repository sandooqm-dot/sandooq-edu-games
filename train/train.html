<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قطار الإجابات - إصدار 10</title>
  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --sky1:#cfdef0;
      --sky2:#eef6ff;
      --sand1:#eac895;
      --sand2:#c58b55;
      --rail:#50331f;
      --hud:#696e9f;
      --gold:#f4ce61;
      --red:#bb2628;
      --red-dark:#721316;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#d9ecff;
      color:#fff;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
    }

    body::after{content:"";display:block;height:160px;pointer-events:none}

    .train-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      direction:ltr;
      user-select:none;
      touch-action:none;
      background:
        radial-gradient(circle at 19% 18%,rgba(255,255,255,.38) 0 10%,transparent 22%),
        radial-gradient(circle at 78% 16%,rgba(255,255,255,.26) 0 8%,transparent 18%),
        linear-gradient(180deg,var(--sky1) 0 54%,var(--sky2) 54.2% 55.3%,var(--sand1) 55.4%,var(--sand2) 100%);
    }

    .mountains{
      position:absolute;
      inset:0 0 33% 0;
      z-index:0;
      opacity:.34;
      pointer-events:none;
    }

    .hud{
      position:absolute;
      z-index:40;
      top:calc(12px + var(--safe-top));
      left:clamp(12px,3vw,24px);
      right:clamp(12px,3vw,24px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      pointer-events:none;
    }

    .pill{
      background:rgba(101,106,155,.88);
      border:1px solid rgba(255,255,255,.32);
      box-shadow:0 8px 18px rgba(36,42,91,.14), inset 0 1px 0 rgba(255,255,255,.18);
      border-radius:18px;
      padding:10px 18px;
      color:#fff;
      font-size:clamp(16px,2.4vw,28px);
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      backdrop-filter:blur(6px);
    }
    .score{direction:ltr;min-width:70px;text-align:center}

    .ground{
      position:absolute;
      left:0;right:0;bottom:0;
      height:23%;
      min-height:92px;
      z-index:1;
      background:repeating-linear-gradient(90deg,rgba(78,48,24,.18) 0 74px,rgba(78,48,24,.05) 74px 148px);
      opacity:.62;
      animation:groundMove 12s linear infinite;
      pointer-events:none;
    }
    @keyframes groundMove{from{background-position:0 0}to{background-position:-900px 0}}

    .rails{
      position:absolute;
      left:0;right:0;
      bottom:calc(36px + var(--safe-bottom));
      height:28px;
      z-index:5;
      pointer-events:none;
    }
    .rail-line{position:absolute;left:0;right:0;height:7px;border-radius:9px;background:var(--rail);box-shadow:0 2px 0 rgba(255,255,255,.18) inset,0 2px 5px rgba(0,0,0,.14)}
    .rail-line.top{top:2px}.rail-line.bottom{bottom:2px}
    .sleepers{position:absolute;left:0;right:0;top:8px;height:14px;background:repeating-linear-gradient(90deg,transparent 0 34px,#9a6d42 34px 66px,transparent 66px 100px);animation:sleeperMove 5s linear infinite}
    @keyframes sleeperMove{from{background-position:0 0}to{background-position:-700px 0}}

    .train-stage{
      position:absolute;
      z-index:12;
      left:50%;
      transform:translateX(-50%);
      bottom:calc(42px + var(--safe-bottom));
      width:min(98vw, 1920px);
      height:clamp(158px, 31dvh, 292px);
      pointer-events:auto;
    }
    .train-svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 9px rgba(0,0,0,.16));pointer-events:auto;touch-action:none}
    .balloon-hit{cursor:pointer;pointer-events:auto}
    .game-note{font-weight:900;font-size:24px;fill:#fff;paint-order:stroke;stroke:#5c3850;stroke-width:5px;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext}
    .pop-text{font-weight:1000;font-size:34px;fill:#d72a2a;paint-order:stroke;stroke:#fff4a3;stroke-width:7px;text-anchor:middle;dominant-baseline:middle;letter-spacing:1px}
    .box-text{font-weight:900;font-size:17px;fill:#fff2b4;paint-order:stroke;stroke:#4b2b17;stroke-width:3px;text-anchor:middle;dominant-baseline:middle;direction:rtl;unicode-bidi:plaintext}

    .wheel-spin{animation:wheelSpin 1s linear infinite;transform-box:fill-box;transform-origin:center;will-change:transform}
    .wheel-spin.small{animation-duration:.78s}.wheel-spin.medium{animation-duration:.88s}.wheel-spin.large{animation-duration:1.06s}
    @keyframes wheelSpin{to{transform:rotate(360deg)}}

    .label-text{
      font-weight:900;
      font-size:42px;
      fill:#f8db72;
      paint-order:stroke;
      stroke:#7a2a18;
      stroke-width:5px;
      stroke-linejoin:round;
      direction:rtl;
      unicode-bidi:plaintext;
      dominant-baseline:middle;
      text-anchor:middle;
      font-family:"Noto Naskh Arabic","Traditional Arabic",Tahoma,Arial,sans-serif;
    }

    @media (orientation:landscape){
      .train-stage{height:clamp(178px, 35dvh, 318px);bottom:calc(34px + var(--safe-bottom));width:98vw}
      .rails{bottom:calc(26px + var(--safe-bottom))}
      .pill{font-size:clamp(14px,3.2vh,24px);padding:8px 15px;border-radius:15px}
    }
    @media (max-width:430px){
      .hud{top:calc(10px + var(--safe-top));left:12px;right:12px}
      .pill{font-size:16px;padding:8px 13px;border-radius:15px}
      .score{min-width:62px}
      .train-stage{width:99vw;height:clamp(145px, 23dvh, 226px);bottom:calc(44px + var(--safe-bottom))}
      .rails{bottom:calc(34px + var(--safe-bottom))}
    }
  </style>
</head>
<body>
  <main class="train-page" id="page">
    <svg class="mountains" viewBox="0 0 1200 520" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 420 C70 315 128 370 197 250 C255 145 302 230 352 115 C405 255 465 170 520 310 C590 172 662 220 714 110 C782 245 848 160 920 320 C995 230 1055 300 1200 210 L1200 520 L0 520 Z" fill="#8e90ad"/>
      <path d="M0 460 C88 375 140 400 220 300 C300 205 345 330 430 230 C505 330 590 250 675 340 C740 250 820 295 890 210 C980 360 1050 285 1200 338 L1200 520 L0 520 Z" fill="#b0a0ad" opacity=".72"/>
    </svg>

    <div class="hud">
      <div class="pill score" id="score">0 ✓</div>
      <div class="pill title">قطار الإجابات</div>
    </div>

    <div class="ground" aria-hidden="true"></div>
    <div class="rails" aria-hidden="true"><div class="rail-line top"></div><div class="sleepers"></div><div class="rail-line bottom"></div></div>

    <div class="train-stage" aria-hidden="true">
      <svg class="train-svg" id="trainSvg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax meet" role="img" aria-label="قطار الإجابات"></svg>
    </div>
  </main>

  <script>
    const categories = ['استفهام','تعجب','أمر'];
    const svg = document.getElementById('trainSvg');
    const NS = 'http://www.w3.org/2000/svg';

    function el(name, attrs = {}, parent = svg){
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
      parent.appendChild(node);
      return node;
    }

    function defs(){
      const d = el('defs');
      const lin = (id, stops, attrs={}) => {
        const g = el('linearGradient', Object.assign({id, x1:'0', y1:'0', x2:'0', y2:'1'}, attrs), d);
        stops.forEach(s => el('stop', s, g));
      };
      const rad = (id, stops) => {
        const g = el('radialGradient', {id, cx:'35%', cy:'24%', r:'75%'}, d);
        stops.forEach(s => el('stop', s, g));
      };
      lin('redBody', [{'offset':'0%','stop-color':'#ee5a4c'},{'offset':'45%','stop-color':'#bd2424'},{'offset':'100%','stop-color':'#671014'}]);
      lin('redPanel', [{'offset':'0%','stop-color':'#d63a34'},{'offset':'52%','stop-color':'#b51e22'},{'offset':'100%','stop-color':'#8b1418'}]);
      lin('gold', [{'offset':'0%','stop-color':'#fff2a7'},{'offset':'42%','stop-color':'#d8a33b'},{'offset':'100%','stop-color':'#7d4d17'}]);
      lin('goldH', [{'offset':'0%','stop-color':'#fff3b3'},{'offset':'22%','stop-color':'#f2ca61'},{'offset':'62%','stop-color':'#a97225'},{'offset':'100%','stop-color':'#fff1a4'}], {x1:'0',y1:'0',x2:'1',y2:'0'});
      lin('darkMetal', [{'offset':'0%','stop-color':'#332b25'},{'offset':'100%','stop-color':'#0e0c0a'}]);
      lin('glass', [{'offset':'0%','stop-color':'#bdf2ff'},{'offset':'100%','stop-color':'#3a7b8b'}]);
      rad('wheelGold', [{'offset':'0%','stop-color':'#fff5bb'},{'offset':'42%','stop-color':'#d1a052'},{'offset':'70%','stop-color':'#8a5a22'},{'offset':'100%','stop-color':'#e7bd62'}]);
      const glow = el('filter', {id:'innerGlow', x:'-20%', y:'-20%', width:'140%', height:'140%'}, d);
      el('feDropShadow', {'dx':'0','dy':'2','stdDeviation':'1.5','flood-color':'#000','flood-opacity':'.24'}, glow);
    }

    function roundRect(x,y,w,h,r,fill,stroke='url(#gold)',sw=4,parent=svg){
      return el('rect',{x,y,width:w,height:h,rx:r,ry:r,fill,stroke,'stroke-width':sw},parent);
    }

    function ornateWheel(cx, cy, r, cls='medium'){
      const outer = el('g', {transform:`translate(${cx} ${cy})`});
      const g = el('g', {class:'wheel-spin '+cls}, outer);
      el('circle',{cx:0,cy:0,r:r,fill:'url(#wheelGold)',stroke:'#5b3715','stroke-width':Math.max(2,r*.06)},g);
      el('circle',{cx:0,cy:0,r:r*.83,fill:'none',stroke:'#f7d986','stroke-width':Math.max(2,r*.055)},g);
      el('circle',{cx:0,cy:0,r:r*.70,fill:'none',stroke:'#6d441a','stroke-width':Math.max(1.4,r*.034),'opacity':.78},g);
      for(let i=0;i<20;i++){
        const a = (Math.PI*2*i)/20;
        const x1 = Math.cos(a)*r*.23, y1 = Math.sin(a)*r*.23;
        const x2 = Math.cos(a)*r*.79, y2 = Math.sin(a)*r*.79;
        el('line',{x1,y1,x2,y2,stroke:'#e5b65e','stroke-width':Math.max(2.4,r*.085),'stroke-linecap':'round'},g);
        el('line',{x1:x1*1.02,y1:y1*1.02,x2:x2*1.02,y2:y2*1.02,stroke:'#7a4a19','stroke-width':Math.max(1,r*.025),'stroke-linecap':'round','opacity':.45},g);
      }
      el('circle',{cx:0,cy:0,r:r*.26,fill:'url(#gold)',stroke:'#533018','stroke-width':Math.max(2,r*.055)},g);
      el('circle',{cx:0,cy:0,r:r*.17,fill:'#b93131',stroke:'#5c2e20','stroke-width':Math.max(1.5,r*.035)},g);
      el('circle',{cx:0,cy:0,r:r*.08,fill:'#111',stroke:'#f6db78','stroke-width':Math.max(1.2,r*.03)},g);
      el('path',{d:`M ${-r*.58} ${-r*.58} C ${-r*.24} ${-r*.82} ${r*.35} ${-r*.76} ${r*.68} ${-r*.35}`,fill:'none',stroke:'#fff5ba','stroke-width':Math.max(1.2,r*.04),'opacity':.42,'stroke-linecap':'round'},g);
      return outer;
    }

    function coupler(x,y=214){
      el('rect',{x:x-5,y:y,width:22,height:9,rx:4,fill:'#2b1d19',stroke:'url(#gold)','stroke-width':1.4});
      el('circle',{cx:x-8,cy:y+4.5,r:6,fill:'#2b1d19'});
      el('circle',{cx:x+19,cy:y+4.5,r:6,fill:'#2b1d19'});
    }

    function answerCar(x, label){
      const g = el('g', {class:'answer-car', 'data-label':label});
      // lower axle/wheels like the old game: wheels partially tucked under the wagon.
      ornateWheel(x+54, 246, 17, 'small');
      ornateWheel(x+91, 246, 17, 'small');
      ornateWheel(x+188, 246, 17, 'small');
      ornateWheel(x+226, 246, 17, 'small');
      el('rect',{x:x+16,y:224,width:252,height:16,rx:5,fill:'url(#goldH)',stroke:'#694116','stroke-width':2},g);
      el('path',{d:`M ${x+19} 112 L ${x+262} 112 L ${x+250} 210 L ${x+35} 210 Z`,fill:'url(#redBody)',stroke:'url(#gold)','stroke-width':5,'stroke-linejoin':'round'},g);
      el('path',{d:`M ${x+40} 134 L ${x+241} 134 L ${x+231} 194 L ${x+50} 194 Z`,fill:'url(#redPanel)',stroke:'#812025','stroke-width':3,'opacity':.92},g);
      el('line',{x1:x+17,y1:106,x2:x+264,y2:106,stroke:'url(#goldH)','stroke-width':11,'stroke-linecap':'round'},g);
      el('line',{x1:x+25,y1:215,x2:x+259,y2:215,stroke:'url(#goldH)','stroke-width':7,'stroke-linecap':'round'},g);
      // small golden corner ornaments.
      [['45','138'],['226','138'],['52','190'],['230','190']].forEach(([ox,oy],i)=>{
        const sx=x+Number(ox), sy=Number(oy), flip=i%2?-1:1;
        el('path',{d:`M ${sx} ${sy} q ${12*flip} 0 ${12*flip} ${-10} q ${0} ${10} ${10*flip} ${10}`,fill:'none',stroke:'url(#gold)','stroke-width':2.3,'stroke-linecap':'round'},g);
      });
      el('text',{x:x+140,y:162,class:'label-text'},g).textContent = label;
      return g;
    }

    function passenger(x){
      const g = el('g', {class:'passenger'});
      ornateWheel(x+47,246,16,'small'); ornateWheel(x+86,246,16,'small'); ornateWheel(x+190,246,16,'small'); ornateWheel(x+229,246,16,'small');
      el('rect',{x:x+16,y:222,width:260,height:17,rx:5,fill:'url(#goldH)',stroke:'#6d4214','stroke-width':2},g);
      roundRect(x+28,108,236,98,8,'url(#redBody)','url(#gold)',5,g);
      el('line',{x1:x+29,y1:101,x2:x+263,y2:101,stroke:'url(#goldH)','stroke-width':15,'stroke-linecap':'round'},g);
      for(let i=0;i<5;i++){
        const wx=x+49+i*40;
        roundRect(wx,125,29,43,8,'url(#glass)','#7f511c',3,g);
        el('path',{d:`M ${wx+5} 166 C ${wx+10} 151 ${wx+23} 151 ${wx+28} 166`,fill:'#244d57',opacity:.38},g);
      }
      el('path',{d:`M ${x+94} 187 C ${x+124} 202 ${x+168} 202 ${x+198} 187`,fill:'none',stroke:'url(#gold)','stroke-width':5,'stroke-linecap':'round'},g);
      el('circle',{cx:x+146,cy:189,r:7,fill:'url(#gold)',stroke:'#754618','stroke-width':2},g);
      return g;
    }

    function coalCar(x){
      const g = el('g', {class:'coal'});
      ornateWheel(x+44,246,16,'small'); ornateWheel(x+93,246,16,'small');
      el('rect',{x:x+14,y:222,width:130,height:17,rx:5,fill:'url(#goldH)',stroke:'#6d4214','stroke-width':2},g);
      roundRect(x+23,143,110,66,6,'url(#redBody)','url(#gold)',5,g);
      for(let i=0;i<20;i++){
        const cx=x+31+(i%10)*10.5;
        const cy=137-Math.floor(i/10)*7-(i%2)*3;
        el('circle',{cx,cy,r:9,fill:'#191614',opacity:.95},g);
      }
      el('path',{d:`M ${x+49} 178 C ${x+70} 158 ${x+92} 158 ${x+110} 178 C ${x+93} 197 ${x+67} 197 ${x+49} 178 Z`,fill:'none',stroke:'url(#gold)','stroke-width':4},g);
      el('circle',{cx:x+80,cy:178,r:8,fill:'url(#gold)',stroke:'#784917','stroke-width':2},g);
      return g;
    }

    function locomotive(x){
      const g = el('g', {class:'loco'});
      // Draw wheels before chassis so the upper parts tuck under the frame.
      ornateWheel(x+78,230,45,'large');
      ornateWheel(x+181,238,29,'medium');
      ornateWheel(x+260,238,29,'medium');
      el('path',{d:`M ${x+18} 218 L ${x+316} 218 L ${x+318} 236 L ${x+18} 236 Z`,fill:'url(#goldH)',stroke:'#6d4214','stroke-width':3},g);
      roundRect(x+24,84,98,128,5,'url(#redBody)','url(#gold)',6,g);
      el('rect',{x:x+38,y:34,width:70,height:55,rx:4,fill:'#b21f24',stroke:'url(#gold)','stroke-width':5},g);
      el('text',{x:x+73,y:64,fill:'#f9df76','font-size':44,'font-weight':900,'text-anchor':'middle','dominant-baseline':'middle'},g).textContent='1';
      el('path',{d:`M ${x+22} 32 L ${x+121} 32 L ${x+134} 47 L ${x+11} 47 Z`,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':3},g);
      el('path',{d:`M ${x+114} 116 L ${x+295} 116 Q ${x+310} 116 ${x+310} 132 L ${x+310} 181 Q ${x+310} 196 ${x+295} 196 L ${x+114} 196 Z`,fill:'url(#redBody)',stroke:'url(#gold)','stroke-width':5},g);
      el('line',{x1:x+127,y1:151,x2:x+290,y2:151,stroke:'url(#goldH)','stroke-width':5,'stroke-linecap':'round'},g);
      el('line',{x1:x+127,y1:181,x2:x+290,y2:181,stroke:'url(#goldH)','stroke-width':4,'stroke-linecap':'round'},g);
      el('path',{d:`M ${x+297} 104 C ${x+324} 110 ${x+324} 203 ${x+297} 210 C ${x+278} 190 ${x+278} 124 ${x+297} 104 Z`,fill:'url(#darkMetal)',stroke:'#2a1b14','stroke-width':3},g);
      for(let i=0;i<8;i++) el('circle',{cx:x+305,cy:120+i*12,r:3,fill:'#49372d'},g);
      // domes and chimneys, close to old train silhouette.
      el('path',{d:`M ${x+166} 102 C ${x+170} 80 ${x+219} 80 ${x+222} 102 Z`,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':4},g);
      el('rect',{x:x+174,y:96,width:39,height:15,rx:5,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':3},g);
      el('rect',{x:x+124,y:76,width:33,height:42,rx:5,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':3},g);
      el('path',{d:`M ${x+120} 70 C ${x+125} 58 ${x+157} 58 ${x+162} 70 Z`,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':3},g);
      el('rect',{x:x+248,y:47,width:34,height:70,rx:5,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':4},g);
      el('ellipse',{cx:x+265,cy:46,rx:24,ry:9,fill:'url(#darkMetal)',stroke:'url(#gold)','stroke-width':4},g);
      // horizontal gold handrails.
      el('line',{x1:x+18,y1:113,x2:x+298,y2:113,stroke:'url(#goldH)','stroke-width':5,'stroke-linecap':'round'},g);
      el('line',{x1:x+24,y1:212,x2:x+306,y2:212,stroke:'url(#goldH)','stroke-width':6,'stroke-linecap':'round'},g);
      // cowcatcher.
      el('path',{d:`M ${x+307} 194 L ${x+367} 233 L ${x+315} 233 Z`,fill:'url(#gold)',stroke:'#6d4214','stroke-width':3,'stroke-linejoin':'round'},g);
      for(let i=0;i<6;i++) el('line',{x1:x+316+i*8,y1:203,x2:x+326+i*7,y2:230,stroke:'#7b4d19','stroke-width':3,'stroke-linecap':'round'},g);
      return g;
    }

    function buildTrain(){
      svg.innerHTML='';
      defs();
      let x=16;
      categories.forEach(c=>{answerCar(x,c); coupler(x+270); x+=282;});
      passenger(x); coupler(x+276); x+=288;
      coalCar(x); coupler(x+150); x+=158;
      locomotive(x);
      svg.setAttribute('viewBox', `0 0 ${x+392} 300`);
    }


    function drawBlimp(parent, x, y, text){
      const g = el('g', {class:'balloon-hit', transform:`translate(${x} ${y})`}, parent);
      el('ellipse',{cx:0,cy:0,rx:76,ry:35,fill:'#b7bdcc',stroke:'#5f6576','stroke-width':3},g);
      el('ellipse',{cx:-20,cy:-10,rx:42,ry:16,fill:'#eef4ff',opacity:.34},g);
      el('path',{d:'M -77 0 C -96 -10 -96 10 -77 0 M 76 0 L 100 -18 L 94 0 L 100 18 Z',fill:'#8d94a8',stroke:'#5f6576','stroke-width':2},g);
      el('rect',{x:-25,y:30,width:50,height:15,rx:4,fill:'#77717a',stroke:'#504a55','stroke-width':2},g);
      el('line',{x1:-42,y1:20,x2:-17,y2:34,stroke:'#77717a','stroke-width':3},g);
      el('line',{x1:42,y1:20,x2:17,y2:34,stroke:'#77717a','stroke-width':3},g);
      const t = el('text',{x:0,y:1,class:'game-note',style:'font-size:30px;stroke-width:4px'},g);
      t.textContent = text;
      return g;
    }

    function drawWoodenBox(parent, x, y, text){
      const g = el('g', {transform:`translate(${x} ${y})`}, parent);
      el('rect',{x:-36,y:-26,width:72,height:52,rx:5,fill:'#8b4d25',stroke:'#4b2b17','stroke-width':4},g);
      el('rect',{x:-30,y:-20,width:60,height:40,rx:2,fill:'#9f6131',stroke:'#6b3d1f','stroke-width':2},g);
      el('line',{x1:-30,y1:-4,x2:30,y2:-4,stroke:'#6b3d1f','stroke-width':3},g);
      el('line',{x1:-10,y1:-20,x2:-10,y2:20,stroke:'#6b3d1f','stroke-width':3},g);
      el('line',{x1:12,y1:-20,x2:12,y2:20,stroke:'#6b3d1f','stroke-width':3},g);
      el('path',{d:'M -31 -20 L 31 20 M 31 -20 L -31 20',stroke:'#d69b58','stroke-width':4,'opacity':.62},g);
      const tx=el('text',{x:0,y:2,class:'box-text'},g);
      tx.textContent=text;
      return g;
    }

    function popEffect(parent, x, y){
      const g = el('g', {transform:`translate(${x} ${y})`}, parent);
      el('text',{x:0,y:-4,class:'pop-text'},g).textContent='POP';
      for(let i=0;i<10;i++){
        const a=(Math.PI*2*i)/10;
        el('line',{x1:Math.cos(a)*30,y1:Math.sin(a)*20,x2:Math.cos(a)*52,y2:Math.sin(a)*36,stroke:i%2?'#fff3a0':'#d72a2a','stroke-width':4,'stroke-linecap':'round'},g);
      }
      let life=0;
      function step(dt){
        life += dt;
        g.setAttribute('opacity', Math.max(0, 1-life/0.62));
        g.setAttribute('transform', `translate(${x} ${y-life*20}) scale(${1+life*.35})`);
        if(life>.62) g.remove();
        else requestAnimationFrame(tick);
      }
      let last=performance.now();
      function tick(now){step(Math.min(.04,(now-last)/1000));last=now;}
      requestAnimationFrame(tick);
    }

    function initDropDemo(){
      const scoreEl = document.getElementById('score');
      const layer = el('g', {id:'playLayer'});
      const target = {label:'تعجب', x1:16+282+34, x2:16+282+250, top:112, catchY:147};
      const item = {text:'ماذا!', answer:'تعجب'};
      let score = 0;
      let balloon = null;
      let bx = 1080, by = 76, bv = -78;
      let popped = false;
      let crate = null;
      let cx=0, cy=0, vx=0, vy=0, rot=0, vr=0;
      let landed = false;

      function resetBalloon(){
        if(balloon) balloon.remove();
        balloon = drawBlimp(layer, bx, by, item.text);
        balloon.addEventListener('pointerdown', onPop, {passive:false});
        popped=false;
        crate=null;
        landed=false;
      }

      function onPop(e){
        e.preventDefault();
        if(popped) return;
        popped = true;
        const x = bx, y = by + 36;
        popEffect(layer, x, by);
        balloon.remove();
        balloon=null;
        crate = drawWoodenBox(layer, x, y, item.text);
        cx=x; cy=y; vx=bv*.28; vy=-10; rot=0; vr=(Math.random()>.5?1:-1)*110;
      }

      function showMessage(txt, good){
        const m = el('g', {transform:'translate(600 58)'});
        el('rect',{x:-135,y:-28,width:270,height:56,rx:18,fill:good?'rgba(42,140,70,.88)':'rgba(169,55,47,.88)',stroke:'#fff','stroke-width':2},m);
        const t=el('text',{x:0,y:2,class:'game-note',style:'font-size:24px;stroke-width:3px'},m); t.textContent=txt;
        setTimeout(()=>m.remove(),1200);
      }

      function updateCrate(dt){
        if(!crate || landed) return;
        vy += 270 * dt;
        cx += vx * dt;
        cy += vy * dt;
        rot += vr * dt;

        // If the box reaches the open wagon level, evaluate where it landed.
        if(cy + 24 >= target.top){
          if(cx >= target.x1 && cx <= target.x2){
            landed = true;
            cy = target.catchY;
            vx=0; vy=0; rot = Math.max(-12, Math.min(12, rot));
            crate.setAttribute('transform',`translate(${cx} ${cy}) rotate(${rot})`);
            score += 1;
            scoreEl.textContent = score + ' ✓';
            showMessage('إجابة صحيحة', true);
            setTimeout(()=>{ if(crate){crate.remove(); crate=null;} bx=1120; resetBalloon(); }, 1300);
            return;
          }
          // hit a wrong place: bounce once like a wooden box.
          if(cy < 220){
            vy = -Math.abs(vy)*.38;
            vx *= .76;
            vr *= -0.68;
          }
        }
        if(cy > 285 || cx < -70){
          showMessage('حاول مرة ثانية', false);
          if(crate){crate.remove();crate=null;}
          bx=1120;
          setTimeout(resetBalloon,450);
          return;
        }
        crate.setAttribute('transform',`translate(${cx} ${cy}) rotate(${rot})`);
      }

      let last = performance.now();
      function loop(now){
        const dt = Math.min(.034,(now-last)/1000); last=now;
        if(!popped){
          bx += bv*dt;
          if(bx < -120) bx = 1120;
          if(balloon) balloon.setAttribute('transform',`translate(${bx} ${by + Math.sin(now/450)*4})`);
        }
        updateCrate(dt);
        requestAnimationFrame(loop);
      }
      resetBalloon();
      requestAnimationFrame(loop);
    }


    buildTrain();
    initDropDemo();
  </script>
</body>
</html>
