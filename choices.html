<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: choices-v12-direct-mode-open-box-intro -->
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  />
  <title>الاختيارات - صندوق الألعاب التعليمية</title>

  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --edge-guard:clamp(16px,2vw,30px);

      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --green:#25ad69;
      --red:#f04747;
      --logo-w:clamp(86px,9.2vw,148px);
      --card-radius:clamp(14px,1.6vw,24px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma,Arial,"Segoe UI",sans-serif;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    /*
      منقول من صفحة افتح الصندوق:
      body وحده مسؤول عن التمرير، ولا توجد أي قاعدة overflow على html.
    */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:none;
      isolation:isolate;
    }

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1);
      transform-origin:center center;
      will-change:transform,opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .game-page.theme-white{
      background:#fff;
    }

    .game-page.theme-white .theme-background{
      opacity:0;
      background-image:none;
    }

    .game-page.theme-classroom .theme-background{
      opacity:1;
      background-color:#fff;
      background-image:
        url("theme-classroom-bg-v2.webp?v=2"),
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        url("theme-original.webp?v=45"),
        url("theme-original.png?v=45");
    }

    .game-page.theme-sky-clouds .theme-background{
      opacity:1;
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        linear-gradient(180deg,#67d0f3 0%,#b6ecff 100%);
    }

    .game-page.theme-forest .theme-background{
      opacity:1;
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .game-page.theme-math .theme-background{
      opacity:1;
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .game-page.theme-english .theme-background{
      opacity:1;
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#65bdc4 100%);
    }

    .game-page.theme-flowers .theme-background{
      opacity:1;
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .game-page.theme-national-day .theme-background{
      opacity:1;
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .game-page.theme-founding-day .theme-background{
      opacity:1;
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    /* منقول حرفيًا من صفحة افتح الصندوق. */
    .game-logo{
      position:absolute;
      top:clamp(10px,1.7vw,22px);
      left:clamp(12px,2vw,30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px,9vw,120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* منقول حرفيًا من صفحة افتح الصندوق. */
    .stage{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(72px + var(--safe-top))
        calc(var(--edge-guard) + var(--safe-right))
        calc(82px + var(--safe-bottom))
        calc(var(--edge-guard) + var(--safe-left));
      direction:ltr;
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      overflow:hidden;
    }

    .cards-view,
    .question-view,
    .finish-view{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .cards-view{
      z-index:5;
      opacity:1;
      visibility:visible;
      transition:opacity .22s ease;
    }

    .cards-view.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .question-grid{
      --cols:4;
      --gap:clamp(12px,1.45vw,22px);
      width:min(92%,1360px);
      height:min(86%,690px);
      display:grid;
      grid-template-columns:repeat(var(--cols),minmax(0,1fr));
      grid-auto-rows:minmax(0,1fr);
      align-content:center;
      justify-content:center;
      gap:var(--gap);
      direction:ltr;
    }

    .deck-card{
      --card-color:#e82f70;
      --card-dark:#b81550;
      --card-light:#ff679a;
      position:relative;
      min-width:0;
      min-height:0;
      border:0;
      border-radius:var(--card-radius);
      padding:0;
      background:
        linear-gradient(150deg,var(--card-light) 0%,var(--card-color) 56%,var(--card-dark) 100%);
      color:#fff;
      cursor:pointer;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.26),
        inset 0 0 0 2px rgba(0,0,0,.14),
        0 7px 0 rgba(0,0,0,.16),
        0 13px 22px rgba(0,0,0,.15);
      overflow:hidden;
      transform:translate3d(0,0,0);
      opacity:1;
      transition:
        transform .78s cubic-bezier(.18,.78,.18,1),
        opacity .42s ease,
        filter .25s ease;
      will-change:transform,opacity;
    }

    .deck-card::before{
      content:"";
      position:absolute;
      inset:6%;
      border-radius:calc(var(--card-radius) * .78);
      border:2px solid rgba(255,255,255,.30);
      box-shadow:inset 0 0 18px rgba(255,255,255,.08);
      pointer-events:none;
    }

    .deck-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 24% 18%,rgba(255,255,255,.24),transparent 28%),
        linear-gradient(90deg,transparent 0 48%,rgba(255,255,255,.06) 49% 51%,transparent 52%);
      pointer-events:none;
    }

    .deck-card-number{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10%;
      color:var(--deck-text,#fff);
      font-weight:1000;
      font-size:clamp(28px,5.2vw,84px);
      line-height:1;
      text-shadow:0 3px 7px rgba(0,0,0,.28);
    }

    .deck-card.is-completed{
      filter:saturate(.55) brightness(.82);
    }

    .deck-card.is-completed .deck-card-number::after{
      content:"✓";
      position:absolute;
      top:8%;
      right:8%;
      color:#fff;
      font-size:48%;
      font-weight:1000;
      text-shadow:
        0 2px 0 rgba(0,0,0,.9),
        0 5px 10px rgba(0,0,0,.28);
    }

    .deck-card.is-away{
      opacity:0;
      pointer-events:none;
      transform:
        translate3d(var(--away-x,0),var(--away-y,0),0)
        scale(.72)
        rotate(var(--away-r,0deg));
    }

    .focus-card{
      --card-color:#e82f70;
      --card-dark:#b81550;
      --card-light:#ff679a;
      position:fixed;
      z-index:70;
      margin:0;
      border:0;
      padding:0;
      border-radius:var(--card-radius);
      background:
        linear-gradient(150deg,var(--card-light) 0%,var(--card-color) 56%,var(--card-dark) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.26),
        inset 0 0 0 2px rgba(0,0,0,.14),
        0 13px 0 rgba(0,0,0,.16),
        0 22px 42px rgba(0,0,0,.25);
      transform-origin:center;
      pointer-events:none;
      overflow:visible;
      will-change:transform,opacity;
    }

    .focus-card::before{
      content:"";
      position:absolute;
      inset:6%;
      border-radius:calc(var(--card-radius) * .78);
      border:3px solid rgba(255,255,255,.34);
      z-index:2;
    }

    .focus-card-number{
      position:absolute;
      inset:0;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--deck-text,#fff);
      font-weight:1000;
      font-size:clamp(48px,8vw,126px);
      line-height:1;
      text-shadow:0 4px 10px rgba(0,0,0,.28);
    }

    .focus-card-top{
      position:absolute;
      z-index:5;
      top:0;
      left:0;
      width:100%;
      height:50%;
      border-radius:var(--card-radius) var(--card-radius) 18px 18px;
      background:
        linear-gradient(155deg,var(--card-light) 0%,var(--card-color) 58%,var(--card-dark) 100%);
      box-shadow:inset 0 2px 0 rgba(255,255,255,.24);
      transform-origin:50% 0%;
      opacity:0;
    }

    .focus-card.is-opening{
      animation:cardCoreBurst .78s cubic-bezier(.18,.76,.18,1) both;
    }

    .focus-card.is-opening .focus-card-top{
      opacity:1;
      animation:cardTopOpen .78s cubic-bezier(.18,.76,.18,1) both;
    }

    .focus-card.is-opening .focus-card-number{
      animation:cardNumberVanish .48s ease both;
    }

    @keyframes cardCoreBurst{
      0%{ opacity:1; transform:translate3d(0,0,0) scale(1); filter:brightness(1); }
      36%{ opacity:1; transform:translate3d(0,0,0) scale(1.08); filter:brightness(1.28); }
      68%{ opacity:.88; transform:translate3d(0,0,0) scale(1.18); filter:brightness(1.42); }
      100%{ opacity:0; transform:translate3d(0,0,0) scale(1.46); filter:brightness(1.7); }
    }

    @keyframes cardTopOpen{
      0%{ opacity:0; transform:perspective(900px) rotateX(0deg) translateY(0) scale(1); }
      20%{ opacity:1; }
      65%{ opacity:1; transform:perspective(900px) rotateX(58deg) translateY(-40%) scale(1.04); }
      100%{ opacity:0; transform:perspective(900px) rotateX(86deg) translateY(-125%) scale(1.10); }
    }

    @keyframes cardNumberVanish{
      0%{ opacity:1; transform:scale(1); }
      100%{ opacity:0; transform:scale(1.25); }
    }

    .burst-layer{
      position:fixed;
      z-index:69;
      inset:0;
      pointer-events:none;
      opacity:0;
    }

    .burst-layer.is-active{
      opacity:1;
    }

    .burst-dot{
      --x:0px;
      --y:0px;
      --r:0deg;
      position:absolute;
      left:var(--origin-x);
      top:var(--origin-y);
      width:clamp(8px,1.2vw,18px);
      aspect-ratio:1;
      border-radius:4px;
      background:var(--dot-color,#fff);
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      animation:burstDot .72s cubic-bezier(.12,.68,.18,1) both;
    }

    @keyframes burstDot{
      0%{
        opacity:1;
        transform:translate(-50%,-50%) rotate(0deg) scale(.4);
      }
      100%{
        opacity:0;
        transform:
          translate(calc(-50% + var(--x)),calc(-50% + var(--y)))
          rotate(var(--r))
          scale(1.1);
      }
    }

    .question-view{
      z-index:10;
      flex-direction:column;
      justify-content:center;
      gap:clamp(12px,1.7vh,20px);
      padding:0;
      direction:rtl;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .question-view.is-visible{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .question-card{
      --panel-color:#2f75d4;
      --panel-dark:#174b9b;
      --panel-light:#65a4f1;
      --panel-text:#fff;
      position:relative;
      flex:0 0 clamp(104px,15vh,142px);
      width:min(82%,960px);
      min-height:0;
      border:clamp(3px,.28vw,4px) solid #111;
      border-radius:clamp(10px,1vw,15px);
      background:
        linear-gradient(150deg,var(--panel-light) 0%,var(--panel-color) 58%,var(--panel-dark) 100%);
      color:var(--panel-text);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.23),
        0 5px 0 rgba(0,0,0,.16),
        0 10px 18px rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(11px,1.4vw,19px);
      overflow:hidden;
      opacity:0;
      transform:translateY(-90px) scale(.95);
    }

    .question-card.is-long{
      flex-basis:clamp(132px,19vh,176px);
    }

    .question-card.is-very-long{
      flex-basis:clamp(158px,23vh,212px);
    }

    .question-view.is-visible .question-card{
      animation:questionArrive .68s cubic-bezier(.16,.82,.18,1) .08s both;
    }

    @keyframes questionArrive{
      0%{ opacity:0; transform:translateY(-90px) scale(.95); }
      100%{ opacity:1; transform:translateY(0) scale(1); }
    }

    .question-text,
    .choice-text{
      width:100%;
      height:auto;
      max-height:none;
      overflow:visible;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:normal;
      text-wrap:balance;
      box-sizing:border-box;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      font-weight:1000;
      color:var(--panel-text,#fff);
      text-shadow:0 2px 4px rgba(0,0,0,.24);
    }

    .question-text{
      line-height:1.16;
      padding:.06em .10em .14em;
      font-size:clamp(20px,3.2vw,52px);
    }

    .question-image{
      display:block;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      object-position:center;
      border-radius:10px;
    }

    .choices-grid{
      --choice-cols:2;
      width:min(82%,980px);
      flex:0 0 auto;
      min-height:0;
      display:grid;
      grid-template-columns:repeat(var(--choice-cols),minmax(0,1fr));
      grid-auto-rows:clamp(84px,13.5vh,122px);
      align-content:center;
      gap:clamp(10px,1.1vw,16px);
      direction:ltr;
    }

    .choice-card{
      --panel-color:#f2772f;
      --panel-dark:#ba4714;
      --panel-light:#ffa05f;
      --panel-text:#fff;
      position:relative;
      min-width:0;
      min-height:0;
      border:clamp(3px,.28vw,4px) solid #111;
      border-radius:clamp(9px,.9vw,14px);
      background:
        linear-gradient(150deg,var(--panel-light) 0%,var(--panel-color) 58%,var(--panel-dark) 100%);
      color:var(--panel-text);
      padding:clamp(9px,1.05vw,15px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.22),
        0 5px 0 rgba(0,0,0,.15),
        0 9px 16px rgba(0,0,0,.11);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      cursor:pointer;
      opacity:0;
      transform:translateY(90px) scale(.93);
    }

    .question-view.is-visible .choice-card{
      animation:choiceArrive .62s cubic-bezier(.16,.82,.18,1) both;
      animation-delay:calc(.14s + var(--choice-order,0) * .075s);
    }

    @keyframes choiceArrive{
      0%{ opacity:0; transform:translateY(90px) scale(.93); }
      100%{ opacity:1; transform:translateY(0) scale(1); }
    }

    .choice-card:active{
      transform:translateY(2px);
    }

    .choice-card.is-disabled{
      cursor:default;
    }

    .choice-card.is-wrong{
      animation:wrongShake .44s ease both !important;
    }

    @keyframes wrongShake{
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-10px); }
      40%{ transform:translateX(10px); }
      60%{ transform:translateX(-7px); }
      80%{ transform:translateX(7px); }
    }

    .choice-text{
      line-height:1.12;
      padding:.05em .08em .12em;
      font-size:clamp(18px,2.6vw,42px);
    }

    .choice-image{
      display:block;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      object-position:center;
      border-radius:9px;
    }

    .answer-mark{
      position:absolute;
      z-index:6;
      left:50%;
      top:50%;
      width:auto;
      height:auto;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      color:#fff;
      font-family:Arial,sans-serif;
      font-weight:1000;
      font-size:clamp(72px,10vw,150px);
      line-height:.82;
      text-shadow:
        0 3px 0 rgba(17,17,17,.95),
        3px 0 0 rgba(17,17,17,.95),
        -3px 0 0 rgba(17,17,17,.95),
        0 -3px 0 rgba(17,17,17,.95),
        0 7px 14px rgba(0,0,0,.36);
      transform:translate(-50%,-50%) scale(.2);
      opacity:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .answer-mark.is-correct{
      color:#25ad69;
      background:transparent;
      text-shadow:
        0 3px 0 rgba(255,255,255,.96),
        3px 0 0 rgba(255,255,255,.96),
        -3px 0 0 rgba(255,255,255,.96),
        0 -3px 0 rgba(255,255,255,.96),
        0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-wrong{
      color:#f04747;
      background:transparent;
      text-shadow:
        0 3px 0 rgba(255,255,255,.96),
        3px 0 0 rgba(255,255,255,.96),
        -3px 0 0 rgba(255,255,255,.96),
        0 -3px 0 rgba(255,255,255,.96),
        0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-visible{
      animation:markPop .48s cubic-bezier(.16,1.12,.32,1) both;
    }

    @keyframes markPop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.15) rotate(-18deg); }
      70%{ opacity:1; transform:translate(-50%,-50%) scale(1.14) rotate(4deg); }
      100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0); }
    }

    .question-view.is-answered::after{
      display:none;
    }

    .finish-view{
      z-index:15;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .finish-view.is-visible{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .finish-card{
      width:min(82%,760px);
      min-height:min(54%,390px);
      border:clamp(4px,.45vw,7px) solid #111;
      border-radius:clamp(22px,3vw,42px);
      background:rgba(255,255,255,.96);
      box-shadow:
        0 13px 0 rgba(0,0,0,.17),
        0 24px 48px rgba(0,0,0,.22);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:28px;
      text-align:center;
      direction:rtl;
      animation:finishPop .68s cubic-bezier(.16,.92,.18,1) both;
    }

    @keyframes finishPop{
      from{ opacity:0; transform:scale(.72); }
      to{ opacity:1; transform:scale(1); }
    }

    .finish-icon{
      color:#25ad69;
      font-size:clamp(74px,11vw,150px);
      font-weight:1000;
      line-height:1;
      text-shadow:
        0 3px 0 rgba(17,17,17,.9),
        0 8px 16px rgba(0,0,0,.24);
    }

    .finish-title{
      margin:0;
      font-size:clamp(30px,5vw,72px);
      font-weight:1000;
    }

    /* هذا الجزء منقول حرفيًا من صفحة افتح الصندوق. */
    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px,6.2vh,60px);
      z-index:90;
      pointer-events:none;
    }

    .right-controls{
      pointer-events:auto;
      position:absolute;
      right:clamp(16px,2.8vw,42px);
      bottom:0;
      display:flex;
      align-items:center;
      gap:clamp(8px,1vw,12px);
      direction:ltr;
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();

      if (["white","classic","original","theme-white","أبيض","ابيض"].includes(raw)) {
        return "white";
      }
      if ([
        "classroom","school","theme-classroom","فصل","فصل مدرسي","المدرسة"
      ].includes(raw)) return "classroom";
      if ([
        "sky","clouds","sky-clouds","theme-sky-clouds","سماء","سماء وغيوم"
      ].includes(raw)) return "sky-clouds";
      if (["forest","theme-forest","غابة","الغابة"].includes(raw)) return "forest";
      if (["math","maths","theme-math","رياضيات"].includes(raw)) return "math";
      if (["english","theme-english","انجليزي","إنجليزي"].includes(raw)) return "english";
      if (["flowers","theme-flowers","ازهار","أزهار","ورود","ازهار وورود"].includes(raw)) {
        return "flowers";
      }
      if (["national-day","theme-national-day","اليوم الوطني"].includes(raw)) {
        return "national-day";
      }
      if (["founding-day","theme-founding-day","يوم التأسيس","التأسيس"].includes(raw)) {
        return "founding-day";
      }

      return "classroom";
    }

    function normalizeType(value, allowed, fallback){
      const raw = String(value || "").trim().toLowerCase();
      return allowed.includes(raw) ? raw : fallback;
    }

    function normalizeDisplayMode(payload){
      const explicit = String(
        payload?.displayMode ||
        payload?.questionsDisplay ||
        payload?.questionDisplay ||
        ""
      ).trim().toLowerCase();

      if (["cards","card","boxes","grid"].includes(explicit)) return "cards";
      if (["direct","immediate","plain"].includes(explicit)) return "direct";

      if (
        payload?.questionsInCards === false ||
        payload?.useQuestionCards === false ||
        payload?.showQuestionCards === false
      ) return "direct";

      return "cards";
    }

      );

      return source
        .map((entry)=>{
          const rawChoices = Array.isArray(entry?.choices)
            ? entry.choices
            : Array.isArray(entry?.answers)
              ? entry.answers
              : [];

          let questionType = normalizeType(
            entry?.questionType || globalQuestionType,
            ["text","image","images"],
            ""
          );
          if (questionType === "images") questionType = "image";

          const questionText = String(
            entry?.questionText ||
            entry?.text ||
            entry?.question ||
            ""
          ).trim();

          const questionImageData =
            entry?.questionImageData ||
            entry?.questionImage ||
            entry?.imageData ||
            entry?.image ||
            "";

          if (!questionType) {
            questionType = questionImageData ? "image" : "text";
          }

          let choicesType = normalizeType(
            entry?.choicesType ||
            entry?.answersType ||
            globalChoicesType,
            ["text","image","images"],
            ""
          );
          if (choicesType === "image") choicesType = "images";

          const choices = rawChoices
            .map((choice)=>{
              if (typeof choice === "string") {
                return {
                  text:choice.trim(),
                  imageData:"",
                  imageName:"",
                  isCorrect:false
                };
              }

              return {
                text:String(
                  choice?.text ||
                  choice?.title ||
                  choice?.answer ||
                  ""
                ).trim(),
                imageData:
                  choice?.imageData ||
                  choice?.image ||
                  "",
                imageName:choice?.imageName || "",
                isCorrect:Boolean(choice?.isCorrect || choice?.correct)
              };
            })
            .filter((choice)=> choice.text || choice.imageData)
            .slice(0,MAX_CHOICES);

          if (!choicesType) {
            choicesType = choices.some((choice)=> choice.imageData)
              ? "images"
              : "text";
          }

          let correctChoiceIndex = Number(
            entry?.correctChoiceIndex ??
            entry?.correctIndex ??
            entry?.answerIndex ??
            -1
          );

          if (!Number.isInteger(correctChoiceIndex) || correctChoiceIndex < 0) {
            correctChoiceIndex = choices.findIndex((choice)=> choice.isCorrect);
          }

          if (correctChoiceIndex < 0 || correctChoiceIndex >= choices.length) {
            correctChoiceIndex = 0;
          }

          const clean = {
            questionType,
            questionText,
            questionImageData,
            choicesType,
            choices,
            correctChoiceIndex
          };

          if (questionType === "text") {
            clean.questionImageData = "";
          } else {
            clean.questionText = "";
          }

          clean.choices = clean.choices.map((choice)=>{
            if (choicesType === "text") {
              return { ...choice, imageData:"", imageName:"" };
            }
            return { ...choice, text:"" };
          });

          return clean;
        })
        .filter((entry)=>
          entry.choices.length >= MIN_CHOICES &&
          (
            (entry.questionType === "text" && entry.questionText) ||
            (entry.questionType === "image" && entry.questionImageData)
          )
        )
        .slice(0,MAX_QUESTIONS);
    }

    function openEduGamesDb(){
      return new Promise((resolve,reject)=>{
        const request = indexedDB.open("sandooq_edu_games_v1",1);

        request.onupgradeneeded = ()=>{
          const db = request.result;
          if (!db.objectStoreNames.contains("payloads")) {
            db.createObjectStore("payloads",{ keyPath:"key" });
          }
        };

        request.onsuccess = ()=> resolve(request.result);
        request.onerror = ()=> reject(request.error || new Error("indexedDB failed"));
      });
    }

    async function readPayloadFromIndexedDB(key){
      const db = await openEduGamesDb();

      return new Promise((resolve,reject)=>{
        const tx = db.transaction("payloads","readonly");
        const request = tx.objectStore("payloads").get(key);

        request.onsuccess = ()=> resolve(request.result ? request.result.payload : null);
        request.onerror = ()=> reject(request.error || new Error("payload read failed"));
      });
    }

    function applyPayload(payload){
      const clean = cleanQuestions(payload);
      if (!clean.length) return false;

      questions = clean;
      currentTheme = normalizeTheme(payload?.theme || currentTheme);
      displayMode = normalizeDisplayMode(payload || {});
      document.title = String(payload?.gameName || "الاختيارات") + " - صندوق الألعاب التعليمية";
      return true;
    }

    async function hydratePayload(){
      const payloadId = getUrlParam("payloadId");

      if (payloadId) {
        try {
          const indexedPayload = await readPayloadFromIndexedDB(`quiz:${payloadId}`);
          if (indexedPayload && applyPayload(indexedPayload)) return true;
        } catch (_) {}

        try {
          const raw = sessionStorage.getItem(`sandooq_quiz_payload_v1_${payloadId}`);
          if (raw && applyPayload(JSON.parse(raw))) return true;
        } catch (_) {}
      }

      const keys = [
        "sandooq_quiz_payload_v1",
        "sandooq_quiz_draft_v1"
      ];

      for (const key of keys) {
        try {
          const raw = sessionStorage.getItem(key);
          if (raw && applyPayload(JSON.parse(raw))) return true;
        } catch (_) {}
      }

      questions = DEMO_QUESTIONS.map((item)=>({
        ...item,
        choices:item.choices.map((choice)=>({ ...choice }))
      }));
      currentTheme = normalizeTheme(getUrlParam("theme") || "classroom");
      displayMode = getUrlParam("mode") === "direct" ? "direct" : "cards";
      return false;
    }

    function applyTheme(){
      THEMES.forEach((theme)=> page.classList.remove(`theme-${theme}`));
      page.classList.add(`theme-${currentTheme}`);
    }

    function getVisualViewportMetrics(){
      const viewport = window.visualViewport;
      const layoutWidth = Math.max(
        280,
        document.documentElement.clientWidth || 0,
        window.innerWidth || 0
      );
      const layoutHeight = Math.max(
        260,
        page?.clientHeight || 0,
        document.documentElement.clientHeight || 0,
        window.innerHeight || 0
      );

      return {
        width:Math.max(
          280,
          Math.min(layoutWidth,Number(viewport?.width) || layoutWidth)
        ),
        height:Math.max(
          260,
          Math.min(layoutHeight,Number(viewport?.height) || layoutHeight)
        ),
        offsetLeft:Math.max(0,Number(viewport?.offsetLeft) || 0)
      };
    }

    function syncVisualViewportFrame(){
      const metrics = getVisualViewportMetrics();

      stage.style.left = `${metrics.offsetLeft.toFixed(2)}px`;
      stage.style.right = "auto";
      stage.style.top = "0px";
      stage.style.bottom = "auto";
      stage.style.width = `${metrics.width.toFixed(2)}px`;
      stage.style.height = `${metrics.height.toFixed(2)}px`;

      page.style.setProperty("--visual-viewport-width",`${metrics.width}px`);
      page.style.setProperty("--visual-viewport-height",`${metrics.height}px`);
    }

    function collapseSafariBars(options = {}){
      const refresh = options.refresh !== false;

      safariTimers.forEach((timer)=> clearTimeout(timer));
      safariTimers = [];

      [0,80,220,520,900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80,left:0,behavior:"auto" });
          } catch (_) {
            window.scrollTo(0,80);
          }

          if (refresh) {
            scheduleLayout();
          }
        },delay));
      });
    }

    function wait(ms){
      return new Promise((resolve)=> setTimeout(resolve,ms));
    }

    function easeInOutSine(t){
      return -(Math.cos(Math.PI * t) - 1) / 2;
    }

    function paletteFor(index){
      const source = THEME_PALETTES[currentTheme] || DEFAULT_PALETTE;
      return source[index % source.length];
    }

    function applyPalette(element,index){
      const [color,dark,light,text] = paletteFor(index);
      element.style.setProperty("--card-color",color);
      element.style.setProperty("--card-dark",dark);
      element.style.setProperty("--card-light",light);
      element.style.setProperty("--deck-text",text);
    }

    function applyPanelPalette(element,index){
      const [color,dark,light,panelText] = paletteFor(index);
      element.style.setProperty("--panel-color",color);
      element.style.setProperty("--panel-dark",dark);
      element.style.setProperty("--panel-light",light);
      element.style.setProperty("--panel-text",panelText);
    }

    function calculateDeckLayout(){
      const total = Math.max(1,questions.length);
      const width = Math.max(320,stage.clientWidth);
      const height = Math.max(320,stage.clientHeight);

      let best = null;

      for (let cols=1; cols<=Math.min(total,8); cols+=1) {
        const rows = Math.ceil(total / cols);
        const gap = Math.max(12,Math.min(24,width * .015));
        const cardW = (width * .92 - gap * (cols - 1)) / cols;
        const cardH = (height * .88 - gap * (rows - 1)) / rows;
        const ratio = cardW / Math.max(1,cardH);
        const size = Math.min(cardW,cardH * .88);
        const score =
          size -
          Math.abs(ratio - .78) * 30 -
          Math.max(0,rows - 4) * 8;

        if (!best || score > best.score) {
          best = { cols,rows,score };
        }
      }

      questionGrid.style.setProperty("--cols",String(best?.cols || 4));
    }

    function renderDeck(){
      questionGrid.textContent = "";

      questions.forEach((_,index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "deck-card";
        button.dataset.index = String(index);
        button.setAttribute("aria-label",`السؤال ${index + 1}`);
        applyPalette(button,index);

        const number = document.createElement("span");
        number.className = "deck-card-number";
        number.textContent = String(index + 1);
        button.appendChild(number);

        if (completed.has(index)) {
          button.classList.add("is-completed");
        }

        button.addEventListener("click",(event)=>{
          event.preventDefault();
          event.stopPropagation();
          openQuestionFromCard(index,button);
        });

        questionGrid.appendChild(button);
      });

      calculateDeckLayout();
    }

    function choiceColumns(count){
      if (count <= 2) return 2;
      if (count === 3) return 3;
      if (count === 4) return 2;
      return 3;
    }

    let hiddenTextMeasureBox = null;

    function getHiddenTextMeasureBox(){
      if (hiddenTextMeasureBox) return hiddenTextMeasureBox;

      hiddenTextMeasureBox = document.createElement("div");
      hiddenTextMeasureBox.setAttribute("aria-hidden","true");
      hiddenTextMeasureBox.style.cssText = [
        "position:fixed",
        "left:-100000px",
        "top:-100000px",
        "visibility:hidden",
        "pointer-events:none",
        "z-index:-1",
        "margin:0",
        "padding:0",
        "border:0",
        "box-sizing:border-box",
        "white-space:normal",
        "word-break:normal",
        "overflow-wrap:break-word",
        "text-align:center",
        "direction:rtl",
        "unicode-bidi:plaintext",
        "contain:layout style"
      ].join(";");

      document.body.appendChild(hiddenTextMeasureBox);
      return hiddenTextMeasureBox;
    }

    function fitTextInHiddenBox(el,options = {}){
      if (!el) return;

      const zone = el.closest(".question-fit-zone, .choice-fit-zone");
      if (!zone) return;

      const zoneWidth = Math.max(0,zone.clientWidth);
      const zoneHeight = Math.max(0,zone.clientHeight);
      if (zoneWidth < 2 || zoneHeight < 2) return;

      const computed = window.getComputedStyle(el);
      const measure = getHiddenTextMeasureBox();

      measure.textContent = el.textContent || "";
      measure.style.width = `${Math.max(1,zoneWidth - 2)}px`;
      measure.style.height = "auto";
      measure.style.maxHeight = "none";
      measure.style.fontFamily = computed.fontFamily;
      measure.style.fontWeight = computed.fontWeight;
      measure.style.fontStyle = computed.fontStyle;
      measure.style.letterSpacing = computed.letterSpacing;
      measure.style.lineHeight = options.lineHeight || computed.lineHeight || "1.12";
      measure.style.textAlign = computed.textAlign || "center";
      measure.style.direction = computed.direction || "rtl";

      const minFont = Math.max(12,Number(options.minFont) || 12);
      const maxFont = Math.max(minFont,Number(options.maxFont) || minFont);

      let low = minFont;
      let high = maxFont;
      let best = minFont;

      for (let i = 0; i < 26; i += 1) {
        const mid = (low + high) / 2;
        measure.style.fontSize = `${mid}px`;

        const descentSafety = Math.max(2,mid * .10);
        const fitsWidth = measure.scrollWidth <= zoneWidth + .5;
        const fitsHeight =
          measure.scrollHeight + descentSafety <= zoneHeight + .5;

        if (fitsWidth && fitsHeight) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      const finalSize = Math.max(
        minFont,
        Math.floor(best * .985 * 10) / 10
      );

      el.style.setProperty("--fit-font-size",`${finalSize}px`);
      el.style.setProperty("font-size",`${finalSize}px`,"important");
      el.style.lineHeight = options.lineHeight || "1.12";
    }

    function fitCurrentSceneText(){
      const run = ()=>{
        const qText = questionCard.querySelector(".question-text");

        if (qText) {
          const zone = qText.closest(".question-fit-zone");
          const zoneHeight = zone?.clientHeight || questionCard.clientHeight;

          fitTextInHiddenBox(qText,{
            minFont:16,
            maxFont:Math.min(
              66,
              Math.max(30,zoneHeight * .58)
            ),
            lineHeight:"1.10"
          });
        }

        choicesGrid.querySelectorAll(".choice-text").forEach((el)=>{
          const zone = el.closest(".choice-fit-zone");
          const zoneHeight = zone?.clientHeight || 90;

          fitTextInHiddenBox(el,{
            minFont:16,
            maxFont:Math.min(
              54,
              Math.max(26,zoneHeight * .62)
            ),
            lineHeight:"1.08"
          });
        });
      };

      requestAnimationFrame(()=>{
        requestAnimationFrame(run);
      });

      window.setTimeout(run,160);
      window.setTimeout(run,520);

      if (document.fonts?.ready) {
        document.fonts.ready.then(run).catch(()=>{});
      }
    }

    function renderQuestion(index){
      const item = questions[index];
      if (!item) return;

      activeQuestionIndex = index;
      directQuestionIndex = index;
      answerLocked = false;
      questionView.classList.remove("is-answered","has-two-choices");
      questionView.classList.toggle(
        "has-two-choices",
        item.choices.length === 2
      );
      questionCard.textContent = "";
      questionCard.classList.remove("is-long","is-very-long");
      choicesGrid.textContent = "";
      applyPanelPalette(questionCard,index);

      if (item.questionType === "text") {
        const questionLength = String(item.questionText || "").trim().length;
        questionCard.classList.toggle(
          "is-long",
          questionLength > 72 && questionLength <= 135
        );
        questionCard.classList.toggle(
          "is-very-long",
          questionLength > 135
        );
      }

      if (item.questionType === "image") {
        const image = document.createElement("img");
        image.className = "question-image";
        image.alt = "صورة السؤال";
        image.src = item.questionImageData;
        questionCard.appendChild(image);
      } else {
        const fitZone = document.createElement("div");
        fitZone.className = "question-fit-zone";

        const text = document.createElement("div");
        text.className = "question-text";
        text.dataset.fitText = "question";
        text.textContent = item.questionText;

        fitZone.appendChild(text);
        questionCard.appendChild(fitZone);
      }

      choicesGrid.style.setProperty(
        "--choice-cols",
        String(choiceColumns(item.choices.length))
      );

      item.choices.forEach((choice,choiceIndex)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-card";
        button.style.setProperty("--choice-order",String(choiceIndex));
        button.setAttribute("aria-label",`الاختيار ${choiceIndex + 1}`);
        applyPanelPalette(button,index * 7 + choiceIndex + 1);

        if (item.choicesType === "images") {
          const image = document.createElement("img");
          image.className = "choice-image";
          image.alt = `الاختيار ${choiceIndex + 1}`;
          image.src = choice.imageData;
          button.appendChild(image);
        } else {
          const fitZone = document.createElement("span");
          fitZone.className = "choice-fit-zone";

          const text = document.createElement("span");
          text.className = "choice-text";
          text.dataset.fitText = "choice";
          text.textContent = choice.text;

          fitZone.appendChild(text);
          button.appendChild(fitZone);
        }

        const mark = document.createElement("span");
        mark.className = "answer-mark";
        button.appendChild(mark);

        button.addEventListener("click",(event)=>{
          event.preventDefault();
          event.stopPropagation();
          chooseAnswer(button,choiceIndex);
        });

        choicesGrid.appendChild(button);
      });

      questionView.classList.add("is-visible");
      updateNavigationButtons();
      fitCurrentSceneText();
    }

    function showMark(card,type){
      const mark = card.querySelector(".answer-mark");
      if (!mark) return;

      mark.className = `answer-mark ${type === "correct" ? "is-correct" : "is-wrong"}`;
      mark.textContent = type === "correct" ? "✓" : "×";

      requestAnimationFrame(()=>{
        mark.classList.add("is-visible");
      });
    }

    function chooseAnswer(card,choiceIndex){
      if (answerLocked || interactionLocked) return;
      if (card.classList.contains("is-disabled")) return;

      const item = questions[activeQuestionIndex];
      if (!item) return;

      if (choiceIndex === item.correctChoiceIndex) {
        answerLocked = true;
        completed.add(activeQuestionIndex);
        showMark(card,"correct");

        choicesGrid.querySelectorAll(".choice-card").forEach((choiceCard)=>{
          choiceCard.classList.add("is-disabled");
          choiceCard.disabled = true;
        });

        questionView.classList.add("is-answered");
        return;
      }

      card.classList.add("is-disabled","is-wrong");
      card.disabled = true;
      showMark(card,"wrong");

      setTimeout(()=> card.classList.remove("is-wrong"),480);
    }

    function createFocusCard(source,index){
      const rect = source.getBoundingClientRect();
      const targetW = Math.min(
        Math.max(230,stage.clientWidth * .28),
        410
      );
      const targetH = Math.min(
        Math.max(245,stage.clientHeight * .48),
        470
      );
      const stageRect = stage.getBoundingClientRect();
      const centerX = stageRect.left + stageRect.width / 2;
      const centerY = stageRect.top + stageRect.height / 2;

      const clone = document.createElement("div");
      clone.className = "focus-card";
      applyPalette(clone,index);

      clone.style.left = `${rect.left}px`;
      clone.style.top = `${rect.top}px`;
      clone.style.width = `${rect.width}px`;
      clone.style.height = `${rect.height}px`;

      const number = document.createElement("span");
      number.className = "focus-card-number";
      number.textContent = String(index + 1);

      const top = document.createElement("span");
      top.className = "focus-card-top";

      clone.append(number,top);
      document.body.appendChild(clone);

      const translateX = centerX - (rect.left + rect.width / 2);
      const translateY = centerY - (rect.top + rect.height / 2);
      const scaleX = targetW / Math.max(1,rect.width);
      const scaleY = targetH / Math.max(1,rect.height);

      requestAnimationFrame(()=>{
        clone.style.transition =
          "transform .78s cubic-bezier(.18,.78,.18,1), border-radius .78s ease";
        clone.style.transform =
          `translate3d(${translateX}px,${translateY}px,0) scale(${scaleX},${scaleY})`;
      });

      return { clone,targetW,targetH };
    }

    function scatterDeck(selected){
      const cards = Array.from(questionGrid.querySelectorAll(".deck-card"));
      const centerX = stage.clientWidth / 2;
      const centerY = stage.clientHeight / 2;
      const travel = Math.max(stage.clientWidth,stage.clientHeight) * .86;

      cards.forEach((card,index)=>{
        if (card === selected) {
          card.style.opacity = "0";
          card.style.pointerEvents = "none";
          return;
        }

        const rect = card.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();
        let dx = rect.left + rect.width / 2 - (stageRect.left + centerX);
        let dy = rect.top + rect.height / 2 - (stageRect.top + centerY);
        const length = Math.hypot(dx,dy) || 1;
        dx /= length;
        dy /= length;

        card.style.setProperty("--away-x",`${dx * travel}px`);
        card.style.setProperty("--away-y",`${dy * travel}px`);
        card.style.setProperty("--away-r",`${(index % 2 ? 1 : -1) * (8 + index % 4 * 4)}deg`);
        card.classList.add("is-away");
      });
    }

    function restoreDeck(){
      questionGrid.querySelectorAll(".deck-card").forEach((card,index)=>{
        card.classList.remove("is-away");
        card.style.removeProperty("--away-x");
        card.style.removeProperty("--away-y");
        card.style.removeProperty("--away-r");
        card.style.opacity = "";
        card.style.pointerEvents = "";
        card.classList.toggle("is-completed",completed.has(index));
      });
    }

    function createBurst(centerX,centerY,index){
      burstLayer.textContent = "";
      burstLayer.style.setProperty("--origin-x",`${centerX}px`);
      burstLayer.style.setProperty("--origin-y",`${centerY}px`);

      const colors = [
        paletteFor(index)[0],
        paletteFor(index)[2],
        "#ffffff",
        "#ffd653"
      ];

      for (let i=0; i<18; i+=1) {
        const angle = (Math.PI * 2 * i) / 18;
        const distance = 90 + (i % 5) * 22;
        const dot = document.createElement("span");
        dot.className = "burst-dot";
        dot.style.setProperty("--x",`${Math.cos(angle) * distance}px`);
        dot.style.setProperty("--y",`${Math.sin(angle) * distance}px`);
        dot.style.setProperty("--r",`${180 + i * 37}deg`);
        dot.style.setProperty("--dot-color",colors[i % colors.length]);
        burstLayer.appendChild(dot);
      }

      burstLayer.classList.add("is-active");
      setTimeout(()=>{
        burstLayer.classList.remove("is-active");
        burstLayer.textContent = "";
      },820);
    }

    async function openQuestionFromCard(index,source){
      if (interactionLocked) return;
      if (!source || !questions[index]) return;

      interactionLocked = true;
      activeSourceCard = source;
      scatterDeck(source);

      const { clone } = createFocusCard(source,index);
      focusCard = clone;

      await wait(820);

      const rect = clone.getBoundingClientRect();
      createBurst(
        rect.left + rect.width / 2,
        rect.top + rect.height / 2,
        index
      );

      clone.classList.add("is-opening");
      await wait(330);

      cardsView.classList.add("is-hidden");
      renderQuestion(index);

      await wait(620);
      clone.remove();
      focusCard = null;
      interactionLocked = false;
    }

    function clearDirectFirstScenePresentation(){
      if (!page.classList.contains("direct-first-settled")) return;

      page.classList.remove("direct-first-settled");

      questionCard.getAnimations().forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });

      questionCard.style.removeProperty("animation");
      questionCard.style.removeProperty("transform");
      questionCard.style.removeProperty("opacity");
      questionCard.style.removeProperty("will-change");

      choicesGrid.querySelectorAll(".choice-card").forEach((card)=>{
        card.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        card.style.removeProperty("animation");
        card.style.removeProperty("transform");
        card.style.removeProperty("opacity");
        card.style.removeProperty("will-change");
      });
    }

    function updateNavigationButtons(){
      const questionVisible =
        questionView.classList.contains("is-visible") &&
        activeQuestionIndex >= 0 &&
        activeQuestionIndex < questions.length;

      questionNavigation.hidden = !questionVisible;

      if (!questionVisible) {
        previousBtn.hidden = true;
        nextBtn.hidden = true;
        return;
      }

      previousBtn.hidden = activeQuestionIndex <= 0;
      nextBtn.hidden = activeQuestionIndex >= questions.length - 1;
    }

    async function showQuestionByIndex(index){
      if (interactionLocked) return;
      if (!Number.isInteger(index) || index < 0 || index >= questions.length) return;

      interactionLocked = true;
      questionNavigation.hidden = true;
      questionView.classList.remove("is-visible","is-answered");
      clearDirectFirstScenePresentation();

      await wait(220);

      finishView.classList.remove("is-visible");
      cardsView.classList.add("is-hidden");
      renderQuestion(index);

      await wait(520);
      interactionLocked = false;
      collapseSafariBars();
    }

    async function goToNextQuestion(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      await showQuestionByIndex(activeQuestionIndex + 1);
    }

    async function goToPreviousQuestion(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      await showQuestionByIndex(activeQuestionIndex - 1);
    }

    async function hideQuestionScene(){
      if (interactionLocked) return;
      interactionLocked = true;
      questionNavigation.hidden = true;

      questionView.classList.remove("is-visible","is-answered");
      await wait(260);

      if (displayMode === "cards") {
        cardsView.classList.remove("is-hidden");
        restoreDeck();
        activeSourceCard = null;
        activeQuestionIndex = -1;
        answerLocked = false;
        await wait(760);
      }

      updateNavigationButtons();
      interactionLocked = false;
      collapseSafariBars();
    }

    async function handleSceneTap(event){
      if (event.target.closest(".fixed-controls")) return;
      if (event.target.closest(".choice-card")) return;
      /* الانتقال أصبح حصريًا من زري السابق والتالي. */
    }


    async function handleBack(){
      if (interactionLocked) return;

      if (questionView.classList.contains("is-visible")) {
        if (displayMode === "cards") {
          answerLocked = true;
          await hideQuestionScene();
        } else {
          try { history.back(); } catch (_) {}
        }
        return;
      }

      try {
        const returnUrl = getUrlParam("return") || getUrlParam("returnUrl");
        if (returnUrl) {
          location.href = returnUrl;
          return;
        }
      } catch (_) {}

      try {
        history.back();
      } catch (_) {}
    }

    function playCardsIntro(){
      const background = document.getElementById("themeBackground");

      if (background && typeof background.animate === "function") {
        background.animate(
          [
            { transform:"scale(1.00)" },
            { transform:"scale(1.10)" }
          ],
          {
            duration:4600,
            easing:"cubic-bezier(.45,0,.25,1)",
            fill:"forwards"
          }
        );
      }

      const cards = Array.from(
        questionGrid.querySelectorAll(".deck-card")
      );

      cards.forEach((card,index)=>{
        const angle =
          (Math.PI * 2 * index) /
          Math.max(1,cards.length);
        const distance =
          Math.max(stage.clientWidth,stage.clientHeight) * .7;

        if (typeof card.animate === "function") {
          card.animate(
            [
              {
                opacity:0,
                transform:
                  `translate(${Math.cos(angle) * distance}px,` +
                  `${Math.sin(angle) * distance}px) scale(.74)`
              },
              {
                opacity:1,
                transform:"translate(0,0) scale(1)"
              }
            ],
            {
              duration:1050,
              delay:320 + index * 36,
              easing:"cubic-bezier(.16,.82,.18,1)",
              fill:"both"
            }
          );
        }
      });
    }

    function setDirectIntroCameraFrame(bgScale){
      const background =
        document.getElementById("themeBackground");

      if (!background) return;

      background.style.transform =
        `translate3d(0,0,0) scale(${Number(bgScale).toFixed(5)})`;
      background.style.animation = "none";

      const endScale =
        Number(
          getComputedStyle(page)
            .getPropertyValue("--direct-intro-bg-final-scale")
        ) || 1.12;

      const ratio =
        (bgScale - 1) /
        Math.max(.001,endScale - 1);

      const saturation = 1.04 - ratio * .04;

      background.style.filter =
        `saturate(${Math.max(1,Math.min(1.04,saturation))})`;
    }

    function prepareDirectIntroElementTargets(){
      const choiceCards = Array.from(
        choicesGrid.querySelectorAll(".choice-card")
      );

      const stageRect = stage.getBoundingClientRect();
      const gridRect = choicesGrid.getBoundingClientRect();

      const questionTravel =
        Math.max(
          stageRect.height * .72,
          questionCard.getBoundingClientRect().height * 2.2
        );

      const questionTarget = {
        element:questionCard,
        fromTransform:
          `translate3d(0px,${(-questionTravel).toFixed(2)}px,0) scale(.88)`
      };

      const gridCenterX =
        gridRect.left + gridRect.width / 2;
      const gridCenterY =
        gridRect.top + gridRect.height / 2;

      const baseTravel =
        Math.max(stageRect.width,stageRect.height) * .78;

      const choiceTargets = choiceCards.map((card,index)=>{
        const rect = card.getBoundingClientRect();

        let dx =
          rect.left + rect.width / 2 - gridCenterX;
        let dy =
          rect.top + rect.height / 2 - gridCenterY;

        let length = Math.hypot(dx,dy);

        if (length < 1) {
          const angle =
            ((index + 1) * 2.399963229728653) %
            (Math.PI * 2);

          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;

        const distance =
          baseTravel +
          Math.max(rect.width,rect.height) * 1.45 +
          (index % 3) * 18;

        return {
          element:card,
          fromTransform:
            `translate3d(` +
            `${(unitX * distance).toFixed(2)}px,` +
            `${(unitY * distance).toFixed(2)}px,0)` +
            ` scale(.76)`
        };
      });

      return {
        questionTarget,
        choiceTargets
      };
    }

    async function animateDirectIntroElements(){
      const {
        questionTarget,
        choiceTargets
      } = prepareDirectIntroElementTargets();

      const targets = [
        questionTarget,
        ...choiceTargets
      ];

      targets.forEach(({ element,fromTransform })=>{
        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.animation = "none";
        element.style.willChange = "transform,opacity";
        element.style.transform = fromTransform;
        element.style.opacity = "0";
      });

      page.classList.remove("direct-intro-camera");
      page.classList.add("direct-intro-elements-entering");

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        targets.forEach(({ element })=>{
          element.style.transform =
            "translate3d(0,0,0) scale(1)";
          element.style.opacity = "1";
          element.style.willChange = "";
        });
        return;
      }

      const animations = targets.map(
        ({ element,fromTransform })=>{
          if (typeof element.animate !== "function") {
            element.style.transform =
              "translate3d(0,0,0) scale(1)";
            element.style.opacity = "1";
            return null;
          }

          return element.animate(
            [
              {
                transform:fromTransform,
                opacity:0
              },
              {
                transform:
                  "translate3d(0,0,0) scale(1)",
                opacity:1
              }
            ],
            {
              duration:DIRECT_INTRO_ENTRY_MS,
              easing:DIRECT_INTRO_ENTRY_EASING,
              fill:"forwards"
            }
          );
        }
      );

      await Promise.all(
        animations
          .filter(Boolean)
          .map((animation)=>
            animation.finished.catch(()=> {})
          )
      );

      targets.forEach(({ element })=>{
        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.animation = "none";
        element.style.transform =
          "translate3d(0,0,0) scale(1)";
        element.style.opacity = "1";
        element.style.willChange = "";
      });
    }

    async function playDirectOpeningIntro(){
      if (directIntroRunning) return;

      directIntroRunning = true;
      interactionLocked = true;
      questionNavigation.hidden = true;

      if (directIntroFrameId) {
        cancelAnimationFrame(directIntroFrameId);
        directIntroFrameId = null;
      }

      page.classList.remove(
        "direct-intro-done",
        "direct-intro-elements-entering",
        "direct-first-settled"
      );

      page.classList.add(
        "direct-intro-playing",
        "direct-intro-camera"
      );

      const startScale = 1;
      const endScale =
        Number(
          getComputedStyle(page)
            .getPropertyValue("--direct-intro-bg-final-scale")
        ) || 1.12;

      let startTime = null;

      syncVisualViewportFrame();
      fitCurrentSceneText();
      setDirectIntroCameraFrame(startScale);
      collapseSafariBars();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (
        !window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) startTime = now;

            const elapsed = now - startTime;

            if (elapsed < DIRECT_INTRO_HOLD_MS) {
              setDirectIntroCameraFrame(startScale);
              directIntroFrameId =
                requestAnimationFrame(animate);
              return;
            }

            const progress = Math.max(
              0,
              Math.min(
                1,
                (elapsed - DIRECT_INTRO_HOLD_MS) /
                DIRECT_INTRO_ZOOM_MS
              )
            );

            const eased = easeInOutSine(progress);
            const scale =
              startScale +
              (endScale - startScale) * eased;

            setDirectIntroCameraFrame(scale);

            if (progress < 1) {
              directIntroFrameId =
                requestAnimationFrame(animate);
              return;
            }

            directIntroFrameId = null;
            resolve();
          };

          directIntroFrameId =
            requestAnimationFrame(animate);
        });
      } else {
        setDirectIntroCameraFrame(endScale);
      }

      collapseSafariBars({ refresh:false });
      await wait(DIRECT_INTRO_SETTLE_MS);

      syncVisualViewportFrame();
      fitCurrentSceneText();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      await animateDirectIntroElements();

      const background =
        document.getElementById("themeBackground");

      if (background) {
        background.style.filter = "";
        background.style.transform =
          `translate3d(0,0,0) scale(${endScale})`;
      }

      page.classList.add(
        "direct-intro-done",
        "direct-first-settled"
      );

      page.classList.remove(
        "direct-intro-playing",
        "direct-intro-camera",
        "direct-intro-elements-entering"
      );

      directIntroRunning = false;
      interactionLocked = false;

      updateNavigationButtons();
      collapseSafariBars({ refresh:false });
    }

    function startIntro(){
      if (displayMode === "direct") {
        playDirectOpeningIntro();
        return;
      }

      playCardsIntro();
    }

    function scheduleLayout(delay = 0){
      if (viewportLayoutFrame) {
        cancelAnimationFrame(viewportLayoutFrame);
        viewportLayoutFrame = null;
      }

      if (viewportLayoutTimer) {
        clearTimeout(viewportLayoutTimer);
        viewportLayoutTimer = null;
      }

      const run = ()=>{
        viewportLayoutFrame = requestAnimationFrame(()=>{
          viewportLayoutFrame = null;
          syncVisualViewportFrame();
          calculateDeckLayout();
          fitCurrentSceneText();
        });
      };

      if (delay > 0) {
        viewportLayoutTimer = setTimeout(()=>{
          viewportLayoutTimer = null;
          run();
        },delay);
      } else {
        run();
      }
    }

    async function initialize(){
      syncVisualViewportFrame();
      await hydratePayload();
      applyTheme();

      if (displayMode === "cards") {
        renderDeck();
        cardsView.classList.remove("is-hidden");
        questionNavigation.hidden = true;
      } else {
        page.classList.add(
          "direct-intro-playing",
          "direct-intro-camera"
        );
        cardsView.classList.add("is-hidden");
        renderQuestion(0);
        questionNavigation.hidden = true;
      }

      requestAnimationFrame(()=>{
        requestAnimationFrame(startIntro);
      });

      collapseSafariBars();
    }

    page.addEventListener("click",handleSceneTap);

    backBtn.addEventListener("click",(event)=>{
      event.preventDefault();
      event.stopPropagation();
      handleBack();
    });

    nextBtn.addEventListener("click",goToNextQuestion);
    previousBtn.addEventListener("click",goToPreviousQuestion);

    window.addEventListener("resize",()=>{
      scheduleLayout(40);
    },{ passive:true });

    window.addEventListener("orientationchange",()=>{
      setTimeout(()=>{
        collapseSafariBars();
        scheduleLayout(80);
      },160);
    },{ passive:true });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize",()=>{
        scheduleLayout(34);
      },{ passive:true });

      window.visualViewport.addEventListener("scroll",()=>{
        scheduleLayout(34);
      },{ passive:true });
    }

    document.addEventListener("touchend",()=>{
      collapseSafariBars();
    },{ passive:true });

    window.addEventListener("pageshow",()=>{
      collapseSafariBars();
      scheduleLayout(60);
    },{ passive:true });

    initialize();
  })();
  </script>
