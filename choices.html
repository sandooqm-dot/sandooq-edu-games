<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: choices-v35-open-box-sounds-synced -->
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  />
  <title>الاختيارات - صندوق الألعاب التعليمية</title>

  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --edge-guard:clamp(16px,2vw,30px);

      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --green:#25ad69;
      --red:#f04747;
      --logo-w:clamp(86px,9.2vw,148px);
      --card-radius:clamp(14px,1.6vw,24px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma,Arial,"Segoe UI",sans-serif;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    /*
      منقول من صفحة افتح الصندوق:
      body وحده مسؤول عن التمرير، ولا توجد أي قاعدة overflow على html.
    */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:none;
      isolation:isolate;
    }

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1);
      transform-origin:center center;
      will-change:transform,opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .game-page.theme-white{
      background:#fff;
    }

    .game-page.theme-white .theme-background{
      opacity:0;
      background-image:none;
    }

    .game-page.theme-classroom .theme-background{
      opacity:1;
      background-color:#fff;
      background-image:
        url("theme-classroom-bg-v2.webp?v=2"),
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        url("theme-original.webp?v=45"),
        url("theme-original.png?v=45");
    }

    .game-page.theme-sky-clouds .theme-background{
      opacity:1;
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        linear-gradient(180deg,#67d0f3 0%,#b6ecff 100%);
    }

    .game-page.theme-forest .theme-background{
      opacity:1;
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .game-page.theme-math .theme-background{
      opacity:1;
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .game-page.theme-english .theme-background{
      opacity:1;
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#65bdc4 100%);
    }

    .game-page.theme-flowers .theme-background{
      opacity:1;
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .game-page.theme-national-day .theme-background{
      opacity:1;
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .game-page.theme-founding-day .theme-background{
      opacity:1;
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    /* منقول حرفيًا من صفحة افتح الصندوق. */
    .game-logo{
      position:absolute;
      top:clamp(10px,1.7vw,22px);
      left:clamp(12px,2vw,30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px,9vw,120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* منقول حرفيًا من صفحة افتح الصندوق. */
    .stage{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(72px + var(--safe-top))
        calc(var(--edge-guard) + var(--safe-right))
        calc(82px + var(--safe-bottom))
        calc(var(--edge-guard) + var(--safe-left));
      direction:ltr;
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      overflow:hidden;
    }

    .cards-view,
    .question-view,
    .finish-view{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .cards-view{
      z-index:5;
      opacity:1;
      visibility:visible;
      transition:opacity .22s ease;
    }

    .cards-view.is-hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .question-grid{
      --cols:4;
      --gap:clamp(12px,1.45vw,22px);
      width:min(92%,1360px);
      height:min(86%,690px);
      display:grid;
      grid-template-columns:repeat(var(--cols),minmax(0,1fr));
      grid-auto-rows:minmax(0,1fr);
      align-content:center;
      justify-content:center;
      gap:var(--gap);
      direction:ltr;
    }

    .deck-card{
      --card-color:#e82f70;
      --card-dark:#b81550;
      --card-light:#ff679a;
      position:relative;
      min-width:0;
      min-height:0;
      border:0;
      border-radius:var(--card-radius);
      padding:0;
      background:
        linear-gradient(150deg,var(--card-light) 0%,var(--card-color) 56%,var(--card-dark) 100%);
      color:#fff;
      cursor:pointer;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.26),
        inset 0 0 0 2px rgba(0,0,0,.14),
        0 7px 0 rgba(0,0,0,.16),
        0 13px 22px rgba(0,0,0,.15);
      overflow:hidden;
      transform:translate3d(0,0,0);
      opacity:1;
      transition:
        transform .78s cubic-bezier(.18,.78,.18,1),
        opacity .42s ease,
        filter .25s ease;
      will-change:transform,opacity;
    }

    .deck-card::before{
      content:"";
      position:absolute;
      inset:6%;
      border-radius:calc(var(--card-radius) * .78);
      border:2px solid rgba(255,255,255,.30);
      box-shadow:inset 0 0 18px rgba(255,255,255,.08);
      pointer-events:none;
    }

    .deck-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 24% 18%,rgba(255,255,255,.24),transparent 28%),
        linear-gradient(90deg,transparent 0 48%,rgba(255,255,255,.06) 49% 51%,transparent 52%);
      pointer-events:none;
    }

    .deck-card-number{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10%;
      color:var(--deck-text,#fff);
      font-weight:1000;
      font-size:clamp(28px,5.2vw,84px);
      line-height:1;
      text-shadow:0 3px 7px rgba(0,0,0,.28);
    }

    .deck-card.is-completed{
      filter:saturate(.55) brightness(.82);
    }

    .deck-card.is-completed .deck-card-number::after{
      content:"✓";
      position:absolute;
      top:8%;
      right:8%;
      color:#fff;
      font-size:48%;
      font-weight:1000;
      text-shadow:
        0 2px 0 rgba(0,0,0,.9),
        0 5px 10px rgba(0,0,0,.28);
    }

    .deck-card.is-away{
      opacity:0;
      pointer-events:none;
      transform:
        translate3d(var(--away-x,0),var(--away-y,0),0)
        scale(.72)
        rotate(var(--away-r,0deg));
    }

    .focus-card{
      --card-color:#e82f70;
      --card-dark:#b81550;
      --card-light:#ff679a;
      position:fixed;
      z-index:70;
      margin:0;
      border:0;
      padding:0;
      border-radius:var(--card-radius);
      background:
        linear-gradient(150deg,var(--card-light) 0%,var(--card-color) 56%,var(--card-dark) 100%);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.26),
        inset 0 0 0 2px rgba(0,0,0,.14),
        0 13px 0 rgba(0,0,0,.16),
        0 22px 42px rgba(0,0,0,.25);
      transform-origin:center;
      pointer-events:none;
      overflow:visible;
      will-change:transform,opacity;
    }

    .focus-card::before{
      content:"";
      position:absolute;
      inset:6%;
      border-radius:calc(var(--card-radius) * .78);
      border:3px solid rgba(255,255,255,.34);
      z-index:2;
    }

    .focus-card-number{
      position:absolute;
      inset:0;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--deck-text,#fff);
      font-weight:1000;
      font-size:clamp(48px,8vw,126px);
      line-height:1;
      text-shadow:0 4px 10px rgba(0,0,0,.28);
    }

    .focus-card-top{
      position:absolute;
      z-index:5;
      top:0;
      left:0;
      width:100%;
      height:50%;
      border-radius:var(--card-radius) var(--card-radius) 18px 18px;
      background:
        linear-gradient(155deg,var(--card-light) 0%,var(--card-color) 58%,var(--card-dark) 100%);
      box-shadow:inset 0 2px 0 rgba(255,255,255,.24);
      transform-origin:50% 0%;
      opacity:0;
    }

    .focus-card.is-opening{
      animation:cardCoreBurst .78s cubic-bezier(.18,.76,.18,1) both;
    }

    .focus-card.is-opening .focus-card-top{
      opacity:1;
      animation:cardTopOpen .78s cubic-bezier(.18,.76,.18,1) both;
    }

    .focus-card.is-opening .focus-card-number{
      animation:cardNumberVanish .48s ease both;
    }

    @keyframes cardCoreBurst{
      0%{ opacity:1; transform:translate3d(0,0,0) scale(1); filter:brightness(1); }
      36%{ opacity:1; transform:translate3d(0,0,0) scale(1.08); filter:brightness(1.28); }
      68%{ opacity:.88; transform:translate3d(0,0,0) scale(1.18); filter:brightness(1.42); }
      100%{ opacity:0; transform:translate3d(0,0,0) scale(1.46); filter:brightness(1.7); }
    }

    @keyframes cardTopOpen{
      0%{ opacity:0; transform:perspective(900px) rotateX(0deg) translateY(0) scale(1); }
      20%{ opacity:1; }
      65%{ opacity:1; transform:perspective(900px) rotateX(58deg) translateY(-40%) scale(1.04); }
      100%{ opacity:0; transform:perspective(900px) rotateX(86deg) translateY(-125%) scale(1.10); }
    }

    @keyframes cardNumberVanish{
      0%{ opacity:1; transform:scale(1); }
      100%{ opacity:0; transform:scale(1.25); }
    }

    .burst-layer{
      position:fixed;
      z-index:69;
      inset:0;
      pointer-events:none;
      opacity:0;
    }

    .burst-layer.is-active{
      opacity:1;
    }

    .burst-dot{
      --x:0px;
      --y:0px;
      --r:0deg;
      position:absolute;
      left:var(--origin-x);
      top:var(--origin-y);
      width:clamp(8px,1.2vw,18px);
      aspect-ratio:1;
      border-radius:4px;
      background:var(--dot-color,#fff);
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      animation:burstDot .72s cubic-bezier(.12,.68,.18,1) both;
    }

    @keyframes burstDot{
      0%{
        opacity:1;
        transform:translate(-50%,-50%) rotate(0deg) scale(.4);
      }
      100%{
        opacity:0;
        transform:
          translate(calc(-50% + var(--x)),calc(-50% + var(--y)))
          rotate(var(--r))
          scale(1.1);
      }
    }

    .question-view{
      z-index:10;
      flex-direction:column;
      justify-content:center;
      gap:clamp(12px,1.7vh,20px);
      padding:0;
      direction:rtl;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .question-view.is-visible{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .question-card{
      --panel-color:#2f75d4;
      --panel-dark:#174b9b;
      --panel-light:#65a4f1;
      --panel-text:#fff;
      position:relative;
      flex:0 0 clamp(104px,15vh,142px);
      width:min(82%,960px);
      min-height:0;
      border:clamp(3px,.28vw,4px) solid #111;
      border-radius:clamp(10px,1vw,15px);
      background:var(--panel-color);
      color:var(--panel-text);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.23),
        0 5px 0 rgba(0,0,0,.16),
        0 10px 18px rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(11px,1.4vw,19px);
      overflow:hidden;
      opacity:0;
      transform:translateY(-90px) scale(.95);
    }

    .question-card.is-long{
      flex-basis:clamp(132px,19vh,176px);
    }

    .question-card.is-very-long{
      flex-basis:clamp(158px,23vh,212px);
    }

    .question-view.is-visible .question-card{
      animation:questionArrive .68s cubic-bezier(.16,.82,.18,1) .08s both;
    }

    @keyframes questionArrive{
      0%{ opacity:0; transform:translateY(-90px) scale(.95); }
      100%{ opacity:1; transform:translateY(0) scale(1); }
    }

    .question-text,
    .choice-text{
      width:100%;
      height:auto;
      max-height:none;
      overflow:visible;
      white-space:normal;
      overflow-wrap:anywhere;
      word-break:normal;
      text-wrap:balance;
      box-sizing:border-box;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
      font-weight:1000;
      color:var(--panel-text,#fff);
      text-shadow:0 2px 4px rgba(0,0,0,.24);
    }

    .question-text{
      line-height:1.16;
      padding:.06em .10em .14em;
      font-size:clamp(20px,3.2vw,52px);
    }

    .question-image{
      display:block;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      object-position:center;
      border-radius:10px;
    }

    .choices-grid{
      --choice-cols:2;
      width:min(82%,980px);
      flex:0 0 auto;
      min-height:0;
      display:grid;
      grid-template-columns:repeat(var(--choice-cols),minmax(0,1fr));
      grid-auto-rows:clamp(84px,13.5vh,122px);
      align-content:center;
      gap:clamp(10px,1.1vw,16px);
      direction:ltr;
    }

    .choice-card{
      --panel-color:#f2772f;
      --panel-dark:#ba4714;
      --panel-light:#ffa05f;
      --panel-text:#fff;
      position:relative;
      min-width:0;
      min-height:0;
      border:clamp(3px,.28vw,4px) solid #111;
      border-radius:clamp(9px,.9vw,14px);
      background:var(--panel-color);
      color:var(--panel-text);
      padding:clamp(9px,1.05vw,15px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.22),
        0 5px 0 rgba(0,0,0,.15),
        0 9px 16px rgba(0,0,0,.11);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      cursor:pointer;
      opacity:0;
      transform:translateY(90px) scale(.93);
    }

    .question-view.is-visible .choice-card{
      animation:choiceArrive .62s cubic-bezier(.16,.82,.18,1) both;
      animation-delay:calc(.14s + var(--choice-order,0) * .075s);
    }

    @keyframes choiceArrive{
      0%{ opacity:0; transform:translateY(90px) scale(.93); }
      100%{ opacity:1; transform:translateY(0) scale(1); }
    }

    .choice-card:active{
      transform:translateY(2px);
    }

    .choice-card.is-disabled{
      cursor:default;
    }

    .choice-card.is-wrong{
      animation:wrongShake .44s ease both !important;
    }

    @keyframes wrongShake{
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-10px); }
      40%{ transform:translateX(10px); }
      60%{ transform:translateX(-7px); }
      80%{ transform:translateX(7px); }
    }

    .choice-text{
      line-height:1.12;
      padding:.05em .08em .12em;
      font-size:clamp(18px,2.6vw,42px);
    }

    .choice-image{
      display:block;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      object-position:center;
      border-radius:9px;
    }

    .answer-mark{
      position:absolute;
      z-index:6;
      left:50%;
      top:50%;
      width:auto;
      height:auto;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      color:#fff;
      font-family:Arial,sans-serif;
      font-weight:1000;
      font-size:clamp(72px,10vw,150px);
      line-height:.82;
      text-shadow:
        0 3px 0 rgba(17,17,17,.95),
        3px 0 0 rgba(17,17,17,.95),
        -3px 0 0 rgba(17,17,17,.95),
        0 -3px 0 rgba(17,17,17,.95),
        0 7px 14px rgba(0,0,0,.36);
      transform:translate(-50%,-50%) scale(.2);
      opacity:0;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }

    .answer-mark.is-correct{
      color:#25ad69;
      background:transparent;
      text-shadow:
        0 3px 0 rgba(255,255,255,.96),
        3px 0 0 rgba(255,255,255,.96),
        -3px 0 0 rgba(255,255,255,.96),
        0 -3px 0 rgba(255,255,255,.96),
        0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-wrong{
      color:#f04747;
      background:transparent;
      text-shadow:
        0 3px 0 rgba(255,255,255,.96),
        3px 0 0 rgba(255,255,255,.96),
        -3px 0 0 rgba(255,255,255,.96),
        0 -3px 0 rgba(255,255,255,.96),
        0 7px 14px rgba(0,0,0,.34);
    }

    .answer-mark.is-visible{
      animation:markPop .48s cubic-bezier(.16,1.12,.32,1) both;
    }

    @keyframes markPop{
      0%{ opacity:0; transform:translate(-50%,-50%) scale(.15) rotate(-18deg); }
      70%{ opacity:1; transform:translate(-50%,-50%) scale(1.14) rotate(4deg); }
      100%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0); }
    }

    .question-view.is-answered::after{
      display:none;
    }

    .finish-view{
      z-index:15;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .finish-view.is-visible{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .finish-card{
      width:min(82%,760px);
      min-height:min(54%,390px);
      border:clamp(4px,.45vw,7px) solid #111;
      border-radius:clamp(22px,3vw,42px);
      background:rgba(255,255,255,.96);
      box-shadow:
        0 13px 0 rgba(0,0,0,.17),
        0 24px 48px rgba(0,0,0,.22);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:28px;
      text-align:center;
      direction:rtl;
      animation:finishPop .68s cubic-bezier(.16,.92,.18,1) both;
    }

    @keyframes finishPop{
      from{ opacity:0; transform:scale(.72); }
      to{ opacity:1; transform:scale(1); }
    }

    .finish-icon{
      color:#25ad69;
      font-size:clamp(74px,11vw,150px);
      font-weight:1000;
      line-height:1;
      text-shadow:
        0 3px 0 rgba(17,17,17,.9),
        0 8px 16px rgba(0,0,0,.24);
    }

    .finish-title{
      margin:0;
      font-size:clamp(30px,5vw,72px);
      font-weight:1000;
    }

    /* هذا الجزء منقول حرفيًا من صفحة افتح الصندوق. */
    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px,6.2vh,60px);
      z-index:90;
      pointer-events:none;
    }

    .right-controls{
      pointer-events:auto;
      position:absolute;
      right:clamp(16px,2.8vw,42px);
      bottom:0;
      display:flex;
      align-items:center;
      gap:clamp(8px,1vw,12px);
      direction:ltr;
    }

    .back-btn,
    .right-controls .control-btn{
      pointer-events:auto;
      position:absolute;
      bottom:0;
      height:clamp(34px,4.8vh,44px);

    @media (orientation:portrait){

      .back-btn,
      .right-controls .control-btn{

    @media (prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }

    /* v8: رفع السؤال، خفض الاختيارات، وترك مساحة واضحة بينهما. */
    .question-view{
      justify-content:flex-start;
      align-items:center;
      gap:0;
      padding:
        clamp(30px,5vh,54px)
        0
        0;
    }

      flex:none;
      margin-top:0;
      width:min(72%,880px);
      height:clamp(92px,13.5vh,124px);
    }

    .question-card.is-long{
      height:clamp(112px,16.5vh,148px);
      flex-basis:auto;
    }

    .question-card.is-very-long{
      height:clamp(134px,20vh,176px);

      flex:none;
      width:min(84%,1060px);
      margin-top:clamp(56px,8.5vh,86px);
      grid-auto-rows:clamp(88px,14vh,128px);
    }

    /*
      عند وجود خيارين فقط نُنزّل مجموعة السؤال والإجابات معًا
      لاستغلال الفراغ السفلي وتحقيق توازن بصري أفضل.
    */
    .question-view.has-two-choices{
      padding-top:clamp(92px,15vh,138px);
    }

    .question-view.has-two-choices .choices-grid{
      margin-top:clamp(64px,9.5vh,94px);
    }

    /*
      المنطقة الداخلية هي "المربع المخفي" الذي يحدد المساحة الحقيقية للنص.
      النص يقاس داخل هذه المنطقة، ولا يعتمد على كامل المستطيل الخارجي.
    */
    .question-fit-zone,
    .choice-fit-zone{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      min-width:0;
      min-height:0;
      pointer-events:none;
    }

    .question-fit-zone{
      width:92%;
      height:78%;
    }

    .question-card.is-long .question-fit-zone{
      height:82%;
    }

    .question-card.is-very-long .question-fit-zone{
      height:86%;
    }

    .choice-fit-zone{
      width:90%;
      height:76%;
    }

    .question-text,
    .choice-text{
      display:block;
      width:100%;
      max-width:100%;
      height:auto;
      max-height:none;
      margin:0;
      padding:0;
      overflow:visible;
      white-space:normal;
      word-break:normal;
      overflow-wrap:break-word;
      text-wrap:balance;
      line-height:1.12;
      text-align:center;
      direction:rtl;
      unicode-bidi:plaintext;
    }

    @media (orientation:portrait){
      .question-view{
        padding-top:clamp(26px,4vh,46px);
      }

      .question-card{
        width:78%;
        height:clamp(88px,12.5vh,116px);
      }

      .question-card.is-long{
        height:clamp(108px,15.5vh,142px);
      }

      .question-card.is-very-long{
        height:clamp(132px,19vh,174px);
      }

      }

      }

    @media (max-width:560px){

    @media (max-height:520px) and (orientation:landscape){
      .question-view{

        width:min(70%,820px);

        margin-top:0;
      }

      .question-card.is-long{
        height:clamp(86px,20vh,112px);
      }

      .question-card.is-very-long{
        height:clamp(104px,25vh,136px);
      }

      .choices-grid{
        width:min(82%,960px);
        margin-top:clamp(38px,9vh,58px);
        grid-auto-rows:clamp(64px,18vh,96px);
      }

      .question-view.has-two-choices{
        padding-top:clamp(46px,11vh,72px);
      }

      .question-view.has-two-choices .choices-grid{
        margin-top:clamp(44px,10vh,64px);
      }
    }


    /* v11: إنزال مجموعة السؤال والإجابات كاملة إلى الأسفل. */
    .question-view{
      transform:translateY(clamp(48px,8vh,76px));
    }

    @media (orientation:portrait){
      .question-view{
        transform:translateY(clamp(38px,6vh,62px));
      }
    }

    @media (max-width:560px){
      .question-view{
        transform:translateY(clamp(30px,5vh,48px));
      }
    }

    @media (max-height:520px) and (orientation:landscape){
      .question-view{
        transform:translateY(clamp(24px,6vh,38px));
      }
    }


    /* v12: افتتاح الوضع المباشر بنفس حركة صفحة افتح الصندوق. */
    :root{
      --direct-intro-bg-final-scale:1.12;
      --direct-intro-entry-duration:3200ms;
      --direct-intro-entry-easing:cubic-bezier(.37,0,.63,1);
    }

    .fixed-controls{
      transition:opacity .34s ease, transform .34s ease;
    }

    .game-page.direct-intro-playing .fixed-controls{
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
    }

    .game-page.direct-intro-playing .theme-background{
      transform:translate3d(0,0,0) scale(1);
      will-change:transform,opacity;
    }

    .game-page.direct-intro-done .theme-background{
      transform:
        translate3d(0,0,0)
        scale(var(--direct-intro-bg-final-scale));
    }

    .game-page.direct-intro-playing .game-logo{
      animation:directIntroLogoFade .75s ease-out both;
    }

    @keyframes directIntroLogoFade{
      0%{
        opacity:0;
        transform:translateY(-8px);
      }
      100%{
        opacity:1;
        transform:translateY(0);
      }
    }

    /*
      أثناء زوم الخلفية تكون بطاقة السؤال والاختيارات موجودة
      للقياس فقط، لكنها غير ظاهرة للمستخدم.
    */
    .game-page.direct-intro-playing.direct-intro-camera .question-view{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    /*
      بعد ثبات الزوم نجعل المشهد مرئيًا، بينما العناصر نفسها
      تبدأ من خارج الشاشة وتعود إلى مواقعها بالتحريك البرمجي.
    */
    .game-page.direct-intro-playing.direct-intro-elements-entering .question-view{
      opacity:1;
      visibility:visible;
      pointer-events:none;
    }

    .game-page.direct-intro-playing .question-view.is-visible .question-card,
    .game-page.direct-intro-playing .question-view.is-visible .choice-card,
    .game-page.direct-first-settled .question-view.is-visible .question-card,
    .game-page.direct-first-settled .question-view.is-visible .choice-card{
      animation:none !important;
    }

    @media (prefers-reduced-motion:reduce){
      .game-page.direct-intro-playing .game-logo,
      .game-page.direct-intro-playing .theme-background,
      .game-page.direct-intro-playing .question-card,
      .game-page.direct-intro-playing .choice-card{
        animation:none !important;
      }
    }


    /* v13: ثلاثة أو خمسة خيارات = الخيار الأخير في منتصف الصف الأخير. */
    .choices-grid{
      --choices-gap:clamp(10px,1.1vw,16px);
      gap:var(--choices-gap);
    }

    .choices-grid.has-centered-last-choice{
      --choice-cols:2;
    }

    .choices-grid.has-centered-last-choice .choice-card:last-child{
      grid-column:1 / -1;
      width:calc((100% - var(--choices-gap)) / 2);
      justify-self:center;
    }

    /*
      السؤال والاختيارات يستخدمان لونًا واحدًا ثابتًا بالكامل،
      والنص أبيض دائمًا لزيادة الوضوح.
    */
    .question-card,
    .choice-card{
      background:var(--panel-color) !important;
      color:#fff;
    }

    .question-text,
    .choice-text{
      color:#fff !important;
    }

    @media (max-width:560px){
      .choices-grid{
        --choices-gap:8px;
      }
    }


    /* v14: استغلال مساحة النص، تباعد سطور أوضح، وانتقال بطيء موحد. */
    .question-card{
      padding-inline:clamp(6px,.65vw,10px);
    }

    .choice-card{
      padding-inline:clamp(5px,.6vw,9px);
    }

    .question-fit-zone{
      width:97%;
    }

    .question-card.is-long .question-fit-zone,
    .question-card.is-very-long .question-fit-zone{
      width:98%;
    }

    .choice-fit-zone{
      width:96%;
    }

    .question-text{
      line-height:1.17;
    }

    .choice-text{
      line-height:1.15;
    }

    /* منع الحركة السريعة القديمة أثناء التالي والسابق. */
    .game-page.direct-navigation-playing .question-view.is-visible .question-card,
    .game-page.direct-navigation-playing .question-view.is-visible .choice-card{
      animation:none !important;
    }

    .game-page.direct-navigation-playing .question-navigation{
      display:none !important;
    }


    /* v15: نفس مبدأ مناطق المحتوى داخل صفحة افتح الصندوق. */
    .question-card{
      padding:clamp(3px,.28vw,5px) !important;
    }

    .choice-card{
      padding:clamp(3px,.24vw,5px) !important;
    }

    .question-fit-zone,
    .choice-fit-zone{
      box-sizing:border-box;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
      padding:0;
      min-width:0;
      min-height:0;
    }

    .question-fit-zone{
      width:calc(100% - clamp(8px,.55vw,12px)) !important;
      height:calc(100% - clamp(8px,.65vh,12px)) !important;
      max-width:none !important;
      max-height:none !important;
    }

    .question-card.is-long .question-fit-zone,
    .question-card.is-very-long .question-fit-zone{
      width:calc(100% - clamp(8px,.55vw,12px)) !important;
      height:calc(100% - clamp(8px,.65vh,12px)) !important;
    }

    .choice-fit-zone{
      width:calc(100% - clamp(6px,.45vw,10px)) !important;
      height:calc(100% - clamp(6px,.55vh,10px)) !important;
      max-width:none !important;
      max-height:none !important;
    }

    /*
      إلغاء موازنة السطور لأنها كانت تترك فراغات كبيرة يمينًا ويسارًا.
      اللف الطبيعي يستغل عرض المستطيل أولًا ثم ينتقل للسطر التالي.
    */
    .question-text,
    .choice-text{
      width:100% !important;
      max-width:100% !important;
      height:auto !important;
      max-height:none !important;
      margin:0 !important;
      padding:0 !important;
      white-space:normal !important;
      word-break:normal !important;
      overflow-wrap:normal !important;
      text-wrap:wrap !important;
      overflow:visible !important;
      box-sizing:border-box !important;
    }

    .question-text{
      line-height:1.18 !important;
    }

    .choice-text{
      line-height:1.17 !important;
    }

    .question-media-zone,
    .choice-media-zone{
      overflow:hidden !important;
    }

    .question-image,
    .choice-image{
      display:block !important;
      width:100% !important;
      height:100% !important;
      max-width:100% !important;
      max-height:100% !important;
      object-fit:contain !important;
      object-position:center center !important;
      margin:0 !important;
      padding:0 !important;
    }

    @media (max-width:560px){
      .question-fit-zone{
        width:calc(100% - 6px) !important;
        height:calc(100% - 6px) !important;
      }

      .choice-fit-zone{
        width:calc(100% - 5px) !important;
        height:calc(100% - 5px) !important;
      }
    }


    /* v16: منع تصغير النص إلى أحجام مجهرية. */
    .question-text,
    .choice-text{
      display:block !important;
      flex:0 0 auto !important;
      align-self:center !important;
      min-width:0 !important;
      min-height:0 !important;
    }

    .question-text{
      font-size:clamp(18px,3vw,64px);
      line-height:1.17 !important;
    }

    .choice-text{
      font-size:clamp(16px,2.55vw,50px);
      line-height:1.16 !important;
    }


    /* v17: السؤال المصور داخل إطار مربع، والاختيارات المصورة داخل مربعات. */
    :root{
      --question-image-size:clamp(150px,23vh,224px);
      --choice-image-size:clamp(96px,16.5vh,152px);
      --image-choice-gap:clamp(10px,1.2vw,18px);
    }

    .question-view.has-image-question,
    .question-view.has-image-choices{
      transform:translateY(clamp(20px,3.5vh,38px));
    }

    .question-view.has-image-question{
      padding-top:clamp(12px,2.4vh,28px);
    }

    .question-view.has-image-question .question-card.is-image-question{
      flex:0 0 auto !important;
      width:var(--question-image-size) !important;
      height:var(--question-image-size) !important;
      min-width:var(--question-image-size) !important;
      min-height:var(--question-image-size) !important;
      aspect-ratio:1 / 1;
      margin:0 !important;
      padding:clamp(6px,.65vw,10px) !important;
      border:clamp(3px,.3vw,5px) solid #111 !important;
      border-radius:clamp(12px,1.35vw,20px) !important;
      background:rgba(255,255,255,.96) !important;
      box-shadow:
        0 6px 0 rgba(0,0,0,.18),
        0 14px 25px rgba(0,0,0,.18) !important;
      overflow:hidden !important;
      cursor:zoom-in;
    }

    .question-card.is-image-question .question-fit-zone{
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      max-height:none !important;
      pointer-events:auto !important;
      cursor:zoom-in;
      border-radius:clamp(7px,.85vw,13px);
      overflow:hidden !important;
    }

    .question-card.is-image-question .question-image{
      display:block !important;
      width:100% !important;
      height:100% !important;
      max-width:100% !important;
      max-height:100% !important;
      object-fit:contain !important;
      object-position:center center !important;
      border-radius:clamp(6px,.75vw,11px) !important;
      background:#fff;
      cursor:zoom-in;
    }

    .question-view.has-image-question .choices-grid{
      margin-top:clamp(28px,4.8vh,50px);
    }

    /* شبكة صور الاختيارات تعتمد المربعات بدل المستطيلات. */
    .choices-grid.is-image-choices{
      display:flex !important;
      flex-wrap:wrap;
      justify-content:center;
      align-content:center;
      align-items:center;
      gap:var(--image-choice-gap) !important;
      width:100% !important;
      max-width:none;
      margin-inline:auto;
      grid-template-columns:none !important;
      grid-auto-rows:auto !important;
      direction:ltr;
    }

    .choices-grid.is-image-choices.choice-count-2{
      max-width:calc(
        var(--choice-image-size) +
        var(--choice-image-size) +
        var(--image-choice-gap)
      );
    }

    .choices-grid.is-image-choices.choice-count-3,
    .choices-grid.is-image-choices.choice-count-5,
    .choices-grid.is-image-choices.choice-count-6{
      max-width:calc(
        var(--choice-image-size) +
        var(--choice-image-size) +
        var(--choice-image-size) +
        var(--image-choice-gap) +
        var(--image-choice-gap)
      );
    }

    .choices-grid.is-image-choices.choice-count-4{
      max-width:calc(
        var(--choice-image-size) +
        var(--choice-image-size) +
        var(--image-choice-gap)
      );
    }

    .choices-grid.is-image-choices .choice-card.is-image-choice{
      flex:0 0 var(--choice-image-size) !important;
      width:var(--choice-image-size) !important;
      height:var(--choice-image-size) !important;
      min-width:var(--choice-image-size) !important;
      min-height:var(--choice-image-size) !important;
      aspect-ratio:1 / 1;
      padding:clamp(5px,.55vw,9px) !important;

      3 = صف واحد من ثلاث صور.
      4 = صفان، كل صف صورتان.
      5 = ثلاث فوق واثنتان في المنتصف تحت.
      6 = ثلاث فوق وثلاث تحت.
    */
    .choices-grid.is-image-choices.choice-count-2{
      width:calc(
        var(--image-choice-size) * 2 +
        var(--image-choice-gap)
      ) !important;
    }

    .choices-grid.is-image-choices.choice-count-3,
    .choices-grid.is-image-choices.choice-count-5,
    .choices-grid.is-image-choices.choice-count-6{
      width:calc(
        var(--image-choice-size) * 3 +
        var(--image-choice-gap) * 2
      ) !important;
    }

    .choices-grid.is-image-choices.choice-count-4{
      width:calc(
        var(--image-choice-size) * 2 +
        var(--image-choice-gap)
      ) !important;
    }

    /*
      كل اختيار صورة يصبح مربعًا كبيرًا فعليًا،
      ولا تسمح له القواعد القديمة بالتصغير.
    */
    .choices-grid.is-image-choices .choice-card.is-image-choice{
      flex:0 0 var(--image-choice-size) !important;
      width:var(--image-choice-size) !important;
      height:var(--image-choice-size) !important;
      min-width:var(--image-choice-size) !important;
      min-height:var(--image-choice-size) !important;
      max-width:var(--image-choice-size) !important;
      max-height:var(--image-choice-size) !important;
      aspect-ratio:1 / 1 !important;
      padding:clamp(4px,.38vw,7px) !important;
    }

    /*
      السؤال المصور يبقى أكبر بوضوح من صور الاختيارات.
      الإطار أعرض قليلًا من الجانبين للدلالة على أنه السؤال.
    */
    .question-view.has-image-question{
      --question-image-height:clamp(225px,31vh,285px);
    }

    .question-view.has-image-question .question-card.is-image-question{
      width:calc(var(--question-image-height) * 1.34) !important;
      height:var(--question-image-height) !important;
      min-width:calc(var(--question-image-height) * 1.34) !important;
      min-height:var(--question-image-height) !important;
      max-width:calc(var(--question-image-height) * 1.34) !important;
      max-height:var(--question-image-height) !important;
      aspect-ratio:auto !important;
      padding:clamp(5px,.48vw,8px) !important;
    }

    /*
      عند اجتماع سؤال صورة مع اختيارات صور:
      ننزل المجموعة ونترك مسافة واضحة بين السؤال والاختيارات.
    */
    .question-view.has-image-question.has-image-choices{
      transform:translateY(clamp(30px,4.5vh,50px)) !important;
    }

    .question-view.has-image-question .choices-grid.is-image-choices{
      margin-top:clamp(42px,6vh,68px) !important;
    }

    /*
      عند كون السؤال نصًا والاختيارات صورًا،
      تبقى شبكة الصور منخفضة وموزعة على المساحة المتاحة.
    */
    .question-view.has-image-choices:not(.has-image-question)
      .choices-grid.is-image-choices{
      margin-top:clamp(46px,6.5vh,74px) !important;

    /*
      الصور نفسها تستغل الإطار بالكامل مع الحفاظ على نسبتها.
    */
    .question-card.is-image-question .question-fit-zone,
    .choice-card.is-image-choice .choice-fit-zone{

      height:100% !important;
      max-width:none !important;
      max-height:none !important;
      margin:0 !important;
      padding:0 !important;
    }

    .question-card.is-image-question .question-image,
    .choice-card.is-image-choice .choice-image{
      display:block !important;
      width:100% !important;
      height:100% !important;
      max-width:100% !important;
      max-height:100% !important;
      margin:0 !important;
      padding:0 !important;
      object-fit:contain !important;
      object-position:center center !important;
    }

    /*
      الشاشات الأفقية القصيرة تحتاج أحجامًا كبيرة أيضًا،
      ولا نعيد الصور إلى الأحجام المجهرية القديمة.
    */
    @media (max-height:520px) and (orientation:landscape){
      .question-view.has-image-choices{
        transform:translateY(clamp(10px,2.5vh,20px)) !important;
      }

      .question-view.image-choice-count-2{

      }

      .question-view.image-choice-count-3{

      }

      .question-view.image-choice-count-4{

        --image-choice-gap:clamp(20px,2.2vw,34px);
      }

      .question-view.image-choice-count-5,

      }

      .question-view.has-image-question{

      }

      .question-view.has-image-question .choices-grid.is-image-choices{

      }

      .question-view.has-image-choices:not(.has-image-question)

        margin-top:clamp(24px,5.5vh,40px) !important;
      }
    }

    @media (orientation:portrait){
      .question-view.image-choice-count-2{
        --image-choice-size:clamp(132px,18vh,176px);
        --image-choice-gap:clamp(18px,3vw,28px);
      }

      .question-view.image-choice-count-3{
        --image-choice-size:clamp(104px,15vh,142px);
        --image-choice-gap:clamp(12px,2.4vw,20px);
      }

      .question-view.image-choice-count-4{

        --image-choice-gap:clamp(12px,2.4vw,20px);
      }

      .question-view.image-choice-count-5,
      .question-view.image-choice-count-6{
        --image-choice-size:clamp(86px,12vh,118px);
        --image-choice-gap:clamp(10px,2vw,16px);
      }

      .question-view.has-image-question{
        --question-image-height:clamp(170px,23vh,225px);
      }
    }

    @media (max-width:560px){
      .question-view.image-choice-count-2{

      .question-view.image-choice-count-3{
        --image-choice-size:clamp(84px,12.5vh,108px);

      }

      .question-view.image-choice-count-4{
        --image-choice-size:clamp(84px,12vh,108px);

      }

      .question-view.image-choice-count-5,
      .question-view.image-choice-count-6{
        --image-choice-size:clamp(68px,10vh,92px);
        --image-choice-gap:8px;
      }

      .question-view.has-image-question{
        --question-image-height:clamp(140px,20vh,186px);
      }

    /* v21: رفع مواضع السؤال والاختيارات فقط دون تغيير الأحجام. */

    /*
      سؤال نص + اختيارات صور:
      رفع المجموعة كاملة ليصبح مستطيل السؤال قريبًا من أعلى الشاشة
      كما هو محدد في الصورة المرجعية.
    */
    .question-view.has-image-choices:not(.has-image-question){
      transform:translateY(clamp(-145px,-14vh,-110px)) !important;
    }

    /*
      سؤال صورة + اختيارات صور:
      رفع السؤال وجميع مربعات الإجابات معًا،
      بحيث يبقى الصف السفلي أعلى زر الرجوع بمسافة آمنة بسيطة.
    */
    .question-view.has-image-question.has-image-choices{
      transform:translateY(clamp(-76px,-9vh,-58px)) !important;
    }

    @media (orientation:portrait){
      .question-view.has-image-choices:not(.has-image-question){
        transform:translateY(clamp(-82px,-9vh,-58px)) !important;
      }

      }

      .question-view.has-image-question.has-image-choices{
        transform:translateY(clamp(-42px,-9vh,-28px)) !important;
      }
    }


    /* v22: تظهر العلامة في المنتصف، تكبر سريعًا، ثم تستقر في زاوية الإجابة. */
    .answer-mark{
      --mark-corner-left:clamp(10px,1vw,18px);
      --mark-corner-top:clamp(9px,.9vw,16px);
      --mark-corner-scale:.38;
      will-change:left,top,transform,opacity;
      transform-origin:center center;
    }

    .choice-card.is-image-choice .answer-mark{
      --mark-corner-left:clamp(8px,.8vw,14px);
      --mark-corner-top:clamp(8px,.8vw,14px);
      --mark-corner-scale:.32;
    }

    .answer-mark.is-visible{
      animation:
        answerMarkRevealThenCorner
        1.34s
        linear
        both !important;
    }

    @keyframes answerMarkRevealThenCorner{
      0%{
        left:50%;
        top:50%;
        opacity:0;
        transform:
          translate(-50%,-50%)
          scale(.08)
          rotate(-18deg);
        animation-timing-function:
          cubic-bezier(.16,1,.3,1);
      }

      14%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(.48)
          rotate(-9deg);
      }

      32%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1.18)
          rotate(4deg);
      }

      44%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(0deg);
        animation-timing-function:
          cubic-bezier(.22,.72,.24,1);
      }

      60%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(0deg);
      }

      100%{
        left:var(--mark-corner-left);
        top:var(--mark-corner-top);
        opacity:1;
        transform:
          translate(0,0)
          scale(var(--mark-corner-scale))
          rotate(0deg);
      }
    }

    @media (max-width:560px){
      .answer-mark{
        --mark-corner-left:8px;
        --mark-corner-top:7px;
        --mark-corner-scale:.36;
      }

      .choice-card.is-image-choice .answer-mark{
        --mark-corner-left:6px;
        --mark-corner-top:6px;
        --mark-corner-scale:.30;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .answer-mark.is-visible{
        animation-duration:.01ms !important;
      }
    }


    /* v23: تثبيت العلامة على الزاوية العلوية اليسرى نفسها. */
    .choice-card.has-visible-mark{
      overflow:visible !important;
    }

    .answer-mark{
      --mark-corner-left:0px;
      --mark-corner-top:0px;
      --mark-corner-scale:.40;
    }

    .choice-card.is-image-choice .answer-mark{
      --mark-corner-left:0px;
      --mark-corner-top:0px;
      --mark-corner-scale:.36;
    }

    /*
      مركز العلامة يستقر فوق نقطة الزاوية نفسها؛
      لذلك يبقى جزء منها داخل المستطيل وجزء خارج المستطيل.
    */
    @keyframes answerMarkRevealThenCorner{
      0%{
        left:50%;
        top:50%;
        opacity:0;
        transform:
          translate(-50%,-50%)
          scale(.08)
          rotate(-18deg);
        animation-timing-function:
          cubic-bezier(.16,1,.3,1);
      }

      14%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(.48)
          rotate(-9deg);
      }

      32%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1.18)
          rotate(4deg);
      }

      44%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(0deg);
        animation-timing-function:
          cubic-bezier(.22,.72,.24,1);
      }

      60%{
        left:50%;
        top:50%;
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(0deg);
      }

      100%{
        left:var(--mark-corner-left);
        top:var(--mark-corner-top);
        opacity:1;
        transform:
          translate(-50%,-50%)
          scale(var(--mark-corner-scale))
          rotate(0deg);
      }
    }

    @media (max-width:560px){
      .answer-mark{
        --mark-corner-left:0px;
        --mark-corner-top:0px;
        --mark-corner-scale:.38;
      }

      .choice-card.is-image-choice .answer-mark{
        --mark-corner-left:0px;
        --mark-corner-top:0px;
        --mark-corner-scale:.34;
      }
    }


    /* v24: تباعد طبيعي وواضح بين سطور السؤال والإجابات. */
    .question-text{
      line-height:1.34 !important;
    }

    .choice-text{
      line-height:1.30 !important;
    }


    /* v25: تباعد أوضح وطبيعي بين السطور. */
    .question-text{
      line-height:1.46 !important;
    }

    .choice-text{
      line-height:1.38 !important;
    }

    /*
      المحدد الأساسي للأزرار أعلى أولوية من .next-btn و.previous-btn،
      لذلك نثبت الأبيض بالمحدد الكامل.
    */
    .right-controls .next-btn,
    .right-controls .previous-btn{
      color:#fff !important;
      -webkit-text-fill-color:#fff !important;
    }


    /* v26: وضع البطاقات يستخدم نفس حجم وشكل وتوزيع صفحة افتح الصندوق. */
    :root{
      --tile-size:150px;
      --tile-gap:24px;
    }

    .cards-view{
      overflow:hidden;
    }

    .question-grid.box-grid{
      width:max-content;
      height:max-content;
      max-width:100%;
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols,4),var(--tile-size));
      grid-auto-rows:var(--tile-size);
      justify-content:center;
      align-content:center;
      gap:var(--tile-gap);
      transform-origin:0 0;
      transform:translate3d(0,0,0) scale(1);
      will-change:transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout style;
      isolation:isolate;
      direction:ltr;
    }

    .box-card{
      --panel:#df3a64;
      --panel-light:#f06f8e;
      --panel-dark:#b91f49;
      --wall-tone:#ca6f84;
      --shadow:rgba(0,0,0,.17);
      --box-cover-text:#fff;
      position:relative;
      display:block;
      width:var(--tile-size);
      height:var(--tile-size);
      padding:0;
      margin:0;
      border:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      perspective:1200px;
      opacity:1;
      transform:translate3d(0,0,0) scale(1);
      will-change:transform,opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout paint style;
    }

    .box-card.focus-selected{ z-index:55; }
    .box-card.focus-away{ pointer-events:none; }
    .box-grid.motion-active .box-card{ pointer-events:none; }

    .box-wrap{
      position:relative;
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 6px 10px var(--shadow));
      transform:translateZ(0);
      transform-origin:center center;
    }

    .front-panel{
      position:absolute;
      inset:0;
      z-index:12;
      border-radius:clamp(11px,11%,20px);
      background:
        linear-gradient(180deg,rgba(255,255,255,.05),transparent 18%),
        linear-gradient(180deg,var(--panel) 0%,var(--panel) 48%,var(--panel-dark) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 0 1.4px rgba(0,0,0,.18),
        0 5px 8px rgba(0,0,0,.10);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin:50% 0%;
    }

    .front-panel::before{
      content:"";
      position:absolute;
      inset:6%;
      border-radius:calc(clamp(11px,11%,20px) * .78);
      border:2px solid rgba(255,255,255,.28);
      box-shadow:inset 0 0 18px rgba(255,255,255,.07);
      pointer-events:none;
    }

    .panel-number{
      position:relative;
      z-index:2;
      color:var(--box-cover-text,#fff);
      font-size:clamp(22px,calc(var(--tile-size) * .52),78px);
      line-height:1;
      font-weight:900;
      text-shadow:0 3px 8px rgba(0,0,0,.24);
      transition:opacity .24s ease,transform .24s ease;
      pointer-events:none;
    }

    .box-card.is-completed{
      filter:saturate(.34) brightness(.78);
      cursor:default;
      pointer-events:none;
    }

    .box-card.is-completed .panel-number{
      opacity:0;
      transform:scale(.65);
    }

    .box-card.box-vanished{
      opacity:0 !important;
      pointer-events:none !important;
    }

    .game-page.box-question-sequence .question-view.is-visible .question-card,
    .game-page.box-question-sequence .question-view.is-visible .choice-card,
    .game-page.box-return-sequence .question-view.is-visible .question-card,
    .game-page.box-return-sequence .question-view.is-visible .choice-card{
      animation:none !important;
    }

    /*

      توضع الملفات داخل مجلد sounds بجانب الصفحة.
    */
    let quizSoundEnabled = true;

    const choicesAudio = (()=>{
      const SOUND_FILES = {
        open: "sounds/open-box-open.mp3?v=1",
        go: "sounds/open-box-go.mp3?v=2",
        return: "sounds/open-box-return.mp3?v=2"
      };

      const VOLUMES = {
        open: 1,
        go: 1,
        return: 1
      };

      const START_OFFSETS = {
        open: 0,
        go: 0,
        return: 0
      };

      const cache = {};
      let enabled = true;

      function canPlay(){
        return enabled !== false && quizSoundEnabled !== false;
      }

      function getAudio(name){
        const src = SOUND_FILES[name];
        if (!src) return null;

        if (!cache[name]) {
          const audio = new Audio(src);
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = VOLUMES[name] ?? 1;
          cache[name] = audio;
        }

        return cache[name];
      }

      function stopAll(except = null){
        Object.values(cache).forEach((audio)=>{
          if (!audio || audio === except) return;
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch (_) {}
        });
      }

      function playNamed(name){
        if (!canPlay()) return false;

        const audio = getAudio(name);
        if (!audio) return false;

        try {
          stopAll(audio);
          audio.pause();

          const startOffset = START_OFFSETS[name] ?? 0;
          try {
            if (typeof audio.fastSeek === "function" && startOffset > 0) {
              audio.fastSeek(startOffset);
            } else {
              audio.currentTime = startOffset;
            }
          } catch (_) {
            try { audio.currentTime = 0; } catch (_) {}
          }

          audio.volume = VOLUMES[name] ?? 1;
          audio.playbackRate = 1;

          const promise = audio.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(()=>{});
          }

          return true;
        } catch (_) {
          return false;
        }
      }

      function preload(){
        Object.keys(SOUND_FILES).forEach((name)=>{
          const audio = getAudio(name);
          try { audio?.load?.(); } catch (_) {}
        });
      }

      function unlock(){
        preload();
      }

      function setEnabled(value){
        enabled = value !== false;
        if (!enabled) stopAll();
      }

      return {
        unlock,
        preload,
        setEnabled,
        stopAll,
        playOpen: ()=> playNamed("open"),
        playGo: ()=> playNamed("go"),
        playReturn: ()=> playNamed("return")
      };

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();

      if (["white","classic","original","theme-white","أبيض","ابيض"].includes(raw)) {
        return "white";
      }
      if ([
        "classroom","school","theme-classroom","فصل","فصل مدرسي","المدرسة"
      ].includes(raw)) return "classroom";
      if ([
        "sky","clouds","sky-clouds","theme-sky-clouds","سماء","سماء وغيوم"
      ].includes(raw)) return "sky-clouds";
      if (["forest","theme-forest","غابة","الغابة"].includes(raw)) return "forest";

      if (["english","theme-english","انجليزي","إنجليزي"].includes(raw)) return "english";
      if (["flowers","theme-flowers","ازهار","أزهار","ورود","ازهار وورود"].includes(raw)) {

        return "national-day";
      }
      if (["founding-day","theme-founding-day","يوم التأسيس","التأسيس"].includes(raw)) {
        return "founding-day";
      }

      return "classroom";
    }

    function normalizeType(value, allowed, fallback){
      const raw = String(value || "").trim().toLowerCase();
      return allowed.includes(raw) ? raw : fallback;
    }

    function normalizeSoundEnabled(data){
      if (!data || typeof data !== "object") return true;
      if (data.soundEnabled === false) return false;
      if (
        data.sounds &&
        typeof data.sounds === "object" &&
        data.sounds.enabled === false
      ) return false;
      return true;
    }

    function normalizeDisplayMode(payload){
      const explicit = String(
        payload?.displayMode ||
        payload?.questionsDisplay ||
        payload?.questionDisplay ||
        ""
      ).trim().toLowerCase();

      if (["cards","card","boxes","grid"].includes(explicit)) return "cards";
      if (["direct","immediate","plain"].includes(explicit)) return "direct";

      if (
        payload?.questionsInCards === false ||
        payload?.useQuestionCards === false ||
        payload?.showQuestionCards === false
      ) return "direct";

      return "cards";
    }

    function normalizeCoverType(payload){
      const raw = String(
        payload?.coverType ||
        payload?.boxCoverType ||
        payload?.questionCoverType ||
        "english-numbers"
      ).trim().toLowerCase();

      if (["arabic-numbers","arabic","arabic-digits"].includes(raw)) return "arabic-numbers";
      if (["images","image","pictures"].includes(raw)) return "images";
      if (["text","texts","words"].includes(raw)) return "text";
      return "english-numbers";
    }

    function cleanQuestions(payload){
      const source = Array.isArray(payload)
        ? payload
        : (
          payload?.questions ||
          payload?.entries ||
          payload?.items ||
          []
        );

      const globalQuestionType = normalizeType(
        payload?.questionType,
        ["text","image","images"],
        ""
      );
      const globalChoicesType = normalizeType(
        payload?.choicesType || payload?.answersType,
        ["text","image","images"],
        ""
      );

      return source
        .map((entry)=>{
          const rawChoices = Array.isArray(entry?.choices)
            ? entry.choices
            : Array.isArray(entry?.answers)
              ? entry.answers
              : [];

          let questionType = normalizeType(
            entry?.questionType || globalQuestionType,
            ["text","image","images"],
            ""
          );
          if (questionType === "images") questionType = "image";

          const questionText = String(
            entry?.questionText ||
            entry?.text ||
            entry?.question ||
            ""
          ).trim();

          const questionImageData =
            entry?.questionImageData ||
            entry?.questionImage ||
            entry?.imageData ||
            entry?.image ||
            "";

          if (!questionType) {
            questionType = questionImageData ? "image" : "text";
          }

          let choicesType = normalizeType(
            entry?.choicesType ||
            entry?.answersType ||
            globalChoicesType,
            ["text","image","images"],
            ""
          );
          if (choicesType === "image") choicesType = "images";

          const choices = rawChoices
            .map((choice)=>{
              if (typeof choice === "string") {
                return {
                  text:choice.trim(),
                  imageData:"",
                  imageName:"",
                  isCorrect:false
                };
              }

              return {
                text:String(
                  choice?.text ||
                  choice?.title ||
                  choice?.answer ||
                  ""
                ).trim(),
                imageData:
                  choice?.imageData ||
                  choice?.image ||
                  "",
                imageName:choice?.imageName || "",
                isCorrect:Boolean(choice?.isCorrect || choice?.correct)
              };
            })
            .filter((choice)=> choice.text || choice.imageData)
            .slice(0,MAX_CHOICES);

          if (!choicesType) {
            choicesType = choices.some((choice)=> choice.imageData)
              ? "images"
              : "text";
          }

          let correctChoiceIndex = Number(
            entry?.correctChoiceIndex ??
            entry?.correctIndex ??
            entry?.answerIndex ??
            -1
          );

          if (!Number.isInteger(correctChoiceIndex) || correctChoiceIndex < 0) {
            correctChoiceIndex = choices.findIndex((choice)=> choice.isCorrect);
          }

          if (correctChoiceIndex < 0 || correctChoiceIndex >= choices.length) {
            correctChoiceIndex = 0;
          }

          const clean = {
            coverText:String(entry?.coverText || entry?.boxCoverText || "").trim(),
            coverImageData:entry?.coverImageData || entry?.boxCoverImageData || "",
            coverImageName:entry?.coverImageName || entry?.boxCoverImageName || "",
            questionType,
            questionText,
            questionImageData,
            choicesType,
            choices,
            correctChoiceIndex
          };

          if (questionType === "text") {
            clean.questionImageData = "";
          } else {
            clean.questionText = "";
          }

          clean.choices = clean.choices.map((choice)=>{
            if (choicesType === "text") {
              return { ...choice, imageData:"", imageName:"" };
            }
            return { ...choice, text:"" };
          });

          return clean;
        })
        .filter((entry)=>
          entry.choices.length >= MIN_CHOICES &&
          (
            (entry.questionType === "text" && entry.questionText) ||
            (entry.questionType === "image" && entry.questionImageData)
          )
        )
        .slice(0,MAX_QUESTIONS);
    }

    function openEduGamesDb(){
      return new Promise((resolve,reject)=>{
        const request = indexedDB.open("sandooq_edu_games_v1",1);

        request.onupgradeneeded = ()=>{
          const db = request.result;
          if (!db.objectStoreNames.contains("payloads")) {
            db.createObjectStore("payloads",{ keyPath:"key" });
          }
        };

        request.onsuccess = ()=> resolve(request.result);
        request.onerror = ()=> reject(request.error || new Error("indexedDB failed"));
      });
    }

    async function readPayloadFromIndexedDB(key){
      const db = await openEduGamesDb();

      return new Promise((resolve,reject)=>{
        const tx = db.transaction("payloads","readonly");
        const request = tx.objectStore("payloads").get(key);

        request.onsuccess = ()=> resolve(request.result ? request.result.payload : null);
        request.onerror = ()=> reject(request.error || new Error("payload read failed"));
      });
    }

    function applyPayload(payload){
      const clean = cleanQuestions(payload);
      if (!clean.length) return false;

      questions = clean;
      currentTheme = normalizeTheme(payload?.theme || currentTheme);
      displayMode = normalizeDisplayMode(payload || {});
      coverType = normalizeCoverType(payload || {});
      quizSoundEnabled = normalizeSoundEnabled(payload);
      choicesAudio.setEnabled(quizSoundEnabled);
      document.title = String(payload?.gameName || "الاختيارات") + " - صندوق الألعاب التعليمية";
      return true;
    }

    async function hydratePayload(){
      const payloadId = getUrlParam("payloadId");

      if (payloadId) {
        try {
          const indexedPayload = await readPayloadFromIndexedDB(`quiz:${payloadId}`);
          if (indexedPayload && applyPayload(indexedPayload)) return true;
        } catch (_) {}

        try {
          const raw = sessionStorage.getItem(`sandooq_quiz_payload_v1_${payloadId}`);
          if (raw && applyPayload(JSON.parse(raw))) return true;
        } catch (_) {}
      }

      const keys = [
        "sandooq_quiz_payload_v1",
        "sandooq_quiz_draft_v2",
        "sandooq_quiz_draft_v1"
      ];

      for (const key of keys) {
        try {
          const raw = sessionStorage.getItem(key);
          if (raw && applyPayload(JSON.parse(raw))) return true;
        } catch (_) {}
      }

      questions = DEMO_QUESTIONS.map((item)=>({
        ...item,
        choices:item.choices.map((choice)=>({ ...choice }))
      }));
      currentTheme = normalizeTheme(getUrlParam("theme") || "classroom");
      displayMode = getUrlParam("mode") === "cards" ? "cards" : "direct";
      quizSoundEnabled = true;
      choicesAudio.setEnabled(true);
      return false;
    }

    function applyTheme(){
      THEMES.forEach((theme)=> page.classList.remove(`theme-${theme}`));
      page.classList.add(`theme-${currentTheme}`);
    }

    function getVisualViewportMetrics(){
      const viewport = window.visualViewport;
      const layoutWidth = Math.max(
        280,
        document.documentElement.clientWidth || 0,
        window.innerWidth || 0
      );
      const layoutHeight = Math.max(
        260,
        page?.clientHeight || 0,
        document.documentElement.clientHeight || 0,
        window.innerHeight || 0
      );

      const width = Math.max(
        280,
        Math.min(
          layoutWidth,
          Number(viewport?.width) || layoutWidth
        )
      );

      const height = Math.max(
        260,
        Math.min(
          layoutHeight,
          Number(viewport?.height) || layoutHeight
        )
      );

      return {
        width,
        height,
        offsetLeft:Math.max(
          0,
          Number(viewport?.offsetLeft) || 0
        ),
        scale:Math.max(
          1,
          Number(viewport?.scale) || 1
        )
      };
    }

    function syncVisualViewportFrame(force = false){
      if (
        displayMode === "cards" &&
        cardsIntroLayoutFrozen &&
        !force
      ) {
        cardsPendingViewportLayout = true;
        return false;
      }

      const metrics = getVisualViewportMetrics();

      /*
        مطابق لصفحة افتح الصندوق:
        نضع المسرح داخل المساحة المرئية الحقيقية في Safari.
      */
      stage.style.left =
        `${metrics.offsetLeft.toFixed(2)}px`;
      stage.style.right = "auto";
      stage.style.top = "0px";
      stage.style.bottom = "auto";
      stage.style.width =
        `${metrics.width.toFixed(2)}px`;
      stage.style.height =
        `${metrics.height.toFixed(2)}px`;

      page.style.setProperty(
        "--visual-viewport-width",
        `${metrics.width}px`
      );
      page.style.setProperty(
        "--visual-viewport-height",
        `${metrics.height}px`
      );

      return true;
    }

    function collapseSafariBars(options = {}){
      const refresh = options.refresh !== false;

      safariTimers.forEach((timer)=> clearTimeout(timer));
      safariTimers = [];

      [0,80,220,520,900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80,left:0,behavior:"auto" });
          } catch (_) {
            window.scrollTo(0,80);
          }

          if (
            refresh &&
            !cardsIntroLayoutFrozen
          ) {
            scheduleLayout();
          } else if (refresh) {
            cardsPendingViewportLayout = true;
          }
        },delay));
      });
    }
