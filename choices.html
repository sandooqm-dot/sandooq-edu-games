    function calculateDeckLayout(options = {}){
      const force = options.force === true;

      if (
        displayMode === "cards" &&
        cardsIntroLayoutFrozen &&
        !force
      ) {
        cardsPendingViewportLayout = true;
        return false;
      }

      const metrics = getVisualViewportMetrics();
      const styles = window.getComputedStyle(stage);

      const padX =
        parseFloat(styles.paddingLeft || "0") +
        parseFloat(styles.paddingRight || "0");

      const padY =
        parseFloat(styles.paddingTop || "0") +
        parseFloat(styles.paddingBottom || "0");

      /*
        مطابق لصفحة افتح الصندوق:
        clientWidth وclientHeight لا يتأثران بزوم الخلفية.
      */
      const stageWidth = Math.max(
        280,
        Math.min(
          stage.clientWidth || metrics.width,
          metrics.width
        )
      );

      const stageHeight = Math.max(
        260,
        Math.min(
          stage.clientHeight || metrics.height,
          metrics.height
        )
      );

      const width =
        Math.max(220,stageWidth - padX - 4);
      const height =
        Math.max(190,stageHeight - padY - 4);

      const total = Math.max(
        1,
        Math.min(
          MAX_QUESTIONS,
          questions.length || 1
        )
      );

      const isPortrait = height > width;
      const maxCols =
        Math.min(total,isPortrait ? 5 : 10);
      const minCols =
        isPortrait
          ? Math.min(total,2)
          : Math.min(total,2);

      const baseGap =
        total > 24
          ? 7
          : total > 16
            ? 9
            : total > 10
              ? 12
              : 20;

      const maxTile =
        total > 24
          ? 112
          : total > 16
            ? 124
            : total > 10
              ? 138
              : 152;

      let best = null;

      for (
        let cols=Math.max(1,minCols);
        cols<=maxCols;
        cols+=1
      ) {
        const rows = Math.ceil(total / cols);
        const gap = baseGap;

        const tileByWidth = Math.floor(
          (width - gap * (cols - 1)) / cols
        );

        const tileByHeight = Math.floor(
          (height - gap * (rows - 1)) / rows
        );

        const size = Math.min(
          maxTile,
          tileByWidth,
          tileByHeight
        );

        if (size <= 0) continue;

        const gridWidth =
          cols * size +
          gap * Math.max(0,cols - 1);

        const gridHeight =
          rows * size +
          gap * Math.max(0,rows - 1);

        const unusedSlots =
          cols * rows - total;

        const aspectPenalty =
          Math.abs(
            cols / rows -
            width / Math.max(1,height)
          ) * 3;

        const rowBalance =
          Math.abs(
            rows -
            Math.ceil(Math.sqrt(total))
          ) * 2;

        const edgePenalty =
          Math.max(0,gridWidth - width) * 100 +
          Math.max(0,gridHeight - height) * 100;

        const score =
          size * 100 -
          unusedSlots * 7 -
          aspectPenalty -
          rowBalance -
          edgePenalty;

        if (!best || score > best.score) {
          best = {
            cols,
            rows,
            gap,
            size,
            gridWidth,
            gridHeight,
            score
          };
        }
      }

      if (!best) {
        const cols =
          isPortrait
            ? Math.min(total,3)
            : Math.min(total,8);

        const rows =
          Math.ceil(total / Math.max(1,cols));

        const gap = 6;

        const size = Math.max(
          34,
          Math.min(
            maxTile,
            Math.floor(
              (
                width -
                gap * Math.max(0,cols - 1)
              ) / Math.max(1,cols)
            ),
            Math.floor(
              (
                height -
                gap * Math.max(0,rows - 1)
              ) / Math.max(1,rows)
            )
          )
        );

        best = {
          cols:Math.max(1,cols),
          rows,
          gap,
          size,
          gridWidth:
            Math.max(1,cols) * size +
            gap * Math.max(0,cols - 1),
          gridHeight:
            rows * size +
            gap * Math.max(0,rows - 1)
        };
      }

      const gap = Math.max(5,best.gap);
      const size = Math.max(34,best.size);

      questionGrid.style.setProperty(
        "--cols",
        String(best.cols)
      );
      questionGrid.style.setProperty(
        "--tile-gap",
        `${gap}px`
      );
      questionGrid.style.setProperty(
        "--tile-size",
        `${size}px`
      );
      questionGrid.style.width =
        `${best.gridWidth}px`;
      questionGrid.style.height =
        `${best.gridHeight}px`;

      document.documentElement.style.setProperty(
        "--tile-gap",
        `${gap}px`
      );
      document.documentElement.style.setProperty(
        "--tile-size",
        `${size}px`
      );

      /*
        لا نعيد حساب موضع الصندوق المختار أثناء الحركة.
      */
      if (
        questionBoxSelected &&
        questionBoxFocusedIndex >= 0 &&
        !interactionLocked &&
        !questionGrid.classList.contains(
          "motion-active"
        )
      ) {
        requestAnimationFrame(()=>{
          const target =
            getQuestionBoxZoomTarget(
              questionBoxSelected
            );

          setQuestionBoxGridState(
            target.scale,
            target.x,
            target.y
          );
        });
      }

      cardsPendingViewportLayout = false;
      requestAnimationFrame(fitAllDeckCoverText);
      return true;
    }

    function toArabicIndicNumber(value){
      return String(value).replace(/\d/g,(digit)=> "٠١٢٣٤٥٦٧٨٩"[Number(digit)]);
    }

    function fitDeckCoverText(element){
      if (!element) return;
      const panel = element.closest(".front-panel");
      if (!panel) return;

      const availableWidth = Math.max(20,element.clientWidth || panel.clientWidth * .86);
      const availableHeight = Math.max(20,panel.clientHeight * .72);
      const tile = Math.max(40,panel.clientWidth || 100);
      const minFont = Math.max(10,Math.min(16,tile * .10));
      const maxFont = Math.max(minFont,Math.min(46,tile * .30));

      element.style.fontSize = `${maxFont}px`;
      let low = minFont;
      let high = maxFont;
      let best = minFont;

      for (let i=0;i<24;i+=1) {
        const mid = (low + high) / 2;
        element.style.fontSize = `${mid}px`;
        const fits =
          element.scrollWidth <= availableWidth + 1 &&
          element.scrollHeight <= availableHeight + 1;
        if (fits) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      element.style.fontSize = `${Math.floor(best * 10) / 10}px`;
    }

    function fitAllDeckCoverText(){
      questionGrid.querySelectorAll(".cover-text").forEach(fitDeckCoverText);
    }

    function setDeckCoverContent(button,index,isCompleted = false){
      const panel = button?.querySelector(".front-panel");
      if (!panel) return;
      panel.textContent = "";
      if (isCompleted) return;

      const question = questions[index] || {};

      if (coverType === "images" && question.coverImageData) {
        const image = document.createElement("img");
        image.className = "cover-image";
        image.alt = "";
        image.src = question.coverImageData;
        panel.appendChild(image);
        return;
      }

      if (coverType === "text" && String(question.coverText || "").trim()) {
        const coverText = document.createElement("span");
        coverText.className = "cover-text";
        coverText.textContent = String(question.coverText || "").trim();
        panel.appendChild(coverText);
        return;
      }

      const number = document.createElement("span");
      number.className = "panel-number";
      number.textContent = coverType === "arabic-numbers"
        ? toArabicIndicNumber(index + 1)
        : String(index + 1);
      panel.appendChild(number);
    }

    function renderDeck(){
      questionGrid.textContent = "";

      questions.forEach((_,index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "box-card";
        button.dataset.index = String(index);
        button.setAttribute("aria-label",`صندوق السؤال ${index + 1}`);
        applyQuestionBoxPalette(button,index);

        const wrap = document.createElement("span");
        wrap.className = "box-wrap";

        const panel = document.createElement("span");
        panel.className = "front-panel";

        wrap.appendChild(panel);
        button.appendChild(wrap);
        setDeckCoverContent(button,index,completed.has(index));

        if (completed.has(index)) {
          button.classList.add("is-completed");
          button.disabled = true;
          button.setAttribute("aria-disabled","true");
        }

        button.addEventListener("click",(event)=>{
          event.preventDefault();
          event.stopPropagation();
          if (button.classList.contains("is-completed")) return;
          openQuestionFromCard(index,button);
        });

        questionGrid.appendChild(button);
      });

      calculateDeckLayout({ force:true });
      setQuestionBoxGridState(1,0,0);
      requestAnimationFrame(fitAllDeckCoverText);
    }

    function choiceColumns(count){
      if (count === 6) return 3;
      return 2;
    }

    function fitTextInsidePanel(el,options = {}){
      if (!el) return;

      const zone = el.closest(".question-fit-zone, .choice-fit-zone");
      if (!zone) return;

      const zoneWidth = Math.max(0,zone.clientWidth);
      const zoneHeight = Math.max(0,zone.clientHeight);
      if (zoneWidth < 2 || zoneHeight < 2) return;

      const availableWidth = Math.max(1,zoneWidth - 4);
      const availableHeight = Math.max(1,zoneHeight - 4);
      const minFont = Math.max(12,Number(options.minFont) || 12);
      const maxFont = Math.max(minFont,Number(options.maxFont) || minFont);
      const lineHeight = String(options.lineHeight || "1.15");

      el.style.display = "block";
      el.style.flex = "0 0 auto";
      el.style.alignSelf = "center";
      el.style.minWidth = "0";
      el.style.minHeight = "0";
      el.style.width = "100%";
      el.style.maxWidth = "100%";
      el.style.height = "auto";
      el.style.maxHeight = "none";
      el.style.margin = "0";
      el.style.padding = "0";
      el.style.lineHeight = lineHeight;
      el.style.whiteSpace = "normal";
      el.style.wordBreak = "normal";
      el.style.overflowWrap = "break-word";
      el.style.setProperty("text-wrap","wrap");
      el.style.overflow = "visible";

      let low = minFont;
      let high = maxFont;
      let best = minFont;

      for (let i=0; i<28; i+=1) {
        const mid = (low + high) / 2;
        el.style.setProperty("--fit-font-size",`${mid}px`);
        el.style.setProperty("font-size",`${mid}px`,"important");
        const rect = el.getBoundingClientRect();
        const fitsWidth = el.scrollWidth <= availableWidth + 1 && rect.width <= availableWidth + 1;
        const fitsHeight = el.scrollHeight <= availableHeight + 1 && rect.height <= availableHeight + 1;
        if (fitsWidth && fitsHeight) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      const finalSize = Math.max(minFont,Math.floor(best * 10) / 10);
      el.style.setProperty("--fit-font-size",`${finalSize}px`);
      el.style.setProperty("font-size",`${finalSize}px`,"important");
    }

    function fitCurrentSceneText(){
      const run = ()=>{
        const qText = questionCard.querySelector(".question-text");
        if (qText) {
          const zone = qText.closest(".question-fit-zone");
          const zoneHeight = zone?.clientHeight || questionCard.clientHeight;
          fitTextInsidePanel(qText,{
            minFont:18,
            maxFont:Math.min(64,Math.max(34,zoneHeight * .58)),
            lineHeight:"1.46"
          });
        }

        choicesGrid.querySelectorAll(".choice-text").forEach((el)=>{
          const zone = el.closest(".choice-fit-zone");
          const zoneHeight = zone?.clientHeight || 90;
          fitTextInsidePanel(el,{
            minFont:16,
            maxFont:Math.min(50,Math.max(28,zoneHeight * .56)),
            lineHeight:"1.38"
          });
        });
      };

      requestAnimationFrame(()=> requestAnimationFrame(run));
      setTimeout(run,80);
      setTimeout(run,240);
      setTimeout(run,620);
      if (document.fonts?.ready) document.fonts.ready.then(run).catch(()=>{});
    }

    function closeQuestionImageZoom(){
      if (!questionImageZoomOpen) return;
      questionImageZoomOpen = false;
      page.classList.remove("question-image-zoom-open");
      questionImageOverlay.hidden = true;
      questionImageOverlayImg.removeAttribute("src");
    }

    function openQuestionImageZoom(src){
      const safeSrc = String(src || "").trim();
      if (!safeSrc || interactionLocked) return;
      questionImageZoomOpen = true;
      questionImageOverlayImg.src = safeSrc;
      questionImageOverlay.hidden = false;
      page.classList.add("question-image-zoom-open");
    }

    function toggleQuestionImageZoom(src){
      if (questionImageZoomOpen) {
        closeQuestionImageZoom();
        return;
      }
      openQuestionImageZoom(src);
    }

    function renderQuestion(index){
      const item = questions[index];
      if (!item) return;

      activeQuestionIndex = index;
      directQuestionIndex = index;
      answerLocked = false;
      closeQuestionImageZoom();

      const isImageQuestion = item.questionType === "image";
      const hasImageChoices = item.choicesType === "images";

      questionView.classList.remove(
        "is-answered","has-two-choices","has-image-question","has-image-choices",
        "image-choice-count-2","image-choice-count-3","image-choice-count-4",
        "image-choice-count-5","image-choice-count-6"
      );
      questionView.classList.toggle("has-two-choices",!hasImageChoices && item.choices.length === 2);
      questionView.classList.toggle("has-image-question",isImageQuestion);
      questionView.classList.toggle("has-image-choices",hasImageChoices);
      if (hasImageChoices) questionView.classList.add(`image-choice-count-${item.choices.length}`);

      questionCard.textContent = "";
      questionCard.classList.remove("is-long","is-very-long","is-image-question");
      questionCard.classList.toggle("is-image-question",isImageQuestion);
      questionCard.style.removeProperty("animation");
      questionCard.style.removeProperty("transform");
      questionCard.style.removeProperty("opacity");
      questionCard.style.removeProperty("will-change");

      choicesGrid.textContent = "";
      choicesGrid.classList.remove(
        "is-image-choices","choice-count-2","choice-count-3","choice-count-4","choice-count-5","choice-count-6"
      );
      choicesGrid.classList.toggle("is-image-choices",hasImageChoices);
      choicesGrid.classList.toggle(
        "has-centered-last-choice",
        !hasImageChoices && (item.choices.length === 3 || item.choices.length === 5)
      );
      if (hasImageChoices) choicesGrid.classList.add(`choice-count-${item.choices.length}`);

      applyQuestionPanelColor(questionCard);

      if (item.questionType === "text") {
        const questionLength = String(item.questionText || "").trim().length;
        questionCard.classList.toggle("is-long",questionLength > 72 && questionLength <= 135);
        questionCard.classList.toggle("is-very-long",questionLength > 135);
      }

      if (item.questionType === "image") {
        const mediaZone = document.createElement("div");
        mediaZone.className = "question-fit-zone question-media-zone question-image-trigger";
        mediaZone.setAttribute("role","button");
        mediaZone.setAttribute("tabindex","0");
        mediaZone.setAttribute("aria-label","تكبير صورة السؤال");

        const image = document.createElement("img");
        image.className = "question-image";
        image.alt = "صورة السؤال";
        image.src = item.questionImageData;
        image.draggable = false;
        image.addEventListener("load",()=> requestAnimationFrame(fitCurrentSceneText),{ once:true });

        const toggleZoom = (event)=>{
          event.preventDefault();
          event.stopPropagation();
          toggleQuestionImageZoom(image.currentSrc || image.src);
        };
        mediaZone.addEventListener("click",toggleZoom);
        mediaZone.addEventListener("keydown",(event)=>{
          if (event.key === "Enter" || event.key === " ") toggleZoom(event);
        });
        mediaZone.appendChild(image);
        questionCard.appendChild(mediaZone);
      } else {
        const fitZone = document.createElement("div");
        fitZone.className = "question-fit-zone";
        const text = document.createElement("div");
        text.className = "question-text";
        text.dataset.fitText = "question";
        text.textContent = item.questionText;
        fitZone.appendChild(text);
        questionCard.appendChild(fitZone);
      }

      choicesGrid.style.setProperty("--choice-cols",String(choiceColumns(item.choices.length)));
      item.choices.forEach((choice,choiceIndex)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-card";
        button.classList.toggle("is-image-choice",item.choicesType === "images");
        button.style.setProperty("--choice-order",String(choiceIndex));
        button.setAttribute("aria-label",`الاختيار ${choiceIndex + 1}`);
        applyChoicePanelColor(button,choiceIndex);

        if (item.choicesType === "images") {
          const mediaZone = document.createElement("span");
          mediaZone.className = "choice-fit-zone choice-media-zone";
          const image = document.createElement("img");
          image.className = "choice-image";
          image.alt = `الاختيار ${choiceIndex + 1}`;
          image.src = choice.imageData;
          image.addEventListener("load",()=> requestAnimationFrame(fitCurrentSceneText),{ once:true });
          mediaZone.appendChild(image);
          button.appendChild(mediaZone);
        } else {
          const fitZone = document.createElement("span");
          fitZone.className = "choice-fit-zone";
          const text = document.createElement("span");
          text.className = "choice-text";
          text.dataset.fitText = "choice";
          text.textContent = choice.text;
          fitZone.appendChild(text);
          button.appendChild(fitZone);
        }

        const mark = document.createElement("span");
        mark.className = "answer-mark";
        button.appendChild(mark);
        button.addEventListener("click",(event)=>{
          event.preventDefault();
          event.stopPropagation();
          chooseAnswer(button,choiceIndex);
        });
        choicesGrid.appendChild(button);
      });

      questionView.classList.add("is-visible");
      updateNavigationButtons();
      fitCurrentSceneText();
    }

    function showMark(card,type){
      const mark = card.querySelector(".answer-mark");
      if (!mark) return;
      card.classList.add("has-visible-mark");
      mark.className = `answer-mark ${type === "correct" ? "is-correct" : "is-wrong"}`;
      mark.textContent = type === "correct" ? "✓" : "×";
      requestAnimationFrame(()=> mark.classList.add("is-visible"));
    }

    function chooseAnswer(card,choiceIndex){
      if (questionImageZoomOpen) return;
      if (answerLocked || interactionLocked) return;
      if (card.classList.contains("is-disabled")) return;
      const item = questions[activeQuestionIndex];
      if (!item) return;

      if (choiceIndex === item.correctChoiceIndex) {
        choicesAudio.unlock();
        choicesAudio.playOpen();
        answerLocked = true;
        if (displayMode !== "cards") completed.add(activeQuestionIndex);
        showMark(card,"correct");
        choicesGrid.querySelectorAll(".choice-card").forEach((choiceCard)=>{
          choiceCard.classList.add("is-disabled");
          choiceCard.disabled = true;
        });
        questionView.classList.add("is-answered");
        return;
      }

      card.classList.add("is-disabled","is-wrong");
      card.disabled = true;
      showMark(card,"wrong");
      setTimeout(()=> card.classList.remove("is-wrong"),480);
    }

    function makeQuestionBoxGridTransform(scale,x,y){
      return `translate3d(${x.toFixed(3)}px,${y.toFixed(3)}px,0) scale(${scale.toFixed(6)})`;
    }

    function setQuestionBoxGridState(scale,x,y){
      questionBoxGridState = { scale,x,y };
      questionGrid.style.transform = makeQuestionBoxGridTransform(scale,x,y);
    }

    function cancelQuestionBoxZoom(){
      if (questionBoxZoomFrame) {
        cancelAnimationFrame(questionBoxZoomFrame);
        questionBoxZoomFrame = null;
      }
      if (questionBoxZoomAnimation) {
        try { questionBoxZoomAnimation.cancel(); } catch (_) {}
        questionBoxZoomAnimation = null;
      }
    }

    function animateQuestionBoxGrid(target,duration){
      cancelQuestionBoxZoom();
      const start = { ...questionBoxGridState };
      const end = {
        scale:Math.max(1,Number(target.scale) || 1),
        x:Number(target.x) || 0,
        y:Number(target.y) || 0
      };
      const startTransform = makeQuestionBoxGridTransform(start.scale,start.x,start.y);
      const endTransform = makeQuestionBoxGridTransform(end.scale,end.x,end.y);

      if (typeof questionGrid.animate === "function") {
        questionBoxZoomAnimation = questionGrid.animate(
          [{ transform:startTransform },{ transform:endTransform }],
          { duration,easing:BOX_MOTION_EASING,fill:"forwards" }
        );
        return questionBoxZoomAnimation.finished.catch(()=>{}).then(()=>{
          questionGrid.style.transform = endTransform;
          try { questionBoxZoomAnimation?.cancel(); } catch (_) {}
          questionBoxZoomAnimation = null;
          questionBoxGridState = end;
        });
      }

      const startTime = performance.now();
      return new Promise((resolve)=>{
        const frame = (now)=>{
          const p = Math.min(1,(now - startTime) / duration);
          const e = easeInOutSine(p);
          setQuestionBoxGridState(
            start.scale + (end.scale - start.scale) * e,
            start.x + (end.x - start.x) * e,
            start.y + (end.y - start.y) * e
          );
          if (p < 1) questionBoxZoomFrame = requestAnimationFrame(frame);
          else { questionBoxZoomFrame = null; resolve(); }
        };
        questionBoxZoomFrame = requestAnimationFrame(frame);
      });
    }

    function getQuestionBoxZoomTarget(button){
      const stageW = Math.max(1,stage.clientWidth || innerWidth);
      const stageH = Math.max(1,stage.clientHeight || innerHeight);
      const isLandscape = innerWidth > innerHeight;
      const tile = Math.max(1,button.offsetWidth || 150);
      const desiredTile = isLandscape
        ? Math.min(stageW * .34,stageH * .58,tile * 2.18)
        : Math.min(stageW * .72,stageH * .42,tile * 2.24);
      const scale = Math.min(isLandscape ? 2.18 : 2.24,Math.max(1.38,desiredTile / tile));
      const localCenterX = button.offsetLeft + button.offsetWidth / 2;
      const localCenterY = button.offsetTop + button.offsetHeight / 2;
      const focusX = stageW * .50;
      const focusY = stageH * (isLandscape ? .50 : .53);
      return {
        scale,
        x:focusX - questionGrid.offsetLeft - localCenterX * scale,
        y:focusY - questionGrid.offsetTop - localCenterY * scale
      };
    }

    function cancelQuestionBoxScatterAnimations(){
      questionBoxScatterAnimations.forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });
      questionBoxScatterAnimations.clear();
    }

    function prepareCardsIntroScatterTargets(){
      cancelQuestionBoxScatterAnimations();
      questionBoxScatterTargets.clear();

      const cards = Array.from(
        questionGrid.querySelectorAll(
          ".box-card"
        )
      );

      if (!cards.length) return cards;

      /*
        نفس هندسة مقدمة افتح الصندوق:
        كل صندوق يبدأ خارج المشهد بحسب موقعه من مركز الشبكة.
      */
      const stageWidth =
        stage.clientWidth ||
        window.innerWidth ||
        1;

      const stageHeight =
        stage.clientHeight ||
        window.innerHeight ||
        1;

      const gridCenterX =
        questionGrid.clientWidth / 2;

      const gridCenterY =
        questionGrid.clientHeight / 2;

      const tile =
        cards[0].offsetWidth || 1;

      const travel =
        Math.max(stageWidth,stageHeight) * .78 +
        tile * 1.6;

      const geometry = cards.map(
        (card,cardIndex)=>({
          card,
          cardIndex,
          centerX:
            card.offsetLeft +
            card.offsetWidth / 2,
          centerY:
            card.offsetTop +
            card.offsetHeight / 2
        })
      );

      geometry.forEach(
        ({
          card,
          cardIndex,
          centerX,
          centerY
        })=>{
          let dx = centerX - gridCenterX;
          let dy = centerY - gridCenterY;
          let length = Math.hypot(dx,dy);

          if (length < 1) {
            const angle =
              (
                (cardIndex + 1) *
                2.399963229728653
              ) % (Math.PI * 2);

            dx = Math.cos(angle);
            dy = Math.sin(angle);
            length = 1;
          }

          const unitX = dx / length;
          const unitY = dy / length;
          const extra =
            (cardIndex % 4) * tile * .10;
          const distance =
            travel + extra;

          const target = {
            transform:
              `translate3d(` +
              `${(unitX * distance).toFixed(2)}px,` +
              `${(unitY * distance).toFixed(2)}px,0)` +
              ` scale(.76)`,
            opacity:0
          };

          questionBoxScatterTargets.set(
            card,
            target
          );

          card.style.transform =
            target.transform;
          card.style.opacity = "0";
          card.classList.remove(
            "focus-selected"
          );
          card.classList.add("focus-away");
        }
      );

      questionGrid.classList.add(
        "focus-mode"
      );

      return cards;
    }

    function scatterQuestionBoxes(selected){
      cancelQuestionBoxScatterAnimations();
      questionBoxScatterTargets.clear();
      const cards = Array.from(questionGrid.querySelectorAll(".box-card"));
      const stageRect = stage.getBoundingClientRect();
      const selectedX = selected.offsetLeft + selected.offsetWidth / 2;
      const selectedY = selected.offsetTop + selected.offsetHeight / 2;
      const tile = selected.offsetWidth || 1;
      const travel = Math.max(stageRect.width,stageRect.height) * .78 + tile * 1.6;
      const promises = [];
      questionGrid.classList.add("focus-mode","motion-active");

      cards.forEach((card,cardIndex)=>{
        card.classList.remove("focus-selected","focus-away");
        card.style.opacity = "1";
        card.style.transform = "translate3d(0,0,0) scale(1)";
        if (card === selected) {
          card.classList.add("focus-selected");
          return;
        }

        let dx = card.offsetLeft + card.offsetWidth / 2 - selectedX;
        let dy = card.offsetTop + card.offsetHeight / 2 - selectedY;
        let length = Math.hypot(dx,dy);
        if (length < 1) {
          const angle = ((cardIndex + 1) * 2.399963229728653) % (Math.PI * 2);
          dx = Math.cos(angle); dy = Math.sin(angle); length = 1;
        }
        const distance = travel + (cardIndex % 4) * tile * .10;
        const target = {
          transform:`translate3d(${(dx / length * distance).toFixed(2)}px,${(dy / length * distance).toFixed(2)}px,0) scale(.76)`,
          opacity:0
        };
        questionBoxScatterTargets.set(card,target);
        card.classList.add("focus-away");

        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              { transform:"translate3d(0,0,0) scale(1)",opacity:1 },
              { transform:target.transform,opacity:0 }
            ],
            { duration:BOX_SCATTER_MS,easing:BOX_MOTION_EASING,fill:"forwards" }
          );
          questionBoxScatterAnimations.set(card,animation);
          promises.push(animation.finished.catch(()=>{}));
        }
      });

      return promises.length ? Promise.all(promises) : wait(BOX_SCATTER_MS);
    }

    function restoreQuestionBoxesAnimated(){
      cancelQuestionBoxScatterAnimations();
      const cards = Array.from(questionGrid.querySelectorAll(".box-card"));
      const promises = [];
      questionGrid.classList.add("motion-active");

      cards.forEach((card)=>{
        if (card === questionBoxSelected) return;
        const target = questionBoxScatterTargets.get(card);
        if (!target) return;
        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              { transform:target.transform,opacity:0 },
              { transform:"translate3d(0,0,0) scale(1)",opacity:1 }
            ],
            { duration:BOX_SCATTER_MS,easing:BOX_MOTION_EASING,fill:"forwards" }
          );
          promises.push(animation.finished.catch(()=>{}));
          questionBoxScatterAnimations.set(card,animation);
        }
      });

      return (promises.length ? Promise.all(promises) : wait(BOX_SCATTER_MS)).then(()=>{
        cancelQuestionBoxScatterAnimations();
        cards.forEach((card)=>{
          card.style.transform = "translate3d(0,0,0) scale(1)";
          card.style.opacity = "1";
          card.classList.remove("focus-selected","focus-away");
        });
        questionBoxScatterTargets.clear();
        questionGrid.classList.remove("focus-mode","motion-active");
      });
    }

    function restoreDeck(){
      cancelQuestionBoxScatterAnimations();
      questionGrid.querySelectorAll(".box-card").forEach((card,index)=>{
        resetQuestionBoxVisibility(card);
        card.style.transform = "translate3d(0,0,0) scale(1)";
        card.classList.remove("focus-selected","focus-away");
        card.classList.toggle("is-completed",completed.has(index));
        setDeckCoverContent(card,index,completed.has(index));
        card.disabled = completed.has(index);
      });
      questionBoxScatterTargets.clear();
      questionGrid.classList.remove("focus-mode","motion-active");
      setQuestionBoxGridState(1,0,0);
      questionBoxFocusedIndex = -1;
      questionBoxSelected = null;
      requestAnimationFrame(fitAllDeckCoverText);
    }

    function resetQuestionBoxVisibility(button){
      if (!button) return;

      const animations =
        typeof button.getAnimations === "function"
          ? button.getAnimations({ subtree:true })
          : [];

      animations.forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });

      button.classList.remove(
        "box-vanished",
        "is-fast-fading"
      );

      button.style.removeProperty("opacity");
      button.style.removeProperty("visibility");
      button.style.removeProperty("pointer-events");
      button.style.opacity = "1";
      button.style.visibility = "visible";
      button.style.removeProperty("filter");

      const wrap = button.querySelector(".box-wrap");
      if (wrap) {
        wrap.style.removeProperty("transform");
        wrap.style.removeProperty("filter");
        wrap.style.removeProperty("opacity");
      }
    }

    async function revealQuestionBox(button){
      if (!button) return;

      resetQuestionBoxVisibility(button);
      button.classList.add("focus-selected");

      if (typeof button.animate !== "function") {
        await wait(80);
        return;
      }

      const animation = button.animate(
        [
          {
            opacity:0,
            transform:"translate3d(0,-4px,0) scale(.94)"
          },
          {
            opacity:1,
            transform:"translate3d(0,0,0) scale(1)"
          }
        ],
        {
          duration:180,
          easing:"cubic-bezier(.16,.82,.18,1)",
          fill:"forwards"
        }
      );

      await animation.finished.catch(()=>{});

      try { animation.cancel(); } catch (_) {}
      button.style.opacity = "1";
      button.style.visibility = "visible";
    }

    async function fadeQuestionBoxFast(button){
      if (!button) return;

      button.classList.add("is-fast-fading");

      if (typeof button.animate === "function") {
        const animation = button.animate(
          [
            {
              opacity:1,
              transform:"translate3d(0,0,0) scale(1)",
              filter:"brightness(1)"
            },
            {
              opacity:.35,
              transform:"translate3d(0,-4px,0) scale(.97)",
              filter:"brightness(1.12)"
            },
            {
              opacity:0,
              transform:"translate3d(0,-8px,0) scale(.92)",
              filter:"brightness(1.18)"
            }
          ],
          {
            duration:BOX_FAST_FADE_MS,
            easing:"cubic-bezier(.35,0,.75,.28)",
            fill:"forwards"
          }
        );

        await animation.finished.catch(()=>{});
        try { animation.cancel(); } catch (_) {}
      } else {
        await wait(BOX_FAST_FADE_MS);
      }

      button.classList.add("box-vanished");
      button.classList.remove("is-fast-fading");
      button.style.removeProperty("opacity");
      button.style.removeProperty("transform");
      button.style.removeProperty("filter");
    }

    function hideQuestionBoxImmediately(button){
      if (!button) return;

      const animations =
        typeof button.getAnimations === "function"
          ? button.getAnimations({ subtree:true })
          : [];

      animations.forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });

      button.classList.remove("is-fast-fading");
      button.classList.add("box-vanished");

      /*
        الإخفاء هنا مباشر في نفس الإطار الذي تنتهي فيه المستطيلات،
        ولا نعتمد على Transition أو تلاشي إضافي.
      */
      button.style.setProperty("opacity","0","important");
      button.style.setProperty("visibility","hidden","important");
      button.style.setProperty("pointer-events","none","important");
      button.style.removeProperty("filter");
    }

    function getElementBoxMotion(element,sourceRect){
      const rect = element.getBoundingClientRect();
      return {
        dx:sourceRect.left + sourceRect.width / 2 - (rect.left + rect.width / 2),
        dy:sourceRect.top + sourceRect.height / 2 - (rect.top + rect.height / 2)
      };
    }

    async function animateQuestionOutOfBox(source){
      questionView.classList.add("is-visible");

      const sourceRect = source.getBoundingClientRect();
      const elements = [
        questionCard,
        ...choicesGrid.querySelectorAll(".choice-card")
      ];

      /*
        السؤال وجميع الإجابات يبدأون من مركز الصندوق نفسه
        وفي الإطار الزمني نفسه، ثم يصل كل عنصر إلى موقعه النهائي.
      */
      const prepared = elements.map((element,index)=>{
        const { dx,dy } =
          getElementBoxMotion(element,sourceRect);

        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.setProperty("animation","none","important");
        element.style.setProperty("visibility","visible","important");
        element.style.setProperty(
          "display",
          element === questionCard ? "flex" : "flex",
          "important"
        );
        element.style.willChange = "transform,opacity";
        element.style.opacity = "0";
        element.style.transform =
          `translate3d(${dx}px,${dy}px,0) scale(.10)`;
        element.style.zIndex =
          element === questionCard ? "24" : "23";

        return {
          element,
          dx,
          dy,
          index
        };
      });

      /*
        إجبار المتصفح على تثبيت أحجام ومواقع السؤال والإجابات
        قبل تشغيل الحركة، حتى لا يتأخر مستطيل السؤال عن البقية.
      */
      questionCard.getBoundingClientRect();
      choicesGrid.getBoundingClientRect();

      /*
        الصندوق ثبت الآن في المنتصف.
        نخفيه فورًا قبل أن يبدأ ظهور أي مستطيل.
      */
      hideQuestionBoxImmediately(source);

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      const animations = prepared.map(
        ({ element,dx,dy })=>{
          if (typeof element.animate !== "function") {
            element.style.opacity = "1";
            element.style.transform =
              "translate3d(0,0,0) scale(1)";
            return null;
          }

          return element.animate(
            [
              {
                transform:
                  `translate3d(${dx}px,${dy}px,0) scale(.10)`,
                opacity:0
              },
              {
                transform:
                  `translate3d(${dx * .54}px,${dy * .54}px,0) scale(.58)`,
                opacity:1,
                offset:.48
              },
              {
                transform:
                  "translate3d(0,0,0) scale(1.025)",
                opacity:1,
                offset:.90
              },
              {
                transform:
                  "translate3d(0,0,0) scale(1)",
                opacity:1
              }
            ],
            {
              duration:BOX_ELEMENT_DURATION_MS,
              easing:"cubic-bezier(.18,.82,.18,1)",
              fill:"forwards"
            }
          );
        }
      );

      await Promise.all(
        animations
          .filter(Boolean)
          .map((animation)=>
            animation.finished.catch(()=>{})
          )
      );

      prepared.forEach(({ element })=>{
        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.setProperty("animation","none","important");
        element.style.transform =
          "translate3d(0,0,0) scale(1)";
        element.style.opacity = "1";
        element.style.visibility = "visible";
        element.style.willChange = "";
        element.style.removeProperty("z-index");
      });
    }

    async function animateQuestionIntoBox(source){
      const sourceRect = source.getBoundingClientRect();
      const elements = [
        questionCard,
        ...choicesGrid.querySelectorAll(".choice-card")
      ];

      /*
        جميع المستطيلات تدخل معًا إلى مركز الصندوق،
        وهي الحركة العكسية تمامًا لحركة خروجها.
      */
      const animations = elements.map((element)=>{
        const { dx,dy } =
          getElementBoxMotion(element,sourceRect);

        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        if (typeof element.animate !== "function") {
          element.style.opacity = "0";
          element.style.transform =
            `translate3d(${dx}px,${dy}px,0) scale(.10)`;
          return null;
        }

        return element.animate(
          [
            {
              transform:
                "translate3d(0,0,0) scale(1)",
              opacity:1
            },
            {
              transform:
                `translate3d(${dx * .54}px,${dy * .54}px,0) scale(.58)`,
              opacity:1,
              offset:.48
            },
            {
              transform:
                `translate3d(${dx}px,${dy}px,0) scale(.10)`,
              opacity:0
            }
          ],
          {
            duration:BOX_ELEMENT_DURATION_MS,
            easing:"cubic-bezier(.55,0,.75,.25)",
            fill:"forwards"
          }
        );
      });

      await Promise.all(
        animations
          .filter(Boolean)
          .map((animation)=>
            animation.finished.catch(()=>{})
          )
      );
    }

    async function openQuestionFromCard(index,source){
      if (interactionLocked || !source || !questions[index]) return;
      if (completed.has(index) || source.classList.contains("is-completed")) return;

      choicesAudio.unlock();
      choicesAudio.playGo();

      interactionLocked = true;
      activeSourceCard = source;
      questionBoxSelected = source;
      questionBoxFocusedIndex = index;
      activeQuestionIndex = index;
      resetQuestionBoxVisibility(source);

      const scatterFinished = scatterQuestionBoxes(source);
      await wait(BOX_SCATTER_LEAD_MS);
      await Promise.all([
        scatterFinished,
        animateQuestionBoxGrid(getQuestionBoxZoomTarget(source),BOX_ZOOM_IN_MS)
      ]);
      questionGrid.classList.remove("motion-active");

      page.classList.add("box-question-sequence");
      renderQuestion(index);
      questionNavigation.hidden = true;
      fitCurrentSceneText();

      await new Promise((resolve)=>
        requestAnimationFrame(()=>
          requestAnimationFrame(resolve)
        )
      );

      await animateQuestionOutOfBox(source);

      cardsView.classList.add("is-hidden");
      page.classList.remove("box-question-sequence");
      interactionLocked = false;
      updateNavigationButtons();
      collapseSafariBars({ refresh:false });
    }

    async function returnQuestionToBoxes(markCompleted = true){
      if (interactionLocked) return;
      if (!questionBoxSelected || activeQuestionIndex < 0) {
        questionView.classList.remove("is-visible","is-answered");
        cardsView.classList.remove("is-hidden");
        restoreDeck();
        updateNavigationButtons();
        return;
      }

      closeQuestionImageZoom();
      interactionLocked = true;
      questionNavigation.hidden = true;
      page.classList.add("box-return-sequence");
      cardsView.classList.remove("is-hidden");

      await revealQuestionBox(questionBoxSelected);
      await animateQuestionIntoBox(questionBoxSelected);
      questionView.classList.remove("is-visible","is-answered");

      if (markCompleted) completed.add(activeQuestionIndex);
      const finishedIndex = activeQuestionIndex;
      setDeckCoverContent(
        questionBoxSelected,
        finishedIndex,
        markCompleted
      );
      questionBoxSelected.classList.toggle("is-completed",markCompleted);
      questionBoxSelected.disabled = markCompleted;
      questionBoxSelected.setAttribute(
        "aria-disabled",
        markCompleted ? "true" : "false"
      );
      resetQuestionBoxVisibility(questionBoxSelected);

      /*
        يبدأ صوت العودة في اللحظة نفسها التي يبدأ فيها الصندوق
        الرجوع إلى موقعه، بنفس توقيت صفحة افتح الصندوق.
      */
      choicesAudio.unlock();
      choicesAudio.playReturn();

      await Promise.all([
        restoreQuestionBoxesAnimated(),
        animateQuestionBoxGrid({ scale:1,x:0,y:0 },BOX_ZOOM_OUT_MS)
      ]);

      const selected = questionGrid.querySelector(`.box-card[data-index="${finishedIndex}"]`);
      if (selected) {
        resetQuestionBoxVisibility(selected);
        selected.style.transform = "translate3d(0,0,0) scale(1)";
        selected.classList.remove("focus-selected","focus-away");
        selected.classList.toggle(
          "is-completed",
          completed.has(finishedIndex)
        );

        setDeckCoverContent(
          selected,
          finishedIndex,
          completed.has(finishedIndex)
        );
        requestAnimationFrame(fitAllDeckCoverText);

        selected.disabled = completed.has(finishedIndex);
        selected.setAttribute(
          "aria-disabled",
          completed.has(finishedIndex)
            ? "true"
            : "false"
        );
      }

      page.classList.remove("box-return-sequence");
      questionBoxFocusedIndex = -1;
      questionBoxSelected = null;
      activeSourceCard = null;
      activeQuestionIndex = -1;
      answerLocked = false;
      interactionLocked = false;
      updateNavigationButtons();
      collapseSafariBars();
    }

    function clearDirectFirstScenePresentation(){
      if (!page.classList.contains("direct-first-settled")) return;

      page.classList.remove("direct-first-settled");

      questionCard.getAnimations().forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });

      questionCard.style.removeProperty("animation");
      questionCard.style.removeProperty("transform");
      questionCard.style.removeProperty("opacity");
      questionCard.style.removeProperty("will-change");

      choicesGrid.querySelectorAll(".choice-card").forEach((card)=>{
        card.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        card.style.removeProperty("animation");
        card.style.removeProperty("transform");
        card.style.removeProperty("opacity");
        card.style.removeProperty("will-change");
      });
    }

    function updateNavigationButtons(){
      const questionVisible =
        questionView.classList.contains("is-visible") &&
        activeQuestionIndex >= 0 &&
        activeQuestionIndex < questions.length;

      questionNavigation.hidden = !questionVisible;
      if (!questionVisible) {
        previousBtn.hidden = true;
        nextBtn.hidden = true;
        return;
      }

      if (displayMode === "cards") {
        previousBtn.hidden = true;
        nextBtn.hidden = false;
        return;
      }

      previousBtn.hidden = activeQuestionIndex <= 0;
      nextBtn.hidden = activeQuestionIndex >= questions.length - 1;
    }

    async function showQuestionByIndex(index){
      if (interactionLocked) return;
      if (!Number.isInteger(index) || index < 0 || index >= questions.length) return;

      closeQuestionImageZoom();
      interactionLocked = true;
      questionNavigation.hidden = true;
      questionView.classList.remove("is-visible","is-answered");
      clearDirectFirstScenePresentation();

      await wait(220);

      finishView.classList.remove("is-visible");
      cardsView.classList.add("is-hidden");
      page.classList.add("direct-navigation-playing");

      renderQuestion(index);
      questionNavigation.hidden = true;
      fitCurrentSceneText();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      await animateDirectIntroElements();

      page.classList.remove(
        "direct-navigation-playing",
        "direct-intro-elements-entering"
      );

      interactionLocked = false;
      updateNavigationButtons();
      collapseSafariBars({ refresh:false });

    async function goToNextQuestion(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (displayMode === "cards") {
        await returnQuestionToBoxes(true);
        return;
      }
      await showQuestionByIndex(activeQuestionIndex + 1);
    }

    async function goToPreviousQuestion(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (displayMode === "cards") return;
      await showQuestionByIndex(activeQuestionIndex - 1);
    }

    async function hideQuestionScene(){
      if (questionImageZoomOpen) {
        closeQuestionImageZoom();
        return;
      }
      if (displayMode === "cards") {
        await returnQuestionToBoxes(false);
        return;
      }
      if (interactionLocked) return;
      interactionLocked = true;
      questionNavigation.hidden = true;
      questionView.classList.remove("is-visible","is-answered");
      await wait(260);
      updateNavigationButtons();
      interactionLocked = false;

    async function handleSceneTap(event){
      if (event.target.closest(".fixed-controls")) return;
      if (event.target.closest(".choice-card")) return;

    async function handleBack(){
      if (questionImageZoomOpen) {
        closeQuestionImageZoom();
        return;
      }
      if (interactionLocked) return;

      if (questionView.classList.contains("is-visible")) {
        if (displayMode === "cards") {
          answerLocked = true;
          await hideQuestionScene();
        } else {
          try { history.back(); } catch (_) {}
        }
        return;
      }

      try {
        const returnUrl = getUrlParam("return") || getUrlParam("returnUrl");
        if (returnUrl) {
          location.href = returnUrl;
          return;
        }
      } catch (_) {}

      try {
        history.back();
      } catch (_) {}

    async function playCardsIntro(){
      if (!page || !stage || !questionGrid) {
        return;
      }

      if (cardsIntroFrameId) {
        cancelAnimationFrame(
          cardsIntroFrameId
        );
        cardsIntroFrameId = null;
      }

      page.classList.remove(
        "cards-intro-done",
        "cards-intro-boxes-entering",
        "cards-intro-zooming"
      );

      page.classList.add(
        "cards-intro-playing",
        "cards-intro-camera"
      );

      cardsPendingViewportLayout = false;
      cardsIntroLayoutFrozen = false;
      interactionLocked = true;

      const holdMs =
        CARDS_INTRO_HOLD_MS;
      const zoomMs =
        CARDS_INTRO_ZOOM_MS;
      const settlePauseMs =
        CARDS_INTRO_SETTLE_MS;
      const startBgScale = 1;

      const endBgScale =
        Number(
          getComputedStyle(page)
            .getPropertyValue(
              "--cards-intro-bg-final-scale"
            )
        ) || 1.12;

      let startTime = null;

      const setCameraFrame = (bgScale)=>{
        stage.style.transform =
          "translate3d(0,0,0) scale(1)";
        stage.style.animation = "none";

        if (themeBackground) {
          themeBackground.style.transform =
            `translate3d(0,0,0) ` +
            `scale(${Number(bgScale).toFixed(5)})`;

          themeBackground.style.animation =
            "none";

          const ratio =
            (bgScale - startBgScale) /
            Math.max(
              .001,
              endBgScale - startBgScale
            );

          const saturation =
            1.04 - ratio * .04;

          themeBackground.style.filter =
            `saturate(` +
            `${Math.max(
              1,
              Math.min(1.04,saturation)
            )}` +
            `)`;
        }
      };

      const completeIntro = ()=>{
        if (cardsIntroFrameId) {
          cancelAnimationFrame(
            cardsIntroFrameId
          );
          cardsIntroFrameId = null;
        }

        setCameraFrame(endBgScale);

        page.classList.remove(
          "cards-intro-playing",
          "cards-intro-camera",
          "cards-intro-boxes-entering",
          "cards-intro-zooming"
        );

        page.classList.add(
          "cards-intro-done"
        );

        if (themeBackground) {
          themeBackground.style.filter = "";
        }

        if (fixedControls) {
          fixedControls.style.opacity = "1";
          fixedControls.style.transform =
            "none";
          fixedControls.style.pointerEvents =
            "";
        }

        cardsIntroLayoutFrozen = false;
        interactionLocked = false;
        cardsPendingViewportLayout = false;

        collapseSafariBars({
          refresh:false
        });
      };

      if (fixedControls) {
        fixedControls.style.opacity = "0";
        fixedControls.style.transform =
          "translateY(12px)";
        fixedControls.style.pointerEvents =
          "none";
      }

      /*
        مطابق لصفحة افتح الصندوق:
        نثبت مساحة Safari ونحسب الشبكة وهي مخفية.
      */
      syncVisualViewportFrame(true);
      calculateDeckLayout({
        force:true
      });
      setQuestionBoxGridState(1,0,0);

      setCameraFrame(startBgScale);
      collapseSafariBars();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      const reducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

      if (!reducedMotion) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) {
              startTime = now;
            }

            const elapsed =
              now - startTime;

            if (elapsed < holdMs) {
              setCameraFrame(startBgScale);
              cardsIntroFrameId =
                requestAnimationFrame(
                  animate
                );
              return;
            }

            const progress = Math.max(
              0,
              Math.min(
                1,
                (
                  elapsed - holdMs
                ) / zoomMs
              )
            );

            const eased =
              easeInOutSine(progress);

            const bgScale =
              startBgScale +
              (
                endBgScale -
                startBgScale
              ) * eased;

            setCameraFrame(bgScale);

            if (progress < 1) {
              cardsIntroFrameId =
                requestAnimationFrame(
                  animate
                );
              return;
            }

            cardsIntroFrameId = null;
            resolve();
          };

          cardsIntroFrameId =
            requestAnimationFrame(animate);
        });
      } else {
        setCameraFrame(endBgScale);
      }

      /*
        الزوم ثبت. نعيد قياس المساحة والشبكة مرة واحدة،
        ثم نجمد التخطيط خلال دخول الصناديق.
      */
      collapseSafariBars({
        refresh:false
      });

      await wait(settlePauseMs);

      syncVisualViewportFrame(true);
      calculateDeckLayout({
        force:true
      });
      setQuestionBoxGridState(1,0,0);

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      cardsIntroLayoutFrozen = true;
      interactionLocked = true;

      prepareCardsIntroScatterTargets();

      page.classList.remove(
        "cards-intro-camera",
        "cards-intro-zooming"
      );

      page.classList.add(
        "cards-intro-boxes-entering"
      );

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (!reducedMotion) {
        await restoreQuestionBoxesAnimated();
      } else {
        restoreDeck();
      }

      completeIntro();
    }

    function setDirectIntroCameraFrame(bgScale){
      const background =
        document.getElementById("themeBackground");

      if (!background) return;

      background.style.transform =
        `translate3d(0,0,0) scale(${Number(bgScale).toFixed(5)})`;
      background.style.animation = "none";

      const endScale =
        Number(
          getComputedStyle(page)
            .getPropertyValue("--direct-intro-bg-final-scale")
        ) || 1.12;

      const ratio =
        (bgScale - 1) /
        Math.max(.001,endScale - 1);

      const saturation = 1.04 - ratio * .04;

      background.style.filter =
        `saturate(${Math.max(1,Math.min(1.04,saturation))})`;
    }

    function prepareDirectIntroElementTargets(){
      const choiceCards = Array.from(
        choicesGrid.querySelectorAll(".choice-card")
      );

      const stageRect = stage.getBoundingClientRect();
      const gridRect = choicesGrid.getBoundingClientRect();

      const questionTravel =
        Math.max(
          stageRect.height * .72,
          questionCard.getBoundingClientRect().height * 2.2
        );

      const questionTarget = {
        element:questionCard,
        fromTransform:
          `translate3d(0px,${(-questionTravel).toFixed(2)}px,0) scale(.88)`
      };

      const gridCenterX =
        gridRect.left + gridRect.width / 2;
      const gridCenterY =
        gridRect.top + gridRect.height / 2;

      const baseTravel =
        Math.max(stageRect.width,stageRect.height) * .78;

      const choiceTargets = choiceCards.map((card,index)=>{
        const rect = card.getBoundingClientRect();

        let dx =
          rect.left + rect.width / 2 - gridCenterX;
        let dy =
          rect.top + rect.height / 2 - gridCenterY;

        let length = Math.hypot(dx,dy);

        if (length < 1) {
          const angle =
            ((index + 1) * 2.399963229728653) %
            (Math.PI * 2);

          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;

        const distance =
          baseTravel +
          Math.max(rect.width,rect.height) * 1.45 +
          (index % 3) * 18;

        return {
          element:card,
          fromTransform:
            `translate3d(` +
            `${(unitX * distance).toFixed(2)}px,` +
            `${(unitY * distance).toFixed(2)}px,0)` +
            ` scale(.76)`
        };
      });

      return {
        questionTarget,
        choiceTargets
      };
    }

    async function animateDirectIntroElements(){
      const {
        questionTarget,
        choiceTargets
      } = prepareDirectIntroElementTargets();

      const targets = [
        questionTarget,
        ...choiceTargets
      ];

      targets.forEach(({ element,fromTransform })=>{
        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.animation = "none";
        element.style.willChange = "transform,opacity";
        element.style.transform = fromTransform;
        element.style.opacity = "0";
      });

      page.classList.remove("direct-intro-camera");
      page.classList.add("direct-intro-elements-entering");

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        targets.forEach(({ element })=>{
          element.style.transform =
            "translate3d(0,0,0) scale(1)";
          element.style.opacity = "1";
          element.style.willChange = "";
        });
        return;
      }

      const animations = targets.map(
        ({ element,fromTransform })=>{
          if (typeof element.animate !== "function") {
            element.style.transform =
              "translate3d(0,0,0) scale(1)";
            element.style.opacity = "1";
            return null;
          }

          return element.animate(
            [
              {
                transform:fromTransform,
                opacity:0
              },
              {
                transform:
                  "translate3d(0,0,0) scale(1)",
                opacity:1
              }
            ],
            {
              duration:DIRECT_INTRO_ENTRY_MS,
              easing:DIRECT_INTRO_ENTRY_EASING,
              fill:"forwards"
            }
          );
        }
      );

      await Promise.all(
        animations
          .filter(Boolean)
          .map((animation)=>
            animation.finished.catch(()=> {})
          )
      );

      targets.forEach(({ element })=>{
        element.getAnimations().forEach((animation)=>{
          try { animation.cancel(); } catch (_) {}
        });

        element.style.animation = "none";
        element.style.transform =
          "translate3d(0,0,0) scale(1)";
        element.style.opacity = "1";
        element.style.willChange = "";
      });
    }

    async function playDirectOpeningIntro(){
      if (directIntroRunning) return;

      directIntroRunning = true;
      interactionLocked = true;
      questionNavigation.hidden = true;

      if (directIntroFrameId) {
        cancelAnimationFrame(directIntroFrameId);
        directIntroFrameId = null;
      }

      page.classList.remove(
        "direct-intro-done",
        "direct-intro-elements-entering",
        "direct-first-settled"
      );

      page.classList.add(
        "direct-intro-playing",
        "direct-intro-camera"
      );

      const startScale = 1;
      const endScale =
        Number(
          getComputedStyle(page)
            .getPropertyValue("--direct-intro-bg-final-scale")
        ) || 1.12;

      let startTime = null;

      syncVisualViewportFrame();
      fitCurrentSceneText();
      setDirectIntroCameraFrame(startScale);
      collapseSafariBars();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (
        !window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) startTime = now;

            const elapsed = now - startTime;

            if (elapsed < DIRECT_INTRO_HOLD_MS) {
              setDirectIntroCameraFrame(startScale);
              directIntroFrameId =
                requestAnimationFrame(animate);
              return;
            }

            const progress = Math.max(
              0,
              Math.min(
                1,
                (elapsed - DIRECT_INTRO_HOLD_MS) /
                DIRECT_INTRO_ZOOM_MS
              )
            );

            const eased = easeInOutSine(progress);
            const scale =
              startScale +
              (endScale - startScale) * eased;

            setDirectIntroCameraFrame(scale);

            if (progress < 1) {
              directIntroFrameId =
                requestAnimationFrame(animate);
              return;
            }

            directIntroFrameId = null;
            resolve();
          };

          directIntroFrameId =
            requestAnimationFrame(animate);
        });
      } else {
        setDirectIntroCameraFrame(endScale);
      }

      collapseSafariBars({ refresh:false });
      await wait(DIRECT_INTRO_SETTLE_MS);

      syncVisualViewportFrame();
      fitCurrentSceneText();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      await animateDirectIntroElements();

      const background =
        document.getElementById("themeBackground");

      if (background) {
        background.style.filter = "";
        background.style.transform =
          `translate3d(0,0,0) scale(${endScale})`;
      }

      page.classList.add(
        "direct-intro-done",
        "direct-first-settled"
      );

      page.classList.remove(
        "direct-intro-playing",
        "direct-intro-camera",
        "direct-intro-elements-entering"
      );

      directIntroRunning = false;
      interactionLocked = false;

      updateNavigationButtons();
      collapseSafariBars({ refresh:false });
    }

    function startIntro(){
      if (displayMode === "direct") {
        playDirectOpeningIntro();
        return;
      }

      playCardsIntro();
    }

    function scheduleLayout(delay = 0){
      if (
        displayMode === "cards" &&
        (
          cardsIntroLayoutFrozen ||
          interactionLocked
        )
      ) {
        cardsPendingViewportLayout = true;
        return;
      }

      if (viewportLayoutFrame) {
        cancelAnimationFrame(
          viewportLayoutFrame
        );
        viewportLayoutFrame = null;
      }

      if (viewportLayoutTimer) {
        clearTimeout(
          viewportLayoutTimer
        );
        viewportLayoutTimer = null;
      }

      const run = ()=>{
        viewportLayoutFrame =
          requestAnimationFrame(()=>{
            viewportLayoutFrame = null;

            syncVisualViewportFrame();

            if (displayMode === "cards") {
              calculateDeckLayout();
            }

            fitCurrentSceneText();
            cardsPendingViewportLayout =
              false;
          });
      };

      if (delay > 0) {
        viewportLayoutTimer =
          setTimeout(()=>{
            viewportLayoutTimer = null;
            run();
          },delay);
      } else {
        run();
      }
    }

    async function initialize(){
      syncVisualViewportFrame(true);
      await hydratePayload();
      choicesAudio.setEnabled(quizSoundEnabled);
      choicesAudio.preload();
      applyTheme();

      if (displayMode === "cards") {
        interactionLocked = true;
        page.classList.add(
          "cards-intro-playing",
          "cards-intro-camera"
        );
        renderDeck();
        cardsView.classList.remove("is-hidden");
        questionNavigation.hidden = true;
      } else {
        page.classList.add(
          "direct-intro-playing",
          "direct-intro-camera"
        );
        cardsView.classList.add("is-hidden");
        renderQuestion(0);
        questionNavigation.hidden = true;
      }

      requestAnimationFrame(()=>{
        requestAnimationFrame(startIntro);
      });

      collapseSafariBars();
    }

    page.addEventListener("click",handleSceneTap);

    questionImageOverlay.addEventListener("click",(event)=>{
      event.preventDefault();
      event.stopPropagation();
      closeQuestionImageZoom();
    });

    document.addEventListener("keydown",(event)=>{
      if (event.key === "Escape" && questionImageZoomOpen) {
        event.preventDefault();
        closeQuestionImageZoom();
      }
    });

    backBtn.addEventListener("click",(event)=>{
      event.preventDefault();
      event.stopPropagation();
      handleBack();
    });

    nextBtn.addEventListener("click",goToNextQuestion);
    previousBtn.addEventListener("click",goToPreviousQuestion);

    window.addEventListener("resize",()=>{
      scheduleLayout(40);
    },{ passive:true });

    window.addEventListener("orientationchange",()=>{
      setTimeout(()=>{
        collapseSafariBars();
        scheduleLayout(80);
      },160);
    },{ passive:true });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize",()=>{
        scheduleLayout(34);
      },{ passive:true });

      window.visualViewport.addEventListener("scroll",()=>{
        scheduleLayout(34);
      },{ passive:true });
    }

    document.addEventListener("touchend",()=>{
      collapseSafariBars();
    },{ passive:true });

    window.addEventListener("pageshow",()=>{
      collapseSafariBars();
      scheduleLayout(60);
    },{ passive:true });

    initialize();
  })();
  </script>
</body>
</html>
