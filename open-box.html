    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    /*
      open-box-safari-scroll-v1:
      نفس نظام صفحة العجلة لإعطاء Safari مساحة تمرير صغيرة
      مع بقاء اللعبة مثبتة داخل الشاشة.
    */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:none;
    }

    /* نفس خلفيات وثيمات العجلة تمامًا */
    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1);
      transform-origin:center center;
      will-change:transform, opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .game-page.theme-white{
      background:#fff;
    }

    .game-page.theme-white .theme-background{
      opacity:0;
      background-image:none;
    }

    .game-page.theme-classroom .theme-background{
      opacity:1;
      background-color:#fff;
      background-image:
        url("theme-classroom-bg-v2.webp?v=2"),
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        url("theme-original.webp?v=45"),
        url("theme-original.png?v=45");
    }

    .game-page.theme-sky-clouds .theme-background{
      opacity:1;
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        url("theme-sky-clouds.webp?v=45"),
        url("theme-sky-clouds.png?v=45");
    }

    .game-page.theme-forest .theme-background{
      opacity:1;
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .game-page.theme-math .theme-background{
      opacity:1;
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .game-page.theme-english .theme-background{
      opacity:1;
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#72d0d2 100%);
    }

    .game-page.theme-flowers .theme-background{
      opacity:1;
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .game-page.theme-national-day .theme-background{
      opacity:1;
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .game-page.theme-founding-day .theme-background{
      opacity:1;
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    /*
      نفس حركة افتتاح العجلة:
      وقفة قصيرة، ثم اقتراب المشهد والصناديق ببطء مع تكبير الخلفية.
    */
    :root{
      --intro-duration:8.60s;
      --intro-bg-final-scale:1.12;
    }

    .fixed-controls{
      transition:opacity .34s ease, transform .34s ease;
    }

    .game-page.intro-playing .fixed-controls{
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
    }

    .game-page.intro-playing .stage{
      transform-origin:center center;
      transform:translate3d(0,0,0) scale(1);
      pointer-events:none;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    /* لا تظهر الشبكة نهائيًا أثناء زوم الخلفية. */
    .game-page.intro-camera .box-grid{
      visibility:hidden;
    }

    /*
      بعد ثبات الكاميرا تصبح الشبكة مرئية، لكن كل صندوق يكون
      خارج المشهد وشفافيته صفر قبل تشغيل حركة العودة.
    */
    .game-page.intro-boxes-entering .box-grid{
      visibility:visible;
    }

    .game-page.intro-playing .theme-background{
      transform:translate3d(0,0,0) scale(1);
      will-change:transform, opacity;
    }

    .game-page.intro-done .theme-background{
      transform:translate3d(0,0,0) scale(var(--intro-bg-final-scale));
    }

    .game-page.intro-playing .game-logo{
      animation:introLogoFade .75s ease-out both;
    }

    @keyframes introLogoFade{
      0%{ opacity:0; transform:translateY(-8px); }
      100%{ opacity:1; transform:translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      .game-page.intro-playing .stage,
      .game-page.intro-playing .game-logo,
      .game-page.intro-playing .theme-background,
      .game-page.intro-boxes-entering .box-card{
        animation:none !important;
      }
    }

    .game-logo{
      position:absolute;
      top:clamp(10px, 1.7vw, 22px);
      left:clamp(12px, 2vw, 30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px, 9vw, 120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(72px + var(--safe-top))
        calc(var(--edge-guard) + var(--safe-right))
        calc(82px + var(--safe-bottom))
        calc(var(--edge-guard) + var(--safe-left));
      direction:ltr;
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .box-grid{
      width:max-content;
      height:max-content;
      max-width:100%;
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols, 4), var(--tile-size));
      justify-content:center;
      align-content:center;
      gap:var(--tile-gap);
      transform-origin:0 0;
      transform:translate3d(0, 0, 0) scale(1);
      will-change:transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout style;
      isolation:isolate;
    }

    .stage{
      overflow:hidden;
    }

    /*
      open-box-v25:
      - إعادة ضبط هندسة الصندوق المفتوح لتطابق المرجع.
      - إزالة إحساس الإطار، والاعتماد على منظور ثلاثي الأبعاد فعلي.
      - جميع الجوانب بنفس اللون الأساسي مع تظليل خفيف فقط.
      - فواصل الزوايا قصيرة وخفيفة مثل المرجع، وليست خطوط إطار.
    */
    /* v50:
       - اختيار الصندوق لا يفتحه مباشرة.
       - الصناديق الأخرى تبتعد خارج المشهد، والصندوق المختار ينتقل للمنتصف.
       - زر فتح مستقل يظهر بعد اكتمال حركة التركيز.
       - ضغطة لاحقة على الشاشة تعيد جميع الصناديق إلى مواقعها.
    */
    .box-card{
      transform:translate3d(0, 0, 0) scale(1);
      opacity:1;
      will-change:transform, opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout paint style;
    }

    .box-card.focus-selected{
      z-index:55;
      opacity:1;
    }

    .box-card.focus-away{
      pointer-events:none;
    }

    .box-grid.motion-active .box-card{
      pointer-events:none;
    }

    .box-grid.focus-mode .box-card:not(.focus-selected){
      user-select:none;
      -webkit-user-select:none;
    }

    .box-card{
      --panel:#df3a64;
      --panel-light:#f06f8e;
      --panel-dark:#b91f49;

      --wall-tone:#ca6f84;
      --top-wall:var(--wall-tone);
      --left-wall:var(--wall-tone);
      --right-wall:var(--wall-tone);
      --bottom-wall:var(--wall-tone);
      --back-face:#941d3b;

      --shadow:rgba(0,0,0,.17);

      display:block;
      width:var(--tile-size);
      height:var(--tile-size);
      padding:0;
      margin:0;
      border:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      perspective:1200px;
    }

    .box-pink{

    }

    .box-lime{

    }

    .box-blue{
      --panel:#35a8ef; --panel-light:#87d4ff; --panel-dark:#237cc3;

    }

    .box-orange{
      --panel:#f59a32; --panel-light:#ffc06c; --panel-dark:#bd6a18;
      --wall-tone:#e3a056; --top-wall:var(--wall-tone); --left-wall:var(--wall-tone); --right-wall:var(--wall-tone); --bottom-wall:var(--wall-tone); --back-face:#a66b1d;
    }

    .box-purple{
      --panel:#8e67f1; --panel-light:#b99aff; --panel-dark:#6543c0;
      --wall-tone:#9b80ec; --top-wall:var(--wall-tone); --left-wall:var(--wall-tone); --right-wall:var(--wall-tone); --bottom-wall:var(--wall-tone); --back-face:#6d55b3;
    }

    .box-red{

    .box-teal{

    }

    .box-wrap{
      position:relative;
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 6px 10px var(--shadow));
      transform:translateZ(0);
      transition:transform .48s cubic-bezier(.2,.8,.2,1);
    }

    .box-card.multi-answer-active .box-wrap{
      --multi-box-shift-y:clamp(-56px,-6vh,-34px);
      --multi-box-scale:.64;
      transform:translate3d(
        0,
        calc(var(--multi-box-shift-y) + var(--multi-box-safe-nudge-y,0px)),
        0
      ) scale(var(--multi-box-scale));
      transform-origin:center center;
    }

    .box-card.multi-answer-active{
      contain:layout style;
      overflow:visible;
    }

    /* يسمح بعرض صندوق السؤال كاملًا بعد رفعه فوق صناديق الإجابات. */
    .game-page.multi-answer-mode-active .stage{
      overflow:visible;
    }

    .multi-answer-layer{
      position:absolute;
      left:50%;
      bottom:calc(72px + var(--safe-bottom));
      width:min(1180px, calc(100vw - 2 * var(--edge-guard) - var(--safe-left) - var(--safe-right)));
      z-index:190;

      visibility:hidden;
      pointer-events:none;
      transform:translate3d(-50%, 22px, 0) scale(.98);
      transition:opacity .28s ease, transform .36s cubic-bezier(.2,.8,.2,1), visibility 0s linear .36s;
      direction:rtl;
    }

    .multi-answer-layer.is-visible{

      pointer-events:auto;

    .multi-answer-grid{
      display:grid;
      grid-template-columns:repeat(var(--answer-columns,4),minmax(120px,190px));
      justify-content:center;
      align-items:center;
      gap:clamp(10px,1.25vw,18px);
      width:100%;
    }

    .multi-answer-choice{
      --asset-tint:#35a8ef;
      --asset-body-brightness:1.04;
      --asset-lid-brightness:1.04;
      --asset-saturation:1.22;
      --box-result-text:#fff;
      --box-result-text-shadow:0 3px 8px rgba(0,0,0,.34);

      width:100%;
      aspect-ratio:1 / 1;
      border:0;
      border-radius:0;
      background:transparent;
      color:var(--box-result-text);
      padding:0;
      box-shadow:none;
      cursor:pointer;
      display:block;
      perspective:900px;
      transition:transform .18s ease, filter .18s ease, opacity .18s ease;
    }

    .answer-box-shell{
      position:relative;
      display:block;
      width:100%;
      height:100%;
      filter:drop-shadow(0 7px 7px rgba(0,0,0,.22));
      transition:transform .18s ease,filter .18s ease;
    }

    .answer-box-shell::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background-image:
        linear-gradient(var(--asset-tint),var(--asset-tint)),
        var(--asset-open-body);
      background-repeat:no-repeat,no-repeat;
      background-position:center,center;
      background-size:100% 100%,100% 100%;
      background-blend-mode:color;
      filter:brightness(var(--asset-body-brightness)) saturate(var(--asset-saturation));
      pointer-events:none;
    }

    .answer-box-shell::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:8.9%;
      z-index:4;
      background-image:
        linear-gradient(var(--asset-tint),var(--asset-tint)),
        var(--asset-open-lid);
      background-repeat:no-repeat,no-repeat;
      background-position:center top,center top;
      background-size:100% 100%,100% 100%;
      background-blend-mode:color;
      filter:brightness(var(--asset-lid-brightness)) saturate(var(--asset-saturation));
      pointer-events:none;
    }

    .answer-box-content{
      position:absolute;
      inset:8.5% 5.5% 5%;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:0;
      min-height:0;
      overflow:hidden;
      color:var(--box-result-text);
      text-shadow:var(--box-result-text-shadow);
      pointer-events:none;
    }

    .answer-box-text{
      display:-webkit-box;
      width:100%;
      max-height:100%;
      overflow:hidden;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:5;
      overflow-wrap:anywhere;
      text-align:center;
      font:900 clamp(18px,1.85vw,30px)/1.15 "Cairo",sans-serif;
    }

    .answer-box-image{
      display:block;
      width:100%;
      height:100%;
      object-fit:contain;
      border-radius:6px;
      background:rgba(255,255,255,.94);
    }

    .multi-answer-choice:hover{filter:brightness(1.06);transform:translateY(-4px) scale(1.02)}
    .multi-answer-choice:disabled{cursor:default;opacity:.78}
    .multi-answer-choice.is-correct{--asset-tint:#20aa61;opacity:1;filter:none}
    .multi-answer-choice.is-wrong{--asset-tint:#e5484d;opacity:1;filter:none}

    @media(max-width:680px){
      .multi-answer-layer{bottom:calc(68px + var(--safe-bottom));width:calc(100vw - 24px - var(--safe-left) - var(--safe-right))}
      .multi-answer-grid{grid-template-columns:repeat(2,minmax(110px,160px));gap:8px}
      .answer-box-text{font-size:clamp(17px,4.6vw,24px)}
      .box-card.multi-answer-active .box-wrap{
        --multi-box-shift-y:-78px;

      }
    }

    @media(max-height:760px) and (orientation:landscape){
      .multi-answer-layer{bottom:calc(50px + var(--safe-bottom));width:min(1100px,calc(100vw - 30px))}
      .multi-answer-grid{grid-template-columns:repeat(var(--answer-columns,4),minmax(104px,150px));gap:8px}
      .answer-box-text{font-size:clamp(17px,1.75vw,26px);-webkit-line-clamp:4}
      .box-card.multi-answer-active .box-wrap{
        --multi-box-shift-y:-10px;
        --multi-box-scale:.58;
      }

    .cavity-box,
    .front-panel{
      position:absolute;
      inset:0;
    }

    .cavity-box{
      opacity:0;
      transform:scale(.96);
      transition:opacity .25s ease, transform .72s cubic-bezier(.18,.82,.18,1);
      pointer-events:none;
    }

    .box-card.opened .cavity-box{
      opacity:1;
      transform:scale(1);
    }

    .box-back{
      position:absolute;
      left:8.8%;
      right:8.8%;
      top:16.4%;
      bottom:10.8%;
      z-index:1;
      background:var(--back-face);
      box-shadow:
        inset 0 4px 8px rgba(255,255,255,.025),
        inset 0 -3px 6px rgba(0,0,0,.055),
        0 1px 3px rgba(0,0,0,.03);
    }

    .wall{
      position:absolute;
      z-index:2;
      pointer-events:none;
    }

    .wall-top{
      left:0;
      right:0;
      top:5.1%;
      height:11.3%;
      background:
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.10) 46%, rgba(0,0,0,.02)),
        var(--top-wall);
      clip-path:polygon(0 0, 100% 0, 91.2% 100%, 8.8% 100%);
      box-shadow:inset 0 -1px 0 rgba(0,0,0,.05);
    }

    .wall-bottom{
      left:0;
      right:0;
      bottom:0;
      height:10.8%;
      background:
        linear-gradient(0deg, rgba(0,0,0,.08), rgba(255,255,255,.06) 58%, rgba(255,255,255,.11)),
        var(--bottom-wall);
      clip-path:polygon(8.8% 0, 91.2% 0, 100% 100%, 0 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
    }

    .wall-left{
      left:0;
      top:5.1%;
      bottom:0;
      width:8.8%;
      background:
        linear-gradient(90deg, rgba(0,0,0,.07), rgba(255,255,255,.09) 70%, rgba(255,255,255,.02)),
        var(--left-wall);
      clip-path:polygon(0 0, 100% 11.3%, 100% 89.2%, 0 100%);

    }

    .wall-right{
      right:0;
      top:5.1%;
      bottom:0;

        linear-gradient(270deg, rgba(0,0,0,.07), rgba(255,255,255,.09) 70%, rgba(255,255,255,.02)),

    .cavity-box::after{
      content:"";
      position:absolute;
      inset:0;

      pointer-events:none;
      box-shadow:
        inset 0 -1px 2px rgba(0,0,0,.04),

      background:
        linear-gradient(135deg, transparent 0 48%, rgba(255,255,255,.42) 49.2%, rgba(255,255,255,.42) 50.8%, transparent 52%) top left/8% 9% no-repeat,
        linear-gradient(225deg, transparent 0 48%, rgba(255,255,255,.42) 49.2%, rgba(255,255,255,.42) 50.8%, transparent 52%) top right/8% 9% no-repeat,
        linear-gradient(45deg, transparent 0 48%, rgba(255,255,255,.20) 49.2%, rgba(255,255,255,.20) 50.8%, transparent 52%) bottom left/8% 9% no-repeat,
        linear-gradient(-45deg, transparent 0 48%, rgba(255,255,255,.20) 49.2%, rgba(255,255,255,.20) 50.8%, transparent 52%) bottom right/8% 9% no-repeat;
    }

    .box-content{
      position:absolute;
      left:13.6%;
      right:13.6%;
      top:21.8%;
      bottom:14.8%;
      z-index:5;

      justify-content:center;
      direction:rtl;
      text-align:center;

    .front-panel{

        inset 0 1px 0 rgba(255,255,255,.14),

        left .86s cubic-bezier(.17,.84,.17,1),

      right:0;

      height:5.1%;

        inset 0 1px 0 rgba(255,255,255,.14),
        0 1px 2px rgba(0,0,0,.05);

    .cover-text{
      position:relative;
      z-index:2;
      width:86%;
      max-height:76%;
      display:flex;
      align-items:center;

    }

    .panel-number{

    .box-card.opened .panel-number{

    .result-text{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;

    .result-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      background:transparent;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));
    }

    .result-mixed{
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:minmax(0, 1fr) auto;
      gap:clamp(3px, 4%, 7px);

    .result-mixed .result-text{

    /* v34:
       - إزالة الدوائر/البقع الشفافة من الغطاء بالكامل.
       - إزالة اللمعة البيضاوية من الصناديق المغلقة والغطاء المتحرك.
       - الإبقاء على حركة الغطاء والغطاء العلوي الثابت كما في الإصدار السابق.
    */
    .box-card{
      --asset-tint:#b8dd55;
      --asset-body-brightness:1.04;
      --asset-lid-brightness:1.04;
      --asset-saturation:1.18;
      --asset-filter:none;
    }

    .box-pink{ --asset-tint:#f12e68; --asset-body-brightness:1.02; --asset-lid-brightness:1.02; --asset-saturation:1.24; }
    .box-lime{ --asset-tint:#b8dd55; --asset-body-brightness:1.05; --asset-lid-brightness:1.05; --asset-saturation:1.20; }
    .box-blue{ --asset-tint:#35a8ef; --asset-body-brightness:1.04; --asset-lid-brightness:1.04; --asset-saturation:1.22; }

    .box-red{ --asset-tint:#e8425a; --asset-body-brightness:1.00; --asset-lid-brightness:1.00; --asset-saturation:1.24; }
    .box-teal{ --asset-tint:#3dc6b5; --asset-body-brightness:1.02; --asset-lid-brightness:1.02; --asset-saturation:1.22; }

    .box-wrap{
      filter:drop-shadow(0 6px 11px var(--shadow));
    }

    .cavity-box{
      opacity:0;
      transform:scale(.985);
      transition:opacity .42s ease .10s, transform .72s cubic-bezier(.20,.82,.18,1) .08s;
    }

    .box-card.opened .cavity-box{
      opacity:1;
      transform:scale(1);
    }

    .cavity-box .box-back,
    .cavity-box .wall{
      display:none !important;
    }

    .cavity-box::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background-image:
        linear-gradient(var(--asset-tint), var(--asset-tint)),
        var(--asset-open-body);
      background-repeat:no-repeat, no-repeat;
      background-position:center, center;
      background-size:100% 100%, 100% 100%;
      background-blend-mode:color;
      filter:brightness(var(--asset-body-brightness)) saturate(var(--asset-saturation));
      pointer-events:none;
    }

    .cavity-box::after{
      content:"";
      position:absolute;
      inset:8% 4% 4%;
      z-index:2;
      border-radius:4px;
      box-shadow:0 7px 13px rgba(0,0,0,.045);
      pointer-events:none;
      background:none;
    }

    /* الغطاء الثابت النهائي: يبقى ظاهرًا أعلى الصندوق المفتوح */
    .box-wrap::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:8.9%;
      z-index:18;
      opacity:0;
      background-image:
        linear-gradient(var(--asset-tint), var(--asset-tint)),
        var(--asset-open-lid);
      background-repeat:no-repeat, no-repeat;
      background-position:center, center;
      background-size:100% 100%, 100% 100%;
      background-blend-mode:color;
      filter:brightness(var(--asset-lid-brightness)) saturate(var(--asset-saturation));
      pointer-events:none;
    }

    .box-card.opened .box-wrap::after{
      opacity:1;
    }

    /* الغطاء المتحرك المؤقت: كامل في البداية، ثم يختفي من الأسفل حتى يلتقي بالغطاء الثابت */
    @keyframes assetMovingCover{
      0%{
        opacity:1;
        transform:translateY(0) scale(1);
        clip-path:inset(0 0 0 0 round 0);
      }
      84%{
        opacity:1;
        transform:translateY(-2.2%) scale(1);
        clip-path:inset(0 0 91.1% 0 round 0);
      }
      84.1%{
        opacity:0;
        transform:translateY(-2.2%) scale(1);
        clip-path:inset(0 0 91.1% 0 round 0);
      }
      100%{
        opacity:0;
        transform:translateY(-2.2%) scale(1);
        clip-path:inset(0 0 91.1% 0 round 0);
      }
    }

    .box-card.opened .front-panel{
      left:0;
      right:0;
      top:0;
      height:100%;
      z-index:21;
      border-radius:0;
      opacity:1;
      transform:scale(1);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 1px 2px rgba(0,0,0,.04);
      pointer-events:none;
      overflow:hidden;
      animation:assetMovingCover 1.32s linear both;
      will-change:transform, clip-path, opacity;
    }

    .box-content{
      left:18.2%;
      right:18.2%;
      top:29%;
      bottom:18.5%;
      z-index:6;
    }

    .box-card.opened .box-content{
      opacity:1;
      transform:translateY(0);
    }


    /* v48:
       - قياس نص الغلاف فقط أثناء إغلاق الصندوق حتى لا يصغر عند تحوله إلى شريط علوي.
       - استخدام كامل التجويف الداخلي الآمن للمحتوى.
       - تقسيم مرن للصورة والنص حسب طول النص.
       - تطبيق حجم الخط المحسوب فعليًا رغم قواعد CSS السابقة.
    */
    .box-content{
      left:8.2% !important;
      right:8.2% !important;
      top:9.7% !important;
      bottom:7.4% !important;
      z-index:6 !important;
      overflow:hidden !important;
      padding:0 !important;
      display:flex !important;
      align-items:stretch !important;
      justify-content:stretch !important;
      min-width:0 !important;
      min-height:0 !important;
    }

    .content-frame{
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:grid;
      align-items:stretch;
      justify-items:stretch;
    }

    .content-frame-text,
    .content-frame-image{
      grid-template-columns:minmax(0, 1fr);
      grid-template-rows:minmax(0, 1fr);
    }

    .content-frame-mixed{
      grid-template-columns:minmax(0, 1fr);
      grid-template-rows:minmax(0, 67fr) minmax(0, 33fr);
      gap:1%;
    }

    .content-frame-mixed.mixed-short{
      grid-template-rows:minmax(0, 74fr) minmax(0, 26fr);
    }

    .content-frame-mixed.mixed-medium{
      grid-template-rows:minmax(0, 66fr) minmax(0, 34fr);
    }

    .content-frame-mixed.mixed-long{
      grid-template-rows:minmax(0, 57fr) minmax(0, 43fr);
    }

    .content-frame-mixed.mixed-xlong{
      grid-template-rows:minmax(0, 49fr) minmax(0, 51fr);
    }

    .content-zone{
      width:100%;
      height:100%;
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      box-sizing:border-box;
    }

    .content-image-zone{
      padding:0;
    }

    .content-text-zone{
      padding:1% 2%;
    }

    .cover-text{
      width:88% !important;
      height:auto !important;
      max-width:88% !important;
      max-height:82% !important;
      font-size:var(--fit-font-size, clamp(16px, calc(var(--tile-size) * .23), 42px)) !important;
      line-height:1.08 !important;
      overflow:hidden !important;
      overflow-wrap:normal !important;
      word-break:normal !important;
      white-space:normal !important;
      box-sizing:border-box !important;
    }

    .result-text{
      width:100% !important;
      height:auto !important;
      max-width:100% !important;
      max-height:100% !important;
      min-width:0 !important;
      min-height:0 !important;
      display:block !important;
      text-align:center !important;
      color:#fff !important;
      font-size:var(--fit-font-size, clamp(10px, calc(var(--tile-size) * .18), 34px)) !important;
      line-height:1.07 !important;
      font-weight:900 !important;
      overflow:hidden !important;
      overflow-wrap:normal !important;
      word-break:normal !important;
      white-space:normal !important;
      text-shadow:0 2px 5px rgba(0,0,0,.24) !important;
      padding:0 !important;
      margin:0 !important;
      direction:rtl !important;
      unicode-bidi:plaintext !important;
      box-sizing:border-box !important;
    }

    .result-image{
      width:100% !important;
      height:100% !important;
      max-width:100% !important;
      max-height:100% !important;
      min-width:0 !important;
      min-height:0 !important;
      object-fit:contain !important;
      object-position:center center !important;
      display:block !important;
      background:transparent !important;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.14)) !important;
    }

    .content-frame-mixed .content-image-zone{
      padding:0 1%;
      align-items:flex-start;
    }

    .content-frame-mixed .result-image{
      object-position:center top !important;
    }

    .content-frame-mixed .content-text-zone{
      padding:0 2% 1%;
      align-items:center;
    }

    .content-frame-mixed .result-text{
      line-height:1.04 !important;
    }

    /* v49:
       - منع قص الأجزاء السفلية من الحروف العربية.
       - زيادة ارتفاع السطر وهامش النزول أسفل آخر سطر.
       - إبقاء القص على منطقة المحتوى نفسها، مع السماح للنص بالرسم كاملًا داخلها.
    */
    .content-text-zone{
      padding:1.2% 2.2% 2.8% !important;
      overflow:hidden !important;
    }

    .result-text{
      max-height:none !important;
      overflow:visible !important;
      line-height:1.18 !important;
      padding:.08em 0 .24em !important;
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
    }

    .content-frame-mixed .content-text-zone{
      padding:.4% 2.2% 2.6% !important;
    }

    .content-frame-mixed .result-text{
      line-height:1.16 !important;
      padding:.06em 0 .22em !important;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .right-controls{
      pointer-events:auto;
      position:absolute;
      right:clamp(16px, 2.8vw, 42px);
      bottom:0;
      display:flex;
      align-items:center;
      gap:clamp(8px, 1vw, 12px);
      direction:ltr;
    }

    .back-btn,
    .reset-btn,
    .finish-btn{
      pointer-events:auto;
      position:absolute;
      bottom:0;
      height:clamp(34px, 4.8vh, 44px);
      border:2.5px solid #111;
      border-radius:11px;
      color:#111;
      font-size:clamp(14px, 1.7vw, 19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px, 2vw, 24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .back-btn{
      left:clamp(16px, 2.6vw, 34px);
      background:#efd553;
      min-width:clamp(78px, 8vw, 108px);
    }

    .right-controls .reset-btn,
    .right-controls .finish-btn{
      position:static;
      bottom:auto;
    }

    .reset-btn{
      background:#1688d3;
      color:#fff;
      min-width:clamp(78px, 8vw, 110px);
    }

    .finish-btn{
      background:#e84f4f;
      color:#fff;
      min-width:clamp(78px, 8vw, 110px);
    }




    .back-btn:active,
    .reset-btn:active,
    .finish-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    @media (orientation:portrait){
      .stage{
        inset:0;
        padding-top:calc(90px + var(--safe-top));
        padding-bottom:calc(76px + var(--safe-bottom));
      }
    }

    @media (max-width:560px){
      :root{ --logo-w:92px; }

      .game-logo{
        top:calc(10px + var(--safe-top));
        left:12px;
      }

      .stage{
        inset:0;
        padding:
          calc(76px + var(--safe-top))
          calc(14px + var(--safe-right))
          calc(74px + var(--safe-bottom))
          calc(14px + var(--safe-left));
      }

      .back-btn,
      .reset-btn,
      .finish-btn{
        height:38px;
        border-width:2px;
        border-radius:10px;
        font-size:15px;
        padding:0 14px;
      }
    }

    @media (max-height:520px) and (orientation:landscape){
      :root{ --bottom-space:calc(58px + var(--safe-bottom)); }

      .stage{
        inset:0;
        padding:
          calc(42px + var(--safe-top))
          calc(16px + var(--safe-right))
          calc(62px + var(--safe-bottom))
          calc(16px + var(--safe-left));
      }

      .game-logo{
        width:clamp(78px, 8.8vw, 130px);
        top:calc(10px + var(--safe-top));
      }

      .fixed-controls{
        bottom:calc(8px + var(--safe-bottom));
      }

      .back-btn,
      .reset-btn,
      .finish-btn{
        height:clamp(32px, 8vh, 42px);
        border-width:2px;
        border-radius:10px;
        font-size:clamp(14px, 3.3vh, 20px);
        box-shadow:0 3px 0 rgba(0,0,0,.18);
      }
    }
  
    .box-card{
      --box-cover-text:#fff;
      --box-cover-text-shadow:0 3px 8px rgba(0,0,0,.24);
      --box-result-text:#fff;
      --box-result-text-shadow:0 3px 8px rgba(0,0,0,.26);
      --box-edge:rgba(0,0,0,.18);
    }

    .box-card .cover-text,
    .box-card .panel-number{
      color:var(--box-cover-text) !important;
      text-shadow:var(--box-cover-text-shadow) !important;
    }

    .box-card .result-text{
      color:var(--box-result-text) !important;
      -webkit-text-fill-color:var(--box-result-text) !important;
      text-shadow:var(--box-result-text-shadow) !important;
    }

    .box-card .front-panel{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 0 1.4px var(--box-edge),
        0 5px 8px rgba(0,0,0,.10);
    }

    .box-card.opened .front-panel{
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 0 0 1px var(--box-edge),
        0 1px 2px rgba(0,0,0,.04);
    }

    .box-card .cavity-box::after{
      box-shadow:
        inset 0 0 0 1px var(--box-edge),
        0 7px 13px rgba(0,0,0,.045);
      opacity:.66;
    }

    /* ألوان متعددة للغلاف والحافتين العلوية والسفلية. */
    .game-page.theme-classroom .box-card:nth-child(8n + 1){
      --notebook-hue:0deg;
      --notebook-brightness:1;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 2){
      --notebook-hue:40deg;
      --notebook-brightness:1.03;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 3){
      --notebook-hue:82deg;
      --notebook-brightness:1.05;
      --notebook-cover-text:#ffffff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 4){
      --notebook-hue:128deg;
      --notebook-brightness:.97;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 5){
      --notebook-hue:175deg;
      --notebook-brightness:1;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 6){
      --notebook-hue:218deg;
      --notebook-brightness:.98;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 7){
      --notebook-hue:272deg;
      --notebook-brightness:1;
      --notebook-cover-text:#fff;
    }
    .game-page.theme-classroom .box-card:nth-child(8n + 8){
      --notebook-hue:330deg;
      --notebook-brightness:.98;
      --notebook-cover-text:#fff;
    }

    .game-page.theme-classroom .box-wrap{
      filter:drop-shadow(0 7px 9px rgba(0,0,0,.16));
      transform-style:preserve-3d;
    }

    /*
      جسم المفكرة المفتوحة:
      الورقة والحلقات تبقيان بألوانهما، ويتغير لون الشريط والحافة فقط
      لأن الأبيض والأسود لا يتأثران بتدوير اللون.
    */
    .game-page.theme-classroom .cavity-box{
      opacity:0;
      transform:scale(.975);
      transition:
        opacity .30s ease .10s,
        transform .66s cubic-bezier(.20,.82,.18,1) .08s;
    }

    .game-page.theme-classroom .box-card.opened .cavity-box{
      opacity:1;
      transform:scale(1);
    }

    .game-page.theme-classroom .cavity-box::before{
      inset:0;
      background-image:var(--asset-notebook-open) !important;
      background-repeat:no-repeat !important;
      background-position:center !important;
      background-size:contain !important;
      background-blend-mode:normal !important;
      filter:
        hue-rotate(var(--notebook-hue, 0deg))
        saturate(1.22)
        brightness(var(--notebook-brightness, 1)) !important;
    }

    /*
      غلاف المفكرة المغلق.

    */
    .game-page.theme-classroom .front-panel{
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      border-radius:0 !important;
      background:none !important;
      box-shadow:none !important;
      overflow:visible !important;
      transform-origin:50% 12% !important;
      transform-style:preserve-3d;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .game-page.theme-classroom .front-panel::before{
      content:"" !important;
      display:block !important;
      position:absolute;
      inset:0;
      z-index:0;
      background-image:var(--asset-notebook-cover);
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      filter:
        hue-rotate(var(--notebook-hue, 0deg))
        saturate(1.22)

    /*

    */
    @keyframes classroomNotebookCoverOpen{
      0%{
        opacity:1;
        transform:
          perspective(900px)
          rotateX(0deg)
          translateY(0)
          scale(1);
      }
      44%{
        opacity:1;
        transform:
          perspective(900px)
          rotateX(42deg)
          translateY(-4%)
          scale(.995);
      }
      78%{
        opacity:.92;
        transform:
          perspective(900px)
          rotateX(78deg)
          translateY(-13%)
          scaleY(.82);
      }
      100%{
        opacity:0;
        transform:
          perspective(900px)
          rotateX(88deg)
          translateY(-20%)
          scaleY(.68);
      }
    }

    .game-page.theme-classroom .box-card.opened .front-panel{
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      z-index:21 !important;

      clip-path:none !important;

        classroomNotebookCoverOpen

        cubic-bezier(.20,.72,.20,1)
        both !important;
      will-change:transform, opacity;

    .game-page.theme-classroom .cover-text{

    .game-page.theme-classroom .box-content{

    /*
      v67: ضبط النص على غلاف المفكرة واستغلال مساحة الورقة الداخلية.

    .game-page.theme-classroom .cover-text{

      content:"";

      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:radial-gradient(circle,rgba(239,213,83,.32) 0%,rgba(239,213,83,.14) 34%,rgba(255,255,255,0) 68%);
      animation:activityCelebrationGlow 2.4s ease-in-out infinite;
      pointer-events:none;
    }

    .activity-overlay .celebration-icon{
      position:relative;
      width:clamp(92px,17vw,144px);
      height:clamp(92px,17vw,144px);
      margin-bottom:clamp(12px,2.6vw,20px);
      filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));
      animation:activityIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s;
      z-index:1;
    }

    .activity-overlay .celebration-title{
      position:relative;
      z-index:1;
      margin:0;
      color:#102b57;
      font-size:clamp(34px,6.2vw,64px);

      font-weight:900;
      text-shadow:0 2px 0 rgba(255,255,255,.70);
    }

    .activity-overlay .celebration-subtitle{
      position:relative;
      z-index:1;
      margin:clamp(8px,1.7vw,14px) 0 0;

      font-size:clamp(17px,2.7vw,28px);
      line-height:1.35;
      font-weight:800;
    }

    .activity-overlay .celebration-actions{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,2.2vw,20px);
      margin-top:clamp(22px,4vw,34px);
      flex-wrap:wrap;
    }

    .activity-overlay .celebration-actions button{
      min-width:clamp(118px,18vw,178px);
      height:clamp(44px,6.4vh,58px);
      border:3px solid #111;
      border-radius:15px;
      font-size:clamp(17px,2.5vw,25px);
      font-weight:900;
      line-height:1;
      padding:0 clamp(20px,3vw,32px);
      box-shadow:0 5px 0 rgba(0,0,0,.22);
      cursor:pointer;
      white-space:nowrap;
    }

    .activity-overlay .celebration-actions button:active{
      transform:translateY(2px);
      box-shadow:0 3px 0 rgba(0,0,0,.22);
    }

    .activity-overlay .restart-btn{
      background:linear-gradient(180deg,#2fa7f2 0%,#1688d3 56%,#0d6fb4 100%);
      color:#fff;
    }

    .activity-overlay .home-btn{
      background:linear-gradient(180deg,#ffe56d 0%,#efd553 58%,#dfc13f 100%);
      color:#111;
    }

    .activity-overlay .celebration-confetti{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .activity-overlay .celebration-confetti span{
      position:absolute;
      top:-12vh;
      width:clamp(8px,1.2vw,14px);
      height:clamp(14px,2vw,24px);
      border-radius:4px;
      background:var(--confetti-color,#efd553);
      opacity:.9;
      transform:rotate(var(--confetti-rotate,0deg));
      animation:activityConfettiFall var(--confetti-duration,4.4s) linear infinite;
      animation-delay:var(--confetti-delay,0s);
    }

    .activity-overlay .celebration-spark{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,.28),0 0 18px rgba(239,213,83,.86);
      animation:activitySparkTwinkle 1.8s ease-in-out infinite;
      pointer-events:none;
      z-index:1;
    }

    .activity-overlay .spark-one{left:18%;top:26%;animation-delay:.1s}
    .activity-overlay .spark-two{right:17%;top:31%;animation-delay:.55s}
    .activity-overlay .spark-three{left:24%;bottom:24%;animation-delay:.85s}
    .activity-overlay .spark-four{right:23%;bottom:27%;animation-delay:1.15s}

    .activity-start-card{
      min-height:clamp(250px,40vh,370px) !important;
    }

    .activity-start-btn{
      min-width:clamp(150px,23vw,220px) !important;
    }

    .game-page.activity-ended .stage,
    .game-page.activity-ended .fixed-controls,
    .wheel-page.activity-ended .wheel-stage,
    .wheel-page.activity-ended .fixed-controls,

      visibility:hidden !important;
      pointer-events:none !important;
    }

    @keyframes activityCelebrationPop{
      0%{opacity:0;transform:scale(.82) translateY(20px)}
      70%{opacity:1;transform:scale(1.035) translateY(0)}
      100%{opacity:1;transform:scale(1) translateY(0)}
    }

    @keyframes activityIconPop{
      0%{opacity:0;transform:scale(.5) rotate(-12deg)}
      72%{opacity:1;transform:scale(1.12) rotate(3deg)}
      100%{opacity:1;transform:scale(1) rotate(0)}

    @keyframes activityCelebrationGlow{

    }

    @keyframes activityConfettiFall{

      100%{transform:translate3d(var(--confetti-drift,0px),112vh,0) rotate(calc(var(--confetti-rotate,0deg) + 680deg));opacity:0}
    }

    @keyframes activitySparkTwinkle{
      0%,100%{opacity:.25;transform:scale(.72)}

    }

    @media(max-width:430px){

    .start-gate .celebration-card,

    .start-gate .celebration-card{animation:startCardPop .62s cubic-bezier(.2,1.12,.22,1) both !important}
    .start-gate .celebration-card::before{animation:startGlow 2.4s ease-in-out infinite !important}
    .start-gate .celebration-icon{animation:startIconPop .72s cubic-bezier(.2,1.18,.22,1) both .12s !important}
    .start-gate .celebration-spark{animation:startSpark 1.8s ease-in-out infinite !important}

    ];

    const page = document.getElementById("gamePage");
    const themeBackground = document.getElementById("themeBackground");
    const stage = document.getElementById("stage");
    const grid = document.getElementById("boxGrid");
    const multiAnswerLayer = document.getElementById("multiAnswerLayer");
    const multiAnswerGrid = document.getElementById("multiAnswerGrid");
    const resetBtn = document.getElementById("resetBtn");
    const finishBtn = document.getElementById("finishBtn");
    const backBtn = document.getElementById("backBtn");
    const fixedControls = document.querySelector(".fixed-controls");
    const startGate = document.getElementById("startGate");
    const startGameBtn = document.getElementById("startGameBtn");
    const endCelebration = document.getElementById("endCelebration");
    const endRestartBtn = document.getElementById("endRestartBtn");
    const endHomeBtn = document.getElementById("endHomeBtn");

    /*
      open-box-audio-v1:
      ملفات صوت خارجية بنفس أسلوب صفحة العجلة.
      ضع الملفات الثلاثة داخل مجلد sounds بجانب ملف الصفحة.
    */
    let boxSoundEnabled = true;

    const openBoxAudio = (()=>{
      const SOUND_FILES = {
        open: "sounds/open-box-open.mp3?v=1",
        go: "sounds/open-box-go.mp3?v=2",
        return: "sounds/open-box-return.mp3?v=2",
        finish: "sounds/match-finish.mp3?v=1"
      };

      const VOLUMES = {
        open: 1,
        go: 1,
        return: 1
      };

      /*
        بداية ملفي الذهاب والعودة تحتوي على صمت قصير.
        نتجاوز جزءًا بسيطًا منه حتى يبدأ المؤثر أسرع دون قصه بشكل حاد.
      */
      const START_OFFSETS = {
        open: 0,
        go: 0,
        return: 0
      };

      const cache = {};
      let enabled = true;

      function canPlay(){
        return enabled !== false && boxSoundEnabled !== false;
      }

      function getAudio(name){
        const src = SOUND_FILES[name];
        if (!src) return null;

        if (!cache[name]) {
          const audio = new Audio(src);
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = VOLUMES[name] ?? 1;
          cache[name] = audio;
        }

        return cache[name];
      }

      function stopAll(except = null){
        Object.values(cache).forEach((audio)=>{
          if (!audio || audio === except) return;
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch (_) {}
        });
      }

      function playNamed(name){
        if (!canPlay()) return false;

        const audio = getAudio(name);
        if (!audio) return false;

        try {
          stopAll(audio);
          audio.pause();

          const startOffset = START_OFFSETS[name] ?? 0;
          try {
            if (typeof audio.fastSeek === "function" && startOffset > 0) {
              audio.fastSeek(startOffset);
            } else {
              audio.currentTime = startOffset;
            }
          } catch (_) {
            try { audio.currentTime = 0; } catch (_) {}
          }

          audio.volume = VOLUMES[name] ?? 1;
          audio.playbackRate = 1;

          const promise = audio.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(()=>{});
          }

          return true;
        } catch (_) {
          return false;
        }
      }

      function preload(){
        Object.keys(SOUND_FILES).forEach((name)=>{
          const audio = getAudio(name);
          try { audio?.load?.(); } catch (_) {}
        });
      }

      function unlock(){
        preload();
      }

      function setEnabled(value){
        enabled = value !== false;
        if (!enabled) stopAll();
      }

      function stopNamed(name){
        const audio = cache[name];
        if (!audio) return;
        try {
          audio.pause();
          audio.currentTime = 0;
        } catch (_) {}
      }

      function ready(name){
        const audio = getAudio(name);
        if (!audio || audio.readyState >= 2) return Promise.resolve();
        return new Promise((resolve)=>{
          let done = false;
          const finish = ()=>{
            if (done) return;
            done = true;
            audio.removeEventListener("loadeddata",finish);
            audio.removeEventListener("canplaythrough",finish);
            audio.removeEventListener("error",finish);
            resolve();
          };
          audio.addEventListener("loadeddata",finish,{once:true});
          audio.addEventListener("canplaythrough",finish,{once:true});
          audio.addEventListener("error",finish,{once:true});
          try { audio.load(); } catch (_) {}
          window.setTimeout(finish,900);
        });
      }

      return {
        unlock,
        preload,
        setEnabled,
        stopAll,
        stopNamed,
        ready,
        playOpen: ()=> playNamed("open"),
        playGo: ()=> playNamed("go"),
        playReturn: ()=> playNamed("return"),
        playFinish: ()=> playNamed("finish")
      };
    })();



    /*
      theme-intro-audio-v1:
      تشغيل صوت الثيم مع حركة الزوم الافتتاحية.
      الملفات المطلوبة داخل مجلد sounds بجانب الصفحة.
    */
    const themeIntroAudio = (()=>{
      const SOUND_FILES = {
        default: "sounds/theme-default.mp3?v=1",
        "sky-clouds": "sounds/theme-sky-clouds.mp3?v=1",
        "national-day": "sounds/theme-national-day.mp3?v=1",
        "founding-day": "sounds/theme-founding-day.mp3?v=1"
      };

      let audio = null;
      let currentSrc = "";
      let enabled = true;
      let pendingTheme = "";
      let pendingUntil = 0;
      let unlockArmed = false;

      function normalizeThemeKey(theme){
        const value = String(theme || "").trim().toLowerCase();
        if (["sky","clouds","sky-clouds","theme-sky-clouds","سماء","سماء وغيوم"].includes(value)) {
          return "sky-clouds";
        }
        if (["national-day","theme-national-day","اليوم الوطني"].includes(value)) {
          return "national-day";
        }
        if (["founding-day","theme-founding-day","يوم التأسيس","التأسيس"].includes(value)) {
          return "founding-day";
        }
        return "default";
      }

      function resolveSrc(theme){
        return SOUND_FILES[normalizeThemeKey(theme)] || SOUND_FILES.default;
      }

      function ensureAudio(theme){
        const src = resolveSrc(theme);
        if (!audio || currentSrc !== src) {
          try {
            audio?.pause?.();
          } catch (_) {}

          audio = new Audio(src);
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = 1;
          audio.setAttribute("playsinline", "");
          audio.setAttribute("webkit-playsinline", "");
          currentSrc = src;
        }
        return audio;
      }

      function clearPending(){
        pendingTheme = "";
        pendingUntil = 0;
      }

      function disarmUnlock(){
        if (!unlockArmed) return;
        unlockArmed = false;
        document.removeEventListener("pointerdown", resumePending, true);
        document.removeEventListener("touchstart", resumePending, true);
        document.removeEventListener("keydown", resumePending, true);
      }

      function resumePending(){
        disarmUnlock();
        if (!pendingTheme || performance.now() > pendingUntil) {
          clearPending();
          return;
        }
        const theme = pendingTheme;
        clearPending();
        play(theme, false);
      }

      function armUnlock(){
        if (unlockArmed) return;
        unlockArmed = true;
        document.addEventListener("pointerdown", resumePending, true);
        document.addEventListener("touchstart", resumePending, true);
        document.addEventListener("keydown", resumePending, true);
      }

      function preload(theme){
        if (!enabled) return;
        const target = ensureAudio(theme);
        try { target.load(); } catch (_) {}
      }

      function play(theme, allowFallback = true){
        if (!enabled) return false;
        const target = ensureAudio(theme);

        try {
          target.pause();
          target.currentTime = 0;
          target.volume = 1;
          target.playbackRate = 1;

          const promise = target.play();
          if (promise && typeof promise.then === "function") {
            promise.then(()=>{
              clearPending();
              disarmUnlock();
            }).catch(()=>{
              if (!allowFallback) return;
              pendingTheme = String(theme || "default");
              pendingUntil = performance.now() + 15000;
              armUnlock();
            });
          }
          return true;
        } catch (_) {
          if (allowFallback) {
            pendingTheme = String(theme || "default");
            pendingUntil = performance.now() + 15000;
            armUnlock();
          }
          return false;
        }
      }

      function stop(){
        clearPending();
        disarmUnlock();
        try {
          audio?.pause?.();
          if (audio) audio.currentTime = 0;
        } catch (_) {}
      }

      function setEnabled(value){
        enabled = value !== false;
        if (!enabled) stop();
      }

      window.addEventListener("pagehide", stop, { passive:true });

      return { preload, play, stop, setEnabled };
    })();

    let currentContentType = "text";
    let currentCoverMode = "disabled";
    let multiAnswerEnabled = false;
    let finishSequenceToken = 0;
    let finishSequenceTimers = [];
    let currentTheme = normalizeTheme(getUrlParam("theme") || getSavedTheme() || "white");
    let items = loadItems();
    openBoxAudio.setEnabled(boxSoundEnabled);
    let opened = new Set();
    let answeredBoxes = new Set();
    let answerPanelBoxIndex = -1;
    let focusedIndex = -1;
    let boxZoomAnimationId = null;
    let boxZoomWebAnimation = null;
    let boxFocusState = { scale:1, x:0, y:0 };
    let boxInteractionLocked = false;
    let activeFocusButton = null;
    let selectedBoxIndex = -1;
    let scatterAnimations = new Map();
    let scatterTargets = new Map();
    let safariTimers = [];

    function hexToRgb(hex){
      const clean = String(hex || "").replace("#", "").trim();
      const full = clean.length === 3
        ? clean.split("").map((char)=> char + char).join("")
        : clean;

      if (!/^[0-9a-f]{6}$/i.test(full)) return { r:0, g:0, b:0 };

      return {
        r:parseInt(full.slice(0, 2), 16),
        g:parseInt(full.slice(2, 4), 16),
        b:parseInt(full.slice(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b){
      const toHex = (value)=> Math.max(0, Math.min(255, Math.round(value)))
        .toString(16)
        .padStart(2, "0");
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function mixHexColors(source, target, amount){
      const from = hexToRgb(source);
      const to = hexToRgb(target);
      const ratio = Math.max(0, Math.min(1, Number(amount) || 0));

      return rgbToHex(
        from.r + (to.r - from.r) * ratio,
        from.g + (to.g - from.g) * ratio,
        from.b + (to.b - from.b) * ratio
      );
    }

    function colorBrightness(hex){
      const { r, g, b } = hexToRgb(hex);
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function buildThemeBoxPalette(baseColor, themeId, colorIndex){
      const lightIndexes = THEME_LIGHT_BOX_INDEXES[themeId] || [];
      const isThemeLight = lightIndexes.includes(colorIndex);
      const isNaturallyLight = colorBrightness(baseColor) > 168;
      const isLightSurface = isThemeLight || isNaturallyLight;

      const textList = THEME_BOX_TEXT_COLORS[themeId] || [];
      const pairedText =
        textList[colorIndex % Math.max(1, textList.length)] ||
        (isLightSurface ? "#2E2722" : "#FFFFFF");

      const backFace = mixHexColors(
        baseColor,
        "#000000",
        isLightSurface ? .055 : .30
      );

      const coverTextIsLight = colorBrightness(pairedText) > 170;

      /*
        داخل الصندوق المصوّر يظهر أغمق من لون الغلاف نفسه،
        لذلك لا نعتمد لون الغلاف لتحديد لون النص الداخلي.
        جميع الألوان المتوسطة والداكنة تأخذ نصًا أبيض واضحًا.
        اللون شديد الفاتح فقط يأخذ نصًا داكنًا.
      */
      const resultSurfaceIsVeryLight = colorBrightness(baseColor) >= 235;
      const resultTextColor = themeId === "national-day"
        ? "#FFFFFF"
        : (resultSurfaceIsVeryLight ? "#34261F" : "#FFFFFF");
      const resultTextIsLight = colorBrightness(resultTextColor) > 170;

      return {
        panel:baseColor,
        panelLight:mixHexColors(baseColor, "#ffffff", isLightSurface ? .13 : .28),
        panelDark:mixHexColors(baseColor, "#000000", isLightSurface ? .12 : .24),
        wallTone:mixHexColors(baseColor, "#000000", isLightSurface ? .06 : .12),
        backFace,
        assetTint:baseColor,
        assetBrightness:isLightSurface ? 1.02 : 1.00,
        assetSaturation:isLightSurface ? 1.03 : 1.15,
        coverTextColor:pairedText,
        coverTextShadow:coverTextIsLight
          ? "0 3px 8px rgba(0,0,0,.28)"
          : "0 1px 1px rgba(255,255,255,.48)",
        resultTextColor,
        resultTextShadow:resultTextIsLight
          ? "0 2px 2px rgba(0,0,0,.72), 0 4px 10px rgba(0,0,0,.34)"
          : "0 1px 1px rgba(255,255,255,.72), 0 2px 5px rgba(255,255,255,.34)",
        edgeColor:
          THEME_BOX_EDGE_COLORS[themeId] ||
          mixHexColors(baseColor, "#000000", .30)
      };
    }

    function openEduGamesDb(){
      return new Promise((resolve, reject)=>{
        const request = indexedDB.open("sandooq_edu_games_v1", 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("payloads")) {
            db.createObjectStore("payloads", { keyPath:"key" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("indexedDB failed"));
      });
    }

    async function readPayloadFromIndexedDB(key){
      const db = await openEduGamesDb();

      return new Promise((resolve, reject)=>{
        const tx = db.transaction("payloads", "readonly");
        const request = tx.objectStore("payloads").get(key);
        request.onsuccess = () => resolve(request.result ? request.result.payload : null);
        request.onerror = () => reject(request.error || new Error("payload read failed"));
      });
    }

    function normalizeSoundEnabled(data){
      if (!data || typeof data !== "object") return true;
      if (data.soundEnabled === false) return false;
      if (
        data.sounds &&
        typeof data.sounds === "object" &&
        data.sounds.enabled === false
      ) return false;
      return true;
    }

    function normalizePayloadContentType(payload, source){
      const explicit = String(
        (!Array.isArray(payload) && (payload.contentType || payload.type)) || ""
      ).trim().toLowerCase();

      if (["text", "images", "mixed"].includes(explicit)) return explicit;

      const hasImage = source.some((entry)=>
        Boolean(entry?.imageData || entry?.image || entry?.imageName)
      );
      const hasText = source.some((entry)=>
        Boolean(String(entry?.text || entry?.title || entry?.answer || "").trim())
      );

      if (hasImage && hasText) return "mixed";
      if (hasImage) return "images";
      return "text";
    }

    function normalizeEntryContentType(value, fallback = "text"){
      const type = String(value || fallback || "text").trim().toLowerCase();
      return ["text", "images", "mixed"].includes(type) ? type : "text";
    }

    function normalizeAnswersType(value){
      return String(value || "").trim().toLowerCase() === "images" ? "images" : "text";
    }

    function normalizeAnswerChoices(entry){
      const answersType = normalizeAnswersType(entry?.answersType || entry?.choicesType);
      const choices = (Array.isArray(entry?.choices)
        ? entry.choices
        : Array.isArray(entry?.answers)
          ? entry.answers
          : [])
        .slice(0,6)
        .map((choice)=>(
          {
            text:String(choice?.text || choice?.answer || "").trim(),
            imageData:choice?.imageData || choice?.image || "",
            imageName:choice?.imageName || "",
            isCorrect:Boolean(choice?.isCorrect)
          }
        ));

      let correctChoiceIndex = Number.isInteger(entry?.correctChoiceIndex)
        ? entry.correctChoiceIndex
        : Number.isInteger(entry?.correctIndex)
          ? entry.correctIndex
          : choices.findIndex((choice)=>choice.isCorrect);

      if (correctChoiceIndex < 0 || correctChoiceIndex >= choices.length) {
        correctChoiceIndex = -1;
      }
      choices.forEach((choice,index)=>{ choice.isCorrect = index === correctChoiceIndex; });
      return {answersType,choices,correctChoiceIndex};
    }

    function normalizePayloadCoverMode(payload, source){
      const explicit = String(
        (!Array.isArray(payload) && payload.coverMode) || ""
      ).trim().toLowerCase();

      if (["disabled", "text", "image", "arabic-numbers", "english-numbers"].includes(explicit)) {
        return explicit;
      }

      const hasCoverImage = source.some((entry)=>
        Boolean(entry?.coverImageData || entry?.coverImage || entry?.coverImageName)
      );
      const hasCoverText = source.some((entry)=>
        Boolean(String(entry?.coverText || "").trim())
      );

      if (hasCoverImage) return "image";
      if (hasCoverText) return "text";
      return "disabled";
    }

    function cleanPayloadItems(payload){
      const source = Array.isArray(payload)
        ? payload
        : payload.entries || payload.items || [];

      currentContentType = normalizePayloadContentType(payload, source);
      currentCoverMode = normalizePayloadCoverMode(payload, source);
      const explicitlyEnabled = Boolean(
        !Array.isArray(payload) &&
        (payload.multiAnswerEnabled || payload.multipleAnswersEnabled || payload.boxAnswerMode === "multiple")
      );
      const enabledByUrl = ["1", "true", "multiple"].includes(
        String(getUrlParam("multiAnswer") || "").trim().toLowerCase()
      );
      const hasConfiguredAnswers = source.some((entry)=>{
        const answerData = normalizeAnswerChoices(entry);
        return answerData.choices.length >= 2 && answerData.correctChoiceIndex >= 0;
      });

      // لا نعتمد على علم واحد فقط؛ وجود اختيارات مكتملة يعني أن هذا صندوق متعدد الإجابات.
      multiAnswerEnabled = explicitlyEnabled || enabledByUrl || hasConfiguredAnswers;

      return source
        .map((entry)=> {
          const contentType = normalizeEntryContentType(
            entry?.contentType || entry?.type,
            currentContentType
          );
          const answerData = normalizeAnswerChoices(entry);
          const clean = {
            contentType,
            text:String(entry.text || entry.title || entry.answer || "").trim(),
            imageData:entry.imageData || entry.image || "",
            imageName:entry.imageName || "",
            coverText:String(entry.coverText || "").trim(),
            coverImageData:entry.coverImageData || entry.coverImage || "",
            coverImageName:entry.coverImageName || "",
            answersType:answerData.answersType,
            choices:answerData.choices,
            correctChoiceIndex:answerData.correctChoiceIndex
          };

          if (contentType === "text") {
            clean.imageData = "";
            clean.imageName = "";
          } else if (contentType === "images") {
            clean.text = "";
          }

          if (currentCoverMode === "text") {
            clean.coverImageData = "";
            clean.coverImageName = "";
          } else if (currentCoverMode === "image") {
            clean.coverText = "";
          } else {
            clean.coverText = "";
            clean.coverImageData = "";
            clean.coverImageName = "";
          }

          return clean;
        })
        .filter((entry)=>
          entry.text ||
          entry.imageData ||
          entry.imageName ||
          entry.coverText ||
          entry.coverImageData ||
          entry.coverImageName
        )
        .slice(0, MAX_BOX_ITEMS);
    }

    async function hydrateItemsFromIndexedDB(){
      const payloadId = getUrlParam("payloadId");
      if (!payloadId) return false;

      try {
        const payload = await readPayloadFromIndexedDB(`open-box:${payloadId}`);
        if (!payload) return false;

        const clean = cleanPayloadItems(payload);
        if (!clean.length) return false;

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        boxSoundEnabled = normalizeSoundEnabled(payload);
        openBoxAudio.setEnabled(boxSoundEnabled);
        items = clean;
        return true;
      } catch (_) {
        return false;
      }
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();

      if ([
        "classic","original","white","theme-white","theme-original",
        "خلفية بيضاء","ابيض","أبيض"
      ].includes(raw)) return "white";

      if ([
        "classroom","school","school-classroom","classroom-school",
        "theme-classroom","theme-school","فصل","فصل مدرسة","فصل مدرسي",
        "الفصل","المدرسة"
      ].includes(raw)) return "classroom";

      if ([
        "sky","clouds","sky-clouds","sky_clouds","theme-sky",
        "theme-sky-clouds","سماء","غيوم","سماء وغيوم","سماء و غيوم"
      ].includes(raw)) return "sky-clouds";

      if (["forest","theme-forest","woods","غابة","الغابة"].includes(raw)) {
        return "forest";
      }

      if ([
        "math","maths","mathematics","theme-math","رياضيات","الرياضيات"
      ].includes(raw)) return "math";

      if ([
        "english","eng","english-language","theme-english",
        "انجليزي","الانجليزي","إنجليزي","الإنجليزي"
      ].includes(raw)) return "english";

      if ([
        "flowers","flower","floral","theme-flowers",
        "ازهار وورود","أزهار وورود","ازهار","أزهار","ورود","الورود"
      ].includes(raw)) return "flowers";

      if ([
        "national-day","national_day","nationalday","saudi-national-day",
        "theme-national-day","اليوم الوطني","يوم وطني","الوطني"
      ].includes(raw)) return "national-day";

      if ([
        "founding-day","founding_day","foundingday","saudi-founding-day",
        "theme-founding-day","يوم التأسيس","التأسيس","يوم التاسيس","تأسيس"
      ].includes(raw)) return "founding-day";

      return "white";
    }

    function loadItems(){
      try {
        const payloadId = getUrlParam("payloadId");
        const raw =
          (payloadId ? sessionStorage.getItem(`sandooq_open_box_payload_v1_${payloadId}`) : "") ||
          sessionStorage.getItem("sandooq_open_box_payload_v1") ||
          sessionStorage.getItem("sandooq_open_box_draft_v1") ||
          (payloadId ? localStorage.getItem(`sandooq_open_box_payload_v1_${payloadId}`) : "") ||
          localStorage.getItem("sandooq_open_box_payload_v1") ||
          localStorage.getItem("sandooq_open_box_draft_v1") ||
          "";
        if (!raw) return DEMO_ITEMS;

        const payload = JSON.parse(raw);
        const clean = cleanPayloadItems(payload);

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        boxSoundEnabled = normalizeSoundEnabled(payload);
        return clean.length ? clean : DEMO_ITEMS;
      } catch (_) {
        return DEMO_ITEMS;
      }
    }
