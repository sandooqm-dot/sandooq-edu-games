    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    /*
      open-box-safari-scroll-v1:
      نفس نظام صفحة العجلة لإعطاء Safari مساحة تمرير صغيرة
      مع بقاء اللعبة مثبتة داخل الشاشة.
    */
    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:none;
    }

    /* نفس خلفيات وثيمات العجلة تمامًا */
    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-color:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1);
      transform-origin:center center;
      will-change:transform, opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .game-page.theme-white{
      background:#fff;
    }

    .game-page.theme-white .theme-background{
      opacity:0;
      background-image:none;
    }

    .game-page.theme-classroom .theme-background{
      opacity:1;
      background-color:#fff;
      background-image:
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        url("theme-original.webp?v=45"),
        url("theme-original.png?v=45");
    }

    .game-page.theme-sky-clouds .theme-background{
      opacity:1;
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        url("theme-sky-clouds.webp?v=45"),
        url("theme-sky-clouds.png?v=45");
    }

    .game-page.theme-forest .theme-background{
      opacity:1;
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .game-page.theme-math .theme-background{
      opacity:1;
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .game-page.theme-english .theme-background{
      opacity:1;
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#72d0d2 100%);
    }

    .game-page.theme-flowers .theme-background{
      opacity:1;
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .game-page.theme-national-day .theme-background{
      opacity:1;
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .game-page.theme-founding-day .theme-background{
      opacity:1;
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    /*
      نفس حركة افتتاح العجلة:
      وقفة قصيرة، ثم اقتراب المشهد والصناديق ببطء مع تكبير الخلفية.
    */
    :root{
      --intro-duration:8.60s;
      --intro-bg-final-scale:1.12;
    }

    .fixed-controls{
      transition:opacity .34s ease, transform .34s ease;
    }

    .game-page.intro-playing .fixed-controls{
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
    }

    .game-page.intro-playing .stage{
      transform-origin:center center;
      transform:translate3d(0,0,0) scale(1);
      pointer-events:none;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    /* لا تظهر الشبكة نهائيًا أثناء زوم الخلفية. */
    .game-page.intro-camera .box-grid{
      visibility:hidden;
    }

    /*
      بعد ثبات الكاميرا تصبح الشبكة مرئية، لكن كل صندوق يكون
      خارج المشهد وشفافيته صفر قبل تشغيل حركة العودة.
    */
    .game-page.intro-boxes-entering .box-grid{
      visibility:visible;
    }

    .game-page.intro-playing .theme-background{
      transform:translate3d(0,0,0) scale(1);
      will-change:transform, opacity;
    }

    .game-page.intro-done .theme-background{
      transform:translate3d(0,0,0) scale(var(--intro-bg-final-scale));
    }

    .game-page.intro-playing .game-logo{
      animation:introLogoFade .75s ease-out both;
    }

    @keyframes introLogoFade{
      0%{ opacity:0; transform:translateY(-8px); }
      100%{ opacity:1; transform:translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      .game-page.intro-playing .stage,
      .game-page.intro-playing .game-logo,
      .game-page.intro-playing .theme-background,
      .game-page.intro-boxes-entering .box-card{
        animation:none !important;
      }
    }

    .game-logo{
      position:absolute;
      top:clamp(10px, 1.7vw, 22px);
      left:clamp(12px, 2vw, 30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px, 9vw, 120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        calc(72px + var(--safe-top))
        calc(var(--edge-guard) + var(--safe-right))
        calc(82px + var(--safe-bottom))
        calc(var(--edge-guard) + var(--safe-left));
      direction:ltr;
      transform-origin:center center;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
    }

    .box-grid{
      width:max-content;
      height:max-content;
      max-width:100%;
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols, 4), var(--tile-size));
      justify-content:center;
      align-content:center;
      gap:var(--tile-gap);
      transform-origin:0 0;
      transform:translate3d(0, 0, 0) scale(1);
      will-change:transform;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout style;
      isolation:isolate;
    }

    .stage{

    /*
      open-box-v25:
      - إعادة ضبط هندسة الصندوق المفتوح لتطابق المرجع.
      - إزالة إحساس الإطار، والاعتماد على منظور ثلاثي الأبعاد فعلي.
      - جميع الجوانب بنفس اللون الأساسي مع تظليل خفيف فقط.
      - فواصل الزوايا قصيرة وخفيفة مثل المرجع، وليست خطوط إطار.
    */
    /* v50:
       - اختيار الصندوق لا يفتحه مباشرة.
       - الصناديق الأخرى تبتعد خارج المشهد، والصندوق المختار ينتقل للمنتصف.
       - زر فتح مستقل يظهر بعد اكتمال حركة التركيز.
       - ضغطة لاحقة على الشاشة تعيد جميع الصناديق إلى مواقعها.
    */
    .box-card{
      transform:translate3d(0, 0, 0) scale(1);
      opacity:1;
      will-change:transform, opacity;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      contain:layout paint style;
    }

    .box-card.focus-selected{
      z-index:55;
      opacity:1;
    }

    .box-card.focus-away{
      pointer-events:none;
    }

    .box-grid.motion-active .box-card{
      pointer-events:none;
    }

    .box-grid.focus-mode .box-card:not(.focus-selected){
      user-select:none;
      -webkit-user-select:none;
    }

    .front-panel{
      z-index:12;

      align-items:center;

    /* v34:
       - إزالة الدوائر/البقع الشفافة من الغطاء بالكامل.
       - إزالة اللمعة البيضاوية من الصناديق المغلقة والغطاء المتحرك.
       - الإبقاء على حركة الغطاء والغطاء العلوي الثابت كما في الإصدار السابق.
    */
    .box-card{
      --asset-tint:#b8dd55;
      --asset-body-brightness:1.04;
      --asset-lid-brightness:1.04;
      --asset-saturation:1.18;

    .box-blue{ --asset-tint:#35a8ef; --asset-body-brightness:1.04; --asset-lid-brightness:1.04; --asset-saturation:1.22; }
    .box-green{ --asset-tint:#42bf55; --asset-body-brightness:1.00; --asset-lid-brightness:1.00; --asset-saturation:1.24; }
    .box-orange{ --asset-tint:#f59a32; --asset-body-brightness:1.03; --asset-lid-brightness:1.03; --asset-saturation:1.23; }
    .box-purple{ --asset-tint:#8e67f1; --asset-body-brightness:1.01; --asset-lid-brightness:1.01; --asset-saturation:1.22; }
    .box-red{ --asset-tint:#e8425a; --asset-body-brightness:1.00; --asset-lid-brightness:1.00; --asset-saturation:1.24; }
    .box-teal{ --asset-tint:#3dc6b5; --asset-body-brightness:1.02; --asset-lid-brightness:1.02; --asset-saturation:1.22; }

    .box-wrap{
      filter:drop-shadow(0 6px 11px var(--shadow));
    }

    .cavity-box{
      opacity:0;
      transform:scale(.985);
      transition:opacity .42s ease .10s, transform .72s cubic-bezier(.20,.82,.18,1) .08s;
    }

    .box-card.opened .cavity-box{
      opacity:1;
      transform:scale(1);

    .cavity-box .box-back,
    .cavity-box .wall{
      display:none !important;

    .cavity-box::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      background-image:
        linear-gradient(var(--asset-tint), var(--asset-tint)),
        var(--asset-open-body);
      background-repeat:no-repeat, no-repeat;
      background-position:center, center;
      background-size:100% 100%, 100% 100%;
      background-blend-mode:color;
      filter:brightness(var(--asset-body-brightness)) saturate(var(--asset-saturation));
      pointer-events:none;
    }

    .cavity-box::after{
      content:"";
      position:absolute;
      inset:8% 4% 4%;
      z-index:2;
      border-radius:4px;
      box-shadow:0 7px 13px rgba(0,0,0,.045);
      pointer-events:none;
      background:none;

    /* الغطاء الثابت النهائي: يبقى ظاهرًا أعلى الصندوق المفتوح */
    .box-wrap::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:8.9%;
      z-index:18;

      background-image:

      background-size:100% 100%, 100% 100%;

      pointer-events:none;
    }

    .box-card.opened .box-wrap::after{
      opacity:1;
    }

    /* الغطاء المتحرك المؤقت: كامل في البداية، ثم يختفي من الأسفل حتى يلتقي بالغطاء الثابت */
    @keyframes assetMovingCover{
      0%{

      84.1%{
        opacity:0;
        transform:translateY(-2.2%) scale(1);
        clip-path:inset(0 0 91.1% 0 round 0);
      }
      100%{
        opacity:0;
        transform:translateY(-2.2%) scale(1);
        clip-path:inset(0 0 91.1% 0 round 0);
      }

    .box-card.opened .front-panel{

      top:29%;
      bottom:18.5%;
      z-index:6;
    }

    .box-card.opened .box-content{
      opacity:1;
      transform:translateY(0);
    }

       - استخدام كامل التجويف الداخلي الآمن للمحتوى.

    const DEMO_ITEMS = [

    /*
      open-box-audio-v1:
      ملفات صوت خارجية بنفس أسلوب صفحة العجلة.
      ضع الملفات الثلاثة داخل مجلد sounds بجانب ملف الصفحة.
    */
    let boxSoundEnabled = true;

    const openBoxAudio = (()=>{
      const SOUND_FILES = {
        open: "sounds/open-box-open.mp3?v=1",
        go: "sounds/open-box-go.mp3?v=1",
        return: "sounds/open-box-return.mp3?v=1"
      };

      const VOLUMES = {
        open: 1,
        go: 0.70,
        return: 0.70
      };

      /*
        بداية ملفي الذهاب والعودة تحتوي على صمت قصير.
        نتجاوز جزءًا بسيطًا منه حتى يبدأ المؤثر أسرع دون قصه بشكل حاد.
      */
      const START_OFFSETS = {
        open: 0,
        go: 0.22,
        return: 0.12
      };

      const cache = {};
      let enabled = true;

      function canPlay(){
        return enabled !== false && boxSoundEnabled !== false;
      }

      function getAudio(name){
        const src = SOUND_FILES[name];
        if (!src) return null;

        if (!cache[name]) {
          const audio = new Audio(src);
          audio.preload = "auto";
          audio.loop = false;
          audio.volume = VOLUMES[name] ?? 1;
          cache[name] = audio;
        }

        return cache[name];
      }

      function stopAll(except = null){
        Object.values(cache).forEach((audio)=>{
          if (!audio || audio === except) return;
          try {
            audio.pause();
            audio.currentTime = 0;
          } catch (_) {}
        });
      }

      function playNamed(name){
        if (!canPlay()) return false;

        const audio = getAudio(name);
        if (!audio) return false;

        try {
          stopAll(audio);
          audio.pause();

          const startOffset = START_OFFSETS[name] ?? 0;
          try {
            if (typeof audio.fastSeek === "function" && startOffset > 0) {
              audio.fastSeek(startOffset);
            } else {
              audio.currentTime = startOffset;
            }
          } catch (_) {
            try { audio.currentTime = 0; } catch (_) {}
          }

          audio.volume = VOLUMES[name] ?? 1;
          audio.playbackRate = 1;

          const promise = audio.play();
          if (promise && typeof promise.catch === "function") {
            promise.catch(()=>{});
          }

          return true;
        } catch (_) {
          return false;
        }
      }

      function preload(){
        Object.keys(SOUND_FILES).forEach((name)=>{
          const audio = getAudio(name);
          try { audio?.load?.(); } catch (_) {}
        });
      }

      function unlock(){
        preload();
      }

      function setEnabled(value){
        enabled = value !== false;
        if (!enabled) stopAll();
      }

      return {
        unlock,
        preload,
        setEnabled,
        stopAll,
        playOpen: ()=> playNamed("open"),
        playGo: ()=> playNamed("go"),
        playReturn: ()=> playNamed("return")
      };
    })();

      const palette = BOX_COLOR_PALETTES[index % BOX_COLOR_PALETTES.length];
      const [
        panel,
        panelLight,
        panelDark,
        wallTone,
        backFace,
        assetTint,
        assetBrightness,
        assetSaturation
      ] = palette;

      button.style.setProperty("--panel", panel);

      button.style.setProperty("--panel-dark", panelDark);

      button.style.setProperty("--asset-lid-brightness", String(assetBrightness));
      button.style.setProperty("--asset-saturation", String(assetSaturation));
    }

    function getUrlParam(name){
      try {
        return new URLSearchParams(window.location.search || "").get(name) || "";
      } catch (_) {
        return "";
      }
    }

    function openEduGamesDb(){
      return new Promise((resolve, reject)=>{
        const request = indexedDB.open("sandooq_edu_games_v1", 1);

        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("payloads")) {
            db.createObjectStore("payloads", { keyPath:"key" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("indexedDB failed"));
      });
    }

    async function readPayloadFromIndexedDB(key){
      const db = await openEduGamesDb();

      return new Promise((resolve, reject)=>{
        const tx = db.transaction("payloads", "readonly");
        const request = tx.objectStore("payloads").get(key);
        request.onsuccess = () => resolve(request.result ? request.result.payload : null);
        request.onerror = () => reject(request.error || new Error("payload read failed"));
      });
    }

    function normalizeSoundEnabled(data){
      if (!data || typeof data !== "object") return true;
      if (data.soundEnabled === false) return false;
      if (
        data.sounds &&
        typeof data.sounds === "object" &&
        data.sounds.enabled === false
      ) return false;
      return true;
    }

    function cleanPayloadItems(payload){
      const source = Array.isArray(payload) ? payload : payload.entries || payload.items || [];
      return source
        .map((entry)=> ({
          text: String(entry.text || entry.title || entry.answer || "").trim(),
          imageData: entry.imageData || entry.image || "",
          imageName: entry.imageName || "",
          coverText: String(entry.coverText || "").trim(),
          coverImageData: entry.coverImageData || entry.coverImage || "",
          coverImageName: entry.coverImageName || ""
        }))
        .filter((entry)=> entry.text || entry.imageData || entry.imageName || entry.coverText || entry.coverImageData || entry.coverImageName)
        .slice(0, MAX_BOX_ITEMS);
    }

    async function hydrateItemsFromIndexedDB(){
      const payloadId = getUrlParam("payloadId");
      if (!payloadId) return false;

      try {
        const payload = await readPayloadFromIndexedDB(`open-box:${payloadId}`);
        if (!payload) return false;

        const clean = cleanPayloadItems(payload);
        if (!clean.length) return false;

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        boxSoundEnabled = normalizeSoundEnabled(payload);
        openBoxAudio.setEnabled(boxSoundEnabled);
        items = clean;
        return true;
      } catch (_) {
        return false;
      }
    }

    function getSavedTheme(){
      try {
        return sessionStorage.getItem("sandooq_edu_box_theme_v1") || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();

      if ([
        "classic","original","white","theme-white","theme-original",
        "خلفية بيضاء","ابيض","أبيض"
      ].includes(raw)) return "white";

      if ([
        "classroom","school","school-classroom","classroom-school",
        "theme-classroom","theme-school","فصل","فصل مدرسة","فصل مدرسي",
        "الفصل","المدرسة"
      ].includes(raw)) return "classroom";

      if ([
        "sky","clouds","sky-clouds","sky_clouds","theme-sky",
        "theme-sky-clouds","سماء","غيوم","سماء وغيوم","سماء و غيوم"
      ].includes(raw)) return "sky-clouds";

      if (["forest","theme-forest","woods","غابة","الغابة"].includes(raw)) {
        return "forest";
      }

      if ([
        "math","maths","mathematics","theme-math","رياضيات","الرياضيات"
      ].includes(raw)) return "math";

      if ([
        "english","eng","english-language","theme-english",
        "انجليزي","الانجليزي","إنجليزي","الإنجليزي"
      ].includes(raw)) return "english";

      if ([
        "flowers","flower","floral","theme-flowers",
        "ازهار وورود","أزهار وورود","ازهار","أزهار","ورود","الورود"
      ].includes(raw)) return "flowers";

      if ([
        "national-day","national_day","nationalday","saudi-national-day",
        "theme-national-day","اليوم الوطني","يوم وطني","الوطني"
      ].includes(raw)) return "national-day";

      if ([
        "founding-day","founding_day","foundingday","saudi-founding-day",
        "theme-founding-day","يوم التأسيس","التأسيس","يوم التاسيس","تأسيس"
      ].includes(raw)) return "founding-day";

      return "white";
    }

    function loadItems(){
      try {
        const payloadId = getUrlParam("payloadId");
        const raw =
          (payloadId ? sessionStorage.getItem(`sandooq_open_box_payload_v1_${payloadId}`) : "") ||
          sessionStorage.getItem("sandooq_open_box_payload_v1") ||
          sessionStorage.getItem("sandooq_open_box_draft_v1") ||
          "";
        if (!raw) return DEMO_ITEMS;

        const payload = JSON.parse(raw);
        const clean = cleanPayloadItems(payload);

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        boxSoundEnabled = normalizeSoundEnabled(payload);
        return clean.length ? clean : DEMO_ITEMS;
      } catch (_) {
        return DEMO_ITEMS;
      }
    }

    function applyTheme(themeId){
      currentTheme = normalizeTheme(themeId);

      page.classList.remove(
        "theme-white",
        "theme-classroom",
        "theme-sky-clouds",
        "theme-forest",
        "theme-math",
        "theme-english",
        "theme-flowers",
        "theme-national-day",
        "theme-founding-day"
      );
      page.classList.add(`theme-${currentTheme}`);

      // تطبيق احتياطي مباشر مطابق للعجلة حتى تظهر الخلفية رغم الكاش.
      if (themeBackground) {
        themeBackground.style.opacity = currentTheme === "white" ? "0" : "1";
        themeBackground.style.backgroundColor = "#fff";
        themeBackground.style.backgroundImage = "none";

        if (currentTheme === "classroom") {
          themeBackground.style.backgroundColor = "#fff";
          themeBackground.style.backgroundImage = [
            'url("theme-original-bg.webp?v=45")',
            'url("theme-original-bg.png?v=45")',
            'url("theme-original.webp?v=45")',
            'url("theme-original.png?v=45")'
          ].join(", ");
        }

        if (currentTheme === "sky-clouds") {
          themeBackground.style.backgroundColor = "#58c7f3";
          themeBackground.style.backgroundImage = [
            'url("theme-sky-clouds-bg.webp?v=45")',
            'url("theme-sky-clouds-bg.png?v=45")',
            'url("theme-sky-clouds.webp?v=45")',
            'url("theme-sky-clouds.png?v=45")'
          ].join(", ");
        }

        if (currentTheme === "forest") {
          themeBackground.style.backgroundColor = "#6ec9ee";
          themeBackground.style.backgroundImage = [
            'url("theme-forest-bg.webp?v=45")',
            'linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%)'
          ].join(", ");
        }

          themeBackground.style.backgroundImage = [

      try { sessionStorage.setItem("sandooq_edu_box_theme_v1", currentTheme); } catch (_) {}
    }

    function getVisualViewportMetrics(){
      const vv = window.visualViewport;
      const layoutWidth = Math.max(
        280,
        document.documentElement.clientWidth || 0,
        window.innerWidth || 0
      );
      const layoutHeight = Math.max(
        260,
        page?.clientHeight || 0,
        document.documentElement.clientHeight || 0,
        window.innerHeight || 0
      );

      const width = Math.max(
        280,
        Math.min(layoutWidth, Number(vv?.width) || layoutWidth)
      );
      const height = Math.max(
        260,
        Math.min(layoutHeight, Number(vv?.height) || layoutHeight)
      );

      return {
        width,
        height,
        offsetLeft:Math.max(0, Number(vv?.offsetLeft) || 0),
        scale:Math.max(1, Number(vv?.scale) || 1)
      };
    }

    function syncVisualViewportFrame(force = false){
      if (introLayoutFrozen && !force) {
        pendingViewportLayout = true;
        return false;
      }

      const metrics = getVisualViewportMetrics();

      /*
        عند تكبير صفحة Safari يصبح visualViewport أضيق من layout viewport.
        نضع منطقة الصناديق داخل المساحة المرئية الحقيقية بدل إبقائها
        متمركزة داخل مساحة أكبر تُقص أطرافها.
      */
      stage.style.left = `${metrics.offsetLeft.toFixed(2)}px`;
      stage.style.right = "auto";
      stage.style.top = "0px";
      stage.style.bottom = "auto";
      stage.style.width = `${metrics.width.toFixed(2)}px`;
      stage.style.height = `${metrics.height.toFixed(2)}px`;

      page.style.setProperty("--visual-viewport-width", `${metrics.width}px`);
      page.style.setProperty("--visual-viewport-height", `${metrics.height}px`);
      return true;
    }

    function calculateLayout(count){
      const metrics = getVisualViewportMetrics();
      const styles = window.getComputedStyle(stage);

      const padX =
        parseFloat(styles.paddingLeft || "0") +
        parseFloat(styles.paddingRight || "0");
      const padY =
        parseFloat(styles.paddingTop || "0") +
        parseFloat(styles.paddingBottom || "0");

      /*
        clientWidth/clientHeight لا يتأثران بحركة scale الخاصة بالانترو،
        بعكس getBoundingClientRect الذي كان يجعل الصناديق تُحسب صغيرة ثم
        تكبر فجأة عند نهاية الحركة.
      */
      const stageWidth = Math.max(
        280,
        Math.min(stage.clientWidth || metrics.width, metrics.width)
      );
      const stageHeight = Math.max(
        260,
        Math.min(stage.clientHeight || metrics.height, metrics.height)
      );

      const width = Math.max(220, stageWidth - padX - 4);
      const height = Math.max(190, stageHeight - padY - 4);
      const total = Math.max(1, Math.min(MAX_BOX_ITEMS, count || 1));
      const isPortrait = height > width;

      const maxCols = Math.min(total, isPortrait ? 5 : 10);
      const minCols = isPortrait ? Math.min(total, 2) : Math.min(total, 2);
      const baseGap = total > 24 ? 7 : total > 16 ? 9 : total > 10 ? 12 : 20;
      const maxTile = total > 24 ? 112 : total > 16 ? 124 : total > 10 ? 138 : 152;

      let best = null;

      for (let cols = Math.max(1, minCols); cols <= maxCols; cols += 1) {
        const rows = Math.ceil(total / cols);
        const gap = baseGap;
        const tileByWidth = Math.floor((width - gap * (cols - 1)) / cols);
        const tileByHeight = Math.floor((height - gap * (rows - 1)) / rows);
        const size = Math.min(maxTile, tileByWidth, tileByHeight);

        if (size <= 0) continue;

        const gridWidth = cols * size + gap * Math.max(0, cols - 1);
        const gridHeight = rows * size + gap * Math.max(0, rows - 1);
        const unusedSlots = cols * rows - total;
        const aspectPenalty = Math.abs(cols / rows - width / Math.max(1, height)) * 3;
        const rowBalance = Math.abs(rows - Math.ceil(Math.sqrt(total))) * 2;
        const edgePenalty =
          Math.max(0, gridWidth - width) * 100 +
          Math.max(0, gridHeight - height) * 100;
        const score =
          size * 100 -
          unusedSlots * 7 -
          aspectPenalty -
          rowBalance -
          edgePenalty;

        if (!best || score > best.score) {
          best = {
            cols,
            rows,
            gap,
            size,
            gridWidth,
            gridHeight,
            score
          };
        }
      }

      if (!best) {
        const cols = isPortrait ? Math.min(total, 3) : Math.min(total, 8);
        const rows = Math.ceil(total / Math.max(1, cols));
        const gap = 6;
        const size = Math.max(34, Math.min(
          maxTile,
          Math.floor((width - gap * Math.max(0, cols - 1)) / Math.max(1, cols)),
          Math.floor((height - gap * Math.max(0, rows - 1)) / Math.max(1, rows))
        ));

        best = {
          cols:Math.max(1, cols),
          rows,
          gap,
          size,
          gridWidth:Math.max(1, cols) * size + gap * Math.max(0, cols - 1),
          gridHeight:rows * size + gap * Math.max(0, rows - 1)
        };
      }

      return {
        cols:best.cols,
        rows:best.rows,
        gap:Math.max(5, best.gap),
        size:Math.max(34, best.size),
        gridWidth:best.gridWidth,
        gridHeight:best.gridHeight
      };
    }

    function applyLayout(options = {}){
      const force = options.force === true;

      if (introLayoutFrozen && !force) {
        pendingViewportLayout = true;
        return false;
      }

      const layout = calculateLayout(items.length);

      grid.style.setProperty("--cols", String(layout.cols));
      grid.style.setProperty("--tile-gap", `${layout.gap}px`);
      grid.style.setProperty("--tile-size", `${layout.size}px`);
      grid.style.width = `${layout.gridWidth}px`;
      grid.style.height = `${layout.gridHeight}px`;

      document.documentElement.style.setProperty("--tile-gap", `${layout.gap}px`);
      document.documentElement.style.setProperty("--tile-size", `${layout.size}px`);
      return true;
    }

    function refreshResponsiveLayout(options = {}){
      const force = options.force === true;

      if ((introLayoutFrozen || boxInteractionLocked) && !force) {
        pendingViewportLayout = true;
        return;
      }

      syncVisualViewportFrame(force);
      applyLayout({ force });

      requestAnimationFrame(()=>{
        if (focusedIndex >= 0 && activeFocusButton && !boxInteractionLocked) {
          const target = getBoxZoomTarget(activeFocusButton);
          setBoxFocusState(target.scale, target.x, target.y);
        } else if (focusedIndex < 0) {
          setBoxFocusState(1, 0, 0);
        }

        fitAllBoxText();
      });

      pendingViewportLayout = false;
    }

    function scheduleResponsiveLayout(delay = 0){
      if (introLayoutFrozen || boxInteractionLocked) {
        pendingViewportLayout = true;
        return;
      }

      if (viewportLayoutFrame) {
        cancelAnimationFrame(viewportLayoutFrame);
        viewportLayoutFrame = null;
      }

      if (viewportLayoutTimer) {
        clearTimeout(viewportLayoutTimer);
        viewportLayoutTimer = null;
      }

      const run = ()=>{
        viewportLayoutFrame = requestAnimationFrame(()=>{
          viewportLayoutFrame = null;
          refreshResponsiveLayout();
        });
      };

      if (delay > 0) {
        viewportLayoutTimer = setTimeout(()=>{
          viewportLayoutTimer = null;
          run();
        }, delay);
      } else {
        run();
      }
    }

    function renderBoxes(){
      applyLayout();
      grid.innerHTML = "";

      items.forEach((entry, index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "box-card";
        applyBoxPalette(button, index);
        button.setAttribute("aria-label", `صندوق رقم ${index + 1}`);
        button.setAttribute("aria-pressed", "false");
        button.dataset.index = String(index);

        const wrap = document.createElement("span");
        wrap.className = "box-wrap";

        const cavity = document.createElement("span");
        cavity.className = "cavity-box";

        const back = document.createElement("span");
        back.className = "box-back";

        const topWall = document.createElement("span");
        topWall.className = "wall wall-top";

        const rightWall = document.createElement("span");
        rightWall.className = "wall wall-right";

        const bottomWall = document.createElement("span");
        bottomWall.className = "wall wall-bottom";

        const leftWall = document.createElement("span");
        leftWall.className = "wall wall-left";

        const content = document.createElement("span");
        const contentKind = getEntryKind(entry);
        content.className = `box-content content-${contentKind}`;
        content.appendChild(createResultContent(entry, contentKind));

        cavity.appendChild(back);
        cavity.appendChild(topWall);
        cavity.appendChild(rightWall);
        cavity.appendChild(bottomWall);
        cavity.appendChild(leftWall);
        cavity.appendChild(content);

        const panel = document.createElement("span");
        panel.className = "front-panel";

        panel.appendChild(createCoverContent(entry, index));

        wrap.appendChild(cavity);
        wrap.appendChild(panel);
        button.appendChild(wrap);

        button.addEventListener("click", (event)=>{
          handleBoxClick(event, button, index);
        });

        grid.appendChild(button);
      });

      requestAnimationFrame(fitAllBoxText);
    }

    function createCoverContent(entry, index){
      if (entry.coverImageData || entry.coverImageName) {
        const img = document.createElement("img");
        img.className = "cover-image";
        img.alt = "";
        img.src = entry.coverImageData || entry.coverImageName;
        return img;
      }

      if (String(entry.coverText || "").trim()) {
        const text = document.createElement("span");
        text.className = "cover-text fit-text";
        text.dataset.fitText = "cover";
        text.textContent = String(entry.coverText || "").trim();
        return text;
      }

      const number = document.createElement("span");
      number.className = "panel-number";
      number.textContent = String(index + 1);
      return number;
    }

    function getEntryKind(entry){
      const hasImage = Boolean(entry.imageData || entry.imageName);
      const hasText = Boolean(String(entry.text || "").trim());
      if (hasImage && hasText) return "mixed";
      if (hasImage) return "image";
      return "text";
    }

    function createResultContent(entry, kind){
      const hasImage = Boolean(entry.imageData || entry.imageName);
      const cleanText = String(entry.text || "").trim();
      const hasText = Boolean(cleanText);

      const frame = document.createElement("span");
      frame.className = `content-frame content-frame-${kind}`;

      const createImageZone = () => {
        const zone = document.createElement("span");
        zone.className = "content-zone content-image-zone";

        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        img.addEventListener("load", ()=> {
          requestAnimationFrame(()=> fitOpenedBoxContent(img.closest(".box-card")));
        }, { once:true });

        zone.appendChild(img);
        return zone;
      };

      const createTextZone = (mode) => {
        const zone = document.createElement("span");
        zone.className = "content-zone content-text-zone";

        const text = document.createElement("span");
        text.className = "result-text fit-text";
        text.dataset.fitText = mode;
        text.textContent = cleanText || "—";

        zone.appendChild(text);
        return zone;
      };

      if (hasImage && hasText) {
        const textLength = Array.from(cleanText.replace(/\s+/g, " ")).length;
        const lengthClass = textLength <= 18
          ? "mixed-short"
          : textLength <= 42
            ? "mixed-medium"
            : textLength <= 78
              ? "mixed-long"
              : "mixed-xlong";

        frame.classList.add(lengthClass);
        frame.appendChild(createImageZone());
        frame.appendChild(createTextZone("mixed"));
        return frame;
      }

      if (hasImage) {
        frame.appendChild(createImageZone());
        return frame;
      }

      frame.appendChild(createTextZone("text"));
      return frame;
    }

    function fitAllBoxText(){
      document
        .querySelectorAll(".box-card:not(.opened) .cover-text.fit-text")
        .forEach((el)=> fitTextInsideBox(el));

      document
        .querySelectorAll(".box-card.opened .result-text.fit-text")
        .forEach((el)=> fitTextInsideBox(el));
    }

    function fitOpenedBoxContent(card){
      if (!card || !card.classList.contains("opened")) return;
      card.querySelectorAll(".result-text.fit-text").forEach((el)=> fitTextInsideBox(el));
    }

    function fitClosedCoverText(card){
      if (!card || card.classList.contains("opened")) return;
      card.querySelectorAll(".cover-text.fit-text").forEach((el)=> fitTextInsideBox(el));
    }

    function fitTextInsideBox(el){
      const mode = el.dataset.fitText || "text";
      const isCover = mode === "cover";
      const card = el.closest(".box-card");

      // لا نقيس الغلاف بعد فتح الصندوق؛ وقتها يتحول الغلاف إلى شريط علوي صغير.
      if (isCover && card?.classList.contains("opened")) return;

      const zone = isCover
        ? el.closest(".front-panel")
        : el.closest(".content-text-zone");

      if (!zone) return;

      const zoneWidth = Math.max(0, zone.clientWidth);
      const zoneHeight = Math.max(0, zone.clientHeight);
      if (zoneWidth < 2 || zoneHeight < 2) return;

      const tile = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--tile-size")
      ) || zoneWidth;

      const availableWidth = isCover
        ? Math.max(1, zoneWidth * .88)
        : Math.max(1, zoneWidth - 2);

      const availableHeight = isCover
        ? Math.max(1, zoneHeight * .82)
        : Math.max(1, zoneHeight - 2);

      const maxFont = isCover
        ? Math.min(tile * .29, availableWidth * .24, availableHeight * .50, 46)
        : mode === "mixed"
          ? Math.min(tile * .23, availableWidth * .24, availableHeight * .62, 36)
          : Math.min(tile * .38, availableWidth * .31, availableHeight * .48, 60);

      const minFont = isCover
        ? Math.max(13, Math.min(tile * .085, 18))
        : mode === "mixed"
          ? Math.max(7, Math.min(tile * .050, 11))
          : Math.max(8, Math.min(tile * .055, 12));

      el.style.width = isCover ? "88%" : "100%";
      el.style.height = "auto";
      el.style.maxHeight = isCover ? "100%" : "none";
      el.style.lineHeight = isCover ? "1.08" : (mode === "mixed" ? "1.16" : "1.18");
      el.style.whiteSpace = "normal";
      el.style.wordBreak = "normal";
      el.style.overflowWrap = "normal";
      el.style.overflow = isCover ? "hidden" : "visible";

      let low = minFont;
      let high = Math.max(minFont, maxFont);
      let best = minFont;

      for (let i = 0; i < 22; i += 1) {
        const mid = (low + high) / 2;
        el.style.setProperty("--fit-font-size", `${mid}px`);
        el.style.setProperty("font-size", `${mid}px`, "important");

        const descentSafety = isCover ? 0 : Math.max(2, mid * .12);
        const fitsWidth = el.scrollWidth <= availableWidth + .5;
        const fitsHeight = el.scrollHeight + descentSafety <= availableHeight + .5;

        if (fitsWidth && fitsHeight) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      const finalSize = Math.floor(best * 10) / 10;
      el.style.setProperty("--fit-font-size", `${finalSize}px`);
      el.style.setProperty("font-size", `${finalSize}px`, "important");
    }

    function clamp(value, min, max){
      return Math.min(max, Math.max(min, value));
    }

    function makeGridTransform(scale, x, y){
      return `translate3d(${x.toFixed(3)}px, ${y.toFixed(3)}px, 0) scale(${scale.toFixed(6)})`;
    }

    function setBoxFocusState(scale, x, y){
      boxFocusState = { scale, x, y };
      grid.style.transform = makeGridTransform(scale, x, y);
    }

    function cancelBoxZoomAnimation(){
      if (boxZoomAnimationId) {
        cancelAnimationFrame(boxZoomAnimationId);
        boxZoomAnimationId = null;
      }

      if (boxZoomWebAnimation) {
        try { boxZoomWebAnimation.cancel(); } catch (_) {}
        boxZoomWebAnimation = null;
      }
    }

    function easeInOutSine(t){
      const p = clamp(t, 0, 1);
      return -(Math.cos(Math.PI * p) - 1) / 2;
    }

    function animateBoxZoom(target, duration = 1500){
      cancelBoxZoomAnimation();

      const start = { ...boxFocusState };
      const end = {
        scale:Math.max(1, Number(target.scale) || 1),
        x:Number(target.x) || 0,
        y:Number(target.y) || 0
      };

      if (!duration) {
        setBoxFocusState(end.scale, end.x, end.y);
        return Promise.resolve();
      }

      const startTransform = makeGridTransform(start.scale, start.x, start.y);
      const endTransform = makeGridTransform(end.scale, end.x, end.y);

      grid.classList.add("zooming");

      if (typeof grid.animate === "function") {
        boxZoomWebAnimation = grid.animate(
          [
            { transform:startTransform },
            { transform:endTransform }
          ],
          {
            duration,
            easing:MOTION_EASING,
            fill:"forwards"
          }
        );

        return boxZoomWebAnimation.finished
          .catch(()=> {})
          .then(()=>{
            grid.style.transform = endTransform;

            if (boxZoomWebAnimation) {
              try { boxZoomWebAnimation.cancel(); } catch (_) {}
              boxZoomWebAnimation = null;
            }

            boxFocusState = end;
            grid.classList.remove("zooming");
            grid.classList.toggle("zoomed", end.scale > 1.001);
          });
      }

      // fallback للمتصفحات القديمة: نفس منطق العجلة بـ requestAnimationFrame
      const startTime = performance.now();

      return new Promise((resolve)=>{
        function frame(now){
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = easeInOutSine(progress);
          const scale = start.scale + (end.scale - start.scale) * eased;
          const x = start.x + (end.x - start.x) * eased;
          const y = start.y + (end.y - start.y) * eased;

          setBoxFocusState(scale, x, y);

          if (progress < 1) {
            boxZoomAnimationId = requestAnimationFrame(frame);
          } else {
            boxZoomAnimationId = null;
            grid.classList.remove("zooming");
            grid.classList.toggle("zoomed", end.scale > 1.001);
            setBoxFocusState(end.scale, end.x, end.y);
            resolve();
          }
        }

        boxZoomAnimationId = requestAnimationFrame(frame);
      });
    }

    function getBoxZoomTarget(button){
      const stageRect = stage.getBoundingClientRect();
      const stageW = Math.max(1, stage.clientWidth || stageRect.width);
      const stageH = Math.max(1, stage.clientHeight || stageRect.height);
      const isLandscape = window.innerWidth > window.innerHeight;
      const tile = Math.max(
        1,
        button.offsetWidth ||
        parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tile-size")) ||
        150
      );

      const desiredTile = isLandscape
        ? Math.min(stageW * .34, stageH * .58, tile * 2.18)
        : Math.min(stageW * .72, stageH * .42, tile * 2.24);

      const maxScale = isLandscape ? 2.18 : 2.24;
      const scale = clamp(desiredTile / tile, 1.38, maxScale);

      /*
        transform على grid نفسه:
        screenX = grid.offsetLeft + translateX + localCenterX * scale
        لذلك لا نضرب grid.offsetLeft في scale.
      */
      const gridBaseLeft = grid.offsetLeft;
      const gridBaseTop = grid.offsetTop;
      const localCenterX = button.offsetLeft + button.offsetWidth / 2;
      const localCenterY = button.offsetTop + button.offsetHeight / 2;

      const focusX = stageW * .50;
      const focusY = stageH * (isLandscape ? .50 : .53);

      return {
        scale,
        x:focusX - gridBaseLeft - localCenterX * scale,
        y:focusY - gridBaseTop - localCenterY * scale
      };
    }

    function wait(ms){
      return new Promise((resolve)=> window.setTimeout(resolve, ms));
    }

    function setOpenButtonVisible(visible){
      if (!openBtn) return;

      if (!visible) {
        openBtn.hidden = true;
        openBtn.classList.remove("is-entering");
        openBtn.disabled = false;
        return;
      }

      openBtn.hidden = false;
      openBtn.disabled = false;
      openBtn.classList.add("is-entering");

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=> openBtn.classList.remove("is-entering"));
      });
    }

    function cancelScatterAnimations(){
      scatterAnimations.forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });
      scatterAnimations.clear();
    }

    function prepareScatterTargets(selectedButton){
      const cards = Array.from(grid.querySelectorAll(".box-card"));
      const targets = new Map();

      if (!selectedButton || !cards.length) return { cards, targets };

      // قراءة جميع القياسات أولًا قبل أي كتابة لتجنب layout thrashing.
      const stageRect = stage.getBoundingClientRect();
      const selectedCenterX = selectedButton.offsetLeft + selectedButton.offsetWidth / 2;
      const selectedCenterY = selectedButton.offsetTop + selectedButton.offsetHeight / 2;
      const tile = selectedButton.offsetWidth || 1;
      const travel = Math.max(stageRect.width, stageRect.height) * .78 + tile * 1.6;

      const geometry = cards.map((card, cardIndex)=> ({
        card,
        cardIndex,
        centerX:card.offsetLeft + card.offsetWidth / 2,
        centerY:card.offsetTop + card.offsetHeight / 2
      }));

      geometry.forEach(({ card, cardIndex, centerX, centerY })=>{
        if (card === selectedButton) {
          targets.set(card, {
            transform:"translate3d(0px, 0px, 0) scale(1)",
            opacity:1
          });
          return;
        }

        let dx = centerX - selectedCenterX;
        let dy = centerY - selectedCenterY;
        let length = Math.hypot(dx, dy);

        if (length < 1) {
          const angle = ((cardIndex + 1) * 2.399963229728653) % (Math.PI * 2);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;
        const extra = (cardIndex % 4) * tile * .10;
        const distance = travel + extra;

        targets.set(card, {
          transform:`translate3d(${(unitX * distance).toFixed(2)}px, ${(unitY * distance).toFixed(2)}px, 0) scale(.76)`,
          opacity:0
        });
      });

      return { cards, targets };
    }

    function prepareIntroScatterTargets(){
      cancelScatterAnimations();
      scatterTargets.clear();

      const cards = Array.from(grid.querySelectorAll(".box-card"));
      if (!cards.length) return cards;

      /*
        نستخدم نفس هندسة حركة ابتعاد/عودة الصناديق أثناء اللعب:
        كل صندوق يخرج بحسب موقعه من مركز الشبكة، ثم يعود إلى موضعه.
      */
      const stageWidth = stage.clientWidth || window.innerWidth || 1;
      const stageHeight = stage.clientHeight || window.innerHeight || 1;
      const gridCenterX = grid.clientWidth / 2;
      const gridCenterY = grid.clientHeight / 2;
      const tile = cards[0].offsetWidth || 1;
      const travel = Math.max(stageWidth, stageHeight) * .78 + tile * 1.6;

      const geometry = cards.map((card, cardIndex)=> ({
        card,
        cardIndex,
        centerX:card.offsetLeft + card.offsetWidth / 2,
        centerY:card.offsetTop + card.offsetHeight / 2
      }));

      geometry.forEach(({ card, cardIndex, centerX, centerY })=>{
        let dx = centerX - gridCenterX;
        let dy = centerY - gridCenterY;
        let length = Math.hypot(dx, dy);

        if (length < 1) {
          const angle = ((cardIndex + 1) * 2.399963229728653) % (Math.PI * 2);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;
        const extra = (cardIndex % 4) * tile * .10;
        const distance = travel + extra;

        const target = {
          transform:`translate3d(${(unitX * distance).toFixed(2)}px, ${(unitY * distance).toFixed(2)}px, 0) scale(.76)`,
          opacity:0
        };

        scatterTargets.set(card, target);
        card.style.transform = target.transform;
        card.style.opacity = "0";
        card.classList.remove("focus-selected");
        card.classList.add("focus-away");
      });

      grid.classList.add("focus-mode");
      return cards;
    }

    function scatterOtherBoxes(selectedButton){
      cancelScatterAnimations();
      scatterTargets.clear();

      const { cards, targets } = prepareScatterTargets(selectedButton);
      if (!selectedButton || !cards.length) return Promise.resolve();

      grid.classList.add("focus-mode", "motion-active");

      const promises = [];

      cards.forEach((card)=>{
        card.classList.remove("focus-selected", "focus-away");
        card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
        card.style.opacity = "1";

        const target = targets.get(card);
        if (!target) return;

        scatterTargets.set(card, target);

        if (card === selectedButton) {
          card.classList.add("focus-selected");
          return;
        }

        card.classList.add("focus-away");

        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              {
                transform:"translate3d(0px, 0px, 0) scale(1)",
                opacity:1
              },
              {
                transform:target.transform,
                opacity:target.opacity
              }
            ],
            {
              duration:SCATTER_MOTION_MS,
              easing:MOTION_EASING,
              fill:"forwards"
            }
          );

          scatterAnimations.set(card, animation);
          promises.push(animation.finished.catch(()=> {}));
        } else {
          card.style.transform = target.transform;
          card.style.opacity = String(target.opacity);
        }
      });

      if (!promises.length) return wait(SCATTER_MOTION_MS);
      return Promise.all(promises);
    }

    function animateScatteredBoxesBack(){
      cancelScatterAnimations();
      grid.classList.add("motion-active");

      const cards = Array.from(grid.querySelectorAll(".box-card"));
      const promises = [];

      cards.forEach((card)=>{
        if (card.classList.contains("focus-selected")) return;

        const target = scatterTargets.get(card);
        if (!target) return;

        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              {
                transform:target.transform,
                opacity:target.opacity
              },
              {
                transform:"translate3d(0px, 0px, 0) scale(1)",
                opacity:1
              }
            ],
            {
              duration:SCATTER_MOTION_MS,
              easing:MOTION_EASING,
              fill:"forwards"
            }
          );

          scatterAnimations.set(card, animation);
          promises.push(animation.finished.catch(()=> {}));
        } else {
          card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
          card.style.opacity = "1";
        }
      });

      const finished = promises.length
        ? Promise.all(promises)
        : wait(SCATTER_MOTION_MS);

      return finished.then(()=>{
        cancelScatterAnimations();

        cards.forEach((card)=>{
          card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
          card.style.opacity = "1";
          card.classList.remove("focus-selected", "focus-away");
        });

        scatterTargets.clear();
        grid.classList.remove("focus-mode", "motion-active");
      });
    }

    function restoreScatteredBoxes(){
      cancelScatterAnimations();

      grid.querySelectorAll(".box-card").forEach((card)=>{
        card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
        card.style.opacity = "1";
        card.classList.remove("focus-selected", "focus-away");
      });

      scatterTargets.clear();
      grid.classList.remove("focus-mode", "motion-active");
    }

    function focusBox(button, duration = ZOOM_IN_MOTION_MS){
      if (!button) return Promise.resolve();

      focusedIndex = Number(button.dataset.index || -1);
      activeFocusButton = button;

      const target = getBoxZoomTarget(button);
      return animateBoxZoom(target, duration);
    }

    function resetBoxZoom(duration = ZOOM_OUT_MOTION_MS){
      activeFocusButton = null;

      return animateBoxZoom({ scale:1, x:0, y:0 }, duration).then(()=>{
        focusedIndex = -1;
        requestAnimationFrame(fitAllBoxText);
      });
    }

    async function selectBoxForFocus(button, index){
      if (!button || boxInteractionLocked) return;

      openBoxAudio.unlock();
      openBoxAudio.playGo();

      boxInteractionLocked = true;
      selectedBoxIndex = index;
      activeFocusButton = button;
      setOpenButtonVisible(false);

      try {
        const scatterFinished = scatterOtherBoxes(button);

        // تبدأ الصناديق بالابتعاد أولًا، ثم يبدأ الزوم ويستمران على compositor.
        await wait(SCATTER_LEAD_MS);

        await Promise.all([
          scatterFinished,
          focusBox(button, ZOOM_IN_MOTION_MS)
        ]);

        grid.classList.remove("motion-active");

        if (!opened.has(index)) {
          setOpenButtonVisible(true);
        }

        requestAnimationFrame(()=> {
          if (opened.has(index)) fitOpenedBoxContent(button);
          else fitClosedCoverText(button);
        });

        collapseSafariBars();
      } finally {
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }
    }

    async function openSelectedBox(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (
        boxInteractionLocked ||
        selectedBoxIndex < 0 ||
        !activeFocusButton ||
        opened.has(selectedBoxIndex)
      ) {
        setOpenButtonVisible(false);
        return;
      }

      openBoxAudio.unlock();
      openBoxAudio.playOpen();

      boxInteractionLocked = true;
      openBtn.disabled = true;
      setOpenButtonVisible(false);

      try {
        opened.add(selectedBoxIndex);
        activeFocusButton.classList.add("opened");
        activeFocusButton.setAttribute("aria-pressed", "true");

        requestAnimationFrame(()=> fitOpenedBoxContent(activeFocusButton));
        window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 120);
        window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 430);
        window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 920);

        // نمنع رجوع المشهد أثناء اكتمال حركة الغطاء.
        await wait(1320);
      } finally {
        openBtn.disabled = false;
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }
    }

    async function returnFocusScene(){
      setOpenButtonVisible(false);

      if (boxInteractionLocked) return;

      openBoxAudio.unlock();
      openBoxAudio.playReturn();

      boxInteractionLocked = true;

      try {
        await Promise.all([
          animateScatteredBoxesBack(),
          resetBoxZoom(ZOOM_OUT_MOTION_MS)
        ]);

        selectedBoxIndex = -1;
        activeFocusButton = null;
        requestAnimationFrame(fitAllBoxText);
        collapseSafariBars();
      } finally {
        boxInteractionLocked = false;
      }
    }

    async function handleBoxClick(event, button, index){
      event.preventDefault();
      event.stopPropagation();

      if (boxInteractionLocked) return;

      if (focusedIndex >= 0 || boxFocusState.scale > 1.001 || selectedBoxIndex >= 0) {
        await returnFocusScene();
        return;
      }

      await selectBoxForFocus(button, index);
    }

    async function handleZoomResetTap(event){
      if (
        focusedIndex < 0 &&
        boxFocusState.scale <= 1.001 &&
        selectedBoxIndex < 0
      ) return;

      if (boxInteractionLocked) return;
      if (event.target.closest(".fixed-controls")) return;

      event.preventDefault();
      await returnFocusScene();
    }

    async function resetBoxes(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      setOpenButtonVisible(false);

      const shouldPlayReturnSound =
        focusedIndex >= 0 ||
        boxFocusState.scale > 1.001 ||
        selectedBoxIndex >= 0 ||
        scatterTargets.size > 0;

      if (shouldPlayReturnSound) {
        openBoxAudio.unlock();
        openBoxAudio.playReturn();
      }

      opened.clear();

      document.querySelectorAll(".box-card.opened").forEach((card)=>{
        card.classList.remove("opened");
        card.setAttribute("aria-pressed", "false");
      });

      boxInteractionLocked = true;

      try {
        const scatterReturn = scatterTargets.size
          ? animateScatteredBoxesBack()
          : Promise.resolve();

        await Promise.all([
          scatterReturn,
          resetBoxZoom(ZOOM_OUT_MOTION_MS)
        ]);

        selectedBoxIndex = -1;
        activeFocusButton = null;
      } finally {
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }

      window.setTimeout(()=> {
        document.querySelectorAll(".box-card:not(.opened)").forEach(fitClosedCoverText);
      }, 80);

      collapseSafariBars();
    }

    function collapseSafariBars(options = {}){
      const refresh = options.refresh !== false;

      safariTimers.forEach((timer)=> clearTimeout(timer));
      safariTimers = [];

      [0, 80, 220, 520, 900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80, left:0, behavior:"auto" });
          } catch (_) {
            window.scrollTo(0, 80);
          }

          /*
            أثناء حركة البداية نطوي شريط Safari فقط، ولا نعيد حساب
            أحجام الصناديق تحت حركة الكاميرا.
          */
          if (refresh && !introLayoutFrozen) {
            scheduleResponsiveLayout();
          } else if (refresh) {
            pendingViewportLayout = true;
          }
        }, delay));
      });
    }

    function goBack(){
      try {
        sessionStorage.setItem("sandooq_open_box_return_v1", String(Date.now()));
        if (history.length > 1) {
          history.back();
          return;
        }
      } catch (_) {}
      window.location.href = "index.html";
    }

    document.addEventListener("pointerdown", ()=>{
      openBoxAudio.unlock();
    }, { once:true, passive:true });

    resetBtn.addEventListener("click", resetBoxes);
    openBtn.addEventListener("click", openSelectedBox);
    backBtn.addEventListener("click", goBack);
    page.addEventListener("click", handleZoomResetTap);

    window.addEventListener("resize", ()=>{
      scheduleResponsiveLayout(40);
    }, { passive:true });

    window.addEventListener("orientationchange", ()=>{
      pendingViewportLayout = true;
      window.setTimeout(()=>{
        collapseSafariBars();
        scheduleResponsiveLayout(80);
      }, 160);
    }, { passive:true });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", ()=>{
        scheduleResponsiveLayout(34);
      }, { passive:true });

      window.visualViewport.addEventListener("scroll", ()=>{
        scheduleResponsiveLayout(34);
      }, { passive:true });
    }

    document.addEventListener("touchend", ()=>{
      collapseSafariBars();
    }, { passive:true });

    window.addEventListener("pageshow", ()=>{
      collapseSafariBars();
      scheduleResponsiveLayout(60);
    }, { passive:true });

    async function playOpeningIntro(){
      if (!page || !stage || !grid) return;

      if (introFrameId) {
        cancelAnimationFrame(introFrameId);
        introFrameId = null;
      }

      page.classList.remove("intro-done", "intro-boxes-entering");
      page.classList.add("intro-playing", "intro-camera");

      pendingViewportLayout = false;
      introLayoutFrozen = false;

      const holdMs = 2200;
      const zoomMs = 7600;
      const settlePauseMs = 280;
      const startBgScale = 1;
      const endBgScale =
        Number(getComputedStyle(page).getPropertyValue("--intro-bg-final-scale")) || 1.18;

      let startTime = null;

      const setCameraFrame = (bgScale)=>{
        stage.style.transform = "translate3d(0,0,0) scale(1)";
        stage.style.animation = "none";

        if (themeBackground) {
          themeBackground.style.transform =
            `translate3d(0,0,0) scale(${Number(bgScale).toFixed(5)})`;
          themeBackground.style.animation = "none";

          const ratio =
            (bgScale - startBgScale) /
            Math.max(.001, endBgScale - startBgScale);
          const saturation = 1.04 - ratio * .04;

          themeBackground.style.filter =
            `saturate(${Math.max(1, Math.min(1.04, saturation))})`;
        }
      };

      const completeIntro = ()=>{
        if (introFrameId) {
          cancelAnimationFrame(introFrameId);
          introFrameId = null;
        }

        setCameraFrame(endBgScale);

        page.classList.remove(
          "intro-playing",
          "intro-camera",
          "intro-boxes-entering"
        );
        page.classList.add("intro-done");

        if (themeBackground) {
          themeBackground.style.filter = "";
        }

        if (fixedControls) {
          fixedControls.style.opacity = "1";
          fixedControls.style.transform = "none";
          fixedControls.style.pointerEvents = "";
        }

        introLayoutFrozen = false;
        boxInteractionLocked = false;
        pendingViewportLayout = false;

        collapseSafariBars({ refresh:false });
      };

      if (fixedControls) {
        fixedControls.style.opacity = "0";
        fixedControls.style.transform = "translateY(12px)";
        fixedControls.style.pointerEvents = "none";
      }

      /*
        أثناء كاميرا الخلفية تكون الصناديق مخفية، لذلك نسمح لسفاري
        بتحديث المساحة المرئية وترتيب الشبكة دون أن يرى المستخدم أي قفزة.
      */
      syncVisualViewportFrame(true);
      applyLayout({ force:true });
      fitAllBoxText();

      setCameraFrame(startBgScale);
      collapseSafariBars();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) startTime = now;
            const elapsed = now - startTime;

            if (elapsed < holdMs) {
              setCameraFrame(startBgScale);
              introFrameId = requestAnimationFrame(animate);
              return;
            }

            const progress = Math.max(
              0,
              Math.min(1, (elapsed - holdMs) / zoomMs)
            );
            const eased = easeInOutSine(progress);
            const bgScale =
              startBgScale + (endBgScale - startBgScale) * eased;

            setCameraFrame(bgScale);

            if (progress < 1) {
              introFrameId = requestAnimationFrame(animate);
              return;
            }

            introFrameId = null;
            resolve();
          };

          introFrameId = requestAnimationFrame(animate);
        });
      } else {
        setCameraFrame(endBgScale);
      }

      /*
        الكاميرا ثبتت الآن. نحسب المقاس والمركز النهائيين مرة واحدة
        بينما الشبكة ما زالت مخفية، ثم نجمد التخطيط خلال دخول الصناديق.
      */
      collapseSafariBars({ refresh:false });

      await wait(settlePauseMs);

      syncVisualViewportFrame(true);
      applyLayout({ force:true });
      setBoxFocusState(1, 0, 0);
      fitAllBoxText();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      introLayoutFrozen = true;
      boxInteractionLocked = true;

      prepareIntroScatterTargets();

      /*
        إزالة intro-camera تجعل الشبكة مرئية، لكنها لا تومض:
        كل صندوق موجود مسبقًا خارج المشهد وبشفافية صفر.
      */
      page.classList.remove("intro-camera");
      page.classList.add("intro-boxes-entering");

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        // نفس دالة عودة الصناديق المستخدمة بعد إلغاء اختيار صندوق.
        await animateScatteredBoxesBack();
      } else {
        restoreScatteredBoxes();
      }

      completeIntro();
    }

    async function initializeOpenBoxGame(){
      await hydrateItemsFromIndexedDB();

      opened.clear();
      focusedIndex = -1;
      selectedBoxIndex = -1;
      activeFocusButton = null;
      boxInteractionLocked = false;
      setOpenButtonVisible(false);

      openBoxAudio.setEnabled(boxSoundEnabled);
      openBoxAudio.preload();

      applyTheme(currentTheme);
      syncVisualViewportFrame(true);
      setBoxFocusState(1, 0, 0);
      renderBoxes();
      await playOpeningIntro();
    }

    initializeOpenBoxGame();
  </script>
</body>
