      try { sessionStorage.setItem("sandooq_edu_box_theme_v1", currentTheme); } catch (_) {}
    }

    function getVisualViewportMetrics(){
      const vv = window.visualViewport;
      const layoutWidth = Math.max(
        280,
        document.documentElement.clientWidth || 0,
        window.innerWidth || 0
      );
      const layoutHeight = Math.max(
        260,
        page?.clientHeight || 0,
        document.documentElement.clientHeight || 0,
        window.innerHeight || 0
      );

      const width = Math.max(
        280,
        Math.min(layoutWidth, Number(vv?.width) || layoutWidth)
      );
      const height = Math.max(
        260,
        Math.min(layoutHeight, Number(vv?.height) || layoutHeight)
      );

      return {
        width,
        height,
        offsetLeft:Math.max(0, Number(vv?.offsetLeft) || 0),
        scale:Math.max(1, Number(vv?.scale) || 1)
      };
    }

    function syncVisualViewportFrame(force = false){
      if (introLayoutFrozen && !force) {
        pendingViewportLayout = true;
        return false;
      }

      const metrics = getVisualViewportMetrics();

      /*
        عند تكبير صفحة Safari يصبح visualViewport أضيق من layout viewport.
        نضع منطقة الصناديق داخل المساحة المرئية الحقيقية بدل إبقائها
        متمركزة داخل مساحة أكبر تُقص أطرافها.
      */
      stage.style.left = `${metrics.offsetLeft.toFixed(2)}px`;
      stage.style.right = "auto";
      stage.style.top = "0px";
      stage.style.bottom = "auto";
      stage.style.width = `${metrics.width.toFixed(2)}px`;
      stage.style.height = `${metrics.height.toFixed(2)}px`;

      page.style.setProperty("--visual-viewport-width", `${metrics.width}px`);
      page.style.setProperty("--visual-viewport-height", `${metrics.height}px`);
      return true;
    }

    function calculateLayout(count){
      const metrics = getVisualViewportMetrics();
      const styles = window.getComputedStyle(stage);

      const padX =
        parseFloat(styles.paddingLeft || "0") +
        parseFloat(styles.paddingRight || "0");
      const padY =
        parseFloat(styles.paddingTop || "0") +
        parseFloat(styles.paddingBottom || "0");

      /*
        clientWidth/clientHeight لا يتأثران بحركة scale الخاصة بالانترو،
        بعكس getBoundingClientRect الذي كان يجعل الصناديق تُحسب صغيرة ثم
        تكبر فجأة عند نهاية الحركة.
      */
      const stageWidth = Math.max(
        280,
        Math.min(stage.clientWidth || metrics.width, metrics.width)
      );
      const stageHeight = Math.max(
        260,
        Math.min(stage.clientHeight || metrics.height, metrics.height)
      );

      const width = Math.max(220, stageWidth - padX - 4);
      const height = Math.max(190, stageHeight - padY - 4);
      const total = Math.max(1, Math.min(MAX_BOX_ITEMS, count || 1));
      const isPortrait = height > width;

      const maxCols = Math.min(total, isPortrait ? 5 : 10);
      const minCols = isPortrait ? Math.min(total, 2) : Math.min(total, 2);
      const baseGap = total > 24 ? 7 : total > 16 ? 9 : total > 10 ? 12 : 20;
      const maxTile = total > 24 ? 112 : total > 16 ? 124 : total > 10 ? 138 : 152;

      let best = null;

      for (let cols = Math.max(1, minCols); cols <= maxCols; cols += 1) {
        const rows = Math.ceil(total / cols);
        const gap = baseGap;
        const tileByWidth = Math.floor((width - gap * (cols - 1)) / cols);
        const tileByHeight = Math.floor((height - gap * (rows - 1)) / rows);
        const size = Math.min(maxTile, tileByWidth, tileByHeight);

        if (size <= 0) continue;

        const gridWidth = cols * size + gap * Math.max(0, cols - 1);
        const gridHeight = rows * size + gap * Math.max(0, rows - 1);
        const unusedSlots = cols * rows - total;
        const aspectPenalty = Math.abs(cols / rows - width / Math.max(1, height)) * 3;
        const rowBalance = Math.abs(rows - Math.ceil(Math.sqrt(total))) * 2;
        const edgePenalty =
          Math.max(0, gridWidth - width) * 100 +
          Math.max(0, gridHeight - height) * 100;
        const score =
          size * 100 -
          unusedSlots * 7 -
          aspectPenalty -
          rowBalance -
          edgePenalty;

        if (!best || score > best.score) {
          best = {
            cols,
            rows,
            gap,
            size,
            gridWidth,
            gridHeight,
            score
          };
        }
      }

      if (!best) {
        const cols = isPortrait ? Math.min(total, 3) : Math.min(total, 8);
        const rows = Math.ceil(total / Math.max(1, cols));
        const gap = 6;
        const size = Math.max(34, Math.min(
          maxTile,
          Math.floor((width - gap * Math.max(0, cols - 1)) / Math.max(1, cols)),
          Math.floor((height - gap * Math.max(0, rows - 1)) / Math.max(1, rows))
        ));

        best = {
          cols:Math.max(1, cols),
          rows,
          gap,
          size,
          gridWidth:Math.max(1, cols) * size + gap * Math.max(0, cols - 1),
          gridHeight:rows * size + gap * Math.max(0, rows - 1)
        };
      }

      return {
        cols:best.cols,
        rows:best.rows,
        gap:Math.max(5, best.gap),
        size:Math.max(34, best.size),
        gridWidth:best.gridWidth,
        gridHeight:best.gridHeight
      };
    }

    function applyLayout(options = {}){
      const force = options.force === true;

      if (introLayoutFrozen && !force) {
        pendingViewportLayout = true;
        return false;
      }

      const layout = calculateLayout(items.length);

      grid.style.setProperty("--cols", String(layout.cols));
      grid.style.setProperty("--tile-gap", `${layout.gap}px`);
      grid.style.setProperty("--tile-size", `${layout.size}px`);
      grid.style.width = `${layout.gridWidth}px`;
      grid.style.height = `${layout.gridHeight}px`;

      document.documentElement.style.setProperty("--tile-gap", `${layout.gap}px`);
      document.documentElement.style.setProperty("--tile-size", `${layout.size}px`);
      return true;
    }

    function refreshResponsiveLayout(options = {}){
      const force = options.force === true;

      if ((introLayoutFrozen || boxInteractionLocked) && !force) {
        pendingViewportLayout = true;
        return;
      }

      syncVisualViewportFrame(force);
      applyLayout({ force });

      requestAnimationFrame(()=>{
        if (focusedIndex >= 0 && activeFocusButton && !boxInteractionLocked) {
          const target = getBoxZoomTarget(activeFocusButton);
          setBoxFocusState(target.scale, target.x, target.y);
        } else if (focusedIndex < 0) {
          setBoxFocusState(1, 0, 0);
        }

        fitAllBoxText();
      });

      pendingViewportLayout = false;
    }

    function scheduleResponsiveLayout(delay = 0){
      if (introLayoutFrozen || boxInteractionLocked) {
        pendingViewportLayout = true;
        return;
      }

      if (viewportLayoutFrame) {
        cancelAnimationFrame(viewportLayoutFrame);
        viewportLayoutFrame = null;
      }

      if (viewportLayoutTimer) {
        clearTimeout(viewportLayoutTimer);
        viewportLayoutTimer = null;
      }

      const run = ()=>{
        viewportLayoutFrame = requestAnimationFrame(()=>{
          viewportLayoutFrame = null;
          refreshResponsiveLayout();
        });
      };

      if (delay > 0) {
        viewportLayoutTimer = setTimeout(()=>{
          viewportLayoutTimer = null;
          run();
        }, delay);
      } else {
        run();
      }
    }

    function renderBoxes(){
      hideMultiAnswerPanel();
      applyLayout();
      grid.innerHTML = "";

      items.forEach((entry, index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "box-card";
        applyBoxPalette(button, index);
        button.setAttribute("aria-label", `صندوق رقم ${index + 1}`);
        button.setAttribute("aria-pressed", "false");
        button.dataset.index = String(index);

        const wrap = document.createElement("span");
        wrap.className = "box-wrap";

        const cavity = document.createElement("span");
        cavity.className = "cavity-box";

        const back = document.createElement("span");
        back.className = "box-back";

        const topWall = document.createElement("span");
        topWall.className = "wall wall-top";

        const rightWall = document.createElement("span");
        rightWall.className = "wall wall-right";

        const bottomWall = document.createElement("span");
        bottomWall.className = "wall wall-bottom";

        const leftWall = document.createElement("span");
        leftWall.className = "wall wall-left";

        const content = document.createElement("span");
        const contentKind = getEntryKind(entry);
        content.className = `box-content content-${contentKind}`;
        content.appendChild(createResultContent(entry, contentKind));

        cavity.appendChild(back);
        cavity.appendChild(topWall);
        cavity.appendChild(rightWall);
        cavity.appendChild(bottomWall);
        cavity.appendChild(leftWall);
        cavity.appendChild(content);

        const panel = document.createElement("span");
        panel.className = "front-panel";

        panel.appendChild(createCoverContent(entry, index));

        wrap.appendChild(cavity);
        wrap.appendChild(panel);
        button.appendChild(wrap);

        button.addEventListener("click", (event)=>{
          handleBoxClick(event, button, index);
        });

        grid.appendChild(button);
      });

      requestAnimationFrame(fitAllBoxText);
    }

    function createCoverContent(entry, index){
      if (currentCoverMode === "image" && (entry.coverImageData || entry.coverImageName)) {
        const img = document.createElement("img");
        img.className = "cover-image";
        img.alt = "";
        img.src = entry.coverImageData || entry.coverImageName;
        return img;
      }

      if (currentCoverMode === "text" && String(entry.coverText || "").trim()) {
        const text = document.createElement("span");
        text.className = "cover-text fit-text";
        text.dataset.fitText = "cover";
        text.textContent = String(entry.coverText || "").trim();
        return text;
      }

      const number = document.createElement("span");
      number.className = "panel-number";
      const value = String(index + 1);
      number.textContent = currentCoverMode === "arabic-numbers"
        ? value.replace(/[0-9]/g,(digit)=>"٠١٢٣٤٥٦٧٨٩"[Number(digit)])
        : value;
      return number;
    }

    function getEntryKind(entry){
      const contentType = normalizeEntryContentType(entry?.contentType, currentContentType);
      const hasImage = contentType !== "text" && Boolean(entry.imageData || entry.imageName);
      const hasText = contentType !== "images" && Boolean(String(entry.text || "").trim());

      if (contentType === "mixed") {
        if (hasImage && hasText) return "mixed";
        if (hasImage) return "image";
        return "text";
      }

      if (contentType === "images" && hasImage) return "image";
      return "text";
    }

    function createResultContent(entry, kind){
      const contentType = normalizeEntryContentType(entry?.contentType, currentContentType);
      const hasImage = contentType !== "text" && Boolean(entry.imageData || entry.imageName);
      const cleanText = contentType === "images" ? "" : String(entry.text || "").trim();
      const hasText = Boolean(cleanText);

      const frame = document.createElement("span");
      frame.className = `content-frame content-frame-${kind}`;

      const createImageZone = () => {
        const zone = document.createElement("span");
        zone.className = "content-zone content-image-zone";

        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        img.addEventListener("load", ()=> {
          requestAnimationFrame(()=> fitOpenedBoxContent(img.closest(".box-card")));
        }, { once:true });

        zone.appendChild(img);
        return zone;
      };

      const createTextZone = (mode) => {
        const zone = document.createElement("span");
        zone.className = "content-zone content-text-zone";

        const text = document.createElement("span");
        text.className = "result-text fit-text";
        text.dataset.fitText = mode;
        text.textContent = cleanText || "—";

        zone.appendChild(text);
        return zone;
      };

      if (hasImage && hasText) {
        const textLength = Array.from(cleanText.replace(/\s+/g, " ")).length;
        const lengthClass = textLength <= 18
          ? "mixed-short"
          : textLength <= 42
            ? "mixed-medium"
            : textLength <= 78
              ? "mixed-long"
              : "mixed-xlong";

        frame.classList.add(lengthClass);
        frame.appendChild(createImageZone());
        frame.appendChild(createTextZone("mixed"));
        return frame;
      }

      if (hasImage) {
        frame.appendChild(createImageZone());
        return frame;
      }

      frame.appendChild(createTextZone("text"));
      return frame;
    }

    function fitAllBoxText(){
      document
        .querySelectorAll(".box-card:not(.opened) .cover-text.fit-text")
        .forEach((el)=> fitTextInsideBox(el));

      document
        .querySelectorAll(".box-card.opened .result-text.fit-text")
        .forEach((el)=> fitTextInsideBox(el));
    }

    function fitOpenedBoxContent(card){
      if (!card || !card.classList.contains("opened")) return;
      card.querySelectorAll(".result-text.fit-text").forEach((el)=> fitTextInsideBox(el));
    }

    function fitClosedCoverText(card){
      if (!card || card.classList.contains("opened")) return;
      card.querySelectorAll(".cover-text.fit-text").forEach((el)=> fitTextInsideBox(el));
    }

    function fitTextInsideBox(el){
      const mode = el.dataset.fitText || "text";
      const isCover = mode === "cover";
      const card = el.closest(".box-card");
      const isClassroomCover = Boolean(
        isCover &&
        card &&
        page?.classList.contains("theme-classroom")
      );

      // لا نقيس الغلاف بعد فتح الصندوق؛ وقتها يتحول الغلاف إلى حركة فتح.
      if (isCover && card?.classList.contains("opened")) return;

      const zone = isCover
        ? el.closest(".front-panel")
        : el.closest(".content-text-zone");

      if (!zone) return;

      const zoneWidth = Math.max(0, zone.clientWidth);
      const zoneHeight = Math.max(0, zone.clientHeight);
      if (zoneWidth < 2 || zoneHeight < 2) return;

      const tile = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--tile-size")
      ) || zoneWidth;

      /*
        غلاف مفكرة ثيم الفصل لا يستخدم كل البلاطة بسبب السلك العلوي والهوامش.
        لكن في الإصدار السابق كانت المساحة والمحارف محافظة أكثر من اللازم،
        لذلك ظهر النص صغيرًا جدًا. هنا نوسّع منطقة القياس ونسمح بخط أكبر.
      */
      const coverWidthRatio = isClassroomCover ? .68 : .88;
      const coverHeightRatio = isClassroomCover ? .60 : .82;

      const availableWidth = isCover
        ? Math.max(1, zoneWidth * coverWidthRatio)
        : Math.max(1, zoneWidth - 2);

      const availableHeight = isCover
        ? Math.max(1, zoneHeight * coverHeightRatio)
        : Math.max(1, zoneHeight - 2);

      const maxFont = isCover
        ? isClassroomCover
          ? Math.min(tile * .34, availableWidth * .34, availableHeight * .43, 74)
          : Math.min(tile * .29, availableWidth * .24, availableHeight * .50, 46)
        : mode === "mixed"
          ? Math.min(tile * .26, availableWidth * .27, availableHeight * .68, 40)
          : Math.min(tile * .43, availableWidth * .35, availableHeight * .54, 66);

      const minFont = isCover
        ? isClassroomCover
          ? Math.max(12, Math.min(tile * .095, 22))
          : Math.max(13, Math.min(tile * .085, 18))
        : mode === "mixed"
          ? Math.max(7, Math.min(tile * .050, 11))
          : Math.max(8, Math.min(tile * .055, 12));

      if (isClassroomCover) {
        el.style.setProperty("width", "72%", "important");
        el.style.setProperty("max-width", "72%", "important");
        el.style.setProperty("max-height", "62%", "important");
      } else {
        el.style.width = isCover ? "88%" : "100%";
        el.style.maxHeight = isCover ? "100%" : "none";
      }

      el.style.height = "auto";
      el.style.lineHeight = isCover
        ? (isClassroomCover ? "1.06" : "1.08")
        : (mode === "mixed" ? "1.12" : "1.14");
      el.style.whiteSpace = "normal";
      el.style.wordBreak = "normal";
      el.style.overflowWrap = "normal";
      el.style.overflow = isCover ? "hidden" : "visible";

      let low = minFont;
      let high = Math.max(minFont, maxFont);
      let best = minFont;

      for (let i = 0; i < 24; i += 1) {
        const mid = (low + high) / 2;
        el.style.setProperty("--fit-font-size", `${mid}px`);
        el.style.setProperty("font-size", `${mid}px`, "important");

        const descentSafety = isCover
          ? Math.max(1, mid * .04)
          : Math.max(2, mid * .12);
        const fitsWidth = el.scrollWidth <= availableWidth + .5;
        const fitsHeight = el.scrollHeight + descentSafety <= availableHeight + .5;

        if (fitsWidth && fitsHeight) {
          best = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      const finalSize = Math.floor(best * 10) / 10;
      el.style.setProperty("--fit-font-size", `${finalSize}px`);
      el.style.setProperty("font-size", `${finalSize}px`, "important");
    }

    function clamp(value, min, max){
      return Math.min(max, Math.max(min, value));
    }

    function makeGridTransform(scale, x, y){
      return `translate3d(${x.toFixed(3)}px, ${y.toFixed(3)}px, 0) scale(${scale.toFixed(6)})`;
    }

    function setBoxFocusState(scale, x, y){
      boxFocusState = { scale, x, y };
      grid.style.transform = makeGridTransform(scale, x, y);
    }

    function cancelBoxZoomAnimation(){
      if (boxZoomAnimationId) {
        cancelAnimationFrame(boxZoomAnimationId);
        boxZoomAnimationId = null;
      }

      if (boxZoomWebAnimation) {
        try { boxZoomWebAnimation.cancel(); } catch (_) {}
        boxZoomWebAnimation = null;
      }
    }

    function easeInOutSine(t){
      const p = clamp(t, 0, 1);
      return -(Math.cos(Math.PI * p) - 1) / 2;
    }

    function animateBoxZoom(target, duration = 1500){
      cancelBoxZoomAnimation();

      const start = { ...boxFocusState };
      const end = {
        scale:Math.max(1, Number(target.scale) || 1),
        x:Number(target.x) || 0,
        y:Number(target.y) || 0
      };

      if (!duration) {
        setBoxFocusState(end.scale, end.x, end.y);
        return Promise.resolve();
      }

      const startTransform = makeGridTransform(start.scale, start.x, start.y);
      const endTransform = makeGridTransform(end.scale, end.x, end.y);

      grid.classList.add("zooming");

      if (typeof grid.animate === "function") {
        boxZoomWebAnimation = grid.animate(
          [
            { transform:startTransform },
            { transform:endTransform }
          ],
          {
            duration,
            easing:MOTION_EASING,
            fill:"forwards"
          }
        );

        return boxZoomWebAnimation.finished
          .catch(()=> {})
          .then(()=>{
            grid.style.transform = endTransform;

            if (boxZoomWebAnimation) {
              try { boxZoomWebAnimation.cancel(); } catch (_) {}
              boxZoomWebAnimation = null;
            }

            boxFocusState = end;
            grid.classList.remove("zooming");
            grid.classList.toggle("zoomed", end.scale > 1.001);
          });
      }

      // fallback للمتصفحات القديمة: نفس منطق العجلة بـ requestAnimationFrame
      const startTime = performance.now();

      return new Promise((resolve)=>{
        function frame(now){
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = easeInOutSine(progress);
          const scale = start.scale + (end.scale - start.scale) * eased;
          const x = start.x + (end.x - start.x) * eased;
          const y = start.y + (end.y - start.y) * eased;

          setBoxFocusState(scale, x, y);

          if (progress < 1) {
            boxZoomAnimationId = requestAnimationFrame(frame);
          } else {
            boxZoomAnimationId = null;
            grid.classList.remove("zooming");
            grid.classList.toggle("zoomed", end.scale > 1.001);
            setBoxFocusState(end.scale, end.x, end.y);
            resolve();
          }
        }

        boxZoomAnimationId = requestAnimationFrame(frame);
      });
    }

    function getBoxZoomTarget(button){
      const stageRect = stage.getBoundingClientRect();
      const stageW = Math.max(1, stage.clientWidth || stageRect.width);
      const stageH = Math.max(1, stage.clientHeight || stageRect.height);
      const isLandscape = window.innerWidth > window.innerHeight;
      const tile = Math.max(
        1,
        button.offsetWidth ||
        parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tile-size")) ||
        150
      );

      const desiredTile = isLandscape
        ? Math.min(stageW * .34, stageH * .58, tile * 2.18)
        : Math.min(stageW * .72, stageH * .42, tile * 2.24);

      const maxScale = isLandscape ? 2.18 : 2.24;
      const scale = clamp(desiredTile / tile, 1.38, maxScale);

      /*
        transform على grid نفسه:
        screenX = grid.offsetLeft + translateX + localCenterX * scale
        لذلك لا نضرب grid.offsetLeft في scale.
      */
      const gridBaseLeft = grid.offsetLeft;
      const gridBaseTop = grid.offsetTop;
      const localCenterX = button.offsetLeft + button.offsetWidth / 2;
      const localCenterY = button.offsetTop + button.offsetHeight / 2;

      const focusX = stageW * .50;
      const focusY = stageH * (isLandscape ? .50 : .53);

      return {
        scale,
        x:focusX - gridBaseLeft - localCenterX * scale,
        y:focusY - gridBaseTop - localCenterY * scale
      };
    }

    function wait(ms){
      return new Promise((resolve)=> window.setTimeout(resolve, ms));
    }


    function cancelScatterAnimations(){
      scatterAnimations.forEach((animation)=>{
        try { animation.cancel(); } catch (_) {}
      });
      scatterAnimations.clear();
    }

    function prepareScatterTargets(selectedButton){
      const cards = Array.from(grid.querySelectorAll(".box-card"));
      const targets = new Map();

      if (!selectedButton || !cards.length) return { cards, targets };

      // قراءة جميع القياسات أولًا قبل أي كتابة لتجنب layout thrashing.
      const stageRect = stage.getBoundingClientRect();
      const selectedCenterX = selectedButton.offsetLeft + selectedButton.offsetWidth / 2;
      const selectedCenterY = selectedButton.offsetTop + selectedButton.offsetHeight / 2;
      const tile = selectedButton.offsetWidth || 1;
      const travel = Math.max(stageRect.width, stageRect.height) * .78 + tile * 1.6;

      const geometry = cards.map((card, cardIndex)=> ({
        card,
        cardIndex,
        centerX:card.offsetLeft + card.offsetWidth / 2,
        centerY:card.offsetTop + card.offsetHeight / 2
      }));

      geometry.forEach(({ card, cardIndex, centerX, centerY })=>{
        if (card === selectedButton) {
          targets.set(card, {
            transform:"translate3d(0px, 0px, 0) scale(1)",
            opacity:1
          });
          return;
        }

        let dx = centerX - selectedCenterX;
        let dy = centerY - selectedCenterY;
        let length = Math.hypot(dx, dy);

        if (length < 1) {
          const angle = ((cardIndex + 1) * 2.399963229728653) % (Math.PI * 2);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;
        const extra = (cardIndex % 4) * tile * .10;
        const distance = travel + extra;

        targets.set(card, {
          transform:`translate3d(${(unitX * distance).toFixed(2)}px, ${(unitY * distance).toFixed(2)}px, 0) scale(.76)`,
          opacity:0
        });
      });

      return { cards, targets };
    }

    function prepareIntroScatterTargets(){
      cancelScatterAnimations();
      scatterTargets.clear();

      const cards = Array.from(grid.querySelectorAll(".box-card"));
      if (!cards.length) return cards;

      /*
        نستخدم نفس هندسة حركة ابتعاد/عودة الصناديق أثناء اللعب:
        كل صندوق يخرج بحسب موقعه من مركز الشبكة، ثم يعود إلى موضعه.
      */
      const stageWidth = stage.clientWidth || window.innerWidth || 1;
      const stageHeight = stage.clientHeight || window.innerHeight || 1;
      const gridCenterX = grid.clientWidth / 2;
      const gridCenterY = grid.clientHeight / 2;
      const tile = cards[0].offsetWidth || 1;
      const travel = Math.max(stageWidth, stageHeight) * .78 + tile * 1.6;

      const geometry = cards.map((card, cardIndex)=> ({
        card,
        cardIndex,
        centerX:card.offsetLeft + card.offsetWidth / 2,
        centerY:card.offsetTop + card.offsetHeight / 2
      }));

      geometry.forEach(({ card, cardIndex, centerX, centerY })=>{
        let dx = centerX - gridCenterX;
        let dy = centerY - gridCenterY;
        let length = Math.hypot(dx, dy);

        if (length < 1) {
          const angle = ((cardIndex + 1) * 2.399963229728653) % (Math.PI * 2);
          dx = Math.cos(angle);
          dy = Math.sin(angle);
          length = 1;
        }

        const unitX = dx / length;
        const unitY = dy / length;
        const extra = (cardIndex % 4) * tile * .10;
        const distance = travel + extra;

        const target = {
          transform:`translate3d(${(unitX * distance).toFixed(2)}px, ${(unitY * distance).toFixed(2)}px, 0) scale(.76)`,
          opacity:0
        };

        scatterTargets.set(card, target);
        card.style.transform = target.transform;
        card.style.opacity = "0";
        card.classList.remove("focus-selected");
        card.classList.add("focus-away");
      });

      grid.classList.add("focus-mode");
      return cards;
    }

    function scatterOtherBoxes(selectedButton){
      cancelScatterAnimations();
      scatterTargets.clear();

      const { cards, targets } = prepareScatterTargets(selectedButton);
      if (!selectedButton || !cards.length) return Promise.resolve();

      grid.classList.add("focus-mode", "motion-active");

      const promises = [];

      cards.forEach((card)=>{
        card.classList.remove("focus-selected", "focus-away");
        card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
        card.style.opacity = "1";

        const target = targets.get(card);
        if (!target) return;

        scatterTargets.set(card, target);

        if (card === selectedButton) {
          card.classList.add("focus-selected");
          return;
        }

        card.classList.add("focus-away");

        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              {
                transform:"translate3d(0px, 0px, 0) scale(1)",
                opacity:1
              },
              {
                transform:target.transform,
                opacity:target.opacity
              }
            ],
            {
              duration:SCATTER_MOTION_MS,
              easing:MOTION_EASING,
              fill:"forwards"
            }
          );

          scatterAnimations.set(card, animation);
          promises.push(animation.finished.catch(()=> {}));
        } else {
          card.style.transform = target.transform;
          card.style.opacity = String(target.opacity);
        }
      });

      if (!promises.length) return wait(SCATTER_MOTION_MS);
      return Promise.all(promises);
    }

    function animateScatteredBoxesBack(){
      cancelScatterAnimations();
      grid.classList.add("motion-active");

      const cards = Array.from(grid.querySelectorAll(".box-card"));
      const promises = [];

      cards.forEach((card)=>{
        if (card.classList.contains("focus-selected")) return;

        const target = scatterTargets.get(card);
        if (!target) return;

        if (typeof card.animate === "function") {
          const animation = card.animate(
            [
              {
                transform:target.transform,
                opacity:target.opacity
              },
              {
                transform:"translate3d(0px, 0px, 0) scale(1)",
                opacity:1
              }
            ],
            {
              duration:SCATTER_MOTION_MS,
              easing:MOTION_EASING,
              fill:"forwards"
            }
          );

          scatterAnimations.set(card, animation);
          promises.push(animation.finished.catch(()=> {}));
        } else {
          card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
          card.style.opacity = "1";
        }
      });

      const finished = promises.length
        ? Promise.all(promises)
        : wait(SCATTER_MOTION_MS);

      return finished.then(()=>{
        cancelScatterAnimations();

        cards.forEach((card)=>{
          card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
          card.style.opacity = "1";
          card.classList.remove("focus-selected", "focus-away");
        });

        scatterTargets.clear();
        grid.classList.remove("focus-mode", "motion-active");
      });
    }

    function restoreScatteredBoxes(){
      cancelScatterAnimations();

      grid.querySelectorAll(".box-card").forEach((card)=>{
        card.style.transform = "translate3d(0px, 0px, 0) scale(1)";
        card.style.opacity = "1";
        card.classList.remove("focus-selected", "focus-away");
      });

      scatterTargets.clear();
      grid.classList.remove("focus-mode", "motion-active");
    }

    function focusBox(button, duration = ZOOM_IN_MOTION_MS){
      if (!button) return Promise.resolve();

      focusedIndex = Number(button.dataset.index || -1);
      activeFocusButton = button;

      const target = getBoxZoomTarget(button);
      return animateBoxZoom(target, duration);
    }

    function resetBoxZoom(duration = ZOOM_OUT_MOTION_MS){
      activeFocusButton = null;

      return animateBoxZoom({ scale:1, x:0, y:0 }, duration).then(()=>{
        focusedIndex = -1;
        requestAnimationFrame(fitAllBoxText);
      });
    }

    async function selectBoxForFocus(button, index){
      if (!button || boxInteractionLocked) return;

      openBoxAudio.unlock();
      openBoxAudio.playGo();

      boxInteractionLocked = true;
      selectedBoxIndex = index;
      activeFocusButton = button;

      try {
        const scatterFinished = scatterOtherBoxes(button);

        // تبدأ الصناديق بالابتعاد أولًا، ثم يبدأ الزوم ويستمران على compositor.
        await wait(SCATTER_LEAD_MS);

        await Promise.all([
          scatterFinished,
          focusBox(button, ZOOM_IN_MOTION_MS)
        ]);

        grid.classList.remove("motion-active");

        /*
          بمجرد أن يثبت الصندوق المختار في المنتصف نفتحه مباشرة.
          لا ننتظر نقرة ثانية، مع إبقاء القفل حتى تنتهي حركة الغطاء.
        */
        if (!opened.has(index)) {
          await performOpenSelectedBox();
        } else {
          requestAnimationFrame(()=> {
            fitOpenedBoxContent(button);
            showMultiAnswerPanel(items[index],index,button);
          });
        }

        collapseSafariBars();
      } finally {
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }
    }

    function hideMultiAnswerPanel(){
      multiAnswerLayer?.classList.remove("is-visible");
      multiAnswerLayer?.setAttribute("aria-hidden","true");
      if (multiAnswerGrid) multiAnswerGrid.innerHTML = "";
      grid?.querySelectorAll(".box-card.multi-answer-active").forEach((card)=>{
        card.classList.remove("multi-answer-active");
        card.style.removeProperty("--multi-box-safe-nudge-y");
      });
      page?.classList.remove("multi-answer-mode-active");
      answerPanelBoxIndex = -1;
    }

    function fitMultiAnswerQuestionCard(card){
      if (!card || !multiAnswerLayer?.classList.contains("is-visible")) return;

      const wrap = card.querySelector(".box-wrap");
      if (!wrap) return;

      card.style.setProperty("--multi-box-safe-nudge-y","0px");

      requestAnimationFrame(()=> requestAnimationFrame(()=> {
        if (!card.classList.contains("multi-answer-active")) return;

        const wrapRect = wrap.getBoundingClientRect();
        const answersRect = multiAnswerLayer.getBoundingClientRect();
        const viewportTop = window.visualViewport?.offsetTop || 0;
        const safeTop = viewportTop + 14;
        const safeBottom = Math.max(safeTop + 80, answersRect.top - 12);
        let screenNudge = 0;

        if (wrapRect.bottom > safeBottom) {
          screenNudge -= wrapRect.bottom - safeBottom;
        }
        if (wrapRect.top + screenNudge < safeTop) {
          screenNudge += safeTop - (wrapRect.top + screenNudge);
        }

        const parentScale = Math.max(1,boxFocusState.scale || 1);
        card.style.setProperty(
          "--multi-box-safe-nudge-y",
          `${(screenNudge / parentScale).toFixed(2)}px`
        );
      }));
    }

    function createMultiAnswerChoice(choice, choiceIndex, entry, boxIndex){
      const button = document.createElement("button");
      button.type = "button";
      button.className = "multi-answer-choice";
      button.dataset.choiceIndex = String(choiceIndex);
      applyBoxPalette(button,choiceIndex + 2);

      const shell = document.createElement("span");
      shell.className = "answer-box-shell";

      const content = document.createElement("span");
      content.className = "answer-box-content";

      if (entry.answersType === "images") {
        const image = document.createElement("img");
        image.className = "answer-box-image";
        image.alt = `الاختيار ${choiceIndex + 1}`;
        image.src = choice.imageData || choice.imageName || "";
        content.appendChild(image);
      } else {
        const text = document.createElement("span");
        text.className = "answer-box-text";
        text.textContent = choice.text || `الاختيار ${choiceIndex + 1}`;
        content.appendChild(text);
      }

      shell.appendChild(content);
      button.appendChild(shell);
      button.setAttribute(
        "aria-label",
        entry.answersType === "images"
          ? `الاختيار ${choiceIndex + 1}`
          : (choice.text || `الاختيار ${choiceIndex + 1}`)
      );

      if (answeredBoxes.has(boxIndex)) {
        button.disabled = true;
        if (choiceIndex === entry.correctChoiceIndex) button.classList.add("is-correct");
      }

      button.addEventListener("click",(event)=>{
        event.preventDefault();
        event.stopPropagation();
        if (answeredBoxes.has(boxIndex) || button.disabled) return;

        if (choiceIndex === entry.correctChoiceIndex) {
          answeredBoxes.add(boxIndex);
          button.classList.add("is-correct");
          multiAnswerGrid?.querySelectorAll(".multi-answer-choice").forEach((item)=>{
            item.disabled = true;
          });
          return;
        }

        button.classList.add("is-wrong");
        button.disabled = true;
      });

      return button;
    }

    function showMultiAnswerPanel(entry, boxIndex, card){
      if (!multiAnswerEnabled || !multiAnswerLayer || !multiAnswerGrid) return false;

      const answerData = normalizeAnswerChoices(entry);
      if (answerData.choices.length < 2 || answerData.correctChoiceIndex < 0) return false;

      entry.answersType = answerData.answersType;
      entry.choices = answerData.choices;
      entry.correctChoiceIndex = answerData.correctChoiceIndex;

      multiAnswerGrid.innerHTML = "";
      multiAnswerGrid.style.setProperty(
        "--answer-columns",
        String(Math.min(4,Math.max(1,answerData.choices.length)))
      );
      answerData.choices.forEach((choice,choiceIndex)=>{
        multiAnswerGrid.appendChild(
          createMultiAnswerChoice(choice,choiceIndex,entry,boxIndex)
        );
      });

      answerPanelBoxIndex = boxIndex;
      card?.classList.add("multi-answer-active");
      page?.classList.add("multi-answer-mode-active");
      multiAnswerLayer.classList.add("is-visible");
      multiAnswerLayer.setAttribute("aria-hidden","false");
      fitMultiAnswerQuestionCard(card);
      return true;
    }

    async function performOpenSelectedBox(){
      if (
        selectedBoxIndex < 0 ||
        !activeFocusButton ||
        opened.has(selectedBoxIndex)
      ) {
        return;
      }

      openBoxAudio.playOpen();

      opened.add(selectedBoxIndex);
      activeFocusButton.classList.add("opened");
      activeFocusButton.setAttribute("aria-pressed", "true");

      requestAnimationFrame(()=> fitOpenedBoxContent(activeFocusButton));
      window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 120);
      window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 430);
      window.setTimeout(()=> fitOpenedBoxContent(activeFocusButton), 920);

      // ننتظر اكتمال حركة الغطاء، ثم نظهر الإجابات تلقائيًا.
      await wait(1320);
      showMultiAnswerPanel(items[selectedBoxIndex],selectedBoxIndex,activeFocusButton);
    }

    async function openSelectedBox(event){
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      if (
        boxInteractionLocked ||
        selectedBoxIndex < 0 ||
        !activeFocusButton ||
        opened.has(selectedBoxIndex)
      ) {
        return;
      }

      openBoxAudio.unlock();

      boxInteractionLocked = true;

      try {
        await performOpenSelectedBox();
      } finally {
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }
    }

    async function returnFocusScene(){
      if (boxInteractionLocked) return;

      hideMultiAnswerPanel();

      openBoxAudio.unlock();
      openBoxAudio.playReturn();

      boxInteractionLocked = true;

      try {
        await Promise.all([
          animateScatteredBoxesBack(),
          resetBoxZoom(ZOOM_OUT_MOTION_MS)
        ]);

        selectedBoxIndex = -1;
        activeFocusButton = null;
        requestAnimationFrame(fitAllBoxText);
        collapseSafariBars();
      } finally {
        boxInteractionLocked = false;
      }
    }

    function hasFocusedScene(){
      return (
        focusedIndex >= 0 ||
        boxFocusState.scale > 1.001 ||
        selectedBoxIndex >= 0
      );
    }

    async function advanceFocusedScene(event){
      if (!hasFocusedScene()) return;
      if (boxInteractionLocked) return;
      if (event?.target?.closest?.(".fixed-controls")) return;
      if (event?.target?.closest?.(".multi-answer-layer")) return;
      if (selectedBoxIndex < 0 || !activeFocusButton) return;

      if (
        multiAnswerEnabled &&
        answerPanelBoxIndex === selectedBoxIndex &&
        !answeredBoxes.has(selectedBoxIndex)
      ) {
        return;
      }

      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      /*
        الصندوق يُفتح تلقائيًا بعد انتهاء حركة التقريب.
        النقرة التالية تعيد الصندوق إلى مكانه بعد الإجابة.
      */
      if (!opened.has(selectedBoxIndex)) {
        await openSelectedBox(event);
        return;
      }

      await returnFocusScene();
    }

    async function handleBoxClick(event, button, index){
      event.preventDefault();
      event.stopPropagation();

      if (boxInteractionLocked) return;

      if (!hasFocusedScene()) {
        await selectBoxForFocus(button, index);
        return;
      }

      await advanceFocusedScene(event);
    }

    async function handleSceneTap(event){
      await advanceFocusedScene(event);
    }


    function clearFinishSequenceTimers(){

      finishSequenceTimers = [];
    }

    function resetFinishSequenceClasses(){
      endCelebration?.classList.remove(
        "finish-sequence-start",
        "finish-message-in",
        "finish-actions-in",
        "finish-confetti-on"
      );
    }

    function queueFinishStep(token, delay, classNames){
      const timer = window.setTimeout(()=>{
        if (token !== finishSequenceToken) return;
        classNames.forEach((className)=>endCelebration?.classList.add(className));
      },delay);
      finishSequenceTimers.push(timer);

    async function showEndCelebration(){
      hideMultiAnswerPanel();
      const token = ++finishSequenceToken;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      page.classList.add("activity-ended","ended");
      endCelebration?.classList.add("is-visible");
      endCelebration?.setAttribute("aria-hidden","false");
      boxInteractionLocked = true;
      await openBoxAudio.ready("finish");
      if (token !== finishSequenceToken) return;
      await new Promise((resolve)=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      if (token !== finishSequenceToken) return;
      endCelebration?.classList.add("finish-sequence-start");
      openBoxAudio.playFinish();
      queueFinishStep(token,2680,["finish-message-in","finish-confetti-on"]);
      queueFinishStep(token,3180,["finish-actions-in"]);
      collapseSafariBars({ refresh:false });
    }

    function hideEndCelebration(){
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      openBoxAudio.stopNamed("finish");
      page.classList.remove("activity-ended","ended");
      endCelebration?.classList.remove("is-visible");
      endCelebration?.setAttribute("aria-hidden","true");

    function goHomePage(){
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      openBoxAudio.stopNamed("finish");
      themeIntroAudio.stop();
      try {
        window.location.assign(new URL("index.html",window.location.href).href);
      } catch (_) {
        window.location.href = "index.html";
      }

    async function resetBoxes(event){
      hideEndCelebration();
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      const shouldPlayReturnSound =
        focusedIndex >= 0 ||
        boxFocusState.scale > 1.001 ||
        selectedBoxIndex >= 0 ||
        scatterTargets.size > 0;

      if (shouldPlayReturnSound) {
        openBoxAudio.unlock();
        openBoxAudio.playReturn();
      }

      opened.clear();
      answeredBoxes.clear();
      hideMultiAnswerPanel();

      document.querySelectorAll(".box-card.opened").forEach((card)=>{
        card.classList.remove("opened");
        card.setAttribute("aria-pressed", "false");
      });

      boxInteractionLocked = true;

      try {
        const scatterReturn = scatterTargets.size
          ? animateScatteredBoxesBack()
          : Promise.resolve();

        await Promise.all([
          scatterReturn,
          resetBoxZoom(ZOOM_OUT_MOTION_MS)
        ]);

        selectedBoxIndex = -1;
        activeFocusButton = null;
      } finally {
        boxInteractionLocked = false;
        if (pendingViewportLayout && !introLayoutFrozen) {
          scheduleResponsiveLayout(40);
        }
      }

      window.setTimeout(()=> {
        document.querySelectorAll(".box-card:not(.opened)").forEach(fitClosedCoverText);
      }, 80);

      collapseSafariBars();
    }

    function collapseSafariBars(options = {}){
      const refresh = options.refresh !== false;

      safariTimers.forEach((timer)=> clearTimeout(timer));
      safariTimers = [];

      [0, 80, 220, 520, 900].forEach((delay)=>{
        safariTimers.push(setTimeout(()=>{
          try {
            window.scrollTo({ top:80, left:0, behavior:"auto" });
          } catch (_) {
            window.scrollTo(0, 80);
          }

          /*
            أثناء حركة البداية نطوي شريط Safari فقط، ولا نعيد حساب
            أحجام الصناديق تحت حركة الكاميرا.
          */
          if (refresh && !introLayoutFrozen) {
            scheduleResponsiveLayout();
          } else if (refresh) {
            pendingViewportLayout = true;
          }
        }, delay));
      });
    }

          window.location.replace(`${destination.pathname}${destination.search}${destination.hash}`);

        }

      window.location.replace("index.html#wheelSetup");

    async function playOpeningIntro(){
      if (!page || !stage || !grid) return;

      if (introFrameId) {
        cancelAnimationFrame(introFrameId);
        introFrameId = null;
      }

      page.classList.remove("intro-done", "intro-boxes-entering");
      page.classList.add("intro-playing", "intro-camera");

      pendingViewportLayout = false;
      introLayoutFrozen = false;

      const holdMs = 2200;
      const zoomMs = 7600;
      const settlePauseMs = 280;
      const startBgScale = 1;
      const endBgScale =
        Number(getComputedStyle(page).getPropertyValue("--intro-bg-final-scale")) || 1.18;

      let startTime = null;

      const setCameraFrame = (bgScale)=>{
        stage.style.transform = "translate3d(0,0,0) scale(1)";
        stage.style.animation = "none";

        if (themeBackground) {
          themeBackground.style.transform =
            `translate3d(0,0,0) scale(${Number(bgScale).toFixed(5)})`;
          themeBackground.style.animation = "none";

          const ratio =
            (bgScale - startBgScale) /
            Math.max(.001, endBgScale - startBgScale);
          const saturation = 1.04 - ratio * .04;

          themeBackground.style.filter =
            `saturate(${Math.max(1, Math.min(1.04, saturation))})`;
        }
      };

      const completeIntro = ()=>{
        if (introFrameId) {
          cancelAnimationFrame(introFrameId);
          introFrameId = null;
        }

        setCameraFrame(endBgScale);

        page.classList.remove(
          "intro-playing",
          "intro-camera",
          "intro-boxes-entering"
        );
        page.classList.add("intro-done");

        if (themeBackground) {
          themeBackground.style.filter = "";
        }

        if (fixedControls) {
          fixedControls.style.opacity = "1";
          fixedControls.style.transform = "none";
          fixedControls.style.pointerEvents = "";
        }

        introLayoutFrozen = false;
        boxInteractionLocked = false;
        pendingViewportLayout = false;

        collapseSafariBars({ refresh:false });
      };

      if (fixedControls) {
        fixedControls.style.opacity = "0";
        fixedControls.style.transform = "translateY(12px)";
        fixedControls.style.pointerEvents = "none";
      }

      /*
        أثناء كاميرا الخلفية تكون الصناديق مخفية، لذلك نسمح لسفاري
        بتحديث المساحة المرئية وترتيب الشبكة دون أن يرى المستخدم أي قفزة.
      */
      syncVisualViewportFrame(true);
      applyLayout({ force:true });
      fitAllBoxText();

      setCameraFrame(startBgScale);
      collapseSafariBars();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        await new Promise((resolve)=>{
          const animate = (now)=>{
            if (startTime === null) startTime = now;
            const elapsed = now - startTime;

            if (elapsed < holdMs) {
              setCameraFrame(startBgScale);
              introFrameId = requestAnimationFrame(animate);
              return;
            }

            const progress = Math.max(
              0,
              Math.min(1, (elapsed - holdMs) / zoomMs)
            );
            const eased = easeInOutSine(progress);
            const bgScale =
              startBgScale + (endBgScale - startBgScale) * eased;

            setCameraFrame(bgScale);

            if (progress < 1) {
              introFrameId = requestAnimationFrame(animate);
              return;
            }

            introFrameId = null;
            resolve();
          };

          introFrameId = requestAnimationFrame(animate);
        });
      } else {
        setCameraFrame(endBgScale);
      }

      /*
        الكاميرا ثبتت الآن. نحسب المقاس والمركز النهائيين مرة واحدة
        بينما الشبكة ما زالت مخفية، ثم نجمد التخطيط خلال دخول الصناديق.
      */
      collapseSafariBars({ refresh:false });

      await wait(settlePauseMs);

      syncVisualViewportFrame(true);
      applyLayout({ force:true });
      setBoxFocusState(1, 0, 0);
      fitAllBoxText();

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      introLayoutFrozen = true;
      boxInteractionLocked = true;

      prepareIntroScatterTargets();

      /*
        إزالة intro-camera تجعل الشبكة مرئية، لكنها لا تومض:
        كل صندوق موجود مسبقًا خارج المشهد وبشفافية صفر.
      */
      page.classList.remove("intro-camera");
      page.classList.add("intro-boxes-entering");

      await new Promise((resolve)=>{
        requestAnimationFrame(()=>{
          requestAnimationFrame(resolve);
        });
      });

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        // نفس دالة عودة الصناديق المستخدمة بعد إلغاء اختيار صندوق.
        await animateScatteredBoxesBack();
      } else {
        restoreScatteredBoxes();
      }

      completeIntro();
    }

    async function initializeOpenBoxGame(){
      await hydrateItemsFromIndexedDB();

      opened.clear();
      focusedIndex = -1;
      selectedBoxIndex = -1;
      activeFocusButton = null;
      boxInteractionLocked = false;
      openBoxAudio.setEnabled(boxSoundEnabled);
      openBoxAudio.preload();
      themeIntroAudio.setEnabled(boxSoundEnabled);

      applyTheme(currentTheme);
      syncVisualViewportFrame(true);
      setBoxFocusState(1, 0, 0);
      renderBoxes();
      themeIntroAudio.preload(currentTheme);

      startGate?.classList.add("is-visible");
      startGate?.setAttribute("aria-hidden","false");
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      resetFinishSequenceClasses();
      page.classList.remove("activity-ended","ended");
      endCelebration?.classList.remove("is-visible");
      endCelebration?.setAttribute("aria-hidden","true");
      void openBoxAudio.ready("finish");
    }

    window.addEventListener("pagehide",()=>{
      finishSequenceToken += 1;
      clearFinishSequenceTimers();
      openBoxAudio.stopNamed("finish");
    },{passive:true});

    initializeOpenBoxGame();
  </script>
