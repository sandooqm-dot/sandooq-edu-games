<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>صندوق الالعاب التعليمية</title>

  <style>
    :root{
      --bg:#ece8cf;
      --ink:#111111;
      --panel:#e9e9e9;
      --title-yellow:#efd553;
      --orange:#f47a45;
      --orange-dark:#e66a35;
      --blue-bar:#5e88db;
      --home-red:#f05d5b;
      --home-yellow:#efd553;
      --green:#59c46a;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --footer-h: 78px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family: Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--ink);
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }

    .page{
      position:relative;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:auto;
      background:var(--bg);
      padding:
        max(14px, var(--safe-top))
        clamp(14px, 2vw, 28px)
        calc(var(--footer-h) + 18px + var(--safe-bottom));
    }

    .shell{
      width:min(100%, 1120px);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(14px, 1.7vw, 22px);
      position:relative;
      z-index:2;
    }

    .decor{
      position:absolute;
      pointer-events:none;
      z-index:0;
    }

    body.subpage .decor{
      display:none;
    }

    .decor.coil{ left:2.5%; top:28px; width:90px; }
    .decor.stars{ right:3.4%; top:22px; width:110px; }
    .decor.flower{ left:9%; top:230px; width:66px; }
    .decor.wave{ left:-1%; top:415px; width:170px; }
    .decor.splash{ right:3.6%; top:468px; width:110px; }

    .title-pill{
      width:min(900px, 88%);
      min-height:54px;
      background:var(--title-yellow);
      border:3px solid var(--ink);
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:11px 18px;
      font-size:clamp(24px, 2.65vw, 38px);
      font-weight:700;
      line-height:1.05;
      white-space:nowrap;
    }

    .play-shell{
      width:min(920px, 86%);
      margin-top:clamp(18px, 3.6vw, 46px);
      background:var(--orange);
      border:3px solid var(--ink);
      border-radius:28px;
      padding:10px;
    }

    .play-card{
      width:100%;
      min-height:170px;
      background:var(--panel);
      border:3px solid var(--ink);
      border-radius:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(10px, 1.15vw, 15px);
      padding:17px 20px;
    }

    .play-title{
      margin:0;
      font-size:clamp(28px, 3.1vw, 46px);
      font-weight:700;
      line-height:1.05;
      text-align:center;
    }

    .select-wrap{
      position:relative;
      width:min(620px, 78%);
      height:52px;
    }

    .select-wrap select{
      width:100%;
      height:100%;
      appearance:none;
      border:3px solid var(--ink);
      border-radius:22px;
      background:#fff;
      color:#5a5a5a;
      padding:0 70px 0 28px;
      text-align:center;
      text-align-last:center;
      font-size:clamp(17px, 1.85vw, 26px);
      font-weight:700;
      outline:none;
    }

    .select-wrap::after{
      content:"";
      position:absolute;
      left:22px;
      top:50%;
      transform:translateY(-35%);
      border-left:13px solid transparent;
      border-right:13px solid transparent;
      border-top:20px solid #666;
      pointer-events:none;
    }

    .start-btn{
      min-width:190px;
      height:46px;
      border:none;
      border-radius:20px;
      border:2px solid var(--ink);
      background:linear-gradient(180deg, #ff7f45 0%, var(--orange-dark) 100%);
      color:#fff;
      font-size:clamp(18px, 1.75vw, 26px);
      font-weight:700;
      line-height:1;
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      padding:0 28px;
      cursor:pointer;
    }

    .cards-grid{
      width:min(760px, 76%);
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:clamp(14px, 1.7vw, 22px) clamp(18px, 2vw, 26px);
      margin-top:clamp(8px, 1.1vw, 14px);
    }

    .secondary-grid{
      margin-top:auto;
      margin-bottom:clamp(16px, 2.4vw, 30px);
    }

    .menu-btn{
      min-height:64px;
      border:none;
      border-radius:24px;
      border:3px solid var(--ink);
      background:#f6f6f6;
      color:#111;
      font-size:clamp(20px, 2vw, 32px);
      font-weight:700;
      line-height:1.1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:10px 16px;
      cursor:pointer;
    }

    .bottom-bar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding-bottom:var(--safe-bottom);
      background:var(--blue-bar);
      border-top:3px solid var(--ink);
      z-index:20;
    }

    .home-btn{
      position:absolute;
      left:10px;
      top:50%;
      transform:translateY(-50%);
      min-width:142px;
      height:46px;
      border:none;
      border-radius:20px;
      border:2px solid var(--ink);
      background:var(--home-red);
      color:#fff;
      font-size:clamp(18px, 1.6vw, 26px);
      font-weight:700;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      cursor:pointer;
    }

    body.subpage .home-btn{
      background:var(--home-yellow);
      color:#111;
    }

    .screen{
      display:none;
      width:min(1180px, 92%);
      margin:0 auto;
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:26px 24px;
      position:relative;
      z-index:5;
    }

    .screen.active{
      display:block;
    }

    .screen-title{
      margin:0 0 18px;
      text-align:center;
      font-size:clamp(30px, 3vw, 48px);
      font-weight:700;
      line-height:1.2;
    }

    .screen-note{
      margin:0;
      color:#444;
      text-align:center;
      font-size:clamp(18px, 1.8vw, 24px);
      line-height:1.9;
      font-weight:650;
    }

    .template-list{
      display:grid;
      grid-template-columns:1fr;
      gap:clamp(18px, 2.4vw, 28px);
      margin-top:clamp(18px, 2.3vw, 28px);
    }

    .template-card{
      width:100%;
      min-height:clamp(170px, 18vw, 230px);
      border:6px solid var(--ink);
      border-radius:30px;
      background:#fff;
      display:grid;
      grid-template-columns:clamp(120px, 20vw, 220px) minmax(0, 1fr);
      gap:clamp(18px, 3vw, 34px);
      align-items:center;
      padding:clamp(16px, 2.3vw, 26px);
      direction:ltr;
      text-align:right;
    }

    .template-cover{
      width:100%;
      aspect-ratio:4/3;
      border-radius:18px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.92) 0 20%, transparent 21%),
        conic-gradient(from 20deg, #ff5b8b 0 16%, #f7c948 16% 32%, #42b883 32% 48%, #4f89e6 48% 64%, #f47a45 64% 80%, #9b5de5 80% 100%);
      border:2px solid rgba(17,17,17,.12);
      overflow:hidden;
    }

    .template-cover.empty{
      background:
        linear-gradient(135deg, rgba(244,211,60,.42), rgba(255,255,255,.88)),
        radial-gradient(circle at 30% 30%, rgba(244,122,69,.22) 0 12%, transparent 13%),
        radial-gradient(circle at 70% 70%, rgba(94,136,219,.18) 0 15%, transparent 16%);
    }

    .template-content{
      direction:rtl;
      min-width:0;
    }

    .template-title{
      margin:0 0 clamp(10px, 1.5vw, 18px);
      font-size:clamp(32px, 4.2vw, 58px);
      line-height:1.05;
      font-weight:800;
      color:#111;
    }

    .template-desc{
      margin:0;
      color:#5b5b5b;
      font-size:clamp(18px, 2.25vw, 30px);
      line-height:1.7;
      font-weight:700;
    }

    /* Tablet */
    @media (max-width: 1100px){
      .decor.flower{ top:255px; left:7%; width:56px; }
      .decor.wave{ top:455px; width:150px; }
      .decor.splash{ top:530px; width:100px; }
      .cards-grid{ gap:14px 18px; }
      .menu-btn{ min-height:58px; }
    }

    /* Mobile / portrait */
    @media (max-width: 760px){
      :root{ --footer-h: 72px; }

      .page{
        padding: max(10px, var(--safe-top)) 12px calc(var(--footer-h) + 14px + var(--safe-bottom));
      }

      .shell{
        min-height:calc(100dvh - var(--footer-h) - 24px - var(--safe-bottom));
        gap:10px;
      }

      .decor.coil{ left:10px; top:18px; width:50px; }
      .decor.stars{ right:10px; top:16px; width:64px; }
      .decor.flower{ left:12px; top:210px; width:40px; }
      .decor.wave{ left:-34px; top:auto; bottom:132px; width:98px; }
      .decor.splash{ right:8px; top:auto; bottom:86px; width:68px; }

      .title-pill{
        width:90%;
        min-height:44px;
        border-radius:18px;
        padding:8px 14px;
        font-size:clamp(18px, 4.8vw, 24px);
      }

      .play-shell,
      .screen{
        width:92%;
      }

      .play-shell{
        border-radius:24px;
        padding:8px;
      }

      .play-card{
        min-height:auto;
        padding:14px 12px 13px;
        gap:10px;
        border-radius:20px;
      }

      .play-title{
        font-size:clamp(20px, 5.4vw, 27px);
      }

      .select-wrap{
        width:100%;
        height:50px;
      }

      .select-wrap select{
        font-size:clamp(15px, 3.8vw, 19px);
        padding:0 50px 0 18px;
        border-radius:19px;
      }

      .select-wrap::after{
        left:17px;
        border-left-width:12px;
        border-right-width:12px;
        border-top-width:18px;
      }

      .start-btn{
        min-width:150px;
        height:42px;
        font-size:clamp(17px, 4.7vw, 22px);
        border-radius:18px;
      }

      .cards-grid{
        grid-template-columns:1fr;
        gap:10px;
        margin-top:0;
        width:88%;
      }

      .secondary-grid{
        margin-top:auto;
        margin-bottom:10px;
      }

      .menu-btn{
        min-height:50px;
        border-radius:19px;
        font-size:clamp(16px, 4.7vw, 21px);
        padding:10px 14px;
      }

      .home-btn{
        min-width:116px;
        height:46px;
        font-size:20px;
        left:8px;
      }

      .screen{
        border-radius:22px;
        padding:20px 16px;
      }

      .screen-title{
        font-size:clamp(24px, 6vw, 32px);
      }

      .screen-note{
        font-size:clamp(16px, 4.2vw, 20px);
      }

      .template-list{
        gap:14px;
        margin-top:16px;
      }

      .template-card{
        min-height:138px;
        border-width:4px;
        border-radius:22px;
        grid-template-columns:96px minmax(0, 1fr);
        gap:12px;
        padding:12px;
      }

      .template-cover{
        border-radius:14px;
      }

      .template-title{
        font-size:clamp(24px, 6vw, 32px);
        margin-bottom:8px;
      }

      .template-desc{
        font-size:clamp(14px, 3.8vw, 18px);
        line-height:1.55;
      }
    }

    /*
      عند تكبير الصفحة في الجوال/ظهور واجهة المتصفح بشكل يأخذ مساحة أكبر،
      يصغر التصميم حتى لا تصير المربعات والنصوص ضخمة أو تحتاج تمرير كثير.
    */
    @media (max-width: 760px) and (max-height: 760px){
      :root{ --footer-h: 66px; }

      .page{
        padding-top:max(8px, var(--safe-top));
      }

      .shell{
        gap:9px;
      }

      .title-pill{
        min-height:42px;
        font-size:clamp(18px, 4.8vw, 24px);
        border-radius:16px;
      }

      .play-shell{
        padding:7px;
      }

      .play-card{
        padding:11px 10px;
        gap:8px;
      }

      .play-title{
        font-size:clamp(20px, 5.5vw, 27px);
      }

      .select-wrap{
        height:45px;
      }

      .select-wrap select{
        font-size:clamp(15px, 4vw, 19px);
      }

      .start-btn{
        height:42px;
        min-width:150px;
        font-size:clamp(17px, 4.8vw, 22px);
      }

      .menu-btn{
        min-height:46px;
        font-size:clamp(15px, 4.3vw, 20px);
      }

      .cards-grid{
        gap:8px;
      }

      .secondary-grid{
        margin-bottom:8px;
      }

      .home-btn{
        height:42px;
        min-width:108px;
        font-size:18px;
      }
      .template-card{
        min-height:118px;
        grid-template-columns:82px minmax(0, 1fr);
        gap:10px;
        padding:10px;
      }

      .template-title{
        font-size:clamp(21px, 5.2vw, 28px);
      }

      .template-desc{
        font-size:clamp(13px, 3.4vw, 16px);
      }

    }
    @media (min-width: 761px){
      .shell{
        min-height:calc(100dvh - var(--footer-h) - 34px - var(--safe-bottom));
      }

      .primary-grid{
        margin-top:clamp(10px, 1.5vw, 20px);
      }
    }

    /* v20: ضبط التكبير في الجوال ومنع تضخم النصوص داخل المربعات */
    @media (max-width: 760px){
      .page{
        padding-left:14px;
        padding-right:14px;
      }

      .shell{
        width:100%;
        max-width:520px;
        gap:10px;
      }

      .title-pill{
        width:88%;
        min-height:40px;
        padding:7px 12px;
        border-width:3px;
        border-radius:16px;
        font-size:clamp(17px, 4.2vw, 22px);
        line-height:1.05;
      }

      .play-shell{
        width:90%;
        padding:7px;
        border-radius:22px;
        margin-top:10px;
      }

      .play-card{
        padding:10px 10px 11px;
        gap:8px;
        border-radius:19px;
      }

      .play-title{
        font-size:clamp(18px, 4.8vw, 24px);
        line-height:1.05;
      }

      .select-wrap{
        width:92%;
        height:42px;
      }

      .select-wrap select{
        font-size:clamp(13px, 3.35vw, 16px);
        padding-right:38px;
        padding-left:34px;
        border-width:3px;
        border-radius:17px;
        line-height:1;
      }

      .select-wrap::after{
        left:13px;
        border-left-width:9px;
        border-right-width:9px;
        border-top-width:14px;
      }

      .start-btn{
        min-width:136px;
        height:38px;
        font-size:clamp(15px, 4vw, 19px);
        border-radius:16px;
        padding:0 18px;
      }

      .cards-grid{
        width:84%;
        gap:9px;
      }

      .menu-btn{
        min-height:46px;
        border-radius:17px;
        border-width:3px;
        font-size:clamp(15px, 4vw, 19px);
        line-height:1.1;
        padding:8px 12px;
      }

      .bottom-bar{
        height:calc(66px + var(--safe-bottom));
      }

      .home-btn{
        min-width:104px;
        height:40px;
        border-radius:16px;
        font-size:17px;
        padding:0 16px;
      }

      .screen{
        width:92%;
        padding:16px 12px;
        border-width:3px;
        border-radius:22px;
      }

      .screen-title{
        font-size:clamp(22px, 5.4vw, 28px);
        margin-bottom:14px;
      }

      .screen-note{
        font-size:clamp(14px, 3.7vw, 17px);
      }

      .template-list{
        gap:12px;
        margin-top:14px;
      }

      .template-card{
        min-height:auto;
        grid-template-columns:74px minmax(0, 1fr);
        gap:10px;
        padding:10px;
        border-width:4px;
        border-radius:20px;
        align-items:center;
      }

      .template-cover{
        border-radius:12px;
      }

      .template-title{
        font-size:clamp(20px, 5vw, 25px);
        line-height:1.05;
        margin-bottom:6px;
      }

      .template-desc{
        font-size:clamp(12px, 3.2vw, 15px);
        line-height:1.45;
      }
    }

    @media (max-width: 760px) and (max-height: 760px){
      :root{ --footer-h: 62px; }

      .page{
        padding-top:max(7px, var(--safe-top));
        padding-bottom:calc(62px + 10px + var(--safe-bottom));
      }

      .shell{
        gap:8px;
      }

      .title-pill{
        min-height:36px;
        font-size:clamp(16px, 3.9vw, 20px);
      }

      .play-shell{
        margin-top:8px;
        padding:6px;
      }

      .play-card{
        padding:9px;
        gap:7px;
      }

      .play-title{
        font-size:clamp(17px, 4.3vw, 22px);
      }

      .select-wrap{
        height:38px;
      }

      .select-wrap select{
        font-size:clamp(12px, 3.1vw, 15px);
      }

      .select-wrap::after{
        border-left-width:8px;
        border-right-width:8px;
        border-top-width:12px;
      }

      .start-btn{
        height:35px;
        min-width:126px;
        font-size:clamp(14px, 3.7vw, 18px);
      }

      .menu-btn{
        min-height:42px;
        font-size:clamp(14px, 3.7vw, 18px);
      }

      .cards-grid{
        gap:7px;
      }

      .template-card{
        grid-template-columns:64px minmax(0, 1fr);
        gap:8px;
        padding:8px;
      }

      .template-title{
        font-size:clamp(18px, 4.5vw, 23px);
      }

      .template-desc{
        font-size:clamp(11px, 2.9vw, 14px);
        line-height:1.35;
      }
    }

    @media (max-width: 430px){
      .select-wrap select{
        letter-spacing:-0.2px;
      }

      .play-title,
      .title-pill,
      .menu-btn{
        letter-spacing:-0.25px;
      }
    }

    /* صفحة إعداد العجلة */
    .wheel-setup{
      display:none;
      width:min(1180px, 92%);
      margin:0 auto;
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:clamp(18px, 2.4vw, 28px);
      position:relative;
      z-index:5;
    }

    .wheel-setup.active{
      display:block;
    }

    .wheel-layout{
      display:grid;
      grid-template-columns:minmax(280px, 420px) minmax(0, 1fr);
      gap:clamp(18px, 3vw, 34px);
      align-items:center;
      margin-top:clamp(16px, 2vw, 24px);
    }

    .wheel-preview-box{
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:clamp(18px, 2.2vw, 26px);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:clamp(330px, 34vw, 430px);
      position:relative;
      overflow:hidden;
    }

    .wheel-arrow{
      position:absolute;
      left:clamp(10px, 1.5vw, 20px);
      top:50%;
      transform:translateY(-50%);
      width:0;
      height:0;
      border-top:24px solid transparent;
      border-bottom:24px solid transparent;
      border-left:42px solid #d0d0d0;
      filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));
      z-index:3;
    }

    .wheel-preview{
      width:min(84vw, 330px);
      max-width:100%;
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      border:5px solid #efefef;
      box-shadow:0 8px 22px rgba(0,0,0,.12);
      background:
        conic-gradient(
          #ec174f 0deg 40deg,
          #ffffff 40deg 80deg,
          #2e75d4 80deg 120deg,
          #ffffff 120deg 160deg,
          #f39c12 160deg 200deg,
          #ffffff 200deg 240deg,
          #1abc9c 240deg 280deg,
          #ffffff 280deg 320deg,
          #ec174f 320deg 360deg
        );
      overflow:hidden;
      transition:transform 2.8s cubic-bezier(.12,.72,.13,1);
    }

    .wheel-preview::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.95) calc(50% - 1px), rgba(255,255,255,.95) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(255,255,255,.95) calc(50% - 1px), rgba(255,255,255,.95) calc(50% + 1px), transparent calc(50% + 1px)),

        <div class="wheel-actions">
          <button class="test-btn" type="button" id="testWheelBtn">اختبار اللعبة</button>
          <button class="save-btn" type="button" id="saveWheelBtn">حفظ اللعبة</button>
        </div>
      </div>
    </section>

    <section class="screen" id="savedScreen">
      <h2 class="screen-title">العابي المحفوظة</h2>
      <p class="screen-note">ستظهر ألعابك المحفوظة هنا.</p>
    </section>

    <section class="screen" id="backupScreen">
      <h2 class="screen-title">التصدير والاستيراد</h2>
      <p class="screen-note">صدّر ألعابك كملف أو استوردها على جهاز آخر.</p>
    </section>

    <section class="screen" id="settingsScreen">
      <h2 class="screen-title">الإعدادات</h2>
      <p class="screen-note">تحكم بالصوت وطريقة العرض داخل اللعبة.</p>
    </section>
  </main>

  <div class="bottom-bar">
    <button class="home-btn" type="button" id="homeButton">الرئيسية</button>
  </div>
  <script>
    const WEBSITE_HOME_URL = "https://sandooq-games.com/";
    const screens = ["createScreen","wheelSetupScreen","savedScreen","backupScreen","settingsScreen"];
    const homeShell = document.getElementById("homeShell");
    const homeButton = document.getElementById("homeButton");

    let wheelContentType = "text";
    let wheelEntries = [];

    function openScreen(id){
      const isSubpage = Boolean(id);
      document.body.classList.toggle("subpage", isSubpage);

      screens.forEach((sid)=>{
        const el = document.getElementById(sid);
        if (el) el.classList.toggle("active", sid === id);
      });

      if (homeShell) homeShell.style.display = isSubpage ? "none" : "flex";

      window.scrollTo({ top:0, behavior:"instant" });
    }

    document.querySelectorAll("[data-open-screen]").forEach((btn)=>{
      btn.addEventListener("click", ()=> openScreen(btn.getAttribute("data-open-screen")));
    });

    document.querySelectorAll("[data-template='wheel']").forEach((btn)=>{
      btn.addEventListener("click", ()=> {
        openScreen("wheelSetupScreen");
        renderWheelEntries();
      });
    });

    const wheelItemsEditor = document.getElementById("wheelItemsEditor");
    const addWheelItemBtn = document.getElementById("addWheelItemBtn");
    const itemsHint = document.getElementById("itemsHint");

    function entryHint(){
      if (wheelContentType === "images") return "أضف الصور التي تظهر داخل أقسام العجلة.";
      if (wheelContentType === "mixed") return "أضف صورة ومعها نص مختصر لكل عنصر.";
      return "أضف كلمات أو أسئلة قصيرة.";
    }

    function createEntry(){
      if (wheelContentType === "images") return { imageName:"" };
      if (wheelContentType === "mixed") return { text:"", imageName:"" };
      return { text:"" };
    }

    function renderWheelEntries(){
      if (!wheelItemsEditor) return;

      if (itemsHint) itemsHint.textContent = entryHint();

      wheelItemsEditor.innerHTML = "";

      wheelEntries.forEach((entry, index)=>{
        const box = document.createElement("div");
        box.className = "wheel-entry";

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-entry-btn";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "حذف العنصر");
        remove.addEventListener("click", ()=>{
          wheelEntries.splice(index, 1);
          renderWheelEntries();
        });

        box.appendChild(remove);

        if (wheelContentType === "text" || wheelContentType === "mixed") {
          const input = document.createElement("input");
          input.className = "wheel-entry-input";
          input.type = "text";
          input.maxLength = 40;
          input.placeholder = wheelContentType === "mixed" ? "اكتب النص المختصر" : "اكتب النص أو السؤال";
          input.value = entry.text || "";
          input.addEventListener("input", ()=>{
            wheelEntries[index].text = input.value;
          });
          box.appendChild(input);
        }

        if (wheelContentType === "images" || wheelContentType === "mixed") {
          const file = document.createElement("input");
          file.className = "wheel-entry-file";
          file.type = "file";
          file.accept = "image/*";
          file.addEventListener("change", ()=>{
            wheelEntries[index].imageName = file.files && file.files[0] ? file.files[0].name : "";
          });
          box.appendChild(file);
        }

        wheelItemsEditor.appendChild(box);
      });
    }

    document.querySelectorAll(".wheel-type").forEach((btn)=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".wheel-type").forEach((item)=> item.classList.remove("active"));
        btn.classList.add("active");

        wheelContentType = btn.getAttribute("data-wheel-type") || "text";
        wheelEntries = [];
        renderWheelEntries();
      });
    });

    addWheelItemBtn?.addEventListener("click", ()=>{
      wheelEntries.push(createEntry());
      renderWheelEntries();

      setTimeout(()=>{
        const inputs = wheelItemsEditor?.querySelectorAll("input");
        const last = inputs && inputs.length ? inputs[inputs.length - 1] : null;
        if (last && last.type !== "file") last.focus();
      }, 0);
    });

    const questionPanel = document.getElementById("questionPanel");
    const centerQuestionInput = document.getElementById("centerQuestionInput");

    document.querySelectorAll("[data-question-toggle]").forEach((btn)=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll("[data-question-toggle]").forEach((item)=> item.classList.remove("active"));
        btn.classList.add("active");

        const enabled = btn.getAttribute("data-question-toggle") === "on";
        questionPanel?.classList.toggle("enabled", enabled);

        if (enabled) centerQuestionInput?.focus();
      });
    });

    document.getElementById("testWheelBtn")?.addEventListener("click", ()=>{
      alert("سيتم فتح شاشة اختبار العجلة في الخطوة التالية.");
    });

    document.getElementById("saveWheelBtn")?.addEventListener("click", ()=>{
      alert("تم حفظ إعدادات العجلة.");
    });

    homeButton.addEventListener("click", ()=>{
      if (document.body.classList.contains("subpage")) {
        openScreen("");
        return;
      }
      window.location.href = WEBSITE_HOME_URL;
    });

    renderWheelEntries();
  </script>
</body>
</html>
