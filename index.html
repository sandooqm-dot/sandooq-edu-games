<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>صندوق الالعاب التعليمية</title>

  <style>
    :root{
      --bg:#ece8cf;
      --ink:#111111;
      --panel:#e9e9e9;
      --title-yellow:#efd553;
      --orange:#f47a45;
      --orange-dark:#e66a35;
      --blue-bar:#5e88db;
      --home-red:#f05d5b;
      --home-yellow:#efd553;
      --green:#59c46a;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --footer-h: 78px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family: Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--ink);
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }

    .page{
      position:relative;
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:auto;
      background:var(--bg);
      padding:
        max(14px, var(--safe-top))
        clamp(14px, 2vw, 28px)
        calc(var(--footer-h) + 18px + var(--safe-bottom));
    }

    .shell{
      width:min(100%, 1120px);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:clamp(14px, 1.7vw, 22px);
      position:relative;
      z-index:2;
    }

    .decor{
      position:absolute;
      pointer-events:none;
      z-index:0;
    }

    body.subpage .decor{
      display:none;
    }

    .decor.coil{ left:2.5%; top:28px; width:90px; }
    .decor.stars{ right:3.4%; top:22px; width:110px; }
    .decor.flower{ left:9%; top:230px; width:66px; }
    .decor.wave{ left:-1%; top:415px; width:170px; }
    .decor.splash{ right:3.6%; top:468px; width:110px; }

    .title-pill{
      width:min(900px, 88%);
      min-height:54px;
      background:var(--title-yellow);
      border:3px solid var(--ink);
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:11px 18px;
      font-size:clamp(24px, 2.65vw, 38px);
      font-weight:700;
      line-height:1.05;
      white-space:nowrap;
    }

    .play-shell{
      width:min(920px, 86%);
      margin-top:clamp(18px, 3.6vw, 46px);
      background:var(--orange);
      border:3px solid var(--ink);
      border-radius:28px;
      padding:10px;
    }

    .play-card{
      width:100%;
      min-height:170px;
      background:var(--panel);
      border:3px solid var(--ink);
      border-radius:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:clamp(10px, 1.15vw, 15px);
      padding:17px 20px;
    }

    .play-title{
      margin:0;
      font-size:clamp(28px, 3.1vw, 46px);
      font-weight:700;
      line-height:1.05;
      text-align:center;
    }

    .select-wrap{
      position:relative;
      width:min(620px, 78%);
      height:52px;
    }

    .select-wrap select{
      width:100%;
      height:100%;
      appearance:none;
      border:3px solid var(--ink);
      border-radius:22px;
      background:#fff;
      color:#5a5a5a;
      padding:0 70px 0 28px;
      text-align:center;
      text-align-last:center;
      font-size:clamp(17px, 1.85vw, 26px);
      font-weight:700;
      outline:none;
    }

    .select-wrap::after{
      content:"";
      position:absolute;
      left:22px;
      top:50%;
      transform:translateY(-35%);
      border-left:13px solid transparent;
      border-right:13px solid transparent;
      border-top:20px solid #666;
      pointer-events:none;
    }

    .start-btn{
      min-width:190px;
      height:46px;
      border:none;
      border-radius:20px;
      border:2px solid var(--ink);
      background:linear-gradient(180deg, #ff7f45 0%, var(--orange-dark) 100%);
      color:#fff;
      font-size:clamp(18px, 1.75vw, 26px);
      font-weight:700;
      line-height:1;
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      padding:0 28px;
      cursor:pointer;
    }

    .cards-grid{
      width:min(760px, 76%);
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:clamp(14px, 1.7vw, 22px) clamp(18px, 2vw, 26px);
      margin-top:clamp(8px, 1.1vw, 14px);
    }

    .secondary-grid{
      margin-top:auto;
      margin-bottom:clamp(16px, 2.4vw, 30px);
    }

    .menu-btn{
      min-height:64px;
      border:none;
      border-radius:24px;
      border:3px solid var(--ink);
      background:#f6f6f6;
      color:#111;
      font-size:clamp(20px, 2vw, 32px);
      font-weight:700;
      line-height:1.1;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:10px 16px;
      cursor:pointer;
    }

    .bottom-bar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:calc(var(--footer-h) + var(--safe-bottom));
      padding-bottom:var(--safe-bottom);
      background:var(--blue-bar);
      border-top:3px solid var(--ink);
      z-index:20;
    }

    .home-btn{
      position:absolute;
      left:10px;
      top:50%;
      transform:translateY(-50%);
      min-width:142px;
      height:46px;
      border:none;
      border-radius:20px;
      border:2px solid var(--ink);
      background:var(--home-red);
      color:#fff;
      font-size:clamp(18px, 1.6vw, 26px);
      font-weight:700;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      cursor:pointer;
    }

    body.subpage .home-btn{
      background:var(--home-yellow);
      color:#111;
    }

    .screen{
      display:none;
      width:min(1180px, 92%);
      margin:0 auto;
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:26px 24px;
      position:relative;
      z-index:5;
    }

    .screen.active{
      display:block;
    }

    .screen-title{
      margin:0 0 18px;
      text-align:center;
      font-size:clamp(30px, 3vw, 48px);
      font-weight:700;
      line-height:1.2;
    }

    .screen-note{
      margin:0;
      color:#444;
      text-align:center;
      font-size:clamp(18px, 1.8vw, 24px);
      line-height:1.9;
      font-weight:650;
    }

    .template-list{
      display:grid;
      grid-template-columns:1fr;
      gap:clamp(18px, 2.4vw, 28px);
      margin-top:clamp(18px, 2.3vw, 28px);
    }

    .template-card{
      width:100%;
      min-height:clamp(170px, 18vw, 230px);
      border:6px solid var(--ink);
      border-radius:30px;
      background:#fff;
      display:grid;
      grid-template-columns:clamp(120px, 20vw, 220px) minmax(0, 1fr);
      gap:clamp(18px, 3vw, 34px);
      align-items:center;
      padding:clamp(16px, 2.3vw, 26px);
      direction:ltr;
      text-align:right;
    }

    .template-cover{
      width:100%;
      aspect-ratio:4/3;
      border-radius:18px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.92) 0 20%, transparent 21%),
        conic-gradient(from 20deg, #ff5b8b 0 16%, #f7c948 16% 32%, #42b883 32% 48%, #4f89e6 48% 64%, #f47a45 64% 80%, #9b5de5 80% 100%);
      border:2px solid rgba(17,17,17,.12);
      overflow:hidden;
    }

    .template-cover.empty{
      background:
        linear-gradient(135deg, rgba(244,211,60,.42), rgba(255,255,255,.88)),
        radial-gradient(circle at 30% 30%, rgba(244,122,69,.22) 0 12%, transparent 13%),
        radial-gradient(circle at 70% 70%, rgba(94,136,219,.18) 0 15%, transparent 16%);
    }

    .template-content{
      direction:rtl;
      min-width:0;
    }

    .template-title{
      margin:0 0 clamp(10px, 1.5vw, 18px);
      font-size:clamp(32px, 4.2vw, 58px);
      line-height:1.05;
      font-weight:800;
      color:#111;
    }

    .template-desc{
      margin:0;
      color:#5b5b5b;
      font-size:clamp(18px, 2.25vw, 30px);
      line-height:1.7;
      font-weight:700;
    }

    /* Tablet */
    @media (max-width: 1100px){
      .decor.flower{ top:255px; left:7%; width:56px; }
      .decor.wave{ top:455px; width:150px; }
      .decor.splash{ top:530px; width:100px; }
      .cards-grid{ gap:14px 18px; }
      .menu-btn{ min-height:58px; }
    }

    /* Mobile / portrait */
    @media (max-width: 760px){
      :root{ --footer-h: 72px; }

      .page{
        padding: max(10px, var(--safe-top)) 12px calc(var(--footer-h) + 14px + var(--safe-bottom));
      }

      .shell{
        min-height:calc(100dvh - var(--footer-h) - 24px - var(--safe-bottom));
        gap:10px;
      }

      .decor.coil{ left:10px; top:18px; width:50px; }
      .decor.stars{ right:10px; top:16px; width:64px; }
      .decor.flower{ left:12px; top:210px; width:40px; }
      .decor.wave{ left:-34px; top:auto; bottom:132px; width:98px; }
      .decor.splash{ right:8px; top:auto; bottom:86px; width:68px; }

      .title-pill{
        width:90%;
        min-height:44px;
        border-radius:18px;
        padding:8px 14px;
        font-size:clamp(18px, 4.8vw, 24px);
      }

      .play-shell,
      .screen{
        width:92%;
      }

      .play-shell{
        border-radius:24px;
        padding:8px;
      }

      .play-card{
        min-height:auto;
        padding:14px 12px 13px;
        gap:10px;
        border-radius:20px;
      }

      .play-title{
        font-size:clamp(20px, 5.4vw, 27px);
      }

      .select-wrap{
        width:100%;
        height:50px;
      }

      .select-wrap select{
        font-size:clamp(15px, 3.8vw, 19px);
        padding:0 50px 0 18px;
        border-radius:19px;
      }

      .select-wrap::after{
        left:17px;
        border-left-width:12px;
        border-right-width:12px;
        border-top-width:18px;
      }

      .start-btn{
        min-width:150px;
        height:42px;
        font-size:clamp(17px, 4.7vw, 22px);
        border-radius:18px;
      }

      .cards-grid{
        grid-template-columns:1fr;
        gap:10px;
        margin-top:0;
        width:88%;
      }

      .secondary-grid{
        margin-top:auto;
        margin-bottom:10px;
      }

      .menu-btn{
        min-height:50px;
        border-radius:19px;
        font-size:clamp(16px, 4.7vw, 21px);
        padding:10px 14px;
      }

      .home-btn{
        min-width:116px;
        height:46px;
        font-size:20px;
        left:8px;
      }

      .screen{
        border-radius:22px;
        padding:20px 16px;
      }

      .screen-title{
        font-size:clamp(24px, 6vw, 32px);
      }

      .screen-note{
        font-size:clamp(16px, 4.2vw, 20px);
      }

      .template-list{
        gap:14px;
        margin-top:16px;
      }

      .template-card{
        min-height:138px;
        border-width:4px;
        border-radius:22px;
        grid-template-columns:96px minmax(0, 1fr);
        gap:12px;
        padding:12px;
      }

      .template-cover{
        border-radius:14px;
      }

      .template-title{
        font-size:clamp(24px, 6vw, 32px);
        margin-bottom:8px;
      }

      .template-desc{
        font-size:clamp(14px, 3.8vw, 18px);
        line-height:1.55;
      }
    }

    /*
      عند تكبير الصفحة في الجوال/ظهور واجهة المتصفح بشكل يأخذ مساحة أكبر،
      يصغر التصميم حتى لا تصير المربعات والنصوص ضخمة أو تحتاج تمرير كثير.
    */
    @media (max-width: 760px) and (max-height: 760px){
      :root{ --footer-h: 66px; }

      .page{
        padding-top:max(8px, var(--safe-top));
      }

      .shell{
        gap:9px;
      }

      .title-pill{
        min-height:42px;
        font-size:clamp(18px, 4.8vw, 24px);
        border-radius:16px;
      }

      .play-shell{
        padding:7px;
      }

      .play-card{
        padding:11px 10px;
        gap:8px;
      }

      .play-title{
        font-size:clamp(20px, 5.5vw, 27px);
      }

      .select-wrap{
        height:45px;
      }

      .select-wrap select{
        font-size:clamp(15px, 4vw, 19px);
      }

      .start-btn{
        height:42px;
        min-width:150px;
        font-size:clamp(17px, 4.8vw, 22px);
      }

      .menu-btn{
        min-height:46px;
        font-size:clamp(15px, 4.3vw, 20px);
      }

      .cards-grid{
        gap:8px;
      }

      .secondary-grid{
        margin-bottom:8px;
      }

      .home-btn{
        height:42px;
        min-width:108px;
        font-size:18px;
      }
      .template-card{
        min-height:118px;
        grid-template-columns:82px minmax(0, 1fr);
        gap:10px;
        padding:10px;
      }

      .template-title{
        font-size:clamp(21px, 5.2vw, 28px);
      }

      .template-desc{
        font-size:clamp(13px, 3.4vw, 16px);
      }

    }
    @media (min-width: 761px){
      .shell{
        min-height:calc(100dvh - var(--footer-h) - 34px - var(--safe-bottom));
      }

      .primary-grid{
        margin-top:clamp(10px, 1.5vw, 20px);
      }
    }

    /* v20: ضبط التكبير في الجوال ومنع تضخم النصوص داخل المربعات */
    @media (max-width: 760px){
      .page{
        padding-left:14px;
        padding-right:14px;
      }

      .shell{
        width:100%;
        max-width:520px;
        gap:10px;
      }

      .title-pill{
        width:88%;
        min-height:40px;
        padding:7px 12px;
        border-width:3px;
        border-radius:16px;
        font-size:clamp(17px, 4.2vw, 22px);
        line-height:1.05;
      }

      .play-shell{
        width:90%;
        padding:7px;
        border-radius:22px;
        margin-top:10px;
      }

      .play-card{
        padding:10px 10px 11px;
        gap:8px;
        border-radius:19px;
      }

      .play-title{
        font-size:clamp(18px, 4.8vw, 24px);
        line-height:1.05;
      }

      .select-wrap{
        width:92%;
        height:42px;
      }

      .select-wrap select{
        font-size:clamp(13px, 3.35vw, 16px);
        padding-right:38px;
        padding-left:34px;
        border-width:3px;
        border-radius:17px;
        line-height:1;
      }

      .select-wrap::after{
        left:13px;
        border-left-width:9px;
        border-right-width:9px;
        border-top-width:14px;
      }

      .start-btn{
        min-width:136px;
        height:38px;
        font-size:clamp(15px, 4vw, 19px);
        border-radius:16px;
        padding:0 18px;
      }

      .cards-grid{
        width:84%;
        gap:9px;
      }

      .menu-btn{
        min-height:46px;
        border-radius:17px;
        border-width:3px;
        font-size:clamp(15px, 4vw, 19px);
        line-height:1.1;
        padding:8px 12px;
      }

      .bottom-bar{
        height:calc(66px + var(--safe-bottom));
      }

      .home-btn{
        min-width:104px;
        height:40px;
        border-radius:16px;
        font-size:17px;
        padding:0 16px;
      }

      .screen{
        width:92%;
        padding:16px 12px;
        border-width:3px;
        border-radius:22px;
      }

      .screen-title{
        font-size:clamp(22px, 5.4vw, 28px);
        margin-bottom:14px;
      }

      .screen-note{
        font-size:clamp(14px, 3.7vw, 17px);
      }

      .template-list{
        gap:12px;
        margin-top:14px;
      }

      .template-card{
        min-height:auto;
        grid-template-columns:74px minmax(0, 1fr);
        gap:10px;
        padding:10px;
        border-width:4px;
        border-radius:20px;
        align-items:center;
      }

      .template-cover{
        border-radius:12px;
      }

      .template-title{
        font-size:clamp(20px, 5vw, 25px);
        line-height:1.05;
        margin-bottom:6px;
      }

      .template-desc{
        font-size:clamp(12px, 3.2vw, 15px);
        line-height:1.45;
      }
    }

    @media (max-width: 760px) and (max-height: 760px){
      :root{ --footer-h: 62px; }

      .page{
        padding-top:max(7px, var(--safe-top));
        padding-bottom:calc(62px + 10px + var(--safe-bottom));
      }

      .shell{
        gap:8px;
      }

      .title-pill{
        min-height:36px;
        font-size:clamp(16px, 3.9vw, 20px);
      }

      .play-shell{
        margin-top:8px;
        padding:6px;
      }

      .play-card{
        padding:9px;
        gap:7px;
      }

      .play-title{
        font-size:clamp(17px, 4.3vw, 22px);
      }

      .select-wrap{
        height:38px;
      }

      .select-wrap select{
        font-size:clamp(12px, 3.1vw, 15px);
      }

      .select-wrap::after{
        border-left-width:8px;
        border-right-width:8px;
        border-top-width:12px;
      }

      .start-btn{
        height:35px;
        min-width:126px;
        font-size:clamp(14px, 3.7vw, 18px);
      }

      .menu-btn{
        min-height:42px;
        font-size:clamp(14px, 3.7vw, 18px);
      }

      .cards-grid{
        gap:7px;
      }

      .template-card{
        grid-template-columns:64px minmax(0, 1fr);
        gap:8px;
        padding:8px;
      }

      .template-title{
        font-size:clamp(18px, 4.5vw, 23px);
      }

      .template-desc{
        font-size:clamp(11px, 2.9vw, 14px);
        line-height:1.35;
      }
    }

    @media (max-width: 430px){
      .select-wrap select{
        letter-spacing:-0.2px;
      }

      .play-title,
      .title-pill,
      .menu-btn{
        letter-spacing:-0.25px;
      }
    }

    /* صفحة إعداد العجلة */
    .wheel-setup{
      display:none;
      width:min(1180px, 92%);
      margin:0 auto;
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:clamp(18px, 2.4vw, 28px);
      position:relative;
      z-index:5;
    }

    .wheel-setup.active{
      display:block;
    }

    .wheel-layout{
      display:grid;
      grid-template-columns:minmax(280px, 420px) minmax(0, 1fr);
      gap:clamp(18px, 3vw, 34px);
      align-items:center;
      margin-top:clamp(16px, 2vw, 24px);
    }

    .wheel-preview-box{
      background:#fff;
      border:3px solid var(--ink);
      border-radius:26px;
      padding:clamp(18px, 2.2vw, 26px);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:clamp(330px, 34vw, 430px);
      position:relative;
      overflow:hidden;
    }

    .wheel-arrow{
      position:absolute;
      left:clamp(10px, 1.5vw, 20px);
      top:50%;
      transform:translateY(-50%);
      width:0;
      height:0;
      border-top:24px solid transparent;
      border-bottom:24px solid transparent;
      border-left:42px solid #d0d0d0;
      filter:drop-shadow(0 1px 0 rgba(0,0,0,.35));
      z-index:3;
    }

    .wheel-preview{
      width:min(84vw, 330px);
      max-width:100%;
      aspect-ratio:1/1;
      border-radius:50%;
      position:relative;
      border:5px solid #efefef;
      box-shadow:0 8px 22px rgba(0,0,0,.12);
      background:
        conic-gradient(
          #ec174f 0deg 40deg,
          #ffffff 40deg 80deg,
          #2e75d4 80deg 120deg,
          #ffffff 120deg 160deg,
          #f39c12 160deg 200deg,
          #ffffff 200deg 240deg,
          #1abc9c 240deg 280deg,
          #ffffff 280deg 320deg,
          #ec174f 320deg 360deg
        );
      overflow:hidden;
      transition:transform 2.8s cubic-bezier(.12,.72,.13,1);
    }

    .wheel-preview::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.95) calc(50% - 1px), rgba(255,255,255,.95) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(255,255,255,.95) calc(50% - 1px), rgba(255,255,255,.95) calc(50% + 1px), transparent calc(50% + 1px)),

    const WEBSITE_HOME_URL = "https://sandooq-games.com/";
    const screens = ["createScreen","wheelSetupScreen","savedScreen","backupScreen","settingsScreen","wheelGameScreen"];
    const homeShell = document.getElementById("homeShell");
    const homeButton = document.getElementById("homeButton");

    let wheelContentType = "text";
    let wheelEntries = [];
    let wheelRotation = 0;
    let currentSelectedIndex = -1;
    let labelUprightNodes = [];
    let spinAnimationId = null;
    let dragState = null;
    let safariCollapseTimers = [];

    const SVG_NS = "http://www.w3.org/2000/svg";
    const XLINK_NS = "http://www.w3.org/1999/xlink";

    const defaultWheelEntries = [
      { text:"اتغدى" },
      { text:"انام" },
      { text:"اشتغل" },
      { text:"اروح" },
      { text:"اكعد" },
      { text:"احجي" },
      { text:"اقرأ" },
      { text:"العب" }
    ];

    const wheelColors = [
      "#e91e63", "#0097a7", "#f4511e", "#8e24aa",
      "#1e88e5", "#43a047", "#ef6c00", "#c2185b",
      "#7b1fa2", "#00897b", "#3949ab", "#d81b60",
      "#7cb342", "#039be5", "#fb8c00", "#ec407a"
    ];


    function isIosWebKit(){
      const ua = navigator.userAgent || "";
      const isiOS = /iP(ad|hone|od)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      return isiOS && /WebKit/i.test(ua);
    }

    function collapseSafariBars(){
      safariCollapseTimers.forEach((timer)=> clearTimeout(timer));
      safariCollapseTimers = [];

      if (!document.body.classList.contains("playing-wheel") || !isIosWebKit()) return;

      [0, 80, 220, 520, 900].forEach((delay)=>{
        safariCollapseTimers.push(setTimeout(()=>{
          if (!document.body.classList.contains("playing-wheel")) return;
          try {
            window.scrollTo({ top:76, left:0, behavior:"auto" });
          } catch (_) {
            window.scrollTo(0, 76);
          }
          requestAnimationFrame(updateWheelGameLayout);
        }, delay));
      });
    }

    function clearSafariCollapse(){
      safariCollapseTimers.forEach((timer)=> clearTimeout(timer));
      safariCollapseTimers = [];
      try {
        window.scrollTo({ top:0, left:0, behavior:"auto" });
      } catch (_) {
        window.scrollTo(0, 0);
      }
    }

    function updateViewportVars(){
      const root = document.documentElement;
      /* v35: نثبت قياسات العرض على window مثل صفحات العرض المستقرة، بدل ضغط Safari للعبة عبر visualViewport. */
      const width = window.innerWidth || document.documentElement.clientWidth || 0;
      const height = window.innerHeight || document.documentElement.clientHeight || 0;

      root.style.setProperty("--app-width", `${width}px`);
      root.style.setProperty("--app-height", `${height}px`);
      root.style.setProperty("--app-top", `0px`);
      root.style.setProperty("--app-left", `0px`);

      requestAnimationFrame(updateWheelGameLayout);
    }

    function updateWheelGameLayout(){
      if (!document.body.classList.contains("playing-wheel")) return;

      const screen = document.getElementById("wheelGameScreen");
      const stage = document.querySelector(".wheel-stage");
      const wheel = document.getElementById("realWheel");
      if (!screen || !stage || !wheel) return;

      const stageRect = stage.getBoundingClientRect();
      const wheelRect = wheel.getBoundingClientRect();
      if (!wheelRect.width || !stageRect.width) return;

      const arrowW = Math.max(36, Math.min(62, wheelRect.width * 0.092));
      const arrowH = Math.max(22, Math.min(38, wheelRect.width * 0.056));
      const arrowLeft = wheelRect.left - stageRect.left - arrowW - Math.max(4, wheelRect.width * 0.010);

      screen.style.setProperty("--game-arrow-left", `${Math.max(2, arrowLeft)}px`);
      screen.style.setProperty("--game-arrow-w", `${arrowW}px`);
      screen.style.setProperty("--game-arrow-h", `${arrowH}px`);
    }

    updateViewportVars();
    window.addEventListener("resize", updateViewportVars, { passive:true });
    window.addEventListener("orientationchange", ()=> setTimeout(updateViewportVars, 120), { passive:true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateViewportVars, { passive:true });
      window.visualViewport.addEventListener("scroll", updateViewportVars, { passive:true });
    }

    document.addEventListener("touchend", ()=>{
      if (document.body.classList.contains("playing-wheel")) collapseSafariBars();
    }, { passive:true });

    function openScreen(id){
      const isWheelGame = id === "wheelGameScreen";
      const isSubpage = Boolean(id) && !isWheelGame;

      if (isWheelGame) updateViewportVars();

      document.body.classList.toggle("subpage", isSubpage);
      document.body.classList.toggle("playing-wheel", isWheelGame);

      screens.forEach((sid)=>{
        const el = document.getElementById(sid);
        if (el) el.classList.toggle("active", sid === id);
      });

      if (homeShell) homeShell.style.display = Boolean(id) ? "none" : "flex";

      if (isWheelGame) {
        updateViewportVars();
        collapseSafariBars();
        requestAnimationFrame(()=>{
          updateViewportVars();
          updateWheelGameLayout();
          fitCenterText();
        });
        setTimeout(()=>{
          updateViewportVars();
          updateWheelGameLayout();
          fitCenterText();
        }, 90);
      } else {
        clearSafariCollapse();
        window.scrollTo({ top:0, behavior:"auto" });
      }
    }

    document.querySelectorAll("[data-open-screen]").forEach((btn)=>{

    const wheelItemsEditor = document.getElementById("wheelItemsEditor");

    function entryHint(){
      if (wheelContentType === "images") return "أضف الصور التي تظهر داخل أقسام العجلة.";
      if (wheelContentType === "mixed") return "أضف صورة ومعها نص مختصر لكل عنصر.";
      return "أضف كلمات أو أسئلة قصيرة.";
    }

    function createEntry(){
      if (wheelContentType === "images") return { imageName:"", imageData:"" };
      if (wheelContentType === "mixed") return { text:"", imageName:"", imageData:"" };
      return { text:"" };

    function readFileAsDataURL(file, callback){
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => callback(String(reader.result || ""));
      reader.readAsDataURL(file);
    }

    function renderWheelEntries(){
      if (!wheelItemsEditor) return;

      if (itemsHint) itemsHint.textContent = entryHint();

      wheelItemsEditor.innerHTML = "";

      wheelEntries.forEach((entry, index)=>{
        const box = document.createElement("div");

        box.appendChild(remove);

        if (wheelContentType === "text" || wheelContentType === "mixed") {

          input.className = "wheel-entry-input";

        if (wheelContentType === "images" || wheelContentType === "mixed") {

          file.addEventListener("change", ()=>{

    document.querySelectorAll(".wheel-type").forEach((btn)=>{

    addWheelItemBtn?.addEventListener("click", ()=>{
      wheelEntries.push(createEntry());

      setTimeout(()=>{

    const questionPanel = document.getElementById("questionPanel");
    const centerQuestionInput = document.getElementById("centerQuestionInput");

    document.querySelectorAll("[data-question-toggle]").forEach((btn)=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll("[data-question-toggle]").forEach((item)=> item.classList.remove("active"));

    function getWheelItems(){
      const filled = wheelEntries.filter((entry)=>{
        if (wheelContentType === "images") return entry.imageData || entry.imageName;
        if (wheelContentType === "mixed") return entry.text || entry.imageData || entry.imageName;
        return entry.text;
      });

      return filled.length ? filled : defaultWheelEntries;
    }

    function textForEntry(entry, fallbackIndex){
      const text = (entry.text || "").trim();
      if (text) return text;
      if (entry.imageName) return entry.imageName.replace(/\.[^.]+$/, "");
      return `عنصر ${fallbackIndex + 1}`;
    }

    function normalizeAngle(angle){
      return ((angle % 360) + 360) % 360;
    }

    function polarToCartesian(radius, angleDeg){
      const angle = angleDeg * Math.PI / 180;
      return {
        x: radius * Math.cos(angle),
        y: radius * Math.sin(angle)
      };
    }

    function sectorPath(startAngle, endAngle, radius){
      const sweep = Math.abs(endAngle - startAngle);

      if (sweep >= 359.999) {
        return [
          `M ${radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${-radius} 0`,
          `A ${radius} ${radius} 0 1 1 ${radius} 0`,
          `Z`
        ].join(" ");
      }

      const start = polarToCartesian(radius, startAngle);
      const end = polarToCartesian(radius, endAngle);
      const largeArc = endAngle - startAngle > 180 ? 1 : 0;

      return [
        `M 0 0`,
        `L ${start.x.toFixed(3)} ${start.y.toFixed(3)}`,
        `A ${radius} ${radius} 0 ${largeArc} 1 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`,
        `Z`
      ].join(" ");
    }

    function createSvgElement(tag, attrs = {}){
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value])=>{
        if (key === "href") {
          el.setAttributeNS(XLINK_NS, "href", value);
        } else {
          el.setAttribute(key, value);
        }
      });
      return el;
    }

    function colorBrightness(hex){
      const value = String(hex || "").replace("#", "");
      const r = parseInt(value.substring(0, 2), 16) || 0;
      const g = parseInt(value.substring(2, 4), 16) || 0;
      const b = parseInt(value.substring(4, 6), 16) || 0;
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function labelFontSize(count, text){
      const length = String(text || "").trim().length;
      if (count <= 5) {
        if (length > 42) return 11;
        if (length > 30) return 13;
        if (length > 20) return 16;
        if (length > 12) return 20;
        return 24;
      }
      if (count <= 8) {
        if (length > 36) return 9;
        if (length > 26) return 11;
        if (length > 16) return 13;
        if (length > 10) return 16;
        return 19;
      }
      if (count <= 12) {
        if (length > 30) return 7;
        if (length > 22) return 8;
        if (length > 14) return 10;
        if (length > 9) return 12;
        return 15;
      }
      if (length > 28) return 5.8;
      if (length > 20) return 6.8;
      if (length > 12) return 8;
      return 10;
    }

    function mixedTextFontSize(count, text){
      const length = String(text || "").trim().length;
      if (count <= 5) {
        if (length > 34) return 9.5;
        if (length > 24) return 11.5;
        if (length > 16) return 13.5;
        return 17;
      }
      if (count <= 8) {
        if (length > 28) return 7.2;
        if (length > 20) return 8.8;
        if (length > 13) return 10.5;
        return 13;
      }
      if (count <= 12) {
        if (length > 24) return 5.8;
        if (length > 16) return 6.8;
        if (length > 10) return 8.3;
        return 10;
      }
      if (length > 18) return 4.9;
      if (length > 12) return 5.7;
      return 7.2;
    }

    function splitTextLines(text, maxChars, maxLines = 4){
      const clean = String(text || "").trim();
      if (!clean) return [""];
      if (clean.length <= maxChars) return [clean];

      const words = clean.split(/\s+/);
      const lines = [];
      let current = "";

      words.forEach((word)=>{
        if (word.length > maxChars) {
          if (current) {
            lines.push(current);
            current = "";
          }

          for (let i = 0; i < word.length; i += maxChars) {
            lines.push(word.slice(i, i + maxChars));
          }
          return;
        }

        const test = current ? `${current} ${word}` : word;
        if (test.length > maxChars && current) {
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });

      if (current) lines.push(current);
      return lines.slice(0, maxLines);
    }

    function createUprightHolder(parent, angle, radius){
      const normalized = normalizeAngle(angle);
      const flip = normalized > 90 && normalized < 270;
      const holder = createSvgElement("g", {
        transform: `rotate(${angle.toFixed(3)}) translate(${radius.toFixed(3)} 0) rotate(${flip ? 180 : 0})`
      });

      const upright = createSvgElement("g", {
        class: "svg-wheel-upright"
      });

      holder.appendChild(upright);
      parent.appendChild(holder);
      return upright;
    }

    function drawTextLabel(parent, text, angle, radius, count, isDark){
      const upright = createUprightHolder(parent, angle, radius);
      const size = labelFontSize(count, text);

      const label = createSvgElement("text", {
        x: "0",
        y: "0",
        class: `svg-wheel-label ${isDark ? "dark" : "light"}`,
        "font-size": String(size)
      });

      const maxChars = count <= 5 ? 10 : count <= 8 ? 8 : count <= 12 ? 6 : 5;
      const lines = splitTextLines(text, maxChars, count <= 8 ? 5 : 4);
      const lineHeight = size * 1.02;
      const startY = -((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, idx)=>{
        const tspan = createSvgElement("tspan", {
          x: "0",
          y: String(startY + idx * lineHeight)
        });
        tspan.textContent = line;
        label.appendChild(tspan);
      });

      upright.appendChild(label);
    }

    function drawImageLabel(parent, entry, angle, radius, count, withText, isDark){
      const upright = createUprightHolder(parent, angle, radius);
      const hasText = Boolean(withText && String(entry.text || "").trim());
      const text = String(entry.text || "").trim();

      const imgSize = count <= 5 ? 66 : count <= 8 ? 50 : count <= 12 ? 38 : 28;
      const textSize = mixedTextFontSize(count, text);
      const gap = count <= 5 ? 18 : count <= 8 ? 12 : 8;

      // v38: توزيع Wordwall: الصورة باتجاه الحافة الخارجية، والنص باتجاه المنتصف داخل نفس القطاع.
      const imageCenterX = hasText ? (imgSize * 0.55 + gap) : 0;
      const textCenterX = hasText ? -(imgSize * 0.50 + gap * 0.55) : 0;

      if (entry.imageData) {
        const img = createSvgElement("image", {
          x: (imageCenterX - imgSize / 2).toFixed(3),
          y: (-imgSize / 2).toFixed(3),
          width: String(imgSize),
          height: String(imgSize),
          href: entry.imageData,
          class: "svg-wheel-image",
          preserveAspectRatio: "xMidYMid meet"
        });
        upright.appendChild(img);
      }

      if (hasText) {
        const label = createSvgElement("text", {
          x: textCenterX.toFixed(3),
          y: "0",
          class: `svg-wheel-label ${isDark ? "dark" : "light"}`,
          "font-size": String(textSize),
          "text-anchor": "middle"
        });

        const lines = splitTextLines(text, count <= 5 ? 8 : count <= 8 ? 6 : 5, count <= 8 ? 4 : 3);
        const lineHeight = textSize * 1.03;
        const startY = -((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, idx)=>{
          const tspan = createSvgElement("tspan", {
            x: textCenterX.toFixed(3),
            y: String(startY + idx * lineHeight)
          });
          tspan.textContent = line;
          label.appendChild(tspan);
        });

        upright.appendChild(label);
      }
    }

    function updateUprightLabels(){
      const rotation = normalizeAngle(wheelRotation || 0);

      labelUprightNodes.forEach((item)=>{
        const finalAngle = normalizeAngle((item.baseAngle || 0) + rotation);
        const flipped = finalAngle > 90 && finalAngle < 270;

        item.inner.style.transform = `rotate(${flipped ? 180 : 0}deg)`;
        item.inner.classList.toggle("flipped", flipped);
      });
    }

    function setRotorRotation(degrees){
      const rotor = document.getElementById("svgWheelRotor");
      if (!rotor) return;

      const htmlLayer = document.getElementById("wheelHtmlLabels");

      wheelRotation = degrees;
      rotor.style.transition = "none";
      rotor.style.transform = `rotate(${degrees}deg)`;

      if (htmlLayer) {
        htmlLayer.style.transform = `rotate(${degrees}deg)`;
      }

      updateUprightLabels();
    }

    function resetWordwallFocus(){
      const wheel = document.getElementById("realWheel");
      const afterSpin = document.getElementById("wheelAfterSpin");
      if (wheel) wheel.classList.remove("wordwall-zoom");
      if (afterSpin) afterSpin.classList.remove("show");
    }

    function applyWordwallFocus(){
      const wheel = document.getElementById("realWheel");
      if (!wheel) return;

      requestAnimationFrame(()=>{
        wheel.classList.add("wordwall-zoom");
        collapseSafariBars();
      });
    }

    function fitCenterText(){
      const center = document.getElementById("realWheelCenter");
      if (!center) return;

      center.style.fontSize = "";
      let size = parseFloat(getComputedStyle(center).fontSize || "18");

      for (let i = 0; i < 14; i++) {
        if (center.scrollWidth <= center.clientWidth + 2 && center.scrollHeight <= center.clientHeight + 2) break;
        size -= 1;
        if (size < 8) break;
        center.style.fontSize = `${size}px`;
      }
    }

    function wheelDecorPath(radius = 229, waves = 32, amplitude = 1.15, points = 260){
      let d = "";
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * 360;
        const r = radius + Math.sin((angle * Math.PI / 180) * waves) * amplitude;
        const p = polarToCartesian(r, angle);
        d += `${i === 0 ? "M" : "L"} ${p.x.toFixed(3)} ${p.y.toFixed(3)} `;
      }
      return d + "Z";
    }

    function starPath(cx, cy, outerRadius = 3.1, innerRadius = 1.35){
      const points = [];
      for (let i = 0; i < 10; i++) {
        const angle = (-90 + i * 36) * Math.PI / 180;
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        points.push({
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius
        });
      }

      return points.map((point, index)=> {
        const command = index === 0 ? "M" : "L";
        return `${command} ${point.x.toFixed(3)} ${point.y.toFixed(3)}`;
      }).join(" ") + " Z";
    }

    function drawWheelDecoration(parent){
      // v38: بدون خطوط أو نجوم حول العجلة، مثل مرجع Wordwall.
    }

    function htmlWheelMetrics(count, hasImage, hasText){
      const centerEnabled = questionPanel?.classList.contains("enabled");
      const inner = centerEnabled
        ? (count <= 5 ? 78 : count <= 8 ? 84 : count <= 12 ? 92 : 98)
        : (count <= 5 ? 62 : count <= 8 ? 70 : count <= 12 ? 80 : 88);

      const outer = count <= 5 ? 212 : count <= 8 ? 210 : count <= 12 ? 208 : 206;
      const width = Math.max(72, outer - inner);

      const imageSize = hasImage
        ? (count <= 5 ? 66 : count <= 8 ? 54 : count <= 12 ? 42 : 32)
        : 0;

      const fontSize = hasImage && hasText
        ? mixedTextFontSize(count, "نص")
        : (count <= 5 ? 23 : count <= 8 ? 19 : count <= 12 ? 14 : 10.5);

      const height = Math.max(imageSize || 0, fontSize * 2.55, count <= 8 ? 42 : 34);
      const textMax = hasImage ? Math.max(34, width - imageSize - 10) : Math.max(54, width - 8);
      const gap = count <= 5 ? 10 : count <= 8 ? 8 : 6;
      const lines = count <= 8 ? 3 : 2;

      return { inner, width, imageSize, fontSize, height, textMax, gap, lines };
    }

    function buildHtmlWheelLabels(items, count, step){
      const htmlLayer = document.getElementById("wheelHtmlLabels");
      if (!htmlLayer) return;

      htmlLayer.innerHTML = "";
      htmlLayer.style.transform = `rotate(${wheelRotation}deg)`;
      labelUprightNodes = [];

      items.forEach((entry, index)=>{
        const mid = -90 + (index * step) + (step / 2);
        const color = wheelColors[index % wheelColors.length];
        const isDark = colorBrightness(color) > 168;
        const hasImage = Boolean((wheelContentType === "images" || wheelContentType === "mixed") && entry.imageData);
        const hasText = Boolean((wheelContentType !== "images") && textForEntry(entry, index));
        const metrics = htmlWheelMetrics(count, hasImage, hasText);

        const label = document.createElement("div");
        label.className = `wheel-html-label ${isDark ? "dark" : "light"}`;
        label.style.setProperty("--html-label-width", `${metrics.width}px`);
        label.style.setProperty("--html-label-height", `${metrics.height}px`);
        label.style.setProperty("--html-label-gap", `${metrics.gap}px`);
        label.style.setProperty("--html-font-size", `${metrics.fontSize}px`);
        label.style.setProperty("--html-image-size", `${metrics.imageSize}px`);
        label.style.setProperty("--html-text-max", `${metrics.textMax}px`);
        label.style.setProperty("--html-line-clamp", String(metrics.lines));
        label.style.transform = `rotate(${mid}deg) translateX(${metrics.inner}px) translateY(-50%)`;

        const inner = document.createElement("div");
        inner.className = hasImage && hasText ? "wheel-html-inner mixed" : hasImage ? "wheel-html-inner image-only" : "wheel-html-inner text-only";
        inner.setAttribute("dir", "rtl");

        if (hasText) {
          const textEl = document.createElement("div");
          textEl.className = "wheel-html-text";
          textEl.setAttribute("dir", "rtl");
          textEl.textContent = textForEntry(entry, index);
          inner.appendChild(textEl);
        }

        if (hasImage) {
          const img = document.createElement("img");
          img.className = "wheel-html-image";
          img.alt = "";
          img.draggable = false;
          img.src = entry.imageData;
          inner.appendChild(img);
        }

        label.appendChild(inner);
        htmlLayer.appendChild(label);
        labelUprightNodes.push({ inner, baseAngle: mid });
      });

      updateUprightLabels();
    }

    function buildWheel(){
      const items = getWheelItems();
      const count = Math.max(items.length, 1);
      const sectors = document.getElementById("svgWheelSectors");
      const labels = document.getElementById("svgWheelLabels");
      const center = document.getElementById("realWheelCenter");
      const result = document.getElementById("selectedResult");
      const afterSpin = document.getElementById("wheelAfterSpin");

      if (!sectors || !labels || !center) return;

      sectors.innerHTML = "";
      labels.innerHTML = "";
      labelUprightNodes = [];

      const radius = 224;
      const labelRadius = count <= 5 ? 142 : count <= 8 ? 150 : count <= 12 ? 158 : 164;
      const step = 360 / count;

      items.forEach((entry, index)=>{
        const start = -90 + (index * step);
        const end = start + step;
        const mid = start + (step / 2);
        const color = wheelColors[index % wheelColors.length];
        const isDark = colorBrightness(color) > 168;

        const sector = createSvgElement("path", {
          d: sectorPath(start, end, radius),
          fill: color,
          class: "svg-sector"
        });
        sectors.appendChild(sector);

        // v40: محتوى العجلة النصي/الصور يُعرض عبر طبقة HTML مستقلة لضمان سلامة العربية في Safari.
      });

      const rim = createSvgElement("circle", {
        cx: "0",
        cy: "0",
        r: String(radius),
        fill: "none",
        stroke: "rgba(0,0,0,.16)",
        "stroke-width": "1.3"
      });
      sectors.appendChild(rim);

      buildHtmlWheelLabels(items, count, step);

      const centerQuestionEnabled = questionPanel?.classList.contains("enabled");
      const centerText = (centerQuestionInput?.value || "").trim();
      center.textContent = centerQuestionEnabled ? (centerText || "السؤال") : "";
      center.classList.toggle("has-question", Boolean(centerQuestionEnabled));

      if (result) result.textContent = "";
      resetWordwallFocus();
      currentSelectedIndex = -1;

      setRotorRotation(wheelRotation);
      requestAnimationFrame(fitCenterText);
    }

    function openWheelGame(){
      wheelRotation = 0;
      resetWordwallFocus();
      updateViewportVars();
      buildWheel();
      openScreen("wheelGameScreen");
      collapseSafariBars();
      requestAnimationFrame(()=>{
        updateViewportVars();
        updateWheelGameLayout();
        fitCenterText();
      });
      setTimeout(()=>{
        updateViewportVars();
        updateWheelGameLayout();
        fitCenterText();
      }, 120);
    }

    document.getElementById("testWheelBtn")?.addEventListener("click", openWheelGame);

    document.querySelector(".start-btn")?.addEventListener("click", ()=>{
      openWheelGame();
    });

    document.getElementById("saveWheelBtn")?.addEventListener("click", ()=>{
      alert("تم حفظ اللعبة.");
    });

    function getSelectedIndexAtArrow(){
      const items = getWheelItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const localAngleAtArrow = normalizeAngle(180 - normalizeAngle(wheelRotation));
      const relative = normalizeAngle(localAngleAtArrow - (-90));
      return Math.floor(relative / step) % count;
    }

    function showSelectedAtArrow(){
      const items = getWheelItems();
      const index = getSelectedIndexAtArrow();
      currentSelectedIndex = index;

      const result = document.getElementById("selectedResult");
      const afterSpin = document.getElementById("wheelAfterSpin");

      if (result) result.textContent = textForEntry(items[index], index);
      if (afterSpin) afterSpin.classList.add("show");
      applyWordwallFocus();
    }

    function easeOutQuint(t){
      return 1 - Math.pow(1 - t, 5);
    }

    function cancelSpinAnimation(){
      if (spinAnimationId) {
        cancelAnimationFrame(spinAnimationId);
        spinAnimationId = null;
      }
    }

    function animateWheelTo(targetRotation, duration = 5200){
      cancelSpinAnimation();

      const start = wheelRotation;
      const change = targetRotation - start;
      const startTime = performance.now();

      const result = document.getElementById("selectedResult");
      const afterSpin = document.getElementById("wheelAfterSpin");

      resetWordwallFocus();
      if (result) result.textContent = "";
      if (afterSpin) afterSpin.classList.remove("show");
      let focusStarted = false;

      function frame(now){
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOutQuint(progress);

        setRotorRotation(start + change * eased);

        if (!focusStarted && progress >= 0.68) {
          focusStarted = true;
          applyWordwallFocus();
        }

        if (progress < 1) {
          spinAnimationId = requestAnimationFrame(frame);
        } else {
          spinAnimationId = null;
          setRotorRotation(targetRotation);
          showSelectedAtArrow();
        }
      }

      spinAnimationId = requestAnimationFrame(frame);
    }

    function spinWheelRandom(direction = 1){
      const items = getWheelItems();
      const count = Math.max(items.length, 1);
      const step = 360 / count;
      const selected = count === 1 ? 0 : Math.floor(Math.random() * count);

      const selectedCenterAngle = -90 + selected * step + step / 2;
      const currentNorm = normalizeAngle(wheelRotation);
      const desiredNorm = normalizeAngle(180 - selectedCenterAngle);

      let delta = desiredNorm - currentNorm;
      const fullTurns = 5 + Math.floor(Math.random() * 3);

      if (direction < 0) {
        while (delta > 0) delta -= 360;
        delta -= fullTurns * 360;
      } else {
        while (delta < 0) delta += 360;
        delta += fullTurns * 360;
      }

      currentSelectedIndex = selected;
      animateWheelTo(wheelRotation + delta, 4700 + Math.floor(Math.random() * 450));
    }

    document.getElementById("spinGameBtn")?.addEventListener("click", ()=>{
      spinWheelRandom(1);
    });

    function angleFromPointer(event, element){
      const rect = element.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(event.clientY - cy, event.clientX - cx) * 180 / Math.PI;
    }

    const realWheel = document.getElementById("realWheel");

    realWheel?.addEventListener("pointerdown", (event)=>{
      cancelSpinAnimation();
      resetWordwallFocus();
      realWheel.setPointerCapture?.(event.pointerId);

      const afterSpin = document.getElementById("wheelAfterSpin");
      const result = document.getElementById("selectedResult");

      if (afterSpin) afterSpin.classList.remove("show");
      if (result) result.textContent = "";

      dragState = {
        pointerId: event.pointerId,
        lastAngle: angleFromPointer(event, realWheel),
        totalDelta: 0,
        lastDirection: 1
      };
    });

    realWheel?.addEventListener("pointermove", (event)=>{
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      event.preventDefault();

      const currentAngle = angleFromPointer(event, realWheel);
      let delta = currentAngle - dragState.lastAngle;

      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;

      dragState.lastAngle = currentAngle;
      dragState.totalDelta += delta;
      if (Math.abs(delta) > 0.35) dragState.lastDirection = delta >= 0 ? 1 : -1;

      setRotorRotation(wheelRotation + delta);
    });

    function endDrag(event){
      if (!dragState || dragState.pointerId !== event.pointerId) return;

      const totalDelta = dragState.totalDelta || 0;
      const direction = totalDelta < 0 ? -1 : (dragState.lastDirection || 1);
      dragState = null;

      if (Math.abs(totalDelta) >= 4) {
        spinWheelRandom(direction);
      } else {
        showSelectedAtArrow();
      }
    }

    realWheel?.addEventListener("pointerup", endDrag);
    realWheel?.addEventListener("pointercancel", endDrag);

    document.getElementById("resumeWheelBtn")?.addEventListener("click", ()=>{
      resetWordwallFocus();
      collapseSafariBars();
    });

    document.getElementById("removeSelectedBtn")?.addEventListener("click", ()=>{
      if (currentSelectedIndex < 0) return;
      resetWordwallFocus();

      if (wheelEntries.length) {
        const filledIndexes = [];

        wheelEntries.forEach((entry, index)=>{
          const isFilled = wheelContentType === "images"
            ? (entry.imageData || entry.imageName)
            : wheelContentType === "mixed"
              ? (entry.text || entry.imageData || entry.imageName)
              : entry.text;

          if (isFilled) filledIndexes.push(index);
        });

        const originalIndex = filledIndexes[currentSelectedIndex];
        if (typeof originalIndex === "number") {
          wheelEntries.splice(originalIndex, 1);
        }
      }

      currentSelectedIndex = -1;
      wheelRotation = 0;
      buildWheel();
      renderWheelEntries();
    });

    document.getElementById("exitWheelGameBtn")?.addEventListener("click", ()=>{
      cancelSpinAnimation();
      resetWordwallFocus();
      openScreen("wheelSetupScreen");
    });

    homeButton.addEventListener("click", ()=>{
      if (document.body.classList.contains("playing-wheel")) {
        cancelSpinAnimation();
        resetWordwallFocus();
        openScreen("wheelSetupScreen");
        return;
      }

      if (document.body.classList.contains("subpage")) {
        openScreen("");
        return;
      }

      window.location.href = WEBSITE_HOME_URL;
    });

    renderWheelEntries();
  </script>

</body>
</html>
