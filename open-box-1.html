<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: open-box-v11-rebuilt-box-shape -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>افتح الصندوق - صندوق الألعاب التعليمية</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --box-size:150px;
      --gap:24px;
      --logo-w:clamp(86px, 9.2vw, 148px);
      --bottom-space:calc(60px + var(--safe-bottom));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    /* open-box-safari-scroll-v1: نفس تكتيك صفحة العجلة لإخفاء شريط Safari */
    .box-page{
      position:sticky;
      top:0;
      width:100%;
      min-height:100dvh;
      height:100dvh;
      overflow:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:manipulation;
    }

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:#fff;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      transform:scale(1.04);
      transform-origin:center center;
    }

    .box-page.theme-white .theme-background{
      background:#fff;
      background-image:none;
      transform:scale(1);
    }

    .box-page.theme-classroom .theme-background{
      background-color:#fff;
      background-image:
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        linear-gradient(180deg, #eef6ef 0%, #d8c6a1 100%);
    }

    .box-page.theme-sky-clouds .theme-background{
      background-color:#58c7f3;
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        linear-gradient(180deg, #bfefff 0%, #5cc5f2 100%);
    }

    .box-page.theme-forest .theme-background{
      background-color:#6ec9ee;
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg, #7bd2f3 0%, #7eb64b 100%);
    }

    .box-page.theme-math .theme-background{
      background-color:#f5f4e7;
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg, #f5f4e7 0%, #dfe7ef 100%);
    }

    .box-page.theme-english .theme-background{
      background-color:#72d0d2;
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg, #72d0d2 0%, #72d0d2 100%);
    }

    .box-page.theme-flowers .theme-background{
      background-color:#f8edf3;
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg, #f8edf3 0%, #f3dce7 100%);
    }

    .box-page.theme-national-day .theme-background{
      background-color:#165f55;
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg, #165f55 0%, #0f4f46 100%);
    }

    .box-page.theme-founding-day .theme-background{
      background-color:#d7c9b1;
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg, #d9ccb5 0%, #c9baa2 100%);
    }

    .game-logo{
      position:absolute;
      top:clamp(10px, 1.7vw, 22px);
      left:clamp(12px, 2vw, 30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px, 9vw, 120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:calc(46px + var(--safe-top)) 0 var(--bottom-space) 0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px, 1.5vw, 20px);
      direction:ltr;
    }

    .boxes-grid{
      width:min(93vw, 1180px);
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols, 4), var(--box-size));
      justify-content:center;
      align-content:center;
      gap:var(--gap);
      perspective:1600px;
    }

    .box-card{
      display:block;
      width:var(--box-size);
      height:var(--box-size);
      border:none;
      background:transparent;
      padding:0;
      margin:0;
      cursor:pointer;
      touch-action:manipulation;
      appearance:none;
      -webkit-appearance:none;
    }

    /*
      open-box-v11:
      إعادة بناء كاملة للشكل، بدون الاعتماد على فكرة الصندوق القديمة.
      الحالة المغلقة: مربع بسيط مع قلب ورقم.
      الحالة المفتوحة: صندوق مفتوح فعليًا بشكل قريب من التصميم المرجعي.
    */
    .box-shell{
      display:block;
      position:relative;
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 7px 10px rgba(0,0,0,.12));
      transform:translateZ(0);
    }

    .box-base{
      position:absolute;
      left:0;
      right:0;
      top:15.5%;
      bottom:0;
      z-index:2;
      opacity:0;
      transform:translateY(8%) scale(.96);
      border-radius:0 0 3.8% 3.8%;
      border:clamp(1.8px, .32vw, 3px) solid rgba(255,255,255,.95);
      border-top:0;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.24) 0%,
          rgba(255,255,255,.04) 12%,
          rgba(255,255,255,.03) 88%,
          rgba(0,0,0,.22) 100%),
        radial-gradient(circle at 50% 48%,
          var(--box-color) 0%,
          color-mix(in srgb, var(--box-color) 78%, #000 22%) 58%,
          var(--box-dark) 100%);
      box-shadow:
        inset 0 18px 20px rgba(0,0,0,.24),
        inset 0 -9px 14px rgba(0,0,0,.16),
        0 5px 10px rgba(0,0,0,.09);
      overflow:hidden;
      transition:
        opacity .24s ease .34s,
        transform .48s cubic-bezier(.18,.78,.18,1) .34s;
    }

    .box-card.opened .box-base{
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .box-base::before{
      content:"";
      position:absolute;
      left:7%;
      right:7%;
      top:9%;
      bottom:8%;
      border-radius:3.5%;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,.34) 0%,
          transparent 14%,
          transparent 86%,
          rgba(0,0,0,.30) 100%),
        linear-gradient(180deg,
          rgba(0,0,0,.18) 0%,
          transparent 24%,
          rgba(0,0,0,.11) 100%),
        radial-gradient(circle at 50% 46%,
          color-mix(in srgb, var(--box-color) 92%, #fff 8%) 0%,
          var(--box-color) 48%,
          var(--box-dark) 100%);
      box-shadow:
        inset 0 18px 24px rgba(0,0,0,.36),
        inset 12px 0 20px rgba(0,0,0,.26),
        inset -12px 0 20px rgba(255,255,255,.045),
        inset 0 -13px 17px rgba(0,0,0,.18);
      opacity:.99;
    }

    .box-base::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:1px;
      background:rgba(255,255,255,.92);
      box-shadow:0 1px 0 rgba(0,0,0,.12);
      pointer-events:none;
    }

    .box-content{
      position:absolute;
      left:10%;
      right:10%;
      top:25%;
      bottom:9%;
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      transform:translateY(10px) scale(.94);
      transition:
        opacity .34s ease .64s,
        transform .46s cubic-bezier(.18,.78,.18,1) .64s;
      direction:rtl;
      text-align:center;
      pointer-events:none;
    }

    .box-card.opened .box-content{
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .box-lid{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:100%;
      z-index:10;
      border-radius:2.2%;
      border:0;
      background:
        linear-gradient(180deg,
          rgba(255,255,255,.18) 0%,
          rgba(255,255,255,.05) 24%,
          transparent 44%),
        linear-gradient(180deg,
          var(--box-light) 0%,
          var(--box-color) 55%,
          var(--box-dark) 100%);
      box-shadow:
        inset 0 -5px 0 rgba(0,0,0,.14),
        inset 0 5px 0 rgba(255,255,255,.16),
        0 5px 9px rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      transform:translateZ(2px);
      transition:
        top 1.08s cubic-bezier(.16,.78,.14,1),
        height 1.08s cubic-bezier(.16,.78,.14,1),
        border-radius .88s ease,
        box-shadow .88s ease,
        filter .88s ease;
      will-change:top, height;
    }

    .box-card.opened .box-lid{
      top:0;
      height:15.5%;
      border-radius:0;
      filter:brightness(1.035);
      box-shadow:
        inset 0 -3px 0 rgba(0,0,0,.20),
        inset 0 3px 0 rgba(255,255,255,.17),
        0 5px 8px rgba(0,0,0,.10);
    }

    /* القلب في الحالة المغلقة */
    .box-lid::before{
      content:"♥";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(91, 0, 28, .20);
      font-family:Georgia, "Times New Roman", serif;
      font-size:calc(var(--box-size) * .66);
      font-weight:900;
      line-height:1;
      transform:translateY(3%);
      pointer-events:none;
      transition:
        opacity .20s ease,
        transform .26s ease;
    }

    .box-card.opened .box-lid::before{
      content:"";
      left:11%;
      right:11%;
      top:33%;
      bottom:auto;
      height:22%;
      border-radius:999px;
      background:
        linear-gradient(90deg,
          transparent 0 43%,
          rgba(255,255,255,.93) 48% 55%,
          transparent 60% 100%),
        rgba(0,0,0,.22);
      box-shadow:
        inset 0 2px 3px rgba(0,0,0,.20),
        0 1px 0 rgba(255,255,255,.12);
      opacity:.78;
      transform:none;
      display:block;
      font-size:0;
    }

    .box-lid::after{
      content:"";
      position:absolute;
      left:9%;
      right:9%;
      top:7%;
      height:8%;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);
      pointer-events:none;
      transition:
        left .85s ease,
        right .85s ease,
        top .85s ease,
        height .85s ease,
        background .85s ease,
        opacity .85s ease;
    }

    .box-card.opened .box-lid::after{
      left:0;
      right:0;
      top:auto;
      bottom:-2px;
      height:2px;
      border-radius:0;
      background:rgba(255,255,255,.90);
      box-shadow:0 1px 0 rgba(0,0,0,.10);
      opacity:.95;
    }

    .box-number{
      position:relative;
      z-index:2;
      color:#fff;
      text-shadow:0 2px 5px rgba(0,0,0,.30);
      font-size:clamp(24px, calc(var(--box-size) * .36), 64px);
      font-weight:900;
      line-height:1;
      transition:
        opacity .18s ease,
        transform .22s ease;
    }

    .box-card.opened .box-number{
      opacity:0;
      transform:translateY(-5px) scale(.6);
    }

    .box-hinge,
    .box-front-lip{
      display:none;
    }

    .result-text{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      font-size:clamp(19px, calc(var(--box-size) * .27), 46px);
      line-height:1.12;
      font-weight:900;
      overflow-wrap:anywhere;
      text-shadow:0 2px 5px rgba(0,0,0,.34);
    }

    .result-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      border-radius:2px;
      background:#fff;
      box-shadow:0 1px 5px rgba(0,0,0,.10);
    }

    .result-mixed{
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:minmax(0, 1fr) auto;
      gap:5px;
      align-items:center;
      justify-items:center;
    }

    .result-mixed .result-image{
      min-height:0;
      max-height:100%;
    }

    .result-mixed .result-text{
      height:auto;
      min-height:1.1em;
      font-size:clamp(12px, calc(var(--box-size) * .145), 25px);
      line-height:1.1;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .back-btn,
    .reset-btn{
      pointer-events:auto;
      position:absolute;
      bottom:0;
      height:clamp(34px, 4.8vh, 44px);
      border:2.5px solid #111;
      border-radius:11px;
      color:#111;
      font-size:clamp(14px, 1.7vw, 19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px, 2vw, 24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .back-btn{
      left:clamp(16px, 2.6vw, 34px);
      background:#efd553;
      min-width:clamp(78px, 8vw, 108px);
    }

    .reset-btn{
      right:clamp(16px, 2.8vw, 42px);
      background:#1688d3;
      color:#fff;
      min-width:clamp(78px, 8vw, 110px);
    }

    .back-btn:active,
    .reset-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    @media (orientation:portrait){
      .stage{
        inset:calc(92px + var(--safe-top)) 0 var(--bottom-space) 0;
      }
    }

    @media (max-width:560px){
      :root{ --logo-w:92px; }

      .game-logo{
        top:calc(10px + var(--safe-top));
        left:12px;
      }

      .stage{
        inset:calc(64px + var(--safe-top)) 0 calc(66px + var(--safe-bottom)) 0;
        padding:12px;
      }

      .box-lid,
      .box-base{
        border-radius:12px;
      }

      .back-btn,
      .reset-btn{
        height:38px;
        border-width:2px;
        border-radius:10px;
        font-size:15px;
        padding:0 14px;
      }
    }

    @media (max-height:520px) and (orientation:landscape){
      :root{ --bottom-space:calc(58px + var(--safe-bottom)); }

      .stage{
        inset:calc(54px + var(--safe-top)) 0 var(--bottom-space) 0;
      }

      .game-logo{
        width:clamp(78px, 8.8vw, 130px);
        top:calc(10px + var(--safe-top));
      }

      .fixed-controls{
        bottom:calc(8px + var(--safe-bottom));
      }

      .back-btn,
      .reset-btn{
        height:clamp(32px, 8vh, 42px);
        border-width:2px;
        border-radius:10px;
        font-size:clamp(14px, 3.3vh, 20px);
        box-shadow:0 3px 0 rgba(0,0,0,.18);
      }
    }
  </style>
</head>
<body>
  <main class="box-page theme-white" id="boxPage">
    <div class="theme-background" id="themeBackground"></div>
    <img class="game-logo" src="logo.PNG" alt="" onerror="this.style.display='none'">

    <section class="stage" id="stage">
      <div class="boxes-grid" id="boxesGrid" aria-label="صناديق اللعبة"></div>
    </section>

    <footer class="fixed-controls">
      <button class="back-btn" id="backBtn" type="button">رجوع</button>
      <button class="reset-btn" id="resetBtn" type="button">إعادة</button>
    </footer>
  </main>

  <script>
    const DEMO_ITEMS = [
      { text:"القمر" },
      { text:"الشمس" },
      { text:"الرياض" },
      { text:"الماء" },
      { text:"الصلاة" },
      { text:"كتاب" },
      { text:"مدرسة" },
      { text:"نخلة" }
    ];

    const THEMES = [
      { id:"white", label:"خلفية بيضاء" },
      { id:"classroom", label:"فصل مدرسي" },
      { id:"sky-clouds", label:"سماء وغيوم" },
      { id:"forest", label:"غابة" },
      { id:"math", label:"رياضيات" },
      { id:"english", label:"انجليزي" },
      { id:"flowers", label:"ازهار وورود" },
      { id:"national-day", label:"اليوم الوطني" },
      { id:"founding-day", label:"يوم التأسيس" }
    ];

    const BOX_COLORS = [
      { c:"#1e9be0", l:"#33b4f4", d:"#0786c9", b:"#2ab5f5" },
      { c:"#d71e3b", l:"#ea2a48", d:"#b9122d", b:"#f05268" },
      { c:"#ff790b", l:"#ff8a1d", d:"#f15a00", b:"#ff9a35" },
      { c:"#21864a", l:"#2b9b5a", d:"#14743b", b:"#35a965" },
      { c:"#c84dd4", l:"#dc62e7", d:"#ad34bb", b:"#e878ee" },
      { c:"#283bd4", l:"#394ce6", d:"#1d27bd", b:"#5264ff" },
      { c:"#44bf8f", l:"#58d4a5", d:"#2ea978", b:"#6be0b4" },
      { c:"#ef310b", l:"#ff4218", d:"#d61d00", b:"#ff6842" },
      { c:"#f0b429", l:"#ffd05b", d:"#d89812", b:"#ffde82" },
      { c:"#7357d6", l:"#8a70ee", d:"#5c42bd", b:"#a491ff" },
      { c:"#0097a7", l:"#16b5c6", d:"#007c88", b:"#31cbd8" },
      { c:"#f06292", l:"#ff7baa", d:"#dd3d77", b:"#ff99bf" }
    ];

    const page = document.getElementById("boxPage");
    const stage = document.getElementById("stage");
    const grid = document.getElementById("boxesGrid");
    const resetBtn = document.getElementById("resetBtn");
    const backBtn = document.getElementById("backBtn");

    let currentTheme = normalizeTheme(getUrlParam("theme") || getSavedTheme() || "white");
    let items = loadItems();
    let opened = new Set();

    function getUrlParam(name){
      try {
        return new URLSearchParams(window.location.search || "").get(name) || "";
      } catch (_) {
        return "";
      }
    }

    function getSavedTheme(){
      try {
        return sessionStorage.getItem("sandooq_edu_box_theme_v1") || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();
      const map = {
        "classic":"white",
        "original":"white",
        "خلفية بيضاء":"white",
        "ابيض":"white",
        "أبيض":"white",
        "white":"white",
        "classroom":"classroom",
        "فصل مدرسة":"classroom",
        "فصل مدرسي":"classroom",
        "sky-clouds":"sky-clouds",
        "سماء وغيوم":"sky-clouds",
        "forest":"forest",
        "غابة":"forest",
        "math":"math",
        "رياضيات":"math",
        "english":"english",
        "انجليزي":"english",
        "flowers":"flowers",
        "ازهار وورود":"flowers",
        "أزهار وورود":"flowers",
        "national-day":"national-day",
        "اليوم الوطني":"national-day",
        "founding-day":"founding-day",
        "يوم التأسيس":"founding-day"
      };
      if (map[raw]) return map[raw];
      return THEMES.some((theme)=> theme.id === raw) ? raw : "white";
    }

    function loadItems(){
      try {
        const raw =
          sessionStorage.getItem("sandooq_open_box_payload_v1") ||
          sessionStorage.getItem("sandooq_open_box_draft_v1") ||
          "";
        if (!raw) return DEMO_ITEMS;

        const payload = JSON.parse(raw);
        const source = Array.isArray(payload) ? payload : payload.entries || payload.items || [];
        const clean = source
          .map((entry)=> ({
            text: String(entry.text || entry.title || entry.answer || "").trim(),
            imageData: entry.imageData || entry.image || "",
            imageName: entry.imageName || ""
          }))
          .filter((entry)=> entry.text || entry.imageData || entry.imageName)
          .slice(0, 50);

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        return clean.length ? clean : DEMO_ITEMS;
      } catch (_) {
        return DEMO_ITEMS;
      }
    }

    function applyTheme(themeId){
      currentTheme = normalizeTheme(themeId);
      page.className = `box-page theme-${currentTheme}`;
      try { sessionStorage.setItem("sandooq_edu_box_theme_v1", currentTheme); } catch (_) {}
    }

    function calculateLayout(count){
      const rect = stage.getBoundingClientRect();
      const width = Math.max(280, rect.width - 24);
      const height = Math.max(260, rect.height - 24);
      const ratio = width / height;
      let cols;

      if (count <= 4) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : count;
      } else if (count <= 8) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : 4;
      } else {
        cols = Math.ceil(Math.sqrt(count * ratio));
        cols = Math.max(3, Math.min(10, cols));
      }

      let rows = Math.ceil(count / cols);
      let gap = count > 30 ? 8 : count > 20 ? 10 : count > 12 ? 14 : 24;
      let size = Math.min(
        158,
        Math.floor((width - gap * (cols - 1)) / cols),
        Math.floor((height - gap * (rows - 1)) / rows)
      );

      const minSize = count > 40 ? 42 : count > 30 ? 48 : count > 20 ? 58 : 78;

      while (size < minSize && cols < 10) {
        cols += 1;
        rows = Math.ceil(count / cols);
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      if (size < minSize) {
        gap = Math.max(5, Math.floor(gap * 0.72));
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      size = Math.max(34, size);
      return { cols, gap, size };
    }

    function applyLayout(){
      const layout = calculateLayout(items.length);
      grid.style.setProperty("--cols", String(layout.cols));
      grid.style.setProperty("--gap", `${layout.gap}px`);
      grid.style.setProperty("--box-size", `${layout.size}px`);
      document.documentElement.style.setProperty("--gap", `${layout.gap}px`);
      document.documentElement.style.setProperty("--box-size", `${layout.size}px`);
    }

    function renderBoxes(){
      applyLayout();
      grid.innerHTML = "";

      items.forEach((entry, index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "box-card";
        button.setAttribute("aria-label", `صندوق رقم ${index + 1}`);
        button.setAttribute("aria-pressed", "false");
        button.dataset.index = String(index);

        const color = BOX_COLORS[index % BOX_COLORS.length];
        button.style.setProperty("--box-color", color.c);
        button.style.setProperty("--box-light", color.l);
        button.style.setProperty("--box-dark", color.d);
        button.style.setProperty("--box-border", color.b);

        const shell = document.createElement("span");
        shell.className = "box-shell";

        const base = document.createElement("span");
        base.className = "box-base";

        const content = document.createElement("span");
        content.className = "box-content";
        content.appendChild(createResultContent(entry));

        const lid = document.createElement("span");
        lid.className = "box-lid";

        const number = document.createElement("span");
        number.className = "box-number";
        number.textContent = String(index + 1);

        const hinge = document.createElement("span");
        hinge.className = "box-hinge";

        const frontLip = document.createElement("span");
        frontLip.className = "box-front-lip";

        lid.appendChild(number);
        shell.appendChild(base);
        shell.appendChild(content);
        shell.appendChild(lid);
        shell.appendChild(hinge);
        shell.appendChild(frontLip);
        button.appendChild(shell);

        button.addEventListener("click", ()=>{
          openBox(button, index);
        });

        grid.appendChild(button);
      });
    }

    function createResultContent(entry){
      const hasImage = Boolean(entry.imageData || entry.imageName);
      const hasText = Boolean(entry.text);

      if (hasImage && hasText) {
        const wrap = document.createElement("span");
        wrap.className = "result-mixed";

        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        wrap.appendChild(img);

        const text = document.createElement("span");
        text.className = "result-text";
        text.textContent = entry.text;
        wrap.appendChild(text);

        return wrap;
      }

      if (hasImage) {
        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        return img;
      }

      const text = document.createElement("span");
      text.className = "result-text";
      text.textContent = entry.text || "—";
      return text;
    }

    function openBox(button, index){
      if (opened.has(index)) return;
      opened.add(index);
      button.classList.add("opened");
      button.setAttribute("aria-pressed", "true");
    }

    function resetBoxes(){
      opened.clear();
      document.querySelectorAll(".box-card.opened").forEach((card)=>{
        card.classList.remove("opened");
        card.setAttribute("aria-pressed", "false");
      });
    }

    function goBack(){
      try {
        if (history.length > 1) {
          history.back();
          return;
        }
      } catch (_) {}
      window.location.href = "index.html";
    }

    resetBtn.addEventListener("click", resetBoxes);
    backBtn.addEventListener("click", goBack);

    window.addEventListener("resize", ()=>{
      applyLayout();
    }, { passive:true });

    window.addEventListener("orientationchange", ()=>{
      window.setTimeout(applyLayout, 160);
    }, { passive:true });

    applyTheme(currentTheme);
    renderBoxes();
  </script>
</body>
</html>
