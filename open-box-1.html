<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: open-box-v14-clean-rebuild -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>افتح الصندوق - صندوق الألعاب التعليمية</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --tile-size:150px;
      --tile-gap:24px;
      --logo-w:clamp(86px, 9.2vw, 148px);
      --bottom-space:calc(60px + var(--safe-bottom));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:manipulation;
    }

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:#fff center/cover no-repeat;
      transform:scale(1.04);
      transform-origin:center center;
    }

    .theme-white .theme-background{
      background:#fff;
      transform:scale(1);
    }

    .theme-classroom .theme-background{
      background-image:
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        linear-gradient(180deg,#eef6ef 0%,#d8c6a1 100%);
    }

    .theme-sky-clouds .theme-background{
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        linear-gradient(180deg,#bfefff 0%,#5cc5f2 100%);
    }

    .theme-forest .theme-background{
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .theme-math .theme-background{
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .theme-english .theme-background{
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#72d0d2 100%);
    }

    .theme-flowers .theme-background{
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .theme-national-day .theme-background{
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .theme-founding-day .theme-background{
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    .game-logo{
      position:absolute;
      top:clamp(10px, 1.7vw, 22px);
      left:clamp(12px, 2vw, 30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px, 9vw, 120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:calc(46px + var(--safe-top)) 0 var(--bottom-space) 0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px, 1.5vw, 20px);
      direction:ltr;
    }

    .gift-grid{
      width:min(93vw, 1180px);
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols, 4), var(--tile-size));
      justify-content:center;
      align-content:center;
      gap:var(--tile-gap);
    }

    /*
      بناء جديد بالكامل:
      - لا يوجد العناصر القديمة.
      - يوجد حالتان منفصلتان: .present-closed و .present-open.
      - الضغط لا يصغر نفس الصندوق القديم؛ بل يبدّل بين تصميمين مستقلين.
    */
    .present{
      --paper-main:#2aa2df;
      --paper-light:#8ad7f7;
      --paper-dark:#0e67b2;
      --ribbon:#7551d8;
      --ribbon-dark:#6040ba;
      --well-light:#c6f2f4;
      --well-mid:#78c9c5;
      --well-dark:#426b57;
      --wood-side:#855326;
      --wood-dark:#4f2b12;
      --white-edge:#fff;

      display:block;
      width:var(--tile-size);
      height:var(--tile-size);
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
    }

    .gift-blue{
      --paper-main:#2298d8;
      --paper-light:#8bdcf9;
      --paper-dark:#0e62ad;
      --ribbon:#7c56d9;
      --ribbon-dark:#613bbd;
      --well-light:#d6fbff;
      --well-mid:#79ccdc;
      --well-dark:#3d6d76;
      --pattern:blue;
    }

    .gift-green{
      --paper-main:#22a769;
      --paper-light:#f3fff5;
      --paper-dark:#0c804d;
      --ribbon:#ff4b86;
      --ribbon-dark:#e43270;
      --well-light:#e8fff2;
      --well-mid:#73d0a5;
      --well-dark:#315d47;
      --pattern:green;
    }

    .gift-yellow{
      --paper-main:#f1bd24;
      --paper-light:#ffe360;
      --paper-dark:#d28613;
      --ribbon:#f47627;
      --ribbon-dark:#df5d14;
      --well-light:#fff6cd;
      --well-mid:#d4b568;
      --well-dark:#725115;
      --pattern:yellow;
    }

    .gift-purple{
      --paper-main:#7134d6;
      --paper-light:#925bff;
      --paper-dark:#5125ac;
      --ribbon:#c8ad45;
      --ribbon-dark:#a98e31;
      --well-light:#eee4ff;
      --well-mid:#b396df;
      --well-dark:#574087;
      --pattern:purple;
    }

    .gift-red{
      --paper-main:#ee2546;
      --paper-light:#ff4260;
      --paper-dark:#bb172f;
      --ribbon:#f3cf43;
      --ribbon-dark:#dfa516;
      --well-light:#ffe4e2;
      --well-mid:#d8897c;
      --well-dark:#78302e;
      --pattern:red;
    }

    .present-wrap{
      position:relative;
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 5px 7px rgba(0,0,0,.18));
    }

    .present-closed,
    .present-open{
      position:absolute;
      inset:0;
      display:block;
      width:100%;
      height:100%;
      transition:
        opacity .18s ease,
        transform .34s cubic-bezier(.2,.8,.2,1);
    }

    .present-closed{
      z-index:5;
      opacity:1;
      transform:scale(1);
    }

    .present.opened .present-closed{
      opacity:0;
      transform:scale(.96);
      pointer-events:none;
    }

    .present-open{
      z-index:6;
      opacity:0;
      transform:scale(.96) translateY(4px);
      pointer-events:none;
    }

    .present.opened .present-open{
      opacity:1;
      transform:scale(1) translateY(0);
    }

    .gift-cover{
      position:absolute;
      inset:0;
      border:clamp(2px, .34vw, 3.4px) solid var(--white-edge);
      border-radius:2px;
      overflow:hidden;
      background:var(--closed-pattern);
      box-shadow:
        inset 0 -4px 0 rgba(0,0,0,.16),
        inset 0 4px 0 rgba(255,255,255,.14),
        0 4px 7px rgba(0,0,0,.08);
    }

    .gift-blue .gift-cover{
      --closed-pattern:
        linear-gradient(90deg, transparent 0 27%, var(--ribbon) 28% 45%, transparent 46% 100%),
        linear-gradient(0deg, transparent 0 45%, var(--ribbon-dark) 46% 62%, transparent 63% 100%),
        repeating-linear-gradient(45deg, var(--paper-main) 0 13px, var(--paper-light) 14px 25px);
    }

    .gift-green .gift-cover{
      --closed-pattern:
        linear-gradient(90deg, transparent 0 42%, var(--ribbon) 43% 58%, transparent 59% 100%),
        linear-gradient(0deg, transparent 0 43%, var(--ribbon-dark) 44% 60%, transparent 61% 100%),
        repeating-linear-gradient(90deg, var(--paper-main) 0 9px, var(--paper-light) 10px 17px);
    }

    .gift-yellow .gift-cover{
      --closed-pattern:
        linear-gradient(135deg, transparent 0 39%, var(--ribbon) 40% 51%, transparent 52% 100%),
        radial-gradient(circle at 24% 25%, rgba(215,118,37,.58) 0 7%, transparent 7.5%),
        radial-gradient(circle at 72% 64%, rgba(215,118,37,.54) 0 7%, transparent 7.5%),
        radial-gradient(circle at 38% 78%, rgba(215,118,37,.45) 0 6%, transparent 6.5%),
        linear-gradient(180deg, var(--paper-light), var(--paper-main) 62%, var(--paper-dark));
    }

    .gift-purple .gift-cover{
      --closed-pattern:
        linear-gradient(135deg, transparent 0 41%, var(--ribbon) 42% 52%, transparent 53% 100%),
        linear-gradient(45deg, transparent 0 39%, var(--ribbon-dark) 40% 48%, transparent 49% 100%),
        repeating-radial-gradient(ellipse at 18% 34%, rgba(255,255,255,.08) 0 3px, transparent 4px 15px),
        linear-gradient(180deg, var(--paper-light), var(--paper-main) 60%, var(--paper-dark));
    }

    .gift-red .gift-cover{
      --closed-pattern:
        linear-gradient(135deg, transparent 0 41%, var(--ribbon) 42% 52%, transparent 53% 100%),
        radial-gradient(circle at 25% 25%, rgba(244,178,43,.58) 0 7%, transparent 7.5%),
        radial-gradient(circle at 72% 62%, rgba(244,178,43,.55) 0 7%, transparent 7.5%),
        radial-gradient(circle at 42% 78%, rgba(244,178,43,.45) 0 6%, transparent 6.5%),
        linear-gradient(180deg, var(--paper-light), var(--paper-main) 62%, var(--paper-dark));
    }

    .gift-cover::after{
      content:"";
      position:absolute;
      left:10%;
      right:10%;
      top:7%;
      height:8%;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);
      pointer-events:none;
    }

    .present-number{
      position:absolute;
      inset:0;
      z-index:3;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      -webkit-text-stroke:clamp(1.1px, .18vw, 2.3px) #151515;
      paint-order:stroke fill;
      text-shadow:
        0 2px 2px rgba(0,0,0,.55),
        0 0 1px rgba(0,0,0,.85);
      font-size:clamp(24px, calc(var(--tile-size) * .34), 64px);
      font-weight:900;
      font-style:italic;
      line-height:1;
      transform:rotate(-3deg);
      pointer-events:none;
    }

    .open-lid{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:25%;
      z-index:6;
      border:clamp(2px, .34vw, 3.4px) solid var(--white-edge);
      border-radius:1px 1px 0 0;
      overflow:hidden;
      background:var(--closed-pattern);
      box-shadow:
        inset 0 -3px 0 rgba(0,0,0,.22),
        inset 0 3px 0 rgba(255,255,255,.14),
        0 4px 7px rgba(0,0,0,.12);
    }

    .open-lid::after{
      content:"";
      position:absolute;
      left:10%;
      right:10%;
      top:7%;
      height:8%;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);
      pointer-events:none;
    }

    .open-body{
      position:absolute;
      left:0;
      right:0;
      top:25%;
      bottom:0;
      z-index:3;
      border:clamp(2px, .34vw, 3.4px) solid var(--white-edge);
      border-top:0;
      border-radius:0 0 2px 2px;
      overflow:hidden;
      background:
        linear-gradient(90deg,
          #4a260f 0%,
          #865223 8%,
          rgba(230,196,133,.88) 16%,
          rgba(247,225,178,.78) 50%,
          rgba(230,196,133,.88) 84%,
          #865223 92%,
          #4a260f 100%);
      box-shadow:
        inset 0 15px 17px rgba(0,0,0,.28),
        inset 0 -9px 11px rgba(70,34,10,.25),
        0 5px 8px rgba(0,0,0,.10);
    }

    .open-body::before{
      content:"";
      position:absolute;
      left:7.2%;
      right:7.2%;
      top:9%;
      bottom:8%;
      border-radius:1px;
      background:
        radial-gradient(circle at 52% 46%, var(--well-light) 0%, var(--well-mid) 44%, var(--well-dark) 100%);
      box-shadow:
        inset 0 18px 23px rgba(0,0,0,.36),
        inset 13px 0 20px rgba(74,35,12,.42),
        inset -13px 0 20px rgba(74,35,12,.30),
        inset 0 -13px 16px rgba(48,23,9,.24);
    }

    .open-body::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:2px;
      background:rgba(255,255,255,.95);
      box-shadow:0 1px 0 rgba(0,0,0,.12);
    }

    .present-content{
      position:absolute;
      left:9.5%;
      right:9.5%;
      top:32%;
      bottom:8.5%;
      z-index:8;
      display:flex;
      align-items:center;
      justify-content:center;
      direction:rtl;
      text-align:center;
      pointer-events:none;
    }

    .result-text{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      -webkit-text-stroke:clamp(.65px, .12vw, 1.6px) rgba(0,0,0,.38);
      paint-order:stroke fill;
      font-size:clamp(18px, calc(var(--tile-size) * .22), 42px);
      line-height:1.08;
      font-weight:900;
      overflow-wrap:anywhere;
      text-shadow:0 2px 5px rgba(0,0,0,.35);
    }

    .result-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      border-radius:2px;
      background:#fff;
      box-shadow:0 1px 5px rgba(0,0,0,.10);
    }

    .result-mixed{
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:minmax(0, 1fr) auto;
      gap:5px;
      align-items:center;
      justify-items:center;
    }

    .result-mixed .result-image{
      min-height:0;
      max-height:100%;
    }

    .result-mixed .result-text{
      height:auto;
      min-height:1.1em;
      font-size:clamp(11px, calc(var(--tile-size) * .12), 22px);
      line-height:1.08;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .back-btn,
    .reset-btn{
      pointer-events:auto;
      position:absolute;
      bottom:0;
      height:clamp(34px, 4.8vh, 44px);
      border:2.5px solid #111;
      border-radius:11px;
      color:#111;
      font-size:clamp(14px, 1.7vw, 19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px, 2vw, 24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .back-btn{
      left:clamp(16px, 2.6vw, 34px);
      background:#efd553;
      min-width:clamp(78px, 8vw, 108px);
    }

    .reset-btn{
      right:clamp(16px, 2.8vw, 42px);
      background:#1688d3;
      color:#fff;
      min-width:clamp(78px, 8vw, 110px);
    }

    .back-btn:active,
    .reset-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    @media (orientation:portrait){
      .stage{
        inset:calc(92px + var(--safe-top)) 0 var(--bottom-space) 0;
      }
    }

    @media (max-width:560px){
      :root{ --logo-w:92px; }

      .game-logo{
        top:calc(10px + var(--safe-top));
        left:12px;
      }

      .stage{
        inset:calc(64px + var(--safe-top)) 0 calc(66px + var(--safe-bottom)) 0;
        padding:12px;
      }

      .back-btn,
      .reset-btn{
        height:38px;
        border-width:2px;
        border-radius:10px;
        font-size:15px;
        padding:0 14px;
      }
    }

    @media (max-height:520px) and (orientation:landscape){
      :root{ --bottom-space:calc(58px + var(--safe-bottom)); }

      .stage{
        inset:calc(54px + var(--safe-top)) 0 var(--bottom-space) 0;
      }

      .game-logo{
        width:clamp(78px, 8.8vw, 130px);
        top:calc(10px + var(--safe-top));
      }

      .fixed-controls{
        bottom:calc(8px + var(--safe-bottom));
      }

      .back-btn,
      .reset-btn{
        height:clamp(32px, 8vh, 42px);
        border-width:2px;
        border-radius:10px;
        font-size:clamp(14px, 3.3vh, 20px);
        box-shadow:0 3px 0 rgba(0,0,0,.18);
      }
    }
  </style>
</head>
<body>
  <main class="game-page theme-white" id="gamePage">
    <div class="theme-background"></div>
    <img class="game-logo" src="logo.PNG" alt="" onerror="this.style.display='none'">

    <section class="stage" id="stage">
      <div class="gift-grid" id="giftGrid" aria-label="صناديق اللعبة"></div>
    </section>

    <footer class="fixed-controls">
      <button class="back-btn" id="backBtn" type="button">رجوع</button>
      <button class="reset-btn" id="resetBtn" type="button">إعادة</button>
    </footer>
  </main>

  <script>
    const DEMO_ITEMS = [
      { text:"القمر" },
      { text:"الشمس" },
      { text:"الرياض" },
      { text:"الماء" },
      { text:"الصلاة" },
      { text:"كتاب" },
      { text:"مدرسة" },
      { text:"نخلة" }
    ];

    const THEMES = [
      { id:"white", label:"خلفية بيضاء" },
      { id:"classroom", label:"فصل مدرسي" },
      { id:"sky-clouds", label:"سماء وغيوم" },
      { id:"forest", label:"غابة" },
      { id:"math", label:"رياضيات" },
      { id:"english", label:"انجليزي" },
      { id:"flowers", label:"ازهار وورود" },
      { id:"national-day", label:"اليوم الوطني" },
      { id:"founding-day", label:"يوم التأسيس" }
    ];

    const page = document.getElementById("gamePage");
    const stage = document.getElementById("stage");
    const grid = document.getElementById("giftGrid");
    const resetBtn = document.getElementById("resetBtn");
    const backBtn = document.getElementById("backBtn");

    let currentTheme = normalizeTheme(getUrlParam("theme") || getSavedTheme() || "white");
    let items = loadItems();
    let opened = new Set();

    function getUrlParam(name){
      try {
        return new URLSearchParams(window.location.search || "").get(name) || "";
      } catch (_) {
        return "";
      }
    }

    function getSavedTheme(){
      try {
        return sessionStorage.getItem("sandooq_edu_box_theme_v1") || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();
      const map = {
        "classic":"white",
        "original":"white",
        "خلفية بيضاء":"white",
        "ابيض":"white",
        "أبيض":"white",
        "white":"white",
        "classroom":"classroom",
        "فصل مدرسة":"classroom",
        "فصل مدرسي":"classroom",
        "sky-clouds":"sky-clouds",
        "سماء وغيوم":"sky-clouds",
        "forest":"forest",
        "غابة":"forest",
        "math":"math",
        "رياضيات":"math",
        "english":"english",
        "انجليزي":"english",
        "flowers":"flowers",
        "ازهار وورود":"flowers",
        "أزهار وورود":"flowers",
        "national-day":"national-day",
        "اليوم الوطني":"national-day",
        "founding-day":"founding-day",
        "يوم التأسيس":"founding-day"
      };
      if (map[raw]) return map[raw];
      return THEMES.some((theme)=> theme.id === raw) ? raw : "white";
    }

    function loadItems(){
      try {
        const raw =
          sessionStorage.getItem("sandooq_open_box_payload_v1") ||
          sessionStorage.getItem("sandooq_open_box_draft_v1") ||
          "";
        if (!raw) return DEMO_ITEMS;

        const payload = JSON.parse(raw);
        const source = Array.isArray(payload) ? payload : payload.entries || payload.items || [];
        const clean = source
          .map((entry)=> ({
            text: String(entry.text || entry.title || entry.answer || "").trim(),
            imageData: entry.imageData || entry.image || "",
            imageName: entry.imageName || ""
          }))
          .filter((entry)=> entry.text || entry.imageData || entry.imageName)
          .slice(0, 50);

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        return clean.length ? clean : DEMO_ITEMS;
      } catch (_) {
        return DEMO_ITEMS;
      }
    }

    function applyTheme(themeId){
      currentTheme = normalizeTheme(themeId);
      page.className = `game-page theme-${currentTheme}`;
      try { sessionStorage.setItem("sandooq_edu_box_theme_v1", currentTheme); } catch (_) {}
    }

    function calculateLayout(count){
      const rect = stage.getBoundingClientRect();
      const width = Math.max(280, rect.width - 24);
      const height = Math.max(260, rect.height - 24);
      const ratio = width / height;
      let cols;

      if (count <= 4) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : count;
      } else if (count <= 8) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : 4;
      } else {
        cols = Math.ceil(Math.sqrt(count * ratio));
        cols = Math.max(3, Math.min(10, cols));
      }

      let rows = Math.ceil(count / cols);
      let gap = count > 30 ? 8 : count > 20 ? 10 : count > 12 ? 14 : 24;
      let size = Math.min(
        158,
        Math.floor((width - gap * (cols - 1)) / cols),
        Math.floor((height - gap * (rows - 1)) / rows)
      );

      const minSize = count > 40 ? 42 : count > 30 ? 48 : count > 20 ? 58 : 78;

      while (size < minSize && cols < 10) {
        cols += 1;
        rows = Math.ceil(count / cols);
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      if (size < minSize) {
        gap = Math.max(5, Math.floor(gap * .72));
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      return { cols, gap, size:Math.max(34, size) };
    }

    function applyLayout(){
      const layout = calculateLayout(items.length);
      grid.style.setProperty("--cols", String(layout.cols));
      grid.style.setProperty("--tile-gap", `${layout.gap}px`);
      grid.style.setProperty("--tile-size", `${layout.size}px`);
      document.documentElement.style.setProperty("--tile-gap", `${layout.gap}px`);
      document.documentElement.style.setProperty("--tile-size", `${layout.size}px`);
    }

    function renderBoxes(){
      applyLayout();
      grid.innerHTML = "";

      items.forEach((entry, index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "present";
        const giftClasses = ["gift-blue", "gift-green", "gift-yellow", "gift-purple", "gift-red"];
        button.classList.add(giftClasses[index % giftClasses.length]);
        button.setAttribute("aria-label", `صندوق رقم ${index + 1}`);
        button.setAttribute("aria-pressed", "false");
        button.dataset.index = String(index);

        const wrap = document.createElement("span");
        wrap.className = "present-wrap";

        const closed = document.createElement("span");
        closed.className = "present-closed";

        const cover = document.createElement("span");
        cover.className = "gift-cover";

        const closedNumber = document.createElement("span");
        closedNumber.className = "present-number";
        closedNumber.textContent = String(index + 1);

        cover.appendChild(closedNumber);
        closed.appendChild(cover);

        const open = document.createElement("span");
        open.className = "present-open";

        const lid = document.createElement("span");
        lid.className = "open-lid";

        const body = document.createElement("span");
        body.className = "open-body";

        const content = document.createElement("span");
        content.className = "present-content";
        content.appendChild(createResultContent(entry));

        open.appendChild(lid);
        open.appendChild(body);
        open.appendChild(content);

        wrap.appendChild(closed);
        wrap.appendChild(open);
        button.appendChild(wrap);

        button.addEventListener("click", ()=>{
          openBox(button, index);
        });

        grid.appendChild(button);
      });
    }

    function createResultContent(entry){
      const hasImage = Boolean(entry.imageData || entry.imageName);
      const hasText = Boolean(entry.text);

      if (hasImage && hasText) {
        const wrap = document.createElement("span");
        wrap.className = "result-mixed";

        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        wrap.appendChild(img);

        const text = document.createElement("span");
        text.className = "result-text";
        text.textContent = entry.text;
        wrap.appendChild(text);

        return wrap;
      }

      if (hasImage) {
        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        return img;
      }

      const text = document.createElement("span");
      text.className = "result-text";
      text.textContent = entry.text || "—";
      return text;
    }

    function openBox(button, index){
      if (opened.has(index)) return;
      opened.add(index);
      button.classList.add("opened");
      button.setAttribute("aria-pressed", "true");
    }

    function resetBoxes(){
      opened.clear();
      document.querySelectorAll(".present.opened").forEach((card)=>{
        card.classList.remove("opened");
        card.setAttribute("aria-pressed", "false");
      });
    }

    function goBack(){
      try {
        if (history.length > 1) {
          history.back();
          return;
        }
      } catch (_) {}
      window.location.href = "index.html";
    }

    resetBtn.addEventListener("click", resetBoxes);
    backBtn.addEventListener("click", goBack);

    window.addEventListener("resize", applyLayout, { passive:true });
    window.addEventListener("orientationchange", ()=>{
      window.setTimeout(applyLayout, 160);
    }, { passive:true });

    applyTheme(currentTheme);
    renderBoxes();
  </script>
</body>
</html>
