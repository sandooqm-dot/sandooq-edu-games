<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- version: open-box-v15-user-box-design -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>افتح الصندوق - صندوق الألعاب التعليمية</title>
  <style>
    :root{
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ink:#111;
      --yellow:#efd553;
      --blue:#1688d3;
      --tile-size:150px;
      --tile-gap:24px;
      --logo-w:clamp(86px, 9.2vw, 148px);
      --bottom-space:calc(60px + var(--safe-bottom));
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      font-family:Tahoma, Arial, "Segoe UI", sans-serif;
    }

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:calc(100dvh + 160px);
      overflow-x:hidden;
      overflow-y:auto;
      overscroll-behavior-y:none;
      -webkit-overflow-scrolling:touch;
    }

    body::after{
      content:"";
      display:block;
      height:160px;
      pointer-events:none;
    }

    .game-page{
      position:sticky;
      top:0;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      overflow:hidden;
      background:#fff;
      direction:ltr;
      user-select:none;
      touch-action:manipulation;
    }

    .theme-background{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:#fff center/cover no-repeat;
      transform:scale(1.04);
      transform-origin:center center;
    }

    .theme-white .theme-background{
      background:#fff;
      transform:scale(1);
    }

    .theme-classroom .theme-background{
      background-image:
        url("theme-original-bg.webp?v=45"),
        url("theme-original-bg.png?v=45"),
        linear-gradient(180deg,#eef6ef 0%,#d8c6a1 100%);
    }

    .theme-sky-clouds .theme-background{
      background-image:
        url("theme-sky-clouds-bg.webp?v=45"),
        url("theme-sky-clouds-bg.png?v=45"),
        linear-gradient(180deg,#bfefff 0%,#5cc5f2 100%);
    }

    .theme-forest .theme-background{
      background-image:
        url("theme-forest-bg.webp?v=45"),
        linear-gradient(180deg,#7bd2f3 0%,#7eb64b 100%);
    }

    .theme-math .theme-background{
      background-image:
        url("theme-math-bg.webp?v=45"),
        linear-gradient(180deg,#f5f4e7 0%,#dfe7ef 100%);
    }

    .theme-english .theme-background{
      background-image:
        url("theme-english-bg.webp?v=46"),
        linear-gradient(180deg,#72d0d2 0%,#72d0d2 100%);
    }

    .theme-flowers .theme-background{
      background-image:
        url("theme-flowers-bg.webp?v=48"),
        linear-gradient(180deg,#f8edf3 0%,#f3dce7 100%);
    }

    .theme-national-day .theme-background{
      background-image:
        url("theme-national-day-v2-bg.webp?v=53"),
        linear-gradient(180deg,#165f55 0%,#0f4f46 100%);
    }

    .theme-founding-day .theme-background{
      background-image:
        url("theme-founding-day-bg.webp?v=1"),
        linear-gradient(180deg,#d9ccb5 0%,#c9baa2 100%);
    }

    .game-logo{
      position:absolute;
      top:clamp(10px, 1.7vw, 22px);
      left:clamp(12px, 2vw, 30px);
      width:var(--logo-w);
      height:auto;
      max-height:clamp(68px, 9vw, 120px);
      object-fit:contain;
      z-index:80;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .stage{
      position:absolute;
      inset:calc(46px + var(--safe-top)) 0 var(--bottom-space) 0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(8px, 1.5vw, 20px);
      direction:ltr;
    }

    .box-grid{
      width:min(93vw, 1180px);
      max-height:100%;
      display:grid;
      grid-template-columns:repeat(var(--cols, 4), var(--tile-size));
      justify-content:center;
      align-content:center;
      gap:var(--tile-gap);
    }

    /*
      open-box-v15:
      تنفيذ صندوق المستخدم نفسه:
      - صندوق ثابت بإطار خارجي ملوّن.
      - داخل ثلاثي الأبعاد أبيض/رمادي واسع.
      - الغطاء مستقل فوق الصندوق ويفتح للأعلى.
      - نغيّر الألوان فقط لكل صندوق.
    */
    .box-card{
      --frame:#087c32;
      --frame-dark:#045921;
      --frame-light:#10a34b;
      --lid:#087c32;
      --lid-dark:#045921;
      --lid-light:#16ad55;
      --inner:#f5f5f5;
      --bevel1:#ffffff;
      --bevel2:#dcdcdc;
      --shadow:rgba(0,0,0,.14);

      display:block;
      width:var(--tile-size);
      height:var(--tile-size);
      border:0;
      padding:0;
      margin:0;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:manipulation;
      perspective:900px;
    }

    .box-blue{
      --frame:#0b7fc4;
      --frame-dark:#075b91;
      --frame-light:#16a8ea;
      --lid:#0b7fc4;
      --lid-dark:#075b91;
      --lid-light:#25b7f2;
    }

    .box-red{
      --frame:#c71938;
      --frame-dark:#8f1026;
      --frame-light:#ef3658;
      --lid:#c71938;
      --lid-dark:#8f1026;
      --lid-light:#ff4967;
    }

    .box-orange{
      --frame:#e9790b;
      --frame-dark:#b75100;
      --frame-light:#ff992a;
      --lid:#e9790b;
      --lid-dark:#b75100;
      --lid-light:#ff9f32;
    }

    .box-green{
      --frame:#087c32;
      --frame-dark:#045921;
      --frame-light:#10a34b;
      --lid:#087c32;
      --lid-dark:#045921;
      --lid-light:#16ad55;
    }

    .box-purple{
      --frame:#8e31c7;
      --frame-dark:#65208f;
      --frame-light:#c052ea;
      --lid:#8e31c7;
      --lid-dark:#65208f;
      --lid-light:#c85ef0;
    }

    .box-navy{
      --frame:#283bd4;
      --frame-dark:#1923a3;
      --frame-light:#4d63ff;
      --lid:#283bd4;
      --lid-dark:#1923a3;
      --lid-light:#5c70ff;
    }

    .box-mint{
      --frame:#23a876;
      --frame-dark:#167654;
      --frame-light:#58d0a3;
      --lid:#23a876;
      --lid-dark:#167654;
      --lid-light:#65d8ad;
    }

    .box-coral{
      --frame:#ee3a16;
      --frame-dark:#ba2106;
      --frame-light:#ff6744;
      --lid:#ee3a16;
      --lid-dark:#ba2106;
      --lid-light:#ff7051;
    }

    .box-wrap{
      position:relative;
      display:block;
      width:100%;
      height:100%;
      overflow:visible;
      filter:drop-shadow(0 5px 8px var(--shadow));
      transform:translateZ(0);
    }

    .real-box{
      position:absolute;
      inset:0;
      display:block;
      background:var(--frame);
      border:clamp(3px, .55vw, 6px) solid var(--frame);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.14),
        0 4px 8px rgba(0,0,0,.08);
      overflow:hidden;
    }

    /* مساحة الداخل البيضاء بنفس تصميم المستخدم */
    .box-well{
      position:absolute;
      left:clamp(10px, 9%, 16px);
      right:clamp(10px, 9%, 16px);
      top:clamp(10px, 9%, 16px);
      bottom:clamp(10px, 9%, 16px);
      background:var(--inner);
      overflow:hidden;
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.04),
        inset 0 11px 18px rgba(255,255,255,.78),
        inset 0 -13px 20px rgba(0,0,0,.08);
    }

    .box-well::before,
    .box-well::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    /* حواف العمق الداخلية */
    .box-well::before{
      background:
        linear-gradient(135deg, transparent 0 12%, rgba(0,0,0,.08) 12.5% 21%, transparent 21.5%),
        linear-gradient(225deg, transparent 0 12%, rgba(0,0,0,.08) 12.5% 21%, transparent 21.5%),
        linear-gradient(315deg, transparent 0 12%, rgba(0,0,0,.09) 12.5% 21%, transparent 21.5%),
        linear-gradient(45deg, transparent 0 12%, rgba(0,0,0,.07) 12.5% 21%, transparent 21.5%);
    }

    .box-well::after{
      background:
        linear-gradient(180deg, rgba(255,255,255,.80), transparent 22%, transparent 78%, rgba(0,0,0,.08)),
        linear-gradient(90deg, rgba(0,0,0,.08), transparent 22%, transparent 78%, rgba(0,0,0,.08));
      opacity:.72;
    }

    .box-content{
      position:absolute;
      left:18%;
      right:18%;
      top:17%;
      bottom:14%;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      direction:rtl;
      text-align:center;
      opacity:0;
      transform:scale(.96);
      transition:opacity .22s ease .42s, transform .32s ease .42s;
      pointer-events:none;
    }

    .box-card.opened .box-content{
      opacity:1;
      transform:scale(1);
    }

    .box-lid{
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:100%;
      z-index:12;
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 35%),
        linear-gradient(180deg, var(--lid-light), var(--lid) 58%, var(--lid-dark));
      border:clamp(3px, .55vw, 6px) solid var(--lid);
      box-shadow:
        inset 0 5px 0 rgba(255,255,255,.16),
        inset 0 -7px 0 rgba(0,0,0,.16),
        0 4px 8px rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin:50% 0%;
      transition:
        transform 1.05s cubic-bezier(.15,.82,.16,1),
        height 1.05s cubic-bezier(.15,.82,.16,1),
        top 1.05s cubic-bezier(.15,.82,.16,1),
        box-shadow .75s ease,
        filter .75s ease;
      will-change:transform, height, top;
      backface-visibility:visible;
      -webkit-backface-visibility:visible;
      overflow:hidden;
    }

    .box-card.opened .box-lid{
      top:-14%;
      height:22%;
      transform:rotateX(64deg) translateZ(18px);
      filter:brightness(1.07);
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.18),
        inset 0 -4px 0 rgba(0,0,0,.16),
        0 7px 9px rgba(0,0,0,.12);
    }

    .box-lid::after{
      content:"";
      position:absolute;
      left:12%;
      right:12%;
      top:9%;
      height:9%;
      border-radius:999px;
      background:rgba(255,255,255,.22);
      box-shadow:inset 0 -2px 0 rgba(0,0,0,.09);
      pointer-events:none;
    }

    .box-number{
      position:relative;
      z-index:2;
      color:#fff;
      font-size:clamp(24px, calc(var(--tile-size) * .34), 64px);
      line-height:1;
      font-weight:900;
      text-shadow:0 2px 5px rgba(0,0,0,.34);
      transition:opacity .18s ease, transform .26s ease;
      pointer-events:none;
    }

    .box-card.opened .box-number{
      opacity:0;
      transform:scale(.72) translateY(-6px);
    }

    .result-text{
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      text-align:center;
      color:#111;
      font-size:clamp(15px, calc(var(--tile-size) * .23), 40px);
      line-height:1.05;
      font-weight:900;
      overflow-wrap:anywhere;
      text-shadow:none;
      padding-bottom:2%;
    }

    .result-image{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      background:transparent;
    }

    .result-mixed{
      width:100%;
      height:100%;
      display:grid;
      grid-template-rows:minmax(0, 1fr) auto;
      gap:clamp(4px, 5%, 10px);
      align-items:center;
      justify-items:center;
    }

    .result-mixed .result-image{
      min-height:0;
      max-height:100%;
    }

    .result-mixed .result-text{
      height:auto;
      min-height:1.05em;
      font-size:clamp(12px, calc(var(--tile-size) * .18), 30px);
      line-height:1;
      align-items:center;
      padding-bottom:0;
    }

    .fixed-controls{
      position:absolute;
      left:0;
      right:0;
      bottom:calc(14px + var(--safe-bottom));
      height:clamp(44px, 6.2vh, 60px);
      z-index:90;
      pointer-events:none;
    }

    .back-btn,
    .reset-btn{
      pointer-events:auto;
      position:absolute;
      bottom:0;
      height:clamp(34px, 4.8vh, 44px);
      border:2.5px solid #111;
      border-radius:11px;
      color:#111;
      font-size:clamp(14px, 1.7vw, 19px);
      font-weight:900;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 clamp(15px, 2vw, 24px);
      box-shadow:0 4px 0 rgba(0,0,0,.18);
      cursor:pointer;
      white-space:nowrap;
    }

    .back-btn{
      left:clamp(16px, 2.6vw, 34px);
      background:#efd553;
      min-width:clamp(78px, 8vw, 108px);
    }

    .reset-btn{
      right:clamp(16px, 2.8vw, 42px);
      background:#1688d3;
      color:#fff;
      min-width:clamp(78px, 8vw, 110px);
    }

    .back-btn:active,
    .reset-btn:active{
      transform:translateY(2px);
      box-shadow:0 2px 0 rgba(0,0,0,.20);
    }

    @media (orientation:portrait){
      .stage{
        inset:calc(92px + var(--safe-top)) 0 var(--bottom-space) 0;
      }
    }

    @media (max-width:560px){
      :root{ --logo-w:92px; }

      .game-logo{
        top:calc(10px + var(--safe-top));
        left:12px;
      }

      .stage{
        inset:calc(64px + var(--safe-top)) 0 calc(66px + var(--safe-bottom)) 0;
        padding:12px;
      }

      .back-btn,
      .reset-btn{
        height:38px;
        border-width:2px;
        border-radius:10px;
        font-size:15px;
        padding:0 14px;
      }
    }

    @media (max-height:520px) and (orientation:landscape){
      :root{ --bottom-space:calc(58px + var(--safe-bottom)); }

      .stage{
        inset:calc(54px + var(--safe-top)) 0 var(--bottom-space) 0;
      }

      .game-logo{
        width:clamp(78px, 8.8vw, 130px);
        top:calc(10px + var(--safe-top));
      }

      .fixed-controls{
        bottom:calc(8px + var(--safe-bottom));
      }

      .back-btn,
      .reset-btn{
        height:clamp(32px, 8vh, 42px);
        border-width:2px;
        border-radius:10px;
        font-size:clamp(14px, 3.3vh, 20px);
        box-shadow:0 3px 0 rgba(0,0,0,.18);
      }
    }
  </style>
</head>
<body>
  <main class="game-page theme-white" id="gamePage">
    <div class="theme-background"></div>
    <img class="game-logo" src="logo.PNG" alt="" onerror="this.style.display='none'">

    <section class="stage" id="stage">
      <div class="box-grid" id="boxGrid" aria-label="صناديق اللعبة"></div>
    </section>

    <footer class="fixed-controls">
      <button class="back-btn" id="backBtn" type="button">رجوع</button>
      <button class="reset-btn" id="resetBtn" type="button">إعادة</button>
    </footer>
  </main>

  <script>
    const DEMO_ITEMS = [
      { text:"القمر" },
      { text:"الشمس" },
      { text:"الرياض" },
      { text:"الماء" },
      { text:"الصلاة" },
      { text:"كتاب" },
      { text:"مدرسة" },
      { text:"نخلة" }
    ];

    const THEMES = [
      { id:"white", label:"خلفية بيضاء" },
      { id:"classroom", label:"فصل مدرسي" },
      { id:"sky-clouds", label:"سماء وغيوم" },
      { id:"forest", label:"غابة" },
      { id:"math", label:"رياضيات" },
      { id:"english", label:"انجليزي" },
      { id:"flowers", label:"ازهار وورود" },
      { id:"national-day", label:"اليوم الوطني" },
      { id:"founding-day", label:"يوم التأسيس" }
    ];

    const page = document.getElementById("gamePage");
    const stage = document.getElementById("stage");
    const grid = document.getElementById("boxGrid");
    const resetBtn = document.getElementById("resetBtn");
    const backBtn = document.getElementById("backBtn");

    let currentTheme = normalizeTheme(getUrlParam("theme") || getSavedTheme() || "white");
    let items = loadItems();
    let opened = new Set();

    function getUrlParam(name){
      try {
        return new URLSearchParams(window.location.search || "").get(name) || "";
      } catch (_) {
        return "";
      }
    }

    function getSavedTheme(){
      try {
        return sessionStorage.getItem("sandooq_edu_box_theme_v1") || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeTheme(value){
      const raw = String(value || "").trim().toLowerCase();
      const map = {
        "classic":"white",
        "original":"white",
        "خلفية بيضاء":"white",
        "ابيض":"white",
        "أبيض":"white",
        "white":"white",
        "classroom":"classroom",
        "فصل مدرسة":"classroom",
        "فصل مدرسي":"classroom",
        "sky-clouds":"sky-clouds",
        "سماء وغيوم":"sky-clouds",
        "forest":"forest",
        "غابة":"forest",
        "math":"math",
        "رياضيات":"math",
        "english":"english",
        "انجليزي":"english",
        "flowers":"flowers",
        "ازهار وورود":"flowers",
        "أزهار وورود":"flowers",
        "national-day":"national-day",
        "اليوم الوطني":"national-day",
        "founding-day":"founding-day",
        "يوم التأسيس":"founding-day"
      };
      if (map[raw]) return map[raw];
      return THEMES.some((theme)=> theme.id === raw) ? raw : "white";
    }

    function loadItems(){
      try {
        const raw =
          sessionStorage.getItem("sandooq_open_box_payload_v1") ||
          sessionStorage.getItem("sandooq_open_box_draft_v1") ||
          "";
        if (!raw) return DEMO_ITEMS;

        const payload = JSON.parse(raw);
        const source = Array.isArray(payload) ? payload : payload.entries || payload.items || [];
        const clean = source
          .map((entry)=> ({
            text: String(entry.text || entry.title || entry.answer || "").trim(),
            imageData: entry.imageData || entry.image || "",
            imageName: entry.imageName || ""
          }))
          .filter((entry)=> entry.text || entry.imageData || entry.imageName)
          .slice(0, 50);

        if (payload.theme) currentTheme = normalizeTheme(payload.theme);
        return clean.length ? clean : DEMO_ITEMS;
      } catch (_) {
        return DEMO_ITEMS;
      }
    }

    function applyTheme(themeId){
      currentTheme = normalizeTheme(themeId);
      page.className = `game-page theme-${currentTheme}`;
      try { sessionStorage.setItem("sandooq_edu_box_theme_v1", currentTheme); } catch (_) {}
    }

    function calculateLayout(count){
      const rect = stage.getBoundingClientRect();
      const width = Math.max(280, rect.width - 24);
      const height = Math.max(260, rect.height - 24);
      const ratio = width / height;
      let cols;

      if (count <= 4) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : count;
      } else if (count <= 8) {
        cols = window.matchMedia("(orientation: portrait)").matches ? 2 : 4;
      } else {
        cols = Math.ceil(Math.sqrt(count * ratio));
        cols = Math.max(3, Math.min(10, cols));
      }

      let rows = Math.ceil(count / cols);
      let gap = count > 30 ? 8 : count > 20 ? 10 : count > 12 ? 14 : 24;
      let size = Math.min(
        158,
        Math.floor((width - gap * (cols - 1)) / cols),
        Math.floor((height - gap * (rows - 1)) / rows)
      );

      const minSize = count > 40 ? 42 : count > 30 ? 48 : count > 20 ? 58 : 78;

      while (size < minSize && cols < 10) {
        cols += 1;
        rows = Math.ceil(count / cols);
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      if (size < minSize) {
        gap = Math.max(5, Math.floor(gap * .72));
        size = Math.min(
          158,
          Math.floor((width - gap * (cols - 1)) / cols),
          Math.floor((height - gap * (rows - 1)) / rows)
        );
      }

      return { cols, gap, size:Math.max(34, size) };
    }

    function applyLayout(){
      const layout = calculateLayout(items.length);
      grid.style.setProperty("--cols", String(layout.cols));
      grid.style.setProperty("--tile-gap", `${layout.gap}px`);
      grid.style.setProperty("--tile-size", `${layout.size}px`);
      document.documentElement.style.setProperty("--tile-gap", `${layout.gap}px`);
      document.documentElement.style.setProperty("--tile-size", `${layout.size}px`);
    }

    function renderBoxes(){
      applyLayout();
      grid.innerHTML = "";

      items.forEach((entry, index)=>{
        const button = document.createElement("button");
        button.type = "button";
        button.className = "box-card";
        const colorClasses = ["box-blue", "box-red", "box-orange", "box-green", "box-purple", "box-navy", "box-mint", "box-coral"];
        button.classList.add(colorClasses[index % colorClasses.length]);
        button.setAttribute("aria-label", `صندوق رقم ${index + 1}`);
        button.setAttribute("aria-pressed", "false");
        button.dataset.index = String(index);

        const wrap = document.createElement("span");
        wrap.className = "box-wrap";

        const realBox = document.createElement("span");
        realBox.className = "real-box";

        const well = document.createElement("span");
        well.className = "box-well";

        const content = document.createElement("span");
        content.className = "box-content";
        content.appendChild(createResultContent(entry));

        const lid = document.createElement("span");
        lid.className = "box-lid";

        const number = document.createElement("span");
        number.className = "box-number";
        number.textContent = String(index + 1);

        lid.appendChild(number);
        realBox.appendChild(well);
        realBox.appendChild(content);
        wrap.appendChild(realBox);
        wrap.appendChild(lid);
        button.appendChild(wrap);

        button.addEventListener("click", ()=>{
          openBox(button, index);
        });

        grid.appendChild(button);
      });
    }

    function createResultContent(entry){
      const hasImage = Boolean(entry.imageData || entry.imageName);
      const hasText = Boolean(entry.text);

      if (hasImage && hasText) {
        const wrap = document.createElement("span");
        wrap.className = "result-mixed";

        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        wrap.appendChild(img);

        const text = document.createElement("span");
        text.className = "result-text";
        text.textContent = entry.text;
        wrap.appendChild(text);

        return wrap;
      }

      if (hasImage) {
        const img = document.createElement("img");
        img.className = "result-image";
        img.alt = "";
        img.src = entry.imageData || entry.imageName;
        return img;
      }

      const text = document.createElement("span");
      text.className = "result-text";
      text.textContent = entry.text || "—";
      return text;
    }

    function openBox(button, index){
      if (opened.has(index)) return;
      opened.add(index);
      button.classList.add("opened");
      button.setAttribute("aria-pressed", "true");
    }

    function resetBoxes(){
      opened.clear();
      document.querySelectorAll(".box-card.opened").forEach((card)=>{
        card.classList.remove("opened");
        card.setAttribute("aria-pressed", "false");
      });
    }

    function goBack(){
      try {
        if (history.length > 1) {
          history.back();
          return;
        }
      } catch (_) {}
      window.location.href = "index.html";
    }

    resetBtn.addEventListener("click", resetBoxes);
    backBtn.addEventListener("click", goBack);

    window.addEventListener("resize", applyLayout, { passive:true });
    window.addEventListener("orientationchange", ()=>{
      window.setTimeout(applyLayout, 160);
    }, { passive:true });

    applyTheme(currentTheme);
    renderBoxes();
  </script>
</body>
</html>
